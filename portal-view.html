<!-- ═══════════════════════════════════════════════════════════════════════
     portal-view.html — **תצוגת הלקוח** של המבנה החדש (B+3.5).

     ⚠️ למה מסך נפרד ולא מצב-לקוח בתוך כלי-הייצור: החלטת-הבעלים (01/08/2026)
     הייתה "עדיף דף לקוח ייעודי שקורא רק portalFiles, ולא אותו כלי ייצור
     מלא". כלי הייצור (imposition-tool · customer-fold-preview) מכילים
     אימפוזיציה, העלאות ונתונים פנימיים; להסתיר אותם בקוד-תצוגה זו הגנה
     שנשענת על כך שלא שכחנו כפתור. כאן פשוט **אין** מה להסתיר.

     ⚠️ ה-portalId מגיע מה-claims בלבד. ‎?p=‎ הוא נוחות-ניווט לעובד, ולקוח
     שישנה אותו לא יראה פורטל אחר — הערך שלו נדרס מה-claims.

     ⚠️ מה המסך נוגע בו — הכל תחת organizations/{orgId}/ בלבד:
     portals/<pid> (שם) · portalProofs/<pid> (עבודות) · portalFiles/<pid>/…
     (קבצים). ותו לא. אין כאן cards, אין customerProofs, ואין שום צומת של
     בית-הדפוס. הנתיבים נבנים ב-portal-paths.js — מקור-אמת יחיד לשני המסכים.

     ⚠️ מותרת פעולה אחת שכותבת: העלאת PDF לפורטל של המשתמש עצמו. אין
     עריכה, אין מחיקה, אין דריסה (כל העלאה מקבלת proofId ושם ייחודיים),
     ואין פעולת-ייצור. ה-orgId וה-portalId מגיעים מה-claims בלבד.
     ═══════════════════════════════════════════════════════════════════════ -->
<script src="firebase-auth.bundle.js?v=1786985992"></script>

<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:'Heebo',system-ui,"Segoe UI",Arial,sans-serif;
       color:#1f2937;background:linear-gradient(180deg,#eef1f6 0%,#f5f6f9 100%);padding:20px}
  .wrap{max-width:680px;margin:0 auto}
  .top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .logo{width:46px;height:46px;border-radius:12px;background:#2d3561;color:#fff;display:flex;

  h1{font-size:1.12rem;margin:0;color:#2d3561}
  .sub{font-size:.8rem;color:#6b7280}
  .out{margin-inline-start:auto;background:none;border:0;color:#2d3561;font-family:inherit;

  .card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 8px 26px rgba(45,53,97,.1);margin-bottom:14px}
  h2{font-size:.95rem;margin:0 0 12px;color:#2d3561}
  .empty{text-align:center;color:#9099ab;padding:26px 10px;font-size:.9rem}
  .job{border:1.5px solid #e6e9f2;border-radius:11px;padding:12px;margin-bottom:9px}
  .job b{font-size:.92rem}

  .file:hover{background:#eef2ff}

  .gate{text-align:center;padding:44px 20px;color:#6b7280}
  .note{background:#fffbeb;border:1.5px solid #fde68a;color:#92400e;border-radius:10px;

  .hidden{display:none}
  label.fl{display:block;font-size:.82rem;font-weight:700;color:#374151;margin:0 0 5px}
  .in{width:100%;padding:10px 11px;border:1.5px solid #d1d5db;border-radius:10px;

  .btn{background:#2d3561;color:#fff;border:0;border-radius:10px;padding:11px 22px;
       font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer}
  .btn:disabled{opacity:.55;cursor:default}
  .row{margin-bottom:12px}
  .msg{margin-top:11px;font-size:.85rem;font-weight:700;border-radius:10px;padding:10px 12px}
  .msg.ok{background:#ecfdf5;border:1.5px solid #a7f3d0;color:#15803d}
  .msg.err{background:#fef2f2;border:1.5px solid #fecaca;color:#b91c1c}

<body>
<div class="wrap">
  <div class="top">
    <div class="logo">📂</div>
    <div>
      <h1 id="pname">הקבצים שלי</h1>
      <div class="sub" id="who"></div>
    </div>
    <button class="out hidden" id="out">יציאה</button>
  </div>

  <div id="gate" class="card gate">טוען…</div>

  <div id="app" class="hidden">
    <div class="card hidden" id="upCard">
      <h2>⬆️ העלאת קבצים לעבודה חדשה</h2>
      <div class="row">
        <label class="fl" for="up-title">שם העבודה</label>

               placeholder="לדוגמה: עלון פסח 2026" autocomplete="off">
      </div>
      <div class="row">
        <label class="fl" for="up-files">קובצי PDF</label>
        <input class="in" type="file" id="up-files" accept="application/pdf,.pdf" multiple>

    </div>
  </div>
</div>

<script>
var FB_CONFIG = {
  apiKey: 'AIzaSyAFp99furP4L5hqTI-horBHmGZC9s13dGg',
  authDomain: 'solan-printing.firebaseapp.com',
  projectId: 'solan-printing',
  databaseURL: 'https://solan-printing-default-rtdb.europe-west1.firebasedatabase.app',
};
var DB = FB_CONFIG.databaseURL;
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' })[c]; }); };

/* ⚠️ כל האתחול בתוך boot(): רישום onAuthStateChanged לפני ש-init() רץ נכשל
   בשקט והמסך נתקע על "טוען". נתפס בפיילוט. */
var _BAKED = '1786985992';
AuthClient.guardVersion(_BAKED).then(function(reloading){ if (!reloading) boot(); });

var MY_PID = null, MY_ORG = null, MY_UID = null;

/* ⚠️ הנתיבים היחידים שהמסך הזה יודע לבנות — כולם ארגוניים, וכולם דרך
   PortalPaths (מקור-אמת יחיד עם portal.html). PortalPaths.db זורק על
   כל צומת שאינו portals/portalProofs ועל מזהה בפורמט שגוי. */
function myPath(kind, rest) {
  if (!MY_ORG || !MY_PID) throw new Error('אין פורטל');
  return PortalPaths.db(MY_ORG, kind, MY_PID, rest);
}

var BUCKET = 'solan-printing.firebasestorage.app';

/* פתיחת קובץ בבקשה מאומתת.
   ⚠️ אין כאן ‎?token=‎ ואין כתובת-שיתוף: הקובץ נמשך עם ה-ID Token, נפתח
   כ-blob מקומי, וה-blob נמחק אחרי דקה. מי שיעתיק את הכתובת שנפתחה יקבל
   כתובת מקומית חסרת-משמעות אצל כל אחד אחר.
   ⚠️ הטוקן נמשך מחדש בכל פתיחה — לא נשמר בזיכרון המסך. */
window._openFile = async function(btn){
  var path = btn.dataset.path || '';
  /* ⚠️ שער-שייכות: רק נתיב שנמצא תחת הארגון **וגם** הפורטל שב-claims
     נפתח. נתיב של פורטל אחר, נתיב legacy או נתיב עם ".." — לא ייפתח. */
  if (!PortalPaths.ownsPath(MY_ORG, MY_PID, path)) return;
  var old = btn.textContent;
  btn.disabled = true; btn.textContent = 'פותח…';
  try {
    var tok = await SolanAuth.idToken(false);
    var r = await fetch('https://firebasestorage.googleapis.com/v0/b/' + BUCKET +
                        '/o/' + encodeURIComponent(path) + '?alt=media',
                        { headers: { 'Authorization': 'Firebase ' + tok } });
    if (!r.ok) throw new Error(r.status === 403 ? 'אין הרשאה לקובץ הזה' : 'שגיאה ' + r.status);
    var url = URL.createObjectURL(await r.blob());
    window.open(url, '_blank');
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
    btn.textContent = old;
  } catch (e) {
    btn.textContent = '✗ ' + (e.message || 'שגיאה');
    setTimeout(function(){ btn.textContent = old; }, 4000);
  }
  btn.disabled = false;
};

async function dbGet(path, tok) {
  var r = await fetch(DB + '/' + path + '.json?auth=' + encodeURIComponent(tok));
  return r.ok ? await r.json() : null;
}

function boot(){
SolanAuth.init(FB_CONFIG);
SolanAuth.onAuthStateChanged(async function(user){
  if (!user) { location.replace(AuthClient.loginUrlFor('portal-view.html', location.origin)); return; }

  /* ⚠️ הסיבה שהעלאות נכשלו: אימות-מייל והוספת claim **אינם** מרעננים
     טוקן קיים — הוא נשאר תקף עד שעה. לקוח שאישר מייל וחזר למסך המשיך
     לשלוח email_verified:false, המסך הציג לו טופס העלאה, והשרת דחה.
     reload() מושך את מצב המשתמש מהשרת, ו-claims(true) מכריח טוקן חדש.
     שניהם לפני כל החלטה שנשענת עליהם. */
  try { await SolanAuth.reload(); } catch (e) {}
  var claims = await SolanAuth.claims(true).catch(function(){ return {}; });

  /* ⚠️ אימות-מייל: ההזמנה מוכיחה שמישהו קיבל את הקישור, לא שהוא בעל
     התיבה. מסך-האימות עצמו יושב ב-portal.html — לא משכפלים אותו כאן.
     ⚠️ נבדק מה-claim ולא מ-user.emailVerified: ה-claim הוא בדיוק מה
     שחוקי ה-RTDB בודקים, ורק הוא מעיד מה השרת יראה. */
  if (claims.accountType === 'customer' && claims.email_verified !== true) {
    location.replace('portal.html');
    return;
  }

  /* ⚠️ מקור ה-portalId: ה-claims. לעובד מותר לצפות בפורטל מסוים לצורך
     תמיכה, ורק לו ‎?p=‎ אומר משהו. */
  if (claims.accountType === 'customer' && claims.portalId) {
    MY_PID = claims.portalId;
  } else if (claims.accountType === 'staff' && claims.staffId) {
    var m = /[?&]p=(pid_[0-9a-f]{32})/.exec(location.search);
    if (!m) { $('gate').textContent = 'לצפייה בפורטל מסוים הוסיפו ?p=pid_… לכתובת.'; return; }
    MY_PID = m[1];
  } else {
    $('gate').textContent = 'החשבון עדיין לא שויך לפורטל. פנו לבית הדפוס.';
    return;
  }

  /* ⚠️ ה-orgId מגיע מה-claims בלבד — גם לעובד. בלעדיו אין נתיב, ועדיף
     לומר זאת מפורשות מאשר לבנות נתיב שגוי. */
  MY_ORG = claims.orgId || null;
  MY_UID = user.uid || null;
  if (!PortalPaths.ORG_RE.test(String(MY_ORG || ''))) {
    $('gate').textContent = 'החשבון עדיין לא שויך לעסק. פנו לבית הדפוס.';
    $('gate').classList.remove('hidden');
    return;
  }

  var tok = await SolanAuth.idToken(false);
  $('who').textContent = user.email || '';
  $('out').classList.remove('hidden');
  $('gate').classList.add('hidden');
  $('app').classList.remove('hidden');

  var p = await dbGet(myPath('portals'), tok);
  if (p && p.name) $('pname').textContent = p.name;

  /* ⚠️ אזור ההעלאה — ללקוח בלבד. חוקי ה-RTDB וה-Storage מתירים כתיבה
     רק ללקוח של הפורטל (ולמנהל), ולכן טופס שמוצג ל-office היה נכשל
     אחרי לחיצה. עדיף שלא יופיע כלל מאשר כפתור שמבטיח ולא מקיים. */
  if (claims.accountType === 'customer') {
    /* ⚠️ טופס העלאה שהשרת ידחה הוא הבטחה שלא תקוים. בודקים כאן **בדיוק**
       את מה שחוק ה-.write דורש, ואם משהו חסר — מציגים מה חסר במקום
       כפתור. הבדיקה היא נוחות: הגבול האמיתי נשאר החוק. */
    var missing = uploadBlockers(claims);
    if (missing.length) {
      $('upCard').innerHTML =
        '<h2>⬆️ העלאת קבצים</h2>' +
        '<div class="note">לא ניתן להעלות קבצים כרגע:<ul style="margin:6px 0 0;' +
        'padding-inline-start:20px">' +
        missing.map(function(m){ return '<li>' + esc(m) + '</li>'; }).join('') +
        '</ul></div>';
      $('upCard').classList.remove('hidden');
    } else {
      $('upCard').classList.remove('hidden');
      wireUpload();
    }
  } else {
    $('upCard').remove();
  }
  await loadJobs();
});

/* ⚠️ אותם חמישה תנאים בדיוק שחוק ה-.write של portalProofs/$pid/$proofId
   דורש מלקוח. אם תשתנה שם דרישה — היא חייבת להשתנות גם כאן, אחרת נחזור
   בדיוק לבאג הזה: מסך שמבטיח מה שהשרת לא מקיים. */
function uploadBlockers(claims){
  var c = claims || {}, out = [];
  if (c.email_verified !== true) out.push('כתובת המייל עדיין לא אומתה. פתחו את מייל האימות ולחצו על הקישור.');
  if (!PortalPaths.ORG_RE.test(String(c.orgId || ''))) out.push('החשבון עדיין לא שויך לעסק. פנו לבית הדפוס.');
  if (!PortalPaths.PID_RE.test(String(c.portalId || ''))) out.push('החשבון עדיין לא שויך לפורטל. פנו לבית הדפוס.');
  if (((c.firebase || {}).sign_in_provider) !== 'password') out.push('יש להתחבר עם מייל וסיסמה.');
  return out;
}

/* טעינת העבודות — פונקציה נפרדת כדי שנוכל לרענן אחרי העלאה בלי רענון-דף. */
async function loadJobs(){
  var tok = await SolanAuth.idToken(false);
  var jobs = await dbGet(myPath('portalProofs'), tok) || {};
  var ids = Object.keys(jobs);
  if (!ids.length) return;

  $('jobs').innerHTML = ids.map(function(id){
    var x = jobs[id] || {};
    /* ⚠️ מוצגים שדות-לקוח בלבד. שדות פנימיים (מכונה · לוחות · עלות ·
       הערות-ייצור) אינם נקראים כאן, גם אם הם קיימים ברשומה. */
    var files = (x.files && typeof x.files === 'object') ? x.files : {};
    var links = Object.keys(files).map(function(fid){
      var f = files[fid] || {};
      /* ⚠️ נשמר **נתיב** ולא כתובת-הורדה. כתובת עם ‎token=‎ היא סוד נייד:
         מי שמקבל אותה נכנס בלי זהות, וזה בדיוק מה שהמבנה החדש בא לבטל.
         הקובץ נמשך בבקשה מאומתת (Authorization), ורק אז נפתח. */
      var p = String(f.path || '');
      if (!PortalPaths.ownsPath(MY_ORG, MY_PID, p)) return '';
      return '<button class="file" onclick="_openFile(this)" data-path="' + esc(p) + '">📄 ' +
             esc(f.name || 'קובץ') + '</button>';
    }).join('');
    return '<div class="job"><b>' + esc(x.title || 'עבודה') + '</b>' +
           '<div class="meta">' + esc(x.status || '') +
           (x.updatedAt ? ' · ' + new Date(x.updatedAt).toLocaleDateString('he-IL') : '') + '</div>' +
           (links ? '<div class="files">' + links + '</div>' : '') + '</div>';
  }).join('');
}

/* ═══════════ העלאת קבצים ═══════════════════════════════════════════════
   ⚠️ הכתיבה היחידה במסך. שלושה כללים שאסור לשבור:

   1. orgId ו-portalId מגיעים מ-MY_ORG/MY_PID, שנקבעו מה-claims. שם-העבודה
      הוא הקלט היחיד מהמשתמש, והוא נכנס לשדה title — לא לנתיב.
   2. אין overwrite: כל שליחה מקבלת proofId חדש, וכל קובץ שם ייחודי.
      חוקי ה-Storage מתירים create בלבד (resource == null) ואוכפים זאת.
   3. אין "הצלחה" אם בקשה כלשהי נכשלה. כל תשובת HTTP נבדקת ב-r.ok,
      והסטטוס משקף את המציאות: received / partial / upload_failed.
      זו בדיוק תבנית הכשל-השקט שכבר עלתה לנו — לא חוזרים עליה. */
function upMsg(kind, text){
  var el = $('up-msg');
  el.className = 'msg ' + kind;
  el.textContent = text;
  el.classList.remove('hidden');
}

/* ⚠️ עד 02/08/2026 הפונקציה החזירה r.ok בלבד, והכשל האמיתי נזרק:
   ההעלאה נכשלה ולא היה שום מידע למה. עכשיו מוחזרים גם הסטטוס וגם גוף
   התשובה של Firebase, ושניהם נשמרים לאבחון.

   ⚠️ מה **לא** נשמר: הטוקן. הוא יושב במחרוזת-השאילתה של ה-URL, ולכן
   נשמר path בלבד ולעולם לא ה-URL המלא. סוד בלוג הוא סוד שדלף. */
var _lastFail = null;

async function dbPut(path, tok, value){
  var r, body = '';
  try {
    r = await fetch(DB + '/' + path + '.json?auth=' + encodeURIComponent(tok), {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(value)
    });
  } catch (e) {
    _lastFail = { path: path, status: 0, body: 'network' };
    return { ok: false, status: 0, body: 'network' };
  }
  if (!r.ok) {
    try { body = (await r.text() || '').slice(0, 300); } catch (e) {}
    _lastFail = { path: path, status: r.status, body: body };
  }
  return { ok: r.ok, status: r.status, body: body };
}

/* הודעה ידידותית לפי הסטטוס — ולא "ההעלאה נכשלה" על הכול.
   ⚠️ 401 מ-RTDB על דחיית-חוקים אינו "תקלה": הוא אומר שהטוקן אינו נושא
   את מה שהחוק דורש. זה מידע שימושי, ולכן הוא נאמר. */
function putErrText(res){
  if (!res) return 'הפעולה נכשלה.';
  if (res.status === 0)   return 'אין חיבור לרשת. בדקו את החיבור ונסו שוב.';
  if (res.status === 401) return 'אין הרשאה לשמור בפורטל הזה. התנתקו והתחברו מחדש, ואם זה חוזר — פנו לבית הדפוס.';
  if (res.status === 403) return 'הפעולה נדחתה. פנו לבית הדפוס.';
  return 'שמירה נכשלה (שגיאה ' + res.status + '). נסו שוב.';
}

/* שורת-אבחון מסוננת, לתמיכה. בלי טוקן ובלי URL מלא. */
function failDetail(){
  if (!_lastFail) return '';
  return 'פרטים לתמיכה: ' + _lastFail.status + ' · ' + _lastFail.path;
}

/* העלאה ל-Storage בבקשה מאומתת. אין token= ואין כתובת-שיתוף — נשמר נתיב
   בלבד, והפתיחה נעשית מאוחר יותר עם Authorization. */
async function storagePut(path, tok, file){
  var url = 'https://firebasestorage.googleapis.com/v0/b/' + BUCKET +
            '/o?uploadType=media&name=' + encodeURIComponent(path);
  var r = await fetch(url, {
    method: 'POST',
    headers: { 'Authorization': 'Firebase ' + tok, 'Content-Type': 'application/pdf' },
    body: file
  });
  return { ok: r.ok, status: r.status };
}

var _uploading = false;

async function doUpload(){
  if (_uploading) return;
  var title = String(($('up-title').value || '')).trim();
  var files = Array.prototype.slice.call($('up-files').files || []);

  if (!title)        { upMsg('err', 'צריך להזין שם עבודה.'); return; }
  if (!files.length) { upMsg('err', 'לא נבחר אף קובץ.'); return; }

  /* ⚠️ פסילה לפני כל בקשת-רשת: קובץ שאינו PDF לא יוצא מהדפדפן בכלל. */
  var bad = files.filter(function(f){ return !PortalPaths.isPdf(f); });
  if (bad.length) {
    upMsg('err', 'קובצי PDF בלבד. נדחו: ' + bad.map(function(f){ return f.name; }).join(', '));
    return;
  }
  var MAX = 200 * 1024 * 1024;
  var big = files.filter(function(f){ return f.size >= MAX; });
  if (big.length) {
    upMsg('err', 'קובץ גדול מ-200MB: ' + big.map(function(f){ return f.name; }).join(', '));
    return;
  }

  _uploading = true;
  $('up-btn').disabled = true;

  var proofId = PortalPaths.newProofId();
  var base    = myPath('portalProofs', proofId);
  var now     = Date.now();
  var okCount = 0, failed = [];

  try {
    /* ⚠️ טוקן טרי גם כאן: המסך יכול לעמוד פתוח שעה, וטוקן שפג הוא
       בדיוק אותו כשל שוב. force=true. */
    var tok = await SolanAuth.idToken(true);

    /* רשומת-עבודה במצב uploading — נוצרת לפני הקבצים, כדי שגם כשל באמצע
       ישאיר עקבות ולא ייעלם בשקט. */
    upMsg('work', 'יוצר עבודה…');
    /* ⚠️ uploadedByUid — הבעלות על הרשומה. חוקי ה-RTDB משווים אותו
       ל-auth.uid ביצירה ונועלים אותו אחריה, ולכן הערך שנשלח מכאן אינו
       "נאמן": שליחת uid של מישהו אחר פשוט תידחה. הוא נשלח כדי שהכלל
       יוכל לזהות מי יוצר הרשומה — לא כדי לקבוע זאת. */
    if (!MY_UID) { upMsg('err', 'ההתחברות פגה. רעננו את הדף ונסו שוב.'); return; }
    var mk = await dbPut(base, tok, {
      title: title, status: 'uploading', createdAt: now, updatedAt: now,
      uploadedByUid: MY_UID
    });
    if (!mk.ok) {
      /* ⚠️ הסיבה נאמרת, ולא "נכשל". זה בדיוק המידע שחסר באבחון הקודם. */
      upMsg('err', putErrText(mk) + ' ' + failDetail());
      return;
    }

    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      upMsg('work', 'מעלה קובץ ' + (i + 1) + ' מתוך ' + files.length + '…');
      var safeName = PortalPaths.uniqueFileName(f.name, i);
      var fullPath = PortalPaths.filePath(MY_ORG, MY_PID, proofId, safeName);

      var up = await storagePut(fullPath, tok, f);
      if (!up.ok) { failed.push(f.name + ' (' + up.status + ')'); continue; }

      /* רשומת-הקובץ נכתבת רק אחרי שההעלאה הצליחה בפועל. */
      var fid  = 'f' + (i + 1) + '_' + String(now).slice(-6);
      var meta = {
        name: PortalPaths.sanitizeFileName(f.name),
        path: fullPath,
        size: f.size,
        contentType: 'application/pdf',
        uploadedAt: Date.now()
      };
      var fm = await dbPut(base + '/files/' + fid, tok, meta);
      if (!fm.ok) {
        failed.push(f.name + ' (רישום נכשל · ' + fm.status + ')');
        continue;
      }
      okCount++;
    }

    var status = okCount === files.length ? 'received'
               : okCount > 0             ? 'partial'
               :                           'upload_failed';
    /* ⚠️ גם כתיבות-הסיום הן בקשות HTTP שיכולות להיכשל. עד עכשיו התוצאה
       שלהן נזרקה, והמסך היה מציג "נשלח" גם כשהסטטוס נשאר uploading —
       בדיוק תבנית הכשל-השקט. הקבצים שכבר עלו נשארים במקומם: מחיקה
       אינה אפשרית ללקוח, וגם לא רצויה — עדיף קבצים עם רישום חלקי
       מאשר קבצים שנעלמו. */
    /* ⚠️ הסדר מחייב: updatedAt נכתב **לפני** הסטטוס הסופי. החוק מתיר
       ללקוח לגעת ב-updatedAt רק כל עוד הרשומה ב-uploading, ולכן כתיבה
       בסדר ההפוך הייתה ננעלת על עצמה ונכשלת תמיד. */
    var upOk = (await dbPut(base + '/updatedAt', tok, Date.now())).ok;
    var stOk = upOk && (await dbPut(base + '/status', tok, status)).ok;
    if (!stOk || !upOk) {
      upMsg('err', 'הקבצים עלו (' + okCount + ' מתוך ' + files.length +
                   '), אבל רישום הסיום נכשל. פנו לבית הדפוס וציינו: ' + proofId);
      await loadJobs();
      return;
    }

    if (status === 'received') {
      upMsg('ok', '✓ נשלח לבית הדפוס — ' + okCount + ' קבצים.');
      $('up-title').value = ''; $('up-files').value = '';
    } else if (status === 'partial') {
      upMsg('err', 'חלק מהקבצים לא עלו (' + okCount + ' מתוך ' + files.length +
                   '). נכשלו: ' + failed.join(', '));
    } else {
      upMsg('err', 'ההעלאה נכשלה. ' + failed.join(', '));
    }
    await loadJobs();
  } catch (e) {
    /* ⚠️ גם חריגה היא כישלון מוצג. אין מסלול שבו המשתמש רואה הצלחה
       בזמן שמשהו נפל. */
    upMsg('err', 'ההעלאה נכשלה: ' + (e && e.message ? e.message : 'שגיאה'));
  } finally {
    _uploading = false;
    $('up-btn').disabled = false;
  }
}

function wireUpload(){
  var b = $('up-btn');
  if (b && !b._wired) { b._wired = true; b.addEventListener('click', doUpload); }
}

$('out').addEventListener('click', async function(){
  await SolanAuth.signOut().catch(function(){});
  location.replace('login.html');
});
}   /* boot() */
</script>
</body>
</html>
