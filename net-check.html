<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בדיקת חיבור — סולן הדפסות</title>
<style>
  :root{ --press:#2d3561; --line:#e2e8f0; }
  *{box-sizing:border-box}
  body{margin:0;font-family:Heebo,Arial,sans-serif;background:#f1f3f8;color:#1e293b;
       min-height:100vh;padding:18px}
  .card{max-width:640px;margin:0 auto;background:#fff;border-radius:14px;
        box-shadow:0 6px 24px rgba(45,53,97,.12);overflow:hidden}
  .hd{background:var(--press);color:#fff;padding:18px 20px}
  .hd h1{margin:0;font-size:1.15rem}
  .hd p{margin:5px 0 0;font-size:.85rem;opacity:.85}
  .bd{padding:16px 20px}
  .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .st{width:22px;text-align:center;font-size:1rem;flex-shrink:0}
  .nm{flex:1;min-width:0}
  .nm b{display:block;font-size:.9rem}
  .nm span{display:block;font-size:.72rem;color:#64748b;word-break:break-all}
  .tag{font-size:.68rem;padding:2px 7px;border-radius:20px;background:#f1f5f9;color:#64748b;flex-shrink:0}
  .tag.ess{background:#fee2e2;color:#991b1b}
  .sum{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:.88rem;line-height:1.6}
  .sum.ok{background:#dcfce7;color:#166534}
  .sum.bad{background:#fee2e2;color:#991b1b}
  textarea{width:100%;margin-top:10px;padding:10px;border:1.5px solid var(--line);
           border-radius:9px;font-family:inherit;font-size:.8rem;line-height:1.6;min-height:190px}
  .btn{display:inline-block;margin-top:9px;background:var(--press);color:#fff;border:none;
       border-radius:9px;padding:11px 18px;font-family:inherit;font-size:.9rem;cursor:pointer}
  .btn.sec{background:#fff;color:var(--press);border:1.5px solid var(--press)}
</style>
</head>
<body>
<div class="card">
  <div class="hd">
    <h1>🔌 בדיקת חיבור</h1>
    <p>בודקת אילו כתובות חסומות ברשת שלכם — ומכינה בקשת-אישור מוכנה לשליחה.</p>
  </div>
  <div class="bd">
    <div id="rows"></div>
    <div id="sum" class="sum" style="display:none"></div>
    <div id="req" style="display:none">
      <div style="margin-top:14px;font-weight:800;font-size:.9rem">בקשה לשליחה לספק הסינון</div>
      <textarea id="txt" readonly></textarea>
      <button class="btn" id="cp">📋 העתק</button>
      <a class="btn sec" id="wa" target="_blank" rel="noopener">שלח לבית הדפוס</a>
    </div>
  </div>
</div>

<script src="net-check.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var results = {};

  /* ⚠️ **‏mode:'no-cors' בכוונה.** אנחנו לא צריכים לקרוא את התשובה —
     רק לדעת אם הבקשה **יצאה והגיעה**. תשובה אטומה = הדומיין נגיש;
     זריקה = חסום או אין רשת. בדיקה שמנסה לקרוא תוכן הייתה נכשלת גם
     על דומיינים נגישים לגמרי בגלל CORS, ומדווחת חסימה שאינה קיימת. */
  function probe(h){
    return new Promise(function(res){
      var done = false;
      var finish = function(v){ if (!done) { done = true; res(v); } };
      /* ⚠️ פסק-זמן: מסננים מסוימים משהים את הבקשה במקום לדחות אותה,
         ובלי תקרה הבדיקה הייתה תלויה לנצח על המסך. */
      setTimeout(function(){ finish(false); }, 8000);
      fetch(h.url, { mode: 'no-cors', cache: 'no-store' })
        .then(function(){ finish(true); })
        .catch(function(){ finish(false); });
    });
  }

  function rowHtml(h, state){
    var st = state === true ? '<span style="color:#16a34a">✓</span>'
           : state === false ? '<span style="color:#dc2626">✕</span>'
           : '<span style="color:#94a3b8">…</span>';
    return '<div class="row"><div class="st">' + st + '</div>'
      + '<div class="nm"><b>' + h.what + '</b><span>' + h.host + '</span></div>'
      + '<div class="tag' + (h.essential ? ' ess' : '') + '">'
      + (h.essential ? 'חיוני' : 'לא חיוני') + '</div></div>';
  }

  function render(){
    $('rows').innerHTML = NetCheck.HOSTS.map(function(h){
      return rowHtml(h, results[h.host]);
    }).join('');
  }

  function finishAll(){
    var sum = NetCheck.summarize(results);
    var el = $('sum');
    el.style.display = 'block';
    if (sum.ok) {
      el.className = 'sum ok';
      el.textContent = '✓ כל הכתובות הנדרשות נגישות. אם עדיין יש בעיה — היא אינה ברשת, '
                     + 'ושווה להתקשר לבית הדפוס.';
      return;
    }
    el.className = 'sum bad';
    el.innerHTML = '⛔ נחסמו <b>' + sum.blockedEssential.length + '</b> כתובות שנדרשות להצגת העיתון.'
      + '<div style="margin-top:6px;font-size:.82rem">'
      + 'זו הסיבה שהעיתון אינו נפתח. שלחו את הבקשה שלמטה לספק הסינון שלכם — '
      + 'האישור הוא חד-פעמי ויפתור את זה לתמיד.</div>';
    /* ⚠️ הנוסח נבנה במודול הבדוק ולא כאן: טקסט שנכתב בדף אינו נבדק,
       ובקשה שגויה לספק הסינון עולה ללקוח עוד סבב-המתנה. */
    var txt = NetCheck.requestText(sum, '');
    $('txt').value = txt;
    $('req').style.display = 'block';
    $('wa').href = 'https://wa.me/972543343735?text=' + encodeURIComponent(txt);
  }

  $('cp').onclick = function(){
    var ta = $('txt');
    ta.select();
    try { document.execCommand('copy'); this.textContent = '✓ הועתק'; }
    catch(e){ this.textContent = 'סמנו והעתיקו ידנית'; }
  };

  render();
  /* בזה אחר זה ולא במקביל: מסנן שמקבל שמונה בקשות בבת-אחת עלול
     לחסום את כולן ולהחזיר תמונה שגויה. */
  (function next(i){
    if (i >= NetCheck.HOSTS.length) { finishAll(); return; }
    var h = NetCheck.HOSTS[i];
    probe(h).then(function(okv){
      results[h.host] = okv;
      render();
      next(i + 1);
    });
  })(0);
})();
</script>
</body>
</html>
