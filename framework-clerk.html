<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>משרד — הזמנות ותעודות משלוח | סולן הדפסות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>try{ if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }catch(e){}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="framework-orders.js"></script>
<script src="framework-file-reader.js"></script>
<script src="solan-order-ai.js"></script>
<script src="idit-sites.js"></script>
<style>
  :root{--press:#2d3561;--gold:#c9a84c;--gold-light:#e8d5a3;--line:#d0c8b8;--danger:#c62828;
        --ok:#16a34a;--warn:#f59e0b;--bg:#e8e4dc;--card:#fff;--ink:#1a1a2e;--muted:#6b7280}
  *{box-sizing:border-box}
  body{font-family:'Heebo',Arial,sans-serif;background:var(--bg);
    background-image:repeating-linear-gradient(0deg,transparent,transparent 28px,rgba(0,0,0,.04) 28px,rgba(0,0,0,.04) 29px);
    color:var(--ink);margin:0;padding:16px;direction:rtl;min-height:100vh}
  h3{margin:0 0 8px;color:var(--press);font-weight:800}
  .brand{background:var(--press);color:#fff;padding:11px 20px;border-radius:12px;margin-bottom:14px;display:flex;
    align-items:center;gap:10px;box-shadow:0 3px 12px rgba(0,0,0,.25);flex-wrap:wrap}
  .brand b{font-size:1.2rem;font-weight:900} .brand span.g{color:var(--gold)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
  button{background:#fff;color:var(--press);border:1.5px solid var(--line);border-radius:7px;padding:8px 14px;cursor:pointer;
    font-family:inherit;font-size:.9rem;font-weight:700;transition:all .15s}
  button:hover:not(:disabled){border-color:var(--gold)} button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--gold);border-color:var(--gold);color:#1a1a2e;font-weight:800}
  button.danger{color:var(--danger)}
  input,select,textarea{background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:7px;padding:8px 10px;font-family:inherit;font-size:.9rem}
  .muted{color:var(--muted);font-size:.86rem} .ok{color:#15803d;font-weight:700} .bad{color:var(--danger);font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:.88rem}
  th{background:#faf8f2;color:var(--press);text-align:right;padding:7px 9px;border-bottom:2px solid var(--line);font-weight:800}
  td{padding:7px 9px;border-bottom:1px solid #eee;vertical-align:top}
  .wrap{display:flex;gap:14px;align-items:flex-start}
  .side{flex:0 0 235px;max-width:235px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;
    position:sticky;top:8px;max-height:calc(100vh - 40px);overflow-y:auto}
  .sideT{padding:9px 12px;background:var(--press);color:#fff;font-weight:800;font-size:.86rem}
  .cItem{display:flex;justify-content:space-between;gap:8px;padding:11px 12px;cursor:pointer;border-bottom:1px solid #eee;
    font-weight:700;color:var(--press);font-size:.9rem}
  .cItem:hover{background:#faf8f2} .cItem.on{background:var(--press);color:#fff}
  .cItem.grp{background:#faf8f2;font-size:.88rem}
  .cItem.grp.on,.cItem.sub.on{background:var(--press);color:#fff}
  .cItem.sub{padding-inline-start:26px;font-weight:600;font-size:.86rem}
  .cItem.sub::before{content:"🏢 ";opacity:.6}
  .cItem .b{background:var(--warn);color:#fff;border-radius:10px;padding:1px 8px;font-size:.72rem;font-weight:800}
  .main{flex:1;min-width:0}
  .pill{font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:10px;white-space:nowrap;color:#fff}
  .stat{display:inline-block;background:#faf8f2;border:1px solid var(--line);border-radius:9px;padding:6px 12px;margin:0 0 6px 6px}
  .stat b{font-size:1.15rem;display:block;color:var(--press)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tab{background:#fff;border:1.5px solid var(--line);border-radius:9px 9px 0 0;padding:9px 16px;cursor:pointer;font-weight:800;color:var(--press)}
  .tab.on{background:var(--press);color:#fff;border-color:var(--press)}
  .tab .n{background:var(--warn);color:#fff;border-radius:9px;padding:0 7px;font-size:.72rem;margin-inline-start:5px}
  .ready{border-inline-start:5px solid var(--ok);background:#f0fdf4}
  /* ── לוח זרימת עבודות ── */
  .flow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
  .fCol{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)}
  .fHead{color:#fff;font-weight:800;padding:9px 12px;font-size:.9rem;display:flex;justify-content:space-between;align-items:center}
  .fN{background:rgba(255,255,255,.28);border-radius:10px;padding:0 9px;font-size:.8rem}
  .fHint{padding:6px 12px;background:#faf8f2;color:var(--muted);font-size:.76rem;border-bottom:1px solid var(--line)}
  .fBody{padding:9px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 250px);overflow-y:auto}
  .fCard{border:1px solid var(--line);border-inline-start:5px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff}
  .fCard:hover{border-color:var(--gold)}
  @media(max-width:1200px){.flow{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:760px){.flow{grid-template-columns:1fr}.fBody{max-height:none}}
  /* ── גרירת קובץ למסך ── */
  #dropZone{display:none;position:fixed;inset:0;z-index:400;background:rgba(45,53,97,.92);color:#fff;
    align-items:center;justify-content:center;text-align:center;font-size:1.5rem;font-weight:800;
    border:6px dashed var(--gold);pointer-events:none}
  #dropZone.on{display:flex}
  /* מצב "עובד על הקובץ" — בלי מסגרת מקווקוות, עם פס התקדמות */
  #dropZone.busy{border-style:solid;border-color:var(--gold);cursor:progress}
  @keyframes dzSlide{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
  .modal{position:fixed;inset:0;z-index:320;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;padding:14px}
  .modalIn{background:#fff;border-radius:14px;max-width:940px;width:97vw;max-height:92vh;overflow:auto;padding:16px 18px}
  /* ── תעודת משלוח להדפסה ── */
  #dnPrint{display:none}
  @media print{
    body{background:#fff;padding:0;background-image:none}
    body>*{display:none !important}
    #dnPrint{display:block !important;padding:14mm 12mm;font-size:12pt}
    #dnPrint table{font-size:11pt} #dnPrint .noprint{display:none}
  }
  .dnHead{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #2d3561;padding-bottom:8px;margin-bottom:12px}
  .dnBox{border:1px solid #999;border-radius:6px;padding:8px 12px;font-size:.9em}
  @media(max-width:760px){.wrap{flex-direction:column}.side{flex:auto;max-width:none;width:100%;position:static;max-height:200px}}
</style>
</head>
<body>
<div class="brand">
  <b>סולן <span class="g">הדפסות</span></b>
  <span style="color:var(--gold-light);font-size:.85rem">· משרד — הזמנות לקוחות ותעודות משלוח</span>
  <span style="margin-right:auto"></span>
  <span id="whoami" class="muted" style="color:var(--gold-light)"></span>
  <button id="manBtn">➕ הזמנה חדשה</button>
  <button id="impBtn" class="primary">📥 קליטת הזמנה מקובץ</button>
  <input type="file" id="impFile" accept=".pdf,.xlsx,.xls,.docx,.csv,.txt" style="display:none">
  <button id="reloadBtn">🔄 רענן</button>
</div>
<div id="app"><div class="card muted">טוען…</div></div>
<div id="dnPrint"></div>
<div id="dropZone"><div>
  <div id="dzIcon" style="font-size:3rem">📥</div>
  <div id="dzTitle">שחררו כאן את קובץ ההזמנה</div>
  <div id="dzSub" class="muted" style="color:#e8d5a3;font-weight:400">PDF ותמונות → ניתוח AI · Excel · Word · CSV</div>
  <div id="dzBar" style="display:none;width:260px;height:6px;border-radius:4px;background:rgba(255,255,255,.25);margin:14px auto 0;overflow:hidden">
    <i style="display:block;height:100%;width:40%;background:var(--gold);animation:dzSlide 1.1s ease-in-out infinite"></i></div>
</div></div>

<script>
const $ = id => document.getElementById(id);
const FW = window.FrameworkOrders;
const _FBURL = 'https://solan-printing-default-rtdb.europe-west1.firebasedatabase.app';
const _APIKEY = 'AIzaSyAFp99furP4L5hqTI-horBHmGZC9s13dGg';
let _tok = { id:null, exp:0 };
function _isProd(){ return /solanprinting\.github\.io/.test(location.host); }
function _today(){ return new Date().toISOString().slice(0,10); }
function esc(t){ return String(t==null?'':t).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function _n(v){ return (Math.round((+v||0)*100)/100).toLocaleString('he-IL'); }
// ⚠️ אות סופית חוזרת לצורה הרגילה לפני הסיומת: קרטון → קרטונים (לא "קרטוןים")
const _FIN={'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
function _plu(w){ w=String(w||'קרטון'); if(/ה$/.test(w)) return w.slice(0,-1)+'ות';
  const l=w.slice(-1); return (_FIN[l]?w.slice(0,-1)+_FIN[l]:w)+'ים'; }
// שם המשתמש נשמר ע"י האפליקציה הראשית — לתיעוד מי הפיק את התעודה
function _me(){ try{ const u=JSON.parse(localStorage.getItem('solanCurrentUser')||'null'); return (u&&u.name)||'משרד'; }catch(e){ return 'משרד'; } }

function _auth(){
  if(_tok.id && Date.now()<_tok.exp-120000) return Promise.resolve(_tok.id);
  return fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+_APIKEY,
    {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})})
    .then(r=>r.ok?r.json():Promise.reject(new Error('auth '+r.status)))
    .then(j=>{ _tok={id:j.idToken,exp:Date.now()+(parseInt(j.expiresIn)||3600)*1000}; return j.idToken; });
}
const _P='frameworkAgreements';
function _get(p){ return _auth().then(t=>fetch(_FBURL+'/'+p+'.json?auth='+t).then(r=>r.ok?r.json():null)); }
// ⚠️ חובה לבדוק r.ok — אחרת כישלון-כתיבה נראה כהצלחה והנתון "נעלם".
function _put(p,o){ return _auth().then(t=>fetch(_FBURL+'/'+p+'.json?auth='+t,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)})
  .then(r=>{ if(!r.ok) return r.text().then(x=>{ throw new Error('כתיבה נכשלה ('+r.status+') '+String(x||'').slice(0,120)); }); return r; })); }

let _all=[], _sel='ALL', _tab='flow', _busy=false, _newLines=[];
// עבודות הדפוס (cards) — נקראות בלבד · ותעודות משלוח שהופקו עליהן
let _cards=[], _jobNotes=[];
// עבודות שסומנו כסופקו *בלי* תעודת משלוח — { cardId: {at,by} }
let _delivered={};
// אילו קטגוריות בתפריט פתוחות (ברירת-מחדל: הכל פתוח)
let _open={framework:false,placemats:false,orders:false};
// שכבת-המשרד על כרטיסי-עבודה: { cardId: {status,qty,packs,note,removed,at,by} }
let _jobOv={};
// מלאי-הלקוחות של האפליקציה (קריאה — לעדכון אוטומטי מעבודות)
let _custStock={};

// ⚠️ Firebase RTDB לא שומר מערך ריק, ומערך "עם חורים" חוזר כאובייקט — חובה לנרמל.
function _arr(v){
  if (Array.isArray(v)) return v.filter(x=>x!=null);
  if (v && typeof v==='object') return Object.keys(v).sort((a,b)=>(+a)-(+b)).map(k=>v[k]).filter(x=>x!=null);
  return [];
}
function _normAg(a){
  if(!a || typeof a!=='object') return a;
  a.items=_arr(a.items); a.movements=_arr(a.movements);
  a.orders=_arr(a.orders).map(o=>{ if(o){ o.lines=_arr(o.lines); if(o.ready) o.ready.lines=_arr(o.ready.lines); } return o; });
  a.topups=_arr(a.topups).map(t=>{ if(t) t.lines=_arr(t.lines); return t; });
  a.deliveryNotes=_arr(a.deliveryNotes).map(d=>{ if(d){ d.lines=_arr(d.lines); d.orders=_arr(d.orders); } return d; });
  return a;
}

async function load(){
  try{
    const obj=await _get(_P);
    _all = obj && typeof obj==='object' ? Object.values(obj).filter(a=>a&&a.agreementId).map(_normAg) : [];
    _all=_all.filter(a=>!FW.isHiddenName(a.customer));      // ⚠️ עבודות גרפיק מוסתרות מהמשרד
    _all.sort((a,b)=>String(a.customer||'').localeCompare(String(b.customer||''),'he'));
  }catch(e){ _all=[]; }
  if(_sel!=='ALL' && !/^GRP:/.test(_sel) && !_all.some(a=>a.agreementId===_sel)) _sel='ALL';
  render();
  loadJobs();          // ⚠️ ברקע! קריאת כרטיסי-העבודה כבדה — אסור שתעכב את הצגת המסך
}

// עבודות הדפוס + התעודות שהופקו עליהן — קריאה בלבד, ברקע, עם תקרת-זמן
async function loadJobs(){
  const cap=(p)=>Promise.race([p, new Promise(r=>setTimeout(()=>r(null), 20000))]);
  try{
    const [cs,ns,dv,dl,ov,st]=await Promise.all([cap(_get('cards')), cap(_get('clerkDeliveryNotes')),
      cap(_get('clerkDelivered')), cap(_get('deletedIds')), cap(_get('clerkJobs')), cap(_get('customerStock'))]);
    // ⚠️ מחיקה באפליקציה = רשומת-מצבה ב-deletedIds; הכרטיס עצמו עדיין ב-cards
    const gone={}; _arr(dl && dl.cards).forEach(id=>{ gone[String(id)]=1; });
    _jobOv=(ov && typeof ov==='object') ? ov : {};
    if(st && typeof st==='object') _custStock=st;
    // כל כרטיס עובר דרך שכבת-המשרד לפני הסינון (סטטוס/הסרה שהפקיד קבע)
    if(cs) _cards=_arr(cs).filter(c=>c && c.id!=null && !c._deleted && !gone[String(c.id)])
      .map(c=>FW.applyJobOverlay(c,_jobOv[c.id])).filter(c=>FW.isClerkJob(c));
    _jobNotes=(ns && typeof ns==='object') ? Object.values(ns).filter(Boolean) : [];
    _delivered=(dv && typeof dv==='object') ? dv : {};
    if(_cards.length || _jobNotes.length || Object.keys(_delivered).length || Object.keys(_jobOv).length) render();
  }catch(e){ /* אין הרשאה/רשת — הלוח עדיין מציג את ההזמנות */ }
}
function cur(){ return _all.find(a=>a.agreementId===_sel)||null; }
function allNotes(){ return _all.reduce((s,a)=>s.concat(a.deliveryNotes||[]),[]).concat(_jobNotes); }
async function save(ag){
  if(!_isProd()){ alert('שמירה פועלת רק באתר החי (הגנת-סביבה).'); return false; }
  if(_busy){ alert('פעולה קודמת עדיין נשמרת — נסו שוב בעוד רגע'); return false; } _busy=true;
  _normAg(ag);
  try{ await _put(_P+'/'+ag.agreementId, ag);
    const i=_all.findIndex(a=>a.agreementId===ag.agreementId);
    if(i>=0) _all[i]=ag; else _all.push(ag);
    return true;
  }catch(e){ alert('שמירה נכשלה: '+(e.message||e)); return false; }
  finally{ _busy=false; }
}

/* ═══════════ תצוגה ═══════════ */
function render(){
  $('whoami').textContent='שלום, '+_me();
  // תפריט: קטגוריה לכל סוג לקוח, ובתוכה תתי-סעיפים ללקוחות עצמם
  const readyOf=a=>(a.orders||[]).filter(o=>o&&o.status==='ready').length;
  const readyAll=_all.reduce((s,a)=>s+readyOf(a),0);
  const menu=FW.KINDS.map(k=>{
    const list=_byKind(k), open=!!_open[k], sel=('GRP:'+k)===_sel;
    // ⚠️ כשהקטגוריה מקופלת לא מרנדרים את הלקוחות בכלל — כדי שהתפריט יישאר קצר
    const kids=!open?'':list.map(a=>{
      const r=readyOf(a);
      return `<div class="cItem sub${a.agreementId===_sel?' on':''}" data-a="${a.agreementId}">
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.customer)}</span>
        ${r?`<span class="b" title="מוכנות לאספקה">${r}</span>`:''}</div>`;
    }).join('') || '<div class="muted" style="padding:8px 22px;font-size:.82rem">— אין לקוחות בקטגוריה —</div>';
    return `<div class="cItem grp${sel?' on':''}" data-a="GRP:${k}">
        <span>${open?'▾':'▸'} ${FW.kindLabel(k)}</span>
        <span class="b" style="background:var(--press)">${list.length}</span></div>
      <div data-grp="${k}" style="display:${open?'block':'none'}">${kids}</div>`;
  }).join('');

  const a=cur();
  $('app').innerHTML=`<div class="wrap">
    <aside class="side"><div class="sideT">תפריט</div>
      <div class="cItem${_sel==='ALL'?' on':''}" data-a="ALL" style="border-bottom:2px solid var(--line)">
        <span>🔄 כל העבודות</span>${readyAll?`<span class="b">${readyAll} מוכן</span>`:''}</div>
      ${menu}</aside>
    <section class="main">${_sel==='ALL'?detailAll()
      :/^GRP:/.test(_sel)?detailGroup(_sel.slice(4))
      :(a?detail(a):'<div class="card muted">בחרו לקוח מהתפריט.</div>')}</section>
  </div>`;
  document.querySelectorAll('[data-a]').forEach(el=>el.onclick=()=>{
    const v=el.dataset.a;
    if(/^GRP:/.test(v)){ const k=v.slice(4); _open[k]=!_open[k]; }   // לחיצה = פתיחה/קיפול
    _sel=v; _newLines=[];
    if((v==='ALL'||/^GRP:/.test(v)) && _tab!=='flow') _tab='flow';
    render();
  });
  wire(a);
}
function _byKind(k){ return _all.filter(a=>FW.kindOf(a.kind)===k); }

/* קטגוריה שלמה: הזרימה של כל לקוחותיה — ולהסכמי מסגרת גם המלאי של כל אחד */
function detailGroup(k){
  const list=_byKind(k);
  const groups=list.map(a=>({ag:a, orders:(a.orders||[]).slice().reverse()}));
  const cnt=s=>groups.reduce((n,g)=>n+g.orders.filter(o=>FW.orderStage(o)===s).length,0);
  if(!list.length) return `<div class="card"><h3>${FW.kindLabel(k)}</h3>
    <div class="muted">אין עדיין לקוחות בקטגוריה הזו. אפשר להוסיף דרך "➕ הזמנה חדשה" ולבחור לקוח חדש.</div></div>`;
  return `<div class="card" style="padding:10px 14px">
      <b style="color:var(--press)">${FW.kindLabel(k)}</b>
      <span class="stat" style="margin-inline-start:10px">לקוחות<b>${list.length}</b></span>
      <span class="stat">התקבלו<b style="color:#b45309">${cnt('new')}</b></span>
      <span class="stat">מוכנות<b style="color:#15803d">${cnt('ready')}</b></span>
      <span class="stat">סופקו<b>${cnt('delivered')}</b></span>
    </div>
    ${flowBoard(groups,false)}
    ${k==='framework'?('<div style="margin-top:14px">'+list.map(stockCard).join('')+'</div>'):''}`;
}

// מבט-על: זרימת כל העבודות בבית-הדפוס, בלי להיכנס ללקוח מסוים
function detailAll(){
  const groups=_all.map(a=>({ag:a, orders:(a.orders||[]).slice().reverse()}));
  const noteFor=c=>_jobNotes.some(n=>(n.cardIds||[]).indexOf(String(c.id))>=0);
  const cnt=s=>groups.reduce((n,g)=>n+g.orders.filter(o=>FW.orderStage(o)===s).length,0)
    + _cards.filter(c=>FW.jobStage(c,noteFor(c))===s).length;
  const nReady=_readyRows(null).length;
  let body;
  if(_tab==='ready')      body = readyView(null);
  else if(_tab==='done')  body = deliveredView(null);
  else body = `<div class="card" style="padding:10px 14px">
      <span class="stat">התקבלו<b style="color:#b45309">${cnt('new')}</b></span>
      <span class="stat">בייצור<b style="color:#0369a1">${cnt('production')}</b></span>
      <span class="stat">מוכנות לאספקה<b style="color:#15803d">${cnt('ready')}</b></span>
      <span class="stat">סופקו<b>${cnt('delivered')}</b></span>
      <span class="stat">עבודות דפוס<b>${_cards.length}</b></span>
    </div>
    <div class="muted" style="margin:0 2px 10px">כל מה שרץ בדפוס — הזמנות מסגרת <b>וכרטיסי עבודה</b> (🖨). מה שכבר סופק עבר ללשונית "🚚 סופקו".</div>
    ${flowBoard(groups,true)}`;
  return `<div class="tabs">
      <div class="tab${_tab!=='ready'&&_tab!=='done'?' on':''}" data-t="flow">🔄 זרימת עבודות</div>
      <div class="tab${_tab==='ready'?' on':''}" data-t="ready">✅ מוכן לאספקה${nReady?`<span class="n">${nReady}</span>`:''}</div>
      <div class="tab${_tab==='done'?' on':''}" data-t="done">🚚 סופקו</div>
    </div>${body}`;
}

function detail(a){
  const b=FW.computeBalances(a), t=b.totals;
  const orders=(a.orders||[]).slice().reverse();
  const ready=orders.filter(o=>o.status==='ready');
  const notes=(a.deliveryNotes||[]).slice().reverse();

  // המסך הראשי = זרימת העבודות. המלאי חי בקטגוריה "📋 הסכמי מסגרת" (ובטופס ההזמנה עצמו).
  let body='';
  if(_tab==='new')        body = newOrderCard(a,b);
  else if(_tab==='ready') body = readyView(a.agreementId);
  else if(_tab==='done')  body = deliveredView(a.agreementId);
  else if(_tab==='notes') body = notesCard(notes,a);
  else                    body = flowBoard([{ag:a, orders:orders}]);

  const open=orders.filter(o=>o.status==='pending'||o.status==='ready').length;
  return `<div class="tabs">
      <div class="tab${_tab==='flow'?' on':''}" data-t="flow">🔄 זרימת עבודות${open?`<span class="n">${open}</span>`:''}</div>
      <div class="tab${_tab==='new'?' on':''}" data-t="new">➕ הזמנה חדשה</div>
      <div class="tab${_tab==='ready'?' on':''}" data-t="ready">✅ מוכן לאספקה${ready.length?`<span class="n">${ready.length}</span>`:''}</div>
      <div class="tab${_tab==='done'?' on':''}" data-t="done">🚚 סופקו</div>
      <div class="tab${_tab==='notes'?' on':''}" data-t="notes">📄 תעודות משלוח${notes.length?`<span class="n">${notes.length}</span>`:''}</div>
    </div>${body}`;
}

/* ═══════════ 📋 הסכמי מסגרת — הלקוחות והמלאי שלהם ═══════════
   כאן (ולא במסך העבודות) יושב המלאי: כמה יש, כמה משוריין, כמה פנוי להתחייבות. */

      </tr>`).join('')||'<tr><td colspan="6" class="muted" style="text-align:center;padding:12px">אין פריטים בהסכם</td></tr>'}</tbody></table></div>

/* ═══════════ לוח זרימת עבודות ═══════════
   שלושה שלבים לפי סטטוס ההזמנה. זה המסך הראשי של הפקיד — לא טבלת מלאי. */
const _STAGES=[
  { k:'new',        t:'📝 התקבלה',        c:'#f59e0b', hint:'הזמנה/עבודה שנרשמה — טרם נכנסה לייצור' },
  { k:'production', t:'🖨 בייצור',         c:'#0ea5e9', hint:'בהדפסה או בגימורים' },
  { k:'ready',      t:'✅ מוכנה לאספקה',   c:'#16a34a', hint:'הושלמה — אפשר להוציא תעודת משלוח' }
];
// "סופקה" אינו עמוד בלוח — הצבע נשמר לתצוגות אחרות
const _DONE_COLOR='#2d3561';
function _orderCard(o,a,stage){
  const note=(a.deliveryNotes||[]).find(d=>(d.orders||[]).some(x=>x.orderId===o.orderId));
  const lines=FW.effectiveLines(o).map(l=>{
    const it=(a.items||[]).find(x=>x.itemId===l.itemId);
    return `<div>• ${esc((it&&it.name)||l.name||'')} — ${l.packs?`<b>${l.packs.toLocaleString()} ${esc(_plu(l.packName||(it&&it.packName)))}</b>`:`${l.qty.toLocaleString()} יח׳`}</div>`;
  }).join('');
  const late = stage==='new' && o.dueDate && o.dueDate < _today();
  const short = stage!=='new' && FW.effectiveLines(o).some(l=>l.orderedQty && l.qty<l.orderedQty);
  return `<div class="fCard ordCard" data-ag="${a.agreementId}" data-o="${o.orderId}" title="לחצו לעריכת ההזמנה" style="cursor:pointer;border-inline-start-color:${_STAGES.find(s=>s.k===stage).c}">
    <div style="display:flex;justify-content:space-between;gap:6px;align-items:baseline">
      <b>${esc(FW.orderTitle(o))}</b><span class="muted" style="font-size:.75rem">${esc(o.date||'')}</span></div>
    ${_sel==='ALL'?`<div class="muted" style="font-size:.78rem">🏢 ${esc(a.customer)}</div>`:''}
    <div style="font-size:.82rem;margin-top:4px">${lines}</div>
    ${o.dueDate?`<div class="${late?'bad':'muted'}" style="font-size:.76rem;margin-top:3px">${late?'⚠ עבר מועד: ':'לאספקה עד: '}${esc(o.dueDate)}</div>`:''}
    ${short?'<div class="bad" style="font-size:.76rem">יצא פחות מההזמנה</div>':''}
    ${o.ready&&o.ready.notes?`<div class="muted" style="font-size:.76rem">📌 ${esc(o.ready.notes)}</div>`:''}
    ${note?`<div style="margin-top:5px"><button class="dnView" data-d="${note.noteId}" data-ag="${a.agreementId}" style="padding:3px 9px;font-size:.78rem">📄 תעודה ${note.number}</button></div>`:''}
    ${stage==='ready'?`<div style="margin-top:5px;display:flex;gap:5px;flex-wrap:wrap">
      <button class="goReady primary" data-ag="${a.agreementId}" style="padding:3px 9px;font-size:.78rem">📄 הפק תעודה</button>
      <button class="odDone" data-ag="${a.agreementId}" data-o="${o.orderId}" style="padding:3px 9px;font-size:.78rem" title="נמסר ללקוח בלי תעודת משלוח">✓ סמן כסופק</button></div>`:''}
  </div>`;
}
/* כרטיס-עבודה של הדפוס (מ-cards). הכרטיס עצמו נקרא-בלבד — שינויי המשרד
   נשמרים בשכבה נפרדת (clerkJobs) כדי לא להתנגש בסנכרון של האפליקציה. */
function _jobCard(c,stage){
  const note=_jobNotes.find(n=>(n.cardIds||[]).indexOf(String(c.id))>=0);
  const late = stage!=='delivered' && c.deliveryDate && c.deliveryDate < _today();
  return `<div class="fCard jobCard" data-j="${c.id}" title="לחצו לעדכון סטטוס / כמות" style="cursor:pointer;border-inline-start-color:${_STAGES.find(s=>s.k===stage).c};background:#fcfcff">
    <div style="display:flex;justify-content:space-between;gap:6px;align-items:baseline">
      <b>🖨 ${esc(c.name||'עבודה')}</b><span class="muted" style="font-size:.75rem">${esc(c.orderDate||'')}</span></div>
    <div style="font-size:.82rem;margin-top:4px">
      ${c.copies?`• ${Number(c.copies).toLocaleString()} עותקים`:''}${c.pages?` · ${c.pages} עמ׳`:''}
      ${c.doneLines&&c.doneLines.length>1?('<div class="ok" style="font-size:.78rem">'+c.doneLines.map(l=>'• '+esc(l.customer||'')+' — '+l.qty.toLocaleString()+(l.packs?(' ('+l.packs+' אריזות)'):'')).join('<br>')+'</div>')
        : (c.doneQty!=null?`<div class="ok" style="font-size:.78rem">יצא בפועל: ${c.doneQty.toLocaleString()}${c.donePacks?` (${c.donePacks} אריזות)`:''}</div>`:'')}
      ${c.clerkNote?`<div class="muted" style="font-size:.76rem">📌 ${esc(c.clerkNote)}</div>`:''}
      ${c.paper?`<div class="muted">${esc(c.paper)}</div>`:''}</div>
    ${c.deliveryDate?`<div class="${late?'bad':'muted'}" style="font-size:.76rem;margin-top:3px">${late?'⚠ עבר מועד: ':'לאספקה: '}${esc(c.deliveryDate)}</div>`:''}
    ${note?`<div style="margin-top:5px"><button class="jnView" data-n="${note.noteId}" style="padding:3px 9px;font-size:.78rem">📄 תעודה ${note.number}</button></div>`
      : _delivered[c.id]?`<div style="margin-top:5px"><span class="ok" style="font-size:.78rem">✓ סופק ללא תעודה</span>
          <span class="muted" style="font-size:.72rem">${esc(_delivered[c.id].at||'')} ${esc(_delivered[c.id].by||'')}</span>
          <button class="jnUndo" data-c="${c.id}" style="padding:2px 7px;font-size:.72rem" title="בטל סימון">↩</button></div>`
      : stage==='ready'?`<div style="margin-top:5px;display:flex;gap:5px;flex-wrap:wrap">
          <button class="jnMake primary" data-c="${c.id}" style="padding:3px 9px;font-size:.78rem">📄 הפק תעודה</button>
          <button class="jnDone" data-c="${c.id}" style="padding:3px 9px;font-size:.78rem" title="נמסר ללקוח בלי תעודת משלוח">✓ סמן כסופק</button>
          <button class="jbUnready" data-c="${c.id}" style="padding:3px 9px;font-size:.78rem" title="חזרה לייצור — הכמות תוחזר ממלאי הלקוח">↩ החזר לייצור</button></div>`:''}
  </div>`;
}
function flowBoard(groups,withJobs){
  const cols=_STAGES.map(s=>{
    const cards=[];
    groups.forEach(g=>{ (g.orders||[]).forEach(o=>{ if(FW.orderStage(o)===s.k) cards.push(_orderCard(o,g.ag,s.k)); }); });
    if(withJobs) _cards.forEach(c=>{
      const done=_jobNotes.some(n=>(n.cardIds||[]).indexOf(String(c.id))>=0) || !!_delivered[c.id];
      if(FW.jobStage(c,done)===s.k) cards.push(_jobCard(c,s.k));
    });
    return `<div class="fCol">
      <div class="fHead" style="background:${s.c}">${s.t}<span class="fN">${cards.length}</span></div>
      <div class="fHint">${s.hint}</div>
      <div class="fBody">${cards.join('')||'<div class="muted" style="padding:10px;text-align:center">אין עבודות בשלב זה</div>'}</div>
    </div>`;
  }).join('');
  return `<div class="flow">${cols}</div>`;
}

/* ── הזמנה חדשה ── */
function newOrderCard(a,b){
  const opts=(a.items||[]).map(it=>`<option value="${it.itemId}">${esc(it.name)}${it.sku?' ('+esc(it.sku)+')':''}</option>`).join('');
  const rows=_newLines.map((l,i)=>{
    const r=b.items.find(x=>x.itemId===l.itemId)||{};
    const after=(r.availableQty||0)-_sumOther(l.itemId,i)-(l.qty||0);
    return `<tr>
      <td><select class="nlIt" data-i="${i}">${(a.items||[]).map(it=>`<option value="${it.itemId}"${it.itemId===l.itemId?' selected':''}>${esc(it.name)}${it.sku?' ('+esc(it.sku)+')':''}</option>`).join('')}</select></td>
      <td>${r.packSize?`<input type="number" class="nlPacks" data-i="${i}" value="${l.packs||0}" min="0" style="width:80px"><div class="muted" style="font-size:.72rem">×${r.packSize.toLocaleString()} ${esc(r.packName)}</div>`:'<span class="muted">—</span>'}</td>
      <td><input type="number" class="nlQty" data-i="${i}" value="${l.qty||0}" min="0" style="width:110px"></td>
      <td>${(r.availableQty||0).toLocaleString()}</td>
      <td class="${after<0?'bad':''}"><b>${after.toLocaleString()}</b>${after<0?' ⚠ אין מספיק':''}</td>
      <td>${r.price1000?('₪'+_n(((l.qty||0)/1000)*r.price1000)):'—'}</td>
      <td><button class="nlDel danger" data-i="${i}" title="הסר שורה">🗑</button></td></tr>`;
  }).join('');
  const tot=_newLines.reduce((s,l)=>{ const r=b.items.find(x=>x.itemId===l.itemId); return s+((l.qty||0)/1000)*((r&&r.price1000)||0); },0);
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px">
      <h3 style="margin:0">➕ הזמנה חדשה מהלקוח</h3>
      <button id="nlAdd" ${(a.items||[]).length?'':'disabled'}>➕ הוסף שורה</button>
    </div>
    ${_newLines.length?`<div style="overflow-x:auto"><table>
      <thead><tr><th>פריט</th><th>אריזות</th><th>יח׳ סה״כ</th><th>פנוי כעת</th><th>יישאר פנוי</th><th>לחיוב</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px">
        <span>מס׳ הזמנה/הזמנת רכש של הלקוח:</span><input id="nlRef" style="width:170px" placeholder="לדוגמה PO-4501">
        <span>לאספקה עד:</span><input id="nlDue" type="date" value="">
        <span style="margin-inline-start:auto"><b>סה״כ לחיוב: ₪${_n(tot)}</b></span>
        <button id="nlSave" class="primary">✓ שמור הזמנה</button>
      </div>
      <div class="muted" style="margin-top:6px;font-size:.8rem">ההזמנה נשמרת כ<b>ממתינה</b> ומשריינת את הכמות. המלאי יורד רק כשמוציאים תעודת משלוח.</div>`
    : '<div class="muted">לחצו "➕ הוסף שורה" כדי לרשום הזמנה חדשה.</div>'}
  </div>`;
}
function _sumOther(itemId,skipIdx){
  return _newLines.reduce((s,l,i)=>(i!==skipIdx && l.itemId===itemId)?s+(l.qty||0):s,0);
}

/* ── רשימת הזמנות ── */
function _oLines(o,a){
  return FW.effectiveLines(o).map(l=>{
    const it=(a.items||[]).find(x=>x.itemId===l.itemId);
    return `${esc((it&&it.name)||l.name||'')} — ${l.packs?`<b>${l.packs.toLocaleString()} ${esc(_plu(l.packName||(it&&it.packName)))}</b> (${l.qty.toLocaleString()} יח׳)`:`${l.qty.toLocaleString()} יח׳`}`;
  }).join('<br>');
}
/* ── מוכן לאספקה → תעודת משלוח ── */
/* ═══════════ מוכן לאספקה — סימון מרובה ═══════════
   מאחד הזמנות-מסגרת וכרטיסי-עבודה בטבלה אחת עם בחירה מרובה + "סמן הכל",
   ושתי פעולות-אצווה: הפקת תעודה, או סימון כסופק בלי תעודה. */
function _readyRows(agId){
  const out=[];
  _all.filter(a=>!agId||a.agreementId===agId).forEach(a=>{
    (a.orders||[]).filter(o=>o&&o.status==='ready').forEach(o=>out.push({
      kind:'order', key:'o:'+a.agreementId+':'+o.orderId, agId:a.agreementId, id:o.orderId,
      customer:a.customer, title:FW.orderTitle(o), date:o.date||'',
      detail:_oLines(o,a), ordered:(o.lines||[]).map(l=>l.qty.toLocaleString()+' יח׳').join('<br>'),
      short:FW.effectiveLines(o).some(l=>l.orderedQty && l.qty<l.orderedQty),
      by:((o.ready&&o.ready.by)||'')+' '+((o.ready&&o.ready.at)||''),
      value:(o.ready&&o.ready.value)||o.value
    }));
  });
  if(!agId) _cards.forEach(c=>{
    const done=_jobNotes.some(n=>(n.cardIds||[]).indexOf(String(c.id))>=0)||!!_delivered[c.id];
    if(FW.jobStage(c,done)!=='ready') return;
    const jl=FW.jobLines(c);
    out.push({ kind:'job', key:'j:'+c.id, id:String(c.id),
      customer:FW.jobCustomers(c).join(' · ')||c.customer||'',
      title:'🖨 '+(c.name||'עבודה'), date:c.orderDate||'',
      detail: jl.length>1 ? jl.map(l=>'• '+esc(l.customer||'')+' — '+l.qty.toLocaleString()+(l.packs?(' ('+l.packs+' אריזות)'):'')).join('<br>')
        : ((c.doneQty!=null?c.doneQty:(parseInt(c.copies,10)||0)).toLocaleString()+' יח׳'+(c.paper?' · '+esc(c.paper):'')),
      ordered:'', short:false, by:'', value:0 });
  });
  return out;
}
function readyView(agId){
  const rows=_readyRows(agId);
  if(!rows.length) return `<div class="card"><h3>✅ מוכן לאספקה</h3>
    <div class="muted">אין כרגע עבודות או הזמנות מוכנות. ברגע שעבודה תסומן כהושלמה — היא תופיע כאן.</div></div>`;
  return `<div class="card"><h3>✅ מוכן לאספקה — סמנו מה יוצא ללקוח</h3>
    <div style="overflow-x:auto"><table>
      <thead><tr>
        <th style="width:34px"><input type="checkbox" id="rdAll" checked title="סמן/בטל הכל"></th>
        <th>לקוח</th><th>עבודה / הזמנה</th><th>מה יצא בפועל</th><th>הוזמן</th><th>סומן</th><th>לחיוב</th><th></th></tr></thead>
      <tbody>${rows.map(r=>`<tr class="ready${r.kind==='order'?' ordRow':''}" ${r.kind==='order'?`data-ag="${r.agId}" data-o="${r.id}" style="cursor:pointer" title="לחצו לעריכת ההזמנה"`:''}>
        <td><input type="checkbox" class="rdChk" data-k="${r.key}" checked></td>
        <td>${esc(r.customer)}</td>
        <td><b>${esc(r.title)}</b><div class="muted" style="font-size:.75rem">${esc(r.date)}</div></td>
        <td style="font-size:.85rem">${r.detail}</td>
        <td class="muted" style="font-size:.8rem">${r.ordered}${r.short?'<div class="bad">יצא פחות מההזמנה</div>':''}</td>
        <td class="muted" style="font-size:.8rem">${esc(r.by)}</td>
        <td>${r.value?('₪'+_n(r.value)):'<span class="muted">—</span>'}</td>
        <td>${r.kind==='job'
          ? `<button class="jbUnready" data-c="${r.id}" style="padding:3px 9px;font-size:.78rem" title="חזרה לייצור — הכמות תוחזר ממלאי הלקוח">↩ החזר לייצור</button>`
          : `<button class="odDone" data-ag="${r.agId}" data-o="${r.id}" style="padding:3px 9px;font-size:.78rem" title="נמסר ללקוח בלי תעודת משלוח">✓ סופק</button>
             <button class="odUnready" data-ag="${r.agId}" data-o="${r.id}" style="padding:3px 9px;font-size:.78rem">↩ החזר לייצור</button>`}</td></tr>`).join('')}</tbody></table></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px">
      <span id="rdCount" class="muted"></span>
      <span style="margin-inline-start:auto">אסמכתא:</span><input id="dnRef" style="width:150px">
      <span>הערה:</span><input id="dnNote" style="width:180px" placeholder="לדוגמה: נמסר לנהג">
      <button id="dnMake" class="primary">📄 הפק תעודת משלוח</button>
      <button id="rdDone">✓ סמן כסופק (ללא תעודה)</button>
    </div>
    <div class="muted" style="margin-top:6px;font-size:.8rem">תעודה מופקת ללקוח אחד בכל פעם. סימון "סופק" אפשרי גם למספר לקוחות יחד — הזמנות מסגרת יורידו מהמלאי.</div>
  </div>`;
}

/* ── מסך משני: מה שכבר סופק ── */
function deliveredView(agId){
  const out=[];
  _all.filter(a=>!agId||a.agreementId===agId).forEach(a=>{
    (a.orders||[]).filter(o=>o&&o.status==='supplied').forEach(o=>{
      const note=(a.deliveryNotes||[]).find(d=>(d.orders||[]).some(x=>x.orderId===o.orderId));
      out.push({ cust:a.customer, title:FW.orderTitle(o), date:o.suppliedAt||o.date||'',
        detail:_oLines(o,a), note:note?`<button class="dnView" data-d="${note.noteId}" data-ag="${a.agreementId}">📄 ${note.number}</button>`:'<span class="muted">ללא תעודה</span>',
        undo:`<button class="odUndo" data-ag="${a.agreementId}" data-o="${o.orderId}" title="הסחורה תחזור למלאי הלקוח">↩ בטל אספקה</button>` });
    });
  });
  if(!agId) _cards.forEach(c=>{
    const note=_jobNotes.find(n=>(n.cardIds||[]).indexOf(String(c.id))>=0);
    if(!note && !_delivered[c.id]) return;
    const jl=FW.jobLines(c);
    out.push({ cust:FW.jobCustomers(c).join(' · ')||c.customer||'', title:'🖨 '+(c.name||'עבודה'),
      date:(note&&note.date)||(_delivered[c.id]&&_delivered[c.id].at)||'',
      detail: jl.length>1 ? jl.map(l=>'• '+esc(l.customer||'')+' — '+l.qty.toLocaleString()).join('<br>')
        : ((c.doneQty!=null?c.doneQty:(parseInt(c.copies,10)||0)).toLocaleString()+' יח׳'),
      note:note?`<button class="jnView" data-n="${note.noteId}">📄 ${note.number}</button>`:'<span class="ok">✓ ללא תעודה</span>',
      undo:`<button class="jbUndoDel" data-c="${c.id}" ${note?`data-n="${note.noteId}"`:''} title="הסחורה תחזור למלאי הלקוח">↩ בטל אספקה</button>` });
  });
  out.sort((x,y)=>String(y.date).localeCompare(String(x.date)));
  return `<div class="card"><h3>🚚 סופקו</h3>
    <div class="muted" style="margin-bottom:8px">כל מה שיצא ללקוחות — לא מוצג בלוח הזרימה כדי לא להעמיס עליו.</div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>תאריך</th><th>לקוח</th><th>עבודה / הזמנה</th><th>פירוט</th><th>תעודה</th><th></th></tr></thead>
      <tbody>${out.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.cust)}</td>
        <td><b>${esc(r.title)}</b></td><td style="font-size:.85rem">${r.detail}</td><td>${r.note}</td><td>${r.undo||''}</td></tr>`).join('')
        ||'<tr><td colspan="6" class="muted" style="text-align:center;padding:12px">עדיין לא סופק דבר</td></tr>'}</tbody></table></div>
  </div>`;
}

/* ── תעודות משלוח ── */
function notesCard(notes,a){
  return `<div class="card"><h3>📄 תעודות משלוח — ${esc(a.customer)}</h3>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>מס׳</th><th>תאריך</th><th>פריטים</th><th>אריזות</th><th>יח׳</th><th>סכום</th><th>הפיק</th><th></th></tr></thead>
      <tbody>${notes.map(d=>`<tr>
        <td><b>${d.number}</b></td><td>${esc(d.date||'')}</td>
        <td style="font-size:.85rem">${(d.lines||[]).map(l=>esc(l.name)).join('<br>')}</td>
        <td>${d.packs?d.packs.toLocaleString():'—'}</td><td>${d.qty.toLocaleString()}</td><td>₪${_n(d.value)}</td>
        <td class="muted">${esc(d.by||'')}</td>
        <td><button class="dnView" data-d="${d.noteId}">👁 הצג / הדפס</button></td></tr>`).join('')
        ||'<tr><td colspan="8" class="muted" style="text-align:center;padding:12px">לא הופקו תעודות עדיין</td></tr>'}</tbody></table></div>
  </div>`;
}

/* ═══════════ אירועים ═══════════ */
function wire(a){
  document.querySelectorAll('[data-t]').forEach(el=>el.onclick=()=>{ _tab=el.dataset.t; render(); });
  // מלוח-הזרימה אפשר לקפוץ ישר ללקוח וללשונית הרלוונטית
  document.querySelectorAll('.goReady').forEach(el=>el.onclick=e=>{
    e.stopPropagation(); _sel=el.dataset.ag; _tab='ready'; render(); });
  // 📄 תעודת משלוח על עבודת-דפוס שהושלמה (לא הסכם מסגרת)
  document.querySelectorAll('.jnMake').forEach(el=>el.onclick=async e=>{
    e.stopPropagation();
    const c=_cards.find(x=>String(x.id)===String(el.dataset.c)); if(!c) return;
    // עבודה משותפת לכמה לקוחות → תעודה נפרדת לכל לקוח
    const custs=FW.jobCustomers(c);
    let cust='';
    if(custs.length>1){
      const pick=prompt('לאיזה לקוח להפיק את התעודה?\n'+custs.map((x,i)=>(i+1)+') '+x).join('\n'),'1');
      if(pick===null) return;
      cust=custs[parseInt(pick,10)-1]||'';
      if(!cust){ alert('בחירה לא תקינה'); return; }
    } else {
      const ans=prompt('שם הלקוח לתעודה:', custs[0]||c.customer||c.name||'');
      if(ans===null||!ans.trim()) return;
      cust=ans.trim();
    }
    const lines=FW.jobLines(c).filter(l=>custs.length<=1 || l.customer===cust);
    const num=FW.nextNoteNumber(allNotes());
    const jn=FW.buildJobNote(lines.map(l=>({cardId:c.id,name:l.name||c.name,qty:l.qty,packs:l.packs})),
      {number:num,customer:cust,date:_today(),by:_me()});
    if(!jn.ok){ alert('נכשל: '+jn.errors.join(', ')); return; }
    if(!confirm('להפיק תעודת משלוח מס׳ '+num+' על "'+(c.name||'')+'"?')) return;
    if(!_isProd()){ alert('הפקה פועלת רק באתר החי (הגנת-סביבה).'); return; }
    try{ await _put('clerkDeliveryNotes/'+jn.note.noteId, jn.note); }
    catch(err){ alert('שמירה נכשלה: '+(err.message||err)); return; }
    _jobNotes.push(jn.note);
    const outLines=_jobLinesFor(c, custs.length>1?cust:null);
    if(outLines.length && confirm('להוריד את הכמות שנמסרה ממלאי הלקוחות?'))
      await _syncCustomerStock(outLines, c, -1, 'מסירה ללקוח');
    render(); showNote(jn.note,null);
  });
  document.querySelectorAll('.jnView').forEach(el=>el.onclick=()=>{
    const n=_jobNotes.find(x=>x.noteId===el.dataset.n); if(n) showNote(n,null);
  });
  // ✓ סימון "סופק" בלי תעודת משלוח (נמסר ביד/נאסף) — נשמר בנפרד, בלי לגעת בכרטיס העבודה
  document.querySelectorAll('.jnDone').forEach(el=>el.onclick=async e=>{
    e.stopPropagation();
    const c=_cards.find(x=>String(x.id)===String(el.dataset.c)); if(!c) return;
    if(!confirm('לסמן ש-"'+(c.name||'')+'" סופקה ללקוח?\n(בלי הפקת תעודת משלוח)')) return;
    if(!_isProd()){ alert('סימון פועל רק באתר החי (הגנת-סביבה).'); return; }
    const rec={at:_today(),by:_me()};
    try{ await _put('clerkDelivered/'+c.id, rec); }
    catch(err){ alert('שמירה נכשלה: '+(err.message||err)); return; }
    _delivered[c.id]=rec;
    const outLines=_jobLinesFor(c);
    if(outLines.length && confirm('להוריד את הכמות שנמסרה ממלאי הלקוחות?'))
      await _syncCustomerStock(outLines, c, -1, 'מסירה ללקוח');
    render();
  });
  /* ↩ ביטול אספקה של הזמנת-מסגרת — הכמות חוזרת למלאי הלקוח (התנועות מבוטלות) */
  document.querySelectorAll('.odUndo').forEach(el=>el.onclick=async e=>{
    e.stopPropagation();
    const ag=_all.find(x=>x.agreementId===el.dataset.ag); if(!ag) return;
    const o=FW.findOrder(ag,el.dataset.o); if(!o) return;
    if(!confirm('לבטל את האספקה של "'+FW.orderTitle(o)+'"?\n\nהכמות תחזור למלאי של '+ag.customer+'.')) return;
    const res=FW.revertSupply(ag,o.orderId);
    if(!res.ok){ alert('נכשל: '+res.errors.join(', ')); return; }
    // תעודת המשלוח שהופקה עליה כבר לא רלוונטית
    res.agreement.deliveryNotes=(res.agreement.deliveryNotes||[]).filter(d=>!(d.orders||[]).some(x=>x.orderId===o.orderId));
    if(await save(_normAg(res.agreement))){
      await _orderStockPrompt(ag,[o],+1,'ביטול אספקה');
      render(); alert('✓ האספקה בוטלה — הכמות חזרה למלאי'); }
  });

  /* ↩ ביטול אספקה של עבודה — מבטל את התעודה/הסימון ומחזיר למלאי הלקוחות */
  document.querySelectorAll('.jbUndoDel').forEach(el=>el.onclick=async e=>{
    e.stopPropagation();
    const c=_cards.find(x=>String(x.id)===String(el.dataset.c)); if(!c) return;
    if(!confirm('לבטל את האספקה של "'+(c.name||'')+'"?\n\nהעבודה תחזור ל"מוכנה לאספקה".')) return;
    if(!_isProd()){ alert('פעולה זו פועלת רק באתר החי (הגנת-סביבה).'); return; }
    const lines=_jobLinesFor(c);
    if(lines.length && confirm('להחזיר את הכמויות למלאי הלקוחות?'))
      await _syncCustomerStock(lines, c, +1, 'ביטול אספקה');
    try{
      if(el.dataset.n) await _put('clerkDeliveryNotes/'+el.dataset.n, null);
      if(_delivered[c.id]) await _put('clerkDelivered/'+c.id, null);
    }catch(err){ alert('שמירה נכשלה: '+(err.message||err)); return; }
    if(el.dataset.n) _jobNotes=_jobNotes.filter(x=>x.noteId!==el.dataset.n);
    delete _delivered[c.id];
    render(); alert('✓ האספקה בוטלה');
  });

  /* ↩ החזרת עבודה מ"מוכנה לאספקה" חזרה לייצור — והכמות יורדת בחזרה ממלאי הלקוח */
  document.querySelectorAll('.jbUnready').forEach(el=>el.onclick=async e=>{
    e.stopPropagation();
    const c=_cards.find(x=>String(x.id)===String(el.dataset.c)); if(!c) return;
    if(!confirm('להחזיר את "'+(c.name||'')+'" לייצור?\n\nהיא תרד מרשימת המוכנות לאספקה.')) return;
    const ov=_jobOv[c.id]||{};
    const lines=_jobLinesFor(c);
    // אם הכמות נכנסה למלאי הלקוח בעת סימון "הושלמה" — מחזירים אותה משם
    if(ov.stockSynced && lines.length && confirm('להוריד בחזרה את הכמויות ממלאי הלקוחות?')){
      if(await _syncCustomerStock(lines, c, -1, 'החזרה לייצור')) ov.stockSynced=false;
    }
    await _saveJobOv(c.id, Object.assign({},ov,{status:'finishing',at:_today(),by:_me()}), null);
    alert('✓ העבודה חזרה לייצור');
  });
  // ↩ החזרת הזמנת-מסגרת מ"מוכנה" ל"ממתינה לייצור" (השריון נשמר, המלאי לא זז)
  document.querySelectorAll('.odUnready').forEach(el=>el.onclick=async e=>{
    e.stopPropagation();
    const ag=_all.find(x=>x.agreementId===el.dataset.ag); if(!ag) return;
    const res=FW.unmarkReady(ag,el.dataset.o);
    if(!res.ok){ alert('נכשל: '+res.errors.join(', ')); return; }
    if(await save(_normAg(res.agreement))) render();
  });

  document.querySelectorAll('.jnUndo').forEach(el=>el.onclick=async e=>{
    e.stopPropagation();
    if(!confirm('לבטל את סימון האספקה?')) return;
    if(!_isProd()){ alert('פעולה זו פועלת רק באתר החי.'); return; }
    try{ await _put('clerkDelivered/'+el.dataset.c, null); }
    catch(err){ alert('שמירה נכשלה: '+(err.message||err)); return; }
    delete _delivered[el.dataset.c]; render();
  });
  // הזמנת-מסגרת: סימון אספקה בלי תעודה (המלאי יורד — זו עדיין אספקה בפועל)
  document.querySelectorAll('.odDone').forEach(el=>el.onclick=async()=>{
    const ag=_all.find(x=>x.agreementId===el.dataset.ag)||a; if(!ag) return;
    const o=FW.findOrder(ag,el.dataset.o); if(!o) return;
    if(!confirm('לסמן שההזמנה '+FW.orderTitle(o)+' סופקה — בלי תעודת משלוח?\n\nהמלאי ירד לפי מה שיצא בפועל.')) return;
    const res=FW.supplyOrder(ag,o.orderId,{date:_today(),by:_me()});
    if(!res.ok){ alert('נכשל: '+res.errors.join(', ')); return; }
    if(await save(_normAg(res.agreement))){ await _orderStockPrompt(ag,[o],-1,'מסירה ללקוח'); render(); }
  });
  document.querySelectorAll('.goOrder').forEach(el=>el.onclick=e=>{
    e.stopPropagation(); _sel=el.dataset.ag; _tab='new'; _newLines=[]; render(); });
  document.querySelectorAll('.dnView').forEach(el=>el.onclick=()=>{
    const ag=_all.find(x=>x.agreementId===el.dataset.ag)||a; if(!ag) return;
    const d=(ag.deliveryNotes||[]).find(x=>x.noteId===el.dataset.d); if(d) showNote(d,ag);
  });
  // לחיצה על כרטיס-עבודה → חלון עדכון (הכפתורים שבתוכו עוצרים את ההתפשטות)
  document.querySelectorAll('.jobCard').forEach(el=>el.onclick=e=>{
    if(e.target.closest('button')) return;
    openJob(el.dataset.j);
  });
  // לחיצה על כרטיס-הזמנה → אותו חלון עריכה (גם אחרי אישור/אספקה)
  document.querySelectorAll('.ordCard').forEach(el=>el.onclick=e=>{
    if(e.target.closest('button')) return;
    openOrder(el.dataset.ag, el.dataset.o);
  });
  // גם משורה בטבלאות "מוכן לאספקה" ו"סופקו"
  document.querySelectorAll('.ordRow').forEach(el=>el.onclick=e=>{
    if(e.target.closest('button')||e.target.closest('input')) return;
    openOrder(el.dataset.ag, el.dataset.o);
  });

  // ── בחירה מרובה ב"מוכן לאספקה" ──
  const _sel2=()=>[...document.querySelectorAll('.rdChk')].filter(c=>c.checked)
    .map(c=>{ const p=c.dataset.k.split(':'); return p[0]==='o'?{kind:'order',agId:p[1],id:p[2]}:{kind:'job',id:p[1]}; });
  const _cnt=()=>{ const el=$('rdCount'); if(el){ const n=_sel2().length;
    el.textContent = n?('נבחרו '+n+' מתוך '+document.querySelectorAll('.rdChk').length):'לא נבחר דבר'; } };
  const all=$('rdAll');
  if(all) all.onclick=()=>{ document.querySelectorAll('.rdChk').forEach(c=>c.checked=all.checked); _cnt(); };
  document.querySelectorAll('.rdChk').forEach(c=>c.onclick=()=>{
    if(all) all.checked=[...document.querySelectorAll('.rdChk')].every(x=>x.checked); _cnt(); });
  _cnt();

  const mk=$('dnMake');
  if(mk) mk.onclick=async()=>{
    const sel=_sel2();
    if(!sel.length){ alert('לא נבחר דבר'); return; }
    const orders=sel.filter(x=>x.kind==='order'), jobs=sel.filter(x=>x.kind==='job');
    if(orders.length && jobs.length){ alert('תעודה אחת לא יכולה לכלול גם הזמנות-מסגרת וגם כרטיסי-עבודה. סמנו בנפרד.'); return; }
    const num=FW.nextNoteNumber(allNotes());
    const ref=($('dnRef').value||'').trim(), nt=($('dnNote').value||'').trim();
    if(orders.length){
      const ags=[...new Set(orders.map(o=>o.agId))];
      if(ags.length>1){ alert('תעודה מופקת ללקוח אחד בכל פעם — סמנו הזמנות של אותו לקוח.'); return; }
      const ag=_all.find(x=>x.agreementId===ags[0]); if(!ag) return;
      if(!confirm('להפיק תעודת משלוח מס׳ '+num+' על '+orders.length+' הזמנות?\n\nההזמנות יסומנו כסופקו והמלאי ירד בהתאם.')) return;
      const res=FW.issueDeliveryNote(ag,orders.map(o=>o.id),{number:num,date:_today(),by:_me(),reference:ref,notes:nt});
      if(!res.ok){ alert('נכשל: '+res.errors.join(', ')); return; }
      if(await save(_normAg(res.agreement))){
        await _orderStockPrompt(ag, orders.map(x=>FW.findOrder(res.agreement,x.id)).filter(Boolean), -1, 'מסירה ללקוח');
        render(); showNote(res.note,ag); }
      return;
    }
    // תעודה על כרטיסי-עבודה
    const cs=jobs.map(j=>_cards.find(c=>String(c.id)===j.id)).filter(Boolean);
    const cust=prompt('שם הלקוח לתעודה:', cs[0]&&(cs[0].customer||cs[0].name)||''); if(cust===null||!cust.trim()) return;
    const jn=FW.buildJobNote(cs.map(c=>({cardId:c.id,name:c.name,qty:parseInt(c.copies,10)||0})),
      {number:num,customer:cust.trim(),date:_today(),by:_me(),reference:ref,notes:nt});
    if(!jn.ok){ alert('נכשל: '+jn.errors.join(', ')); return; }
    if(!confirm('להפיק תעודת משלוח מס׳ '+num+' על '+cs.length+' עבודות?')) return;
    if(!_isProd()){ alert('הפקה פועלת רק באתר החי (הגנת-סביבה).'); return; }
    try{ await _put('clerkDeliveryNotes/'+jn.note.noteId, jn.note); }
    catch(err){ alert('שמירה נכשלה: '+(err.message||err)); return; }
    _jobNotes.push(jn.note); render(); showNote(jn.note,null);
  };

  // ✓ סימון-אצווה כסופק, בלי תעודה — עובד גם על כמה לקוחות יחד
  const rd=$('rdDone');
  if(rd) rd.onclick=async()=>{
    const sel=_sel2();
    if(!sel.length){ alert('לא נבחר דבר'); return; }
    if(!confirm('לסמן '+sel.length+' פריטים כסופקו — בלי תעודת משלוח?\n(הזמנות מסגרת יורידו מהמלאי)')) return;
    if(!_isProd()){ alert('סימון פועל רק באתר החי (הגנת-סביבה).'); return; }
    let okN=0, err=[], agOrders=[];
    for(const x of sel){
      if(x.kind==='job'){
        try{ const rec={at:_today(),by:_me()}; await _put('clerkDelivered/'+x.id, rec); _delivered[x.id]=rec; okN++; }
        catch(e){ err.push('עבודה '+x.id); }
      } else {
        const ag=_all.find(y=>y.agreementId===x.agId); if(!ag){ err.push(x.id); continue; }
        const res=FW.supplyOrder(ag,x.id,{date:_today(),by:_me()});
        if(!res.ok){ err.push(x.id+': '+res.errors.join(',')); continue; }
        if(await save(_normAg(res.agreement))){ okN++; agOrders.push({ag:ag, o:FW.findOrder(ag,x.id)}); }
        else err.push(x.id);
      }
    }
    // הזמנות של לקוחות שמוחזק להם מלאי — שאלה אחת לכל לקוח
    const byAg={};
    agOrders.forEach(p=>{ (byAg[p.ag.agreementId]=byAg[p.ag.agreementId]||{ag:p.ag,os:[]}).os.push(p.o); });
    for(const k of Object.keys(byAg)) await _orderStockPrompt(byAg[k].ag, byAg[k].os, -1, 'מסירה ללקוח');
    render();
    alert('✓ סומנו '+okN+' כסופקו'+(err.length?('\n⚠ נכשלו: '+err.join(', ')):''));
  };
  if(!a) return;                                   // מבט "כל הלקוחות" — אין טפסים לחווט

  const b=FW.computeBalances(a);
  const add=$('nlAdd');
  if(add) add.onclick=()=>{ const it=(a.items||[])[0]; if(!it) return;
    _newLines.push({itemId:it.itemId,packs:0,qty:0}); render(); };
  document.querySelectorAll('.nlDel').forEach(el=>el.onclick=()=>{ _newLines.splice(+el.dataset.i,1); render(); });
  document.querySelectorAll('.nlIt').forEach(el=>el.onchange=e=>{ const i=+e.target.dataset.i;
    _newLines[i].itemId=e.target.value; _newLines[i].packs=0; _newLines[i].qty=0; render(); });
  document.querySelectorAll('.nlPacks').forEach(el=>el.onchange=e=>{ const i=+e.target.dataset.i;
    const r=b.items.find(x=>x.itemId===_newLines[i].itemId);
    _newLines[i].packs=parseInt(e.target.value,10)||0;
    _newLines[i].qty=_newLines[i].packs*((r&&r.packSize)||0);      // אריזות → יחידות
    render(); });
  document.querySelectorAll('.nlQty').forEach(el=>el.onchange=e=>{ const i=+e.target.dataset.i;
    const r=b.items.find(x=>x.itemId===_newLines[i].itemId);
    _newLines[i].qty=parseInt(e.target.value,10)||0;
    _newLines[i].packs=(r&&r.packSize)?Math.floor(_newLines[i].qty/r.packSize):0;
    render(); });

  const sv=$('nlSave');
  if(sv) sv.onclick=async()=>{
    const use=_newLines.filter(l=>l.itemId&&l.qty>0);
    if(!use.length){ alert('אין שורות עם כמות'); return; }
    const rows=FW.matchOrder(a, use.map(l=>({raw:'',sku:(a.items.find(i=>i.itemId===l.itemId)||{}).sku||'',
      name:(a.items.find(i=>i.itemId===l.itemId)||{}).name, qty:l.qty}))).rows;
    const over=rows.filter(r=>r.exceeds);
    if(over.length && !confirm('⚠️ אין מספיק מלאי פנוי ל-'+over.length+' שורות.\nלרשום את ההזמנה בכל זאת?')) return;
    const res=FW.placeOrder(a,rows,{orderRef:($('nlRef').value||'').trim(),dueDate:$('nlDue').value||null,
      date:_today(),by:_me()});
    if(!res.ok){ alert('נכשל: '+res.errors.join(', ')); return; }
    if(await save(_normAg(res.agreement))){ _newLines=[]; render();
      alert('✓ ההזמנה נרשמה ומשוריינת. הדפוס יסמן אותה כמוכנה כשתהיה מוכנה לאספקה.'); }
  };

}

/* ═══════════ עדכון עבודה מהמשרד ═══════════
   לחיצה על כרטיס-עבודה פותחת חלון: סטטוס · כמה יצא בפועל · הערה · הסרה מהרשימה.
   ⚠️ הכרטיס באפליקציה לא נערך — הכל נשמר בשכבה נפרדת (clerkJobs/<id>). */
let _jbLines=[], _jbState={};
function openJob(id){
  const c=_cards.find(x=>String(x.id)===String(id)); if(!c) return;
  const ov=_jobOv[c.id]||{};
  // הדפסה אחת יכולה להכיל כמה פריטים ולכמה לקוחות — מתחילים ממה שכבר נשמר
  _jbState={ status:(c.status==='done'?'done':'finishing'), note:ov.note||'', toStock:!ov.stockSynced };
  _jbLines=(ov.lines&&ov.lines.length)?ov.lines.map(l=>({name:l.name||'',customer:l.customer||'',qty:l.qty||0,packs:l.packs||0,packSize:l.packSize||0}))
    :[{name:c.name||'',customer:c.customer||'',qty:(ov.qty!=null?ov.qty:(parseInt(c.copies,10)||0)),packs:ov.packs||0,packSize:0}];
  _jbRender(c,ov);
}
function _jbRender(c,ov){
  let m=$('jobModal');
  if(!m){ m=document.createElement('div'); m.id='jobModal'; m.className='modal'; document.body.appendChild(m); }
  m.innerHTML=`<div class="modalIn" style="max-width:520px">
    <h3 style="margin:0 0 2px">🖨 ${esc(c.name||'עבודה')}</h3>
    <div class="muted" style="margin-bottom:10px">
      ${c.customer?esc(c.customer)+' · ':''}${c.copies?Number(c.copies).toLocaleString()+' עותקים':''}${c.pages?' · '+c.pages+' עמ׳':''}
      ${c.deliveryDate?' · לאספקה '+esc(c.deliveryDate):''}</div>
    <div style="display:grid;gap:9px">
      <label>סטטוס העבודה
        <select id="jbStatus" style="width:100%;margin-top:3px">
          <option value="finishing"${_jbState.status==='finishing'?' selected':''}>🖨 בייצור / בגימורים</option>
          <option value="done"${_jbState.status==='done'?' selected':''}>✅ העבודה הושלמה — מוכנה לאספקה</option>
        </select></label>
      <div>
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <b style="color:var(--press)">מה יצא בפועל</b>
          <button id="jbAdd" style="padding:3px 10px;font-size:.8rem">➕ הוסף פריט</button></div>
        <div class="muted" style="font-size:.78rem;margin-bottom:4px">בהדפסה משותפת (למשל פלייסמנטים לשיבא + עידית + ליבר) — שורה לכל פריט ולקוח.<br>מילוי <b>אריזות</b> + <b>יח׳ באריזה</b> מחשב את הסה״כ אוטומטית (10 × 1,000 = 10,000).</div>
        <div style="overflow-x:auto"><table>
          <thead><tr><th>פריט</th><th>לקוח</th><th>אריזות</th><th>יח׳ באריזה</th><th>סה״כ יח׳</th><th></th></tr></thead>
          <tbody>${_jbLines.map((l,i)=>`<tr>
            <td><input class="jbName" data-i="${i}" value="${esc(l.name)}" style="width:140px"></td>
            <td><input class="jbCust" data-i="${i}" value="${esc(l.customer)}" list="jbCustList" style="width:110px"></td>
            <td><input type="number" class="jbP" data-i="${i}" value="${l.packs||0}" min="0" style="width:70px"></td>
            <td><input type="number" class="jbPS" data-i="${i}" value="${l.packSize||0}" min="0" style="width:80px" placeholder="1000"></td>
            <td><input type="number" class="jbQ" data-i="${i}" value="${l.qty||0}" min="0" style="width:95px">
              ${(l.packs>0&&l.packSize>0)?`<div class="muted" style="font-size:.72rem">${l.packs} × ${l.packSize.toLocaleString()}</div>`:''}</td>
            <td><button class="jbDel danger" data-i="${i}">🗑</button></td></tr>`).join('')}</tbody>
          <tfoot><tr><th>סה״כ</th><th></th>
            <th>${_jbLines.reduce((a,l)=>a+(parseInt(l.packs,10)||0),0).toLocaleString()}</th><th></th>
            <th>${_jbLines.reduce((a,l)=>a+(parseInt(l.qty,10)||0),0).toLocaleString()}</th><th></th></tr></tfoot>
        </table></div>
        <datalist id="jbCustList">${_custNames().map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
      </div>
      <label style="display:flex;align-items:center;gap:7px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:7px 10px">
        <input type="checkbox" id="jbToStock" ${_jbState.toStock?'checked':''}>
        <span>📦 עדכן גם את <b>מלאי הלקוחות</b> באפליקציה בכמויות האלה
          ${ov.stockSynced?'<span class="muted">(כבר עודכן פעם אחת)</span>':''}</span></label>
      <label>הערה
        <input id="jbNote" style="width:100%;margin-top:3px" value="${esc(_jbState.note||'')}" placeholder="לדוגמה: חסרו 150, נאסף ע״י הלקוח"></label>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;justify-content:flex-end">
      <button id="jbRemove" class="danger" style="margin-inline-end:auto">🗑 הסר מהרשימה</button>
      ${Object.keys(ov).length?'<button id="jbReset">↩ בטל שינויי משרד</button>':''}
      <button id="jbCancel">ביטול</button>
      <button id="jbSave" class="primary">✓ שמור</button>
    </div>
    <div class="muted" style="margin-top:8px;font-size:.78rem">העדכון נשמר במסך המשרד בלבד — כרטיס העבודה באפליקציה לא משתנה.</div>`;
  $('jbCancel').onclick=()=>m.remove();
  // שומרים את השדות שמחוץ לטבלה, כדי שרינדור-מחדש לא ימחק אותם
  $('jbStatus').onchange=e=>{ _jbState.status=e.target.value; };
  $('jbNote').oninput=e=>{ _jbState.note=e.target.value; };
  $('jbToStock').onchange=e=>{ _jbState.toStock=e.target.checked; };
  $('jbAdd').onclick=()=>{ _jbLines.push({name:'',customer:'',qty:0,packs:0}); _jbRender(c,ov); };
  document.querySelectorAll('.jbDel').forEach(el=>el.onclick=()=>{ _jbLines.splice(+el.dataset.i,1); _jbRender(c,ov); });
  const bind=(cls,key,num)=>document.querySelectorAll(cls).forEach(el=>el.onchange=e=>{
    const i=+e.target.dataset.i;
    _jbLines[i][key]=num?(parseInt(e.target.value,10)||0):e.target.value.trim();
    if(num) _jbRender(c,ov);
  });
  bind('.jbName','name',false); bind('.jbCust','customer',false);
  const recalc=i=>{ const l=_jbLines[i];
    if((l.packs||0)>0 && (l.packSize||0)>0) l.qty=l.packs*l.packSize; };   // 10 × 1,000 = 10,000
  document.querySelectorAll('.jbP').forEach(el=>el.onchange=e=>{ const i=+e.target.dataset.i;
    _jbLines[i].packs=parseInt(e.target.value,10)||0; recalc(i); _jbRender(c,ov); });
  document.querySelectorAll('.jbPS').forEach(el=>el.onchange=e=>{ const i=+e.target.dataset.i;
    _jbLines[i].packSize=parseInt(e.target.value,10)||0; recalc(i); _jbRender(c,ov); });
  document.querySelectorAll('.jbQ').forEach(el=>el.onchange=e=>{ const i=+e.target.dataset.i;
    _jbLines[i].qty=parseInt(e.target.value,10)||0; _jbRender(c,ov); });

  $('jbSave').onclick=async()=>{
    const lines=_jbLines.filter(l=>(l.name||'').trim() && (parseInt(l.qty,10)||0)>0)
      .map(l=>({name:l.name.trim(),customer:(l.customer||'').trim(),qty:parseInt(l.qty,10)||0,
        packs:parseInt(l.packs,10)||0,packSize:parseInt(l.packSize,10)||0}));
    if(!lines.length){ alert('הזינו לפחות פריט אחד עם כמות'); return; }
    const rec={ status:$('jbStatus').value, lines:lines,
      qty:lines.reduce((a,l)=>a+l.qty,0), packs:lines.reduce((a,l)=>a+l.packs,0),
      note:($('jbNote').value||'').trim()||null, at:_today(), by:_me(),
      stockSynced:(_jobOv[c.id]||{}).stockSynced||false };
    // 📦 עדכון מלאי-הלקוחות באפליקציה — רק לשורות שיש להן לקוח
    if($('jbToStock').checked){
      const withCust=lines.filter(l=>l.customer);
      if(!withCust.length) alert('לא עודכן מלאי לקוחות — אין שורה עם שם לקוח.');
      else{
        const okSync=await _syncCustomerStock(withCust, c, +1, 'ייצור');
        if(okSync) rec.stockSynced=true;
      }
    }
    await _saveJobOv(c.id, rec, m);
  };
  $('jbRemove').onclick=async()=>{
    if(!confirm('להסיר את "'+(c.name||'')+'" מרשימת המשרד?\n(העבודה עצמה נשארת באפליקציה)')) return;
    await _saveJobOv(c.id, Object.assign({},_jobOv[c.id]||{},{removed:true,at:_today(),by:_me()}), m);
  };
  const rs=$('jbReset');
  if(rs) rs.onclick=async()=>{
    if(!confirm('לבטל את כל שינויי המשרד על העבודה הזו?')) return;
    await _saveJobOv(c.id, null, m);
  };
}
// שמות לקוחות להשלמה אוטומטית — מההסכמים וממלאי-הלקוחות באפליקציה
function _custNames(){
  const s=new Set();
  _all.forEach(a=>{ if(a.customer) s.add(a.customer); });
  Object.keys(_custStock||{}).forEach(k=>{ const n=_custStock[k]&&_custStock[k].name; if(n) s.add(n); });
  return [...s].sort((a,b)=>a.localeCompare(b,'he'));
}

/* 📦 עדכון "מלאי לקוחות" באפליקציה מתוך העבודה שהושלמה.
   ⚠️ כותבים לכל לקוח בנפרד (customerStock/<id>) ולא את כל הצומת —
      כדי לא לדרוס עריכות שנעשו במקביל באפליקציה. */
/* sign=+1 מוסיף למלאי הלקוח (ייצור), sign=-1 מוריד (מסירה ללקוח).
   ביטול אספקה מחזיר במדויק את מה שירד — ולכן משתמש באותה פונקציה עם הסימן ההפוך. */
async function _syncCustomerStock(lines, card, sign, label){
  sign = sign===-1 ? -1 : 1;
  if(!_isProd()){ alert('עדכון מלאי לקוחות פועל רק באתר החי (הגנת-סביבה).'); return false; }
  let root=_custStock;
  try{ const live=await _get('customerStock'); if(live && typeof live==='object') root=live; }
  catch(e){ alert('קריאת מלאי הלקוחות נכשלה — המלאי לא עודכן'); return false; }
  const res=FW.applyToCustomerStock(root,
    lines.map(l=>({customer:l.customer, item:l.name, qty:sign*Math.abs(parseInt(l.qty,10)||0), cardId:card&&card.id})),
    { by:_me(), ts:Date.now(), note:(label||'ממסך המשרד')+' — '+((card&&card.name)||'עבודה') });
  if(!res.ok){ alert('לא עודכן מלאי לקוחות (חסר לקוח או כמות)'); return false; }
  const summary=res.applied.map(a=>'• '+a.customer+' / '+a.item+': '+a.before.toLocaleString()+' → '+a.after.toLocaleString()).join('\n');
  if(!confirm((sign<0?'להוריד ממלאי הלקוחות?':'לעדכן את מלאי הלקוחות?')+'\n\n'+summary)) return false;
  try{
    for(const a of res.applied) await _put('customerStock/'+a.custId, res.stock[a.custId]);
  }catch(e){ alert('עדכון המלאי נכשל: '+(e.message||e)); return false; }
  _custStock=res.stock;
  alert('✓ מלאי הלקוחות עודכן\n\n'+summary);
  return true;
}

// שורות העבודה של לקוח מסוים (או כולן) — לעדכוני מלאי בעת מסירה/ביטול
function _jobLinesFor(card, customer){
  return FW.jobLines(card).filter(l=>l.customer && (!customer || l.customer===customer) && l.qty>0);
}

// האם ללקוח יש מלאי-לקוחות באפליקציה (ואז שווה לשאול אם להוריד ממנו)
function _hasCustStock(name){
  const n=String(name||'').replace(/\s+/g,' ').trim().toLowerCase();
  if(!n) return false;
  return Object.keys(_custStock||{}).some(k=>{ const s=_custStock[k];
    return s && !s._deleted && String(s.name||'').replace(/\s+/g,' ').trim().toLowerCase()===n; });
}

/* הזמנת-מסגרת שסופקה ללקוח שמוחזק לו מלאי — שואלים אם להוריד גם משם.
   sign=-1 מסירה · sign=+1 החזרה (ביטול אספקה). */
async function _orderStockPrompt(ag, orders, sign, label){
  if(!ag || !_hasCustStock(ag.customer)) return;
  const lines=[];
  (orders||[]).forEach(o=>FW.effectiveLines(o).forEach(l=>{
    if(l.qty>0) lines.push({ customer:ag.customer, name:l.name||'', qty:l.qty });
  }));
  if(!lines.length) return;
  const total=lines.reduce((a,l)=>a+l.qty,0).toLocaleString();
  if(!confirm('ל"'+ag.customer+'" מוחזק מלאי לקוחות.\n\n'
    +(sign<0?'להוריד ממנו את הפריטים שסופקו':'להחזיר אליו את הפריטים')+' ('+total+' יח׳)?')) return;
  await _syncCustomerStock(lines, { id:null, name:ag.customer }, sign, label||'הזמנת מסגרת');
}

async function _saveJobOv(id, rec, m){
  if(!_isProd()){ alert('שמירה פועלת רק באתר החי (הגנת-סביבה).'); return; }
  try{ await _put('clerkJobs/'+id, rec); }
  catch(e){ alert('שמירה נכשלה: '+(e.message||e)); return; }
  if(rec) _jobOv[id]=rec; else delete _jobOv[id];
  if(m) m.remove();
  await loadJobs();      // טוענים מחדש כדי שהשכבה תוחל על הכרטיס
  render();
}

/* ═══════════ עריכת הזמנה — גם אחרי שאושרה ═══════════
   אותו חלון כמו לעבודות: שורות, כמויות, אסמכתא, מועד, סטטוס.
   ⚠️ עריכה של הזמנה שכבר סופקה בונה מחדש את תנועות-המלאי (editOrder). */
let _edLines=[];
function openOrder(agId, orderId){
  const ag=_all.find(x=>x.agreementId===agId); if(!ag) return;
  const o=FW.findOrder(ag,orderId); if(!o) return;
  _edLines=FW.effectiveLines(o).map(l=>({itemId:l.itemId||null,name:l.name||'',sku:l.sku||'',
    qty:l.qty||0,packs:l.packs||0,packSize:l.packSize||0}));
  _edRender(ag,o);
}
function _edRender(ag,o){
  const b=FW.computeBalances(ag);
  let m=$('ordModal');
  if(!m){ m=document.createElement('div'); m.id='ordModal'; m.className='modal'; document.body.appendChild(m); }
  const opts=(ag.items||[]).map(it=>`<option value="${it.itemId}">${esc(it.name)}${it.sku?' ('+esc(it.sku)+')':''}</option>`).join('');

  m.innerHTML=`<div class="modalIn" style="max-width:720px">
    <h3 style="margin:0 0 2px">🧾 ${esc(FW.orderTitle(o))} — ${esc(ag.customer)}</h3>
    <div class="muted" style="margin-bottom:10px">
      ${st==='pending'?'ממתינה לייצור':st==='ready'?'מוכנה לאספקה':st==='supplied'?('סופקה '+esc(o.suppliedAt||'')):'בוטלה'}
      ${o.date?' · נקלטה '+esc(o.date):''}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <label>שם ההזמנה <input id="edTitle" style="width:190px" value="${esc(o.title||'')}" placeholder="לדוגמה: פלייסמנטים לפסח"></label>
      <label>אסמכתא <input id="edRef" style="width:130px" value="${esc(o.orderRef||'')}"></label>
      <label>לאספקה עד <input id="edDue" type="date" value="${esc(o.dueDate||'')}"></label>
      <label style="flex:1">הערה <input id="edNote" style="width:100%" value="${esc(o.notes||'')}"></label>
    </div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>פריט</th><th>אריזות</th><th>יח׳</th><th>במלאי פנוי</th><th></th></tr></thead>
      <tbody>${_edLines.map((l,i)=>{
        const bal=l.itemId?b.items.find(x=>x.itemId===l.itemId):null;
        return `<tr>

/* ═══════════ קליטת הזמנה מקובץ — גרירה למסך או בחירת קובץ ═══════════
   הקובץ מנותח לשורות, המשתמש *עורך ומאשר*, ואז נרשמת הזמנה ממתינה.
   לקוח עם הסכם מסגרת → השורות משויכות לפריטיו ומשריינות מלאי.
   לקוח אחר → נרשם כלקוח-הזמנות (kind='orders') והשורות נשמרות כשורות חופשיות. */
let _impRows=[], _impName='';
// כיסוי-המסך: מצב "גררו לכאן" מול מצב "עובד על הקובץ" — כדי שיהיה ברור מה קורה
function _dz(mode, title, sub){
  const z=$('dropZone'); if(!z) return;
  if(mode==='off'){ z.classList.remove('on','busy'); return; }
  z.classList.add('on');
  const busy=(mode==='busy');
  z.classList.toggle('busy', busy);
  $('dzIcon').textContent = busy ? '⏳' : '📥';
  $('dzTitle').textContent = title || (busy ? 'טוען את הקובץ…' : 'שחררו כאן את קובץ ההזמנה');
  $('dzSub').textContent   = sub   || (busy ? '' : 'PDF ותמונות → ניתוח AI · Excel · Word · CSV');
  $('dzBar').style.display = busy ? 'block' : 'none';
}

/* ── ניתוח בענן: אותו מנוע של מסך ההזמנות באפליקציה ──
   כותבים את הבקשה ל-aiRelay ב-Firebase; הפרוקסי המקומי מנתח וכותב תשובה.
   ⚠️ הדפדפן חסום מול localhost במדיניות ארגונית — לכן ממסר ולא קריאה ישירה. */
function _aiRelay(payload, onTick){
  if(!_isProd()) return Promise.reject(new Error('ניתוח AI פועל רק באתר החי (הגנת-סביבה)'));
  const id='r_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
  return _put('aiRelay/'+id, { ts:Date.now(), status:'pending', req:payload }).then(()=>
    new Promise((resolve,reject)=>{
      let tries=0; const max=60;                       // 60 × 1.5 שניות = 90 שניות
      const iv=setInterval(()=>{
        tries++;
        if(onTick) onTick(tries);
        _get('aiRelay/'+id+'/result').then(res=>{
          if(res!=null){
            clearInterval(iv); _put('aiRelay/'+id, null).catch(()=>{});
            if(res && res.error) reject(new Error('API '+res.error)); else resolve(res);
          } else if(tries>=max){
            clearInterval(iv); _put('aiRelay/'+id, null).catch(()=>{});
            reject(new Error('שרת הניתוח לא הגיב (ודא ש-start.bat פועל במחשב הדפוס)'));
          }
        }).catch(()=>{});
      }, 1500);
    }));
}
const _b64 = f => new Promise((res,rej)=>{ const r=new FileReader();
  r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(f); });

// ניתוח הזמנה עם ה-AI — שולחים את הקובץ עצמו (PDF/תמונה), לא טקסט מחולץ
async function _impAI(f){
  const nm=(f.name||'').toLowerCase();
  const isPdf=/\.pdf$/.test(nm), isImg=/\.(png|jpe?g|webp|gif)$/.test(nm);
  if(!isPdf && !isImg) throw new Error('ניתוח AI תומך ב-PDF ובתמונות. לאקסל/וורד השתמשו בקריאה הרגילה.');
  const b64=await _b64(f);
  const payload=SolanOrderAI.buildPayload(isPdf?{pdfB64:b64}
    :{imgB64:b64, mime:(f.type||'image/jpeg')});
  const data=await _aiRelay(payload, t=>{
    const sec=Math.round(t*1.5);
    const el=$('impMsg'); if(el) el.innerHTML='<span class="muted">🤖 מנתח בענן… '+sec+' שניות</span>';
    _dz('busy','🤖 מנתח את הקובץ', sec+' שניות · ממתין לתשובה מהשרת');
  });
  const ex=SolanOrderAI.parseOrderTags(SolanOrderAI.replyText(data));
  return { ex, rows:SolanOrderAI.toRows(ex) };
}

async function _impRead(f){
  if(!f) return;
  _dz('busy','טוען את '+f.name+'…','רגע, קורא את הקובץ');
  _openImport('קורא '+f.name+'…', true);
  try{
    // PDF/תמונה → אותו מנוע AI של מסך ההזמנות. אקסל/וורד/CSV → קריאה לפי עמודות.
    if(/\.(pdf|png|jpe?g|webp|gif)$/i.test(f.name||'')){
      $('impMsg').innerHTML='<span class="muted">🤖 מנתח את '+esc(f.name)+' בענן…</span>';
      _dz('busy','🤖 מנתח את '+f.name,'הקובץ נשלח לניתוח — זה לוקח כמה שניות');
      try{
        const {ex,rows}=await _impAI(f);
        _impRows=rows; _impName=f.name;
        // ⚠️ בהזמנות עידית מופיע מספר-אתר בלבד — מתרגמים אותו לשם וכתובת מהרשימה
        const site=ex.siteNum?SolanIditSites.findSite(ex.siteNum):null;
        if(site){
          _impPickCustomer(ex.customer||'עידית');
          $('impRef').value=('אתר '+SolanIditSites.siteLabel(site)).slice(0,80);
        }
        else if(ex.customer) _impPickCustomer(ex.customer);
        else if(ex.siteNum) $('impRef').value='אתר '+ex.siteNum+' (לא נמצא ברשימת האתרים)';
        if(ex.date) $('impDue').value=/^\d{4}-\d{2}-\d{2}$/.test(ex.date)?ex.date:'';
        const addr=(site&&(site.address||site.name))||ex.address;
        $('impNote').value=[ex.notes,(site&&site.notes)||'',addr].filter(Boolean).join(' · ');
        _dz('off');
        $('impMsg').innerHTML='<span class="ok">✓ נותח '+esc(f.name)+' — '+rows.length+' שורות'
          +(site?(' · אתר '+esc(SolanIditSites.siteLabel(site))):(ex.customer?(' · לקוח: '+esc(ex.customer)):''))+'</span>';
        _impRender(); return;
      }catch(e){
        _dz('busy','ניתוח AI נכשל','ממשיך בקריאת טקסט רגילה…');
        $('impMsg').innerHTML='<span class="bad">ניתוח AI נכשל: '+esc(e.message||e)+'</span><br>'
          +'<span class="muted">ממשיך בקריאת טקסט רגילה…</span>';
      }
    }
    const res=await FWFile.read(f);
    const ps=FW.parseSheetRows(res.rows||[]);
    let lines=ps.lines;
    if(!lines.length) lines=FW.parseOrderText(res.text||'');
    if(!lines.length){ _dz('off'); $('impMsg').innerHTML='<span class="bad">לא זוהו שורות עם כמות בקובץ. אפשר להקליד ידנית למטה.</span>';
      _impRows=[]; _impName=f.name; _impRender(); return; }
    _impRows=lines.map(l=>({ sku:l.sku||'', name:l.name||l.sku||'', qty:l.qty||0, packs:l.packs||0 }));
    _impName=f.name;
    _dz('off');
    $('impMsg').innerHTML='<span class="ok">✓ נקרא '+esc(f.name)+' — זוהו '+_impRows.length+' שורות</span>';
    _impRender();
  }catch(e){ _dz('off'); $('impMsg').innerHTML='<span class="bad">קריאה נכשלה: '+esc(e.message||e)+'</span>'; _impRows=[]; _impRender(); }
}

// בוחר את הלקוח שה-AI זיהה; אם אינו קיים — ממלא אותו כלקוח חדש
function _impPickCustomer(name){
  const sel=$('impCust'); if(!sel) return;
  const ag=FW.findAgreementForCustomer(_all, name);
  if(ag){ sel.value=ag.agreementId; }
  else { sel.value='NEW'; $('impNewCust').value=name; }
  sel.dispatchEvent(new Event('change'));
}

  if(msg) $('impMsg').innerHTML=busy?('<span class="muted">'+esc(msg)+'</span>'):esc(msg);
}

// תצוגה מקדימה: לכל שורה מוצג האם היא משויכת לפריט בהסכם, וכמה יישאר פנוי
function _impRender(){
  const agId=$('impCust').value, ag=_all.find(x=>x.agreementId===agId)||null;
  const b=ag?FW.computeBalances(ag):{items:[]};
  const used={};
  const rows=_impRows.map((r,i)=>{
    const it=ag?FW.findItem(ag, r.sku||r.name):null;
    const bal=it?b.items.find(x=>x.itemId===it.itemId):null;
    // ⚠️ שורה שהקובץ נתן לה רק "קרטונים" ואין לה פריט בהסכם (אין גודל-אריזה) —
    //    המספר נלקח ככמות, אחרת השורה הייתה נשמטת בשקט בשמירה.
    let qty=r.qty|0;
    if(!qty && r.packs>0) qty = (bal && bal.packSize>0) ? r.packs*bal.packSize : r.packs;
    const prior=used[it?it.itemId:'-']||0;
    const after=bal?(bal.availableQty-prior-qty):null;
    if(it) used[it.itemId]=prior+qty;
    return `<tr${after!=null&&after<0?' style="background:#fff7ed"':''}>
      <td><input class="ipSku" data-i="${i}" value="${esc(r.sku)}" style="width:95px" placeholder="ריק=ללא"></td>
      <td><input class="ipName" data-i="${i}" value="${esc(r.name)}" style="width:180px"></td>
      <td>${bal&&bal.packSize?`<input type="number" class="ipPacks" data-i="${i}" value="${r.packs||0}" min="0" style="width:70px"><div class="muted" style="font-size:.72rem">×${bal.packSize.toLocaleString()}</div>`:'<span class="muted">—</span>'}</td>
      <td><input type="number" class="ipQty" data-i="${i}" value="${qty}" min="0" style="width:100px"></td>
      <td>${it?'<span class="ok">✓ '+esc(it.name)+'</span>':'<span class="muted">שורה חופשית</span>'}</td>
      <td class="${after!=null&&after<0?'bad':''}">${after!=null?after.toLocaleString():'<span class="muted">—</span>'}</td>
      <td><button class="ipDel danger" data-i="${i}">🗑</button></td></tr>`;
  }).join('');
  $('impPrev').innerHTML=_impRows.length?`<div style="overflow-x:auto"><table>
      <thead><tr><th>מק״ט</th><th>תיאור</th><th>אריזות</th><th>יח׳</th><th>שיוך</th><th>יישאר פנוי</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="muted" style="margin-top:6px;font-size:.8rem">שורה שלא שויכה לפריט בהסכם תירשם כפי שהיא — לתיעוד ולזרימת העבודה, בלי לגעת במלאי.</div>`
    :'<div class="muted">אין שורות. אפשר להוסיף שורה ידנית.</div>';
  document.querySelectorAll('.ipSku').forEach(el=>el.onchange=e=>{ _impRows[+e.target.dataset.i].sku=e.target.value.trim(); _impRender(); });
  document.querySelectorAll('.ipName').forEach(el=>el.onchange=e=>{ _impRows[+e.target.dataset.i].name=e.target.value.trim(); _impRender(); });
  document.querySelectorAll('.ipQty').forEach(el=>el.onchange=e=>{ const i=+e.target.dataset.i;
    _impRows[i].qty=parseInt(e.target.value,10)||0; _impRows[i].packs=0; _impRender(); });
  document.querySelectorAll('.ipPacks').forEach(el=>el.onchange=e=>{ const i=+e.target.dataset.i;
    _impRows[i].packs=parseInt(e.target.value,10)||0; _impRows[i].qty=0; _impRender(); });
  document.querySelectorAll('.ipDel').forEach(el=>el.onclick=e=>{ _impRows.splice(+e.target.dataset.i,1); _impRender(); });
}

async function _impSave(){
  const sel=$('impCust').value;
  let ag;
  if(sel==='NEW'){
    const nm=($('impNewCust').value||'').trim();
    if(!nm){ alert('הזינו שם לקוח'); return; }
    const exist=FW.findAgreementForCustomer(_all,nm);
    if(exist) ag=exist;                                   // לקוח קיים — נרשם לתוכו ולא נפתחת כפילות
    else{
      const b=FW.buildAgreement({customer:nm,kind:$('impNewKind').value,createdAt:new Date().toISOString(),createdBy:_me()});
      if(!b.ok){ alert('לקוח לא תקין: '+b.errors.join(', ')); return; }
      ag=_normAg(b.agreement);
    }
  } else ag=_all.find(x=>x.agreementId===sel);
  if(!ag){ alert('בחרו לקוח'); return; }

  // אותה נוסחה כמו בתצוגה המקדימה — מה שנראה על המסך הוא מה שנרשם
  const lines=_impRows.filter(r=>(r.name||r.sku)).map(r=>{
    const it=FW.findItem(ag, r.sku||r.name);
    const ps=it?(parseInt(it.packSize,10)||0):0;
    let qty=r.qty||0;
    if(!qty && r.packs>0) qty = ps>0 ? r.packs*ps : r.packs;
    return {raw:'',sku:r.sku||'',name:r.name||r.sku,qty:qty,packs:(ps>0?(r.packs||0):0)};
  }).filter(l=>l.qty>0);
  if(!lines.length){ alert('אין שורות עם כמות לרישום'); return; }
  const dropped=_impRows.filter(r=>(r.name||r.sku)).length-lines.length;
  if(dropped>0 && !confirm(dropped+' שורות ללא כמות לא יירשמו.\nלהמשיך?')) return;
  // שורות שיש להן פריט בהסכם → משוריינות · השאר → שורות חופשיות
  const m=FW.matchOrder(ag,lines);
  const rows=m.rows.map(r=> r.matched ? r : Object.assign({},r,{free:true,name:r.name||r.sku}));
  const over=rows.filter(r=>r.exceeds);
  if(over.length && !confirm('⚠️ אין מספיק מלאי פנוי ל-'+over.length+' שורות.\nלרשום את ההזמנה בכל זאת?')) return;
  const res=FW.placeOrder(ag,rows,{title:($('impTitle').value||'').trim(),orderRef:($('impRef').value||'').trim(),dueDate:$('impDue').value||null,
    date:_today(),by:_me(),
    notes:[($('impNote').value||'').trim(), _impName?('מקור: '+_impName):''].filter(Boolean).join(' · ')||null});
  if(!res.ok){ alert('נכשל: '+res.errors.join(', ')); return; }
  if(await save(_normAg(res.agreement))){
    const free=res.order.lines.filter(l=>l.free).length;
    $('impModal').remove(); _impRows=[]; _sel=res.agreement.agreementId; _tab='flow'; render();
    alert('✓ ההזמנה נרשמה ('+res.order.lines.length+' שורות'+(free?(', מתוכן '+free+' ללא שיוך למלאי'):'')+').');
  }
}

// גרירה לכל המסך
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{
  if(!e.dataTransfer || [...e.dataTransfer.types||[]].indexOf('Files')<0) return;
  e.preventDefault(); if(!$('dropZone').classList.contains('busy')) _dz('drop'); }));
['dragleave','dragend'].forEach(ev=>document.addEventListener(ev,e=>{
  if(e.relatedTarget || $('dropZone').classList.contains('busy')) return; _dz('off'); }));
document.addEventListener('drop',e=>{
  if(!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
  e.preventDefault();
  _impRead(e.dataTransfer.files[0]);
});
$('impBtn').onclick=()=>$('impFile').click();
// הזמנה ידנית — לכל לקוח, גם כזה שאין לו הסכם מסגרת
$('manBtn').onclick=()=>{ _impRows=[{sku:'',name:'',qty:0,packs:0}]; _impName='';
  _openImport('רשמו את שורות ההזמנה'); _impRender(); };
$('impFile').onchange=e=>{ const f=e.target.files[0]; e.target.value=''; _impRead(f); };

$('reloadBtn').onclick=load;
load();
setInterval(()=>{ if(!_busy && !_newLines.length && !$('impModal') && $('dnPrint').style.display!=='block') load(); }, 60000);
</script>
