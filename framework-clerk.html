<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>משרד — הזמנות ותעודות משלוח | סולן הדפסות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>try{ if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }catch(e){}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="framework-orders.js"></script>
<script src="framework-file-reader.js"></script>
<style>
  :root{--press:#2d3561;--gold:#c9a84c;--gold-light:#e8d5a3;--line:#d0c8b8;--danger:#c62828;
        --ok:#16a34a;--warn:#f59e0b;--bg:#e8e4dc;--card:#fff;--ink:#1a1a2e;--muted:#6b7280}
  *{box-sizing:border-box}
  body{font-family:'Heebo',Arial,sans-serif;background:var(--bg);
    background-image:repeating-linear-gradient(0deg,transparent,transparent 28px,rgba(0,0,0,.04) 28px,rgba(0,0,0,.04) 29px);
    color:var(--ink);margin:0;padding:16px;direction:rtl;min-height:100vh}
  h3{margin:0 0 8px;color:var(--press);font-weight:800}
  .brand{background:var(--press);color:#fff;padding:11px 20px;border-radius:12px;margin-bottom:14px;display:flex;
    align-items:center;gap:10px;box-shadow:0 3px 12px rgba(0,0,0,.25);flex-wrap:wrap}
  .brand b{font-size:1.2rem;font-weight:900} .brand span.g{color:var(--gold)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
  button{background:#fff;color:var(--press);border:1.5px solid var(--line);border-radius:7px;padding:8px 14px;cursor:pointer;
    font-family:inherit;font-size:.9rem;font-weight:700;transition:all .15s}
  button:hover:not(:disabled){border-color:var(--gold)} button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--gold);border-color:var(--gold);color:#1a1a2e;font-weight:800}
  button.danger{color:var(--danger)}
  input,select,textarea{background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:7px;padding:8px 10px;font-family:inherit;font-size:.9rem}
  .muted{color:var(--muted);font-size:.86rem} .ok{color:#15803d;font-weight:700} .bad{color:var(--danger);font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:.88rem}
  th{background:#faf8f2;color:var(--press);text-align:right;padding:7px 9px;border-bottom:2px solid var(--line);font-weight:800}
  td{padding:7px 9px;border-bottom:1px solid #eee;vertical-align:top}
  .wrap{display:flex;gap:14px;align-items:flex-start}
  .side{flex:0 0 235px;max-width:235px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;
    position:sticky;top:8px;max-height:calc(100vh - 40px);overflow-y:auto}
  .sideT{padding:9px 12px;background:var(--press);color:#fff;font-weight:800;font-size:.86rem}
  .cItem{display:flex;justify-content:space-between;gap:8px;padding:11px 12px;cursor:pointer;border-bottom:1px solid #eee;
    font-weight:700;color:var(--press);font-size:.9rem}
  .cItem:hover{background:#faf8f2} .cItem.on{background:var(--press);color:#fff}
  .cItem .b{background:var(--warn);color:#fff;border-radius:10px;padding:1px 8px;font-size:.72rem;font-weight:800}
  .main{flex:1;min-width:0}
  .pill{font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:10px;white-space:nowrap;color:#fff}
  .stat{display:inline-block;background:#faf8f2;border:1px solid var(--line);border-radius:9px;padding:6px 12px;margin:0 0 6px 6px}
  .stat b{font-size:1.15rem;display:block;color:var(--press)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tab{background:#fff;border:1.5px solid var(--line);border-radius:9px 9px 0 0;padding:9px 16px;cursor:pointer;font-weight:800;color:var(--press)}
  .tab.on{background:var(--press);color:#fff;border-color:var(--press)}
  .tab .n{background:var(--warn);color:#fff;border-radius:9px;padding:0 7px;font-size:.72rem;margin-inline-start:5px}
  .ready{border-inline-start:5px solid var(--ok);background:#f0fdf4}
  /* ── לוח זרימת עבודות ── */
  .flow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
  .fCol{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)}
  .fHead{color:#fff;font-weight:800;padding:9px 12px;font-size:.9rem;display:flex;justify-content:space-between;align-items:center}
  .fN{background:rgba(255,255,255,.28);border-radius:10px;padding:0 9px;font-size:.8rem}
  .fHint{padding:6px 12px;background:#faf8f2;color:var(--muted);font-size:.76rem;border-bottom:1px solid var(--line)}
  .fBody{padding:9px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 250px);overflow-y:auto}
  .fCard{border:1px solid var(--line);border-inline-start:5px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff}
  .fCard:hover{border-color:var(--gold)}
  @media(max-width:900px){.flow{grid-template-columns:1fr}.fBody{max-height:none}}
  /* ── גרירת קובץ למסך ── */
  #dropZone{display:none;position:fixed;inset:0;z-index:400;background:rgba(45,53,97,.92);color:#fff;
    align-items:center;justify-content:center;text-align:center;font-size:1.5rem;font-weight:800;
    border:6px dashed var(--gold);pointer-events:none}
  #dropZone.on{display:flex}
  .modal{position:fixed;inset:0;z-index:320;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;padding:14px}
  .modalIn{background:#fff;border-radius:14px;max-width:940px;width:97vw;max-height:92vh;overflow:auto;padding:16px 18px}
  /* ── תעודת משלוח להדפסה ── */
  #dnPrint{display:none}
  @media print{
    body{background:#fff;padding:0;background-image:none}
    body>*{display:none !important}
    #dnPrint{display:block !important;padding:14mm 12mm;font-size:12pt}
    #dnPrint table{font-size:11pt} #dnPrint .noprint{display:none}
  }
  .dnHead{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #2d3561;padding-bottom:8px;margin-bottom:12px}
  .dnBox{border:1px solid #999;border-radius:6px;padding:8px 12px;font-size:.9em}
  @media(max-width:760px){.wrap{flex-direction:column}.side{flex:auto;max-width:none;width:100%;position:static;max-height:200px}}
</style>
</head>
<body>
<div class="brand">
  <b>סולן <span class="g">הדפסות</span></b>
  <span style="color:var(--gold-light);font-size:.85rem">· משרד — הזמנות לקוחות ותעודות משלוח</span>
  <span style="margin-right:auto"></span>
  <span id="whoami" class="muted" style="color:var(--gold-light)"></span>
  <button id="impBtn" class="primary">📥 קליטת הזמנה מקובץ</button>
  <input type="file" id="impFile" accept=".pdf,.xlsx,.xls,.docx,.csv,.txt" style="display:none">
  <button id="reloadBtn">🔄 רענן</button>
</div>
<div id="app"><div class="card muted">טוען…</div></div>
<div id="dnPrint"></div>
<div id="dropZone"><div><div style="font-size:3rem">📥</div>שחררו כאן את קובץ ההזמנה<div class="muted" style="color:#e8d5a3;font-weight:400">PDF · Excel · Word · CSV</div></div></div>

<script>
const $ = id => document.getElementById(id);
const FW = window.FrameworkOrders;
const _FBURL = 'https://solan-printing-default-rtdb.europe-west1.firebasedatabase.app';
const _APIKEY = 'AIzaSyAFp99furP4L5hqTI-horBHmGZC9s13dGg';
let _tok = { id:null, exp:0 };
function _isProd(){ return /solanprinting\.github\.io/.test(location.host); }
function _today(){ return new Date().toISOString().slice(0,10); }
function esc(t){ return String(t==null?'':t).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function _n(v){ return (Math.round((+v||0)*100)/100).toLocaleString('he-IL'); }
// ⚠️ אות סופית חוזרת לצורה הרגילה לפני הסיומת: קרטון → קרטונים (לא "קרטוןים")
const _FIN={'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
function _plu(w){ w=String(w||'קרטון'); if(/ה$/.test(w)) return w.slice(0,-1)+'ות';
  const l=w.slice(-1); return (_FIN[l]?w.slice(0,-1)+_FIN[l]:w)+'ים'; }
// שם המשתמש נשמר ע"י האפליקציה הראשית — לתיעוד מי הפיק את התעודה
function _me(){ try{ const u=JSON.parse(localStorage.getItem('solanCurrentUser')||'null'); return (u&&u.name)||'משרד'; }catch(e){ return 'משרד'; } }

function _auth(){
  if(_tok.id && Date.now()<_tok.exp-120000) return Promise.resolve(_tok.id);
  return fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+_APIKEY,
    {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})})
    .then(r=>r.ok?r.json():Promise.reject(new Error('auth '+r.status)))
    .then(j=>{ _tok={id:j.idToken,exp:Date.now()+(parseInt(j.expiresIn)||3600)*1000}; return j.idToken; });
}
const _P='frameworkAgreements';
function _get(p){ return _auth().then(t=>fetch(_FBURL+'/'+p+'.json?auth='+t).then(r=>r.ok?r.json():null)); }
// ⚠️ חובה לבדוק r.ok — אחרת כישלון-כתיבה נראה כהצלחה והנתון "נעלם".
function _put(p,o){ return _auth().then(t=>fetch(_FBURL+'/'+p+'.json?auth='+t,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)})
  .then(r=>{ if(!r.ok) return r.text().then(x=>{ throw new Error('כתיבה נכשלה ('+r.status+') '+String(x||'').slice(0,120)); }); return r; })); }

let _all=[], _sel='ALL', _tab='flow', _busy=false, _newLines=[];

// ⚠️ Firebase RTDB לא שומר מערך ריק, ומערך "עם חורים" חוזר כאובייקט — חובה לנרמל.
function _arr(v){
  if (Array.isArray(v)) return v.filter(x=>x!=null);
  if (v && typeof v==='object') return Object.keys(v).sort((a,b)=>(+a)-(+b)).map(k=>v[k]).filter(x=>x!=null);
  return [];
}
function _normAg(a){
  if(!a || typeof a!=='object') return a;
  a.items=_arr(a.items); a.movements=_arr(a.movements);
  a.orders=_arr(a.orders).map(o=>{ if(o){ o.lines=_arr(o.lines); if(o.ready) o.ready.lines=_arr(o.ready.lines); } return o; });
  a.topups=_arr(a.topups).map(t=>{ if(t) t.lines=_arr(t.lines); return t; });
  a.deliveryNotes=_arr(a.deliveryNotes).map(d=>{ if(d){ d.lines=_arr(d.lines); d.orders=_arr(d.orders); } return d; });
  return a;
}

async function load(){
  try{
    const obj=await _get(_P);
    _all = obj && typeof obj==='object' ? Object.values(obj).filter(a=>a&&a.agreementId).map(_normAg) : [];
    _all.sort((a,b)=>String(a.customer||'').localeCompare(String(b.customer||''),'he'));
  }catch(e){ _all=[]; }
  if(_sel!=='ALL' && !_all.some(a=>a.agreementId===_sel)) _sel='ALL';
  render();
}
function cur(){ return _all.find(a=>a.agreementId===_sel)||null; }
// לקוחות עם הסכם מסגרת ומלאי (להבדיל מלקוחות שרק נרשמות להם הזמנות)
function _frame(){ return _all.filter(a=>a.kind!=='orders' && (a.items||[]).length); }
function allNotes(){ return _all.reduce((s,a)=>s.concat(a.deliveryNotes||[]),[]); }
async function save(ag){
  if(!_isProd()){ alert('שמירה פועלת רק באתר החי (הגנת-סביבה).'); return false; }
  if(_busy){ alert('פעולה קודמת עדיין נשמרת — נסו שוב בעוד רגע'); return false; } _busy=true;
  _normAg(ag);
  try{ await _put(_P+'/'+ag.agreementId, ag);
    const i=_all.findIndex(a=>a.agreementId===ag.agreementId);
    if(i>=0) _all[i]=ag; else _all.push(ag);
    return true;
  }catch(e){ alert('שמירה נכשלה: '+(e.message||e)); return false; }
  finally{ _busy=false; }
}

/* ═══════════ תצוגה ═══════════ */
function render(){
  $('whoami').textContent='שלום, '+_me();
  const side = _all.length ? _all.map(a=>{
    const ready=(a.orders||[]).filter(o=>o&&o.status==='ready').length;
    return `<div class="cItem${a.agreementId===_sel?' on':''}" data-a="${a.agreementId}">
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">🏢 ${esc(a.customer)}</span>
      ${ready?`<span class="b" title="הזמנות מוכנות לאספקה">${ready} מוכן</span>`:''}</div>`;
  }).join('') : '<div style="padding:14px" class="muted">אין לקוחות עם הסכם מסגרת</div>';

  const readyAll=_all.reduce((s,a)=>s+(a.orders||[]).filter(o=>o&&o.status==='ready').length,0);
  const allItem=`<div class="cItem${_sel==='ALL'?' on':''}" data-a="ALL">
    <span>🔄 כל העבודות</span>${readyAll?`<span class="b">${readyAll} מוכן</span>`:''}</div>
    <div class="cItem${_sel==='AGR'?' on':''}" data-a="AGR" style="border-bottom:2px solid var(--line)">
    <span>📋 הסכמי מסגרת</span><span class="b" style="background:var(--press)">${_frame().length}</span></div>`;

  const a=cur();
  $('app').innerHTML=`<div class="wrap">
    <aside class="side"><div class="sideT">לקוחות (${_all.length})</div>${allItem}${side}</aside>
    <section class="main">${_sel==='ALL'?detailAll():_sel==='AGR'?detailAgreements()
      :(a?detail(a):'<div class="card muted">בחרו לקוח מהרשימה.</div>')}</section>
  </div>`;
  document.querySelectorAll('[data-a]').forEach(el=>el.onclick=()=>{ _sel=el.dataset.a; _newLines=[];
    if((_sel==='ALL'||_sel==='AGR') && _tab!=='flow') _tab='flow'; render(); });
  wire(a);
}

// מבט-על: זרימת כל העבודות בבית-הדפוס, בלי להיכנס ללקוח מסוים
function detailAll(){
  const groups=_all.map(a=>({ag:a, orders:(a.orders||[]).slice().reverse()}));
  const cnt=s=>groups.reduce((n,g)=>n+g.orders.filter(o=>o.status===s).length,0);
  return `<div class="card" style="padding:10px 14px">
      <span class="stat">ממתינות לייצור<b style="color:#b45309">${cnt('pending')}</b></span>
      <span class="stat">מוכנות לאספקה<b style="color:#15803d">${cnt('ready')}</b></span>
      <span class="stat">סופקו<b>${cnt('supplied')}</b></span>
      <span class="stat">לקוחות<b>${_all.length}</b></span>
    </div>
    <div class="muted" style="margin:0 2px 10px">כל העבודות של כל הלקוחות. לרישום הזמנה או להוצאת תעודה — בחרו לקוח מהרשימה בצד.</div>
    ${flowBoard(groups)}`;
}

function detail(a){
  const b=FW.computeBalances(a), t=b.totals;
  const orders=(a.orders||[]).slice().reverse();
  const ready=orders.filter(o=>o.status==='ready');
  const notes=(a.deliveryNotes||[]).slice().reverse();

  // המסך הראשי = זרימת העבודות. המלאי חי בקטגוריה "📋 הסכמי מסגרת" (ובטופס ההזמנה עצמו).
  let body='';
  if(_tab==='new')        body = newOrderCard(a,b);
  else if(_tab==='ready') body = readyCard(ready,a);
  else if(_tab==='notes') body = notesCard(notes,a);
  else                    body = flowBoard([{ag:a, orders:orders}]);

  const open=orders.filter(o=>o.status==='pending'||o.status==='ready').length;
  return `<div class="tabs">
      <div class="tab${_tab==='flow'?' on':''}" data-t="flow">🔄 זרימת עבודות${open?`<span class="n">${open}</span>`:''}</div>
      <div class="tab${_tab==='new'?' on':''}" data-t="new">➕ הזמנה חדשה</div>
      <div class="tab${_tab==='ready'?' on':''}" data-t="ready">✅ מוכן לאספקה${ready.length?`<span class="n">${ready.length}</span>`:''}</div>
      <div class="tab${_tab==='notes'?' on':''}" data-t="notes">📄 תעודות משלוח${notes.length?`<span class="n">${notes.length}</span>`:''}</div>
    </div>${body}`;
}

/* ═══════════ 📋 הסכמי מסגרת — הלקוחות והמלאי שלהם ═══════════
   כאן (ולא במסך העבודות) יושב המלאי: כמה יש, כמה משוריין, כמה פנוי להתחייבות. */
function stockCard(a){
  const b=FW.computeBalances(a), t=b.totals;
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px">
      <h3 style="margin:0">📋 ${esc(a.customer)}</h3>
      <div class="muted">${a.agreementNo?'מס׳ הסכם '+esc(a.agreementNo)+' · ':''}${a.endDate?'בתוקף עד '+esc(a.endDate):''}</div>
    </div>
    <div style="margin:8px 0 4px">
      <span class="stat">יתרה במלאי<b>${t.remainingQty.toLocaleString()}</b></span>
      <span class="stat">משוריין<b style="color:#b45309">${t.pendingQty.toLocaleString()}</b></span>
      <span class="stat">פנוי<b class="${t.shortItems?'bad':''}">${t.availableQty.toLocaleString()}</b></span>
      <span class="stat">ניצול ההסכם<b>${t.pctUsed}%</b></span>
    </div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>מק״ט</th><th>פריט</th><th>יח׳ באריזה</th><th>יתרה במלאי</th><th>משוריין להזמנות</th><th>פנוי להזמנה חדשה</th></tr></thead>
      <tbody>${b.items.map(r=>`<tr>
        <td>${r.sku?`<code>${esc(r.sku)}</code>`:'<span class="muted">—</span>'}</td>
        <td><b>${esc(r.name)}</b></td>
        <td>${r.packSize?`${r.packSize.toLocaleString()} <span class="muted">/${esc(r.packName)}</span>`:'<span class="muted">—</span>'}</td>
        <td>${r.remainingQty.toLocaleString()}${r.remainingPacks!=null?`<div class="muted" style="font-size:.75rem">≈ ${r.remainingPacks.toLocaleString()} ${esc(_plu(r.packName))}</div>`:''}</td>
        <td>${r.pendingQty?`<span style="color:#b45309;font-weight:700">${r.pendingQty.toLocaleString()}</span>`:'<span class="muted">—</span>'}</td>
        <td class="${r.shortForPending?'bad':''}"><b>${r.availableQty.toLocaleString()}</b>${r.availablePacks!=null?`<div class="muted" style="font-size:.75rem">≈ ${r.availablePacks.toLocaleString()} ${esc(_plu(r.packName))}</div>`:''}</td>
      </tr>`).join('')||'<tr><td colspan="6" class="muted" style="text-align:center;padding:12px">אין פריטים בהסכם</td></tr>'}</tbody></table></div>
    <div style="margin-top:8px"><button class="goOrder" data-ag="${a.agreementId}">➕ הזמנה חדשה ללקוח זה</button></div>
  </div>`;
}
function detailAgreements(){
  return `<div class="card" style="padding:10px 14px">
      <b style="color:var(--press)">📋 הסכמי מסגרת</b>
      <div class="muted" style="margin-top:3px">הלקוחות שיש להם הסכם מסגרת והמלאי שנשאר לכל אחד.
        אפשר להתחייב ללקוח רק על העמודה <b>פנוי</b> — היתר כבר משוריין להזמנות שטרם סופקו.</div>
    </div>
    ${_frame().map(stockCard).join('')||'<div class="card muted">אין הסכמי מסגרת עדיין.</div>'}`;
}

/* ═══════════ לוח זרימת עבודות ═══════════
   שלושה שלבים לפי סטטוס ההזמנה. זה המסך הראשי של הפקיד — לא טבלת מלאי. */
const _STAGES=[

  const note=(a.deliveryNotes||[]).find(d=>(d.orders||[]).some(x=>x.orderId===o.orderId));

function flowBoard(groups){
  const cols=_STAGES.map(s=>{
    const cards=[];
    groups.forEach(g=>{ (g.orders||[]).filter(o=>o.status===s.k).forEach(o=>cards.push(_orderCard(o,g.ag,s.k))); });
    return `<div class="fCol">

      <div class="fHint">${s.hint}</div>

    </div>`;
  }).join('');
  return `<div class="flow">${cols}</div>`;
}

/* ═══════════ אירועים ═══════════ */
function wire(a){
  document.querySelectorAll('[data-t]').forEach(el=>el.onclick=()=>{ _tab=el.dataset.t; render(); });
  // מלוח-הזרימה אפשר לקפוץ ישר ללקוח וללשונית הרלוונטית
  document.querySelectorAll('.goReady').forEach(el=>el.onclick=e=>{
    e.stopPropagation(); _sel=el.dataset.ag; _tab='ready'; render(); });
  document.querySelectorAll('.goOrder').forEach(el=>el.onclick=e=>{
    e.stopPropagation(); _sel=el.dataset.ag; _tab='new'; _newLines=[]; render(); });
  document.querySelectorAll('.dnView').forEach(el=>el.onclick=()=>{
    const ag=_all.find(x=>x.agreementId===el.dataset.ag)||a; if(!ag) return;
    const d=(ag.deliveryNotes||[]).find(x=>x.noteId===el.dataset.d); if(d) showNote(d,ag);
  });
  if(!a) return;                                   // מבט "כל הלקוחות" — אין טפסים לחווט

  const b=FW.computeBalances(a);
  const add=$('nlAdd');
  if(add) add.onclick=()=>{ const it=(a.items||[])[0]; if(!it) return;
    _newLines.push({itemId:it.itemId,packs:0,qty:0}); render(); };
  document.querySelectorAll('.nlDel').forEach(el=>el.onclick=()=>{ _newLines.splice(+el.dataset.i,1); render(); });
  document.querySelectorAll('.nlIt').forEach(el=>el.onchange=e=>{ const i=+e.target.dataset.i;
    _newLines[i].itemId=e.target.value; _newLines[i].packs=0; _newLines[i].qty=0; render(); });
  document.querySelectorAll('.nlPacks').forEach(el=>el.onchange=e=>{ const i=+e.target.dataset.i;
    const r=b.items.find(x=>x.itemId===_newLines[i].itemId);
    _newLines[i].packs=parseInt(e.target.value,10)||0;
    _newLines[i].qty=_newLines[i].packs*((r&&r.packSize)||0);      // אריזות → יחידות
    render(); });
  document.querySelectorAll('.nlQty').forEach(el=>el.onchange=e=>{ const i=+e.target.dataset.i;
    const r=b.items.find(x=>x.itemId===_newLines[i].itemId);
    _newLines[i].qty=parseInt(e.target.value,10)||0;
    _newLines[i].packs=(r&&r.packSize)?Math.floor(_newLines[i].qty/r.packSize):0;
    render(); });

  const sv=$('nlSave');
  if(sv) sv.onclick=async()=>{
    const use=_newLines.filter(l=>l.itemId&&l.qty>0);
    if(!use.length){ alert('אין שורות עם כמות'); return; }
    const rows=FW.matchOrder(a, use.map(l=>({raw:'',sku:(a.items.find(i=>i.itemId===l.itemId)||{}).sku||'',
      name:(a.items.find(i=>i.itemId===l.itemId)||{}).name, qty:l.qty}))).rows;
    const over=rows.filter(r=>r.exceeds);
    if(over.length && !confirm('⚠️ אין מספיק מלאי פנוי ל-'+over.length+' שורות.\nלרשום את ההזמנה בכל זאת?')) return;
    const res=FW.placeOrder(a,rows,{orderRef:($('nlRef').value||'').trim(),dueDate:$('nlDue').value||null,
      date:_today(),by:_me()});
    if(!res.ok){ alert('נכשל: '+res.errors.join(', ')); return; }
    if(await save(_normAg(res.agreement))){ _newLines=[]; render();
      alert('✓ ההזמנה נרשמה ומשוריינת. הדפוס יסמן אותה כמוכנה כשתהיה מוכנה לאספקה.'); }
  };

  const mk=$('dnMake');
  if(mk) mk.onclick=async()=>{
    const ids=[...document.querySelectorAll('.rdChk')].filter(c=>c.checked).map(c=>c.dataset.o);
    if(!ids.length){ alert('לא נבחרו הזמנות'); return; }
    const num=FW.nextNoteNumber(allNotes());
    if(!confirm('להפיק תעודת משלוח מס׳ '+num+' על '+ids.length+' הזמנות?\n\nההזמנות יסומנו כסופקו והמלאי ירד בהתאם.')) return;
    const res=FW.issueDeliveryNote(a,ids,{number:num,date:_today(),by:_me(),
      reference:($('dnRef').value||'').trim(), notes:($('dnNote').value||'').trim()});
    if(!res.ok){ alert('נכשל: '+res.errors.join(', ')); return; }
    if(await save(_normAg(res.agreement))){ _tab='notes'; render(); showNote(res.note,a); }
  };

}

/* ═══════════ קליטת הזמנה מקובץ — גרירה למסך או בחירת קובץ ═══════════
   הקובץ מנותח לשורות, המשתמש *עורך ומאשר*, ואז נרשמת הזמנה ממתינה.
   לקוח עם הסכם מסגרת → השורות משויכות לפריטיו ומשריינות מלאי.
   לקוח אחר → נרשם כלקוח-הזמנות (kind='orders') והשורות נשמרות כשורות חופשיות. */
let _impRows=[], _impName='';

async function _impRead(f){
  if(!f) return;
  _openImport('קורא '+f.name+'…', true);
  try{
    const res=await FWFile.read(f);
    const ps=FW.parseSheetRows(res.rows||[]);
    let lines=ps.lines;
    if(!lines.length) lines=FW.parseOrderText(res.text||'');
    if(!lines.length){ $('impMsg').innerHTML='<span class="bad">לא זוהו שורות עם כמות בקובץ. אפשר להקליד ידנית למטה.</span>';
      _impRows=[]; _impName=f.name; _impRender(); return; }
    _impRows=lines.map(l=>({ sku:l.sku||'', name:l.name||l.sku||'', qty:l.qty||0, packs:l.packs||0 }));
    _impName=f.name;
    $('impMsg').innerHTML='<span class="ok">✓ נקרא '+esc(f.name)+' — זוהו '+_impRows.length+' שורות</span>';
    _impRender();
  }catch(e){ $('impMsg').innerHTML='<span class="bad">קריאה נכשלה: '+esc(e.message||e)+'</span>'; _impRows=[]; _impRender(); }
}

function _openImport(msg,busy){
  let m=$('impModal');
  if(!m){ m=document.createElement('div'); m.id='impModal'; m.className='modal'; document.body.appendChild(m);
    m.innerHTML=`<div class="modalIn">
      <h3 style="margin:0 0 4px">📥 קליטת הזמנה מקובץ</h3>
      <div class="muted" style="margin-bottom:10px">הכלי מנתח את הקובץ — ואפשר <b>לערוך כל שורה</b> לפני האישור.</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
        <span>לקוח:</span><select id="impCust" style="min-width:210px"></select>
        <input id="impNewCust" placeholder="שם הלקוח החדש" style="display:none;width:190px">
        <span>מס׳ הזמנה:</span><input id="impRef" style="width:150px">
        <span>לאספקה עד:</span><input id="impDue" type="date">
      </div>
      <div id="impMsg" class="muted" style="margin-bottom:8px"></div>
      <div id="impPrev"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:flex-end">
        <button id="impAddRow">➕ שורה ידנית</button>
        <button id="impCancel">ביטול</button>
        <button id="impSave" class="primary">✓ רשום הזמנה</button>
      </div></div>`;
    $('impCancel').onclick=()=>{ m.remove(); _impRows=[]; };
    $('impAddRow').onclick=()=>{ _impRows.push({sku:'',name:'',qty:0,packs:0}); _impRender(); };
    $('impSave').onclick=_impSave;
    $('impCust').onchange=()=>{ $('impNewCust').style.display = $('impCust').value==='NEW'?'':'none'; _impRender(); };
  }
  const sel=$('impCust');
  if(sel && !sel.options.length){
    sel.innerHTML=_all.map(a=>`<option value="${a.agreementId}"${a.agreementId===_sel?' selected':''}>${esc(a.customer)}${a.kind==='orders'?'':' (הסכם מסגרת)'}</option>`).join('')
      +'<option value="NEW">➕ לקוח חדש…</option>';
  }
  if(msg) $('impMsg').innerHTML=busy?('<span class="muted">'+esc(msg)+'</span>'):esc(msg);
}

// תצוגה מקדימה: לכל שורה מוצג האם היא משויכת לפריט בהסכם, וכמה יישאר פנוי
function _impRender(){
  const agId=$('impCust').value, ag=_all.find(x=>x.agreementId===agId)||null;
  const b=ag?FW.computeBalances(ag):{items:[]};
  const used={};
  const rows=_impRows.map((r,i)=>{
    const it=ag?FW.findItem(ag, r.sku||r.name):null;
    const bal=it?b.items.find(x=>x.itemId===it.itemId):null;
    // ⚠️ שורה שהקובץ נתן לה רק "קרטונים" ואין לה פריט בהסכם (אין גודל-אריזה) —
    //    המספר נלקח ככמות, אחרת השורה הייתה נשמטת בשקט בשמירה.
    let qty=r.qty|0;
    if(!qty && r.packs>0) qty = (bal && bal.packSize>0) ? r.packs*bal.packSize : r.packs;
    const prior=used[it?it.itemId:'-']||0;
    const after=bal?(bal.availableQty-prior-qty):null;
    if(it) used[it.itemId]=prior+qty;
    return `<tr${after!=null&&after<0?' style="background:#fff7ed"':''}>
      <td><input class="ipSku" data-i="${i}" value="${esc(r.sku)}" style="width:95px" placeholder="ריק=ללא"></td>
      <td><input class="ipName" data-i="${i}" value="${esc(r.name)}" style="width:180px"></td>
      <td>${bal&&bal.packSize?`<input type="number" class="ipPacks" data-i="${i}" value="${r.packs||0}" min="0" style="width:70px"><div class="muted" style="font-size:.72rem">×${bal.packSize.toLocaleString()}</div>`:'<span class="muted">—</span>'}</td>
      <td><input type="number" class="ipQty" data-i="${i}" value="${qty}" min="0" style="width:100px"></td>
      <td>${it?'<span class="ok">✓ '+esc(it.name)+'</span>':'<span class="muted">שורה חופשית</span>'}</td>
      <td class="${after!=null&&after<0?'bad':''}">${after!=null?after.toLocaleString():'<span class="muted">—</span>'}</td>
      <td><button class="ipDel danger" data-i="${i}">🗑</button></td></tr>`;
  }).join('');
  $('impPrev').innerHTML=_impRows.length?`<div style="overflow-x:auto"><table>
      <thead><tr><th>מק״ט</th><th>תיאור</th><th>אריזות</th><th>יח׳</th><th>שיוך</th><th>יישאר פנוי</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="muted" style="margin-top:6px;font-size:.8rem">שורה שלא שויכה לפריט בהסכם תירשם כפי שהיא — לתיעוד ולזרימת העבודה, בלי לגעת במלאי.</div>`
    :'<div class="muted">אין שורות. אפשר להוסיף שורה ידנית.</div>';
  document.querySelectorAll('.ipSku').forEach(el=>el.onchange=e=>{ _impRows[+e.target.dataset.i].sku=e.target.value.trim(); _impRender(); });
  document.querySelectorAll('.ipName').forEach(el=>el.onchange=e=>{ _impRows[+e.target.dataset.i].name=e.target.value.trim(); _impRender(); });
  document.querySelectorAll('.ipQty').forEach(el=>el.onchange=e=>{ const i=+e.target.dataset.i;
    _impRows[i].qty=parseInt(e.target.value,10)||0; _impRows[i].packs=0; _impRender(); });
  document.querySelectorAll('.ipPacks').forEach(el=>el.onchange=e=>{ const i=+e.target.dataset.i;
    _impRows[i].packs=parseInt(e.target.value,10)||0; _impRows[i].qty=0; _impRender(); });
  document.querySelectorAll('.ipDel').forEach(el=>el.onclick=e=>{ _impRows.splice(+e.target.dataset.i,1); _impRender(); });
}

async function _impSave(){
  const sel=$('impCust').value;
  let ag;
  if(sel==='NEW'){
    const nm=($('impNewCust').value||'').trim();
    if(!nm){ alert('הזינו שם לקוח'); return; }
    const exist=FW.findAgreementForCustomer(_all,nm);
    if(exist) ag=exist;                                   // לקוח קיים — נרשם לתוכו ולא נפתחת כפילות
    else{
      const b=FW.buildAgreement({customer:nm,kind:'orders',createdAt:new Date().toISOString(),createdBy:_me()});
      if(!b.ok){ alert('לקוח לא תקין: '+b.errors.join(', ')); return; }
      ag=_normAg(b.agreement);
    }
  } else ag=_all.find(x=>x.agreementId===sel);
  if(!ag){ alert('בחרו לקוח'); return; }

  // אותה נוסחה כמו בתצוגה המקדימה — מה שנראה על המסך הוא מה שנרשם
  const lines=_impRows.filter(r=>(r.name||r.sku)).map(r=>{
    const it=FW.findItem(ag, r.sku||r.name);
    const ps=it?(parseInt(it.packSize,10)||0):0;
    let qty=r.qty||0;
    if(!qty && r.packs>0) qty = ps>0 ? r.packs*ps : r.packs;
    return {raw:'',sku:r.sku||'',name:r.name||r.sku,qty:qty,packs:(ps>0?(r.packs||0):0)};
  }).filter(l=>l.qty>0);
  if(!lines.length){ alert('אין שורות עם כמות לרישום'); return; }
  const dropped=_impRows.filter(r=>(r.name||r.sku)).length-lines.length;
  if(dropped>0 && !confirm(dropped+' שורות ללא כמות לא יירשמו.\nלהמשיך?')) return;
  // שורות שיש להן פריט בהסכם → משוריינות · השאר → שורות חופשיות
  const m=FW.matchOrder(ag,lines);
  const rows=m.rows.map(r=> r.matched ? r : Object.assign({},r,{free:true,name:r.name||r.sku}));
  const over=rows.filter(r=>r.exceeds);
  if(over.length && !confirm('⚠️ אין מספיק מלאי פנוי ל-'+over.length+' שורות.\nלרשום את ההזמנה בכל זאת?')) return;
  const res=FW.placeOrder(ag,rows,{orderRef:($('impRef').value||'').trim(),dueDate:$('impDue').value||null,
    date:_today(),by:_me(),notes:_impName?('מקור: '+_impName):null});
  if(!res.ok){ alert('נכשל: '+res.errors.join(', ')); return; }
  if(await save(_normAg(res.agreement))){
    const free=res.order.lines.filter(l=>l.free).length;
    $('impModal').remove(); _impRows=[]; _sel=res.agreement.agreementId; _tab='flow'; render();
    alert('✓ ההזמנה נרשמה ('+res.order.lines.length+' שורות'+(free?(', מתוכן '+free+' ללא שיוך למלאי'):'')+').');
  }
}

// גרירה לכל המסך
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{
  if(!e.dataTransfer || [...e.dataTransfer.types||[]].indexOf('Files')<0) return;
  e.preventDefault(); $('dropZone').classList.add('on'); }));
['dragleave','dragend'].forEach(ev=>document.addEventListener(ev,e=>{
  if(e.relatedTarget) return; $('dropZone').classList.remove('on'); }));
document.addEventListener('drop',e=>{
  if(!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
  e.preventDefault(); $('dropZone').classList.remove('on');
  _impRead(e.dataTransfer.files[0]);
});
$('impBtn').onclick=()=>$('impFile').click();
$('impFile').onchange=e=>{ const f=e.target.files[0]; e.target.value=''; _impRead(f); };

$('reloadBtn').onclick=load;
load();
setInterval(()=>{ if(!_busy && !_newLines.length && !$('impModal') && $('dnPrint').style.display!=='block') load(); }, 60000);
</script>
</body>
