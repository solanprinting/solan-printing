   כאן ישבה הזדהות אנונימית משלה. עכשיו auth-guard.js הוא המקור היחיד:
   כשיש משתמש מחובר מוחזר האסימון **שלו**, ורק במצב-תצפית בלי משתמש נופלים
   לאנונימי — וגם זה במקום אחד בקוד, כדי שמחיקתו ב-B+4 תהיה שורה אחת.
   ⚠️ בלי נפילה-לאחור מקומית: אם השומר לא נטען זו תקלת-פריסה, והיא חייבת
   להישמע. שתי מערכות-אסימון במקביל = שני משתמשים שונים לאותו אדם.
   ⚠️ החתימה נשמרה (Promise<string|null>) — כל קורא קיים ממשיך לעבוד. */
async function _fbAuthToken(){

/* ── איכות הדפדוף (בקשת-בעלים 2026-07-30: "שהלקוח יראה באיכות מקסימלית") ──
   שני שלבים, כי רינדור *כל* העיתון באיכות-שיא היה מפיל מכשירים ניידים

let _fromCache = false;      // האם מה שמוצג כרגע הוא מטמון (תצוגה מהירה) ולא רינדור-אמת

   זהה, אותם ערכי אלפא כמו המסכה שבקובץ). מה ששבור היה שלב ה*ציור*: אותה
   גרפיקה נצבעה גם אטומה וגם דרך מסכה → האלפא הוחל פעמיים → רוח דהויה.
   הבעלים אימת שהמנוע החדש מצייר נכון, ולכן הוא ברירת-המחדל (PdfEngine).

const $ = id => document.getElementById(id);

// הורדה עם מד-התקדמות אמיתי (fetch לא מדווח התקדמות) — כדי שלא ייראה "מסך תקוע" בקבצים גדולים
function _fetchWithProgress(url, onPct){
  return new Promise(function(res, rej){
    try{
      var x = new XMLHttpRequest();
      x.open('GET', url); x.responseType = 'arraybuffer';
      x.onprogress = function(e){
        try{
          var mb = (e.loaded/1048576).toFixed(1);
          if (e.lengthComputable && e.total) onPct(Math.round(e.loaded/e.total*100), mb, (e.total/1048576).toFixed(1));
          else onPct(0, mb, 0);
        }catch(_){}
      };
      x.onload = function(){ (x.status>=200 && x.status<300) ? res(x.response) : rej(new Error('HTTP '+x.status)); };
      x.onerror = function(){ rej(new Error('שגיאת רשת')); };
      x.send();
    }catch(e){ rej(e); }
  });
}

}

// קריאת תיבות (MediaBox/TrimBox) מ-PDF דרך pdf-lib → אחוזי חיתוך (trimFrac) לכל עמוד
async function _trimFracsFromPdf(bytes){
  try {
    const doc = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption:true });
    return doc.getPages().map(pg => {
      let mb, tb;
      try { mb = pg.getMediaBox(); } catch(e){}
      try { tb = pg.getTrimBox(); } catch(e){}
      if (!mb || !tb || !tb.width || !tb.height) return null;
      const l = (tb.x - mb.x) / mb.width,
            t = (mb.y + mb.height - (tb.y + tb.height)) / mb.height,
            w = tb.width / mb.width, h = tb.height / mb.height;
      if (l > 0.003 || t > 0.003 || w < 0.997 || h < 0.997)
        return { l: Math.max(0,l), t: Math.max(0,t), w: Math.min(1,w), h: Math.min(1,h), wmm: tb.width*25.4/72, hmm: tb.height*25.4/72 };
      return null;
    });
  } catch(e){ return []; }
}
// מפצל עמודי "כפולה" (רוחב ≈ פי-2 מהחציון) לשני עמודים בודדים לתצוגה תקינה (RTL: חצי ימין קודם). אידמפוטנטי.
async function splitSpreadsPdf(bytes){
  try {
    if (!(bytes instanceof Uint8Array)) { try { bytes = new Uint8Array(bytes); } catch(e){} }   // cross-realm safety
    const src = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption:true });
    const pages = src.getPages();
    if (!pages.length) return bytes;
    const ws = pages.map(p=>p.getWidth()).slice().sort((a,b)=>a-b);
    const med = ws[Math.floor(ws.length/2)] || 0;
    const isDbl = p => med>0 && p.getWidth() > med*1.5;
    if (!pages.some(isDbl)) return bytes;
    const out = await PDFLib.PDFDocument.create();
    for (let i=0;i<pages.length;i++){
      const sp = pages[i], w=sp.getWidth(), h=sp.getHeight();
      if (isDbl(sp)){
        const half=w/2;
        const embR = await out.embedPage(sp, { left:half, bottom:0, right:w, top:h }); out.addPage([half,h]).drawPage(embR);
        const embL = await out.embedPage(sp, { left:0, bottom:0, right:half, top:h }); out.addPage([half,h]).drawPage(embL);
      } else { const [cp] = await out.copyPages(src, [i]); out.addPage(cp); }
    }
    return await out.save();
  } catch(e){ console.warn('splitSpreadsPdf failed', e); return bytes; }
}

/* סורק את העמוד לציור-עם-מסכת-שקיפות. רשימת-הפעולות כבר נבנתה בזמן הרינדור,
   ולכן הקריאה כאן זולה. הממצא הופך לאזהרה בעמוד עצמו — כדי שלא יאשרו עיתון
   לפי תצוגה שאינה נאמנה, גם לפני שבאג-הציור עצמו נפתר. */
async function _scanTransparency(pdf, pageNo){
  if (!window.PdfTransparency || !pdfjsLib || !pdfjsLib.OPS) return null;
  try {
    const page = await pdf.getPage(pageNo);
    const ops = await page.getOperatorList();
    return PdfTransparency.scanPage(ops, pdfjsLib.OPS);
  } catch(e){ return null; }
}
/* אזהרת-שקיפות מוצגת *רק* במנוע הישן. במנוע החדש הציור נכון, ואזהרה שם היא
   רעש-שקר שמפחיד לקוחות על עמודים תקינים. */
function _renderPageWarn(){
  const el = $('pgWarn'); if (!el) return;
  const eng = _engineNew ? 'new' : 'old';
  const risky = showingPages().filter(i => window.PdfEngine
    ? PdfEngine.shouldWarn(eng, _tScan[i]) : (!_engineNew && _tScan[i] && _tScan[i].risky));
  if (!risky.length){ el.innerHTML = ''; return; }
  const worst = risky.map(i => _tScan[i]).sort((a,b)=>b.doubleMasked-a.doubleMasked)[0];
  el.innerHTML = '<span>⚠️ ' + esc(PdfTransparency.warningText(worst)) + '</span>'
    + '<button id="pwPdf">📄 פתח את הקובץ המקורי</button>';
  var b1 = $('pwPdf'); if (b1) b1.onclick = _openOriginal;
}
function _openOriginal(){
  if (!_pdfUrlForBoxes) return;
  window.open(_pdfUrlForBoxes, '_blank', 'noopener');
}
// החלפה בין המנוע העדכני (ברירת-מחדל) לישן — לבדיקה אם משהו נראה חשוד
function _toggleEngine(){
  var u = new URL(location.href);
  if (u.searchParams.get('engine') === 'old') u.searchParams.delete('engine');
  else u.searchParams.set('engine', 'old');
  location.href = u.toString();
}

async function renderPage(pdf, pageNo, targetH, q){
  const page = await pdf.getPage(pageNo);
  const v1 = page.getViewport({ scale:1 });
  const dpr = Math.min(2, (window.devicePixelRatio || 1));
  const scale = Math.min(RENDER_SCALE_CAP, ((targetH || BASE_H) * dpr) / v1.height);
  const vp = page.getViewport({ scale });
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.floor(vp.width)); c.height = Math.max(1, Math.floor(vp.height));
  const cx = c.getContext('2d');
  // רקע לבן מפורש: עמוד עם שקיפות נראה אחרת על קנבס שקוף, וב-JPEG שקיפות הופכת לשחור
  cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext: cx, viewport: vp }).promise;
  page.cleanup();
  return c.toDataURL('image/jpeg', q || BASE_Q);
}

/* ── שלב 2: איכות-שיא לעמודים שמוצגים כרגע ──────────────────────────────
   מטמון LRU קטן בזיכרון בלבד; לא נשמר ולא מועלה לשום מקום. */
let _pdfDoc = null, _baseDone = false;
const _hi = new Map(), _hiBusy = new Set();
function srcFor(i){ return _hi.get(i) || imgs[i]; }
async function _ensureHi(list){
  if (!_pdfDoc || !_baseDone || _fromCache) return;   // לא מתחרים במעבר-הבסיס
  for (const i of list){
    if (_hi.has(i)) { const v = _hi.get(i); _hi.delete(i); _hi.set(i, v); continue; }   // רענון LRU
    if (_hiBusy.has(i)) continue;
    _hiBusy.add(i);
    try {
      const src = await renderPage(_pdfDoc, i + 1, HI_H, HI_Q);
      _hi.set(i, src);
      while (_hi.size > HI_MAX) _hi.delete(_hi.keys().next().value);
      if (showingPages().indexOf(i) >= 0) renderViewer();     // מוצג עדיין → מחליפים בתמונה החדה
    } catch(e){ /* נשאר באיכות-הבסיס */ }
    finally { _hiBusy.delete(i); }
  }
}

// דפדוף כפולה RTL
function showingPages(){
  if (!imgs.length) return [];
  if (vIndex === 0) return [0];
  const left = vIndex % 2 === 1 ? vIndex : vIndex - 1;
  return [left, left + 1].filter(i => i < imgs.length);
}
function renderViewer(){
  const spread = $('spread');
  if (!imgs.length) return;
  const s = showingPages();
  $('vlabel').textContent = `עמוד ${s.map(i=>i+1).join('–')} מתוך ${imgs.length}`;
  $('vprev').disabled = vIndex <= 0;
  $('vnext').disabled = s[s.length-1] >= imgs.length - 1;
  const two = s.length === 2;
  // עוטף את הכפולה ביחידה אחת (.zoomWrap) — הזום מוחל עליה, לא על כל עמוד בנפרד
  spread.innerHTML = '<div class="zoomWrap">' + s.map((i, pos) => {
    const tf = metas[i];
    if (tf && (tf.w < 1 || tf.h < 1)) {
      // חותכים ל-TrimBox רק בצד השדרה (חיבור נקי); בצדדים החיצוניים מציגים בליד + צלבי חיתוך + מסגרת trim
      // חוק-הברזל: עמוד אי-זוגי שדרה-ימין · זוגי שדרה-שמאל. חל גם על עמוד בודד.
      // באג שתוקן: לשער (עמוד 1, אי-זוגי) היה מקובע 'left' ולכן הגלישה הוצגה מימין במקום משמאל.
      const spine = PageSpine.spineForIndex(i);
      const sp = PageSpine.netSpec(tf, spine);
      const mc = `aspect-ratio:${sp.arr.toFixed(4)};background-image:url('${srcFor(i)}');`
        + `background-size:${sp.sizeW.toFixed(3)}% 100%;background-position:${sp.posX.toFixed(3)}% 0%;`;
      const f = sp.frame;
      const fb = `border:1.4px dashed #e11d48;`
        + (f.skip === 'left' ? 'border-left:none;' : '') + (f.skip === 'right' ? 'border-right:none;' : '');
      const fst = `left:${f.left.toFixed(2)}%;top:${f.top.toFixed(2)}%;width:${f.width.toFixed(2)}%;height:${f.height.toFixed(2)}%;${fb}`;
      return `<div class="page"><div class="cropwrap"><div class="mediacrop" style="${mc}"></div><div class="trimframe" style="${fst}"></div>${_cropMarksHtml(f)}</div><div class="pgnum">עמוד ${i+1}</div></div>`;
    }
    return `<div class="page"><img src="${srcFor(i)}" alt=""><div class="pgnum">עמוד ${i+1}</div></div>`;
  }).join('') + '</div>';
  if (window._pvZoomApply) _pvZoomApply();   // שומר על מצב-הזום גם אחרי רינדור-מחדש
  _renderPageWarn();
  _ensureHi(s);      // העמודים שעל המסך → רינדור חוזר באיכות-שיא (מחליף כשמוכן)
}
// חישוב אזור התצוגה (חיתוך שדרה בלבד) + מיקום מסגרת ה-trim בתוך העמוד, לפי TrimBox
function _pageNetSpec(tf, spine){
  if (window.PageSpine) return PageSpine.netSpec(tf, spine);
  const mediaHmm = tf.hmm / tf.h, mediaWmm = tf.wmm / tf.w;
  let shownL, shownR;
  if (spine === 'left'){ shownL = tf.l; shownR = 1; }            // חותך בליד שמאל (שדרה), מציג עד ימין
  else if (spine === 'right'){ shownL = 0; shownR = tf.l + tf.w; } // חותך בליד ימין (שדרה), מציג עד שמאל
  else { shownL = 0; shownR = 1; }                                 // עמוד יחיד — כל הבליד
  const shownW = shownR - shownL;
  const arr = (shownW * mediaWmm) / mediaHmm;
  const posX = shownW < 1 ? (shownL / (1 - shownW) * 100) : 0;
  const sizeW = 100 / shownW;
  const trimL = (tf.l - shownL) / shownW, trimR = (tf.l + tf.w - shownL) / shownW;
  return { arr, sizeW, posX, frame: { left: trimL*100, top: tf.t*100, width: (trimR-trimL)*100, height: tf.h*100, skip: spine } };
}
// צלבי חיתוך — טיקים שחורים בפינות ה-trim (מדלג על צד השדרה). f = frame ב-% מתוך cropwrap.
function _cropMarksHtml(f){
  const arm = 9, gap = 1;   // px
  const r = (f.left + f.width), b = (f.top + f.height);
  const H = (leftCss, topPct) => `<div class="cmark" style="${leftCss};top:calc(${topPct}% - 0.7px);width:${arm}px;height:1.4px"></div>`;
  const V = (leftPct, topCss) => `<div class="cmark" style="left:calc(${leftPct}% - 0.7px);${topCss};width:1.4px;height:${arm}px"></div>`;
  let out = '';
  if (f.skip !== 'left'){   // פינות שמאל (top-left + bottom-left)
    out += H(`left:calc(${f.left}% - ${gap+arm}px)`, f.top) + V(f.left, `top:calc(${f.top}% - ${gap+arm}px)`);
    out += H(`left:calc(${f.left}% - ${gap+arm}px)`, b)     + V(f.left, `top:calc(${b}% + ${gap}px)`);
  }
  if (f.skip !== 'right'){  // פינות ימין (top-right + bottom-right)
    out += H(`left:calc(${r}% + ${gap}px)`, f.top) + V(r, `top:calc(${f.top}% - ${gap+arm}px)`);
    out += H(`left:calc(${r}% + ${gap}px)`, b)     + V(r, `top:calc(${b}% + ${gap}px)`);
  }
  return out;
}
function step(d){
  if (vIndex === 0) vIndex = d > 0 ? 1 : 0;
  else vIndex = Math.max(0, Math.min(vIndex + d*2, imgs.length - 1));
  if (vIndex > 0 && vIndex % 2 === 0) vIndex -= 1;
  renderViewer();
}
$('vprev').onclick = () => step(-1);
$('vnext').onclick = () => step(+1);
$('vfs').onclick = () => { const v=$('viewer'); if (document.fullscreenElement) document.exitFullscreen(); else (v.requestFullscreen||v.webkitRequestFullscreen).call(v); };
/* הכפתורים "📄 הקובץ המקורי" ו-"⚙️ מנוע תצוגה ישן" הוסרו מהסרגל לבקשת הבעלים
   (2026-07-30) — המנוע העדכני מצייר נכון, ולכן הם היו רעש. הפונקציות נשארות:
   ?engine=old עדיין עובד לבדיקה, והאזהרה על עמודי-שקיפות (שמופיעה רק במנוע
   הישן) עדיין מציעה לפתוח את הקובץ המקורי. */
// ── זום בדפדוף (לחצן + גלגלת + גרירה) — לצפייה מקרוב בגיליון שהלקוח העלה ──
(function(){
  var sp=$('spread'), btn=$('vzoom'); if(!sp||!btn) return;
  var on=false, sc=1, tx=0, ty=0, drag=null;
  /* ⚠️ שני באגים שתוקנו (2026-07-30):
     1) הזום לא עבד בעיתונים שמצהירים קו-חיתוך — עמוד כזה מוצג כ-.cropwrap
        (רקע + מסגרת + צלבים) ולא כ-<img>, והבורר חיפש רק canvas/img.
     2) אחרי התיקון הראשון, כל עמוד הוגדל סביב *המרכז שלו* — ולכן בכפולה שני
        העמודים גדלו זה-לתוך-זה והעמוד השמאלי עלה על הימני.
     הפתרון לשניהם: מגדילים את הכפולה כ**יחידה אחת** (.zoomWrap שעוטפת את שני
     העמודים). כך היחס והמפגש בשדרה נשמרים בכל רמת-זום. */
  function zoomEl(){ return sp.querySelector('.zoomWrap'); }
  function apply(){
    var t = zoomEl();
    if (t){
      t.style.transform = 'translate('+tx+'px,'+ty+'px) scale('+sc+')';
      t.style.cursor = (on && sc>1) ? 'grab' : (on ? 'zoom-in' : '');
    }
    sp.style.overflow = on ? 'hidden' : '';
    btn.textContent = on ? ('🔍 זום '+Math.round(sc*100)+'%') : '🔍 זום';
    btn.style.background = on ? '#c9a84c' : ''; btn.style.color = on ? '#1a1a2e' : '';
  }
  function reset(){ sc=1; tx=0; ty=0; apply(); }
  window._pvZoomReset = reset;                       // מעבר-עמוד מאפס
  window._pvZoomApply = apply;                       // רינדור-מחדש (איכות-שיא) לא מאבד את הזום
  btn.onclick=function(){ on=!on; if(!on) reset(); else apply(); };
  sp.addEventListener('wheel', function(e){
    if(!on) return; e.preventDefault();
    var prev=sc; sc=Math.min(6, Math.max(1, sc*(e.deltaY<0?1.15:1/1.15)));
    if(sc===1){ tx=0; ty=0; } else { var k=sc/prev; tx*=k; ty*=k; }
    apply();
  }, {passive:false});
  sp.addEventListener('mousedown', function(e){ if(!on||sc<=1) return; e.preventDefault(); drag={x:e.clientX-tx,y:e.clientY-ty}; });
  window.addEventListener('mousemove', function(e){ if(!drag) return; tx=e.clientX-drag.x; ty=e.clientY-drag.y; apply(); });
  window.addEventListener('mouseup', function(){ drag=null; apply(); });
  sp.addEventListener('dblclick', function(){ if(on) reset(); });
  ['vprev','vnext'].forEach(function(id){ var b=$(id); if(b) b.addEventListener('click', function(){ setTimeout(reset,0); }); });
})();
document.addEventListener('keydown', e => { if (e.key==='ArrowLeft') step(+1); if (e.key==='ArrowRight') step(-1); });

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fail(msg){ showOverlay(msg, true); throw new Error(msg); }
</script>
</body>
</html>
