<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>צפייה בעיתון — סולן הדפסות</title>
<!-- ⚠️ 07/08/2026 — vendor/ ולא cdnjs; תגיות חוסמות-פרסור שרצות לפני
     lib-loader, ולכן לא היו מכוסות ע"י מנגנון-המראות. ראה proof-client.html. -->
<script src="vendor/pdf.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>

<!-- סימוני-עמודים (עיצוב-מחדש 13/08/2026): הלוגיקה ב-shop-issue (טהורה),
     הציור והגרירה ב-page-marks — משותפים למסך-הדפוס ולדפדוף הזה. -->

<script src="cover-split.js?v=1786878466"></script>
<script src="page-marks.js?v=1786878466"></script>

     ב-localStorage), ו-SolanGuard הוא שומר-הצוות. בלי המודול הזה

     אחרת הדף היה מבקש אסימון לפני שיש מי שיענה. ראה auth-guard.js. -->
<script src="firebase-auth.bundle.js?v=1786878466"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --press:#2d3561; --press-d:#222a4d; --gold:#c9a84c; --gold-light:#e8d5a3; --line:#e5e7eb; --ink:#1f2937; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Heebo',system-ui,"Segoe UI",Arial,sans-serif; color:var(--ink);
         background:linear-gradient(180deg,#eef1f6 0%,#f5f6f9 100%); min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  .brandbar { width:100%; background:linear-gradient(135deg,var(--press) 0%,var(--press-d) 100%); color:#fff;
    padding:14px 20px; box-shadow:0 4px 18px rgba(45,53,97,.28); display:flex; align-items:center; justify-content:center;
    gap:13px; position:relative; margin-bottom:12px; }
  .brandbar::after { content:''; position:absolute; left:0; right:0; bottom:0; height:3px;
    background:linear-gradient(90deg,var(--gold),var(--gold-light),var(--gold)); }
  .brandbar .logo { width:42px; height:42px; border-radius:11px; background:rgba(255,255,255,.1);
    border:1.5px solid rgba(201,168,76,.6); display:flex; align-items:center; justify-content:center; font-size:1.35rem; }
  .brandbar h1 { font-size:1.3rem; font-weight:900; margin:0; } .brandbar h1 span { color:var(--gold); }
  .brandbar .tag { font-size:.8rem; color:var(--gold-light); margin-top:1px; }
  header { text-align:center; margin-bottom:8px; padding:0 10px; }
  header h1 { font-size:1.05rem; font-weight:800; margin:0; color:var(--press); } header .sub { color:#6b7280; font-size:.85rem; margin-top:3px; }
  #viewer { width:100%; max-width:1500px; background:#fff; border-radius:10px; }
  /* gap:0 — העמודים נוגעים נטו-לנטו בקו האמצע, כך שתמונה הנפרשת על כפולה מתחברת ברצף.
     ⚠️ הזום מוחל על .zoomWrap (הכפולה כיחידה אחת) ולא על כל עמוד בנפרד: כשכל עמוד
     הוגדל סביב המרכז שלו, שני העמודים גדלו זה-לתוך-זה והעמוד השמאלי "עלה" על הימני. */
  #spread { display:flex; justify-content:center; background:#d1d5db; padding:10px; border-radius:8px;
            min-height:55vh; align-items:center; box-shadow:0 4px 16px rgba(0,0,0,.18); }
  #spread .zoomWrap { display:flex; gap:0; justify-content:center; align-items:center;
                      transform-origin:center center; }
  #spread .page { display:inline-flex; flex-direction:column; align-items:center; gap:5px; line-height:0; }
  /* בלי צל פר-עמוד — צל פנימי היה יוצר "תפר" בין שני העמודים */
  #spread img { display:block; height:80vh; width:auto; max-width:48vw; background:#fff; box-shadow:none; }
  /* תצוגת "גלישות": חותכים ל-TrimBox רק בצד השדרה (כדי שהכפולה תתחבר נקי), ובצדדים החיצוניים
     מציגים את הבליד + צלבי החיתוך של הקובץ + מסגרת קו-חיתוך (TrimBox) — כדי לבדוק שיש גלישות */
  #spread .cropwrap { position:relative; display:inline-block; line-height:0; }
  #spread .mediacrop { display:block; height:80vh; width:auto; max-width:48vw; background-color:#fff; background-repeat:no-repeat; }
  #spread .trimframe { position:absolute; box-sizing:border-box; pointer-events:none; }  /* מסגרת trim מקווקוות (border נקבע inline, מדלג על השדרה) */
  #spread .cmark { position:absolute; background:#111; pointer-events:none; }  /* צלב חיתוך — טיק שחור בפינת ה-trim */
  /* מספר עמוד — תווית עזר מתחת לעמוד ובשקיפות (לא חלק מהעיתון) */
  #spread .pgnum { line-height:1; color:#6b7280; opacity:.5; font-size:.82rem; font-weight:700; }
  /* סימוני-עמודים (13/08/2026): שורת-הכפתורים נפרדת מ-pgnum כי שקיפותו .5
     הייתה יורשת גם לכפתורים — ילד אינו יכול להיות אטום יותר מהורהו. */
  #spread .pmRow { line-height:1; min-height:0; }
  #spread .pmRow .pmBtn { border:1px solid #d1d5db; background:#fff; border-radius:6px;
    padding:2px 8px; margin:2px 2px 0; cursor:pointer; font-size:.74rem; line-height:1.3; }
  #spread .pmRow .pmBtn:hover { border-color:#c9a84c; background:#fffdf6; }
  #viewer:fullscreen #spread .pmRow .pmBtn { background:#1f2937; color:#fff; border-color:#4b5563; }
  #spread .ph { color:#6b7280; font-size:.95rem; padding:50px; }
  /* ── מצב-קריאה: עמוד יחיד ברוחב מלא + גלילה ───────────────────────────
     ⚠️ **זה מה שפותר את הקריאוּת, לא רזולוציית-הרינדור.** נמדד: עמוד
     שנדחס לגובה-החלון יוצא ~735 פיקסלים, ובגודל הזה טקסט 6pt הוא 5.2
     פיקסלים — בלתי-קריא לחלוטין, ולא משנה כמה פיקסלים רונדרו במקור
     (נוסה 4200 ולא עזר; הדפדפן הקטין 5.71:1 וזרק 83% מהפרטים).
     ברוחב-מלא אותו עמוד יוצא ~2,600 פיקסלים: טקסט 18.6 פיקסלים ו-QR
     של 132 — מעל סף-הסריקה של מצלמה. הגלילה היא המחיר, והיא בדיוק
     איך שבודקים פרופר במציאות. */
  #viewer.wide #spread { overflow:auto; max-height:84vh; align-items:flex-start; justify-content:flex-start; }
  #viewer.wide #spread .zoomWrap { display:block; width:100%; }
  #viewer.wide #spread .page { display:block; width:100%; }
  #viewer.wide #spread img,
  #viewer.wide #spread .mediacrop { height:auto; width:100%; max-width:none; }
  #viewer.wide #spread .cropwrap { display:block; width:100%; }
  /* ── גודל מקורי: העמוד בגודלו הפיזי על המסך ─────────────────────────
     ⚠️ הגובה נקבע ב-JS מהמידות במ"מ של העבודה (‏96dpi), ולכן מה שרואים
     הוא בקירוב מה שיצא מהמכונה. זה המצב שבו "אישרתי מה שראיתי" נכון. */
  #viewer.actual #spread { overflow:auto; max-height:84vh; align-items:flex-start; justify-content:center; }
  #viewer.actual #spread .zoomWrap { display:flex; }
  /* ── שכבת-הווקטור ────────────────────────────────────────────────────
     ⚠️ הקנבס יושב **מעל** התמונה ולא במקומה: כך אם הציור נכשל או מתעכב,
     מה שנשאר על המסך הוא הראסטר התקין ולא מסך ריק. הוא נחשף רק כשיש
     בו תוכן. */
  .vecclip { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .vecclip canvas { position:absolute; top:0; height:100%; display:block; }
  /* ⚠️ בכפולה התמונה היא ‎height:80vh;width:auto‎ — כלומר הרוחב נגזר
     מהיחס. מעטפת ‎display:block‎ הייתה נמתחת לכל הרוחב והקנבס היה נמשך
     איתה, ולכן ‎inline-block‎ שמתכווץ לגודל התמונה. במצב-הקריאה הכיוון
     הפוך והמעטפת חייבת לתפוס את כל הרוחב. */
  .vecwrap { position:relative; display:inline-block; line-height:0; }
  #viewer.wide .vecwrap { display:block; width:100%; }
  .vecwrap canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #viewer.actual #spread img,
  #viewer.actual #spread .mediacrop { height:var(--actual-h,80vh); width:auto; max-width:none; }
  #vnav { display:flex; align-items:center; justify-content:center; gap:14px; margin:10px 0; flex-wrap:wrap; }
  #vnav button { font-size:1rem; padding:8px 16px; border:1.5px solid var(--line); background:#fff; border-radius:8px; cursor:pointer; }
  #vnav button:disabled { opacity:.35; cursor:default; }
  #vlabel { min-width:130px; text-align:center; font-variant-numeric:tabular-nums; font-size:.9rem; }
  #viewer:fullscreen { background:#111; display:flex; flex-direction:column; justify-content:center; padding:6px; }
  #viewer:fullscreen #spread { background:#111; flex:1; min-height:0; padding:4px; }
  #viewer:fullscreen #spread img { height:auto; width:auto; max-height:90vh; max-width:48vw; }
  #viewer:fullscreen #spread .page:only-child img { max-width:94vw; max-height:92vh; }
  #viewer:fullscreen #spread .mediacrop { height:88vh; max-height:92vh; max-width:48vw; }
  #viewer:fullscreen #spread .page:only-child .mediacrop { height:90vh; max-width:94vw; }
  #viewer:fullscreen #vlabel { color:#fff; }
  #overlay { position:fixed; inset:0; background:rgba(255,255,255,.95); display:flex; align-items:center;
             justify-content:center; flex-direction:column; gap:12px; z-index:50; text-align:center; padding:24px; white-space:pre-line; }
  #ovBar { width:280px; max-width:80vw; height:12px; background:var(--line); border-radius:7px; overflow:hidden; display:none; }
  #ovBar > div { height:100%; width:0; background:linear-gradient(90deg,#2d3561,#16a34a); transition:width .15s; }
  .parts-pick { display:flex; flex-direction:column; gap:10px; max-width:480px; width:100%; }
  .parts-pick a { display:block; padding:14px 18px; background:#fff; border:1.5px solid var(--line); border-radius:10px;
    text-decoration:none; color:var(--press); font-weight:800; font-size:1rem; text-align:center; }
  /* אזהרת-שקיפות לעמוד — מופיעה רק בעמודים שבהם התצוגה עלולה להחליש גרפיקה */
  #pgWarn:empty { display:none; }
  #pgWarn { margin:0 4px 8px; background:#fffbeb; border:1.5px solid #fcd34d; border-radius:9px;
            padding:8px 12px; font-size:.85rem; color:#78350f; display:flex; gap:9px;
            align-items:center; flex-wrap:wrap; justify-content:center; text-align:center }
  #pgWarn button { padding:4px 11px; font-size:.8rem; border:1.5px solid #d97706; background:#fff;
                   border-radius:7px; cursor:pointer; font-family:inherit; font-weight:700; color:#92400e }
  @media (max-width:680px){ #spread img{height:auto;max-height:60vh;width:auto;max-width:96vw} #spread .mediacrop{height:56vh;max-width:96vw} }
</style>
</head>
<body>
<div id="overlay"><div id="ovText">טוען עיתון…</div><div id="ovBar"><div></div></div></div>
<div class="brandbar">
  <div class="logo">🖨️</div>
  <div style="text-align:center">
    <h1>סולן הדפסות <span>בע"מ</span></h1>
    <div class="tag">צפייה בעיתון — סדר עמודים מאושר</div>
  </div>
</div>
<header>
  <h1 id="ttl">👁 צפייה בעיתון</h1>
  <div class="sub" id="sub">סולן הדפסות</div>
</header>

<div id="viewer" class="hidden">
  <div id="spread"><div class="ph">טוען…</div></div>
  <div id="vnav">
    <button id="vprev">‹ הקודם</button>
    <span id="vlabel"></span>
    <button id="vnext">הבא ›</button>
    <button id="vgoto" title="מעבר מהיר לעמוד מסוים — בלי לדפדף עמוד-עמוד">⤵ לעמוד…</button>
    <button id="vfs">⛶ מסך מלא</button>
    <button id="vzoom" title="לחץ להפעלת זום, ואז גלגלת-העכבר לקרב/להרחיק · גרירה להזזה · דאבל-קליק לאיפוס">🔍 זום</button>
    <button id="vgeom" title="משווה את גיאומטריית שני העמודים — כדי לדעת אם סטייה בחיבור נובעת מהתצוגה או מהקובץ">📐 בדיקת התאמה</button>
    <button id="vmode" title="משנה רק את הגודל על המסך — לא את הקובץ ולא את מה שיודפס. שתי עמודים = איך העיתון ייראה פתוח · עמוד לרוחב המסך = גדול פי-3.5, לקריאת אותיות קטנות וסריקת QR · בגודל ההדפסה = כמו שיצא מהמכונה">📖 שתי עמודים</button>
  </div>

  <div id="geomPanel" style="display:none;max-width:760px;width:96%;margin:0 auto 12px;padding:12px 14px;
       background:#fff;border:1.5px solid var(--line);border-radius:10px;font-size:.84rem;direction:rtl"></div>
  <!-- ⚠️ נאמר במפורש ולא רק ב-title: לקוח שמאשר עיתון להדפסה חייב לדעת
       שהבורר אינו נוגע בקובץ. הנחה שהוא "יבין מההקשר" היא בדיוק איך
       שנוצר החשש ש"בחרתי איכות נמוכה והעיתון יודפס ככה". -->
  <div style="text-align:center;font-size:.78rem;color:#6b7280;margin:-4px 0 8px">
    מצב התצוגה משנה רק את הגודל על המסך — הקובץ שיודפס זהה בכל המצבים.
  </div>
  <div id="pgWarn"></div>
</div>

<div id="picker" class="hidden" style="padding:10px"></div>

<script>
/* ⚠️ אצל צופה עם סינון-תוכן/פרוקסי ש-cdnjs חסום אצלו, pdfjsLib לא מוגדר — והשורה
   הזו זרקה ReferenceError שהרג את *כל* הסקריפט (דף מת בלי שום הודעה). עכשיו מוגן,
   עם מראות-גיבוי (LibLoader) והודעה מפורשת אם כל המראות חסומות. */
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

var _libsP = null;
function _ensureLibs(){
  if (!window.LibLoader) return Promise.resolve({ ok: !!(window.pdfjsLib && window.PDFLib) });
  if (LibLoader.allReady(window)) return Promise.resolve({ ok: true });
  if (!_libsP) _libsP = LibLoader.ensureAll({ win: window }).then(function(r){
    if (!r.ok) _libsP = null;                       // ניסיון חוזר בפעם הבאה (אולי הרשת השתנתה)
    else if (window.pdfjsLib && r.loaded.pdfjs)     // ה-worker חייב לבוא מאותה מראה
      pdfjsLib.GlobalWorkerOptions.workerSrc = LibLoader.workerFor(r.loaded.pdfjs);
    return r;
  });
  return _libsP;
}
// חוסם פעולה שדורשת את הספריות ומציג הסבר ברור אם הן חסומות
async function _requireLibs(){
  showOverlay('טוען רכיבי צפייה…', true);
  var r = await _ensureLibs();
  showOverlay('', false);
  if (!r.ok){
    showOverlay((r.message || (window.LibLoader ? LibLoader.blockedMessage() : 'רכיבי הצפייה לא נטענו.')), true);
    throw new Error('LIBS_BLOCKED');
  }
  return true;
}
const _FBURL = 'https://solan-printing-default-rtdb.europe-west1.firebasedatabase.app';
// ── הזדהות אנונימית מול Firebase (מנעול אבטחה) ──
const _FB_APIKEY = 'AIzaSyAFp99furP4L5hqTI-horBHmGZC9s13dGg';
// ── שומר-סביבה (רשת ביטחון · ספרינט 1 שלב 5) — פתיחה מקומית לא כותבת ל-Firebase החי ──
//    production = הדומיין הרשמי בלבד; אחרת development (חסום ללא אישור); test = מאולץ.
//    עוטף fetch + XMLHttpRequest וחוסם כתיבות (PUT/POST/PATCH/DELETE) לכתובות RTDB/Storage
//    בכל סביבה שאינה production. בייצור — תמיד עובר (אפס שינוי התנהגות). זהה בכל הדפים.
(function(){
  if (window._solanEnvGuardReady) return;              // אידמפוטנטי — לא לעטוף פעמיים
  window._solanEnvGuardReady = true;
  window._solanEnv = (function(){
    try {
      if (typeof window._SOLAN_ENV_FORCE === 'string') return window._SOLAN_ENV_FORCE;
      var h = (typeof location !== 'undefined' && location.hostname || '').toLowerCase();
      return (h === 'solanprinting.github.io') ? 'production' : 'development';
    } catch(e){ return 'development'; }
  })();
  window._solanEnvNow = function(){ return (typeof window._SOLAN_ENV_FORCE === 'string') ? window._SOLAN_ENV_FORCE : window._solanEnv; };
  window._solanIsProd = function(){ return window._solanEnvNow() === 'production'; };
  window._solanWritesAllowed = function(){
    var e = window._solanEnvNow();
    if (e === 'production')  return true;
    if (e === 'development') return window._SOLAN_ALLOW_DEV_WRITES === true;
    return false;                                       // test — לעולם לא
  };
  window._solanIsFbWriteUrl = function(url, method){
    url = String(url == null ? '' : url); method = String(method || 'GET').toUpperCase();
    if (method === 'GET' || method === 'HEAD' || method === 'OPTIONS') return false;   // קריאות תמיד מותרות
    return url.indexOf('firebasedatabase.app') >= 0 || url.indexOf('firebasestorage.googleapis.com') >= 0 || url.indexOf('storage.googleapis.com') >= 0;
  };
  window._fbWriteGuard = function(op){
    if (window._solanWritesAllowed()) return true;
    try { console.warn('⛔ [SOLAN ' + window._solanEnvNow().toUpperCase() + '] כתיבה ל-Firebase נחסמה (הגנת סביבה): ' + op + '\n   לאישור זמני בפיתוח בלבד: window._SOLAN_ALLOW_DEV_WRITES = true'); } catch(e){}
    try { window._solanDevBanner && window._solanDevBanner(); } catch(e){}
    return false;
  };
  window._solanDevBanner = function(){
    if (window._solanIsProd()) return;
    try {
      if (typeof document === 'undefined' || document.getElementById('solan-dev-banner')) return;

  (await out.copyPages(doc, rest)).forEach(function(p){ out.addPage(p); });
  await mkHalf(plan.back);                                       // גב — עמוד אחרון
  _qBadge('📖 כפולת-השער פוצלה: שער בתחילת הדפדוף וגב בסופו', 9000);

/* הדיאלוג: שלב 1 — שתי תצוגות מסובבות (נגד/עם כיוון-השעון), בוחרים את
   הישרה; שלב 2 — איזה צד הוא השער. Promise<{rot,coverHalf}|null>. */
async function _askCoverSpread(bytes, idx){
  var pdf = await pdfjsLib.getDocument({ data: bytes.slice(0) }).promise;
  var page = await pdf.getPage(idx + 1);
  var vp0 = page.getViewport({ scale: 1 });
  var scale = 340 / vp0.height;
  var vp = page.getViewport({ scale: scale });
  var src = document.createElement('canvas'); src.width = Math.ceil(vp.width); src.height = Math.ceil(vp.height);
  var sg = src.getContext('2d');
  sg.fillStyle = '#fff'; sg.fillRect(0, 0, src.width, src.height);   // רקע לבן מפורש — עמודי-שקיפות
  await page.render({ canvasContext: sg, viewport: vp }).promise;
  pdf.cleanup && pdf.cleanup();
  var rotCanvas = function(cw){
    var c = document.createElement('canvas'); c.width = src.height; c.height = src.width;
    var g = c.getContext('2d');
    if (cw) { g.translate(src.height, 0); g.rotate(Math.PI / 2); }      // עם כיוון-השעון (חזותית) ↔ PDF ‎-90
    else    { g.translate(0, src.width);  g.rotate(-Math.PI / 2); }     // נגד כיוון-השעון ↔ PDF ‎+90

    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100200;display:flex;align-items:center;justify-content:center;direction:rtl;padding:16px;overflow:auto';

        + '<div style="font-size:.84rem;color:#666;margin-bottom:10px">הצד השני יוצב כגב-העיתון בסוף הדפדוף. הבחירה נשמרת לעיתון הזה.</div>';
      var wrap = document.createElement('div');

      wrap.appendChild(canv);

        b.style.cssText = 'position:absolute;bottom:10px;' + (side === 'right' ? 'right:10px' : 'left:10px')

      cn.firstChild.onclick = function(){ done(null); };

    var row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:14px;justify-content:center;flex-wrap:wrap';
    [{ cw:false, rot:90 }, { cw:true, rot:-90 }].forEach(function(o){

/* ── הרכבת עיתון עמוד-לכל-קובץ לפי משבצות (בקשת-בעלים 14/08) ──────────────
   כל קובץ נכנס למשבצת שלו לפי מספר-העמוד שבשם (שער=1); משבצת 1..declared
   שאין לה קובץ מקבלת **עמוד-מציין-מקום** בגודל-העמוד של הגיליון — כך הסדר,
   הכפולות וכיוון-המספור אינם זזים כשחסר עמוד. קובץ מרובה-עמודים מכסה את
   המשבצות הבאות אחריו. חסרי-מספר מצורפים בסוף (עדיף גלוי-בסוף מניחוש-מקום).
   ⚠️ עברית אי-אפשר לצייר בגופני-PDF סטנדרטיים — המציין נושא מספר גדול
   ומסגרת, והכיתוב "עמוד חסר" מוצג בתווית שמתחת לעמוד (renderViewer). */
window._missingSlots = [];
/* תווית-העמוד: מציין-מקום של משבצת חסרה מסומן "עמוד חסר" — הכיתוב בעברית
   חי כאן (DOM) כי בגופני-PDF סטנדרטיים אין עברית. המספור הלוגי = המיקום
   בסדר-הקריאה, והמצייני-מקום סופרים — לכן ההשוואה ישירה. */
function _pgLabel(i){
  /* ההתאמה לפי אינדקס-המקור מה-provenance — כפולות מכפילות עמודי-תצוגה,
     כך שמספר-משבצת גולמי היה מסמן את העמוד הלא-נכון. */
  var src = (window._prov && _prov[i]) ? _prov[i].srcIndex : i;
  var miss = (window._missingSlots || []).some(function(m){ return m && m.srcIdx === src; });
  return miss ? ('עמוד ' + (i + 1) + ' — <b style="color:#b45309">חסר, ממתין להעלאה</b>') : ('עמוד ' + (i + 1));
}
async function _filesMergedBytes(rec){
  var ents = Object.keys(rec.files).map(function(k){ return rec.files[k] || {}; })
    .filter(function(f){ return f.fileUrl; });
  var pno = function(nm){ return (window.ShopIssue && ShopIssue.pageNoOf) ? ShopIssue.pageNoOf(nm) : null; };
  ents.sort(function(a,b){ return (pno(a.fileName)||9999) - (pno(b.fileName)||9999); });
  var docs = [];
  for (var i=0;i<ents.length;i++){
    showOverlay('מוריד עמודים… ' + (i+1) + '/' + ents.length, true, Math.round(i/ents.length*90));
    var r = await fetch(ents[i].fileUrl);
    if (!r.ok) throw new Error('הורדת "' + (ents[i].fileName||'קובץ') + '" נכשלה (' + r.status + ')');
    var b = await r.arrayBuffer();
    docs.push({ slot: pno(ents[i].fileName), doc: await PDFLib.PDFDocument.load(b, { ignoreEncryption: true }) });
  }
  showOverlay('מרכיב את הגיליון…', true, 92);
  /* גודל-העמוד למציין: העמוד הראשון שקיים (fallback ‏A4) */
  var pw = 595, ph = 842;
  for (var d0=0; d0<docs.length; d0++){ if (docs[d0].doc.getPageCount()){ var mb0=docs[d0].doc.getPage(0).getMediaBox(); pw=mb0.width; ph=mb0.height; break; } }
  var declared = Math.min(200, parseInt(rec.declaredPages, 10) || 0);
  var bySlot = {}, tail = [];
  docs.forEach(function(d){ if (d.slot >= 1 && !bySlot[d.slot]) bySlot[d.slot] = d; else tail.push(d); });
  var maxSlot = declared;
  Object.keys(bySlot).forEach(function(s){
    var end = parseInt(s,10) + bySlot[s].doc.getPageCount() - 1;
    if (end > maxSlot) maxSlot = end;
  });
  var out = await PDFLib.PDFDocument.create();
  var missing = [];
  var covered = 0;                       // משבצות שכבר כוסו ע"י קובץ מרובה-עמודים
  for (var s=1; s<=maxSlot; s++){
    if (covered > 0){ covered--; continue; }
    var hit = bySlot[s];
    if (hit){
      var idxs = hit.doc.getPageIndices();
      var cps = await out.copyPages(hit.doc, idxs);
      cps.forEach(function(pg){ out.addPage(pg); });
      covered = idxs.length - 1;
    } else {
      missing.push({ slot: s, srcIdx: out.getPageCount() });   // אינדקס-מקור של המציין — לתווית לפי provenance
      var pg2 = out.addPage([pw, ph]);
      var gray = PDFLib.rgb(0.62, 0.65, 0.71);
      pg2.drawRectangle({ x: 14, y: 14, width: pw-28, height: ph-28, borderColor: gray, borderWidth: 2 });
      pg2.drawLine({ start:{x:14,y:14}, end:{x:pw-14,y:ph-14}, color: gray, thickness: 1 });
      pg2.drawLine({ start:{x:14,y:ph-14}, end:{x:pw-14,y:14}, color: gray, thickness: 1 });
      var txt = String(s), fsz = Math.min(pw, ph) * 0.28;
      pg2.drawText(txt, { x: pw/2 - (txt.length*fsz*0.28), y: ph/2 - fsz*0.35, size: fsz, color: gray });
    }
  }
  for (var t2=0; t2<tail.length; t2++){
    var cps2 = await out.copyPages(tail[t2].doc, tail[t2].doc.getPageIndices());
    cps2.forEach(function(pg){ out.addPage(pg); });
  }
  window._missingSlots = missing;
  if (missing.length) _qBadge('⏳ חסרים עמודים: ' + missing.map(function(m){ return m.slot; }).join(', ')
    + ' — מוצגים כמצייני-מקום, הסדר אינו זז', 12000);
  return (await out.save()).buffer;
}

/* מפצל עמודי-כפולה לשני חצאים לתצוגה — לפי provenance מ-PageSpine (מקור-אמת יחיד).
   ⚠️ הזיהוי לפי הגודל-הסופי (reqW/reqH) ולא לפי median; הסדר לפי readingDirection.
   מחזיר { bytes, prov } — כל עמוד-תצוגה יודע את srcIndex/part/number/spine/outer שלו,
   כדי שמיפוי ה-metadata לא יסתמך על המרה-מספרית עיוורת. ⚠️ ה-PDF המקורי לא משתנה. */
/* ⚠️ **מחזירה status, ולא רק bytes.** עד 08/08/2026 כל מסלול-כשל כאן החזיר
   בשקט את ה-PDF המקורי: כפולות נשארו עמוד-אחד, המונה הציג "עמוד 3 מתוך 20"
   לעיתון בן 40, וצד-השדרה נקבע בניחוש-לפי-אינדקס. כשל שנראה כהצלחה הוא
   הדבר היחיד שגרוע מכשל.

   ⚠️ ‏'ok' פירושו **ידענו**: או שפיצלנו, או שווידאנו שאין כפולות.
   ‏'failed' פירושו **לא ידענו** — והקורא חייב להיכשל גלויות ולא להציג מונה.
   אין ערך שלישי, ואין "כנראה". */
async function splitSpreadsPdf(bytes){
  const _passthru = (n) => (window.PageSpine
      ? { bytes, status:'ok', prov: PageSpine.splitProvenance(
            Array.from({length:n},()=>({wmm:NaN,hmm:NaN,type:'single'})), { readingDirection:_readDir }) }
      /* ⚠️ בלי PageSpine אי-אפשר לדעת אם יש כפולות — וזה כשל, לא "אין". */
      : { bytes, status:'failed', reason:'no_page_spine', prov: [] });
  try {
    if (!(bytes instanceof Uint8Array)) { try { bytes = new Uint8Array(bytes); } catch(e){} }   // cross-realm safety
    const src = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption:true });
    const pages = src.getPages();
    /* מסמך ריק — ידענו, ואין מה לפצל. */
    if (!pages.length) return { bytes, status:'ok', prov: [] };
    if (!window.PageSpine) return _passthru(pages.length);
    // גודל לוגי לכל עמוד-מקור: TrimBox אם קיים, אחרת CropBox/MediaBox
    const PT = 25.4 / 72;
    const sources = pages.map((pg, i) => {
      let box = null;
      try { const tb = pg.getTrimBox(); if (tb && tb.width && tb.height) box = tb; } catch(e){}
      if (!box) { try { const cb = pg.getCropBox(); if (cb && cb.width && cb.height) box = cb; } catch(e){} }
      if (!box) { try { box = pg.getMediaBox(); } catch(e){} }
      const w = box ? box.width : pg.getWidth(), h = box ? box.height : pg.getHeight();
      return { wmm: w * PT, hmm: h * PT, sourceId: i };
    });
    const prov = PageSpine.splitProvenance(sources, {
      readingDirection: _readDir, reqWmm: _reqWmm, reqHmm: _reqHmm });
    if (!prov.some(p => p.part !== 'single')) {
      // אין כפולות — לא נוגעים ב-PDF (אידמפוטנטי), אבל כן מחזירים provenance לצורך spine
      return { bytes, status:'ok', prov };
    }
    const out = await PDFLib.PDFDocument.create();
    for (const p of prov) {                       // ⚠️ בסדר-הקריאה של provenance (RTL/LTR)
      const sp = pages[p.srcIndex], w = sp.getWidth(), h = sp.getHeight();
      if (p.part === 'single') { const [cp] = await out.copyPages(src, [p.srcIndex]); out.addPage(cp); continue; }
      const half = w / 2;
      const emb = (p.part === 'spread-right')
        ? await out.embedPage(sp, { left: half, bottom: 0, right: w, top: h })
        : await out.embedPage(sp, { left: 0, bottom: 0, right: half, top: h });
      out.addPage([half, h]).drawPage(emb);
    }
    return { bytes: await out.save(), status:'ok', prov };
  } catch(e){
    /* ⚠️ **לא נופלים-לאחור ל-bytes המקוריים.** זו הייתה הנפילה השקטה: PDF
       עם כפולות היה מוצג כאילו כל כפולה היא עמוד, והמונה שיקר בחצי. */
    console.warn('splitSpreadsPdf failed', e);
    return { bytes: null, status:'failed', reason:'split_error', prov: [] };
  }
}

     עבודה ישנה בלי readingDirection → 'rtl' (בלי migration, בלי רגרסיה).

     בקשת-בעלים 14/08: כשהלקוח העלה 31 מתוך 32, אסור שהסדר יזוז — עמוד
     חסר מוצג כמציין-מקום **במקומו**, כך שהכפולות, צד-השדרה וכיוון-מספרי-
     העמודים (כלפי חוץ) נשארים נכונים. המשבצת נגזרת ממספר-העמוד שבשם-

  else if (rec.files && Object.keys(rec.files).length) { url = '__FILES__'; label = rec.title || ''; }

     ⚠️ תקרית 2026-07-30 (עוצמה עמ' 28): הלקוח אישר עיתון שבו חלק מהגרפיקה "נעלם"
     בדפדוף, בזמן שהקובץ עצמו תקין לחלוטין (אומת: הורדה, מייל ופרופר בסדר).

     את הדפדוף ראה את אותה תמונה פגומה, כי המטמון הועדף על הקובץ.

  try {

    let _r;

    // כך שהלקוח לא ממתין אבל בסוף רואה בדיוק את מה שבקובץ.
    const fresh = new Array(pdf.numPages);

        _qBadge('⏳ מרנדר מהקובץ המקורי… ' + i + '/' + pdf.numPages);
        if (i % 3 === 0 || i === pdf.numPages) renderViewer();
      } else {
        imgs = fresh;

        if (i % 3 === 0) renderViewer();

    }
    /* ⚠️ אי-התאמה בין המטמון לקובץ **עוצרת**, ולא הופכת לבאנר חולף.

    imgs = fresh; _fromCache = false; _baseDone = true;

  } catch(e){

    /* ⚠️ **גם כשמוצג מטמון — זה כשל, לא הערה.** עד 08/08/2026 המסך נשאר

    if (_fromCache) {

/* סורק את העמוד לציור-עם-מסכת-שקיפות. רשימת-הפעולות כבר נבנתה בזמן הרינדור,
   ולכן הקריאה כאן זולה. הממצא הופך לאזהרה בעמוד עצמו — כדי שלא יאשרו עיתון
   לפי תצוגה שאינה נאמנה, גם לפני שבאג-הציור עצמו נפתר. */
async function _scanTransparency(pdf, pageNo){
  if (!window.PdfTransparency || !pdfjsLib || !pdfjsLib.OPS) return null;
  try {
    const page = await pdf.getPage(pageNo);
    const ops = await page.getOperatorList();
    return PdfTransparency.scanPage(ops, pdfjsLib.OPS);
  } catch(e){ return null; }
}
/* אזהרת-שקיפות מוצגת *רק* במנוע הישן. במנוע החדש הציור נכון, ואזהרה שם היא
   רעש-שקר שמפחיד לקוחות על עמודים תקינים. */
function _renderPageWarn(){
  const el = $('pgWarn'); if (!el) return;
  const eng = _engineNew ? 'new' : 'old';
  const risky = showingPages().filter(i => window.PdfEngine
    ? PdfEngine.shouldWarn(eng, _tScan[i]) : (!_engineNew && _tScan[i] && _tScan[i].risky));
  if (!risky.length){ el.innerHTML = ''; return; }
  const worst = risky.map(i => _tScan[i]).sort((a,b)=>b.doubleMasked-a.doubleMasked)[0];
  el.innerHTML = '<span>⚠️ ' + esc(PdfTransparency.warningText(worst)) + '</span>'
    + '<button id="pwPdf">📄 פתח את הקובץ המקורי</button>';
  var b1 = $('pwPdf'); if (b1) b1.onclick = _openOriginal;
}
function _openOriginal(){
  if (!_pdfUrlForBoxes) return;
  window.open(_pdfUrlForBoxes, '_blank', 'noopener');
}
// החלפה בין המנוע העדכני (ברירת-מחדל) לישן — לבדיקה אם משהו נראה חשוד
function _toggleEngine(){
  var u = new URL(location.href);
  if (u.searchParams.get('engine') === 'old') u.searchParams.delete('engine');
  else u.searchParams.set('engine', 'old');
  location.href = u.toString();
}

/* ⚠️ 07/08/2026 — תקרת-**שטח** לקנבס, לא רק תקרת-סקייל. בספארי בנייד יש
   תקרה קשיחה (~16.7 מיליון פיקסלים; מכשירים ישנים גם 4096 לממד), וקנבס
   שחורג ממנה מוחזר ריק **בלי לזרוק** — העמוד לבן, בלי שגיאה ובלי הודעה.
   אותו קובץ נראה תקין בכרום, ולכן זה לא נתפס. ראה proof-client.html. */
function _capCanvasScale(scale, v1) {
  const MAX_AREA = 16777216 * 0.85, MAX_DIM = 4096;
  let s = scale;
  const area = (v1.width * s) * (v1.height * s);
  if (area > MAX_AREA) s *= Math.sqrt(MAX_AREA / area);
  const mx = Math.max(v1.width, v1.height) * s;
  if (mx > MAX_DIM) s *= MAX_DIM / mx;
  return s;
}

async function renderPage(pdf, pageNo, targetH, q){
  const page = await pdf.getPage(pageNo);
  const v1 = page.getViewport({ scale:1 });
  const dpr = Math.min(2, (window.devicePixelRatio || 1));
  const scale = _capCanvasScale(Math.min(RENDER_SCALE_CAP, ((targetH || BASE_H) * dpr) / v1.height), v1);
  const vp = page.getViewport({ scale });
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.floor(vp.width)); c.height = Math.max(1, Math.floor(vp.height));
  const cx = c.getContext('2d');
  // רקע לבן מפורש: עמוד עם שקיפות נראה אחרת על קנבס שקוף, וב-JPEG שקיפות הופכת לשחור
  cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext: cx, viewport: vp }).promise;
  page.cleanup();
  /* ⚠️ מעבר-הבסיס נשאר JPEG (מהיר וקטן — הוא מציין-מקום); העמוד המוצג
     עובר בקידוד שומר-קצוות. */
  return (q && q >= 0.96) ? _encode(c, q) : c.toDataURL('image/jpeg', q || BASE_Q);
}

/* ── שלב 2: איכות-שיא לעמודים שמוצגים כרגע ──────────────────────────────
   מטמון LRU קטן בזיכרון בלבד; לא נשמר ולא מועלה לשום מקום. */
let _pdfDoc = null, _baseDone = false;
const _hi = new Map(), _hiBusy = new Set();

/* גובה-הרינדור הדרוש **עכשיו**: מה שבאמת מוצג × צפיפות-המסך × הזום.
   ⚠️ נמדד מה-DOM ולא מחושב מ-vh: הגובה בפועל מוגבל גם ב-max-width
   (‏48vw לעמוד), ובמסך רחב הרוחב הוא שקובע. הנחה במקום מדידה הייתה
   מרנדרת בגובה שאינו הגובה שעל המסך. */
function _hiTargetH(){
  /* ⚠️ **איכות מרבית תמיד (החלטת-בעלים 10/08/2026).** כאן ישב חישוב
     שגזר את היעד מגודל-התצוגה × צפיפות-המסך × הזום, ותיבת-סימון
     אפשרה לכפות מקסימום לצורך השוואה. הבעלים השווה והכריע: מקסימום
     תמיד. החישוב הוסר ולא הושאר מנוטרל — קוד-מת שנראה כמו לוגיקה
     פעילה הוא מלכודת לכל מי שיקרא את זה בעוד חודש.
     ⚠️ "מקסימום" אינו בלי-גבול: _capCanvasScale חוסם ב-4096 לצלע
     וב-14 מגה-פיקסל, ולכן טלפון אינו קורס. */
  return HI_MAX_H;
}


/* ⚠️ ‏WebP שומר מעברים חדים הרבה טוב מ-JPEG באותו גודל-קובץ, וזה בדיוק
   מה שקובע אם QR נקרא. נפילה-לאחור ל-JPEG כשהדפדפן אינו מקודד WebP —
   ובדיקה על **התוצאה** ולא על הדפדפן, כי toDataURL מחזיר PNG בשקט
   כשהפורמט אינו נתמך. */
/* ⚠️ הפורמט שהתקבל בפועל נרשם. "ניסינו WebP" ו"קיבלנו WebP" הם שני
   דברים שונים — הדפדפן מחזיר PNG בשקט כשהוא אינו תומך, ובלי הרישום
   הזה אי אפשר לדעת מה באמת על המסך. */
let _lastEncoding = '—';
function _encode(canvas, q){
  try {
    const w = canvas.toDataURL('image/webp', q);
    if (w && w.indexOf('data:image/webp') === 0) { _lastEncoding = 'WebP ' + q; return w; }
    if (w && w.indexOf('data:image/png') === 0)  { _lastEncoding = 'PNG (הדפדפן לא קידד WebP)'; return w; }
  } catch(e){}
  _lastEncoding = 'JPEG ' + q;
  return canvas.toDataURL('image/jpeg', q);
}

function srcFor(i){ const e = _hi.get(i); return (e && e.src) || imgs[i]; }

async function _ensureHi(list){
  if (!_pdfDoc || !_baseDone || _fromCache) return;   // לא מתחרים במעבר-הבסיס
  const want = _hiTargetH();
  for (const i of list){
    const cur = _hi.get(i);
    /* ⚠️ רינדור-מחדש רק כשהצורך גדל **מהותית**: בלי הסף הזה כל תזוזת-זום
       קטנה הייתה מפעילה רינדור מלא, והמסך היה מהבהב במקום להתחדד. */
    if (cur && cur.h >= want / HI_REDO_RATIO) { _hi.delete(i); _hi.set(i, cur); continue; }
    if (_hiBusy.has(i)) continue;
    _hiBusy.add(i);
    try {
      const src = await renderPage(_pdfDoc, i + 1, want, HI_Q);
      _hi.set(i, { src: src, h: want });
      while (_hi.size > HI_MAX) _hi.delete(_hi.keys().next().value);
      /* ⚠️ **כאן היה השורש של "חד ואז מטושטש" (10/08/2026).** נחיתת
         ראסטר קראה ל-renderViewer, שבונה מחדש את כל ה-innerHTML —
         ומוחק את קנבס-הווקטור שכבר צויר. שני העמודים נוחתים בזמנים
         שונים, ולכן תמיד היה רגע שבו קנבס חד נמחק והוחלף בתמונה.
         ניסיתי לתקן זאת בתנאי "רק כשאין קנבס", אבל העמוד ה**שני**
         שנוחת עדיין הרס את הקנבס של הראשון.

         ⚠️ התיקון: **לא בונים מחדש כלל.** התמונה שמתחת מוחלפת
         במקומה — אותו אלמנט, ‏src חדש. הקנבס שמעליה אינו זז, ומה
         שהמשתמש רואה אינו משתנה לרעה אף פעם.
         ⚠️ והראסטר עדיין משתדרג, כדי שאם הווקטור נכשל או לא זמין
         שכבת-הנפילה תהיה החדה ביותר שיש. */
      if (showingPages().indexOf(i) >= 0) _swapRaster(i, src);
    } catch(e){ /* נשאר באיכות-הבסיס */ }
    finally { _hiBusy.delete(i); }
  }
}

// דפדוף כפולה RTL
/* ── מצב-תצוגה ─────────────────────────────────────────────────────────
   ⚠️ **הכפולה נשארת ברירת-המחדל.** היא הדרך הנכונה לראות איך העיתון
   ייראה פתוח, ובה בודקים חיבורים מעבר לשדרה. מצב-הקריאה נועד לדבר
   אחר לגמרי: לקרוא את האותיות הקטנות ולסרוק QR — ושם עמוד יחיד
   ברוחב מלא הוא היחיד שמגיע לגודל הנדרש.
   ⚠️ הבחירה נזכרת במכשיר: מי שעבר למצב-קריאה עשה זאת כי הוא צריך
   לקרוא, וכפיית חזרה לכפולה בכל עמוד הייתה עבודה חוזרת. */
/* שלושה מצבים: כפולה (ברירת-מחדל) · קריאה (עמוד ברוחב מלא) · גודל מקורי. */
const VIEW_MODES = ['spread', 'wide', 'actual'];
/* ⚠️ **השמות תוקנו אחרי שאלה של הבעלים: "מה זה איכות קריאה? זו
   האיכות שתודפס?" — והשאלה מוצדקת, כי השם שנתתי היה מטעה.** אף מצב
   כאן אינו נוגע לקובץ ואינו משנה מה יודפס; כולם משנים רק את **הגודל
   על המסך**, כמו לקרב את הדף לעיניים. שם שמרמז על "איכות" מזמין
   לקוח לחשוב שהוא בוחר באיזו איכות העיתון יודפס — וזו טעות מסוכנת
   בדיוק במסך שבו הוא מאשר להדפסה. */
const VIEW_LABEL = { spread: '📖 שתי עמודים', wide: '🔍 עמוד לרוחב המסך', actual: '📐 בגודל ההדפסה' };
let _viewMode = 'spread';
try { var _vm = localStorage.getItem('solanProofViewMode');
      if (VIEW_MODES.indexOf(_vm) >= 0) _viewMode = _vm; } catch(e){}

/* ⚠️ **גודל מקורי = הגודל הפיזי, לא "100% של הקובץ".** מ"מ → פיקסלים
   לפי 96dpi, שזו ההנחה הסטנדרטית של CSS. מסך אמיתי סוטה מזה ב-10-15%,
   ולכן זה קירוב — אבל קירוב שמקורו במידות העבודה ולא במספר שרירותי.
   ⚠️ בלי מידות ידועות אין המצאה: נופלים לגובה סביר ומסמנים זאת בכותרת. */
function _actualPx(){
  var hmm = Number(_reqHmm) || 0;
  if (!(hmm > 0)) {
    try { var m0 = (_pageMeta && (_pageMeta.byIndex || _pageMeta) || [])[0];
          if (m0 && m0.hmm) hmm = Number(m0.hmm) || 0; } catch(e){}
  }
  if (!(hmm > 0)) return 0;
  return Math.round(hmm * 96 / 25.4);
}

function _applyViewMode(){
  const v = $('viewer'), b = $('vmode');
  if (v) { v.classList.toggle('wide', _viewMode === 'wide');
           v.classList.toggle('actual', _viewMode === 'actual'); }
  /* גובה מפורש רק במצב גודל-מקורי; בשאר המצבים ה-CSS שולט. */
  try {
    var px = (_viewMode === 'actual') ? _actualPx() : 0;
    document.documentElement.style.setProperty('--actual-h', px ? (px + 'px') : '80vh');
  } catch(e){}
  if (b) b.textContent = VIEW_LABEL[_viewMode] || VIEW_LABEL.spread;
  try { localStorage.setItem('solanProofViewMode', _viewMode); } catch(e){}
}
function toggleViewMode(){
  _viewMode = VIEW_MODES[(VIEW_MODES.indexOf(_viewMode) + 1) % VIEW_MODES.length];
  /* ⚠️ המטמון מתנקה: הגודל על המסך משתנה פי-3.5, והתמונה הישנה הייתה
     נמתחת עד שהרינדור החדש ינחת — כלומר המעבר היה נראה **גרוע יותר**
     בדיוק ברגע שבו המשתמש ביקש איכות. */
  try { _hi.clear(); } catch(e){}
  /* ⚠️ גם מצב-הווקטור מתאפס: הרוחב שנרשם שייך למצב הקודם, ובלי איפוס
     המעבר היה משאיר קנבס שצויר לרוחב אחר לגמרי. */
  try { _vecAt.clear(); } catch(e){}
  if (_viewMode === 'spread' && vIndex > 0 && vIndex % 2 === 0) vIndex -= 1;
  _applyViewMode();
  try { if (window._pvZoomReset) window._pvZoomReset(); } catch(e){}
  renderViewer();
  try { _ensureHi(showingPages()); } catch(e){}
}

/* ═══ סימוני-עמודים — עוזרי-רינדור ופעולות (ראה ההסבר ליד _pmState) ═══ */
function _pmSrcPage(i){ const p = _prov[i]; return ((p && p.srcIndex != null) ? p.srcIndex : i) + 1; }
function _pmMarkFor(i){
  const r = window._pmRec;
  return (window.ShopIssue && r && window._pmState) ? ShopIssue.markOf(r, _pmState.target, _pmSrcPage(i)) : null;
}
/* חצי-כפולה ↔ עמוד-מלא: תרגום מלבן-הסימון בין מערכות-הצירים */
function _pmSpotToSource(i, r){
  const p = _prov[i]; if (!r) return null;
  if (!p || p.part === 'single') return r;
  const half = p.part === 'spread-right' ? 50 : 0;
  return { x: half + r.x / 2, y: r.y, w: r.w / 2, h: r.h };
}
function _pmSpotToDisplay(i, s){
  const p = _prov[i]; if (!s || !isFinite(Number(s.x))) return s || null;
  if (!p || p.part === 'single') return s;
  const half = p.part === 'spread-right' ? 50 : 0;
  const x = (Number(s.x) - half) * 2, w = Number(s.w) * 2;
  if (x + w <= 0 || x >= 100) return null;           /* הסימון בחצי השני של הכפולה */
  return { x: Math.max(0, x), y: s.y, w: Math.min(100 - Math.max(0, x), w), h: s.h };
}
function _pmOverlay(i){
  const m = _pmMarkFor(i);
  if (!m || !window.PageMarks) return '';
  return PageMarks.overlayHtml({ kind: m.kind, note: m.note, spot: _pmSpotToDisplay(i, m.spot) });
}
function _pmCtl(i){
  if (!window._pmState || !_pmState.staff || !window.ShopIssue) return '';
  const m = _pmMarkFor(i);
  if (!m) return ` <button class="pmBtn" data-pmmark="${i}|replace" title="סימון העמוד כדורש-החלפה — עם הערה מה הבעיה, שהלקוח יראה">🔁</button>`
       + `<button class="pmBtn" data-pmmark="${i}|print-asis" title="הלקוח אישר להדפיס את העמוד כמו שהוא, בלי תיקון">✔</button>`;
  return ` <button class="pmBtn" data-pmspot="${i}" title="גררו מלבן על העמוד לסימון מקום-הבעיה — הלקוח יראה אותו">📍</button>`
       + `<button class="pmBtn" data-pmclear="${i}" title="הסרת הסימון מהעמוד">✖</button>`;
}
async function _pmWrite(patch){
  if (!patch) return false;
  try {
    const r = await fetch(await _au(`${_FBURL}/customerProofs/${proofId}.json`),
      { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch) });
    if (!r.ok) throw new Error('db ' + r.status);
    /* עדכון העותק המקומי מאותו patch — בלי קריאה-חוזרת, בלי ניחוש */
    const rec = window._pmRec;
    Object.keys(patch).forEach(function(path){
      const seg = path.split('/');                    /* pageMarks/<target>/<n> */
      if (seg[0] !== 'pageMarks') return;
      rec.pageMarks = rec.pageMarks || {};
      const t = rec.pageMarks[seg[1]] = rec.pageMarks[seg[1]] || {};
      if (patch[path] === null) delete t[seg[2]]; else t[seg[2]] = patch[path];
    });
    renderViewer();
    return true;
  } catch(e){
    alert('⛔ שמירת הסימון נכשלה: ' + ((e && e.message) || 'שגיאה') + '\nנסו שוב.');
    return false;
  }
}
async function _pmMark(i, kind){
  let note = null;
  if (kind === 'replace') {
    note = window.prompt('מה הבעיה בעמוד? (ההערה תוצג ללקוח)', '');
    if (note === null) return;                        /* ביטול — לא מסמנים */
  }
  const ok = await _pmWrite(ShopIssue.markPatch(_pmState.target, _pmSrcPage(i), kind,
    { note: note, by: _pmState.by, at: Date.now() }));
  /* דרישת-החלפה ממשיכה ישר לסימון-המקום — "איפה הבעיה" הוא חלק מהדרישה */
  if (ok && kind === 'replace') _pmSpotMode(i);
}
function _pmSpotMode(i){
  const host = document.querySelector(`#spread [data-vec="${i}"]`);
  if (!host || !window.PageMarks) return;
  const m = _pmMarkFor(i); if (!m) return;
  const hint = document.createElement('div');
  hint.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:99;'
    + 'background:#2d3561;color:#fff;border-radius:10px;padding:8px 16px;font-weight:800;font-size:.85rem';
  hint.textContent = '📍 גררו מלבן על העמוד לסימון מקום-הבעיה (Esc לדילוג)';
  document.body.appendChild(hint);
  PageMarks.attachSpotDrag(host, async function(rect){
    hint.remove();
    if (!rect) return;                                /* דילוג — הסימון נשאר בלי מקום */
    await _pmWrite(ShopIssue.markPatch(_pmState.target, _pmSrcPage(i), m.kind,
      { note: m.note, by: m.by || _pmState.by, at: m.at || Date.now(), spot: _pmSpotToSource(i, rect) }));
  });
}
function _pmWire(){
  document.querySelectorAll('[data-pmmark]').forEach(b => b.onclick = (ev) => {
    ev.stopPropagation();
    const s = b.dataset.pmmark.split('|'); _pmMark(parseInt(s[0], 10), s[1]);
  });
  document.querySelectorAll('[data-pmspot]').forEach(b => b.onclick = (ev) => {
    ev.stopPropagation(); _pmSpotMode(parseInt(b.dataset.pmspot, 10));
  });
  document.querySelectorAll('[data-pmclear]').forEach(b => b.onclick = (ev) => {
    ev.stopPropagation();
    if (!confirm('להסיר את הסימון מהעמוד?')) return;
    _pmWrite(ShopIssue.markPatch(_pmState.target, _pmSrcPage(parseInt(b.dataset.pmclear, 10)), null));
  });
}

function showingPages(){
  if (!imgs.length) return [];
  /* במצב-קריאה עמוד אחד בכל פעם — זה כל העניין: הוא מקבל את כל הרוחב. */
  if (_viewMode !== 'spread') return [Math.min(vIndex, imgs.length - 1)];
  if (vIndex === 0) return [0];
  const left = vIndex % 2 === 1 ? vIndex : vIndex - 1;
  return [left, left + 1].filter(i => i < imgs.length);
}
function renderViewer(){
  const spread = $('spread');
  if (!imgs.length) return;
  const s = showingPages();
  /* ⚠️ **"מתוך N" נאמר רק כשיודעים מהו N.** בזמן תצוגה-מהירה (מטמון)
     ‏imgs.length הוא אורך המטמון ולא ספירת-העמודים של הקובץ; אם הרשומה
     טעתה ב-spreadCount, המטמון עלול להיות ספירת-כפולות. לכן עד שהרינדור-
     האמיתי הסתיים מוצג המיקום בלבד, עם ציון שהתצוגה מהירה.
     ⚠️ המספרים עולים תמיד — גם ב-LTR. הכיוון קובע מי מצויר איפה, לא איך
     קוראים את המספר; "עמוד 3–2" אינו טקסט שמישהו אמור לפענח. */
  const _pn = s.map(i => i + 1).sort((a, b) => a - b);
  const _head = (_pn.length > 1 ? `עמודים ${_pn[0]}–${_pn[_pn.length-1]}` : `עמוד ${_pn[0]}`);
  $('vlabel').textContent = (_baseDone && !_fromCache)
    ? `${_head} מתוך ${imgs.length}`
    : `${_head} · ${TEMP_VIEW_TEXT}`;
  $('vprev').disabled = vIndex <= 0;
  $('vnext').disabled = s[s.length-1] >= imgs.length - 1;
  /* מיקום העמודים בכפולה לפי כיוון-הקריאה: ב-LTR העמוד הראשון בסדר מוצג משמאל.
     ⚠️ שינוי סדר/מיקום בלבד — התוכן עצמו לעולם אינו משוקף. */
  spread.style.direction = (_readDir === 'ltr') ? 'ltr' : 'rtl';
  $('vprev').textContent = (_readDir === 'ltr') ? '‹ הקודם' : 'הקודם ›';
  $('vnext').textContent = (_readDir === 'ltr') ? 'הבא ›' : '‹ הבא';
  const two = s.length === 2;
  _geomShown = s.slice(); _geomMetas = metas;   /* הקשר לבדיקת-ההתאמה */
  // עוטף את הכפולה ביחידה אחת (.zoomWrap) — הזום מוחל עליה, לא על כל עמוד בנפרד
  spread.innerHTML = '<div class="zoomWrap">' + s.map((i, pos) => {
    const tf = metas[i];
    if (tf && (tf.w < 1 || tf.h < 1)) {
      // חותכים ל-TrimBox רק בצד השדרה (חיבור נקי); בצדדים החיצוניים מציגים בליד + צלבי חיתוך + מסגרת trim
      // חוק-הברזל: עמוד אי-זוגי שדרה-ימין · זוגי שדרה-שמאל. חל גם על עמוד בודד.
      // באג שתוקן: לשער (עמוד 1, אי-זוגי) היה מקובע 'left' ולכן הגלישה הוצגה מימין במקום משמאל.
      /* צד-השדרה: מ-provenance (חצי-כפולה → הקצה-הפנימי; בודד → לפי המספר-הלוגי
         והכיוון). נפילה-לאחור לחישוב-לפי-אינדקס רק כשאין provenance. */
      const spine = (_prov[i] && _prov[i].spine) || PageSpine.spineForIndex(i, _readDir);
      const sp = PageSpine.netSpec(tf, spine);
      const mc = `aspect-ratio:${sp.arr.toFixed(4)};background-image:url('${srcFor(i)}');`
        + `background-size:${sp.sizeW.toFixed(3)}% 100%;background-position:${sp.posX.toFixed(3)}% 0%;`;
      const f = sp.frame;
      const fb = `border:1.4px dashed #e11d48;`
        + (f.skip === 'left' ? 'border-left:none;' : '') + (f.skip === 'right' ? 'border-right:none;' : '');
      const fst = `left:${f.left.toFixed(2)}%;top:${f.top.toFixed(2)}%;width:${f.width.toFixed(2)}%;height:${f.height.toFixed(2)}%;${fb}`;
      /* ⚠️ מיכל-הווקטור בכל המצבים, ותמיד **מעל** הראסטר. ה-mediacrop
         נשאר במקומו ולא הוחלף — הוא מה שנראה כל עוד הציור לא הסתיים,
         ומה שנשאר אם הוא נכשל. */
      const vc = `<div class="vecclip"></div>`;
      const va = ` data-vec="${i}" data-vec-w="${sp.sizeW.toFixed(3)}" data-vec-x="${sp.posX.toFixed(3)}"`;
      /* ‏_pmOverlay — סימון-עמוד (מלבן+תג) בתוך ה-cropwrap, מעל הכול;
         ‏_pmCtl — כפתורי-סימון לצוות, בשורה נפרדת מ-pgnum (שקיפותו .5). */
      return `<div class="page"><div class="cropwrap"${va}><div class="mediacrop" style="${mc}"></div>${vc}<div class="trimframe" style="${fst}"></div>${_cropMarksHtml(f)}${_pmOverlay(i)}</div><div class="pgnum">${_pgLabel(i)}</div><div class="pmRow">${_pmCtl(i)}</div></div>`;
    }
    /* ⚠️ ה-img נשאר בתוך המעטפת ולא הוסר: הוא מה שמוצג עד שהציור
       הווקטורי מוכן, ומה שנשאר אם הוא נכשל. */
    return `<div class="page"><span class="vecwrap" data-vec="${i}" data-vec-w="100" data-vec-x="0">`
         + `<img src="${srcFor(i)}" alt=""><span class="vecclip"></span>${_pmOverlay(i)}</span>`
         + `<div class="pgnum">${_pgLabel(i)}</div><div class="pmRow">${_pmCtl(i)}</div></div>`;
  }).join('') + '</div>';
  _pmWire();
  if (window._pvZoomApply) _pvZoomApply();   // שומר על מצב-הזום גם אחרי רינדור-מחדש
  _renderPageWarn();
  _ensureHi(s);      // העמודים שעל המסך → רינדור חוזר באיכות-שיא (מחליף כשמוכן)
  try { _vectorize(s); } catch(e){}   /* מצב-קריאה: ציור וקטורי מעל הראסטר */
}
/* ═══ ציור וקטורי ישיר (מצב "עמוד לרוחב המסך" בלבד) ═══════════════════
   ⚠️ **למה זה קיים.** הצופה ממיר כל עמוד לתמונה (‏4096 פיקסלים ≈ 323dpi)
   ואז מגדיל אותה. עד זום ×3.4 זה שקול לקורא-PDF; מעבר לזה הטקסט נמתח,
   כי פיקסלים אינם נוצרים יש-מאין. ‏pdf.js יודע לצייר את הווקטור ישירות
   בכל רמת-זום — וזה מה שסוגר את הפער.

   ⚠️ **מבודד למצב אחד בכוונה.** הכפולה היא המסך שלקוחות משתמשים בו
   היום; שינוי מנוע-התצוגה שלה הוא סיכון-רגרסיה על מסלול עובד. כאן
   הסיכון מוגבל למצב שנוסף אתמול.

   ⚠️ **הקנבס מתווסף מעל הראסטר ולא מחליף אותו.** כשל בציור, מסמך שלא
   נטען, או מכשיר חלש — משאירים על המסך את התמונה התקינה. מסך ריק
   במקום עמוד גרוע מעמוד מרוכך. */
/* ⚠️ **כבוי (10/08/2026) — הניסיון נכשל, והכשל היה בתכנון שלי.**

   הרעיון היה נכון בתיאוריה: ‏pdf.js מצייר וקטור ולכן חד בכל זום.
   מה שפספסתי הוא **באיזו רזולוציה** הוא צויר. הקנבס רונדר בדיוק
   בגודל התצוגה — ‏537×735 — בעוד שהתמונה שמתחתיו היא 4096 פיקסלים,
   כלומר פי-5.6 יותר פרטים. הקנבס "החד" כיסה תמונה חדה בהרבה.

   ⚠️ זה בדיוק מה שדווח שלוש פעמים: "חד בשנייה הראשונה ואז מטושטש".
   הראסטר הוא שהיה חד; הווקטור שלי כיסה אותו והוריד את האיכות.
   שלושת התיקונים שניסיתי (תזמון, בנייה-מחדש, מגן-הורדה) נגעו כולם
   במנגנון — ואף אחד מהם לא בשאלה אם הקנבס בכלל טוב יותר.

   ⚠️ ווקטור **כן** מנצח בזום גבוה, אבל אז צריך לרנדר אותו בגודל
   הזום ולא בגודל התצוגה — וזה בדיוק מה שהראסטר כבר עושה עם 4096.
   כלומר בטווח שבו משתמשים בפועל אין לו יתרון.

   הקוד נשאר עם מתג יחיד, כדי שאפשר יהיה לחזור אליו אם אי-פעם
   נרנדר לפי הזום. **אין לפתוח אותו בלי לתקן קודם את הרזולוציה.** */
const VECTOR_ENABLED = false;
let _vecBusy = new Set(), _vecAt = new Map();   // i → רוחב-הקנבס שצויר
const VEC_REDO = 1.25;                          // ציור-מחדש רק כשהצורך גדל מהותית

async function _renderCanvas(pageNo, cssW, dpr){
  const page = await _pdfDoc.getPage(pageNo);
  const v1 = page.getViewport({ scale: 1 });
  let scale = (cssW * dpr) / v1.width;
  scale = _capCanvasScale(scale, v1);
  const vp = page.getViewport({ scale });
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.floor(vp.width));
  c.height = Math.max(1, Math.floor(vp.height));
  const cx = c.getContext('2d');
  /* ⚠️ רקע לבן מפורש — אותו כלל כמו בראסטר: עמוד עם שקיפות נראה אחרת
     על קנבס שקוף, ובדפדוף על רקע כהה זה נראה כמו פגם בקובץ. */
  cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext: cx, viewport: vp }).promise;
  page.cleanup();
  return c;
}

/* מצייר את העמודים המוצגים בווקטור, לפי הרוחב שהם תופסים בפועל. */
/* מדידת-רוחב שממתינה לפריסה. ⚠️ שתי מסגרות ולא אחת: הראשונה
   מסיימת את הסגנון, השנייה את הפריסה בפועל. מדידה בין השתיים
   מחזירה מספר שנראה תקין ואינו. */
/* מחליף את תמונת-הבסיס **במקום**, בלי לגעת במבנה.
   ⚠️ שני מסלולי-תצוגה, ולכן שתי דרכים: ‎<img src>‎ במסלול הרגיל,
   ו-‎background-image‎ במסלול-החיתוך. החלפה של אחד בלבד הייתה משאירה
   את השני מיושן בלי שאיש יבחין. */
function _swapRaster(i, src){
  try {
    const host = document.querySelector('[data-vec="' + i + '"]');
    if (!host) return;
    const im = host.querySelector('img');
    if (im) { im.src = src; return; }
    const mc = host.querySelector('.mediacrop');
    if (mc) {
      const cur = mc.style.backgroundImage || '';
      mc.style.backgroundImage = cur.replace(/url\(['"]?[^)]*['"]?\)/, "url('" + src + "')");
    }
  } catch(e){}
}

async function _vecBox(host){
  let w = host.getBoundingClientRect().width;
  if (w > 0) return w;
  await new Promise(function(r){
    if (typeof requestAnimationFrame !== 'function') { setTimeout(r, 32); return; }
    requestAnimationFrame(function(){ requestAnimationFrame(r); });
  });
  return host.getBoundingClientRect().width;
}

async function _vectorize(list){
  /* ⚠️ **הורחב לכפולה בבקשת-הבעלים.** קודם זה היה מבודד למצב-הקריאה
     כדי לא לגעת במסלול שלקוחות משתמשים בו. הבעלים בדק את מצב-הקריאה
     והחליט להרחיב — ולכן ההגנות נשארות **בדיוק** אותן הגנות: הקנבס
     מעל הראסטר, כשל משאיר את התמונה, ואימות שהעמוד עדיין מוצג. הן
     חשובות כאן יותר, לא פחות. */
  if (!VECTOR_ENABLED) return;
  if (!_pdfDoc || _fromCache) return;
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const z = Math.max(1, (typeof window._pvZoomScale === 'function' ? window._pvZoomScale() : 1) || 1);
  for (const i of list) {
    if (_vecBusy.has(i)) continue;
    const host = document.querySelector('[data-vec="' + i + '"]');
    if (!host) continue;
    /* ⚠️ **מדידה אחרי שהפריסה התייצבה (הבאג: חד לשנייה ואז מטושטש).**
       המעטפת היא inline-block שרוחבה נגזר מה-<img> שבתוכה. מיד אחרי
       בנייה-מחדש התמונה עדיין לא פורסה, ולכן המדידה החזירה רוחב
       זעיר — והקנבס צויר קטן ונמתח ל-100%. כלומר הציור "הצליח"
       והתוצאה הייתה מטושטשת יותר ממה שהיה קודם. */
    const boxW = await _vecBox(host);
    if (!(boxW > 0)) continue;
    const sizeW = parseFloat(host.getAttribute('data-vec-w') || '100');
    const cssW = boxW * (sizeW / 100) * z;
    const prev = _vecAt.get(i) || 0;
    const drawn = !!host.querySelector('canvas');
    /* ⚠️ **לעולם לא מחליפים קנבס חד בקנבס מטושטש יותר** — אבל רק
       כשיש קנבס. הניסוח הראשון שלי החסיר את ‎drawn‎, ולכן אחרי
       בנייה-מחדש (שמחקה את הקנבס) מדידה קטנה-במעט חסמה את הציור
       **לגמרי** והעמוד נשאר על התמונה המטושטשת. כלומר המגן שנועד
       למנוע הרעה הוא זה שהנציח אותה. */
    if (drawn && prev && cssW < prev) continue;
    /* ⚠️ **הבאג שדווח (10/08/2026): בכפולה עמוד אחד התחדד
       והשני לא.** כשרינדור-הראסטר באיכות-שיא נוחת, הוא קורא
       ל-renderViewer — וזה בונה מחדש את כל ה-innerHTML ומוחק את
       הקנבס שכבר צויר. הסף שלמטה אמנם אמר "כבר חד מספיק",
       ולכן העמוד לא צויר שוב. שני העמודים נוחתים בזמנים
       שונים, ולכן בדיוק אחד מהם שרד.

       ⚠️ התיקון: הדילוג מותר רק כשהקנבס **אמנם נמצא ב-DOM**.
       זיכרון שמעיד על מצב ה-DOM בלי לבדוק אותו הוא הנחה, וכאן
       ההנחה הייתה שגויה בדיוק במקרה הנפוץ. */
    if (drawn && prev && cssW <= prev * VEC_REDO) continue;      /* כבר חד מספיק */
    _vecBusy.add(i);
    try {
      const c = await _renderCanvas(i + 1, cssW, dpr);
      /* ⚠️ בדיקה מחדש אחרי ה-await: העמוד עלול כבר לא להיות על המסך
         (המשתמש דפדף), והכנסת קנבס לעמוד שהוחלף היא ציור על עמוד אחר. */
      if (showingPages().indexOf(i) < 0) { _vecBusy.delete(i); continue; }
      const live = document.querySelector('[data-vec="' + i + '"]');
      if (!live) { _vecBusy.delete(i); continue; }
      const clip = live.querySelector('.vecclip, .vecwrap');
      if (clip) {
        c.style.width = (sizeW === 100) ? '100%' : (sizeW.toFixed(3) + '%');
        if (sizeW !== 100) {
          /* מיקום זהה לסמנטיקה של background-position באחוזים:
             היסט = (רוחב-מסגרת − רוחב-תמונה) × posX/100. */
          const posX = parseFloat(live.getAttribute('data-vec-x') || '0');
          c.style.left = (((100 - sizeW) * posX) / 100).toFixed(3) + '%';
        }
        clip.innerHTML = '';
        clip.appendChild(c);
        _vecAt.set(i, cssW);
      }
    } catch (e) { /* נשאר הראסטר שמתחת */ }
    _vecBusy.delete(i);
  }
}

// חישוב אזור התצוגה (חיתוך שדרה בלבד) + מיקום מסגרת ה-trim בתוך העמוד, לפי TrimBox
function _pageNetSpec(tf, spine){
  if (window.PageSpine) return PageSpine.netSpec(tf, spine);
  const mediaHmm = tf.hmm / tf.h, mediaWmm = tf.wmm / tf.w;
  let shownL, shownR;
  if (spine === 'left'){ shownL = tf.l; shownR = 1; }            // חותך בליד שמאל (שדרה), מציג עד ימין
  else if (spine === 'right'){ shownL = 0; shownR = tf.l + tf.w; } // חותך בליד ימין (שדרה), מציג עד שמאל
  else { shownL = 0; shownR = 1; }                                 // עמוד יחיד — כל הבליד
  const shownW = shownR - shownL;
  const arr = (shownW * mediaWmm) / mediaHmm;
  const posX = shownW < 1 ? (shownL / (1 - shownW) * 100) : 0;
  const sizeW = 100 / shownW;
  const trimL = (tf.l - shownL) / shownW, trimR = (tf.l + tf.w - shownL) / shownW;
  return { arr, sizeW, posX, frame: { left: trimL*100, top: tf.t*100, width: (trimR-trimL)*100, height: tf.h*100, skip: spine } };
}
// צלבי חיתוך — טיקים שחורים בפינות ה-trim (מדלג על צד השדרה). f = frame ב-% מתוך cropwrap.
function _cropMarksHtml(f){
  const arm = 9, gap = 1;   // px
  const r = (f.left + f.width), b = (f.top + f.height);
  const H = (leftCss, topPct) => `<div class="cmark" style="${leftCss};top:calc(${topPct}% - 0.7px);width:${arm}px;height:1.4px"></div>`;
  const V = (leftPct, topCss) => `<div class="cmark" style="left:calc(${leftPct}% - 0.7px);${topCss};width:1.4px;height:${arm}px"></div>`;
  let out = '';
  if (f.skip !== 'left'){   // פינות שמאל (top-left + bottom-left)
    out += H(`left:calc(${f.left}% - ${gap+arm}px)`, f.top) + V(f.left, `top:calc(${f.top}% - ${gap+arm}px)`);
    out += H(`left:calc(${f.left}% - ${gap+arm}px)`, b)     + V(f.left, `top:calc(${b}% + ${gap}px)`);
  }
  if (f.skip !== 'right'){  // פינות ימין (top-right + bottom-right)
    out += H(`left:calc(${r}% + ${gap}px)`, f.top) + V(r, `top:calc(${f.top}% - ${gap+arm}px)`);
    out += H(`left:calc(${r}% + ${gap}px)`, b)     + V(r, `top:calc(${b}% + ${gap}px)`);
  }
  return out;
}
/* ── בדיקת-התאמה בין שני עמודי הכפולה ──────────────────────────────────
   ⚠️ **זו מדידה, לא תיקון — וזה מכוון (10/08/2026, דיווח-בעלים).**
   בעמודים שיש בהם חיבור-גרפיקה מעבר לשדרה נראתה סטייה של כמה מ"מ.
   לסטייה כזו שני מקורות הפוכים: או שלעמודים גיאומטריה שונה והתצוגה
   מעוותת, או שהגיאומטריה זהה והסטייה נמצאת בקובץ עצמו.

   ⚠️ תיקון-יישור עיוור הוא הנזק הגרוע מהשניים: הוא מיישר את המסך
   ומסתיר פגם שיודפס שגוי. לכן קודם מכריעים, ורק אז מתקנים — ואת
   ההכרעה רואים על המסך, לא בקונסולה. */
var _geomShown = [];      // אינדקסי העמודים בכפולה הנוכחית
var _geomMetas = null;    // ה-meta שלהם

function _mmTxt(v){ return (isFinite(v) ? v.toFixed(2) : '?') + ' מ"מ'; }

function toggleGeomCheck(){
  var el = $('geomPanel');
  if (!el) return;
  if (el.style.display !== 'none') { el.style.display = 'none'; return; }
  var html = '';
  if (!_geomShown || _geomShown.length !== 2) {
    html = '<div style="color:#92400e">\u26a0 בדיקת ההתאמה עובדת על כפולה (שני עמודים זה לצד זה). עברו לכפולה ונסו שוב.</div>';
  } else {
    var a = _geomMetas ? _geomMetas[_geomShown[0]] : null;
    var b = _geomMetas ? _geomMetas[_geomShown[1]] : null;
    var r = PageSpine.compareGeometry(a, b);
    if (!r.ok) {
      html = '<div style="color:#92400e">\u26a0 ' + r.verdict + '</div>';
    } else {
      var col = r.same ? '#b91c1c' : '#0f766e';
      html = '<div style="font-weight:800;margin-bottom:8px;color:' + col + '">'
           + (r.same ? '\u26d4 ' : '\u2713 ') + r.verdict.replace(/\*\*/g, '') + '</div>'
           + '<table style="width:100%;border-collapse:collapse;font-size:.82rem">'
           + '<thead><tr style="background:#f6f6f9;color:#555"><th style="padding:5px;text-align:right">מידה</th>'
           + '<th style="padding:5px;text-align:right">עמוד ' + (_geomShown[0]+1) + '</th>'
           + '<th style="padding:5px;text-align:right">עמוד ' + (_geomShown[1]+1) + '</th>'
           + '<th style="padding:5px;text-align:right">הפרש</th></tr></thead><tbody>';
      r.fields.forEach(function(f){
        html += '<tr style="border-bottom:1px solid var(--line);'
             + (f.differs ? 'background:#fef3c7;font-weight:700' : '') + '">'
             + '<td style="padding:5px">' + f.key + '</td>'
             + '<td style="padding:5px">' + _mmTxt(f.a) + '</td>'
             + '<td style="padding:5px">' + _mmTxt(f.b) + '</td>'
             + '<td style="padding:5px">' + _mmTxt(f.diff) + '</td></tr>';
      });
      html += '</tbody></table>';
      /* ⚠️ המסקנה המעשית נאמרת במפורש. טבלת-מספרים בלי "אז מה עכשיו"
         משאירה את המשתמש עם אותה שאלה שאיתה הוא בא. */
      html += r.same
        ? '<div style="margin-top:9px;padding:8px 10px;background:#fee2e2;border-radius:7px;color:#991b1b">'
          + 'שני העמודים נמדדים זהה, ולכן התצוגה אינה מקור הסטייה. '
          + 'האמנות עצמה ממוקמת אחרת בשני העמודים — יש לתקן בקובץ אצל מי שהכין אותו, '
          + 'אחרת החיבור יצא כך גם בדפוס.</div>'
        : '<div style="margin-top:9px;padding:8px 10px;background:#ecfdf5;border-radius:7px;color:#065f46">'
          + 'ההפרש המסומן הוא שמזיז את האמנות בתצוגה. שלחו לי את הצילום הזה ואיישר את הצופה לפי קו-החיתוך.</div>';
    }
  }
  el.innerHTML = html;
  el.style.display = 'block';
}

/* ── פאנל-איכות: מה באמת מרונדר, ואפשרות להשוות ──────────────────────
   ⚠️ **נבנה כי השאלה "איך אני רואה שהשתפר" היא שאלה הוגנת שלא הייתה
   לה תשובה.** שיפור שאי אפשר למדוד הוא טענה, לא תוצאה. הפאנל מראה את
   המספרים בפועל, ומאפשר לכפות איכות מרבית כדי להשוות בעין. */



function step(d){
  /* ⚠️ במצב-קריאה מתקדמים עמוד אחד; בכפולה שניים. דילוג-כפול במצב
     עמוד-יחיד היה מדלג על מחצית העיתון בלי שהמשתמש יבחין. */
  if (_viewMode !== 'spread') {
    vIndex = Math.max(0, Math.min(vIndex + d, imgs.length - 1));
  } else {
    if (vIndex === 0) vIndex = d > 0 ? 1 : 0;
    else vIndex = Math.max(0, Math.min(vIndex + d*2, imgs.length - 1));
    if (vIndex > 0 && vIndex % 2 === 0) vIndex -= 1;
  }
  renderViewer();
}
$('vprev').onclick = () => step(-1);
$('vnext').onclick = () => step(+1);
/* מעבר-מהיר לעמוד (בקשת-בעלים 14/08) — לדפוס וללקוחות: לחיצה על המונה
   שואלת מספר-עמוד וקופצת אליו. במצב-כפולות נוחתים על הכפולה הנכונה. */
function goToPage(n){
  n = parseInt(n, 10);
  if (!isFinite(n) || n < 1 || n > imgs.length){ if (isFinite(n)) alert('בעיתון הזה יש ' + imgs.length + ' עמודים.'); return; }
  vIndex = n - 1;
  if (_viewMode === 'spread' && vIndex > 0 && vIndex % 2 === 0) vIndex -= 1;   // אותו יישור-כפולה של step()
  renderViewer();
}
window.goToPage = goToPage;
(function(){
  var ask = function(){
    var v = prompt('לאיזה עמוד לעבור? (1–' + imgs.length + ')');
    if (v !== null) goToPage(v);
  };
  var vl = $('vlabel');
  if (vl){ vl.style.cursor = 'pointer'; vl.title = 'לחיצה — מעבר מהיר לעמוד מסוים'; vl.onclick = ask; }
  var vg = $('vgoto'); if (vg) vg.onclick = ask;
})();
$('vgeom').onclick = toggleGeomCheck;
$('vmode').onclick = toggleViewMode;
_applyViewMode();
$('vfs').onclick = () => { const v=$('viewer'); if (document.fullscreenElement) document.exitFullscreen(); else (v.requestFullscreen||v.webkitRequestFullscreen).call(v); };
/* הכפתורים "📄 הקובץ המקורי" ו-"⚙️ מנוע תצוגה ישן" הוסרו מהסרגל לבקשת הבעלים
   (2026-07-30) — המנוע העדכני מצייר נכון, ולכן הם היו רעש. הפונקציות נשארות:
   ?engine=old עדיין עובד לבדיקה, והאזהרה על עמודי-שקיפות (שמופיעה רק במנוע
   הישן) עדיין מציעה לפתוח את הקובץ המקורי. */
// ── זום בדפדוף (לחצן + גלגלת + גרירה) — לצפייה מקרוב בגיליון שהלקוח העלה ──
(function(){
  var sp=$('spread'), btn=$('vzoom'); if(!sp||!btn) return;
  var on=false, sc=1, tx=0, ty=0, drag=null;
  /* ⚠️ שני באגים שתוקנו (2026-07-30):
     1) הזום לא עבד בעיתונים שמצהירים קו-חיתוך — עמוד כזה מוצג כ-.cropwrap
        (רקע + מסגרת + צלבים) ולא כ-<img>, והבורר חיפש רק canvas/img.
     2) אחרי התיקון הראשון, כל עמוד הוגדל סביב *המרכז שלו* — ולכן בכפולה שני
        העמודים גדלו זה-לתוך-זה והעמוד השמאלי עלה על הימני.
     הפתרון לשניהם: מגדילים את הכפולה כ**יחידה אחת** (.zoomWrap שעוטפת את שני
     העמודים). כך היחס והמפגש בשדרה נשמרים בכל רמת-זום. */
  var _vecT = null;
  function zoomEl(){ return sp.querySelector('.zoomWrap'); }
  function apply(){
    var t = zoomEl();
    if (t){
      t.style.transform = 'translate('+tx+'px,'+ty+'px) scale('+sc+')';
      t.style.cursor = (on && sc>1) ? 'grab' : (on ? 'zoom-in' : '');
    }
    sp.style.overflow = on ? 'hidden' : '';
    btn.textContent = on ? ('🔍 זום '+Math.round(sc*100)+'%') : '🔍 זום';
    btn.style.background = on ? '#c9a84c' : ''; btn.style.color = on ? '#1a1a2e' : '';
  }
  function reset(){ sc=1; tx=0; ty=0; apply(); }
  /* ⚠️ הסקאלה נחשפת כדי שהרינדור יכוון אליה. בלעדיה זום 6× מתח תמונה
     של 3000 פיקסלים — כלומר דווקא ההגדלה, שנועדה לבדוק את הפרטים
     הקטנים, הציגה אותם מרוככים. */
  window._pvZoomScale = function(){ return sc; };
  window._pvZoomReset = reset;                       // מעבר-עמוד מאפס
  window._pvZoomApply = apply;                       // רינדור-מחדש (איכות-שיא) לא מאבד את הזום
  btn.onclick=function(){ on=!on; if(!on) reset(); else apply(); };
  sp.addEventListener('wheel', function(e){
    if(!on) return; e.preventDefault();
    var prev=sc; sc=Math.min(6, Math.max(1, sc*(e.deltaY<0?1.15:1/1.15)));
    if(sc===1){ tx=0; ty=0; } else { var k=sc/prev; tx*=k; ty*=k; }
    apply();
    /* ⚠️ ציור-מחדש אחרי שהזום נח, ורק במצב-הקריאה: זה מה שהופך את
       ההגדלה לחדה-באמת במקום למתוחה. השהיה, כי גלגלת יורה עשרות
       אירועים ורינדור לכל אחד היה משתק את הדפדפן. */
    clearTimeout(_vecT);
    _vecT = setTimeout(function(){ try { _vectorize(showingPages()); } catch(e){} }, 260);
  }, {passive:false});
  sp.addEventListener('mousedown', function(e){ if(!on||sc<=1) return; e.preventDefault(); drag={x:e.clientX-tx,y:e.clientY-ty}; });
  window.addEventListener('mousemove', function(e){ if(!drag) return; tx=e.clientX-drag.x; ty=e.clientY-drag.y; apply(); });
  window.addEventListener('mouseup', function(){ drag=null; apply(); });
  sp.addEventListener('dblclick', function(){ if(on) reset(); });
  ['vprev','vnext'].forEach(function(id){ var b=$(id); if(b) b.addEventListener('click', function(){ setTimeout(reset,0); }); });
})();
/* מקלדת מודעת-כיוון: ב-RTL חץ-שמאל מתקדם; ב-LTR חץ-ימין מתקדם.
   (הכיוון משנה רק ניווט/סדר — לעולם לא משקף תוכן.) */
/* ⚠️ **ניווט מקלדת מלא (בקשת-בעלים 10/08/2026).** חצי-כיוון בלבד לא
   הספיקו: במצבי-הגלילה החצים האנכיים שייכים לגלילה, ולכן הדפדוף עבר
   ל-PageUp/PageDown, והוסף קיצור-קצה (Home/End) לעיתון של 48 עמודים.
   ⚠️ מדלגים כשהפוקוס בשדה-קלט או כשמקש-צירוף לחוץ — אחרת הקלדה
   בתיבה כלשהי הייתה מדפדפת את העיתון מתחת לידיים. */
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const el = document.activeElement;
  if (el && (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable)) return;
  const fwd  = (_readDir === 'ltr') ? 'ArrowRight' : 'ArrowLeft';
  const back = (_readDir === 'ltr') ? 'ArrowLeft'  : 'ArrowRight';
  let d = 0;
  if (e.key === fwd || e.key === 'PageDown' || e.key === ' ') d = +1;
  else if (e.key === back || e.key === 'PageUp') d = -1;
  else if (e.key === 'Home') { vIndex = 0; renderViewer(); e.preventDefault(); return; }
  else if (e.key === 'End')  { vIndex = Math.max(0, imgs.length - 1);
                               if (_viewMode === 'spread' && vIndex > 0 && vIndex % 2 === 0) vIndex -= 1;
                               renderViewer(); e.preventDefault(); return; }
  else if (e.key === 'm' || e.key === 'M') { toggleViewMode(); e.preventDefault(); return; }
  if (!d) return;
  e.preventDefault();
  step(d);
});

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fail(msg){ showOverlay(msg, true); throw new Error(msg); }

/* ── כשל שאי-אפשר "להמשיך למרות" ──────────────────────────────────────────
   ⚠️ מסך-כשל מלא עם "נסה שוב", ולא באנר מעל תצוגה חלקית. הכלל שנקבע:
   אין מונה לא-ודאי, אין נפילה-לאחור שקטה, ואין צפייה בתצוגה שלא ידוע אם
   היא מדויקת. ‏proof-viewer הוא מסך-הצוות ואין בו כפתור-אישור, ולכן
   "אין אישור מתצוגה לא מדויקת" מתקיים כאן במבנה; המסך שכן מאשר
   (‏proof-client / customer-fold-preview) אינו נוגע במסלול הזה.
   ⚠️ המונה **נמחק** ולא נשאר על ערכו האחרון: מספר ישן על מסך-כשל הוא
   בדיוק המידע השגוי שבאנו למנוע. */
function _hardFail(title, detail){
  try { show('viewer', false); } catch(e){}
  try { const vl = $('vlabel'); if (vl) vl.textContent = ''; } catch(e){}
  const ov = document.getElementById('overlay');
  if (!ov) { alert(title); return; }
  ov.style.display = 'flex';
  ov.innerHTML = '<div style="max-width:420px;text-align:center;direction:rtl;color:#e6e9f5;padding:18px">'
    + '<div style="font-size:2rem;margin-bottom:8px">⚠️</div>'
    + '<div style="font-size:1rem;font-weight:800;margin-bottom:6px">' + title + '</div>'
    + '<div style="font-size:.86rem;opacity:.85;line-height:1.6;margin-bottom:14px">' + detail + '</div>'
    + '<button id="ovRetry" style="padding:10px 22px;border-radius:10px;border:0;background:#2d3561;'
    + 'color:#fff;font:inherit;font-size:.9rem;font-weight:800;cursor:pointer">↻ נסה שוב</button></div>';
  const b = document.getElementById('ovRetry');
  if (b) b.onclick = () => location.reload();
}
/* ⚠️ **השומר של חוזה-המטמון.** כל יציאה מוקדמת אחרי שהתצוגה-הזמנית
   עלתה חייבת לעבור כאן. אם המטמון עדיין על המסך — זה כשל גלוי, כי
   הצופה אינו יכול להבחין בין "נעצר" לבין "זה הפרופר".
   ⚠️ כשאין מטמון על המסך אין מה לעשות: הקורא (‏_requireLibs / PdfEngine)
   כבר הציג את ההודעה שלו, ואין טעם לכסות אותה במסך-כשל שני. */
function _bailOut(reason){
  if (!_fromCache) return;
  console.error('[proof-viewer] יציאה מוקדמת בזמן תצוגה-זמנית:', reason || '');
  _hardFail('לא הצלחנו להשלים את בדיקת הפרופר',
    'מה שהוצג עד כה היה תצוגה זמנית בלבד ולא אומת מול הקובץ. אין להסתמך עליה.');
}

/* ⚠️ מטמון שאינו תואם לקובץ = מה שהוצג היה ספירה אחרת (כפולות שלא
   פוצלו, או רשומה עם spreadCount שגוי). עד 08/08/2026 זה היה באנר
   שחלף — כלומר "הצגנו לך מספר שגוי" בהודעה בת תשע שניות. */
function _cacheMismatch(cacheLen, realLen){
  console.error('[proof-viewer] מטמון לא תואם: ' + cacheLen + ' ≠ ' + realLen);
  _hardFail('התצוגה המהירה לא תאמה את הקובץ',
    'התצוגה הזמנית הראתה ' + cacheLen + ' עמודים, ובקובץ יש ' + realLen + '. '
    + 'כדי שלא להציג מספור שגוי — טענו מחדש.');
}

function _splitFailed(reason){
  console.error('[proof-viewer] פיצול-כפולות נכשל:', reason || '');
  _hardFail('לא הצלחנו להכין את התצוגה',
    'לא ניתן היה לקבוע את חלוקת העמודים בקובץ, ולכן אין להציג אותו — '
    + 'מספור העמודים וצד-השדרה היו עלולים להיות שגויים.');
}
