<!-- ⚠️ אין כאן auth-guard, ובכוונה: טלפון הסריקה הוא **מכונה** ולא עובד.

<script>
// דף סריקת QR מכרטיס עבודה מודפס: ?c=<מזהה כרטיס> [&r=<ריצה>]
// סדר עדיפויות:
//   1) חוברת אמיתית (עיתון/חוברת/8+ עמ') עם קובץ שהלקוח העלה במערכת האישורים →
//      דפדוף מקובץ הלקוח (proof-viewer) — סדר קריאה כפי שאושר.
//   2) חוברת בלי קובץ לקוח אך עם פרופר גיליון → קיפול הפרופר לחוברת (כלי הקיפול).
//   3) לא-חוברת (פוסטר/פלייסמנט/עלון שטוח) → פתיחת הקובץ ישירות — בלי קיפול בכלל.
//   4) אין קבצים עדיין → המתנה; הדף נפתח אוטומטית ברגע שמגיע קובץ (לקוח או פרופר).
var _FBURL = 'https://solan-printing-default-rtdb.europe-west1.firebasedatabase.app';
var _FB_APIKEY = 'AIzaSyAFp99furP4L5hqTI-horBHmGZC9s13dGg';
// ── שומר-סביבה (רשת ביטחון · ספרינט 1 שלב 5) — פתיחה מקומית לא כותבת ל-Firebase החי ──
//    production = הדומיין הרשמי בלבד; אחרת development (חסום ללא אישור); test = מאולץ.
//    עוטף fetch + XMLHttpRequest וחוסם כתיבות (PUT/POST/PATCH/DELETE) לכתובות RTDB/Storage
//    בכל סביבה שאינה production. בייצור — תמיד עובר (אפס שינוי התנהגות). זהה בכל הדפים.
(function(){
  if (window._solanEnvGuardReady) return;              // אידמפוטנטי — לא לעטוף פעמיים
  window._solanEnvGuardReady = true;
  window._solanEnv = (function(){
    try {
      if (typeof window._SOLAN_ENV_FORCE === 'string') return window._SOLAN_ENV_FORCE;
      var h = (typeof location !== 'undefined' && location.hostname || '').toLowerCase();
      return (h === 'solanprinting.github.io') ? 'production' : 'development';
    } catch(e){ return 'development'; }
  })();
  window._solanEnvNow = function(){ return (typeof window._SOLAN_ENV_FORCE === 'string') ? window._SOLAN_ENV_FORCE : window._solanEnv; };
  window._solanIsProd = function(){ return window._solanEnvNow() === 'production'; };
  window._solanWritesAllowed = function(){
    var e = window._solanEnvNow();
    if (e === 'production')  return true;
    if (e === 'development') return window._SOLAN_ALLOW_DEV_WRITES === true;
    return false;                                       // test — לעולם לא
  };
  window._solanIsFbWriteUrl = function(url, method){
    url = String(url == null ? '' : url); method = String(method || 'GET').toUpperCase();
    if (method === 'GET' || method === 'HEAD' || method === 'OPTIONS') return false;   // קריאות תמיד מותרות
    return url.indexOf('firebasedatabase.app') >= 0 || url.indexOf('firebasestorage.googleapis.com') >= 0 || url.indexOf('storage.googleapis.com') >= 0;
  };
  window._fbWriteGuard = function(op){
    if (window._solanWritesAllowed()) return true;
    try { console.warn('⛔ [SOLAN ' + window._solanEnvNow().toUpperCase() + '] כתיבה ל-Firebase נחסמה (הגנת סביבה): ' + op + '\n   לאישור זמני בפיתוח בלבד: window._SOLAN_ALLOW_DEV_WRITES = true'); } catch(e){}
    try { window._solanDevBanner && window._solanDevBanner(); } catch(e){}
    return false;
  };
  window._solanDevBanner = function(){
    if (window._solanIsProd()) return;
    try {
      if (typeof document === 'undefined' || document.getElementById('solan-dev-banner')) return;
      var b = document.createElement('div'); b.id = 'solan-dev-banner';
      b.textContent = '🛠️ סביבת ' + window._solanEnvNow().toUpperCase() + ' — כתיבה ל-Firebase חסומה (הגנה מפני דריסת ייצור)';
      b.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:2147483000;background:#b45309;color:#fff;font:700 12px Heebo,Arial;padding:5px 12px;text-align:center;direction:rtl;box-shadow:0 -2px 8px rgba(0,0,0,.3);pointer-events:none';
      (document.body || document.documentElement).appendChild(b);
    } catch(e){}
  };
  try {                                                 // עוטף fetch — כתיבת RTDB/Storage חסומה מחוץ ל-production
    var _of = window.fetch;
    if (_of && !_of._solanGuarded) {
      var wf = function(input, init){
        try {
          var url = (typeof input === 'string') ? input : (input && input.url) || '';
          var method = (init && init.method) || (typeof input !== 'string' && input && input.method) || 'GET';
          if (window._solanIsFbWriteUrl(url, method) && !window._fbWriteGuard(method + ' ' + url))
            return Promise.resolve(new Response('{"error":"blocked-by-solan-env-guard"}', { status: 503, statusText: 'blocked-by-solan-env-guard' }));
        } catch(e){}
        return _of.apply(this, arguments);
      };
      wf._solanGuarded = true; window.fetch = wf;
    }
  } catch(e){}
  try {                                                 // עוטף XMLHttpRequest — העלאות/מחיקות Storage חסומות מחוץ ל-production
    var XP = window.XMLHttpRequest && window.XMLHttpRequest.prototype;
    if (XP && !XP._solanGuarded) {
      var _xopen = XP.open, _xsend = XP.send;
      XP.open = function(method, url){ this._solanMethod = method; this._solanUrl = url; return _xopen.apply(this, arguments); };
      XP.send = function(){
        try {
          if (window._solanIsFbWriteUrl(this._solanUrl, this._solanMethod) && !window._fbWriteGuard((this._solanMethod || '') + ' ' + this._solanUrl)) {
            var self = this;
            setTimeout(function(){ try { self.dispatchEvent(new Event('error')); } catch(e){ if (typeof self.onerror === 'function') try { self.onerror(new Event('error')); } catch(_){} } }, 0);
            return;                                     // בקשה אמיתית לא נשלחת
          }
        } catch(e){}
        return _xsend.apply(this, arguments);
      };
      XP._solanGuarded = true;
    }
  } catch(e){}
  try { if (typeof document !== 'undefined') { if (document.readyState !== 'loading') window._solanDevBanner(); else document.addEventListener('DOMContentLoaded', window._solanDevBanner); } } catch(e){}
})();
// ── App Check (reCAPTCHA v3) — עוטף fetch ומצרף X-Firebase-AppCheck לכל בקשה ל-RTDB.
//    מצב ניטור עד אכיפה בקונסולה; אם ה-SDK נכשל — אין header ושום דבר לא נחסם. ריק = כבוי.
var _APPCHECK_SITEKEY = '6LeYDVMtAAAAAAsc-qvVPz9QvLhIlDBfcYCl-pXI';
window._appCheckReady = null;
window._appCheckInit = function(){
  if (!_APPCHECK_SITEKEY) return Promise.resolve(null);
  if (window._appCheckReady) return window._appCheckReady;
  window._appCheckReady = new Promise(function(resolve){
    function load(src){ return new Promise(function(res, rej){ var s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
    var base='https://www.gstatic.com/firebasejs/10.12.5/';
    load(base+'firebase-app-compat.js').then(function(){ return load(base+'firebase-app-check-compat.js'); }).then(function(){
      try {
        if (!firebase.apps.length) firebase.initializeApp({ apiKey:_FB_APIKEY, authDomain:'solan-printing.firebaseapp.com', projectId:'solan-printing', databaseURL:_FBURL, appId:'1:1094826649317:web:bd5f5efdc1f8e3ab67160c' });
        var ac=firebase.appCheck(); ac.activate(new firebase.appCheck.ReCaptchaV3Provider(_APPCHECK_SITEKEY), true); resolve(ac);
      } catch(e){ resolve(null); }
    }).catch(function(){ resolve(null); });
  });
  return window._appCheckReady;
};
window._appCheckToken = function(){
  if (!_APPCHECK_SITEKEY) return Promise.resolve(null);
  return window._appCheckInit().then(function(ac){
    if (!ac) return null;
    return Promise.race([ ac.getToken(false).then(function(r){ return (r&&r.token)||null; }).catch(function(){ return null; }), new Promise(function(res){ setTimeout(function(){ res(null); }, 8000); }) ]);
  }).catch(function(){ return null; });
};
(function(){
  var _of = window.fetch;
  window.fetch = function(input, init){
    try {
      var url = (typeof input==='string') ? input : (input && input.url) || '';
      if (_APPCHECK_SITEKEY && url.indexOf('firebasedatabase.app') >= 0) {
        return window._appCheckToken().then(function(ac){
          init = init || {};
          if (ac) { var h = new Headers(init.headers || (typeof input!=='string' && input.headers) || {}); h.set('X-Firebase-AppCheck', ac); init.headers = h; }
          return _of.call(window, input, init);
        });
      }
    } catch(e){}
    return _of.call(window, input, init);
  };
})();
try { window._appCheckToken(); } catch(e){}
var FN = 'https://europe-west1-solan-printing.cloudfunctions.net/';

/* ── זהות הטלפון ────────────────────────────────────────────────────────
   ⚠️ הטלפון אינו קורא ואינו כותב ב-RTDB. עד עכשיו הוא משך את **כל** צומת
   cards ואת **כל** צומת customerProofs כדי למצוא כרטיס אחד, וזו הייתה
   הסיבה היחידה שהוא היה תלוי בהרשאה האנונימית הגורפת.

   ⚠️ הזהות היא של **המכשיר**, לא של אדם: accountType='machine', role='scan',
   ו-deviceId משלו. אין חשבון משותף ואין סיסמה בטלפון. מכשיר שאבד מבוטל
   בנפרד, ומחיקת נתוני הדפדפן מחייבת רישום מחדש — וזה מכוון.

   ⚠️ ה-QR לא השתנה. הוא נושא מזהה-כרטיס ותו לא, וכל המדבקות המודפסות
   ממשיכות לעבוד. */
function callFn(name, data){
  return SolanAuth.idToken(false).then(function(t){
    return fetch(FN + name, { method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + t },
      body: JSON.stringify({ data: data || {} }) });
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      /* ⚠️ כשל אינו נבלע ואינו מוצג כהצלחה — סימון שנראה כאילו נשמר ולא
         נשמר הוא בדיוק התבנית שחזרה כאן. */
      if (!r.ok) {
        var e = new Error((j.error && j.error.message) || 'שגיאה');
        e.status = (j.error && j.error.status) || '';
        /* ⚠️ הקוד המכונתי לזיהוי-מצב; המשתמש רואה את ההודעה בעברית בלבד */
        e.code = (j.error && j.error.details && j.error.details.code) || '';
        throw e;
      }
      return j.result;
    });
  });
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function norm(s){ return String(s||'').toLowerCase().replace(/[^0-9a-zא-ת ]+/g,' ').replace(/\s+/g,' ').trim(); }

// ── האם זו חוברת אמיתית? רק אז מקפלים/מדפדפים. פוסטר/פלייסמנט/עלון שטוח — לא. ──
function isBooklet(card){
  var pg = parseInt(card.pages, 10);
  if (!isNaN(pg) && pg >= 8) return true;
  var txt = norm((card.type||'') + ' ' + (card.name||''));
  if (/עיתון|חוברת|קטלוג|ספר/.test(txt)) return true;
  if (/פוסטר|פלייסמנט|פלסמנט|מדבק|כרזה/.test(txt)) return false;
  return false;   // ספק — לא מקפלים (פותחים ישירות); עדיף מלהפוך פוסטר לחוברת
}

/* ── קבצי לקוח ──────────────────────────────────────────────────────────
   ⚠️ ההתאמה עברה לשרת (functions/scan.js · matchProofs), ואותה לוגיקה
   בדיוק — נרמול והכלה דו-כיוונית. הסיבה אינה יופי: עד עכשיו הטלפון הוריד
   את **כל** עבודות **כל** הלקוחות רק כדי לסנן אחת. עכשיו יוצאות מהשרת
   ההתאמות של הכרטיס הזה בלבד, ובלי כתובות-קבצים.
   ⚠️ החתימה נשמרה כדי שכל הקוראים למטה לא ישתנו. */
function customerMatches(card, proofsList){
  return (proofsList || []).map(function(m){
    return { id: m.id, rec: { customer: m.customer, title: m.title }, when: m.approvedAt || 0 };
  });
}

// ── פרופרים על הכרטיס ──
function collectProofs(card){
  var entries = [];
  if (card.runProofs) Object.keys(card.runProofs).sort().forEach(function(k){
    var rp = card.runProofs[k];
    if (rp && rp.url) entries.push({ key:k, name:rp.name||k, url:rp.url, check:rp.check||null });
  });
  if (card.proofUrl) entries.push({ key:null, name:card.proofName||'פרופר', url:card.proofUrl, check:card.proofCheck||null });
  if (rk) entries = entries.filter(function(e){ return String(e.key) === String(rk); });
  return entries;
}
function _lab(name){
  var s = String(name||'').toLowerCase();
  return {
    tumble:    s.indexOf('מתהפך')>=0 || s.indexOf('tumble')>=0 || s.indexOf('turn')>=0,
    perfector: s.indexOf('פרפקטור')>=0 || s.indexOf('perfector')>=0 || /\bperf\b/.test(s),
    ab:        /a\s*\+\s*b/.test(s) || s.indexOf('a+b')>=0 || /א\s*\+\s*ב/.test(s)
  };
}
function _machineOf(card, runKey){
  if (runKey && card.runs && card.runs.length){
    var n = parseInt(String(runKey).replace(/[^0-9]/g,''),10);
    var r = card.runs.find(function(x){ return x && ('R'+x.num)===String(runKey); }) || (!isNaN(n) ? card.runs[n-1] : null);
    if (r && r.machine) return r.machine;
  }
  return card.machine || '';
}
// יעד לפרופר: חוברת → קיפול; לא-חוברת → פתיחה ישירה (בלי להפוך פוסטר לחוברת)
function proofTarget(card, entry){
  if (!isBooklet(card)) return entry.url;
  var chk = entry.check || null;
  if (chk && chk.imposed === false) return entry.url;
  var lab = _lab(entry.name);
  var pages = chk && chk.pages;
  var sides2;
  if (lab.tumble) sides2 = false;
  else if (lab.perfector || lab.ab) sides2 = true;
  else if (pages === 1) sides2 = false;
  else if (pages >= 2) sides2 = true;
  else sides2 = (_machineOf(card, entry.key).indexOf('8') >= 0);
  var type = sides2 ? '32' : '16p';
  return 'imposition-tool.html?v=6&auto=1&type=' + type
    + '&proofUrl=' + encodeURIComponent(entry.url)
    + '&name=' + encodeURIComponent(entry.name || card.name || 'פרופר');
}

var FB_CONFIG_SCAN = { apiKey:_FB_APIKEY, authDomain:'solan-printing.firebaseapp.com',
  projectId:'solan-printing', databaseURL:_FBURL, appId:'1:1094826649317:web:bd5f5efdc1f8e3ab67160c' };
var qs = new URLSearchParams(location.search);
var cid = qs.get('c'), rk = qs.get('r');
var sub = document.getElementById('sub'), body = document.getElementById('body');

/* ⚠️ findCard הוסרה: השרת מחזיר כרטיס אחד לפי מזהה, ומסרב אם יש שניים.
   החיפוש-בצד-הלקוח היה מחייב להוריד את כל הכרטיסים. */
function loadCard(){ return callFn('scanGetCard', { cardId: cid }); }
function go(url, msg){
  body.innerHTML = '<div class="spin"></div><div style="font-size:.85rem;color:rgba(255,255,255,.65)">' + esc(msg||'פותח…') + '</div>';
  location.replace(url);
}
// החלטה ראשית: קובץ לקוח קודם (לחוברות), אחר כך פרופר. מחזיר true אם נמצא יעד.
function resolveAndGo(card, proofsMap){
  // חוברת מקופלת שצורפה ידנית לכרטיס (גיליון פרוס + סוג קיפול) — קדימות עליונה
  if (card.bookletSheetUrl && !rk) {
    go('imposition-tool.html?v=6&auto=1&type=' + encodeURIComponent(card.bookletFoldType || '32')
       + '&proofUrl=' + encodeURIComponent(card.bookletSheetUrl)
       + '&name=' + encodeURIComponent(card.bookletName || card.name || 'חוברת'), 'פותח את החוברת המקופלת…');
    return true;
  }
  var booklet = isBooklet(card);
  if (booklet) {
    var cm = customerMatches(card, proofsMap);
    if (cm.length === 1) { go('proof-viewer.html?id=' + encodeURIComponent(cm[0].id), 'פותח את החוברת שהלקוח העלה…'); return true; }
    if (cm.length > 1) {
      body.innerHTML = '<div style="font-size:.9rem;margin-bottom:4px">נמצאו כמה קבצי לקוח — בחר:</div>'
        + cm.map(function(m,i){
            var nm = [m.rec.customer, m.rec.title].filter(Boolean).join(' · ') || 'עיתון';
            return '<button class="btn' + (i>0?' alt':'') + '" data-u="proof-viewer.html?id=' + encodeURIComponent(m.id) + '">📖 ' + esc(nm) + '</button>';
          }).join('');
      body.querySelectorAll('button').forEach(function(b){ b.onclick = function(){ location.href = b.dataset.u; }; });
      return true;
    }
  }
  var entries = collectProofs(card);
  if (entries.length === 1) { go(proofTarget(card, entries[0]), booklet ? 'אין קובץ לקוח — מקפל את הפרופר לחוברת…' : 'פותח את הקובץ…'); return true; }
  if (entries.length > 1) {
    body.innerHTML = '<div style="font-size:.9rem;margin-bottom:4px">לעבודה זו כמה קבצים — בחר ריצה:</div>'
      + entries.map(function(e,i){
          return '<button class="btn' + (i>0?' alt':'') + '" data-i="' + i + '">📖 ' + esc(e.key||'קובץ') + ' — ' + esc(e.name) + '</button>';
        }).join('');
    body.querySelectorAll('button').forEach(function(b){
      b.onclick = function(){ location.href = proofTarget(card, entries[parseInt(b.dataset.i,10)]); };
    });
    return true;
  }
  return false;
}
// אין עדיין קבצים: המתן — בודק גם קבצי לקוח (customerProofs) וגם פרופרים (דרך _rev/cards הזעיר)
function waitForFiles(){
  body.innerHTML = '<div class="spin"></div>'
    + '<div class="wait">⏳ עדיין לא הגיעו קבצים לעבודה זו.<br>'
    + 'ברגע שיגיע קובץ (מהלקוח או פרופר) — הוא ייפתח כאן אוטומטית.<br>'
    + '<span style="font-size:.75rem;color:rgba(255,255,255,.55)">אפשר להשאיר את המסך פתוח או לסרוק שוב מאוחר יותר.</span></div>'
    + '<button class="btn alt" id="chk-now">🔄 בדוק עכשיו</button>';
  var ticks = 0, iv;
  /* ⚠️ שער-הגרסה (_rev) הוסר: הוא נועד לחסוך הורדה של **כל** צומת cards,
     וקריאה אחת שמחזירה כרטיס אחד אינה צריכה אותו. */
  function check(force){
    loadCard().then(function(r){
      if (!r || !r.card) return;
      window._scanCard = r.card;
      window._scanProofs = r.proofs || [];
      if (r.stages && typeof r.stages === 'object') _scanStages = r.stages;
      if (resolveIfReady(r.card, window._scanProofs)) { if (iv) clearInterval(iv); }
    }).catch(function(){});
  }
  function resolveIfReady(card, proofsMap){
    var hasCustomer = isBooklet(card) && customerMatches(card, proofsMap).length > 0;
    var hasProof = collectProofs(card).length > 0;
    var hasBooklet = !!card.bookletSheetUrl && !rk;
    if (hasCustomer || hasProof || hasBooklet) { resolveAndGo(card, proofsMap); return true; }
    return false;
  }
  iv = setInterval(function(){ if (++ticks > 90) { clearInterval(iv); return; } check(false); }, 20000);   // עד 30 דק'
  document.getElementById('chk-now').onclick = function(){ check(true); };
  check(false);
}

// ── שלבי גימור נדרשים לפי סוג העבודה (תואם לוגיקת האפליקציה) ──
function _isFullSheet(c){
  var hay = ((c.size||'')+' '+(c.name||'')+' '+(c.type||'')+' '+(c.notes||'')).toLowerCase();
  if (/חצי\s*גיליון/.test(hay)) return false;
  if (/70[\s×x*]?100|100[\s×x*]?70/.test(hay)) return true;
  if (/פוסטר\s*גיליון|גיליון\s*מלא/.test(hay)) return true;
  if (/\bגיליון\b/.test(hay) && !/חצי/.test(hay)) return true;
  return false;
}
function _needsCut(c){ if (c.needsFolding || c.needsBinding || c.noCut || c.noFinishing) return false; return !_isFullSheet(c); }
function _bookletish(c){
  var pages = parseInt(c.pages, 10) || 0;
  if (pages > 4) return true;
  var txt = ((c.type||'') + ' ' + (c.name||'')).toLowerCase();
  return /עיתון|חוברת|קטלוג|מגזין|ספר/.test(txt);
}
function _stagesFor(c){
  if (_bookletish(c)) return ['fold','bind'];          // עיתון/חוברת/יותר מ-4 עמ' → קיפול + כריכה
  if (c.needsFolding && c.needsBinding) return ['fold','bind'];
  if (c.needsBinding) return ['bind'];
  if (c.needsFolding) return ['fold'];
  if (_needsCut(c)) return ['cut'];
  return [];
}
var _STG = { cut:{ btn:'✂️ סמן הושלם בחיתוך', done:'חיתוך' }, fold:{ btn:'📐 סמן כהושלמה בקיפול', done:'קיפול' }, bind:{ btn:'📚 סמן כהושלמה בכריכייה', done:'כריכה' } };
var _scanStages = {};   // מצב שלבים מקומי (מ-scanStages בשרת + אופטימי)
function _stageDone(card, s){ return !!(card[s+'Done'] || (_scanStages[s] && _scanStages[s].done)); }
function _rawUrl(card){
  if (card.bookletSheetUrl) return card.bookletSheetUrl;
  var e = collectProofs(card); if (e.length) return e[0].url;
  return null;
}
/* ═══════════ זיהוי הממלא + תיעוד שעה ═══════════
   כל סימון מהסריקה נרשם בשם מי שסימן ובחותמת זמן. השם נזכר במכשיר,
   כך שדפס/כורך לא מקליד אותו כל פעם מחדש. */
function _whoAmI(force){
  var saved = '';
  try { saved = localStorage.getItem('solanScanBy') || ''; } catch(e){}
  if (saved && !force) return saved;
  var nm = prompt('מה השם שלך?\n(נרשם יחד עם השעה על כל סימון)', saved || '');
  if (nm === null) return null;
  nm = nm.trim();
  if (!nm) return null;
  try { localStorage.setItem('solanScanBy', nm); } catch(e){}
  return nm;
}
function _stampNow(){
  var d = new Date();
  return { at: d.getTime(), atText: d.toLocaleString('he-IL', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }) };
}
/* ⚠️ החותמת נקבעת **בשרת**. עד עכשיו היא הגיעה מ-Date של הטלפון, וטלפון
   עם שעון שגוי רשם סיום-עבודה בתאריך אחר.
   ⚠️ תצוגה אופטימית נשארה — הכפתור הופך ל-✓ מיד — אבל כשל מחזיר אותה
   לאחור ואומר זאת. סימון שנשאר ירוק בלי שנשמר הוא כשל שקט. */
function _markStage(card, s){
  var by = _whoAmI(); if (!by) return;
  var prev = _scanStages[s];
  _scanStages[s] = { done:true, at: Date.now(), by: by };
  showMenu(card);
  callFn('scanMarkStage', { cardId: card.id, stage: s, by: by }).then(function(res){
    if (res && res.record) _scanStages[s] = res.record;
    showMenu(card);
  }).catch(function(e){
    _scanStages[s] = prev;
    showMenu(card);
    var el = document.createElement('div');
    el.className = 'err'; el.textContent = 'הסימון לא נשמר: ' + ((e && e.message) || 'שגיאה');
    body.appendChild(el);
  });
}

/* ═══════════ סימון "העבודה הושלמה" + פרטים ═══════════
   ⚠️ הכמות שמוצעת היא הכמות שבכרטיס העבודה (סה"כ יחידות שהוזמנו) — לא מספר
      הגיליונות שהודפסו. דוגמה: 1,650 גיליונות × 12 בגיליון = 20,000 בכרטיס,
      ולכן תוצג 20,000 (וניתן לשנות ידנית). */
function _cardTotalQty(card){
  if (!card) return 0;
  var direct = parseInt(card.copies, 10) || 0;
  var fromRuns = 0;
  (card.runs || []).forEach(function(r){
    var sheets = parseInt(r && r.copies, 10) || 0;
    var up = parseInt(r && r.upCount, 10) || 1;
    var units = sheets * (up > 0 ? up : 1);
    if (units > fromRuns) fromRuns = units;      // ריצה מייצרת את כל העותקים — לא סוכמים ריצות
  });
  return direct || fromRuns;
}
/* טופס השלמה שמשתנה לפי סוג העבודה (פלייסמנט/עיתון/פלאייר/כללי) — הלוגיקה
   ב-scan-complete.js. סה"כ היחידות מחושב מהשדות, ולעיתון מוצג פער מול ההזמנה. */
function _fieldInputHtml(f, prevVals){
  var v = (prevVals && prevVals[f.key] != null) ? prevVals[f.key] : '';
  return '<label style="display:block;text-align:right;font-size:.85rem;font-weight:700;margin:10px 0 4px">' + esc(f.label)
    + (f.optional ? ' <span style="opacity:.6;font-weight:400">(אופציונלי)</span>' : '') + '</label>'
    + '<input id="d-f-' + f.key + '" data-fkey="' + f.key + '" type="number" min="0" value="' + esc(String(v)) + '" placeholder="' + esc(f.placeholder || '') + '" '
    + 'style="width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:none;font-family:Heebo,sans-serif;font-size:1.1rem;font-weight:800;text-align:center">'
    + (f.hint ? '<div class="wait" style="font-size:.74rem;margin-top:3px;opacity:.8">' + esc(f.hint) + '</div>' : '');
}
function _doneForm(card){
  var by = _whoAmI(); if (!by) return;
  var ordered = _cardTotalQty(card);
  var prev = (_scanStages.done || {});
  var SC = window.ScanComplete;
  var kind = (prev.kind && SC) ? prev.kind : (SC ? SC.detectKind(card) : 'generic');
  var flds = SC ? SC.fields(kind, ordered) : [{ key:'qty', label:'כמות שהושלמה (יח׳)', placeholder:String(ordered||'') }];
  var prevVals = prev.vals || {};
  // כפתורי בחירת-סוג (אפשר לשנות אם זוהה לא נכון)
  var KINDS = [['placemats','פלייסמנטים'],['newspaper','עיתון/חוברת'],['flyer','פלאיירים'],['generic','כללי']];
  var kindBtns = KINDS.map(function(k){
    var on = k[0] === kind;
    return '<button type="button" data-kind="' + k[0] + '" style="flex:1;min-width:74px;padding:7px 4px;border-radius:8px;border:1.5px solid ' + (on?'#c9a84c':'rgba(255,255,255,.25)') + ';background:' + (on?'#c9a84c':'transparent') + ';color:' + (on?'#1a1a4e':'#fff') + ';font-family:Heebo,sans-serif;font-weight:800;font-size:.78rem;cursor:pointer">' + k[1] + '</button>';
  }).join('');
  body.innerHTML =
      '<div style="font-weight:900;font-size:1.05rem;margin-bottom:4px">✅ סימון: העבודה הושלמה</div>'
    + '<div class="wait" style="font-size:.8rem;margin-bottom:10px">מסמן: <b>' + esc(by) + '</b>'
    + ' <span id="d-rename" style="text-decoration:underline;cursor:pointer;opacity:.8">שנה שם</span></div>'
    + '<div style="font-size:.76rem;text-align:right;opacity:.75;margin-bottom:4px">סוג העבודה:</div>'
    + '<div id="d-kinds" style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px">' + kindBtns + '</div>'
    + '<div id="d-fields">' + flds.map(function(f){ return _fieldInputHtml(f, prevVals); }).join('') + '</div>'
    + '<div id="d-total" class="wait" style="font-size:.9rem;margin:10px 0 2px;font-weight:800"></div>'
    + '<div id="d-status" class="wait" style="font-size:.82rem;margin-bottom:6px"></div>'
    + '<label style="display:block;text-align:right;font-size:.85rem;font-weight:700;margin:8px 0 4px">הערה (אופציונלי)</label>'
    + '<input id="d-note" type="text" value="' + esc(prev.note || '') + '" placeholder="לדוגמה: חסרו 150, נשאר בגימורים" '
    + 'style="width:100%;box-sizing:border-box;padding:11px;border-radius:10px;border:none;font-family:Heebo,sans-serif;font-size:.95rem">'
    + '<button class="btn" id="d-save">✓ שמור סימון</button>'
    + '<button class="btn alt" id="d-back">חזרה</button>';
  function _collect(){
    var vals = {};
    body.querySelectorAll('[data-fkey]').forEach(function(inp){ vals[inp.getAttribute('data-fkey')] = parseInt(inp.value, 10) || 0; });
    return vals;
  }
  function _refresh(){
    if (!SC) return;
    var res = SC.compute(kind, _collect(), ordered);
    document.getElementById('d-total').textContent = 'סה״כ: ' + res.total.toLocaleString() + ' יח׳';
    var st = SC.statusText(res);
    var se = document.getElementById('d-status');
    se.textContent = st;
    se.style.color = res.status === 'short' ? '#fca5a5' : (res.status === 'ok' ? '#86efac' : (res.status === 'over' ? '#fcd34d' : 'rgba(255,255,255,.85)'));
  }
  body.querySelectorAll('#d-fields [data-fkey]').forEach(function(inp){ inp.oninput = _refresh; });
  body.querySelectorAll('#d-kinds [data-kind]').forEach(function(b){
    b.onclick = function(){ prev.kind = b.getAttribute('data-kind'); prev.vals = _collect(); _scanStages.done = prev; _doneForm(card); };
  });
  document.getElementById('d-rename').onclick = function(){ if (_whoAmI(true)) _doneForm(card); };
  document.getElementById('d-back').onclick = function(){ showMenu(card); };
  _refresh();
  document.getElementById('d-save').onclick = function(){
    var t = _stampNow();
    var vals = _collect();
    var res = SC ? SC.compute(kind, vals, ordered) : { total: vals.qty||0, packs:0, status:'none', shortfall:0 };
    var detail = { kind: kind, vals: vals,
      qty: res.total, packs: res.packs || 0,
      shortfall: res.shortfall || 0, statusStr: (SC ? SC.statusText(res) : ''),
      note: (document.getElementById('d-note').value || '').trim() || '',
      cardQty: ordered };
    var payload = Object.assign({ done:true, at:t.at, atText:t.atText, by:by }, detail);
    _scanStages.done = payload;
    /* ⚠️ אין כאן catch שבולע: כשל מוצג למשתמש, כי "נרשם" שלא נרשם הוא
       בדיוק מה שגורם לספור מלאי פעמיים. */
    callFn('scanMarkStage', { cardId: card.id, stage: 'done', by: by, detail: detail })
      .then(function(r){ if (r && r.record) _scanStages.done = r.record; })
      .catch(function(e){
        var el = document.createElement('div');
        el.className = 'err'; el.textContent = 'הפרטים לא נשמרו: ' + ((e && e.message) || 'שגיאה');
        body.appendChild(el);
      });
    var sumLine = SC ? SC.summaryText(res) : (payload.qty.toLocaleString() + ' יח׳');
    body.innerHTML = '<div style="font-weight:900;font-size:1.05rem;color:#86efac">✓ נרשם</div>'
      + '<div class="wait" style="margin-top:8px;line-height:1.9">העבודה סומנה כהושלמה<br>'
      + esc(sumLine) + '<br>'
      + (payload.statusStr ? (esc(payload.statusStr) + '<br>') : '')
      + esc(by) + ' · ' + t.atText + '</div>'
      + '<button class="btn alt" id="d-back2">חזרה לתפריט</button>';
    document.getElementById('d-back2').onclick = function(){ showMenu(card); };
  };
}
function showMenu(card){
  var proofsMap = window._scanProofs || {};
  var isBk = isBooklet(card) || !!card.bookletSheetUrl;
  var raw = _rawUrl(card);
  var cm = customerMatches(card, proofsMap);
  var stages = _stagesFor(card);
  var h = '';
  // צפייה
  if (raw || cm.length) h += '<button class="btn" id="m-proof">📄 צפייה בפרופר</button>';
  if (isBk && (raw || cm.length || collectProofs(card).length)) h += '<button class="btn alt" id="m-booklet">📖 צפייה בחוברת לדפדוף</button>';
  // שלבי גימור
  if (stages.length){
    h += '<div style="height:8px"></div>';
    stages.forEach(function(s){
      if (_stageDone(card, s)) h += '<button class="btn" disabled style="background:#16a34a;color:#fff;cursor:default;opacity:1">✓ ' + _STG[s].done + ' הושלם</button>';
      else h += '<button class="btn alt" data-stage="' + s + '">' + _STG[s].btn + '</button>';
    });
  } else {
    h += '<div class="wait" style="font-size:.8rem;margin-top:10px">🖨️ עבודה ללא גימור — מסתיימת אוטומטית עם סיום ההדפסה.</div>';
  }
  // ✅ סימון "העבודה הושלמה" + פרטים — זמין לכל עבודה
  h += '<div style="height:8px"></div>';
  var _dn = _scanStages.done;
  if (_dn && _dn.done){
    var _dnSum = (window.ScanComplete && _dn.kind && _dn.vals)
      ? window.ScanComplete.summaryText(window.ScanComplete.compute(_dn.kind, _dn.vals, _dn.cardQty))
      : ((_dn.qty ? (Number(_dn.qty).toLocaleString() + ' יח׳') : '') + (_dn.packs ? (' · ' + _dn.packs + ' אריזות') : ''));
    h += '<div style="background:rgba(22,163,74,.18);border:1.5px solid #16a34a;border-radius:10px;padding:10px 12px;margin-top:10px;line-height:1.8">'
      + '<b style="color:#86efac">✓ הושלמה</b>'
      + '<div class="wait" style="font-size:.82rem">' + esc(_dnSum) + '</div>'
      + (_dn.statusStr ? ('<div class="wait" style="font-size:.8rem;color:' + (_dn.shortfall>0?'#fca5a5':'#86efac') + '">' + esc(_dn.statusStr) + '</div>') : '')
      + '<div class="wait" style="font-size:.76rem;opacity:.85">' + esc(_dn.by || '') + ' · ' + esc(_dn.atText || '') + '</div>'
      + (_dn.note ? ('<div class="wait" style="font-size:.76rem">📌 ' + esc(_dn.note) + '</div>') : '')
      + '</div>'
      + '<button class="btn alt" id="m-done">✎ עדכן את פרטי ההשלמה</button>';
  } else {
    h += '<button class="btn" id="m-done">✅ סמן שהעבודה הושלמה</button>';
  }
  if (!raw && !cm.length && !stages.length && !h) { waitForFiles(); return; }
  body.innerHTML = h;
  var pb = document.getElementById('m-proof');
  if (pb) pb.onclick = function(){ if (raw) location.href = raw; else resolveAndGo(card, proofsMap); };
  var bb = document.getElementById('m-booklet');
  if (bb) bb.onclick = function(){ resolveAndGo(card, proofsMap); };   // resolveAndGo מקפל חוברת/פותח קובץ לקוח
  body.querySelectorAll('[data-stage]').forEach(function(b){ b.onclick = function(){ _markStage(card, b.dataset.stage); }; });
  var db2 = document.getElementById('m-done');
  if (db2) db2.onclick = function(){ _doneForm(card); };
}

/* ── מסך הרישום ─────────────────────────────────────────────────────────
   ⚠️ מוצג **רק** למכשיר שאינו רשום. טלפון שכבר נרשם מגיע ישר לתפריט
   הרגיל, בלי שום שלב חזותי חדש — זה הרוב המוחלט של הפתיחות.
   ⚠️ משתמש באותם .box/.btn/.wait/.err של המסך. השדה היחיד שנוסף מעתיק
   את .btn.alt. */
function showEnroll(msg){
  sub.textContent = 'רישום המכשיר';
  body.innerHTML =
      '<div class="wait">הטלפון הזה עדיין לא רשום.<br>בקשו מהמנהל קוד רישום והקלידו אותו כאן.<br>'
    + '<span style="font-size:.75rem;color:rgba(255,255,255,.55)">פעם אחת בלבד — אחר כך הסריקה עובדת כרגיל.</span></div>'
    + '<input class="fld" id="en-code" maxlength="9" autocomplete="off" autocapitalize="characters"'
    + ' inputmode="text" placeholder="קוד רישום">'
    + '<input class="fld" id="en-label" maxlength="30" autocomplete="off" placeholder="שם המכשיר (למשל: טלפון כריכייה)"'
    + ' style="letter-spacing:normal;font-weight:400">'
    + '<button class="btn" id="en-go">רישום המכשיר</button>'
    + (msg ? '<div class="err">' + esc(msg) + '</div>' : '');
  var go = document.getElementById('en-go');
  go.onclick = function(){
    var code = (document.getElementById('en-code').value || '').trim();
    var label = (document.getElementById('en-label').value || '').trim();
    if (!code) { showEnroll('חסר קוד רישום'); return; }
    go.disabled = true; go.textContent = 'רושם…';
    fetch(FN + 'enrollScanDevice', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ data: { code: code, label: label } }) })   /* ⚠️ מזהה-העסק אינו נשלח מכאן —
         השרת גוזר אותו מהסוד עצמו. ראה functions/scan.js · enrollIndexPath. */
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){
        /* ⚠️ ההודעה מגיעה מהשרת בעברית ומנוסחת כפעולה ("בקשו קוד חדש"),
           ולא כקוד-שגיאה. זה נתפס בשטח: המסך הציג scan_code_unknown. */
        if (!r.ok) throw new Error((j.error && j.error.message) || 'הרישום נכשל');
        return j.result;
      }); })
      .then(function(res){ return SolanAuth.signInWithCustomToken(res.token); })
      .then(function(){ start(); })
      .catch(function(e){ showEnroll(String((e && e.message) || 'הרישום נכשל')); });
  };
}

/* טעינת הכרטיס — בדיוק אותו זרם שהיה, בקריאה אחת במקום ארבע */
function start(){
  sub.textContent = 'טוען את פרטי העבודה…';
  body.innerHTML = '<div class="spin"></div>';
  loadCard().then(function(r){
    var card = r.card;
    /* ⚠️ כרטיס שהושלם עבר לארכיון ונעלם מ-cards, אבל ה-QR המודפס ממשיך
       לחיות על הנייר. השרת מחפש גם שם ומסמן fromArchive. */
    if (card.fromArchive) sub.textContent = 'מהארכיון';
    window._scanCard = card;
    window._scanProofs = r.proofs || [];
    if (r.stages && typeof r.stages === 'object') _scanStages = r.stages;
    if (!card.fromArchive) sub.textContent = card.name || '';
    showMenu(card);
  }).catch(function(e){
    var code = (e && e.code) || '';
    /* ⚠️ מכשיר שבוטל או שה-claims שלו התיישנו מקבל את מסך-הרישום ולא
       שגיאה סתומה — זו הפעולה שאפשר לפעול לפיה. */
    if (/unauthenticated/i.test(String((e && e.status) || '')) || /^scan_device_/.test(code)) {
      SolanAuth.signOut().catch(function(){}).then(function(){ showEnroll((e && e.message) || 'המכשיר בוטל — יש לרשום מחדש'); });
      return;
    }
    if (/not-found/i.test(String((e && e.status) || ''))) {
      sub.textContent = '';
      body.innerHTML = '<div class="err">הכרטיס לא נמצא — ייתכן שהעבודה נמחקה לצמיתות.</div>';
      return;
    }
    sub.textContent = '';
    body.innerHTML = '<div class="err">שגיאה בטעינה — בדוק חיבור לאינטרנט ונסה שוב.</div>';
  });
}

if (!cid) { sub.textContent = ''; body.innerHTML = '<div class="err">חסר מזהה כרטיס בקישור.</div>'; }
else {
  /* ⚠️ persistence מקומי: הרישום חייב לשרוד סגירת דפדפן וכיבוי מכשיר,
     אחרת העובד היה מקליד קוד כל בוקר. */
  SolanAuth.init(FB_CONFIG_SCAN, 'local');
  SolanAuth.onAuthStateChanged(function(user){
    if (user) start(); else showEnroll('');
  });
}
</script>
</body>
</html>
