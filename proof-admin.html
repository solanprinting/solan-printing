<style>
  :root { --press:#2d3561; --press-d:#222a4d; --gold:#c9a84c; --gold-light:#e8d5a3; --green:#16a34a; --red:#dc2626; --amber:#d97706; --line:#e5e7eb; --ink:#1f2937; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Heebo',system-ui,"Segoe UI",Arial,sans-serif; color:var(--ink);
         background:linear-gradient(180deg,#eef1f6 0%,#f5f6f9 100%); min-height:100vh; padding:0 0 28px; }
  .wrap { max-width: 1040px; margin: 0 auto; padding:0 18px; }
  /* ⚠️ 14/08/2026, בקשת-בעלים: מבנה-הפורטל (שלוש עמודות) מקבל את **כל**
     רוחב-החלון — כמו לשונית "פרופר ללקוח" — במקום להצטופף ב-1040px עם
     שטח אפור ריק. ‏body.pvFull מוצמד רק כשמבנה-הפורטל פעיל; המסך
     הקלאסי (?ui=classic) נשאר ברוחב הישן — הוא רשת-הביטחון. */
  body.pvFull .wrap { max-width: none; padding: 0 14px; }
  .brandbar { background:linear-gradient(135deg,var(--press) 0%,var(--press-d) 100%); color:#fff; padding:15px 20px;
    box-shadow:0 4px 18px rgba(45,53,97,.28); display:flex; align-items:center; gap:13px; position:relative; margin-bottom:18px; }
  .brandbar::after { content:''; position:absolute; left:0; right:0; bottom:0; height:3px;
    background:linear-gradient(90deg,var(--gold),var(--gold-light),var(--gold)); }
  .brandbar .logo { width:42px; height:42px; border-radius:11px; background:rgba(255,255,255,.1);
    border:1.5px solid rgba(201,168,76,.6); display:flex; align-items:center; justify-content:center; font-size:1.35rem; flex-shrink:0; }
  .brandbar h1 { font-size:1.3rem; font-weight:900; margin:0; } .brandbar h1 span { color:var(--gold); }
  .brandbar .tag { font-size:.8rem; color:var(--gold-light); margin-top:1px; }
  .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:10px; flex-wrap:wrap; }
  .top h2 { font-size:1.05rem; font-weight:800; margin:0; color:var(--press); }
  .btn { padding:10px 17px; border:none; border-radius:10px; background:var(--press); color:#fff; font-weight:700; cursor:pointer; font-size:.9rem; font-family:inherit; transition:all .15s; }
  .btn:hover { background:var(--press-d); }
  .btn.ghost { background:#fff; color:var(--press); border:1.5px solid var(--line); }
  .btn.ghost:hover { border-color:var(--gold); background:#fffdf6; }
  .btn:disabled { opacity:.4; cursor:default; }
  table { width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 4px 20px rgba(45,53,97,.07); }
  th,td { padding:11px 13px; text-align:right; border-bottom:1px solid var(--line); font-size:.88rem; vertical-align:middle; }
  th { background:#eef0f6; font-size:.8rem; font-weight:700; color:var(--press); }
  tr:last-child td { border-bottom:none; }
  .badge { display:inline-block; padding:3px 11px; border-radius:20px; font-size:.76rem; font-weight:700; }
  .b-pending  { background:#fef3c7; color:var(--amber); }
  .b-approved { background:#dcfce7; color:var(--green); }
  .b-rejected { background:#fee2e2; color:var(--red); }
  /* פרופר/עבודה שאושרו — כל השורה בירוק בהיר, שברור מיד שאושר */
  tr.row-ok td { background:#effdf3; }
  tr.row-ok:hover td { background:#e2f9ea; }
  tr.row-ok td:first-child { box-shadow:inset 4px 0 0 var(--green); }
  .acts { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .acts a, .acts button, .acts select { font-size:.8rem; padding:6px 11px; border-radius:8px; border:1.5px solid var(--line); background:#fff; cursor:pointer; text-decoration:none; color:var(--ink); font-family:inherit; transition:all .12s; }
  .acts a:hover, .acts button:hover { border-color:var(--gold); background:#fffdf6; }
  .acts .gen { background:var(--green); color:#fff; border-color:var(--green); font-weight:700; }
  .acts .gen:hover { background:#15803d; border-color:#15803d; }
  .acts .del { background:#fff; color:var(--red); border-color:#fecaca; }
  .acts .dl { background:#f4f1e6; color:#6b5618; border-color:var(--gold-light); font-weight:700; }
  .note { font-size:.78rem; color:var(--red); margin-top:3px; }
  #msg { margin:12px 0; font-size:.85rem; color:#374151; min-height:1.2em; }
  .empty { text-align:center; padding:46px; color:#9ca3af; background:#fff; border-radius:12px; box-shadow:0 4px 20px rgba(45,53,97,.07); }
  .folder { background:#fff; border-radius:12px; box-shadow:0 4px 20px rgba(45,53,97,.07); margin-bottom:14px; overflow:hidden; border:1px solid var(--line); }
  /* ── master-detail: רשימת-לקוחות בצד · עבודות הלקוח הנבחר במרכז ── */
  .mdWrap { display:flex; gap:14px; align-items:flex-start; }
  .mdSide { flex:0 0 240px; max-width:240px; background:#fff; border:1px solid var(--line); border-radius:12px;
    box-shadow:0 4px 20px rgba(45,53,97,.07); overflow:hidden; position:sticky; top:8px; max-height:calc(100vh - 90px); overflow-y:auto; }
  .mdSideTitle { padding:9px 12px; background:#2d3561; color:#fff; font-weight:800; font-size:.86rem; }
  .custItem { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:11px 12px;
    cursor:pointer; border-bottom:1px solid #eee; font-weight:700; color:#2d3561; font-size:.9rem; transition:background .12s; }
  /* בקשות החלפת-עמודים */
  .psTag { display:inline-block; font-size:.76rem; font-weight:800; border-radius:6px; padding:2px 8px; white-space:nowrap; }
  .psWait { background:#fffbeb; border:1.5px solid #fcd34d; color:#b45309; }
  .psOpen { background:#eff6ff; border:1.5px solid #93c5fd; color:#1d4ed8; }
  .psDone { background:#f0fdf4; border:1.5px solid #86efac; color:#166534; }
  .psOk { background:#16a34a !important; color:#fff !important; }
  .psNo { background:#b91c1c !important; color:#fff !important; }
  /* ⚠️ במבנה-הפורטל תיבת-החיפוש יושבת בתוך כרטיס, ולכן בלי רקע-אפור
     וקו-מפריד — הם מה שגרם לסרגל להיראות כטבלה ולא ככרטיס. */
  .custFilterWrap { padding:0 13px 10px; }
  .pvSide .custFilterWrap input { width:100%; padding:9px 12px; border:1.5px solid var(--line);
     border-radius:10px; font-family:inherit; font-size:.86rem; background:#f8f9fc; }
  .pvSide .custFilterWrap input:focus { outline:none; border-color:var(--gold); background:#fff; }
  .custFilterWrap input { width:100%; box-sizing:border-box; padding:6px 9px; font-family:inherit; font-size:.85rem;
    border:1.5px solid #cbd5e1; border-radius:8px; }
  .custFilterWrap input:focus { outline:none; border-color:#2d3561; }
  .custItem:hover { background:#f5f3ec; }
  .custItem.on { background:#2d3561; color:#fff; }
  /* קיבוץ רשימת-הלקוחות לפי יום בשבוע */
  .dayHdr { display:flex; align-items:center; gap:6px; padding:9px 12px; background:#e7ebf3; color:#374151;
    font-size:.82rem; font-weight:800; border-bottom:1px solid #d7dcE7; cursor:pointer; user-select:none;
    letter-spacing:.02em; transition:background .12s; }
  .dayHdr:hover { background:#dbe1ec; }
  .dayHdr .dayArrow { color:var(--press); font-size:.72rem; width:1em; flex:0 0 auto; }
  .dayHdr .dayCnt { margin-inline-start:auto; background:rgba(0,0,0,.08); border-radius:10px; padding:0 8px; font-size:.74rem; font-weight:700; }
  .dayHdr.todayHdr { background:#2d3561; color:var(--gold-light); }
  .dayHdr.todayHdr .dayArrow { color:var(--gold); }
  .dayHdr.todayHdr .dayCnt { background:rgba(255,255,255,.2); }
  /* 🆕 קבצים חדשים מהלקוח שקדם-הדפוס טרם סימן שראה */
  .newDot { background:#dc2626; color:#fff; border-radius:10px; padding:1px 7px; font-size:.7rem;
            font-weight:900; white-space:nowrap; margin-inline-start:4px; }
  .custItem.hasNew { background:#fff5f5; border-inline-start:4px solid #dc2626; }
  .custItem.hasNew.on { background:var(--press); color:#fff; }
  .dayHdr .newDot { margin-inline-start:6px; }
  /* ── פס-סטטוס: התקבל → נצפה → אושר → בדפוס → הושלם ──
     במקום תג-סטטוס בודד שאומר "מאושר" ולא אומר איפה העבודה עומדת באמת. */
  .stgBar { display:flex; gap:3px; align-items:center; margin-top:5px; flex-wrap:wrap; }
  .stg { font-size:.66rem; font-weight:800; border-radius:5px; padding:1px 6px; white-space:nowrap;
         background:#f1f2f6; color:#b0b4c0; border:1px solid #e5e7eb; }
  .stg.on   { background:#e0e7ff; color:#3730a3; border-color:#c7d2fe; }   /* שלב שכבר עבר */
  .stg.cur  { background:var(--press,#2d3561); color:#fff; border-color:var(--press,#2d3561); }
  .stg.cur.done { background:#16a34a; border-color:#16a34a; }
  /* ⏳ עמודים שהלקוח עוד לא שלח — היה קבור בשורת-ריצה, עכשיו גם ברמת-הגיליון */
  .pendTag { display:inline-block; font-size:.72rem; font-weight:800; color:#b45309; background:#fffbeb;
             border:1.5px solid #fcd34d; border-radius:5px; padding:1px 7px; white-space:nowrap; margin-inline-start:6px; }
  .custItem.dayToday { background:#fffbeb; color:#92400e; border-bottom:2px solid var(--gold-light); font-weight:900; }
  .custItem.dayToday.on { background:var(--gold); color:#2d3561; }
  .todayCust { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:11px 14px;
    cursor:pointer; border-bottom:1px solid #eee; font-weight:700; color:#2d3561; transition:background .12s; }
  .todayCust:hover { background:#faf8f2; }
  .todaySec { padding:9px 14px; font-weight:800; color:var(--press); background:#faf8f2; border-bottom:1px solid var(--line); font-size:.9rem; }
  /* תגי-סיווג בחלון "פורטלים ליומן" */
  .pbTag { display:inline-block; font-size:.74rem; font-weight:800; border-radius:6px; padding:2px 8px; white-space:nowrap; }
  .pbNew  { background:#dcfce7; color:#166534; border:1.5px solid #86efac; }
  .pbOk   { background:#eef2ff; color:#3730a3; border:1.5px solid #c7d2fe; }
  .pbWarn { background:#fffbeb; color:#92400e; border:1.5px solid #fcd34d; }
  .pbDup  { background:#f3f4f6; color:#6b7280; border:1.5px solid #e5e7eb; }
  tr.pbMuted td { opacity:.62; }
  /* ── מבנה-פורטל: ימי-השבוע כניווט ראשי ─────────────────────────────── */
  .pvWrap { display:flex; flex-direction:column; gap:0; }
  .pvDays { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:12px 16px;
            background:#fff; border:1px solid var(--line); border-radius:14px;
            box-shadow:0 2px 10px rgba(0,0,0,.05); margin-bottom:14px; }
  .pvSpacer { flex:1; }
  .pvDay { display:inline-flex; align-items:center; gap:5px; padding:7px 13px; border-radius:9px;
           border:1.5px solid var(--line); background:#fff; color:#2d3561; font-family:inherit;
           font-weight:800; font-size:.88rem; cursor:pointer; }
  .pvDay:hover { background:#f3f4f8; }
  .pvDay.isToday { border-color:var(--gold,#d4af37); }
  .pvDay.on { background:var(--press,#2d3561); color:#fff; border-color:var(--press,#2d3561); }
  .pvCnt { background:rgba(0,0,0,.08); border-radius:9px; padding:0 7px; font-size:.76rem; }
  .pvDay.on .pvCnt { background:rgba(255,255,255,.22); }
  .pvSwitch { padding:6px 11px; border-radius:8px; border:1px dashed #cbd5e1; background:#fff;
              color:#6b7280; font-family:inherit; font-size:.78rem; cursor:pointer; }
  .pvBody { display:grid; grid-template-columns:290px 1fr 220px; align-items:start;
            border:1px solid var(--line); border-top:none; border-radius:0 0 12px 12px; overflow:hidden; }
  .pvSide { background:#fff; max-height:76vh; overflow:auto; padding-bottom:8px; }
  .pvSideTitle { padding:4px 15px 8px; font-weight:800; color:#9ca3af; font-size:.78rem; }
  /* כרטיס-לקוח: מצב העבודה נקרא בלי להיכנס פנימה.

  /* ⚠️ כרטיס-לקוח ולא שורת-טבלה: מרווח + פינות + הרמה בריחוף — אותה

  .pvCust { display:block; margin:0 10px 7px; padding:11px 13px; border:1px solid var(--line);
            border-radius:12px; cursor:pointer; background:#fff;
            transition:background .12s, box-shadow .12s, transform .12s; }

  .pvCust.hasNew { border-inline-start:4px solid #dc2626; }
  .pvcTop { display:flex; justify-content:space-between; align-items:center; gap:6px; }

  .pvcMeta { display:flex; gap:5px; align-items:center; flex-wrap:wrap; margin-top:5px; }

  .pvcFoot { margin-top:4px; font-size:.72rem; color:#9ca3af; }
  @media (max-width:900px){

     כבר היו משותפים; מה שנראה זר היה אזור-העבודה — רשת אחת עם מסגרות

const _isSep = ch => ch === '' || /[\s\-–—·,:;()\[\]"'\/|]/.test(ch);

  if (!hay || !needle || needle.length < 3) return false;

  for (let i = hay.indexOf(needle); i >= 0; i = hay.indexOf(needle, i + 1)){
    const before = i === 0 ? '' : hay[i - 1];
    const after  = (i + needle.length >= hay.length) ? '' : hay[i + needle.length];
    if (_isSep(before) && _isSep(after)) return true;
  }
  return false;
}
function _custHasActiveCard(name){
  const n = _normName(name); if (!n) return false;

}
let _portalCusts = [];   // לקוחות שיש להם פורטל — גם אם עוד לא העלו כלום
/* ── חיווי "הלקוח נכנס לפורטל" ────────────────────────────────────────────
   מקור: customerPortals/<slug>.lastSeenAt — נכתב **בשרת** ע"י portalLinkLogin
   בכל כניסה מהקישור. הלקוח אינו יכול לזייף אותו.
   ⚠️ זהו "נכנס", לא "נמצא כרגע במסך": הוא מתעדכן בכניסה, לא כל שנייה.
   נוכחות-חיה אמיתית (heartbeat) נשארה כמשימה נפרדת. */
let _portalSeen = {};
const _seenKey = s => String(s || '').replace(/["'׳״]/g, '').replace(/\s+/g, ' ').trim();

  const v = _portalSeen[_seenKey(customer)];
  if (!v || !v.at) return null;
  const age = Date.now() - v.at;
  return { at: v.at, count: v.count, fresh: age >= 0 && age <= SEEN_NOW_MS, age };
}
function _seenAgo(ms){
  const m = Math.floor(ms / 60000);
  if (m < 1) return 'הרגע';
  if (m < 60) return 'לפני ' + m + ' דק׳';
  const h = Math.floor(m / 60);
  if (h < 24) return 'לפני ' + h + ' שע׳';
  const d = Math.floor(h / 24);
  return d === 1 ? 'אתמול' : ('לפני ' + d + ' ימים');
}
/* ברשימת-הלקוחות הצפופה — רק נקודה ירוקה כשהלקוח נכנס ממש עכשיו (בלי רעש). */

/* תג-חיווי מוכן-להטמעה. ריק כשאין נתון — לקוח שמעולם לא נכנס לא מקבל תג. */
/* ⚠️ אירוע-ייצור 06/08/2026: המסך קפא על "טוען…" אצל כולם. השורש —

   (ראה moveRun, שורה ~1373) — ולכן פורמטר גלובלי משלו, לא תלות ב-render. */
function _fmtSeenAt(t){ return t ? new Date(t).toLocaleString('he-IL', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' }) : '—'; }

let _customersDb = null, _newspapersDb = null;   // מקורות כרטיס-הלקוח

let _ccCollapsed = false;

/* ── עריכת פרטי-קשר (בקשת-בעלים 19/08/2026) ───────────────────────────────
   „תאפשר לערוך כרטיס לקוח בפורטל לקוחות ואנחנו נוסיף ידנית את המייל

   המרכזית כאן.** ‏customers נדחף כ**מערך שלם** מ-krtis-avoda
   (‏solan-persist ‎_paths‎), ולכן עריכה נקודתית ממסך זה הייתה נמחקת
   בסבב-הסנכרון הבא — **בשקט**. זו בדיוק תקרית "ניכויי-המלאי שנדרסו".
   הצומת החדש הוא תוספת בלבד; איש אינו דוחף אותו בשלמותו.

   ⚠️ **מפתח בטוח:** שם-לקוח יכול להכיל ‎. # $ [ ] /‎ שאסורים כמפתח RTDB.
   המפתח מנוקה, ו-‎name‎ נשמר **בתוך** הרשומה — ‏ShopIssue מתאים לפי שניהם.

function _ccKey(name){
  return String(name || '').trim().replace(/[.#$\[\]\/]/g, '_').slice(0, 120);
}
async function _ccEdit(name){
  if (!name) return;
  const cur = (window.ShopIssue && ShopIssue.customerCard)
    ? ShopIssue.customerCard(name, _customersDb, _newspapersDb, _contactsDb) : {};

  if (email === null) return;

  if (phone === null) return;
  /* ⚠️ מספר שאינו נייד לא ייתן וואטסאפ — נאמר עכשיו ולא אחרי שהכפתור
     לא יעבוד. אינו חוסם: אולי זה מספר בחו"ל. */
  /* ⚠️ השמירה על ‎isMobileIL‎ מפורשת: מודול ישן במטמון (שומר-הגרסה טרם
     החליף) היה מפיל את הדיאלוג באמצע עריכה. אין פונקציה → פשוט לא

      { method:'PATCH', headers:{'Content-Type':'application/json'},

        body: JSON.stringify({ name: String(name), updatedAt: Date.now(),
                               mobile: mobile || null, email: email || null, phone: phone || null }) });
    if (!r.ok) throw new Error('db ' + r.status);

    _contactsDb[key] = Object.assign({}, _contactsDb[key], { name: String(name), mobile, email, phone });

  }
}

/* ⚠️ 21/08/2026 — **ההקשר-השבועי נעלם בשקט על 403.** כל שישה המקורות

   **ומדווח**: המסך ממשיך, ומי שמסתכל יודע שחסר לו מידע. */
let _wcFailed = [];
async function _loadWeeklyContext(){
  _wcFailed = [];
  try {
    const _g = async (label, path) => {

        _wcFailed.push(label);
        console.error('הקשר-שבועי: טעינת ' + label + ' נכשלה', e);
        return null;

    };
    const [np, cds, ov, po, cu, ct] = await Promise.all([
      _g('עיתונים', 'newspapers.json'),
      _g('כרטיסים', 'cards.json'),
      _g('שינויי-יום', 'customerDayOverride.json'),
      _g('פורטלים', 'customerPortals.json'),
      /* כרטיס-לקוח (18/08): פרטי-הקשר כבר קיימים ב-customers — נטענים כאן
         ולא במסך נפרד. ⚠️ כשל-טעינה משאיר null, והכרטיס אומר שלא נטען. */
      _g('לקוחות', 'customers.json'),
      /* ⚠️ עקיפות-קשר ידניות (בקשת-בעלים 19/08/2026: "נוסיף ידנית את
         המייל והוואטסאפ"). **צומת נפרד בכוונה:** ‏customers נדחף כמערך
         שלם מ-krtis-avoda (solan-persist ‎_paths‎), ולכן עריכה נקודתית שם
         הייתה נדרסת בסבב-הסנכרון הבא — תקרית "ניכויי-המלאי שנדרסו". */
      _g('פרטי-קשר', 'customerContacts.json')
    ]);
    if (_wcFailed.length) msg('⚠️ חלק מהמידע לא נטען (' + _wcFailed.join(' · ')
      + ') — "מי חייב היום" עלול להיות חסר. רעננו את הדף.');
    /* ⚠️ באג שדווח 31/07/2026: נפתחו פורטלים ל-35 לקוחות, ואף אחד מהם לא הופיע
       במסך. הסיבה: רשימת-הלקוחות נבנתה **רק** מ-customerProofs, כלומר לקוח
       "קיים" רק אחרי שהעלה קובץ ראשון. פורטל שנפתח ולא נראה בשום מקום הוא

    _customersDb = cu; _newspapersDb = np; _contactsDb = ct;
    _portalCusts = po && typeof po === 'object'
      ? Object.keys(po).map(k => (po[k] && po[k].name) || String(k).replace(/_/g,' ')).filter(Boolean)

    /* חותמת-כניסה אחרונה לכל לקוח (נכתבת בשרת ע"י portalLinkLogin).

    _portalSeen = {};
    if (po && typeof po === 'object') Object.keys(po).forEach(k => {
      const rec = po[k] || {};
      const nm = _seenKey(rec.name || String(k).replace(/_/g,' '));
      if (nm && rec.lastSeenAt) _portalSeen[nm] = { at: Number(rec.lastSeenAt) || 0, count: Number(rec.loginCount) || 0 };
    });
    _dayOverride = (ov && typeof ov==='object') ? ov : {};
    const dayMap = {};
    const npArr = Array.isArray(np) ? np : (np && typeof np==='object' ? Object.values(np) : []);
    npArr.forEach(n=>{ if (n && n.name && n.day && _DAYS.indexOf(n.day)>=0) dayMap[_normName(n.name)] = n.day; });
    _dayByCustomer = dayMap;
    const active = {};
    const byCust = {};   // שם-לקוח → הכרטיס הפעיל העדכני-ביותר (לתמצית-כרטיס→פורטל, invite.onclick)
    const cdArr = Array.isArray(cds) ? cds : (cds && typeof cds==='object' ? Object.values(cds) : []);
    // גם שם-הכרטיס וגם שדה-הלקוח שבו — שדה-הלקוח הוא ההתאמה המדויקת, ולכן עדיף
    cdArr.forEach(c=>{
      if (!c || (c.status==='done' || c.status==='trash' || c.status==='done_hidden' || c.status==='archived')) return;
      [c.name, c.customer].forEach(v=>{
        const k = _normName(v); if (!k) return;
        active[k] = true;
        if (!byCust[k] || (c.id||0) > (byCust[k].id||0)) byCust[k] = c;
      });
    });
    _activeCardCusts = active;
    _activeCardsByCust = byCust;
  } catch(e){}
}

/* ⚠️ אירוע-ייצור 06/08/2026: כל כשל כאן — שגיאת-הרשאה, נפילת-רשת, או
   חריגה ב-render — השאיר את המסך על "טוען…" **לנצח**, בלי מילה. כך באג
   של שורה אחת (fmt מחוץ להיקף) הפך ל-P1 שדרש שחזור-VM כדי לאתר.

async function loadProofs() {
  msg('טוען…');
  try {
    const r = await fetch(await _au(`${_FBURL}/customerProofs.json`));
    if (!r.ok) throw new Error(r.status === 401 || r.status === 403
      ? 'אין הרשאה לקרוא את רשימת העבודות (' + r.status + ') — ודאו שאתם מחוברים כמנהל/עובד'
      : 'שרת הנתונים החזיר ' + r.status);

// ── רענון-אוטומטי: כשלקוח מעלה קובץ/מאשר — המסך מתעדכן לבד, בלי רענון ידני ──

       החלפת-עמוד בריצה לא משנה את החתימה, השורה אינה מצוירת מחדש,
       ותג "עבר תיקון" אינו מופיע עד רענון ידני — כלומר תיקון שהגיע
       בשקט, בדיוק מה שהמנגנון בא למנוע. */

      return k+':'+(t.approvedAt||0)+':'+(t.fileUrl?1:0)+':'+(t.shopSeenAt||0)+':'+((t.pendingPages||[]).join('.'))
             +':'+(t.version||1)+':'+(t.correctedAt||0)+':'+(t.correctionSeenAt||0); }).sort().join(',') : '';

    const _rev = (_rr && _rr.ok) ? await _rr.json() : null;

    }).join('') + '</div>';
  };
  /* ⏳ עמודים חסרים ברמת-הגיליון. היו מוצגים רק בשורת-ריצה, כך שעיתון-מלא עם
     עמודים חסרים נראה תקין לגמרי. הכינוס נעשה במודול הבדוק. */
  const pendTag = (p) => {
    if (!window.ShopView) return '';
    const miss = ShopView.pendingPages(p);
    return miss.length ? `<span class="pendTag" title="הלקוח טרם שלח את העמודים האלה">⏳ חסרים עמ׳ ${miss.join(', ')}</span>` : '';
  };

  /* ⚠️ אירוע-ייצור 17/08/2026: לקוח העלה את הריצות בסדר הפוך והשער יצא
     בריצה השנייה. הסדר כבר מתוקן אוטומטית (`_partsOrdered` — לפי מספר-הריצה),
     אבל **הפער עצמו נשאר סימן-אזהרה**: אם הלקוח התבלבל בסדר-ההעלאה, סביר
     שהוא התבלבל גם בתוכן. התג אומר לקדם-דפוס לבדוק לפני לוחות. */
  /* ⚠️ בקשת-בעלים 18/08/2026: כשהלקוח מסיים לערוך ולוחץ "מאושר להדפסה",
     הדפוס צריך **לראות** שזה קרה ולא להסיק זאת מהגעת-קבצים. התג נדלק על
     `customerDoneAt` ונכבה כשמסמנים "נצפה" (‏shopSeenAt) — אותו סימון-צפייה
     שכבר קיים, ולא מנגנון-קריאה שני שיסתור אותו. */
  const doneTag = (p) => {
    if (!p || !p.customerDoneAt || p.shopSeenAt) return '';
    return `<span class="pendTag" style="background:#dcfce7;color:#166534;border-color:#86efac"`
      + ` title="הלקוח סיים לערוך ואישר להדפסה · ${fmt(p.customerDoneAt)}`
      + `${p.customerDoneBy ? (' · ' + escapeHtml(String(p.customerDoneBy))) : ''}">`
      + `✅ הלקוח סיים ואישר${p.customerDonePages ? (' · ' + (p.customerDonePages|0) + ' עמ׳') : ''}</span>`;
  };

  const revTag = (p) => {
    if (!_runOrderReversed(p)) return '';
    const order = _partsOrdered(p).map(pt => pt.name || pt.fileName || '—').join(' → ');
    return `<span class="pendTag" style="background:#fef2f2;color:#b91c1c;border-color:#fca5a5"`
      + ` title="הלקוח העלה את הריצות בסדר אחר ממספרן. הסדר שבשימוש: ${escapeHtml(order)}">`
      + `⇅ הועלה בסדר הפוך — לבדוק</span>`;
  };

  /* 👁 סימון-צפייה: מופיע רק כשיש מה לסמן (הלקוח שלח וטרם סומן). כשכבר סומן —
     תג עם מי ומתי, כדי שלא יסמנו פעמיים ולא יתווכחו מי ראה. */
  const seenBtn = (p, pid) => {
    const t = pid ? ((p.parts || {})[pid] || {}) : p;
    if (!t.approvedAt) return '';
    if (t.shopSeenAt) return `<span class="psTag" style="background:#eef2ff;color:#3730a3;border:1.5px solid #c7d2fe" title="${escapeHtml(t.shopSeenBy||'')} · ${fmt(t.shopSeenAt)}">👁 נצפה</span>`;
    return `<button data-seen="${p.id}|${pid || 'full'}" title="עוצר את ההתראה החוזרת, ומעדכן את הלקוח שקיבלנו">👁 ראיתי</button>`;
  };

  /* ── לשונית-גיליון (עיצוב-מחדש 13/08/2026) ───────────────────────────
     מספר-הגיליון האמיתי — זה מה שהלקוח אומר בטלפון — עם נקודת-סטטוס.
     אותו data-issue ואותו מטפל-לחיצה של הכרטיסים הקודמים. */
  const issueTab = (p, openId) => {
    const su = ShopIssue.summaryOf(p);
    const on = su.id === openId;
    const dot = { waiting:'tAmber', received:'tRed', 'customer-ok':'tGreen', print:'tGreen',
                  closed:'tGray', done:'tGray' }[su.status.key] || 'tGray';
    const lbl = su.issue ? ('גיליון ' + su.issue) : String(su.title || 'עיתון').slice(0, 14);
    return `<span class="isTab${on?' on':''}" data-issue="${escapeHtml(su.id)}" title="${escapeHtml(ShopIssue.titleOf(p))} · ${su.status.label}">
      <span class="tdot ${dot}"></span>${escapeHtml(lbl)}</span>`;
  };

  /* ── כרטיס-הגיליון הפתוח (מבנה-פורטל בלבד) ───────────────────────────
     ⚠️ ‎rowHtml‎ נשאר ללא נגיעה — הוא משרת את המסך הקלאסי, שהוא רשת-
     הביטחון. שני מבנים, שתי פונקציות, אפס "אם זה פורטל אז..." בתוך אחת.
     ⚠️ עיצוב-מחדש 13/08/2026: שורות-היחידות הוחלפו ברשת-עמודים —
     שער→2→3, חסרים כאריחים מקווקווים, סימוני-עמודים (pageMarks) על
     האריח, תצוגה-מקדימה אמיתית (pdf.js, עצלה), ולחיצה פותחת הגדלה. */
  const issueCard = (p, openId) => {
    const su = ShopIssue.summaryOf(p);
    const units = ShopIssue.unitsOf(p);
    const seenTime = ShopIssue.seenAt(p);
    const head = `<div class="isHd2">
      <span class="isTtl">${escapeHtml(ShopIssue.titleOf(p))}</span>
      <span class="badge ${su.status.cls}">${su.status.label}</span>
      ${su.pendingPages.length?`<span class="psTag psWait">⏳ חסרים עמ׳ ${su.pendingPages.join(', ')}</span>`:''}
      ${su.corrected?`<span class="psTag psOpen">🔁 עבר תיקון · גרסה ${su.version}</span>`:''}
      ${(function(){
        /* אזהרות-תקינות מההעלאה — ובמיוחד עומס-RIP (16/08): קובץ עמוס-
           וקטורים שתוקע את אפוגי מקבל צ'יפ אדום בולט עם ההנחיה. */
        const wrn = (p.preflight && p.preflight.warnings) || [];
        if (!wrn.length) return '';
        const rip = wrn.some(w => /RIP|משוטח/.test(String(w)));
        return `<span class="psTag" style="background:#fef2f2;color:#b91c1c;border:1.5px solid #fca5a5" title="${escapeHtml(wrn.join(' · '))}">${rip ? '🛑 עמוס-וקטורים — לבקש קובץ משוטח' : ('⚠️ תקינות: ' + wrn.length)}</span>`;
      })()}
      <span class="isMeta">${units.length?(units.length+' קבצים · '):''}${su.pages?(su.pages+' עמ׳ · '):''}${fmt(su.at)}</span>
    </div>`;

    /* רשת-העמודים: ההחלטה מה-אריח-ואיפה ב-ShopIssue.pageTiles (טהורה). */
    const tiles = ShopIssue.pageTiles(p);
    window._tileReg = { id: p.id, p: p, tiles: tiles };
    /* ⚠️ ספירת-עמודים ולא ספירת-אריחים: אריח-ריצה הוא ‎pages‎ עמודים.
       "עמודים שהתקבלו (1)" על ריצה בת 8 שלח את הדפוס לחפש 7 עמודים שכבר ביד. */
    const nPages = tiles.reduce((n, t) => n + (t.kind === 'page' ? Math.max(1, t.pages | 0) : 0), 0);
    const marked = tiles.filter(t => t.mark && t.mark.kind === 'replace').length;
    /* ── מפה לפי ריצות (בקשת-בעלים 19/08/2026) ──────────────────────────
       אותה החלטה בדיוק כמו בפורטל (ShopIssue.runGrid) — כדי ששני המסכים
       יספרו את אותו סיפור על אותו גיליון. גיליון עמוד-לקובץ נשאר ברשת
       השטוחה. */
    const rgrid = ShopIssue.runGrid(p);
    window._runGridReg = rgrid.ok ? { id: p.id, p: p, grid: rgrid } : null;
    /* ⚠️ **המבנה מ-IssueGrid המשותף** (בקשת-בעלים 20/08/2026): הפורטל של
       הלקוח מציג את אותה פריסה בדיוק, ורק הכפתורים שונים. עד היום היו
       שתי פריסות שנכתבו בנפרד — כל תיקון נעשה פעם אחת ונשכח בשני. */
    const _ig = IssueGrid.build({
      esc: escapeHtml, fmt: fmt, tiles: tiles, grid: rgrid, totalPages: rgrid.ok ? rgrid.total : 0,
      /* ⚠️ 23/08: הדפוס חייב לראות **מה מותר להדפיס עכשיו** — אישור
         פר-ריצה, לא רק "מאושר/לא". ראה approvalSummary ב-shop-issue. */
      approval: ShopIssue.approvalSummary(p),
      hint: rgrid.ok ? 'לחיצה על ריצה: פריסת עמודיה' : 'לחיצה על עמוד: הגדלה · סימון · הורדה',
      emptyText: 'טרם התקבלו קבצים לגיליון הזה.',
      headExtra: rgrid.ok
        ? ` <button class="pgRemind" data-setsheet="${escapeHtml(p.id)}" title="גודל-הגיליון קובע את כל הפריסה — לתיקון">✎</button>` : '',
      footer: '<div id="runExp" class="runExp"></div>',
      actions: {
        thumbAttrs: (t, i) => (t && t.url) ? ` data-thumb="${i}"` : '',
        /* ── ריצות ── */
        runAttrs: (rn, state) => state === 'got'
          ? ` data-tile="${rn.tileIndex}"`
          : ` data-runmiss="${rn.no}" style="cursor:pointer"`,
        runExtra: (rn, state) => {
          if (state === 'missing')
            return `<button class="pgRemind" data-remindrun="${rn.no}" title="ממלא הודעת-תזכורת בשיחה עם הלקוח">📩 תזכורת</button>`;
          /* ⚠️ בקשת-בעלים 20/08/2026: ריצה שהדפוס כבר עובד עליה ננעלת
             לשינויי-לקוח — הלקוח שולח לפעמים ריצה אחת, מתחילים לעבוד,
             ואחר-כך מגיעות שאר הריצות. הנעילה פר-ריצה, הפיכה, וגלויה
             לשני הצדדים. חלה גם על ריצה מכוסה-בקבצים ('covered'). */
          const lk = ShopIssue.runLocked(p, rn.no);
          /* ⚠️ 21/08/2026 ("הריצה הקצרה אצלכם ריצה 5 — נטפל אנחנו"): הצוות
             מתקן סדר-ריצות בעצמו — אותה החלפת-מספר של הפורטל, מכאן. */
          const mv = rn.partId
            ? `<button class="pgRemind" data-runmove="${escapeHtml(p.id)}|${escapeHtml(rn.partId)}" title="העברת הריצה למקומה הנכון (החלפת מספר-ריצה)">⇄ העבר ריצה</button>` : '';
          /* ⚠️ בקשת-בעלים 23/08/2026: "שהדפוס גם יוכל לעדכן את הלקוח
             שהריצה שהלקוח שלח היא תקינה ומאושרת להדפסה". הכיוון ההפוך
             של אישור-הלקוח: כאן הדפוס אומר "בדקנו — תקין".
             ⚠️ הלקוח רואה את זה בפורטל, ולכן הכפתור **דו-כיווני**. */
          const sa = rn.partId ? ShopIssue.runShopApproved(p, rn.partId) : false;
          const ok = rn.partId
            ? `<button class="pgRemind${sa ? ' rlOn' : ''}" data-runok="${escapeHtml(p.id)}|${escapeHtml(rn.partId)}"
                title="${sa ? 'הלקוח רואה שהריצה אושרה להדפסה — לחיצה מבטלת' : 'לעדכן את הלקוח שהריצה תקינה ומאושרת להדפסה'}">${sa ? '✅ אושרה ללקוח' : '✔ אשר ללקוח'}</button>` : '';
          return mv + ok + `<button class="pgRemind${lk ? ' rlOn' : ''}" data-runlock="${escapeHtml(p.id)}|${rn.no}"
            title="${lk ? 'הריצה נעולה לשינויים מצד הלקוח — לחיצה משחררת' : 'נעילת הריצה לשינויים מצד הלקוח (כשהיא כבר בעבודה בדפוס)'}">${lk ? '🔒 נעולה ללקוח' : '🔓 נעל ריצה'}</button>`;
        },
        /* ── עמודים ── */
        tileAttrs: (t, i, kind) => kind === 'page' ? ` data-tile="${i}"` : '',
        tileExtra: (t, i, kind) => kind === 'missing'
          ? `<button class="pgRemind" data-remind="${t.pageNo}" title="ממלא הודעת-תזכורת בשיחה עם הלקוח">📩 תזכורת</button>` : '',
      },
    });
    const pagesGrid = _ig.html;


    /* ⚠️ "אשר קבלה ללקוח" הוא ‎shopSeenAt‎ הקיים — אותו שדה שהפורטל כבר
       מציג ללקוח כ"בית-הדפוס קיבל את הקבצים". */
    /* ⚠️ 21/08/2026 (ביקורת): "אושרה קבלה" על רשומה בלי קבצים היא אישור-
       קבלה על כלום — נאמרת האמת במקום. */
    const seenBlock = seenTime
      ? (su.arrived
          ? `<span class="isSeen">✓ אושרה קבלה ללקוח · ${fmt(seenTime)}</span>`
          : `<span class="isSeen" style="color:#b45309">⚠️ סומן שנצפה — אך אין קבצים ברשומה</span>`)
      : (su.arrived ? `<button class="isBtn ok" data-seenall="${escapeHtml(su.id)}">✅ אשר קבלה ללקוח</button>` : '');

    /* ⚠️ 13/08/2026, דיווח-בעלים: גיליון שממתין לקבצים הציג "אושר להדפסה",
       "דרוש תיקון" ו"הורד" — נראה כאילו אפשר להוריד ולאשר בשם הלקוח, כשאין
       על מה. ההחלטה מה מוצג יושבת ב-ShopIssue.cardActions (טהורה, נבדקת
       ב-shop-issue-tests); כאן רק מצוירת. במקום הפעולות מוצג קישור-ההעלאה —
       הפעולה היחידה שיש לה טעם על גיליון ריק. */
    const act = ShopIssue.cardActions(p);
    /* ── בקשות-החלפה על הכרטיס (בקשת-בעלים 14/08) ─────────────────────────
       עד היום הבקשה חיה רק בתוך "⋮ פעולות נוספות" וברשימת-הדחיפות — קל
       לפספס איזה עמוד ביקשו, וקל להוריד קבצים באמצע חלון-החלפה פתוח.
       שלושת המצבים על הכרטיס עצמו: ממתין (אשר/דחה) · פתוח (לא להוריד!) ·
       בוצע (prTag הקיים כבר אומר "להוריד מחדש"). */
    const swapBans = (() => {
      if (!window.PageSwap) return '';
      const list = [{ target: 'full', nm: '' }]
        .concat(Object.entries(p.parts || {}).map(([pid, pt]) => ({ target: pid, nm: (pt && pt.name) || '' })));
      return list.map(({ target, nm }) => {
        const req = psReqOf(p, target);
        if (!req) return '';
        const st = PageSwap.state(req, Date.now());
        const key = p.id + '|' + target;
        const pgs = (req.pages && req.pages.length) ? 'עמוד ' + req.pages.join(', ') : 'עמוד (לא צוין מספר)';
        const unit = nm ? ' · ' + escapeHtml(nm) : '';
        if (st === 'pending') return `<div class="swapBan wait">🔁 <b>הלקוח מבקש להחליף ${escapeHtml(pgs)}</b>${unit}${req.note ? ' — ' + escapeHtml(req.note) : ''}
          <span class="swapActs"><button class="psOk" data-ps="${key}">✔ אשר החלפה</button><button class="psNo" data-ps="${key}">✖ דחה</button></span></div>`;
        if (st === 'approved') return `<div class="swapBan open">✋ <b>אושרה החלפת ${escapeHtml(pgs)}</b>${unit} — <b>לא להוריד קבצים!</b>
          הלקוח מחליף כעת (${escapeHtml(PageSwap.remainingLabel(req, Date.now()) || 'חלון פתוח')}). בסיום הוא יאשר שוב שהגיליון סופי להדפסה — רק אז מורידים.
          <span class="swapActs"><button class="psNo" data-ps="${key}" title="סגירת חלון-ההחלפה של הלקוח">✖ סגור חלון</button></span></div>`;
        return '';
      }).join('');
    })();
    return `<div class="isCard on${ShopIssue.printApproved(p)?' approved':''}">${head}
      <div class="isBody">
        ${ShopIssue.isDraft(p) ? `<div class="swapBan wait">📝 <b>הלקוח עדיין מסדר את הגיליון — טרם אישר לדפוס.</b>
          אפשר לצפות ולדפדף כבר עכשיו; ההורדה והאישור-להדפסה ייפתחו כשהלקוח יאשר.</div>` : ''}
        ${p.completedAt ? `<div class="swapBan" style="background:#f5f5ff;border:2px solid #a5b4fc;color:#3730a3">🗄️ <b>גיליון קודם — כבר הודפס/הושלם.</b>
          לא להעלות אליו קבצים ולא להוריד ממנו — הקבצים כאן שייכים לגיליון שעבר.</div>` : ''}
        ${swapBans}
        <div class="isMain">
          ${act.canView?`<a class="isBtn view" href="${base}proof-viewer.html?id=${p.id}" target="_blank">👁 צפייה בדפדוף</a>`:''}
          ${seenBlock}
          ${act.canPrintApprove?`<button class="isBtn ${ShopIssue.printApproved(p)?'done':'ok'}" data-printok="${escapeHtml(su.id)}">${ShopIssue.printApproveLabel(p)}</button>`:''}
          ${act.canRequestFix?`<button class="isBtn fix" data-needfix="${escapeHtml(su.id)}" title="נפתחת דרישה בפורטל הלקוח — הוא יעלה את העמוד המתוקן">🔁 דרוש תיקון</button>`:''}
          ${act.showUploadHint?`<button class="isBtn" data-link="${base}proof-client.html?id=${p.id}" title="הקישור שאיתו הלקוח מעלה את הקבצים לגיליון הזה">📤 קישור העלאה ללקוח</button>`:''}
          ${closeBtn(p, 'isBtn')}
          ${(function(){
            /* 🔓 פתיחת-גיליון-שנשלח לעריכת-לקוח (בקשת-בעלים 16/08): במקום
               לחכות שהלקוח יבקש — הדפוס פותח, והלקוח מקבל בפורטל כפתור
               גדול "מאושר להדפסה" לסיום. אותה תשתית של בקשת-החלפה. */
            /* ⚠️ 16/08, דיווח-בעלים: הותנה בטעות ב"אושר להדפסה" — הכפתור
               שייך לכל גיליון **שנשלח** (approved), זה בדיוק המצב הנעול
               שהלקוח מבקש לפתוח. */
            if (!window.PageSwap || !(p.status === 'approved' || p.approvedAt || ShopIssue.printApproved(p))) return '';
            const rq = ((p.changeRequests || {}).full) || null;
            if (rq && ['pending', 'approved'].indexOf(PageSwap.state(rq, Date.now())) >= 0) return '';
            return `<button class="isBtn" data-openedit="${p.id}" title="פותח ללקוח חלון-עריכה של 48 שעות; בסיום הוא מאשר שוב להדפסה">🔓 פתח לעריכת-לקוח</button>`;
          })()}
        </div>
        ${pagesGrid}
        <div class="isMore"><div class="acts">
          <button data-link="${base}proof-client.html?id=${p.id}">📤 קישור העלאה ללקוח</button>
          ${act.canDownload?genCell('', jobName(p), p.id, ''):''}
          ${notifyBtn(p)}${editBtn(p)}
          ${prTag(p)}${psCell(p.id, 'full', psReqOf(p, 'full'))}
          <button class="del" data-deljob="${p.id}">🗑 מחק</button>
        </div></div>
      </div></div>`;
  };

  const rowHtml = p => {
    const clientLink = `${base}proof-client.html?id=${p.id}`;
    const viewerLink = `${base}proof-viewer.html?id=${p.id}`;  // צפייה בלבד — לשליחה לעובדים
    const parts = _partsOrdered(p);   // לפי מספר-הריצה, לא לפי זמן-ההעלאה

    // ── עבודה לפי ריצות ──
    if (parts.length) {
      const _col = !!_jobCollapsed[p.id];   // עבודה מכווצת → שורות-הריצות מוסתרות
      const head = `<tr class="row-ok">
        <td><span data-jobtoggle="${p.id}" style="cursor:pointer;user-select:none;color:#2d3561;font-weight:900;margin-left:4px" title="${_col?'פתח':'כווץ'} ריצות">${_col?'▶':'▼'}</span> <b>${escapeHtml(p.title || '—')}</b></td>
        <td><span class="badge b-approved">${parts.length} ריצות התקבלו</span>${doneTag(p)}${revTag(p)}${pendTag(p)}${stageBar(p)}</td>
        <td>נוצר: ${fmt(p.createdAt)}</td>
        <td><div class="acts">
          <a href="${viewerLink}" target="_blank">👁 צפה בדפדוף</a>
          <button data-link="${clientLink}" title="דף ההעלאה של הלקוח — הוא יכול להוסיף/להחליף עמודים ולאשר">📤 קישור העלאה ללקוח</button>
          ${notifyBtn(p)}${editBtn(p)}${closeBtn(p)}
          <button class="del" data-deljob="${p.id}" title="מחק עבודה וכל הריצות">🗑</button>
        </div></td></tr>`;
      const partRows = parts.map(pt => `<tr class="row-ok">
        <td style="padding-right:26px;color:#555">↳ ${escapeHtml(pt.name)} <span style="color:#9ca3af">(${pt.pageCount} עמ')</span>${(pt.pendingPages&&pt.pendingPages.length)?` <span style="font-size:.72rem;font-weight:800;color:#b45309;background:#fffbeb;border:1.5px solid #fcd34d;border-radius:5px;padding:1px 7px;white-space:nowrap">⏳ חסרים עמ׳ ${pt.pendingPages.join(', ')}</span>`:''}</td>
        <td><span class="badge b-approved">מאושר</span></td>
        <td>אושר: ${fmt(pt.approvedAt)}</td>
        <td><div class="acts">
          <a href="${base}proof-viewer.html?id=${p.id}&part=${pt.pid}" target="_blank">👁 צפה</a>
          <button data-link="${base}proof-viewer.html?id=${p.id}&part=${pt.pid}">📤 לעובדים</button>
          ${seenBtn(p, pt.pid)}${genCell(pt.fileUrl, jobName(p, pt.name), p.id, pt.pid)}
          ${prTag(pt)}${psCell(p.id, pt.pid, psReqOf(p, pt.pid))}
          <button data-moverun="${p.id}|${pt.pid}" title="הלקוח העלה לגיליון הלא-נכון? העבר את הריצה לגיליון אחר">⇄ העבר לגיליון</button>
          <button class="del" data-delpart="${p.id}|${pt.pid}|${encodeURIComponent(pt.filePath||'')}" title="מחק ריצה">🗑</button>
        </div></td></tr>`).join('');
      return head + (_col ? '' : partRows);   // מכווץ → מציגים רק את שורת-העבודה
    }

    // ── פרופר-אפוגי שהעלה הדפוס — אישור/נעילה של הלקוח ──
    if (p.apogeeUrl) {
      const approved = !!p.apogeeApprovedAt;
      const link = `${base}imposition-tool.html?proofUrl=${encodeURIComponent(p.apogeeUrl)}&type=${encodeURIComponent(p.apogeeFold||'32')}&auto=1&client=1`;
      return `<tr class="${approved?'row-ok':''}">
        <td><b>${escapeHtml(p.title || 'פרופר אפוגי')}</b></td>
        <td><span class="badge ${approved?'b-approved':'b-wait'}">${approved ? '✓ אושר לדפוס · נעול' : 'ממתין לאישור הלקוח'}</span>${stageBar(p)}</td>
        <td>נוצר: ${fmt(p.createdAt)}${approved ? `<div class="note" style="color:#16a34a">✓ ${escapeHtml(p.apogeeApprovedBy||'')} · ${fmt(p.apogeeApprovedAt)}</div>` : ''}</td>
        <td><div class="acts">
          <a href="${link}" target="_blank">📖 דפדף</a>
          <button class="dl" data-dl="${(function(){ const k='g'+(gi++); _genReg[k]={ fileUrl:p.apogeeUrl, title:jobName(p) }; return k; })()}" title="קובץ-PDF יחיד בשם העבודה">⬇ הורד</button>
          ${approved ? `<button data-unlock="${p.id}" title="בטל נעילה — הלקוח יוכל לשנות/לאשר מחדש">🔓 פתח לשינויים</button>` : ''}
          <button class="del" data-deljob="${p.id}" title="מחק פרופר">🗑</button>
        </div></td></tr>`;
    }

    // ── עיתון שהעלה הלקוח מהפורטל — קבצים מקובצים תחת עיתון אחד (לא כבודדים) ──
    if (p.files) {
      const fkeys = Object.keys(p.files);
      const dls = fkeys.map(k => { const fl = p.files[k]; return (fl && fl.fileUrl)
        ? `<a href="${fl.fileUrl}" target="_blank" title="${escapeHtml(fl.fileName||'')}">⬇ ${escapeHtml((fl.fileName||'קובץ').slice(0,22))}</a>` : ''; }).join(' ');
      const pf = (p.preflight && p.preflight.issueCount > 0)
        ? `<div class="note" style="color:#b45309">⚠️ תקינות: ${escapeHtml((p.preflight.warnings||[]).join(' · '))}</div>`
        : (p.preflight ? `<div class="note" style="color:#16a34a">✓ בדיקת תקינות עברה</div>` : '');
      /* סריקת-הרקע (קו-שערה/צבע) — רצה אצל הלקוח **אחרי** ההעלאה
         (הכרעת-בעלים 19/08: הלקוח לא מחכה לבדיקות) ונכתבת לכאן בלבד */
      const inkW = (p.preflight && p.preflight.inkWarnings) || [];
      const pfInk = inkW.length
        ? `<div class="note" style="color:#b45309">🖋 ${escapeHtml(inkW.join(' · '))}</div>` : '';
      return `<tr>
        <td><b>${escapeHtml(p.title || (p.customer ? p.customer + ' — עיתון' : 'עיתון'))}</b>
          <span style="color:#9ca3af">(${fkeys.length} קבצים${p.issue ? ' · גיליון ' + escapeHtml(String(p.issue)) : ''})</span>${pf}${pfInk}</td>
        <td><span class="badge b-wait">התקבל מהלקוח</span>${pendTag(p)}${stageBar(p)}</td>
        <td>נוצר: ${fmt(p.createdAt)}</td>
        <td><div class="acts">${dls}
          <button class="del" data-deljob="${p.id}" title="מחק עבודה וכל הקבצים">🗑</button>
        </div></td></tr>`;
    }

    // ── עבודה רגילה (עיתון מלא / ממתין) ──
    const [txt, cls] = STATUS[p.status] || ['—', ''];
    const gen = p.status === 'approved' ? genCell(p.fileUrl, jobName(p), p.id, null)
      : `<button disabled title="זמין רק לאחר אישור">⬇ הורד</button>`;
    const view = p.fileUrl ? `<a href="${viewerLink}" target="_blank">👁 צפה בדפדוף</a>` : '';
    /* ⚠️ 17/08/2026, בקשת-בעלים: "קישור צפייה לעובדים" הוסר —
       אפשר להיכנס לפורטל הלקוח ולהעתיק משם את הקישור.
       ⚠️ הדף `proof-viewer.html` עצמו **לא** הוסר — "👁 צפה בדפדוף"
       ממשיך לפתוח אותו, וקישורים שכבר נשלחו לעובדים ממשיכים לעבוד. */
    const note = (p.status === 'rejected' && p.customerNote) ? `<div class="note">📝 ${escapeHtml(p.customerNote)}</div>` : '';
    const approvedLine = p.approvedAt ? `<div class="note" style="color:#16a34a">✓ אושר: ${fmt(p.approvedAt)}</div>` : '';
    return `<tr class="${p.status==='approved'?'row-ok':''}">
      <td>${escapeHtml(p.title || (p.customer ? p.customer + ' — עיתון' : 'עיתון'))}${note}</td>
      <td><span class="badge ${cls}">${txt}</span>${doneTag(p)}${pendTag(p)}${stageBar(p)}</td>
      <td>נוצר: ${fmt(p.createdAt)}${approvedLine}</td>
      <td><div class="acts">
        <a href="${clientLink}" target="_blank">🔗 פתח</a>
        <button data-link="${clientLink}" title="דף ההעלאה של הלקוח — הוא יכול להוסיף/להחליף עמודים ולאשר">📤 קישור העלאה ללקוח</button>
        ${view}${seenBtn(p, null)}${gen}${prTag(p)}${psCell(p.id, 'full', psReqOf(p, 'full'))}${notifyBtn(p)}
        ${editBtn(p)}${closeBtn(p)}
        <button class="del" data-deljob="${p.id}" title="מחק עבודה">🗑</button>
      </div></td></tr>`;
  };

  // ── פריסת master-detail: רשימת-לקוחות בצד · עבודות הלקוח הנבחר במרכז ──
  // הרשימה מסודרת לפי היום בשבוע (מהיומן השבועי); ברירת-המחדל = מסך "היום"
  // שמרכז את מי שאמור לשלוח היום או שיש לו כרטיס-עבודה פעיל. (בקשת-משתמש 2026-07-30)
  const custNames = [...byCustomer.keys()];
  const _today = _DAYS[new Date().getDay()];
  const _dayOf = {}; custNames.forEach(c => _dayOf[c] = _custDay(c));
  if (_selCust == null) _selCust = '__today__';
  if (_selCust !== '__today__' && !byCustomer.has(_selCust)) _selCust = custNames.length ? '__today__' : null;

  // קבוצות-הימים מקווצות כברירת-מחדל; לחיצה על יום פותחת (בקשת-משתמש 2026-07-30)
  const _dayKey = (day) => day || 'ללא יום קבוע';
  const _isDayCollapsed = (day) => _dayCollapsed[_dayKey(day)] !== false;   // undefined → מקווץ
  /* 🆕 חיווי "קבצים חדשים מהלקוח" (בקשת-בעלים 2026-07-31): העלאה שאושרה
     ושקדם-הדפוס עדיין לא סימן שראה (shopSeenAt). אותו שדה שמפעיל את ההתראה
     החוזרת ואת "בית-הדפוס קיבל" בפורטל — מקור-אמת אחד. */
  /* ⚡ מטמון-לרינדור: שתי הפונקציות האלה נקראות 3-4 פעמים לכל לקוח בכל רינדור
     (רצועת-ימים, כרטיס, פאנל-כרטיסים, מסך-היום), ו-_custHasActiveCard סורקת
     בפנים את כל שמות-הכרטיסים הפעילים עם השוואת-מחרוזת. הרינדור רץ כל 15
     שניות. המטמון נבנה מחדש בכל רינדור, ולכן אינו יכול להתיישן. */
  const _nfCache = new Map(), _acCache = new Map();
  const _hasCard = (c) => { if (!_acCache.has(c)) _acCache.set(c, _custHasActiveCard(c)); return _acCache.get(c); };
  const _newFilesFor = (c) => {
    if (_nfCache.has(c)) return _nfCache.get(c);
    const items = byCustomer.get(c) || [];
    let n = 0;
    items.forEach(function(p){
      if (!p) return;
      let rn = 0;
      if (p.approvedAt && !p.shopSeenAt && p.mode !== 'parts') rn++;
      Object.keys(p.parts || {}).forEach(function(k){
        const pt = p.parts[k]; if (pt && pt.approvedAt && !pt.shopSeenAt) rn++;
      });
      /* ⚠️ 21/08/2026 (ביקורת, "שווה פרסום"): העלאת-פורטל בלי approvedAt —
         אותו כלל של ShopView.newFiles (הענף שם נדלק רק כשלא נספר דבר),
         כדי ששני החיוויים יסכימו. */
      if (!rn && window.ShopView && ShopView.newFiles(p) > 0) rn++;
      n += rn;
    });
    _nfCache.set(c, n);   // המטמון היה מת — נבדק אך מעולם לא נכתב (ביקורת 21/08)
    return n;
  };
  const _dayNew = {};   // כמה חדשים בכל יום — לחיווי על כותרת-היום
  const custItemHtml = (c, day) => {
    const items = byCustomer.get(c), on = (c === _selCust);
    const act = items.filter(function(p){ return !p.completedAt; }).length;
    const card = _hasCard(c) ? ' <span title="כרטיס עבודה פעיל">📋</span>' : '';
    const hidden = _isDayCollapsed(day) ? ' style="display:none"' : '';
    const nNew = _newFilesFor(c);
    if (nNew) _dayNew[_dayKey(day)] = (_dayNew[_dayKey(day)] || 0) + nNew;
    const newTag = nNew
      ? ` <span class="newDot" title="${nNew} קבצים חדשים שטרם נצפו">🆕 ${nNew}</span>` : '';
    return `<div class="custItem${on?' on':''}${nNew?' hasNew':''}" data-cust="${escapeHtml(c)}" data-day="${escapeHtml(_dayKey(day))}"${hidden}>
      <span class="cName">📁 ${escapeHtml(c)}${card}${newTag}${_seenDot(c)}</span><span class="cCount" title="פעילות מתוך סה״כ">${act}${act!==items.length?('/'+items.length):''}</span></div>`;
  };
  const dayHdrHtml = (day, count) => {
    const col = _isDayCollapsed(day), isToday = (day === _today);
    const nNew = _dayNew[_dayKey(day)] || 0;
    return `<div class="dayHdr${isToday?' todayHdr':''}" data-daytoggle="${escapeHtml(_dayKey(day))}">
      <span class="dayArrow">${col?'▶':'▼'}</span> ${isToday?'📌 ':''}${_dayKey(day)} <span class="dayCnt">(${count})</span>${nNew?` <span class="newDot">🆕 ${nNew}</span>`:''}</div>`;
  };
  // סדר הימים: היום קודם, אחר-כך שאר השבוע במחזור, ולבסוף "ללא יום קבוע"
  const _tIdx = _DAYS.indexOf(_today);
  const _orderedDays = _DAYS.slice(_tIdx).concat(_DAYS.slice(0, _tIdx));
  let sideList = `<div class="custItem dayToday${_selCust==='__today__'?' on':''}" data-cust="__today__">
      <span class="cName">📅 היום — ${_today}</span></div>`;
  // במבנה-פורטל הרשימה הזו נזרקת — אין טעם לבנות אותה כל 15 שניות
  if (!_uiPortal) {
    _orderedDays.forEach(day => {
      const inDay = custNames.filter(c => _dayOf[c] === day).sort((a,b)=>a.localeCompare(b,'he'));
      if (!inDay.length) return;
      sideList += dayHdrHtml(day, inDay.length) + inDay.map(c => custItemHtml(c, day)).join('');
    });
    const _noDay = custNames.filter(c => !_dayOf[c]).sort((a,b)=>a.localeCompare(b,'he'));
    if (_noDay.length) sideList += dayHdrHtml('', _noDay.length) + _noDay.map(c => custItemHtml(c, '')).join('');
    if (!custNames.length) sideList = '<div style="padding:12px;color:#9ca3af;font-size:.85rem">אין לקוחות</div>';
    sideList += '<div id="custNoHit" style="display:none;padding:12px;color:#9ca3af;font-size:.85rem">אין לקוח מתאים</div>';
  }

  // ── מסך "היום": מי אמור לשלוח היום + מי עם כרטיס פעיל ──
  let todayDetail = '';
  if (_selCust === '__today__') {
    /* ⚠️ הפער האמיתי (בקשת-בעלים 2026-07-31): עד היום המסך ענה "מי אמור לשלוח
       היום" — אבל השאלה שנשאלת ב-14:00 היא "אחרי מי אני צריך לרדוף". לכן
       הרשימה מתפצלת לשניים: מי שטרם נרשמה ממנו שליחה היום — ראשון ובאדום.
       ⚠️ "שליחה" נמדדת גם לפי createdAt ולא רק approvedAt: העלאה מהפורטל לא
       תמיד כותבת approvedAt, ולקוח כזה היה מסומן בטעות כמי שלא שלח. */
    const _custRow = (c, late) => { const items=byCustomer.get(c), act=items.filter(p=>!p.completedAt).length;
      const nNew = _newFilesFor(c);
      return `<div class="todayCust${late?' lateCust':''}" data-cust="${escapeHtml(c)}">
        <span>${late?'⏰ ':'📁 '}${escapeHtml(c)}${_hasCard(c)?' 📋':''}${nNew?` <span class="newDot">🆕 ${nNew}</span>`:''}</span>
        <span style="display:flex;gap:6px;align-items:center">
          <button data-portal="${escapeHtml(c)}" title="קישור לפורטל האישי של הלקוח">🔗</button>
          <button data-notice="${escapeHtml(c)}" title="שלח דרישה שתופיע בפורטל הלקוח">📢</button>
          <span class="cCount" style="background:#eef0f6;border-radius:10px;padding:1px 9px;font-size:.78rem">${act} פעילות</span>
        </span></div>`; };
    const dueToday = custNames.filter(c => _dayOf[c] === _today).sort((a,b)=>a.localeCompare(b,'he'));
    const _board = window.ShopView
      ? ShopView.todayBoard(dueToday.map(c => ({ name:c, day:_today, proofs: byCustomer.get(c) || [] })), Date.now())
      : { missing: [], sent: [] };
    const _missing = _board.missing, _sent = dueToday.filter(c => _missing.indexOf(c) < 0);
    todayDetail = `<div class="custHead"><div style="font-size:1.05rem;font-weight:900;color:#2d3561">📅 היום — ${_today}</div>
        <div class="muted" style="font-size:.82rem;color:#6b7280;margin-top:3px">${dueToday.length} אמורים לשלוח · ${_sent.length} שלחו · ${_missing.length} טרם</div></div>`
      /* ⚠️ בקשת-בעלים 19/08/2026: רשימת "טרם נרשמה שליחה היום" הוסרה —
         אותם לקוחות כבר מופיעים בסרגל-הלקוחות שמימין, עם חיווי-הסטטוס
         שלהם. שתי רשימות לאותו מידע הן עומס-מסך, לא יתירות.
         הספירה נשארה בכותרת ("X טרם") — המספר שימושי, הפירוט כפול. */
      + (dueToday.length ? (
          `<div class="todaySec">✓ שלחו היום (${_sent.length})</div>`
          + (_sent.length ? _sent.map(c => _custRow(c, false)).join('')
                          : '<div style="padding:14px;color:#9ca3af">עדיין אף אחד</div>')
        ) : '<div style="padding:14px;color:#9ca3af">אין לקוחות ליום זה ביומן השבועי</div>');
  }

  // ── פאנל "כרטיסים פעילים" בצד שמאל (במקום בתחתית מסך-היום) ──
  const _activeCustNames = custNames.filter(c => _hasCard(c)).sort((a,b)=>a.localeCompare(b,'he'));
  const cardsPanel = `<aside class="mdCards"><div class="hd">📋 כרטיסים פעילים (${_activeCustNames.length})</div>`
    + (_activeCustNames.length
        ? _activeCustNames.map(c => { const items=byCustomer.get(c), act=items?items.filter(p=>!p.completedAt).length:0;
            return `<div class="cardItem${c===_selCust?' on':''}" data-cust="${escapeHtml(c)}"><span>📁 ${escapeHtml(c)}</span>${act?`<span class="cCount" style="background:rgba(0,0,0,.08);border-radius:10px;padding:1px 8px;font-size:.74rem">${act}</span>`:''}</div>`; }).join('')
        : '<div style="padding:14px;color:#9ca3af;font-size:.82rem">אין כרטיסים פעילים</div>')
    + `</aside>`;

  /* ── תיבת "חדש מהלקוחות" (עיצוב-מחדש 2026-08-06, אישור-בעלים) ────────────
     הסיווג כולו ב-ShopView.inboxBoard (טהור, נבדק ב-shop-inbox-tests.js).
     ⚠️ "הועלה" = הפניית-קובץ אמיתית בלבד; stub מוצג במפורש כ"לא סיים
     העלאה" ולעולם אינו נספר כעיתון שהגיע ואינו מפעיל התראה. */
  let inboxHtml = '';
  if (window.ShopView && ShopView.inboxBoard) {
    const _bCust = custNames.map(c => ({ name: c, proofs: byCustomer.get(c) || [], hasActiveCard: _hasCard(c) }));
    const bd = ShopView.inboxBoard(_bCust, Date.now());
    window._ibxBoard = bd;   // לשכבת-ההתראות + מונה-הכותרת (מחוץ ל-render)
    /* ── כרטיס-העבודה בתיבה ────────────────────────────────────────────────
       ⚠️ **תצוגה בלבד.** אין כאן שדה חדש, סטטוס עסקי חדש או פעולה חדשה —
       כל נתון מגיע מ-ShopView/מהרשומה כפי שהם, וכל פעולה מחוברת לאותו
       ‏data-* ולאותו מאזין שהיו קודם.
       ⚠️ סדר-הקריאה נקבע לפי סדר-העבודה של קדם-דפוס: **מי** (לקוח+עבודה) →
       **מה** (מקור/סוג) → **כמה** (עמודים/קבצים/גודל/זמן) → **פעולה**.
       ⚠️ נתון חסר **מושמט** ואינו מוצג כאפס: רשומה ותיקה בלי pageCount או
       fileSize פשוט לא מציגה אותם. ניחוש כאן היה נראה כמו עובדה. */
    const _fmtBytes = (b) => {
      const n = Number(b);
      if (!isFinite(n) || n <= 0) return '';
      if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
      return (n / (1024 * 1024)).toFixed(1) + ' MB';
    };
    /* סכימת-גודל: עיתון-מלא נושא fileSize אחד, ועבודה בריצות אחד לכל ריצה.
       ⚠️ סכימה בלבד — אין שדה חדש, ואין הסתמכות על מונה מוצהר. */
    const _sumBytes = (p) => {
      let b = Number(p && p.fileSize) || 0;
      ['parts', 'files'].forEach((k) => {
        const m = (p && p[k]) || {};
        Object.keys(m).forEach((j) => { const v = Number(m[j] && m[j].fileSize); if (isFinite(v) && v > 0) b += v; });
      });
      return b;
    };
    /* ⚠️ כפתור-ההורדה הוא **אותו** מנגנון של הטבלה: רישום ב-_genReg
       וקריאה דרך data-dl. לא נוצר כאן מסלול-הורדה שני. */
    const _dlBtn = (p) => {
      const url = p.fileUrl || p.apogeeUrl;
      if (!url) return '';
      const key = 'g' + (gi++); _genReg[key] = { fileUrl: url, title: jobName(p), jobId: p.id };
      return `<button class="ibxAct" data-dl="${key}" title="הורדת הקובץ בשם המלא של העבודה">⬇ הורד</button>`;
    };
    /* ⚠️ קישור-הצפייה הוא אותו proof-viewer.html שכבר בשימוש בטבלה. */
    const _viewBtn = (p) => (p.fileUrl || p.apogeeUrl)
      ? `<a class="ibxAct" href="${base}proof-viewer.html?id=${encodeURIComponent(p.id)}" target="_blank" title="דפדוף לצפייה בלבד">👁 צפה בדפדוף</a>` : '';

    const _ibxCard = (it) => {
      const bl = ShopView.BIZ_LABELS[it.status] || ShopView.BIZ_LABELS.stub;
      const kind = ShopView.KIND_LABELS[it.kind] || '';
      const ttl = [it.p.title, it.p.issue ? ('גיליון ' + it.p.issue) : ''].filter(Boolean).join(' · ');
      /* ⚠️ עמודים **או** קבצים — לא שניהם כשאין מה לומר. ב-stub אין קובץ,
         ולכן אין ספירה בכלל. */
      const facts = [
        (it.status !== 'stub' && it.p.pageCount) ? `<b>${it.p.pageCount}</b> עמודים` : '',
        (it.status !== 'stub' && it.files) ? `<b>${it.files}</b> ${it.files === 1 ? 'קובץ' : 'קבצים'}` : '',
        _fmtBytes(_sumBytes(it.p)),
        fmt(it.at),
      ].filter(Boolean).map((s) => `<span>${s}</span>`).join('');
      /* ⚠️ נאמר במפורש כשחסר, כדי שהיעדר-נתון לא ייקרא כ"אפס עמודים". */
      const missing = (it.status !== 'stub' && !it.p.pageCount && !_sumBytes(it.p))
        ? '<div class="ibxMiss">מספר עמודים וגודל אינם רשומים בעבודה זו</div>' : '';
      const pend = (it.p.pendingPages && it.p.pendingPages.length)
        ? `<span class="ibxTag pend">⏳ חסרים עמ׳ ${escapeHtml(it.p.pendingPages.join(', '))}</span>` : '';
      /* ⚠️ **‏shopSeenAt אומר "נצפה" ותו לא.** אינו "נבדק" ואינו "אושר" —
         אין בנתונים שדה כזה, ותרגום כזה היה ממציא שלב-עבודה שלא קרה. */
      const seenTag = it.p.shopSeenAt
        ? `<span class="ibxTag seen" title="${escapeHtml(it.p.shopSeenBy || '')} · ${fmt(it.p.shopSeenAt)}">👁 נצפה</span>`
        : '';
      // תמצית-כרטיס→פורטל (שלב א', 16/08/2026): חיווי לא-חוסם בלבד — היעדרו
      // אינו שגיאה (לקוח בלי כרטיס-עבודה תואם הוא מצב תקין ורגיל).
      const cardTag = it.p.cardSummary
        ? `<span class="ibxTag" title="עמודים/ריצות זרמו אוטומטית מכרטיס-עבודה">🔗 מכרטיס</span>` : '';
      const stubNote = it.status === 'stub'
        ? '<div class="ibxNote">הלקוח התחיל תהליך העלאה אך עדיין לא הגיע קובץ</div>' : '';
      /* פעולות לפי סדר-העבודה: פתיחה ובדיקה → צפייה → הורדה → משניות.
         ⚠️ אף פעולה קיימת לא הוסרה, ואף פעולה חדשה לא נוספה. */
      const act = it.status === 'stub'
        ? `<button class="ibxOpen" data-portal="${escapeHtml(it.customer)}">🔗 צור קשר / קישור-פורטל</button>`
        : `<button class="ibxOpen" data-opencust="${escapeHtml(it.customer)}">פתח ובדוק</button>`;
      const dis = `<button class="ibxDismiss" data-dismiss="${escapeHtml(it.p.id||'')}" title="הסרה מהרשימה בלבד — העבודה נשמרת">✕ הסר</button>`;
      const cls = it.status === 'new' ? ' stNew' : it.status === 'stub' ? ' stStub' : it.status === 'failed' ? ' stFailed' : '';
      const upNow = it.uploading
        ? `<div class="ibxUp">⬆ הלקוח מעלה קבצים כעת${it.uploading.name ? (' · ' + escapeHtml(it.uploading.name)) : ''}${it.uploading.pages ? (' · ' + it.uploading.pages + ' עמ׳') : ''}</div>` : '';
      return `<div class="ibxCard${cls}${it.uploading ? ' stUp' : ''}">
        ${upNow}
        <div class="ibxHead">
          <div class="ibxWho">
            <div class="ibxCust">${escapeHtml(it.customer)}</div>
            ${ttl ? `<div class="ibxJob">${escapeHtml(ttl)}</div>` : ''}
          </div>
          <span class="ibxSt2">${bl.icon} ${escapeHtml(bl.label)}</span>
        </div>
        <div class="ibxTags">${kind ? `<span class="ibxTag src">${escapeHtml(kind)}</span>` : ''}${seenTag}${pend}${cardTag}${_seenBadge(it.customer)}</div>
        ${stubNote}
        ${facts ? `<div class="ibxFacts">${facts}</div>` : ''}${missing}
        <div class="ibxActs">${act}${_viewBtn(it.p)}${_dlBtn(it.p)}${dis}</div></div>`;
    };
    const _ibxRow = (it) => `<div class="ibxRow"><span><b>${escapeHtml(it.customer)}</b>${it.p.title ? (' · ' + escapeHtml(it.p.title)) : ''}
        <span class="ibxMeta">${fmt(it.at)}</span></span>
        <button class="ibxOpen" style="padding:4px 12px" data-opencust="${escapeHtml(it.customer)}">פתח</button></div>`;
    /* ── סיכום התיבה ──────────────────────────────────────────────────────
       ⚠️ שלושת המונים נגזרים **ישירות** מ-inboxBoard, שכבר מסווג כל גיליון
       פעם אחת בדיוק — אין כאן ספירה שנייה שעלולה לסטות ממנה.
       ⚠️ "ממתינות לבדיקת קדם-דפוס" **אינו מוצג**: אין בנתונים שדה שמבחין
       בין "נצפה" לבין "נבדק". ‏shopSeenAt אומר שמישהו ראה, ותו לא. מדד
       שהיה נראה מדויק ומבוסס על ניחוש גרוע מהיעדרו. */
    const _warnCount = bd.inbox.filter((x) => x.status === 'stub' || x.status === 'failed').length;
    const kpis = `<div class="ibxKpis">
        <div class="ibxKpi kNew"><b>${bd.counts.newReal}</b><span>חדשות — טרם נפתחו</span></div>
        <div class="ibxKpi kSeen"><b>${bd.counts.waiting}</b><span>נצפו — ממתינות לטיפול</span></div>
        <div class="ibxKpi kWarn"><b>${_warnCount}</b><span>חריגה / העלאה שלא הושלמה</span></div>
      </div>`;
    inboxHtml = `<div class="ibxWrap">
        <div class="ibxHd">⭐ חדש מהלקוחות <span class="n">${bd.counts.inboxAll}</span></div>
        ${kpis}
        ${bd.inbox.length ? `<div class="ibxCards">${bd.inbox.map(_ibxCard).join('')}</div>`
                          : '<div style="padding:14px;color:#9ca3af">אין העלאות חדשות מהלקוחות 🎉</div>'}
        ${bd.waiting.length ? `<details class="ibxSec"><summary>🟡 ממתין לטיפול (${bd.waiting.length})</summary>${bd.waiting.map(_ibxRow).join('')}</details>` : ''}
        ${bd.inwork.length ? `<details class="ibxSec"><summary>🔵 בטיפול (${bd.inwork.length})</summary>${bd.inwork.map(_ibxRow).join('')}</details>` : ''}
      </div>`;
  }

  const selAll = (_selCust && _selCust !== '__today__') ? byCustomer.get(_selCust) : null;
  // פיצול לפעילות / הושלמו — "עיתונים שהושלמו" נשמרים בקטגוריה נפרדת לכל לקוח
  const sel  = selAll ? selAll.filter(p => !p.completedAt) : null;
  const done = selAll ? selAll.filter(p =>  p.completedAt).sort((a,b)=>(b.completedAt||0)-(a.completedAt||0)) : [];
  const detail = selAll ? `
      <div class="custHead chRow">
        <!-- ⚠️ 14/08/2026, "אני רוצה שזה יראה כמו שהצגת לי": הכותרת יושרה
             למוקאפ — שם + גלולת-יום בשורה אחת, הפעולות כצ'יפים קטנים בצד,
             במקום שלוש שורות-כפתורים שדחפו את התוכן למטה. אותם data-* בדיוק. -->
        <div class="chName">📁 ${escapeHtml(_selCust)}${sel.length?` <span class="count">(${sel.length})</span>`:''}</div>
        <span class="chDay" title="קובע באיזה יום הלקוח מופיע ברשימה (גובר על היומן)">📌 יום קבוע:
          <select id="setDaySel">
            <option value=""${_custDay(_selCust)?'':' selected'}>— ללא —</option>
            ${_DAYS.map(d=>`<option value="${d}"${_custDay(_selCust)===d?' selected':''}>${d}</option>`).join('')}
          </select>${_dayOverride[_normName(_selCust)]?' <span style="color:#16a34a">✓</span>':''}</span>
        <span class="chSp"></span>
        <!-- כפתור העלאת-הפרופר לאישור הוסר מכאן (בקשת-בעלים 2026-07-30):
             הפעולה עברה ללשונית "📤 פרופר ללקוח", שם יש רשימת-לקוחות,
             קיפול לפי טמפלט, בדיקה פנימית ותיעוד-גרסאות. -->
        <button class="chChip" data-portal="${escapeHtml(_selCust)}" title="קישור קבוע לפורטל האישי של הלקוח">🔗 קישור-פורטל</button>
        <button class="chChip ghost" data-notice="${escapeHtml(_selCust)}" title="שלח דרישה שתופיע בפורטל הלקוח">📢 שלח דרישה</button>
        <button class="chChip ghost" data-editcust="${escapeHtml(_selCust)}" title="שינוי שם הלקוח בכל העבודות שלו">✎ ערוך לקוח</button>
      </div>
      ${_custCardHtml(_selCust)}
      ${sel.length > 1 ? `<div style="padding:6px 14px;background:#faf8f2;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span style="font-size:.82rem;color:#555">${sel.length} עבודות</span>
        <button id="jobsCollapseAll" style="font-size:.8rem">➖ כווץ הכל</button>
        <button id="jobsExpandAll" style="font-size:.8rem">➕ פתח הכל</button></div>` : ''}
      ${(_uiPortal ? (sel.length || done.length) : sel.length) ? (_uiPortal
          /* ⚠️ עיצוב-מחדש 13/08/2026 (שרטוט-בעלים): לשוניות-גיליונות במקום
             ערימת-כרטיסים — מספרי-הגיליונות האמיתיים, נקודת-סטטוס, ומעבר
             בלחיצה (אותו data-issue ואותו מטפל). במסך הקלאסי הטבלה נשארת
             בדיוק כשהייתה — הוא רשת-הביטחון.
             ⚠️ תיקון 14/08/2026 (דיווח-בעלים, בוקר-אחרי): הלשוניות נבנות
             מ-**כל** הגיליונות, כולל שהושלמו (נקודה אפורה) — לקוח שכל
             עבודותיו הסתיימו הציג "אין עבודות פעילות" ריק במקום המסך
             המתוכנן, כי הלשוניות ניזונו מהפעילות בלבד. ‏openId עדיין
             מעדיף את הפעיל-החדש; שהושלם נפתח רק כשאין פעיל. */
          ? (function(){
              /* ⚠️ 16/08, דיווח-בעלים: גיליון שהושלם בלשוניות מבלבל — עובד
                 עלול ללחוץ עליו בטעות ולהוריד ממנו קבצים ישנים. לכן
                 הלשוניות מציגות **פעילים בלבד**; גיליונות שהושלמו נשארים
                 בקטע "✅ עיתונים שהושלמו" מתחת. ⚠️ הנפילה-לאחור נשמרת
                 (תיקון 14/08): ללקוח שכל עבודותיו הסתיימו — מוצגות שלו,
                 אחרת המסך היה ריק לגמרי. */
              const all = sel.length ? sel : done;
              /* ⚠️ בקשת-בעלים 20/08/2026 ערב: "המרחק בין גיליון לגיליון
                 קודם הוא לחיצה אחת — ובטעות מורידים עיתון של שבוע שעבר."
                 גיליון שהודפס ואינו החדש ביותר יורד מהלשוניות לתיקיה
                 מקופלת. ההחלטה טהורה (ShopIssue.splitPast) ונבדקת. */
              const _sp = ShopIssue.splitPast(all);
              const allSorted = ShopIssue.sortIssues(all);
              const sorted = ShopIssue.sortIssues(_sp.current);
              const _oid = ShopIssue.openId(all, _openIssue);
              const openP = allSorted.find(x => ShopIssue.idOf(x) === _oid) || sorted[0];
              let shown = _tabsAll ? sorted : sorted.slice(0, 4);
              /* גיליון-עבר פתוח נשאר בתיקיה (שנפתחת) — לא חוזר ללשוניות */
              const _openIsPast = openP && _sp.past.some(x => ShopIssue.idOf(x) === ShopIssue.idOf(openP));
              if (openP && !_openIsPast && !shown.some(x => ShopIssue.idOf(x) === ShopIssue.idOf(openP))) shown = shown.concat([openP]);
              const more = sorted.length > 4
                ? `<span class="isTab tMore" id="tabsMore">${_tabsAll ? '▴ צמצם' : ('▾ כל הגיליונות (' + sorted.length + ')')}</span>` : '';
              const pastF = _sp.past.length
                ? `<details class="pastFold"${_sp.past.some(x => ShopIssue.idOf(x) === _oid) ? ' open' : ''}>
                     <summary>🗂 גיליונות קודמים שהודפסו (${_sp.past.length}) — פתיחה בכוונה, לא בטעות</summary>
                     <div class="isTabs">${_sp.past.map(x => issueTab(x, _oid)).join('')}</div>
                   </details>` : '';
              if (openP) _pinAdd(_selCust);
              return _pinStrip()
                   + `<div class="isTabs">${shown.map(x => issueTab(x, _oid)).join('')}${more}</div><div class="isTabLine"></div>`
                   + pastF
                   + (openP ? issueCard(openP, _oid) : '');
            })()
          : `<table><thead><tr><th>שם העבודה / ריצה</th><th>סטטוס</th><th>תאריך</th><th>פעולות</th></tr></thead>
      <tbody>${sel.map(rowHtml).join('')}</tbody></table>`)
      : '<div style="padding:18px;text-align:center;color:#9ca3af">אין עבודות פעילות ללקוח זה</div>'}
      ${done.length ? `<div style="margin-top:10px;border-top:2px solid var(--line)">
        <div id="doneHdr" style="padding:9px 14px;background:#f0fdf4;cursor:pointer;font-weight:800;color:#166534;display:flex;gap:8px;align-items:center">
          <span>${_doneOpen?'▼':'▶'}</span> ✅ עיתונים שהושלמו <span class="count">(${done.length})</span>
        </div>
        ${_doneOpen ? `<table><thead><tr><th>שם העבודה / ריצה</th><th>סטטוס</th><th>תאריך</th><th>פעולות</th></tr></thead>
          <tbody>${done.map(rowHtml).join('')}</tbody></table>` : ''}
      </div>` : ''}`
    : (todayDetail || '<div style="padding:26px;text-align:center;color:#9ca3af">בחרו לקוח מהרשימה בצד</div>');

  /* ── מבנה-פורטל: ימי-השבוע כניווט ראשי ─────────────────────────────────────
     ההיררכיה היא יום → לקוחות של אותו יום → הפורטל של הלקוח מבט-דפוס.
     אותן פעולות ואותן שורות כמו במסך הקלאסי — רק הסידור שונה, ולכן כל
     החיווט שמתחת (data-cust / data-portal / data-seen …) ממשיך לעבוד. */
  let portalHtml = '';
  /* ברירת-המחדל היא היום הנוכחי — אבל אם אין בו אף לקוח (שישי/שבת, למשל)
     נופלים ליום הבא שיש בו לקוחות. מסך שנפתח ריק נראה כאילו משהו נשבר. */
  /* ⚠️ '__none__' חייב להיות בשרשרת-הנפילה: אם טעינת היומן נכשלת
     (_loadWeeklyContext בולעת שגיאות) לאף לקוח אין יום, וכל הלקוחות היו
     יושבים תחת "ללא יום" — הלשונית האחרונה — בעוד המסך פותח יום ריק
     ומכריז "אין לקוחות". זה נראה בדיוק כמו אובדן-נתונים. */
  const _pvAuto = (function(){
    if (custNames.some(c => _dayOf[c] === _today)) return _today;
    for (const d of _orderedDays) if (custNames.some(c => _dayOf[c] === d)) return d;
    if (custNames.some(c => !_dayOf[c])) return '__none__';
    return _today;
  })();
  const _pvDayNow = (_pvDay == null) ? _pvAuto : _pvDay;
  // מפתח-היום כפי שהוא כתוב על הכרטיסים (data-day) — משמש גם את סינון-החיפוש
  const _pvDayKey = (_pvDayNow === '__none__') ? 'ללא יום קבוע' : _pvDayNow;
  if (_uiPortal) {
    const day = _pvDayNow;
    const _inDay = (d) => d === '__none__' ? custNames.filter(c => !_dayOf[c])
                                           : custNames.filter(c => _dayOf[c] === d);
    const _newInDay = (d) => _inDay(d).reduce((s, c) => s + _newFilesFor(c), 0);

    /* ── עיצוב-מחדש 13/08/2026 (שרטוט-בעלים): הרשימה לפי "מי צריך אותי
       עכשיו", לא לפי א"ב. ההחלטה טהורה (ShopView.triageOrder, נבדקת);
       כאן רק אוספים את האותות ומציירים.
       ⚠️ דחוף גלוי **מכל יום** (data-urgent=1, ראה applyFilter): ביום עמוס
       השאלה אינה "מה היום של הלקוח" אלא "מי מחכה לי". שקטים — לפי היום. */
    const _nowMs = Date.now(), _dayStart = window.ShopView ? ShopView.startOfDay(_nowMs) : 0;
    const _extraOf = (c) => {
      const items = byCustomer.get(c) || [];
      return {
        unreadChat: (window._shUnread && _shUnread[_slug(c)]) || 0,
        swapPending: items.some(p => { const rq = (p && p.changeRequests) || {};

        dueTodayNotSent: window.ShopView && _dayOf[c] === _today

           ⚠️ 21/08: גם customerApprovedAt — האישור הרגיל של הפורטל; עד
           היום רק מסלול-העריכה (customerDoneAt) הדליק את הדחיפות. */
        customerDone: items.some(p => p && (p.customerDoneAt || p.customerApprovedAt) && !p.shopSeenAt),

    const _sumOf = (c) => window.ShopView

      : { active: (byCustomer.get(c) || []).length, newFiles: 0, pendingPages: [], stage: 'received', lastAt: 0 };
    const _tri = (window.ShopView && ShopView.triageOrder)
      ? ShopView.triageOrder(custNames.map(c => ({ name: c, sum: _sumOf(c), extra: _extraOf(c) })))
      : { urgent: [], quiet: custNames.map(c => ({ name: c, why: [], sum: _sumOf(c), extra: {} })) };

    const _card = (row, urgent, hidden) => {
      const c = row.name, s = row.sum;
      const st = (window.ShopView ? ShopView.STAGES : []).filter(x => x.key === s.stage)[0];
      return `<div class="pvCust custItem${c===_selCust?' on':''}${urgent?' urg':' quiet2'}" data-cust="${escapeHtml(c)}"

        <div class="pvcFoot">${s.lastAt?('אחרון: '+fmt(s.lastAt)):'טרם התקבלו קבצים'}</div>
      </div>`;
    };
    /* כל הלקוחות מצוירים תמיד, ומי שלא ביום-הנבחר (ואינו דחוף) מוסתר ב-CSS.
       זה מה שמאפשר לחיפוש למצוא לקוח *מכל* יום בלי ריצה מחדש של render
       (ריצה מחדש בכל הקלדה גונבת פוקוס). */
    const list = _inDay(day);
    const _vis = (c, urgent) => urgent || list.indexOf(c) >= 0;
    /* ⚠️ ביקורת-UX 21/08/2026: "מעלה קבצים כעת" הוא אות **חולף** שנסגר
       מעצמו — הפרדתו מ"דורשים טיפול" מונעת ניפוח של הרשימה באותות
       שאינם דורשים פעולה. עובר לפס-משלו רק אם ההעלאה היא הסיבה היחידה. */
    const _isUploadOnly = (r) => {
      const e = r.extra || {}, s = r.sum || {};
      return e.uploadingNow && !e.customerDone && !e.swapPending
        && !(s.newFiles > 0) && !e.unreadChat && !(s.pendingPages && s.pendingPages.length);
    };
    const _uploading = _tri.urgent.filter(_isUploadOnly);
    const _needAttn  = _tri.urgent.filter(r => !_isUploadOnly(r));
    const listHtml =
        (_uploading.length ? `<div class="pvSec" style="color:#0369a1">🔼 מעלים כעת (${_uploading.length})</div>` : '')
      + _uploading.map(r => _card(r, true, false)).join('')
      + (_needAttn.length ? `<div class="pvSec">⚡ דורשים טיפול (${_needAttn.length})</div>` : '')
      + _needAttn.map(r => _card(r, true, false)).join('')
      + `<div class="pvSec">✓ מטופלים / ממתינים</div>`
      + _tri.quiet.map(r => _card(r, false, !_vis(r.name, false))).join('')
      + (list.length || _tri.urgent.length ? '' : '<div class="pvEmpty" style="padding:18px;color:#9ca3af;font-size:.86rem">אין לקוחות ליום זה</div>');

    /* שבבי-הימים ירדו לסרגל-הצד: הרצועה העליונה תפסה שורה שלמה, והבחירה
       נעשית פעם ביום. ⚠️ אותו ‎data-pvday‎ ואותו מטפל — רק המיקום השתנה. */
    const dayChips = _orderedDays.concat(['__none__']).map(d => {
      const n = _inDay(d).length, nw = _newInDay(d), lbl = d === '__none__' ? 'ללא יום' : d;
      return `<button class="pvChip${d===day?' on':''}${d===_today?' isToday':''}" data-pvday="${escapeHtml(d)}" title="${escapeHtml(lbl)} · ${n} לקוחות">
        ${d===_today?'📌 ':''}${escapeHtml(lbl)} <span class="c">${n}</span>${nw?`<span class="newDot">🆕${nw}</span>`:''}</button>`;
    }).join('');
    const _selName = (_selCust && _selCust !== '__today__') ? _selCust : '';
    /* ⚠️ בקשת-בעלים 17/08/2026: "מי אמור לשלוח היום" צריך להיות **על המסך**
       ולא מאחורי לשונית. הרצועה העליונה הייתה ריקה; הרשימה בצד ימין נשארת
       לבחירה לפי ימים, כמו שהייתה. אותה חלוקה בדיוק של "📅 סיכום היום"
       (‏ShopView.todayBoard) — מקור-אמת אחד, לא ספירה שנייה שתסתור אותו. */
    const _tDue = custNames.filter(c => _dayOf[c] === _today).sort((a,b)=>a.localeCompare(b,'he'));
    const _tBoard = window.ShopView
      ? ShopView.todayBoard(_tDue.map(c => ({ name:c, day:_today, proofs: byCustomer.get(c) || [] })), Date.now())
      : { missing: [], sent: [] };
    const _tMiss = _tBoard.missing, _tSent = _tDue.filter(c => _tMiss.indexOf(c) < 0);
    /* לחיצה על שם פותחת את הלקוח — אותו data-cust של רשימת-הלקוחות, ולכן
       אותו מאזין בדיוק ולא מסלול-פתיחה שני. */
    const _tChip = (c, late) => `<button class="tdChip${late?' late':''}" data-cust="${escapeHtml(c)}"`
      + ` title="${late?'טרם נרשמה שליחה היום':'שלח היום'} · ${escapeHtml(c)}">`
      + `${late?'⏰ ':'✓ '}${escapeHtml(c)}</button>`;
    const todayStrip = !_tDue.length
      ? `<span class="tdNone">אין לקוחות ל${escapeHtml(_today)} ביומן השבועי</span>`
      : `<span class="tdLbl">📅 ${escapeHtml(_today)} · ${_tMiss.length} טרם מתוך ${_tDue.length}</span>`
        + _tMiss.map(c => _tChip(c, true)).join('')
        + _tSent.map(c => _tChip(c, false)).join('');
    portalHtml = `<div class="pvWrap">
      <div class="pvDays">
        <b style="font-size:.9rem;color:#2d3561">📁 לקוחות ועבודות</b>
        <div class="tdStrip">${todayStrip}</div>
        <span class="pvSpacer"></span>
        <button class="pvDay${_selCust==='__today__'?' on':''}" data-cust="__today__" title="מי אמור לשלוח היום ומי טרם שלח">📅 סיכום היום</button>
        <button class="pvSwitch" id="uiClassic" title="חזרה למסך הרשימה הקודם">↩ תצוגה קודמת</button>
      </div>
      <div class="pvBody2">
        <aside class="pvSide">
          <h2 class="pvH">📁 הלקוחות שלי</h2>
          <div class="custFilterWrap"><input id="custFilter" type="search" placeholder="🔍 חיפוש לקוח…" autocomplete="off"></div>
          <div class="pvDayChips">${dayChips}</div>
          <div class="pvSideTitle">${day==='__none__'?'ללא יום קבוע':day} · ${list.length} לקוחות</div>
          ${listHtml}
          <div id="custNoHit" style="display:none;padding:12px;color:#9ca3af;font-size:.85rem">אין לקוח מתאים</div>
        </aside>
        <section class="mdMain" style="padding:12px">${detail}</section>
        <div class="pvLeftCol">
        <aside class="shChat">
          <div class="shChatHd">💬 <span style="flex:1">${_selName?('שיחה עם '+escapeHtml(_selName)):'שיחה'}</span>

          <div class="shChatBox" id="shChatBox">${_selName?'<div style="color:#9ca3af;font-size:.83rem;padding:8px">טוען…</div>':'<div style="color:#9ca3af;font-size:.83rem;padding:8px">בחרו לקוח כדי לפתוח שיחה.</div>'}</div>
          ${_selName?`${(function(){
            /* תשובות-מהירות (עיצוב-מחדש 13/08/2026): ההודעות שחוזרות ביום
               עמוס — לחיצה ממלאת את התיבה (לא שולחת: תמיד יש מה לתקן). */
            const s = _sumOf(_selName);
            const q = ['📩 הקבצים התקבלו, תודה!',
                       s.pendingPages.length ? ('⏳ חסרים עדיין עמ׳ ' + s.pendingPages.join(', ') + ' — אפשר לשלוח?') : '⏳ חסרים עדיין עמודים — אפשר לשלוח?',
                       '✅ הגיליון אושר להדפסה'];
            return `<div class="shQuick">${q.map(t=>`<span class="shQ" data-quick="${escapeHtml(t)}">${escapeHtml(t.length>34?t.slice(0,32)+'…':t)}</span>`).join('')}</div>`;
          })()}<div class="shSend">
            <textarea id="shChatInput" rows="2" placeholder="הודעה ללקוח… (Ctrl+V מדביק צילום)"></textarea>
            <button id="shChatAttach" title="צירוף תמונה או PDF">📎</button>
            <button id="shChatSend">שלח</button>
            <input type="file" id="shChatFile" accept="image/png,image/jpeg,application/pdf" style="display:none">
          </div>
          <div style="padding:0 9px 9px;font-size:.72rem;color:#9ca3af">‏Enter שולח · Shift+Enter שורה חדשה</div>`:''}
        </aside>
        <!-- ⚠️ פאנל "כרטיסים פעילים" הוסר מהעמודה (בקשת-בעלים 14/08/2026) —
             השיחה מקבלת את מלוא-הגובה. הפאנל חי במסך הקלאסי (?ui=classic)
             ובלוח-קרטיס; ההערה הקודמת ("הסרתו גורעת יכולת") בוטלה במפורש
             ע"י הבעלים לטובת צ'אט גדול. -->
        </div>
      </div></div>`;
  }

  /* הרענון-האוטומטי (כל 15 שניות) מחליף innerHTML ומאפס גלילה. במבנה-פורטל
     הרשימה מכילה את *כל* הלקוחות, ולכן קפיצה-לראש באמצע חיפוש-ויזואלי מרגישה
     כמו תקלה. שומרים ומחזירים. */
  const _prevScroll = (function(){ const e = document.querySelector('.pvSide, .mdSide'); return e ? e.scrollTop : 0; })();
  /* תיבת-"חדש מהלקוחות" קודמת לשני המבנים (פורטל/קלאסי) — היררכיה: חדש →
     ממתין → בטיפול → ואז אזור-הלקוחות/ימים/היסטוריה הקיים כאזור-משני. */
  $('tableWrap').innerHTML = inboxHtml + (_uiPortal ? portalHtml : `<div class="mdWrap">
      <aside class="mdSide"><div class="mdSideTitle">לקוחות (${custNames.length})
          <button class="pvSwitch" id="uiPortal" title="מעבר לתצוגת ימי-שבוע">📅 תצוגת ימים</button></div>
        <div class="custFilterWrap"><input id="custFilter" type="search" placeholder="🔍 חיפוש לקוח…" autocomplete="off"></div>
        ${sideList}</aside>
      <section class="mdMain">${detail}</section>
      ${cardsPanel}
    </div>`);
  /* ⚠️ כפתור "📅 סיכום היום" ברצועת-הימים נושא data-cust אבל אינו .custItem,
     ולכן מטפל-הקליק המשותף לא תופס אותו — לחיצה עליו לא עשתה כלום, בשקט.
     (בדיוק דפוס הכשל-השקט שכבר עלה כאן פעמיים.) */
  if (_prevScroll) { const e = document.querySelector('.pvSide, .mdSide'); if (e) e.scrollTop = _prevScroll; }
  document.querySelectorAll('.pvDay[data-cust]').forEach(b => b.onclick = () => {
    _selCust = b.dataset.cust; render(rows);
  });
  // ניווט-ימים (מבנה-פורטל בלבד)
  document.querySelectorAll('[data-pvday]').forEach(b => b.onclick = () => {
    _pvDay = b.dataset.pvday;
    // מעבר-יום לא אמור לגרור איתו לקוח מיום אחר לחלון הימני
    if (_selCust !== '__today__' && _dayKey(_dayOf[_selCust]) !== (_pvDay === '__none__' ? 'ללא יום קבוע' : _pvDay)) _selCust = '__today__';
    render(rows);
  });
  /* המעבר חייב להיות דו-כיווני. בגרסה הראשונה היה רק כפתור אחד — מי שלחץ
     "תצוגה קודמת" ננעל עליה, כי הדגל נשמר ב-localStorage ולא הייתה דרך חזרה. */
  const _switchUi = (mode) => { try{ localStorage.setItem('solanShopUi', mode); }catch(e){} location.search = '?ui=' + mode; };
  try { _pvWire(); } catch(e){ console.warn('חיווט מבנה-הפורטל נכשל', e); }
  const _uc = document.getElementById('uiClassic');
  if (_uc) _uc.onclick = () => _switchUi('classic');
  const _up = document.getElementById('uiPortal');
  if (_up) _up.onclick = () => _switchUi('portal');
  /* בחירת-לקוח → מציג את עבודותיו במרכז (בלי טעינה-מחדש מהשרת).
     במבנה-פורטל, בחירת לקוח שנמצא דרך החיפוש מזיזה גם את לשונית-היום אליו —
