      if (!_rr.ok) throw new Error('השחזור נכשל (' + _rr.status + ') — הפריט נשאר בסל, לא אבד');
      await fetch(await _au(`${_FBURL}/customerProofsTrash/${entry.key}.json`), { method: 'DELETE' });
      await loadProofs();
      box.remove(); openTrash();
    } catch (e) { console.error(e); alert('שחזור נכשל: ' + (e.message || e)); b.disabled = false; b.textContent = '↩ שחזר'; }
  });
  el.querySelectorAll('[data-purge]').forEach(b => b.onclick = async () => {
    const entry = sorted.find(x => x.key === b.dataset.purge); if (!entry) return;
    if (!confirm(`למחוק לצמיתות את "${ProofTrash.describe(entry)}"?\nהקובץ יימחק סופית מהאחסון ולא ניתן יהיה לשחזר.`)) return;
    b.disabled = true; b.textContent = 'מוחק…';
    try {
      await _purgeStorage(entry);
      await fetch(await _au(`${_FBURL}/customerProofsTrash/${entry.key}.json`), { method: 'DELETE' });
      box.remove(); openTrash();
    } catch (e) { console.error(e); alert('מחיקה נכשלה: ' + (e.message || e)); b.disabled = false; b.textContent = 'מחק לצמיתות'; }
  });
}

// ── ייצור ריצות מהקובץ המאושר ──
/* ⚠️ 14/08/2026: המתמטיקה חולצה ל-run-split.js (טהור, נבדק ב-Node) — כאן
   נשארו רק העטיפות שנוגעות ב-pdf-lib. מתמטיקה אחת, שני מסלולים:
   "✂ פיצול לריצות" (שכפול-כפולות, כמו תמיד) ו"📚 לפי ריצות" (פיצול-אמיתי). */
const splitToKontresim = (totalPages, fullSheet) => KontresSplit.splitToKontresim(totalPages, fullSheet);

/* עמודי "כפולה" = עמוד-PDF ברוחב כפול, שני עמודי-עיתון מחוברים.
   ⚠️ בקשת-בעלים 17/08/2026: "הכפולות תמיד ירדו בתור בודדים ולא בתור
   כפולות". עד היום המסלול הזה **שכפל** את הכפולה — אותו עמוד-רוחב-כפול
   נכנס פעמיים, פעם לכל מקום בריצה, עם "כפולה" בשם. זה הכריח את קדם-הדפוס
   לחתוך ידנית אחרי ההורדה. עכשיו הכפולה נחתכת כאן, וקטורית (embedPage על
   חצי-קופסה — לא רסטר), בסדר-הקריאה שהמודול קובע.
   מחזיר { doc, labels, spread } — labels[i] = מספר-העמוד. */
async function normalizeSpreads(src) {
  const pages = src.getPages();
  const sizes = pages.map(pg => { const mb = pg.getMediaBox(); return { w: mb.width, h: mb.height }; });
  const plan = KontresSplit.spreadPlan(sizes, { mode: 'split' });
  const labels = plan.entries.map(e => e.label), spread = plan.entries.map(e => e.spread);
  if (!plan.hasSpread) return { doc: src, labels, spread };
  const out = await PDFLib.PDFDocument.create();
  _pdfReadDir(out, (typeof proof!=="undefined"?proof:(typeof p!=="undefined"?p:null)));
  for (const e of plan.entries) {
    if (!e.half) { const [pg] = await out.copyPages(src, [e.src]); out.addPage(pg); continue; }
    const srcPg = pages[e.src], mb = srcPg.getMediaBox();
    const halfW = mb.width / 2;
    const left = e.half === 'left' ? mb.x : mb.x + halfW;
    const emb = await out.embedPage(srcPg, { left: left, bottom: mb.y, right: left + halfW, top: mb.y + mb.height });
    const pg = out.addPage([halfW, mb.height]);
    pg.drawPage(emb, { x: 0, y: 0, width: halfW, height: mb.height });
  }
  return { doc: out, labels, spread };
}

/* ── "📚 לפי ריצות" (14/08/2026, בקשת-בעלים) ─────────────────────────────
   קובץ-PDF **אחד**: כל העיתון בסדר שהדפוס עובד בו — עמודי ריצה 1, אחר-כך
   ריצה 2… — וכל כפולה מפוצלת פיזית לשני עמודים בודדים (embedPage עם
   חצי-קופסה, וקטורי — לא רסטר). התוכנית כולה מ-RunSplit (טהור);
   כיוון-הקריאה מהרשומה (RTL: הימני הוא העמוד הנמוך), לא מנוחש. */
/* ── מקור-הקובץ לחלוקת-ריצות (תוקן 14/08/2026, דיווח-בעלים) ──────────────
   ⚠️ כרטיס-הגיליון רושם את כפתורי-ההורדה **בלי** fileUrl (עבודת-ריצות אין
   לה קובץ-מאוחד) — ולכן "📚 לפי ריצות" הוריד כתובת-ריקה, קיבל את ה-HTML
   של האתר, ונפל על "No PDF header". עכשיו: המקור נפתר מהרשומה —
   קובץ-מלא אם יש; אחרת הריצות ממוזגות לפי סדר-האישור; אחרת קובצי-הפורטל
   לפי מספרי-העמודים. כל קובץ נבדק שהוא באמת PDF (%PDF-) לפני שממשיכים. */
/* שיבוץ-קובץ עקבי עם רשת-העמודים (ביקורת 21/08/2026): slot מפורש גובר,
   אחריו pagesOfName (מבין כפולה, פוסל שנה/גיליון), ולא pageNoOf. */
function _fileSlot(f){
  if (Number(f && f.slot) >= 1) return Number(f.slot);
  const pn = window.ShopIssue && ShopIssue.pagesOfName ? ShopIssue.pagesOfName(f && f.fileName) : null;
  if (pn && pn.nos && pn.nos[0] >= 1) return pn.nos[0];
  return (window.ShopIssue && ShopIssue.pageNoOf) ? (ShopIssue.pageNoOf(f && f.fileName) || 0) : 0;
}
/* ⚠️ **שער-החוברת-השלמה (21/08/2026).** ‏✂ ו-📚 מפצלים את המקור לקונטרסים,
   ופיצול נכון מחייב שהמקור יהיה **העיתון כולו בסדר-קריאה**. כשהמקור היה
   ריצה בודדת (32 עמ' מתוך 48), הפיצול חישב את הפריסה מ-‎getPageCount()‎
   והתייחס אליה כאל עיתון-שלם בן 32 — כך נוצר קובץ בשם "ריצה 1 (עמ 1-32)"
   שהכיל בפועל את עמ' 9-40. הפלט נראה תקין לגמרי; השיבוש התגלה על הלוחות.
   שער שנכשל-סגור: אם הספירה אינה תואמת את ההצהרה — לא מנחשים, אומרים. */
function _assertWholeBooklet(rec, total, what) {
  const declared = Number((rec || {}).declaredPages || (rec || {}).totalPages) || 0;
  if (!declared || !total) return;
  if (total === declared) return;
  /* סטייה של עד עמוד אחד = השלמה לזוגי, לא מקור חלקי. */
  if (Math.abs(total - declared) <= 1) return;
  throw new Error(
    (what || 'הפיצול') + ' דורש את העיתון **כולו** בסדר-קריאה, והמקור שהתקבל מכיל '
    + total + ' עמודים בעוד הגיליון הוצהר כ-' + declared + '.\n\n'
    + 'כנראה נבחרה ריצה בודדת ולא הגיליון כולו. הורידו את הריצה עצמה (⬇ בפריסת-הריצה), '
    + 'או בחרו את הגיליון המלא.');
}

async function _runSourceBytes(t) {
  const rec = (_allRows || []).find(r => r.id === t.jobId) || {};
  const urls = [];
  if (t.fileUrl) urls.push(t.fileUrl);
  else if (t.partId && rec.parts && rec.parts[t.partId] && rec.parts[t.partId].fileUrl)
    urls.push(rec.parts[t.partId].fileUrl);
  else if (rec.fileUrl) urls.push(rec.fileUrl);
  let weave = null;                 // עמודים-בודדים מהפורטל שנשזרים למקומם בין הריצות
  if (!urls.length) {
    // ⚠️ מיזוג-ה-PDF חייב את **אותו** סדר שהמסך מציג ושמספרי-העמודים מניחים
    _partsOrdered(rec)
      .filter(p => p && p.fileUrl)
      .forEach(p => urls.push(p.fileUrl));
    /* ⚠️ 15/08/2026, בקשת-בעלים: עמוד-בודד שהועלה מהפורטל למשבצת-חסרה
       (למשל עמ' 128) חייב להיכנס **למקומו** בעיתון — עד היום הוא נבלע
       בשקט כשהיו ריצות, כי files נקרא רק כשאין parts. מיקום-ההכנסה
       מתוקן לפי המשבצות שעדיין חסרות (pendingPages). */
    if (urls.length && rec.files) {
      /* ⚠️ 21/08/2026 (ביקורת): ‏f.slot (שיבוץ מפורש) גובר על השם, ואחריו
         pagesOfName — המפרק שמבין כפולה/פוסל שנה — ולא pageNoOf (מספר-
         ראשון-מנצח). אותה הכרעה של רשת-העמודים, אחרת ההורדה סותרת אותה. */
      /* ⚠️ 21/08/2026 — **עמוד מוחלף נשזר בנוסף לישן, לא במקומו.** השזירה
         נכתבה (15/08) עבור עמוד-בודד שנחת ב**משבצת חסרה**, אבל היא לקחה
         כל קובץ עם משבצת — כולל משבצת שריצה שהגיעה כבר מספקת. התרחיש:
         הדפוס מסמן 🔁 דרוש-החלפה על עמ׳ 13, הלקוח מעלה גרסה חדשה, והקובץ
         שנבנה מכיל את עמ׳ 13 **פעמיים** וכל עמ׳ 14 והלאה זז במקום אחד —
         בזמן שהמפה ירוקה לגמרי (‏gotRuns=2/2, ‏missing=[], ‏orphans=[]).
         ⚠️ **לא משתיקים ולא מנחשים.** ההחלפה-במקום היא זרימה נפרדת
         (‎[[solan-page-replace-inplace]]‎: הגרסה החדשה מחליפה את הקודמת
         **במבנה**). קובץ שנוחת על משבצת מכוסה הוא מצב לא-עקבי שרק הדפוס
         יכול להכריע — אז אומרים בדיוק מה נמצא ומה לעשות. */
      let _covered = new Set();
      try {
        const _g = window.ShopIssue ? ShopIssue.runGrid(rec) : null;
        if (_g && _g.ok) (_g.runs || []).forEach(r2 => {
          if (r2.got) (r2.pages || []).forEach(pp => _covered.add(Number(pp.no)));
        });
      } catch(e){ console.error('חישוב-כיסוי לשזירה נכשל — לא שוזרים', e); throw e; }
      const _all = Object.values(rec.files).filter(f => f && f.fileUrl)
        .map(f => ({ url: f.fileUrl, slot: _fileSlot(f), name: f.fileName || '' }))
        .filter(f => f.slot >= 1).sort((a, b) => a.slot - b.slot);
      const _clash = _all.filter(f => _covered.has(f.slot));
      if (_clash.length) {
        throw new Error('העמודים הבאים כבר קיימים בתוך ריצה שהגיעה, ולכן שזירתם תיצור עמוד כפול '
          + 'ותזיז את כל העמודים שאחריו:\n\n'
          + _clash.map(f => '• עמ׳ ' + f.slot + (f.name ? ' — ' + f.name : '')).join('\n')
          + '\n\nאם זו החלפת-עמוד: השתמשו ב"החלף עמוד" בתוך הריצה, כדי שהגרסה החדשה '
          + 'תבוא **במקום** הקודמת ולא בנוסף לה.');
      }
      const fe = _all;
      if (fe.length) {
        const pend = new Set();
        (rec.pendingPages || []).forEach(x => pend.add(Number(x)));
        Object.values(rec.parts || {}).forEach(p => ((p || {}).pendingPages || []).forEach(x => pend.add(Number(x))));
        weave = { ents: fe, pend: pend };
      }
    }
    if (!urls.length && rec.files) {
      const _slotOf = f => { const s = _fileSlot(f); return s >= 1 ? s : 9999; };
      Object.values(rec.files).filter(f => f && f.fileUrl)
        .sort((a, b) => _slotOf(a) - _slotOf(b))
        .forEach(f => urls.push(f.fileUrl));
    }
  }
  if (!urls.length) throw new Error('אין קובץ-PDF לעבודה הזו — הקבצים טרם הועלו');
  const bufs = [];
  for (const u of urls) {
    const r = await fetch(u);
    if (!r.ok) throw new Error('הורדת-הקובץ נכשלה (' + r.status + ')');
    const b = await r.arrayBuffer();
    const head = String.fromCharCode.apply(null, new Uint8Array(b.slice(0, 5)));
    if (head !== '%PDF-') throw new Error('הקובץ שהתקבל אינו PDF — ' + head.slice(0, 5));
    bufs.push(b);
  }
  if (bufs.length === 1 && !weave) return bufs[0];
  const out = await PDFLib.PDFDocument.create();
  _pdfReadDir(out, (typeof proof!=="undefined"?proof:(typeof p!=="undefined"?p:null)));
  /* ⚠️ תקרית 19/08/2026 (מידע-העיר 1840): איחוי קובצי-**ריצות** הוא רצף-
     קונטרסים, לא סדר-קריאה — והצרכנים של הפונקציה (✂/📚) מפעילים עליו
     פיצול-קונטרסים. תמורה-כפולה: "ריצה 1" שנוצרה הכילה את עמ' 33-44 של
     ריצה 2, והשיבוש התגלה רק על הלוחות בדפוס. לכן: כשהחלקים הם ריצות —
     האיחוי **משחזר סדר-קריאה** לפי פריסת-הקונטרסים (הלוגיקה הטהורה
     runsToReadingOrder, נכשלת-סגור), ורק אז הצרכנים רשאים לפצל מחדש. */
  const _mergedParts = _partsOrdered(rec).filter(p2 => p2 && p2.fileUrl);
  const _runNos = _mergedParts.map(p2 => window.ShopIssue ? ShopIssue.runNoOfName(p2.name || '') : null);
  if (bufs.length > 1 && _runNos.length === bufs.length && _runNos.every(n => n >= 1)) {
    const docs = [];
    for (const b of bufs) docs.push(await PDFLib.PDFDocument.load(b));
    const total = Number(rec.declaredPages || rec.totalPages) || docs.reduce((s, d) => s + d.getPageCount(), 0);
    const sheet = (window.ShopIssue && ShopIssue.sheetPagesOf) ? ShopIssue.sheetPagesOf(rec).sheet : 0;
    const ro = KontresSplit.runsToReadingOrder(total, sheet,
      _mergedParts.map((p2, i) => ({ run: _runNos[i], count: docs[i].getPageCount() })));
    if (!ro.ok) throw new Error('אי אפשר לאחות את הריצות לסדר-קריאה: ' + ro.reason
      + '. הורידו כל ריצה בנפרד (⬇ בפריסת-הריצה).');
    for (const ent of ro.order) {
      const [pg] = await out.copyPages(docs[ent.part], [ent.idx]);
      out.addPage(pg);
    }
    if (!weave) return (await out.save()).buffer;
  } else {
  /* ⚠️ 21/08/2026 — **הנפילה-לשרשור-גולמי היא בדיוק תקרית 19/08 שוב.**
     כשאחד השמות לא נקרא כמספר-ריצה (‎runNoOfName‎ → null), התנאי למעלה
     נכשל, הקבצים שורשרו כפי-שהם, והצרכנים (✂/📚) פיצלו אותם מחדש —
     תמורה-כפולה שהעמידה 40 מתוך 48 עמודים על הקונטרס הלא-נכון. שרשור
     גולמי מותר רק כשאלה **אינם** קובצי-ריצות; כשהם כן — נכשלים-סגור. */
  if (bufs.length > 1 && _runNos.some(n => n >= 1)) {
    const _bad = _mergedParts.filter((p2, i) => !(_runNos[i] >= 1)).map(p2 => p2.name || '(ללא שם)');
    throw new Error('חלק מהקבצים הם ריצות וחלק לא-מזוהים, ולכן אי אפשר לשחזר סדר-קריאה בבטחה.\n\n'
      + 'לא זוהה מספר-ריצה עבור: ' + _bad.join(' · ') + '\n\n'
      + 'תקנו את שמות-הקבצים (למשל "ריצה 2"), או הורידו כל ריצה בנפרד (⬇ בפריסת-הריצה).');
  }
  for (const b of bufs) {
    const d = await PDFLib.PDFDocument.load(b);
    const pages = await out.copyPages(d, d.getPageIndices());
    pages.forEach(p => out.addPage(p));
  }
  }
  if (weave) {
    const fileSlots = new Set(weave.ents.map(e => e.slot));
    for (const e of weave.ents) {
      const r2 = await fetch(e.url);
      if (!r2.ok) throw new Error('הורדת עמוד-בודד (עמ׳ ' + e.slot + ') נכשלה (' + r2.status + ')');
      const b2 = await r2.arrayBuffer();
      const h2 = String.fromCharCode.apply(null, new Uint8Array(b2.slice(0, 5)));
      if (h2 !== '%PDF-') throw new Error('עמוד-בודד (עמ׳ ' + e.slot + ') אינו PDF');
      const d2 = await PDFLib.PDFDocument.load(b2);
      const cps = await out.copyPages(d2, d2.getPageIndices());
      /* המיקום: עמ׳ N יושב באינדקס N-1 פחות המשבצות שלפניו שעוד חסרות */
      let missBefore = 0;
      weave.pend.forEach(x => { if (x < e.slot && !fileSlots.has(x)) missBefore++; });
      let idx = Math.max(0, Math.min(out.getPageCount(), e.slot - 1 - missBefore));
      cps.forEach(pg => { out.insertPage(idx++, pg); });
    }
  }
  return (await out.save()).buffer;
}

async function generateRunOrderedPdf(proof, fullSheet, btn) {
  const old = btn.textContent;
  /* חיווי-בנייה (בקשת-בעלים 14/08): הכפתור קטן ולפעמים מחוץ למסך —
     באנר צף משקף כל שלב, ונעלם בהצלחה או בכשל. */
  const stage = t2 => { btn.textContent = t2; _buildBanner('📚 לפי ריצות — ' + t2); };
  btn.disabled = true; stage('מוריד קובץ…');
  try {
    const bytes = await _runSourceBytes(proof);
    /* ⚠️ ביקורת-אמינות 21/08/2026: מיזוג עיתון כבד ל-pdf-lib בזיכרון-
       הדפדפן יכול להקריס את הלשונית. אזהרה מעל ~180MB, עם אפשרות-ביטול
       והפניה להורדת-ריצה-בודדת (קלה יותר). */
    if (bytes && bytes.byteLength > 180*1024*1024
        && !confirm('הקובץ המאוחד גדול מאוד (' + Math.round(bytes.byteLength/1048576) + 'MB).\nהמיזוג בדפדפן עלול להיכשל או להקריס את הלשונית.\n\nעדיף להוריד כל ריצה בנפרד (⬇ בפריסת-הריצה). להמשיך בכל זאת?')){
      _buildBanner(false); btn.textContent = old; btn.disabled = false; return;
    }
    stage('מפצל כפולות…');
    const raw = await PDFLib.PDFDocument.load(bytes);
    const pages = raw.getPages();
    const sizes = pages.map(pg => { const mb = pg.getMediaBox(); return { w: mb.width, h: mb.height }; });
    const rec = (_allRows || []).find(r => r.id === proof.jobId) || {};
    const unit = (proof.partId && rec.parts && rec.parts[proof.partId]) || rec;
    const readingDirection = unit.readingDirection || rec.readingDirection || 'rtl';
    const plan = KontresSplit.spreadPlan(sizes, { mode: 'split', readingDirection });
    _assertWholeBooklet(rec, plan.entries.length, 'סידור לפי ריצות (📚)');
    const ro = KontresSplit.runOrderedEntries(plan.entries, fullSheet);

    const out = await PDFLib.PDFDocument.create();
    _pdfReadDir(out, (typeof proof!=="undefined"?proof:(typeof p!=="undefined"?p:null)));
    let done = 0;
    for (const e of ro.order) {
      if ((++done) % 8 === 0) stage(`בונה עמוד ${done}/${ro.order.length}…`);
      if (!e.half) {
        const [pg] = await out.copyPages(raw, [e.src]); out.addPage(pg);
        continue;
      }
      /* חצי-כפולה: חיתוך וקטורי בחצי-קופסה — כמו splitSpreadsPdf בדפדוף */
      const srcPg = raw.getPage(e.src);
      const mb = srcPg.getMediaBox();
      const halfW = mb.width / 2;
      const left = e.half === 'left' ? mb.x : mb.x + halfW;
      const emb = await out.embedPage(srcPg, { left: left, bottom: mb.y, right: left + halfW, top: mb.y + mb.height });
      const pg = out.addPage([halfW, mb.height]);
      pg.drawPage(emb, { x: 0, y: 0, width: halfW, height: mb.height });
    }
    const safe = s => String(s || '').replace(/[\\/:*?"<>|]/g, '_').trim();
    const nSplit = ro.order.filter(o => o.spread).length / 2;
    downloadBlob(new Blob([await out.save()], { type: 'application/pdf' }),
      `${safe(proof.title || 'חוברת')} — לפי ריצות (${ro.runs.length})${nSplit ? ` · ${nSplit} כפולות פוצלו` : ''}.pdf`);
    _buildBanner('✓ הקובץ ירד לתיקיית-ההורדות');
    setTimeout(() => _buildBanner(false), 3500);
    /* אותו סימון "הריצות הורדו" כמו במסלול-הפיצול — זו אותה פעולה עסקית */
    try {
      if (proof.jobId) {
        const p2 = proof.partId ? `customerProofs/${proof.jobId}/parts/${proof.partId}` : `customerProofs/${proof.jobId}`;
        /* ⚠️ ביקורת 21/08/2026: חותמת-מידע לא-חוסמת — כשל אינו מפיל את
           ההורדה (הקובץ כבר ביד), אבל דחיית-ההבטחה נלכדת ונרשמת. */
        _au(`${_FBURL}/${p2}.json`)
          .then(u => fetch(u, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ runsDownloadedAt: Date.now() }) }))
          .then(r => { if (!r.ok) console.warn('סימון runsDownloadedAt נדחה', r.status); })
          .catch(e => console.warn('סימון runsDownloadedAt נכשל (לא חוסם)', e));
      }
    } catch(e){ console.warn('סימון runsDownloadedAt נכשל (לא חוסם)', e); }
    btn.textContent = '✓ הורד';
    setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 2500);
  } catch (e) {
    _buildBanner(false);
    console.error(e); alert('שגיאה בהורדה לפי ריצות: ' + e.message);
    btn.textContent = old; btn.disabled = false;
  }
}

async function generateRuns(proof, fullSheet, btn) {
  const old = btn.textContent;
  const stage = t2 => { btn.textContent = t2; _buildBanner('✂ פיצול לריצות — ' + t2); };
  btn.disabled = true; stage('מוריד קובץ…');
  try {
    /* ⚠️ אותו פותר-מקור של "📚 לפי ריצות" — גם כאן ה-fileUrl יכול להיות
       ריק (כרטיס-גיליון של עבודת-ריצות), ואותה נפילה בדיוק. */
    const bytes = await _runSourceBytes(proof);
    /* אזהרת-גודל (ביקורת 21/08/2026) — מיזוג כבד עלול להקריס את הלשונית. */
    if (bytes && bytes.byteLength > 180*1024*1024
        && !confirm('הקובץ המאוחד גדול מאוד (' + Math.round(bytes.byteLength/1048576) + 'MB).\nהמיזוג בדפדפן עלול להיכשל או להקריס את הלשונית.\n\nעדיף להוריד כל ריצה בנפרד (⬇ בפריסת-הריצה). להמשיך בכל זאת?')){
      _buildBanner(false); btn.textContent = old; btn.disabled = false; return;
    }
    stage('מפצל…');
    const raw = await PDFLib.PDFDocument.load(bytes);
    const norm = await normalizeSpreads(raw);   // כפולה → אותו קובץ פעמיים + "כפולה" בשם
    const src = norm.doc;
    const total = src.getPageCount();
    _assertWholeBooklet((_allRows || []).find(r => r.id === proof.jobId) || {}, total, 'פיצול לריצות (✂)');
    const runs = splitToKontresim(total, fullSheet);

    // ── כל ריצה = קובץ-PDF אחד (לגרירה ישירה לאפוגי), לא עמודים בודדים בתיקייה ──
    //    סדר-העמודים וסט-העמודים זהים לקודם; רק האריזה השתנתה (מיזוג במקום פיצול).
    // שם-הבסיס מגיע כבר מוכן מ-jobName (שם-עיתון + גיליון [+ ריצה]) — מקור-אמת יחיד
    const safe = s => String(s || '').replace(/[\\/:*?"<>|]/g, '_').trim();
    const baseName = safe(proof.title || 'חוברת');
    const built = [];
    for (const run of runs) {
      stage(`בונה ריצה ${run.num}/${runs.length}…`);
      const out = await PDFLib.PDFDocument.create();
      _pdfReadDir(out, (typeof proof!=="undefined"?proof:(typeof p!=="undefined"?p:null)));
      const idxs = run.pages.filter(sp => sp <= total).map(sp => sp - 1);
      if (!idxs.length) continue;
      const copied = await out.copyPages(src, idxs);      // קריאה-אחת → משאבים משותפים לא משוכפלים
      copied.forEach(pg => out.addPage(pg));
      built.push({ num: run.num, label: run.label, bytes: await out.save() });
    }
    if (!built.length) throw new Error('לא נוצרו עמודים');
    if (built.length === 1) {                              // ריצה אחת → הורדה ישירה, בלי ZIP
      const r = built[0];
      downloadBlob(new Blob([r.bytes], { type: 'application/pdf' }), `${baseName} — ריצה ${r.num} (עמ ${r.label}).pdf`);
    } else {
      stage('בונה ZIP…');
      const zip = new JSZip();
      built.forEach(r => zip.file(`${baseName} — ריצה ${r.num} (עמ ${r.label}).pdf`, r.bytes));   // שטוח: קובץ לכל ריצה
      downloadBlob(await zip.generateAsync({ type: 'blob' }), `${baseName} — ${built.length} ריצות.zip`);
    }
    _buildBanner('✓ הקובץ ירד לתיקיית-ההורדות');
    setTimeout(() => _buildBanner(false), 3500);
    // סימון "הריצות הורדו" — מכבה את התראת האישור באפליקציה
    try {
      if (proof.jobId) {
        const p2 = proof.partId ? `customerProofs/${proof.jobId}/parts/${proof.partId}` : `customerProofs/${proof.jobId}`;
        /* ⚠️ ביקורת 21/08/2026: חותמת-מידע לא-חוסמת — כשל אינו מפיל את
           ההורדה (הקובץ כבר ביד), אבל דחיית-ההבטחה נלכדת ונרשמת. */
        _au(`${_FBURL}/${p2}.json`)
          .then(u => fetch(u, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ runsDownloadedAt: Date.now() }) }))
          .then(r => { if (!r.ok) console.warn('סימון runsDownloadedAt נדחה', r.status); })
          .catch(e => console.warn('סימון runsDownloadedAt נכשל (לא חוסם)', e));
      }
    } catch(e){ console.warn('סימון runsDownloadedAt נכשל (לא חוסם)', e); }
    btn.textContent = '✓ הורד';
    setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 2500);
  } catch (e) {
    _buildBanner(false);
    console.error(e); alert('שגיאה בייצור ריצות: ' + e.message);
    btn.textContent = old; btn.disabled = false;
  }
}

/* שם העבודה להורדה — מקור-אמת יחיד לכל כפתורי-ההורדה בדף (ולשם-הבסיס של הריצות):
   שם-הלקוח · שם-העבודה · גיליון N · שם-הריצה. שם-הלקוח נכנס כי בפועל כותרות
   העבודה הן לעיתים "גיליון 275" בלבד — ובתיקיית-ההורדות אי-אפשר לדעת של מי.
   אם הכותרת כבר מכילה את שם-הלקוח, לא מכפילים. השדות issue/issueNo/edition הם
   אותו נתון בשמות שונים לפי מקור-העבודה, ולכן כולם נבדקים. */
/* החלטת בית-הדפוס על בקשת החלפת-עמודים. אישור פותח ללקוח חלון-עריכה של 48 שעות;
   דחייה/סגירה נועלת מיד. הכתיבה היא לצומת הבקשה בלבד — הקובץ שאושר לא נוגע. */
async function _psDecide(key, approve, btn){
  const [jobId, target] = String(key).split('|');
  const job = (_allRows || []).find(x => String(x.id) === String(jobId));
  const req = ((job && job.changeRequests) || {})[target];
  if (!req) { alert('הבקשה לא נמצאה — רעננו את המסך.'); return; }
  let note = '';
  if (!approve) {
    if (req.status === 'approved') { if (!confirm('לסגור את חלון העריכה של הלקוח?')) return; }
    else { note = prompt('סיבת הדחייה (תוצג ללקוח):', 'הקובץ כבר בהכנה לדפוס') || ''; if (note === null) return; }
  } else if (!confirm('לאשר ללקוח להחליף/למחוק עמודים? חלון העריכה ייפתח ל-48 שעות.')) return;
  const who = 'בית הדפוס';
  const next = approve ? PageSwap.approve(req, { at: Date.now(), by: who })
                       : PageSwap.reject(req, { at: Date.now(), by: who, note: note });
  btn.disabled = true; btn.textContent = '…';
  try {
    /* ⚠️ ביקורת 21/08/2026, כלל-1: r.ok — אישור/דחייה שנדחו ב-403 חייבים
       להיאמר, אחרת חלון-העריכה של 48ש' לא נפתח/נסגר בפועל והדפוס בטוח שכן. */
    const r = await fetch(await _au(`${_FBURL}/${PageSwap.requestPath(jobId, target)}.json`),
      { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(next) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    await loadProofs();
  } catch(e){ alert('העדכון נכשל: ' + (e.message||e)); btn.disabled = false; btn.textContent = approve ? '✔ אשר' : '✖ דחה'; }
}

/* ── עדכון הלקוח שהעבודה מוכנה (בקשת-משתמש 2026-07-30) ─────────────────────
   בסימון עבודה כהושלמה, שואלים את המנהל/קדם-דפוס אם לעדכן את הלקוח. "כן" מסמן
   readyNotice על הרשומה — הפורטל של הלקוח מציג "✅ העבודה מוכנה". בנוסף אפשר
   להודיע מיד בוואטסאפ/מייל (הדרך הנוספת מעבר לפורטל). */
function _waNorm(ph){ var d=String(ph||'').replace(/\D/g,''); if(!d) return ''; if(d.indexOf('972')===0) return d; if(d[0]==='0') return '972'+d.slice(1); return d; }
async function _readyPatch(id, method){
  var who = 'בית הדפוס';
  /* ⚠️ ביקורת 21/08/2026, כלל-1: r.ok — בלעדיו "מוכן" נכתב לכאורה על 403. */
  var r = await fetch(await _au(`${_FBURL}/customerProofs/${id}.json`), { method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ readyNotice: { at: Date.now(), by: who, method: method||'portal' } }) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
}
function _readyMsg(p){

  document.body.appendChild(ov);

  /* ⚠️ ביקורת 21/08/2026: כשל-כתיבה נאמר, לא נבלע ב-catch ריק. */
  var done=function(method){ _readyPatch(p.id, method).then(loadProofs).catch(function(e){ console.error('סימון-מוכן נכשל', e); msg('⚠️ העדכון "מוכן" לא נשמר — נסו שוב'); }); };
  document.getElementById('nrPortal').onclick=function(){ done('portal'); close(); msg('✓ הלקוח יראה בפורטל שהעבודה מוכנה'); };
  document.getElementById('nrWa').onclick=function(){
    done('whatsapp');
    var ph = prompt('מספר טלפון של הלקוח (וואטסאפ):', p.phone || p.customerPhone || '');
    if (ph){ var intl=_waNorm(ph); window.open('https://wa.me/'+intl+'?text='+encodeURIComponent(_readyMsg(p)), '_blank'); }

    close();

function jobName(p, partName) {
  p = p || {};
  const cust = String(p.customer || '').trim(), title = String(p.title || '').trim();
  const issue = p.issue || p.issueNo || p.edition || '';
  const head = title ? ((cust && title.indexOf(cust) < 0) ? (cust + ' — ' + title) : title)
                     : (cust || 'עיתון');
  /* ⚠️ הכותרת האמיתית היא לעיתים "עיתון השבוע — גיליון 278", ואז הוספת
     הגיליון שוב נתנה "… — גיליון 278 — גיליון 278 — ריצה 1". מדלגים כשהוא
     כבר שם — אותו היגיון בדיוק כמו השמטת שם-הלקוח מהכותרת למעלה. */
  const issueTag = issue ? ('גיליון ' + issue) : '';
  const issuePart = (issueTag && head.indexOf(issueTag) < 0) ? issueTag : '';
  return [head, issuePart, partName || ''].filter(Boolean).join(' — ');
}
/* שם-קובץ להורדת **ריצה** — בקשת-בעלים 17/08/2026: "שבועון אלעד R-1 גיליון 278".
   ⚠️ בכוונה נפרד מ-jobName: שם-העבודה משמש בהרבה מסלולים ונעול בבדיקות, וכאן
   נדרש דווקא סימון-הריצה בפורמט R-N — זה שבו הדפוס עובד מול אפוגי (ראה
   מוסכמת-השמות R-1/R-2 בפרופרים). "ריצה 1" → "R-1"; שם שאינו ממוספר נשמר
   כמו-שהוא במקום להמציא מספר. */
/* ── כיוון-הדפדוף בקובץ שיורד למחשב (דיווח-בעלים 19/08/2026) ─────────────
   ⚠️ **התסמין:** "הורדתי את העיתון ודיפדפתי ב-PDF במחשב — הכיוון היה
   משמאל לימין ולא מימין לשמאל". זו לא בחירה שגויה של הלקוח: כיוון-הדפדוף
   בקורא-PDF נקבע משדה בקטלוג הקובץ — ‎/ViewerPreferences /Direction /R2L‎ —
   ואנחנו לא כתבנו אותו **בשום מקום**. ‏readingDirection שנשמר על העבודה
   השפיע רק על הדפדוף שלנו במסך, לא על הקובץ עצמו.
   ⚠️ ברירת-המחדל היא R2L: הלקוחות כאן הם עיתונים בעברית. עבודה שסומנה
   במפורש ‎ltr‎ מקבלת L2R.
   ⚠️ אינו זורק: קובץ שיורד בלי הכיוון עדיף על הורדה שנכשלת. */
function _pdfReadDir(out, rec){
  try {
    var dir = ((rec && rec.readingDirection) || "rtl").toLowerCase();
    var RD = PDFLib.ReadingDirection;
    if (!RD || !out || !out.catalog) return;
    out.catalog.getOrCreateViewerPreferences()
       .setReadingDirection(dir === "ltr" ? RD.L2R : RD.R2L);
  } catch(e){ console.warn("קביעת כיוון-הדפדוף בקובץ נכשלה (הקובץ תקין)", (e&&e.message)||e); }
}
/* ── רצף מספרי-העמוד של ריצה, לפי פריסת-הקונטרסים ────────────────────────
   מקור-אמת אחד לשם-הקובץ, לתוויות שבתוכו ולפריסה על המסך — אותו
   ‎ShopIssue.layoutOf‎ שהמסך כבר מציג לפיו.
   ⚠️ **נכשל-סגור**: בלי פריסה ודאית מוחזר null, והקובץ יורד בלי תוויות
   כמו קודם. מספור **שגוי** בקובץ-דפוס גרוע ממספור חסר — הוא עמוד
   שיודפס במקום הלא-נכון. אין כאן ניחוש-רציף. */
function _runSeqFor(p, partName) {
  try {
    if (!window.ShopIssue || !ShopIssue.layoutOf || !ShopIssue.runNoOfName) return null;
    const n = ShopIssue.runNoOfName(partName);
    if (!(n >= 1)) return null;
    const run = (ShopIssue.layoutOf(p) || []).find(L => L.num === n);
    return (run && run.seq && run.seq.length) ? run.seq : null;
  } catch (e) { console.warn('רצף-הריצה לא נגזר — הקובץ ירד בלי תוויות', e); return null; }
}
function runFileName(p, partName) {
  p = p || {};
  const cust = String(p.customer || '').trim();
  const issue = p.issue || p.issueNo || p.edition || '';
  const m = String(partName || '').match(/(\d+)/);
  const run = m ? ('R-' + m[1]) : String(partName || '').trim();
  const head = cust || String(p.title || '').trim() || 'עיתון';
  /* ⚠️ **הטווח בשם** (אותה בקשה של 23/08, שגם היא נכנסה רק לפורטל):
     בתיקיית-ההורדות של הדפוס יושבות כמה ריצות של אותו גיליון, ו-"R-3"
     לבדו אינו אומר אילו עמודים בפנים. ‏spanLabel הוא אותו ניסוח שהמסך
     מציג בפריסה — שם, מסך ותוויות אומרים דבר אחד. */
  let span = '';
  try {
    const seq = _runSeqFor(p, partName);
    if (seq && window.PageLabels) span = PageLabels.spanLabel(seq);
  } catch (e) {}
  return [head, run, span ? ('עמ ' + span) : '', issue ? ('גיליון ' + issue) : ''].filter(Boolean).join(' ');
}
/* שם-הקובץ בהורדה מחלון-ההגדלה. אריח-ריצה → שם-הריצה (R-N); עמוד בודד
   מתוך העיתון המלא → שם-העבודה + מספר-העמוד, כדי שבתיקיית-ההורדות יהיה
   ברור מה ירד. */
function _plDlName(p, t) {
  t = t || {};
  const base = t.partId ? runFileName(p, t.runName || t.label) : jobName(p);
  const page = (!t.partId && t.pageNo) ? (' — עמוד ' + t.pageNo) : '';
  return String(base + page).replace(/[\\/:*?"<>|]/g, '_') + '.pdf';
}
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }
function downloadBlob(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
// מציג את הקישור (תמיד ניתן להעתיק, גם בתוך iframe) וגם מנסה להעתיק אוטומטית.
/* ═══ קישור קצר ללקוח (בקשת-בעלים 2026-07-31) ═══
   הקישורים הארוכים (מזהה 36 תווים + טוקן) נראים מלחיצים בוואטסאפ. כאן יוצרים
   קוד קצר, שומרים אותו ב-Firebase, ומשתפים כתובת קצרה שמפנה אליו (s.html).
   הכתובת הארוכה נשמרת ומוצגת כגיבוי — וקישורים שכבר נשלחו ממשיכים לעבוד. */
async function _makeShortLink(url, meta){
  if (!window.ShortLink) return '';
  try {
    var code = ShortLink.newCode();
    var rec = ShortLink.record(url, Object.assign({ at: Date.now() }, meta || {}));
    var r = await fetch(await _au(`${_FBURL}/${ShortLink.nodePath(code)}.json`),
      { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(rec) });
    if (!r.ok) return '';
    return ShortLink.shortUrl(location.href, code);
  } catch(e){ console.warn('short link failed', e); return ''; }
}
async function shareLink(url, meta) {
  var short = await _makeShortLink(url, meta);
  var send = short || url;                        // נכשל? שולחים את הארוך — לא נתקעים
  try { await navigator.clipboard.writeText(send); } catch (e) {}
  prompt(short ? 'קישור קצר ללקוח — הועתק, אפשר לשלוח:' : 'קישור ללקוח — העתק ושלח:', send);
}

async function copyText(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch (e) {
    try { const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove(); } catch (e2) {}
  }
  const t = btn.textContent; btn.textContent = ok ? '✓' : '⚠️';
  setTimeout(() => btn.textContent = t, 1200);
}

// יצירת הזמנה ללקוח — רשומה ריקה + קישור להעלאה
$('invite').onclick = async () => {
  const customer = prompt('שם הלקוח (עיתון):');
  if (!customer || !customer.trim()) return;
  const title = prompt('שם העבודה (אופציונלי):') || '';
  // גודל נדרש לעמוד (מ"מ) — הלקוח יקבל אזהרה אם יעלה בגודל אחר.
  // גדלי העיתונים הרגילים שלנו מוצעים כבחירה מהירה לפי מספר; אפשר גם להקליד גודל מותאם.
  const PRESETS = [
    { label: 'עיתון רגיל 16.5×24 ס"מ', w: 165, h: 240 },
    { label: '24×33 ס"מ',             w: 240, h: 330 },
    { label: 'A4 (21×29.7)',          w: 210, h: 297 },
    { label: 'A5 (14.8×21)',          w: 148, h: 210 },
    { label: 'A3 (29.7×42)',          w: 297, h: 420 },

    + PRESETS.map((p,i)=>`${i+1}. ${p.label}  (${p.w}×${p.h} מ"מ)`).join('\n');
  /* גיליון קודם של אותו לקוח = ברירת-המחדל. באג שתוקן (2026-07-30): גיליון חדש
     שנוצר בלי גודל גרם ל-proof-client לנחש 16 עמ' בגיליון, ושבועון 16.5×24 עם
     96 עמ' התחלק ל-6 ריצות של 16 במקום 3 של 32. */
  const prevOf = (function(){
    try {
      const mine = _allRows.filter(r => r && String(r.customer||'').trim() === customer.trim()
                                        && (+r.reqW > 0) && (+r.reqH > 0))
                           .sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
      return mine[0] || null;
    } catch(e){ return null; }
  })();
  const prevIdx = prevOf ? PRESETS.findIndex(p => p.w === +prevOf.reqW && p.h === +prevOf.reqH) : -1;
  const dflt = prevOf ? (prevIdx >= 0 ? String(prevIdx + 1) : (prevOf.reqW + 'x' + prevOf.reqH)) : '1';
  const sizeRaw = (prompt(menu + (prevOf ? ('\n\nבגיליון הקודם של ' + customer.trim() + ': '
                    + prevOf.reqW + '×' + prevOf.reqH + ' מ"מ (מוצע כברירת-מחדל)') : ''), dflt) || '').trim();
  let reqW = 0, reqH = 0;
  const pick = /^\d{1,2}$/.test(sizeRaw) ? PRESETS[+sizeRaw - 1] : null;
  if (pick) { reqW = pick.w; reqH = pick.h; }
  else {
    const m = sizeRaw.replace(',', '.').match(/(\d+(?:\.\d+)?)\s*[xX*×]\s*(\d+(?:\.\d+)?)/);
    if (m) { reqW = +m[1]; reqH = +m[2]; }
  }
  // ס"מ→מ"מ: מי שהקליד "16.5x24" התכוון ל-165×240
  if (reqW > 0 && reqW < 60) reqW = Math.round(reqW * 10);
  if (reqH > 0 && reqH < 60) reqH = Math.round(reqH * 10);
  if (!reqW || !reqH){
    if (!confirm('לא הוגדר גודל עמוד.\n\nבלי גודל, חלוקת הריצות בצד הלקוח לא תיקבע אוטומטית\n'
               + '(הלקוח יידרש לבחור כמה עמודים בגיליון).\n\nלהמשיך בלי גודל?')) return;
  }
  const id = crypto.randomUUID?.() || (Date.now().toString(36) + Math.random().toString(36).slice(2));
  msg('יוצר…');
  /* ⚠️ כיוון-הדפדוף **מועתק** לעבודה בזמן היצירה (snapshot), ולא נקרא דינמית
     מרשומת-הלקוח בכל פתיחה — כדי ששינוי עתידי של ברירת-המחדל של הלקוח לא
     ישנה עבודות קיימות. כשל-קריאה/לקוח לא-מוכר → 'rtl' (ברירת-המחדל
     ההיסטורית); לעולם לא חוסם יצירת-עבודה. */
  const readingDirection = await _defaultDirFor(customer.trim());
  await fetch(await _au(`${_FBURL}/customerProofs/${id}.json`), {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: 'awaiting_upload', customer: customer.trim(), title: title.trim(), reqW, reqH, readingDirection, createdAt: Date.now() }),
  });
  /* תמצית-כרטיס → פורטל (שלב א', מפרט-בעלים 16/08/2026): אם יש כרטיס-עבודה
     פעיל בשם תואם (מהיומן/מהמסך), מצרפים cardSummary לרשומה החדשה — כך
     שהפורטל יוכל להציג ריצות מוכנות בלי לשאול את הלקוח עמודים/גודל. כתיבה
     חד-כיוונית בלבד; לא נוגעים ב-reqW/reqH העליונים שהעובד הזין למעלה. */
  const _actCard = _activeCardsByCust && _activeCardsByCust[_normName(customer.trim())];
  if (_actCard) {
    const _mm = _parseSize(_actCard.size);
    const _cs = {
      cardId: _actCard.id,
      pages: parseInt(_actCard.pages, 10) || null,
      runs: (_actCard.runs || []).map(r => ({ num: r.num, pages: r.pages, pageRange: r.pageRange || '' })),
      // standard=false → פיצול-ידני/שארית-מפוצלת בכרטיס; proof-client.html אינו יודע
      // לשחזר את זה מ-total+fullSheet בלבד, ולכן לא מדלגים אצל הלקוח על שאלת-הריצות.
      standard: !(_actCard.manualSplit || _actCard.splitRemainder),
      source: 'card', updatedAt: Date.now(),
    };
    if (_mm) { _cs.reqW = _mm.w; _cs.reqH = _mm.h; }
    const _csPatch = { cardSummary: _cs };
    // ממלאים reqW/reqH/totalPages ברמה-העליונה רק אם עוד ריקים — לא דורסים מה שהעובד הזין למעלה
    if (_mm && !(reqW > 0 && reqH > 0)) { _csPatch.reqW = _mm.w; _csPatch.reqH = _mm.h; }
    if (_cs.pages) { _csPatch.totalPages = _cs.pages; }
    const _csOk = await fetch(await _au(`${_FBURL}/customerProofs/${id}.json`), {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(_csPatch),
    }).then(r => r.ok).catch(() => false);
    if (!_csOk) console.error('cardSummary: כתיבה נכשלה ביצירת-עבודה', id, customer.trim());
  }
  const base = location.href.replace(/[^/]+(\?.*)?$/, '');
  const link = `${base}proof-client.html?id=${id}`;
  await loadProofs();
  prompt('הקישור ללקוח (העתק ושלח):', link);
};

/* ═══════════ עריכת פרטי גיליון · סגירה להעלאה · העברת ריצה ═══════════
   באטץ' בקשות-בעלים 2026-07-30. הרקע: לקוח העלה את ריצת השבוע לתוך גיליון
   שכבר הושלם. שלושת הכלים כאן פותרים את מה שקרה ואת מה שיקרה שוב:
     ✏️ הדפוס מגדיר את הפרטים והגודל — הלקוח רק מעלה קבצים.
     🔒 גיליון שנסגר/הושלם לא מקבל קבצים (נאכף גם בצד הלקוח).
     ⇄ ריצה שנכנסה לגיליון הלא-נכון מועברת ליעד הנכון, עם תיעוד.            */
const PROOF_PRESETS = [
  { label: 'עיתון רגיל 16.5×24 ס"מ', w: 165, h: 240 },
  { label: '24×33 ס"מ',             w: 240, h: 330 },
  { label: 'A4 (21×29.7)',          w: 210, h: 297 },
  { label: 'A5 (14.8×21)',          w: 148, h: 210 },
  { label: 'A3 (29.7×42)',          w: 297, h: 420 },
  { label: 'טאבלויד 28×40 ס"מ',     w: 280, h: 400 },
];
// "1" / "165x240" / "16.5x24" → {w,h} במ"מ. ריק → null (בלי שינוי)
function _parseSize(raw){
  const s = String(raw == null ? '' : raw).trim();
  if (!s) return null;
  if (/^\d{1,2}$/.test(s) && PROOF_PRESETS[+s - 1]) { const p = PROOF_PRESETS[+s - 1]; return { w: p.w, h: p.h }; }
  const m = s.replace(',', '.').match(/(\d+(?:\.\d+)?)\s*[xX*×]\s*(\d+(?:\.\d+)?)/);
  if (!m) return null;
  let w = +m[1], h = +m[2];
  if (w > 0 && w < 60) w = Math.round(w * 10);      // ס"מ → מ"מ
  if (h > 0 && h < 60) h = Math.round(h * 10);
  return (w > 0 && h > 0) ? { w, h } : null;
}
async function editProof(id){
  const p = _allRows.find(r => r.id === id);
  if (!p) return;
  const cust = prompt('שם הלקוח (עיתון):', p.customer || '');
  if (cust === null) return;
  const title = prompt('שם העבודה / גיליון:', p.title || '');
  if (title === null) return;
  const cur = (+p.reqW > 0 && +p.reqH > 0) ? (p.reqW + 'x' + p.reqH) : '';
  const sizeRaw = prompt('גודל עמוד נדרש (מ"מ או ס"מ) — הלקוח יקבל אזהרה אם יעלה בגודל אחר:\n\n'
    + PROOF_PRESETS.map((x,i)=>`${i+1}. ${x.label}  (${x.w}×${x.h})`).join('\n')
    + '\n\nאפשר גם להקליד "165x240" או "16.5x24". השאירו ריק כדי לא לשנות.', cur);
  if (sizeRaw === null) return;
  const patch = {};
  if (cust.trim() && cust.trim() !== (p.customer||'')) patch.customer = cust.trim();
  if (title.trim() !== (p.title||'')) patch.title = title.trim();
  const sz = _parseSize(sizeRaw);
  if (sz) { patch.reqW = sz.w; patch.reqH = sz.h; }
  else if (String(sizeRaw).trim() && !sz) { alert('הגודל לא הובן — לא שונה.'); }
  if (!Object.keys(patch).length) { msg('לא בוצע שינוי'); return; }
  msg('שומר…');
  try {
    /* ⚠️ ביקורת 21/08/2026, כלל-1: r.ok — בלעדיו "עודכן · גודל" מדווח על 403. */
    const r = await fetch(await _au(`${_FBURL}/customerProofs/${id}.json`),
      { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    await loadProofs();
    msg('✓ הפרטים עודכנו' + (sz ? (' · גודל ' + sz.w + '×' + sz.h) : ''));
  } catch(e){ alert('העדכון נכשל: ' + (e.message||e)); }
}
async function closeProof(id, isClosed){

    const r = await fetch(await _au(`${_FBURL}/customerProofs/${id}.json`),

async function moveRun(jobId, partId, btn){
  // בלי return שקט: אם משהו לא נמצא — אומרים מה
  const from = _allRows.find(r => String(r.id) === String(jobId));
  if (!from) { alert('הגיליון לא נמצא ברשימה. רעננו את הדף ונסו שוב.'); return; }
  if (!from.parts || !from.parts[partId]) { alert('הריצה לא נמצאה בגיליון הזה. רעננו את הדף ונסו שוב.'); return; }
  const part = from.parts[partId];
  // יעדים אפשריים: גיליונות של אותו לקוח שפתוחים להעלאה, החדש קודם
  const cands = _allRows.filter(r => r && r.id !== jobId
      && String(r.customer||'') === String(from.customer||'')
      && !(window.ProofGuard && ProofGuard.isClosed(r)))
    .sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  if (!cands.length) { alert('אין גיליון פתוח אחר של "' + (from.customer||'') + '" להעביר אליו.\n'
    + 'צרו גיליון חדש (➕ הזמנה ללקוח) ואז העבירו.'); return; }
  const menu = 'להעביר את "' + (part.name || partId) + '" לאיזה גיליון?\n\n'
    + cands.map((c,i)=>`${i+1}. ${c.title || '(ללא שם)'} — נוצר ${_fmtDate(c.createdAt)}${c.parts?(' · '+Object.keys(c.parts).length+' ריצות'):''}`).join('\n')
    + '\n\nהקלידו מספר, או בטלו.';
  const pickRaw = prompt(menu, '1');
  if (pickRaw === null) return;
  const to = cands[(parseInt(pickRaw, 10) || 0) - 1];
  if (!to) { alert('בחירה לא תקינה.'); return; }
  const plan = window.ProofGuard
    ? ProofGuard.planMoveRun(from, to, partId, { now: Date.now(), by: 'דפוס', allowStale: true })
    : { ok: false, errors: ['NO_GUARD'] };
  if (!plan.ok) { alert('לא ניתן להעביר: ' + plan.errors.join(', ')); return; }
  if (!confirm('להעביר את "' + (part.name || partId) + '"\nמ: ' + (from.title||from.id)
    + '\nל: ' + (to.title||to.id) + ' ?\n\nהקובץ עצמו לא זז — רק השיוך.')) return;
  const old = btn.textContent; btn.disabled = true; btn.textContent = 'מעביר…';
  try {
    // קודם כותבים ביעד, ורק אחרי שהצליח מוחקים במקור — כדי שריצה לא תיעלם באמצע
    /* ⚠️ ביקורת 21/08/2026, כלל-1: r.ok על **שני** השלבים. בלי בדיקת
       הכתיבה-ליעד, DELETE-המקור מוחק את הריצה גם כשהיעד נדחה ב-403 —
       הריצה נעלמת משני הגיליונות (אובדן-נתונים). */
    const rTo = await fetch(await _au(`${_FBURL}/customerProofs/${to.id}/${plan.toPath}.json`),
      { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(plan.part) });
    if (!rTo.ok) throw new Error('הכתיבה ליעד נכשלה (' + rTo.status + ') — הריצה נשארה במקומה');
    const rDel = await fetch(await _au(`${_FBURL}/customerProofs/${jobId}/${plan.fromPath}.json`),
      { method: 'DELETE' });
    if (!rDel.ok) throw new Error('הריצה הועתקה ליעד אך לא הוסרה מהמקור (' + rDel.status + ') — היא מופיעה כעת בשני הגיליונות, הסירו ידנית מהישן');
    await loadProofs();
    msg('✓ הריצה הועברה ל"' + (to.title || to.id) + '"');
  } catch(e){
    btn.disabled = false; btn.textContent = old;
    alert('ההעברה נכשלה: ' + (e.message||e) + '\nבדקו אם הריצה מופיעה בשני הגיליונות.');
  }
}

/* ── 🧹 ניקוי-אחסון (בקשת-בעלים 15/08/2026) ───────────────────────────────
   המחיקה עצמה ב-Function (חוקי-Storage חוסמים delete מהדפדפן, בכוונה);
   כאן רק: רשימת-מועמדים → אישור-בעלים מפורש עם שמות וגדלים → מחיקה.
   רצפת-30-הימים נאכפת בשרת — הקליינט אינו יכול להוריד אותה. */
async function _fnCall(name, body){
  const t = await _fbAuthToken();
  if (!t) throw new Error('אין חיבור מאומת');
  const r = await fetch('https://europe-west1-solan-printing.cloudfunctions.net/' + name, {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + t },
    body: JSON.stringify({ data: body || {} }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error && j.error.message) || ('הקריאה נכשלה (' + r.status + ')'));
  return j.result;
}
const _fmtGB = (b) => b >= 1024*1024*1024 ? (b/(1024*1024*1024)).toFixed(2) + ' GB'
                    : b >= 1024*1024 ? (b/(1024*1024)).toFixed(1) + ' MB' : Math.round(b/1024) + ' KB';
async function _storageCleanup(scope){
  /* שתי משפחות (19/08/2026): פרופרי-לקוחות, ופרופרי כרטיסי-עבודה שלא
     היו בשדה-הראייה של הכלי עד היום ותופסים בפועל יותר מהם. */
  const isCards = scope === 'cards';
  const what = isCards ? 'כרטיסי-עבודה שהסתיימו' : 'עבודות-לקוח שהושלמו';
  const v = prompt('למחוק קבצים של ' + what + ' לפני כמה ימים?\n(מינימום 30 — נאכף גם בשרת; הרשומות והיסטוריית-העבודה נשארות)', '60');
  if (v === null) return;
  const days = parseInt(v, 10);
  if (!isFinite(days) || days < 30){ alert('מינימום 30 יום.'); return; }
  const b = $('cleanupBtn'); b.disabled = true; b.textContent = '🧹 בודק…';
  try {
    const res = await _fnCall('storageCleanup', { days: days, scope: scope || 'proofs' });
    const cands = (res && res.candidates) || [];
    if (!cands.length){ alert('אין ' + what + ' לפני ' + days + '+ ימים עם קבצים לניקוי.'); return; }
    const total = cands.reduce((s, c) => s + (c.bytes || 0), 0);
    const nl = String.fromCharCode(10);
    const sample = cands.slice(0, 12).map(c =>
      '· ' + c.title + ' (' + new Date(c.completedAt).toLocaleDateString('he-IL') + ')').join(nl);
    /* ⚠️ בכרטיסים אין fileSize ברשומה — הגודל לא ידוע מראש, ולומר "כ-0"
       גרוע מלומר "לא ידוע". */
    const sizeTxt = total ? ('כ-' + _fmtGB(total) + ' של קבצים') : 'הקבצים שלהן (הגודל יתברר בסריקה)';
    if (!confirm('נמצאו ' + cands.length + ' ' + (isCards ? 'כרטיסים' : 'עבודות') + ' — יימחקו ' + sizeTxt + ':' + nl + nl
      + sample + (cands.length > 12 ? (nl + '…ועוד ' + (cands.length - 12)) : '') + nl + nl
      + 'הקבצים נמחקים לצמיתות מהאחסון (הרשומות נשארות). להמשיך?')) return;
    b.textContent = '🧹 מוחק…';
    const del = await _fnCall('storageCleanup', { action: 'delete', days: days, scope: scope || 'proofs', ids: cands.map(c => c.id) });
    const ok = (del.deleted || []).length, bad = (del.failed || []).length;
    alert('✓ נוקו ' + ok + (isCards ? ' כרטיסים' : ' עבודות') + (total ? (' (~' + _fmtGB(total) + ')') : '') + (bad ? (nl + '⚠️ ' + bad + ' נכשלו — ראו console') : ''));
    if (bad) console.error('ניקוי-אחסון — כשלים:', del.failed);
  } catch(e){
    console.error('ניקוי-אחסון נכשל', e);
    alert('⚠️ ניקוי-האחסון נכשל: ' + (e.message || e));
  } finally { b.disabled = false; b.textContent = '🧹 ניקוי קבצים ישנים'; }
}
$('cleanupBtn').onclick = () => _storageCleanup('proofs');

/* ⚠️ שני מצבים שבהם הכפתור "לא הופיע" (דווח 2026-07-31):
   1. המסך פתוח *בתוך* האפליקציה הראשית (iframe). הדפדפן לא מציע התקנה לדף

/* ═══ רכיב-פעולות אחיד לשורות-העבודה ═══════════════════════════════════════
   ⚠️ עיקרון-הבטיחות: הרכיב **אינו יוצר ואינו מוחק כפתורים** — הוא מזיז את
   אותם צמתי-DOM שכבר רונדרו. מכאן נובע ישירות:
     · אי-אפשר לאבד פעולה (כל צומת עובר, אף אחד לא נמחק).
     · אי-אפשר לחשוף פעולה שלא הייתה בשורה (אין מקור ליצירה).
     · ה-handlers, ה-data-attributes וה-payloads נשארים **זהים** — כולל
       event-delegation, כי הצמתים הם אותם צמתים.
   הפעולות המסוכנות יורדות לתחתית התפריט, מופרדות בקו ובאדום.
   ⚠️ אין כאן שום שכבת-הרשאות: הסתרה בתפריט אינה אבטחה, והאכיפה נשארת
   בשרת/בחוקים (ראה משימת-ההמשך "Audit הרשאות לפעולות במסך proof-admin"). */
const ACT_DANGER = el => el.matches('.del,[data-deljob],[data-delpart]');
/* סדר-עדיפות לפעולה הראשית — הראשון שקיים בשורה זוכה. הכל מתוך מה שכבר רונדר. */
const ACT_PRIMARY_ORDER = ['[data-opencust]', 'a[href*="proof-viewer"]', '[data-link*="proof-client"]',
                           '[data-dl]', '[data-link]', '[data-portal]', '[data-editproof]'];
/* ⚠️ 17/08/2026: תפריט-השורה בוטל — אין תפריט צף לסגור. */
function _applyActionGroups(root){
  (root || document).querySelectorAll('.acts:not([data-grouped])').forEach(box => {
    box.setAttribute('data-grouped', '1');
    const items = Array.from(box.children).filter(el => el.nodeType === 1);
    if (items.length <= 2) return;                       // מעט פעולות — אין טעם בתפריט
    const picked = [];
    for (const sel of ACT_PRIMARY_ORDER) {
      if (picked.length >= 2) break;
      const el = items.find(x => !picked.includes(x) && !ACT_DANGER(x) && x.matches(sel));
      if (el) picked.push(el);
    }
    const rest = items.filter(x => !picked.includes(x));
    if (!rest.length) return;
    if (picked[0]) picked[0].classList.add('actPrimary');
    if (picked[1]) picked[1].classList.add('actSecondary');

    /* ⚠️ בקשת-בעלים 17/08/2026: תפריט "⋮ פעולות נוספות" ברמת-השורה בוטל.
       הפעולות שנשארו אחרי ניקוי-המסך מעטות, והתפריט רק הסתיר אותן מאחורי
       קליק נוסף. הרכיב ממשיך **לא ליצור ולא למחוק** כפתורים — הוא רק
       מסדר: ראשי · משני · השאר · ומסוכנות בסוף, באדום ועם אישור. */
    const safe = rest.filter(x => !ACT_DANGER(x)), danger = rest.filter(ACT_DANGER);
    safe.forEach(el => box.appendChild(el));              // אותו צומת — לא עותק
    danger.forEach(el => {
      /* אישור שמציג במפורש את שם-העבודה ואת הפעולה. ⚠️ שכבה מקדימה בלבד —
         ה-handler המקורי נשאר ורץ רק אם אושר. */
      if (!el.dataset.confirmWired) {
        el.dataset.confirmWired = '1';
        const jobName = (box.closest('tr')?.querySelector('td b')?.textContent || '').trim();
        el.addEventListener('click', ev => {
          const what = el.matches('[data-delpart]') ? 'מחיקת ריצה' : 'מחיקת עבודה';
          const msg = what + (jobName ? ('\n\nעבודה: ' + jobName) : '') + '\n\nהפעולה אינה הפיכה. להמשיך?';
          if (!confirm(msg)) { ev.stopImmediatePropagation(); ev.preventDefault(); }
        }, true);                                          // capture — לפני ה-handler הקיים
      }
      if (!el.textContent.trim() || el.textContent.trim() === '🗑')
        el.textContent = el.matches('[data-delpart]') ? '🗑 מחק ריצה' : '🗑 מחק עבודה';
      el.classList.add('actDanger');
      box.appendChild(el);                                 // מסוכנת — אחרונה בשורה
    });
  });
}

/* ⚠️ 17/08/2026, בקשת-בעלים: תפריט "⋮ פעולות נוספות" בסרגל-העליון פורק
   לכפתורים גלויים, ולכן חיווט-הפתיחה שהיה כאן ירד. הכפתורים עצמם

   הפעולות חוזרות להיות בלתי-נגישות — הבאג שהחיווט הזה נכתב נגדו. */

/* ברירת-המחדל של כיוון-הדפדוף לפי הלקוח (customers[].defaultReadingDirection).
   נקרא **פעם אחת בזמן יצירת-עבודה** ומועתק לרשומת-העבודה. התאמת-שם מנורמלת
   (רווחים כפולים/גרשיים), כדי ש"נקודה צפונית" ו"הנקודה הצפונית" לא יתפספסו
   סתם — אך בלי התאמה-חלקית מסוכנת: רק שוויון מנורמל. */
let _custDirCache = null;
async function _defaultDirFor(name){
  const norm = s => String(s || '').replace(/["'׳״]/g, '').replace(/\s+/g, ' ').trim();
  try {
    if (!_custDirCache) {
      const r = await fetch(await _au(`${_FBURL}/customers.json`));
      if (!r.ok) return 'rtl';
      const list = await r.json();
      _custDirCache = {};
      const arr = Array.isArray(list) ? list : Object.values(list || {});
      arr.forEach(c => { if (c && c.name) _custDirCache[norm(c.name)] = (c.defaultReadingDirection === 'ltr') ? 'ltr' : 'rtl'; });
    }
    return _custDirCache[norm(name)] || 'rtl';
  } catch(e){ return 'rtl'; }
}

/* ⚠️ כותרת אחת בלבד (עיצוב-מחדש 06/08/2026): כשהמסך מוטמע במעטפת-האפליקציה,

(function(){

  if (inFrame){
    b.textContent = '🔗 פתח בחלון נפרד';
    b.title = 'המסך פתוח בתוך האפליקציה — כדי להתקין אותו כאפליקציה יש לפתוח אותו בכרטיסייה משלו';
    b.style.display = '';
    b.onclick = () => window.open(location.href, '_blank', 'noopener');
    return;
  }
  b.style.display = '';
  b.onclick = async () => {
    const p = window._pwaPrompt;
    if (!p){
      alert('הדפדפן לא מציע התקנה כרגע.\n\nב-Chrome / Edge:\nתפריט ⋮ (למעלה מימין) ← "התקן…" / "Install app"\nאו האייקון 🖥️ שבשורת-הכתובת.\n\nאם המסך כבר מותקן — פתח אותו מהאייקון בשולחן העבודה.');
      return;
    }
    p.prompt();
    try { await p.userChoice; } catch(e){}
    window._pwaPrompt = null;
    b.style.display = 'none';
  };
})();

/* ⚠️ **‎_storageDelete‎ (מחיקה מהדפדפן) הוסר ב-24/08/2026 — אל תחזיר אותו.**
   חוקי-האחסון אינם מתירים ‎DELETE‎ מהדפדפן, **בכוונה** ([[solan-storage-rules-c1]]),
   ולכן הוא לא היה יכול להצליח; הוא גם בלע כל שגיאה ב-‎catch{return false}‎
   והחזיר "לא הצלחנו" בלי לומר למה. הקורא היחיד שלו היה קוד-מת.
   נתיב-המחיקה היחיד הוא ‎storageCleanup‎ (Function · Admin-SDK · רצפת-30-יום
   נאכפת בשרת · ‎assertPrefix‎ מונע מחיקת-משפחה) — ראה ‎_storageCleanup‎ למעלה. */

/* ── 🧹 "פנה מקום" — עכשיו באמת מפנה ────────────────────────────────────────
   ⚠️ **הכפתור הזה היה מבוי-סתום, ותוקן 24/08/2026 לפי דיווח-בעלים** ("מוצג
   לי שעומד להיגמר האחסון — תאפשר לפנות מקום ישירות מהאפליקציה"). הוא הציג
   הודעה שהפינוי מושבת והפנה את המשתמש ל-Firebase Console; כל גוף-הפונקציה
   שאחרי ההודעה היה קוד-מת (‎eslint-disable no-unreachable‎), ומה שהיה שם
   ניסה למחוק מהדפדפן — מה שחוקי-האחסון חוסמים **בכוונה** ([[solan-storage-rules-c1]]).
   בינתיים, מאז 15/08/2026, קיים מסלול-מחיקה שעובד: ‎storageCleanup‎ (Function,
   ‏Admin-SDK, רצפת-30-יום נאכפת בשרת) — אבל הוא היה מוסתר מאחורי כפתור אחר,
   ולכן מי שראה את האזהרה לא הגיע אליו לעולם.
   מכאן: הכפתור פותח את הפאנל האמיתי — מדידה מהדלי, פילוח לפי משפחה, ושני
   כפתורי-הניקוי העובדים. אין כאן מחיקה חדשה ואין נתיב-מחיקה חדש. */
function _offerCleanup(){
  const u = $('usage');
  if (u) { try { u.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch(e){} }
  /* ⚠️ הכשל **נאמר** ולא נבלע: ‎_renderUsageReal‎ מציג בעצמו "מדידת-האחסון
     נכשלה" עם הסיבה — כולל המקרה שבו המשתמש אינו מנהל ולכן ה-Function
     דוחה אותו. ‏.catch כאן הוא רשת-הביטחון לדחייה שלא נתפסה שם. */
  return Promise.resolve()
    .then(() => _renderUsageReal())
    .catch(e => {
      console.error('פתיחת פאנל-האחסון נכשלה', e);
      alert('⚠️ לא הצלחנו לפתוח את פאנל-האחסון: ' + (e && e.message || e));
    });
}

/* בדיקה אוטומטית בטעינה — פעם אחת לסשן.
   ⚠️ **כבר לא קופצת מודאל.** עד 24/08/2026 היא ירתה הודעת-"האחסון עומד
   להיגמר" על סמך תקרת-5GB שאינה קיימת בתוכנית שלנו, ואז פתחה חלון שאמר
   שהפינוי מושבת — כלומר הפחידה, חסמה, ולא נתנה מה לעשות. עכשיו: מציגה
   את הפס (שאומר במפורש שאין תקרה) ומשאירה את ההחלטה למשתמש.
   ⚠️ הסף הוא **סף-תשומת-לב על גודל**, לא אחוז מתוך תקרה מומצאת. */
function _storageAutoCheck(){
  try {
    if (!window.StorageCleanup) return;
    if (sessionStorage.getItem('solanStorageNagged') === '1') return;
    const total = _usageBytes();
    if (total >= _EST_NOTICE_GB * 1073741824) {
      sessionStorage.setItem('solanStorageNagged','1');
      _renderUsage(total);
    }
  } catch(e){
    /* ⚠️ היה כאן ‎catch(e){}‎ ריק — כלל-1. הפס אינו קריטי ולכן אינו מוצג
       למשתמש, אבל כשל שלו חייב להשאיר עקבה. */
    console.error('חישוב הערכת-האחסון נכשל — הפס אינו מוצג', e);
  }
}

$('refresh').onclick = loadProofs;
$('trashBtn').onclick = openTrash;
/* מרכז-השיחות (בקשת-בעלים 21/08/2026) — חלון-צף אחד לכל השיחות; שם-חלון
   קבוע כדי שלחיצה שנייה תחזיר את הקיים במקום לפתוח עוד אחד. */
$('chatWinBtn').onclick = () => {
  const w = window.open('shop-chat.html', 'solanShopChat',
    'width=980,height=720,menubar=no,toolbar=no,location=no,status=no');
  if (w) w.focus(); else alert('הדפדפן חסם את החלון — אשרו חלונות-קופצים לאתר');
};
/* הקפצות-רקע (21/08): דפדפן-צוות שכבר אישר התראות נרשם ל-Web Push בשקט —
   הודעת-לקוח קופצת גם כשכל המסכים סגורים; הלחיצה פותחת את מרכז-השיחות. */
try {
  if (window.SolanPush && SolanPush.supported() && 'Notification' in window
      && Notification.permission === 'granted')
    SolanPush.enable(() => _fbAuthToken(), location.href.replace(/[^/]*(\?.*)?$/, '') + 'shop-chat.html')
      .then(r => { if (!r.ok) console.warn('הרשמת-רקע להקפצות לא הושלמה:', r.why); });
} catch(e){ console.error('הרשמת-ההקפצות נכשלה', e); }
/* ⚠️ ‏.catch מפורש: בלעדיו כשל-טעינה הוא unhandled rejection — ה-then לא
   רץ, ואין שום עקבה ב-console מלבד אזהרה גנרית. ההודעה למשתמש כבר הוצגה
   בתוך loadProofs; כאן רק מונעים שקט. */
loadProofs()
  .then(function(){ setTimeout(_storageAutoCheck, 1500); })
  .catch(function(e){ console.error('טעינה ראשונית נכשלה', e); });
</script>
