};

let _allRows = [];

// ── יום-בשבוע לכל לקוח (מהיומן השבועי) + לקוחות עם כרטיס-עבודה פעיל ──────────
// הרשימה התארכה מדי; מסדרים אותה לפי היום שבו הלקוח אמור לשלוח (newspapers[].day),
// ומדגישים מי שאמור לשלוח היום או שיש לו כרטיס פעיל. (בקשת-משתמש 2026-07-30)
const _DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
let _dayByCustomer = {};      // שם-לקוח (מנורמל) → יום בשבוע (מהיומן השבועי)
let _dayOverride = {};        // דריסה ידנית של יום-הלקוח (מנצחת את היומן) — customerDayOverride ב-Firebase
let _activeCardCusts = {};    // שם-לקוח (מנורמל) → true אם יש כרטיס פעיל
let _dayCollapsed = {};       // day → true אם קבוצת-היום מקווצת (ברירת-מחדל: מקווץ)
const _normName = s => String(s||'').replace(/["'.,\-()]/g,'').replace(/\s+/g,' ').trim().toLowerCase();
function _custDay(name){
  const n = _normName(name); if (!n) return '';
  if (_dayOverride[n]) return _dayOverride[n];       // דריסה ידנית קודמת לכול
  if (_dayByCustomer[n]) return _dayByCustomer[n];
  // התאמה גמישה: שם-עיתון שמוכל בשם-הלקוח או להפך
  for (const k in _dayByCustomer){ if (k && (n.indexOf(k)>=0 || k.indexOf(n)>=0)) return _dayByCustomer[k]; }
  return '';
}
// שמירת יום-שליחה ידני ללקוח (או ניקוי) — נשמר ב-customerDayOverride וגובר על היומן
async function _setCustDay(custName, day){
  const n = _normName(custName); if (!n) return;
  if (day) _dayOverride[n] = day; else delete _dayOverride[n];
  try {
    await fetch(await _au(`${_FBURL}/customerDayOverride/${encodeURIComponent(n)}.json`), {
      method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(day || null) });
  } catch(e){ alert('שמירת היום נכשלה: ' + (e.message||e)); }
  render(_allRows);
}
function _custHasActiveCard(name){
  const n = _normName(name); if (!n) return false;
  if (_activeCardCusts[n]) return true;
  for (const k in _activeCardCusts){ if (k && (n.indexOf(k)>=0 || k.indexOf(n)>=0)) return true; }
  return false;
}
async function _loadWeeklyContext(){
  try {
    const [np, cds, ov] = await Promise.all([
      fetch(await _au(`${_FBURL}/newspapers.json`)).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch(await _au(`${_FBURL}/cards.json`)).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch(await _au(`${_FBURL}/customerDayOverride.json`)).then(r=>r.ok?r.json():null).catch(()=>null)
    ]);
    _dayOverride = (ov && typeof ov==='object') ? ov : {};
    const dayMap = {};
    const npArr = Array.isArray(np) ? np : (np && typeof np==='object' ? Object.values(np) : []);
    npArr.forEach(n=>{ if (n && n.name && n.day && _DAYS.indexOf(n.day)>=0) dayMap[_normName(n.name)] = n.day; });
    _dayByCustomer = dayMap;
    const active = {};
    const cdArr = Array.isArray(cds) ? cds : (cds && typeof cds==='object' ? Object.values(cds) : []);
    cdArr.forEach(c=>{ if (c && c.name && c.status!=='done' && c.status!=='trash' && c.status!=='done_hidden' && c.status!=='archived') active[_normName(c.name)] = true; });
    _activeCardCusts = active;
  } catch(e){}
}

async function loadProofs() {
  msg('טוען…');
  const data = await (await fetch(await _au(`${_FBURL}/customerProofs.json`))).json() || {};
  await _loadWeeklyContext();   // מפת-ימים + כרטיסים-פעילים (לסידור הרשימה)
  _allRows = Object.entries(data)
    .map(([id, p]) => ({ id, ...p }))
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  render(_allRows);
  msg(_allRows.length ? `${_allRows.length} קבצים` : '');
  _sig = _rowsSig(_allRows);
}

// ── רענון-אוטומטי: כשלקוח מעלה קובץ/מאשר — המסך מתעדכן לבד, בלי רענון ידני ──
//    מרענן *רק* כששונה משהו בפועל (חתימת-תוכן), כדי לא לקטוע עבודה/גלילה.
let _sig = '';
function _rowsSig(rows){
  try{ return (rows||[]).map(function(p){
    var parts = p.parts ? Object.keys(p.parts).map(function(k){ var t=p.parts[k]; return k+':'+(t.approvedAt||0)+':'+(t.fileUrl?1:0); }).sort().join(',') : '';
    var files = p.files ? Object.keys(p.files).sort().join(',') : '';
    // בקשות החלפת-עמודים בחתימה — אחרת בקשה חדשה מלקוח לא מופיעה עד רענון ידני
    var crs = p.changeRequests ? Object.keys(p.changeRequests).map(function(k){
      var r = p.changeRequests[k]; return k + ':' + (r && r.status) + ':' + ((r && r.decidedAt) || 0);
    }).sort().join(',') : '';
    return [p.id, p.updatedAt||0, p.approvedAt||0, p.apogeeApprovedAt||0, p.version||1, parts, files, crs].join('|');
  }).sort().join(';'); }catch(e){ return String(Math.random()); }
}
async function _autoRefresh(){
  try{
    if (document.hidden) return;                       // בלשונית-רקע אין טעם
    if (document.querySelector('.modal,[data-busy="1"]')) return;   // לא קוטעים דיאלוג פתוח
    const data = await (await fetch(await _au(`${_FBURL}/customerProofs.json`))).json() || {};
    const rows = Object.entries(data).map(function(e){ return Object.assign({id:e[0]}, e[1]); })
      .sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
    const sig = _rowsSig(rows);
    if (sig === _sig) return;                          // אין שינוי — לא נוגעים במסך
    _sig = sig; _allRows = rows; render(_allRows);
    msg(_allRows.length ? (_allRows.length + ' קבצים · ✓ עודכן') : '');
  }catch(e){}
}
setInterval(_autoRefresh, 15000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) _autoRefresh(); });   // חזרה ללשונית → רענון מיידי

function render(rows) {
  if (!rows.length) { $('tableWrap').innerHTML = '<div class="empty">אין קבצים עדיין. לחץ "קובץ חדש".</div>'; return; }
  const base = location.href.replace(/[^/]+(\?.*)?$/, '');
  const fmt = t => t ? new Date(t).toLocaleString('he-IL', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' }) : '—';

  // קיבוץ לפי לקוח — תיקייה לכל לקוח
  const byCustomer = new Map();
  for (const p of rows) {
    const key = (p.customer || 'ללא לקוח').trim();
    if (!byCustomer.has(key)) byCustomer.set(key, []);
    byCustomer.get(key).push(p);
  }

  // רישום יעדים לייצור ריצות (כדי לתמוך גם בריצות בודדות שאינן ב-_allRows)
  _genReg = {}; let gi = 0;
  /* הורדה מאוחדת: כפתור-הורדה אחד ("⬇ הורד") שמוריד קובץ-PDF יחיד בשם המלא של
     העבודה — שם-העיתון + גיליון, ובריצה גם שם-הריצה. הפיצול-לקונטרסים נשאר
     כפעולה משנית ("✂ פיצול לריצות"), כי הוא נדרש רק כשעיתון שלם צריך להתפצל. */
  const genCell = (fileUrl, title, jobId, partId) => {
    const key = 'g' + (gi++); _genReg[key] = { fileUrl, title, jobId, partId };
    return `<button class="dl" data-dl="${key}" title="קובץ-PDF יחיד בשם: ${escapeHtml(title)}">⬇ הורד</button>
            <select data-sheet="${key}" title="גודל גיליון לפיצול לקונטרסים"><option value="32">70×100</option><option value="16">64×90</option></select>
            <button class="gen" data-gen="${key}" title="עיתון שלם → קובץ-PDF לכל ריצה (לגרירה ישירה לאפוגי)">✂ פיצול לריצות</button>`;
  };

  /* ── בקשות לקוח להחלפת עמודים ────────────────────────────────────────────
     הלקוח אישר, גילה טעות, וביקש להחליף עמוד. אסור שייפתח לעריכה בלי ידיעתנו —
     הקובץ יכול להיות כבר באימפוזיציה או על המכונה. כאן מאשרים/דוחים, והאישור
     פותח לו חלון-עריכה מוגבל בזמן (page-swap.js). */
  const psCell = (jobId, target, req) => {
    if (!window.PageSwap) return '';
    const st = PageSwap.state(req, Date.now());
    const key = jobId + '|' + target;
    if (st === 'pending') return `<span class="psTag psWait" title="${escapeHtml(req.note||'')}">🔁 בקשת החלפת עמודים${req.note?(' — '+escapeHtml(req.note)):''}</span>
        <button class="psOk" data-ps="${key}">✔ אשר עריכה</button>
        <button class="psNo" data-ps="${key}">✖ דחה</button>`;
    if (st === 'approved') return `<span class="psTag psOpen">✏️ עריכה פתוחה ללקוח · ${escapeHtml(PageSwap.remainingLabel(req, Date.now()))}</span>
        <button class="psNo" data-ps="${key}" title="סגירת חלון העריכה">✖ סגור</button>`;
    if (st === 'used') return `<span class="psTag psDone">🔁 ${escapeHtml(PageSwap.changesLabel(req.changes))}</span>`;
    return '';
  };
  const psReqOf = (p, target) => ((p && p.changeRequests) || {})[target] || null;
  // עדכון-לקוח-שמוכן: תג "עודכן" אם כבר הודענו, או כפתור לעדכן עבודה שכבר הושלמה
  const notifyBtn = (p) => {
    if (p.readyNotice) return `<span class="psTag" style="background:#dcfce7;color:#166534;border:1.5px solid #86efac" title="עודכן ${fmt(p.readyNotice.at)}">📩 הלקוח עודכן שמוכן</span>`;
    if (p.completedAt) return `<button data-notifyready="${p.id}" title="עדכן את הלקוח שהעבודה מוכנה">🔔 עדכן שמוכן</button>`;
    return '';
  };

  const rowHtml = p => {
    const clientLink = `${base}proof-client.html?id=${p.id}`;
    const viewerLink = `${base}proof-viewer.html?id=${p.id}`;  // צפייה בלבד — לשליחה לעובדים
    const parts = p.parts ? Object.entries(p.parts).map(([pid, pt]) => ({ pid, ...pt }))
                                 .sort((a,b)=>(a.approvedAt||0)-(b.approvedAt||0)) : [];

    // ── עבודה לפי ריצות ──
    if (parts.length) {
      const _col = !!_jobCollapsed[p.id];   // עבודה מכווצת → שורות-הריצות מוסתרות
      const head = `<tr class="row-ok">
        <td><span data-jobtoggle="${p.id}" style="cursor:pointer;user-select:none;color:#2d3561;font-weight:900;margin-left:4px" title="${_col?'פתח':'כווץ'} ריצות">${_col?'▶':'▼'}</span> <b>${escapeHtml(p.title || '—')}</b></td>
        <td><span class="badge b-approved">${parts.length} ריצות התקבלו</span></td>
        <td>נוצר: ${fmt(p.createdAt)}</td>
        <td><div class="acts">
          <a href="${viewerLink}" target="_blank">👁 צפה בדפדוף</a>
          <button data-link="${clientLink}">📤 קישור ללקוח</button>
          <button data-link="${viewerLink}">📤 שלח לעובדים</button>
          <button data-donejob="${p.id}" data-on="${p.completedAt?1:0}" title="${p.completedAt?'החזר לעבודות פעילות':'סמן כהושלם — יעבור ל"עיתונים שהושלמו"'}">${p.completedAt?'↩ החזר':'✅ הושלם'}</button>
          ${notifyBtn(p)}
          <button class="del" data-deljob="${p.id}" title="מחק עבודה וכל הריצות">🗑</button>
        </div></td></tr>`;
      const partRows = parts.map(pt => `<tr class="row-ok">
        <td style="padding-right:26px;color:#555">↳ ${escapeHtml(pt.name)} <span style="color:#9ca3af">(${pt.pageCount} עמ')</span>${(pt.pendingPages&&pt.pendingPages.length)?` <span style="font-size:.72rem;font-weight:800;color:#b45309;background:#fffbeb;border:1.5px solid #fcd34d;border-radius:5px;padding:1px 7px;white-space:nowrap">⏳ חסרים עמ׳ ${pt.pendingPages.join(', ')}</span>`:''}</td>
        <td><span class="badge b-approved">מאושר</span></td>
        <td>אושר: ${fmt(pt.approvedAt)}</td>
        <td><div class="acts">
          <a href="${base}proof-viewer.html?id=${p.id}&part=${pt.pid}" target="_blank">👁 צפה</a>
          <button data-link="${base}proof-viewer.html?id=${p.id}&part=${pt.pid}">📤 לעובדים</button>
          ${genCell(pt.fileUrl, jobName(p, pt.name), p.id, pt.pid)}
          ${psCell(p.id, pt.pid, psReqOf(p, pt.pid))}
          <button class="del" data-delpart="${p.id}|${pt.pid}|${encodeURIComponent(pt.filePath||'')}" title="מחק ריצה">🗑</button>
        </div></td></tr>`).join('');
      return head + (_col ? '' : partRows);   // מכווץ → מציגים רק את שורת-העבודה
    }

    // ── פרופר-אפוגי שהעלה הדפוס — אישור/נעילה של הלקוח ──
    if (p.apogeeUrl) {
      const approved = !!p.apogeeApprovedAt;
      const link = `${base}imposition-tool.html?proofUrl=${encodeURIComponent(p.apogeeUrl)}&type=${encodeURIComponent(p.apogeeFold||'32')}&auto=1&client=1`;
      return `<tr class="${approved?'row-ok':''}">
        <td><b>${escapeHtml(p.title || 'פרופר אפוגי')}</b></td>
        <td><span class="badge ${approved?'b-approved':'b-wait'}">${approved ? '✓ אושר לדפוס · נעול' : 'ממתין לאישור הלקוח'}</span></td>
        <td>נוצר: ${fmt(p.createdAt)}${approved ? `<div class="note" style="color:#16a34a">✓ ${escapeHtml(p.apogeeApprovedBy||'')} · ${fmt(p.apogeeApprovedAt)}</div>` : ''}</td>
        <td><div class="acts">
          <a href="${link}" target="_blank">📖 דפדף</a>
          <button class="dl" data-dl="${(function(){ const k='g'+(gi++); _genReg[k]={ fileUrl:p.apogeeUrl, title:jobName(p) }; return k; })()}" title="קובץ-PDF יחיד בשם העבודה">⬇ הורד</button>
          ${approved ? `<button data-unlock="${p.id}" title="בטל נעילה — הלקוח יוכל לשנות/לאשר מחדש">🔓 פתח לשינויים</button>` : ''}
          <button class="del" data-deljob="${p.id}" title="מחק פרופר">🗑</button>
        </div></td></tr>`;
    }

    // ── עיתון שהעלה הלקוח מהפורטל — קבצים מקובצים תחת עיתון אחד (לא כבודדים) ──
    if (p.files) {
      const fkeys = Object.keys(p.files);
      const dls = fkeys.map(k => { const fl = p.files[k]; return (fl && fl.fileUrl)
        ? `<a href="${fl.fileUrl}" target="_blank" title="${escapeHtml(fl.fileName||'')}">⬇ ${escapeHtml((fl.fileName||'קובץ').slice(0,22))}</a>` : ''; }).join(' ');
      const pf = (p.preflight && p.preflight.issueCount > 0)
        ? `<div class="note" style="color:#b45309">⚠️ תקינות: ${escapeHtml((p.preflight.warnings||[]).join(' · '))}</div>`
        : (p.preflight ? `<div class="note" style="color:#16a34a">✓ בדיקת תקינות עברה</div>` : '');
      return `<tr>
        <td><b>${escapeHtml(p.title || (p.customer ? p.customer + ' — עיתון' : 'עיתון'))}</b>
          <span style="color:#9ca3af">(${fkeys.length} קבצים${p.issue ? ' · גיליון ' + escapeHtml(String(p.issue)) : ''})</span>${pf}</td>
        <td><span class="badge b-wait">התקבל מהלקוח</span></td>
        <td>נוצר: ${fmt(p.createdAt)}</td>
        <td><div class="acts">${dls}
          <button class="del" data-deljob="${p.id}" title="מחק עבודה וכל הקבצים">🗑</button>
        </div></td></tr>`;
    }

    // ── עבודה רגילה (עיתון מלא / ממתין) ──
    const [txt, cls] = STATUS[p.status] || ['—', ''];
    const gen = p.status === 'approved' ? genCell(p.fileUrl, jobName(p), p.id, null)
      : `<button disabled title="זמין רק לאחר אישור">⬇ הורד</button>`;
    const view = p.fileUrl ? `<a href="${viewerLink}" target="_blank">👁 צפה בדפדוף</a>` : '';
    const toWorkers = p.fileUrl ? `<button data-link="${viewerLink}">📤 שלח לעובדים</button>` : '';
    const note = (p.status === 'rejected' && p.customerNote) ? `<div class="note">📝 ${escapeHtml(p.customerNote)}</div>` : '';
    const approvedLine = p.approvedAt ? `<div class="note" style="color:#16a34a">✓ אושר: ${fmt(p.approvedAt)}</div>` : '';
    return `<tr class="${p.status==='approved'?'row-ok':''}">
      <td>${escapeHtml(p.title || (p.customer ? p.customer + ' — עיתון' : 'עיתון'))}${note}</td>
      <td><span class="badge ${cls}">${txt}</span></td>
      <td>נוצר: ${fmt(p.createdAt)}${approvedLine}</td>
      <td><div class="acts">
        <a href="${clientLink}" target="_blank">🔗 פתח</a>
        <button data-link="${clientLink}">📤 קישור ללקוח</button>
        ${view}${toWorkers}${gen}${psCell(p.id, 'full', psReqOf(p, 'full'))}${notifyBtn(p)}
        <button class="del" data-deljob="${p.id}" title="מחק עבודה">🗑</button>
      </div></td></tr>`;
  };

  // ── פריסת master-detail: רשימת-לקוחות בצד · עבודות הלקוח הנבחר במרכז ──
  // הרשימה מסודרת לפי היום בשבוע (מהיומן השבועי); ברירת-המחדל = מסך "היום"
  // שמרכז את מי שאמור לשלוח היום או שיש לו כרטיס-עבודה פעיל. (בקשת-משתמש 2026-07-30)
  const custNames = [...byCustomer.keys()];
  const _today = _DAYS[new Date().getDay()];
  const _dayOf = {}; custNames.forEach(c => _dayOf[c] = _custDay(c));
  if (_selCust == null) _selCust = '__today__';
  if (_selCust !== '__today__' && !byCustomer.has(_selCust)) _selCust = custNames.length ? '__today__' : null;

  // קבוצות-הימים מקווצות כברירת-מחדל; לחיצה על יום פותחת (בקשת-משתמש 2026-07-30)
  const _dayKey = (day) => day || 'ללא יום קבוע';
  const _isDayCollapsed = (day) => _dayCollapsed[_dayKey(day)] !== false;   // undefined → מקווץ
  const custItemHtml = (c, day) => {
    const items = byCustomer.get(c), on = (c === _selCust);
    const act = items.filter(function(p){ return !p.completedAt; }).length;
    const card = _custHasActiveCard(c) ? ' <span title="כרטיס עבודה פעיל">📋</span>' : '';
    const hidden = _isDayCollapsed(day) ? ' style="display:none"' : '';
    return `<div class="custItem${on?' on':''}" data-cust="${escapeHtml(c)}" data-day="${escapeHtml(_dayKey(day))}"${hidden}>
      <span class="cName">📁 ${escapeHtml(c)}${card}</span><span class="cCount" title="פעילות מתוך סה״כ">${act}${act!==items.length?('/'+items.length):''}</span></div>`;
  };
  const dayHdrHtml = (day, count) => {
    const col = _isDayCollapsed(day), isToday = (day === _today);
    return `<div class="dayHdr${isToday?' todayHdr':''}" data-daytoggle="${escapeHtml(_dayKey(day))}">
      <span class="dayArrow">${col?'▶':'▼'}</span> ${isToday?'📌 ':''}${_dayKey(day)} <span class="dayCnt">(${count})</span></div>`;
  };
  // סדר הימים: היום קודם, אחר-כך שאר השבוע במחזור, ולבסוף "ללא יום קבוע"
  const _tIdx = _DAYS.indexOf(_today);
  const _orderedDays = _DAYS.slice(_tIdx).concat(_DAYS.slice(0, _tIdx));
  let sideList = `<div class="custItem dayToday${_selCust==='__today__'?' on':''}" data-cust="__today__">
      <span class="cName">📅 היום — ${_today}</span></div>`;
  _orderedDays.forEach(day => {
    const inDay = custNames.filter(c => _dayOf[c] === day).sort((a,b)=>a.localeCompare(b,'he'));

  $('tableWrap').innerHTML = `<div class="mdWrap">

  // בחירת-לקוח → מציג את עבודותיו במרכז (בלי טעינה-מחדש מהשרת)
  document.querySelectorAll('.custItem').forEach(el => el.onclick = () => { _selCust = el.dataset.cust; render(rows); });
  // לחיצה על לקוח במסך "היום" → פותחת את הלקוח
  document.querySelectorAll('.todayCust').forEach(el => el.onclick = () => { _selCust = el.dataset.cust; render(rows); });

  document.querySelectorAll('.cardItem').forEach(el => el.onclick = () => { _selCust = el.dataset.cust; render(rows); });
  // לחיצה על כותרת-יום → פתיחה/קיווץ של קבוצת-היום (בלי render מלא — רק הצג/הסתר)
  document.querySelectorAll('[data-daytoggle]').forEach(h => h.onclick = () => {

  if (_sd) _sd.onchange = () => _setCustDay(_selCust, _sd.value);
  // סינון רשימת-הלקוחות — הצג/הסתר בלבד, בלי render מחדש (הקלדה לא מאבדת פוקוס
  // והלקוח הנבחר נשאר נבחר גם אם הוסתר).

  if (_cf) {

        else { // בלי חיפוש — חוזרים למצב הקיווץ של היום שאליו הפריט שייך

      // בסימון-הושלמה → לשאול אם לעדכן את הלקוח שהעבודה מוכנה (בקשת-משתמש 2026-07-30)

  document.querySelectorAll('[data-notifyready]').forEach(b => b.onclick = () => {

    if (job) _askNotifyReady(job);

  var _dh = document.getElementById('doneHdr');
  if (_dh) _dh.onclick = function(){ _doneOpen = !_doneOpen; render(rows); };
  // כיווץ/פתיחת עבודות הלקוח (שורות-הריצות שמתחת לכל עבודה)
  (function(){
    var setAll = function(collapsed){
      document.querySelectorAll('[data-jobtoggle]').forEach(function(t){ _jobCollapsed[t.dataset.jobtoggle] = collapsed; });

let _genReg = {};
let _selCust = null;   // הלקוח שנבחר ברשימת-הצד (master-detail)
let _custFilter = '';  // טקסט סינון רשימת-הלקוחות (נשמר בין רינדורים)
let _jobCollapsed = {};   // jobId → מכווץ? (כיווץ ריצות של עבודה)

// הורדת הקובץ למחשב (לשליחה ידנית בוואטסאפ וכו')
async function downloadFile(url, name, btn) {
  const old = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'מוריד…'; }
  try {
    const r = await fetch(url); const blob = await r.blob();
    downloadBlob(blob, name);
  } catch (e) { window.open(url, '_blank'); }
  if (btn) { btn.textContent = old; btn.disabled = false; }
}

// ── פורטל לקוח: קישור קבוע + דרישות + פרופר-אפוגי ──────────────────────────
function _slug(s){ return String(s||'').trim().toLowerCase().replace(/[.#$\[\]\/\\]+/g,'').replace(/\s+/g,'_'); }
// ── עריכת לקוח: שינוי-שם בכל העבודות שלו ─────────────────────────────────────
//    ⚠️ שם-הלקוח הוא גם המקור ל-slug של הפורטל — שינוי-שם משנה את כתובת-הפורטל,
//    ולכן צריך לשלוח ללקוח קישור חדש. מיישמים רק אם המשתמש מאשר במפורש.
async function renameCustomer(oldName){
  const cur = String(oldName||'').trim(); if (!cur) return;
  const rows = _allRows.filter(p => String(p.customer||'ללא לקוח').trim() === cur);
  if (!rows.length) { alert('לא נמצאו עבודות ללקוח הזה'); return; }
  const next = (prompt('שם הלקוח:', cur) || '').trim();
  if (!next || next === cur) return;
  const slugChanges = _slug(next) !== _slug(cur);
  let warn = `לשנות את שם הלקוח מ־"${cur}" ל־"${next}"?\n\nהשינוי יחול על ${rows.length} עבודות.`;
  if (slugChanges) warn += `\n\n⚠️ כתובת פורטל-הלקוח משתנה — הקישור הקודם שנשלח ללקוח יפסיק לעבוד, ויש לשלוח לו קישור-פורטל חדש.`;
  if (!confirm(warn)) return;
  msg('מעדכן שם לקוח…');
  try{
    let done = 0;
    for (const p of rows){
      await fetch(await _au(`${_FBURL}/customerProofs/${p.id}.json`), { method:'PATCH',
        headers:{'Content-Type':'application/json'}, body: JSON.stringify({ customer: next }) });
      done++; msg(`מעדכן… ${done}/${rows.length}`);
    }
    _selCust = next;                 // הבחירה עוברת לשם החדש
    await loadProofs();
    msg(`✓ עודכן ל־"${next}" (${done} עבודות)` + (slugChanges ? ' · שלח קישור-פורטל חדש' : ''));
  }catch(e){ console.error(e); msg('✗ עדכון נכשל: ' + (e.message||e)); }
}
async function portalLink(customer){
  const slug = _slug(customer); if (!slug){ alert('שם לקוח חסר'); return; }
  msg('מכין קישור פורטל…');
  let rec = null;
  try { rec = await (await fetch(await _au(`${_FBURL}/customerPortals/${slug}.json`))).json(); } catch(e){}
  if (!rec || !rec.token){
    rec = { name: customer, token: 'k'+Date.now().toString(36)+Math.random().toString(36).slice(2,10), createdAt: Date.now() };
    await fetch(await _au(`${_FBURL}/customerPortals/${slug}.json`), { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(rec) });
  }
  const base = location.href.replace(/[^/]+(\?.*)?$/, '');
  const link = base + 'customer-portal.html?cust=' + encodeURIComponent(customer) + '&k=' + encodeURIComponent(rec.token);
  shareLink(link); msg('✓ קישור הפורטל מוכן');
}

  document.body.insertAdjacentHTML('beforeend', html);

async function uploadBytes(path, bytes){
  let lastErr;
  for (const bucket of ['solan-printing.firebasestorage.app']){
    for (let attempt=1; attempt<=3; attempt++){
      try {
        const json = await xhrPost('https://firebasestorage.googleapis.com/v0/b/'+bucket+'/o?name='+encodeURIComponent(path), bytes);
        const token = (json.downloadTokens||'').split(',')[0] || '';
        return 'https://firebasestorage.googleapis.com/v0/b/'+bucket+'/o/'+encodeURIComponent(path)+'?alt=media&token='+token;
      } catch(e){ lastErr=e; if(e.code===403) throw e; await new Promise(r=>setTimeout(r, 1500*attempt)); }
    }
  }
  throw lastErr || new Error('העלאה נכשלה');
}
function xhrPost(url, bytes){
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest(); xhr.open('POST', url); xhr.timeout = 0;
    xhr.setRequestHeader('Content-Type', 'application/pdf');
    const finishSend = (t) => { try { if (t) xhr.setRequestHeader('Authorization', 'Firebase ' + t); } catch(e){} (window._appCheckToken?window._appCheckToken():Promise.resolve(null)).then(function(act){ try{ if(act) xhr.setRequestHeader('X-Firebase-AppCheck', act); }catch(e){} xhr.send(bytes); }, function(){ xhr.send(bytes); }); };
    xhr.onload = () => { if (xhr.status>=200 && xhr.status<300){ try{ resolve(JSON.parse(xhr.responseText)); }catch(e){ const er=new Error('bad'); er.code=xhr.status; reject(er); } return; } const er=new Error('Storage '+xhr.status); er.code=xhr.status; reject(er); };
    xhr.onerror = () => { const e=new Error('שגיאת רשת'); e.code=0; reject(e); };
    xhr.ontimeout = () => { const e=new Error('פג זמן'); e.code=408; reject(e); };
    _fbAuthToken().then(finishSend, () => finishSend(null));
  });
}

// ── ייצור ריצות מהקובץ המאושר ──
function splitToKontresim(totalPages, fullSheet) {
  const layers = [];
  if (fullSheet === 32 && (totalPages === 20 || totalPages === 24)) layers.push(totalPages - 16, 16);
  else {
    const rem = totalPages % fullSheet;
    if (rem !== 0) layers.push(rem);
    let inner = totalPages - rem;
    while (inner > 0) { layers.push(fullSheet); inner -= fullSheet; }
  }
  let front = 1, back = totalPages;
  const range = (a, b) => Array.from({ length: b - a + 1 }, (_, k) => a + k);
  return layers.map((lp, i) => {
    const isLast = i === layers.length - 1, half = lp / 2;
    let pages, label;
    if (isLast && lp === fullSheet) { pages = range(front, front + lp - 1); label = `${front}-${front+lp-1}`; front += lp; }
    else {
      const fe = front + half - 1, bs = back - half + 1;
      if (fe + 1 === bs) { pages = range(front, back); label = `${front}-${back}`; }
      else { pages = [...range(front, fe), ...range(bs, back)]; label = `${front}-${fe}+${bs}-${back}`; }
      front += half; back -= half;
    }
    return { num: i + 1, pages, count: lp, label };
  });
}

// עמודי "כפולה" (עמוד PDF ברוחב כפול = שני עמודי עיתון מחוברים): לא חותכים —
// משאירים את הקובץ כמו שהוא, פשוט מכפילים אותו לשני קבצים זהים (אחד לכל מקום בריצה)
// ומסמנים "כפולה" בשם. מחזיר { doc, labels, spread } — labels[i] = מספרי העמוד ("16-17").
async function normalizeSpreads(src) {
  const pages = src.getPages();
  const plain = { doc: src, labels: pages.map((_, i) => String(i + 1)), spread: pages.map(() => false) };
  if (pages.length < 2) return plain;
  // גודל הבסיס = הגודל השכיח בקובץ (דליים של ~5 מ"מ)
  const bucket = v => Math.round(v / 14.17);
  const freq = {}; let bestK = null;
  pages.forEach(pg => {
    const mb = pg.getMediaBox();
    const k = bucket(mb.width) + 'x' + bucket(mb.height);
    freq[k] = (freq[k] || 0) + 1;
    if (bestK === null || freq[k] > freq[bestK]) bestK = k;
  });
  const baseIdx = pages.findIndex(pg => { const mb = pg.getMediaBox(); return bucket(mb.width) + 'x' + bucket(mb.height) === bestK; });
  const baseW = pages[baseIdx].getMediaBox().width, baseH = pages[baseIdx].getMediaBox().height;
  const isSpread = pg => { const mb = pg.getMediaBox(); return mb.width > baseW * 1.6 && Math.abs(mb.height - baseH) < baseH * 0.12; };
  if (!pages.some(isSpread)) return plain;
  const out = await PDFLib.PDFDocument.create();
  const labels = [], spread = [];
  let n = 1;
  for (let i = 0; i < pages.length; i++) {
    if (!isSpread(pages[i])) {
      const [pg] = await out.copyPages(src, [i]); out.addPage(pg);
      labels.push(String(n)); spread.push(false); n++;
    } else {
      const lbl = n + '-' + (n + 1);
      for (let c = 0; c < 2; c++) {              // אותו עמוד פעמיים — בלי חיתוך
        const [pg] = await out.copyPages(src, [i]); out.addPage(pg);
        labels.push(lbl); spread.push(true);
      }
      n += 2;
    }
  }
  return { doc: out, labels: labels, spread: spread };
}

async function generateRuns(proof, fullSheet, btn) {
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = 'מוריד קובץ…';
  try {
    const bytes = await (await fetch(proof.fileUrl)).arrayBuffer();
    btn.textContent = 'מפצל…';
    const raw = await PDFLib.PDFDocument.load(bytes);
    const norm = await normalizeSpreads(raw);   // כפולה → אותו קובץ פעמיים + "כפולה" בשם
    const src = norm.doc;
    const total = src.getPageCount();
    const runs = splitToKontresim(total, fullSheet);

    // ── כל ריצה = קובץ-PDF אחד (לגרירה ישירה לאפוגי), לא עמודים בודדים בתיקייה ──
    //    סדר-העמודים וסט-העמודים זהים לקודם; רק האריזה השתנתה (מיזוג במקום פיצול).
    // שם-הבסיס מגיע כבר מוכן מ-jobName (שם-עיתון + גיליון [+ ריצה]) — מקור-אמת יחיד
    const safe = s => String(s || '').replace(/[\\/:*?"<>|]/g, '_').trim();
    const baseName = safe(proof.title || 'חוברת');
    const built = [];
    for (const run of runs) {
      btn.textContent = `בונה ריצה ${run.num}/${runs.length}…`;
      const out = await PDFLib.PDFDocument.create();
      const idxs = run.pages.filter(sp => sp <= total).map(sp => sp - 1);
      if (!idxs.length) continue;
      const copied = await out.copyPages(src, idxs);      // קריאה-אחת → משאבים משותפים לא משוכפלים
      copied.forEach(pg => out.addPage(pg));
      built.push({ num: run.num, label: run.label, bytes: await out.save() });
    }
    if (!built.length) throw new Error('לא נוצרו עמודים');
    if (built.length === 1) {                              // ריצה אחת → הורדה ישירה, בלי ZIP
      const r = built[0];
      downloadBlob(new Blob([r.bytes], { type: 'application/pdf' }), `${baseName} — ריצה ${r.num} (עמ ${r.label}).pdf`);
    } else {
      btn.textContent = 'בונה ZIP…';
      const zip = new JSZip();
      built.forEach(r => zip.file(`${baseName} — ריצה ${r.num} (עמ ${r.label}).pdf`, r.bytes));   // שטוח: קובץ לכל ריצה
      downloadBlob(await zip.generateAsync({ type: 'blob' }), `${baseName} — ${built.length} ריצות.zip`);
    }
    // סימון "הריצות הורדו" — מכבה את התראת האישור באפליקציה
    try {
      if (proof.jobId) {
        const p2 = proof.partId ? `customerProofs/${proof.jobId}/parts/${proof.partId}` : `customerProofs/${proof.jobId}`;
        _au(`${_FBURL}/${p2}.json`).then(u => fetch(u, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ runsDownloadedAt: Date.now() }) }));
      }
    } catch(e){}
    btn.textContent = '✓ הורד';
    setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 2500);
  } catch (e) {
    console.error(e); alert('שגיאה בייצור ריצות: ' + e.message);
    btn.textContent = old; btn.disabled = false;
  }
}

// ── עזרים ──
/* שם העבודה להורדה — מקור-אמת יחיד לכל כפתורי-ההורדה בדף (ולשם-הבסיס של הריצות):
   שם-הלקוח · שם-העבודה · גיליון N · שם-הריצה. שם-הלקוח נכנס כי בפועל כותרות
   העבודה הן לעיתים "גיליון 275" בלבד — ובתיקיית-ההורדות אי-אפשר לדעת של מי.
   אם הכותרת כבר מכילה את שם-הלקוח, לא מכפילים. השדות issue/issueNo/edition הם
   אותו נתון בשמות שונים לפי מקור-העבודה, ולכן כולם נבדקים. */
/* החלטת בית-הדפוס על בקשת החלפת-עמודים. אישור פותח ללקוח חלון-עריכה של 48 שעות;
   דחייה/סגירה נועלת מיד. הכתיבה היא לצומת הבקשה בלבד — הקובץ שאושר לא נוגע. */
async function _psDecide(key, approve, btn){
  const [jobId, target] = String(key).split('|');
  const job = (_allRows || []).find(x => String(x.id) === String(jobId));
  const req = ((job && job.changeRequests) || {})[target];
  if (!req) { alert('הבקשה לא נמצאה — רעננו את המסך.'); return; }
  let note = '';
  if (!approve) {
    if (req.status === 'approved') { if (!confirm('לסגור את חלון העריכה של הלקוח?')) return; }
    else { note = prompt('סיבת הדחייה (תוצג ללקוח):', 'הקובץ כבר בהכנה לדפוס') || ''; if (note === null) return; }
  } else if (!confirm('לאשר ללקוח להחליף/למחוק עמודים? חלון העריכה ייפתח ל-48 שעות.')) return;
  const who = 'בית הדפוס';
  const next = approve ? PageSwap.approve(req, { at: Date.now(), by: who })
                       : PageSwap.reject(req, { at: Date.now(), by: who, note: note });
  btn.disabled = true; btn.textContent = '…';
  try {
    await fetch(await _au(`${_FBURL}/${PageSwap.requestPath(jobId, target)}.json`),
      { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(next) });
    await loadProofs();
  } catch(e){ alert('העדכון נכשל: ' + (e.message||e)); btn.disabled = false; }
}

/* ── עדכון הלקוח שהעבודה מוכנה (בקשת-משתמש 2026-07-30) ─────────────────────
   בסימון עבודה כהושלמה, שואלים את המנהל/קדם-דפוס אם לעדכן את הלקוח. "כן" מסמן
   readyNotice על הרשומה — הפורטל של הלקוח מציג "✅ העבודה מוכנה". בנוסף אפשר
   להודיע מיד בוואטסאפ/מייל (הדרך הנוספת מעבר לפורטל). */
function _waNorm(ph){ var d=String(ph||'').replace(/\D/g,''); if(!d) return ''; if(d.indexOf('972')===0) return d; if(d[0]==='0') return '972'+d.slice(1); return d; }
async function _readyPatch(id, method){
  var who = 'בית הדפוס';
  await fetch(await _au(`${_FBURL}/customerProofs/${id}.json`), { method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ readyNotice: { at: Date.now(), by: who, method: method||'portal' } }) });
}
function _readyMsg(p){
  var nm = (p && (p.title || p.customer)) || 'העבודה';
  return 'שלום,\nהעבודה "' + nm + '" מוכנה בבית הדפוס סולן. ניתן לתאם איסוף/משלוח.\nתודה!';
}
function _askNotifyReady(p){
  var ex = document.getElementById('notifyReadyModal'); if (ex) ex.remove();
  var ov = document.createElement('div'); ov.id='notifyReadyModal';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100060;display:flex;align-items:center;justify-content:center;padding:16px;direction:rtl';
  var nm = escapeHtml(p.title || p.customer || 'העבודה');
  ov.innerHTML = '<div style="background:#fff;border-radius:14px;max-width:460px;width:100%;font-family:Heebo,sans-serif;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)">'
    + '<div style="background:var(--green);color:#fff;padding:13px 16px;font-weight:800">✅ "'+nm+'" סומנה כהושלמה</div>'
    + '<div style="padding:16px">'
    + '<div style="font-weight:700;margin-bottom:4px">לעדכן את הלקוח שהעבודה מוכנה?</div>'
    + '<div style="font-size:.84rem;color:#6b7280;margin-bottom:14px">"כן" יציג ללקוח בפורטל שהעבודה מוכנה. אפשר גם להודיע מיד בוואטסאפ/מייל.</div>'
    + '<div style="display:flex;flex-direction:column;gap:8px">'
    + '<button id="nrPortal" class="btn" style="background:var(--green)">✅ עדכן בפורטל שהעבודה מוכנה</button>'
    + '<button id="nrWa" class="btn ghost">🟢 עדכן + שלח וואטסאפ</button>'
    + '<button id="nrMail" class="btn ghost">✉️ עדכן + שלח מייל</button>'
    + '<button id="nrSkip" class="btn ghost" style="color:#6b7280">דלג — לא לעדכן</button>'
    + '</div></div></div>';
  document.body.appendChild(ov);
  var close=function(){ ov.remove(); };
  ov.addEventListener('click', function(e){ if(e.target===ov) close(); });
  var done=function(method){ _readyPatch(p.id, method).then(loadProofs).catch(function(){}); };
  document.getElementById('nrPortal').onclick=function(){ done('portal'); close(); msg('✓ הלקוח יראה בפורטל שהעבודה מוכנה'); };
  document.getElementById('nrWa').onclick=function(){
    done('whatsapp');
    var ph = prompt('מספר טלפון של הלקוח (וואטסאפ):', p.phone || p.customerPhone || '');
    if (ph){ var intl=_waNorm(ph); window.open('https://wa.me/'+intl+'?text='+encodeURIComponent(_readyMsg(p)), '_blank'); }
    close();
  };
  document.getElementById('nrMail').onclick=function(){
    done('email');
    var em = prompt('כתובת המייל של הלקוח:', p.email || p.customerEmail || '');
    if (em){ window.open('mailto:'+encodeURIComponent(em)+'?subject='+encodeURIComponent('העבודה מוכנה — סולן הדפסות')+'&body='+encodeURIComponent(_readyMsg(p)), '_blank'); }
    close();
  };
  document.getElementById('nrSkip').onclick=close;
}

function jobName(p, partName) {
  p = p || {};
  const cust = String(p.customer || '').trim(), title = String(p.title || '').trim();
  const issue = p.issue || p.issueNo || p.edition || '';
  const head = title ? ((cust && title.indexOf(cust) < 0) ? (cust + ' — ' + title) : title)
                     : (cust || 'עיתון');
  return [head, issue ? ('גיליון ' + issue) : '', partName || ''].filter(Boolean).join(' — ');
}
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }
function downloadBlob(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
// מציג את הקישור (תמיד ניתן להעתיק, גם בתוך iframe) וגם מנסה להעתיק אוטומטית.
async function shareLink(url) {
  try { await navigator.clipboard.writeText(url); } catch (e) {}
  prompt('קישור ללקוח — העתק (Ctrl+C) ושלח:', url);
}

async function copyText(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch (e) {
    try { const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove(); } catch (e2) {}
  }
  const t = btn.textContent; btn.textContent = ok ? '✓' : '⚠️';
  setTimeout(() => btn.textContent = t, 1200);
}

// יצירת הזמנה ללקוח — רשומה ריקה + קישור להעלאה
$('invite').onclick = async () => {
  const customer = prompt('שם הלקוח (עיתון):');
  if (!customer || !customer.trim()) return;
  const title = prompt('שם העבודה (אופציונלי):') || '';
  // גודל נדרש לעמוד (מ"מ) — הלקוח יקבל אזהרה אם יעלה בגודל אחר.
  // גדלי העיתונים הרגילים שלנו מוצעים כבחירה מהירה לפי מספר; אפשר גם להקליד גודל מותאם.
  const PRESETS = [
    { label: 'עיתון רגיל 16.5×24 ס"מ', w: 165, h: 240 },
    { label: '24×33 ס"מ',             w: 240, h: 330 },
    { label: 'A4 (21×29.7)',          w: 210, h: 297 },
    { label: 'A5 (14.8×21)',          w: 148, h: 210 },
    { label: 'A3 (29.7×42)',          w: 297, h: 420 },
    { label: 'טאבלויד 28×40 ס"מ',     w: 280, h: 400 },
  ];
  const menu = 'גודל עמוד נדרש — בחר/י מספר מהרשימה,\nאו הקלד/י גודל מותאם במ"מ (רוחב x גובה, למשל 330x500),\nאו השאר/י ריק לדילוג:\n\n'
    + PRESETS.map((p,i)=>`${i+1}. ${p.label}  (${p.w}×${p.h} מ"מ)`).join('\n');
  /* גיליון קודם של אותו לקוח = ברירת-המחדל. באג שתוקן (2026-07-30): גיליון חדש
     שנוצר בלי גודל גרם ל-proof-client לנחש 16 עמ' בגיליון, ושבועון 16.5×24 עם
     96 עמ' התחלק ל-6 ריצות של 16 במקום 3 של 32. */
  const prevOf = (function(){
    try {
      const mine = _allRows.filter(r => r && String(r.customer||'').trim() === customer.trim()
                                        && (+r.reqW > 0) && (+r.reqH > 0))
                           .sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
      return mine[0] || null;
    } catch(e){ return null; }
  })();
  const prevIdx = prevOf ? PRESETS.findIndex(p => p.w === +prevOf.reqW && p.h === +prevOf.reqH) : -1;
  const dflt = prevOf ? (prevIdx >= 0 ? String(prevIdx + 1) : (prevOf.reqW + 'x' + prevOf.reqH)) : '1';
  const sizeRaw = (prompt(menu + (prevOf ? ('\n\nבגיליון הקודם של ' + customer.trim() + ': '
                    + prevOf.reqW + '×' + prevOf.reqH + ' מ"מ (מוצע כברירת-מחדל)') : ''), dflt) || '').trim();
  let reqW = 0, reqH = 0;
  const pick = /^\d{1,2}$/.test(sizeRaw) ? PRESETS[+sizeRaw - 1] : null;
  if (pick) { reqW = pick.w; reqH = pick.h; }
  else {
    const m = sizeRaw.replace(',', '.').match(/(\d+(?:\.\d+)?)\s*[xX*×]\s*(\d+(?:\.\d+)?)/);
    if (m) { reqW = +m[1]; reqH = +m[2]; }
  }
  // ס"מ→מ"מ: מי שהקליד "16.5x24" התכוון ל-165×240
  if (reqW > 0 && reqW < 60) reqW = Math.round(reqW * 10);
  if (reqH > 0 && reqH < 60) reqH = Math.round(reqH * 10);
  if (!reqW || !reqH){
    if (!confirm('לא הוגדר גודל עמוד.\n\nבלי גודל, חלוקת הריצות בצד הלקוח לא תיקבע אוטומטית\n'
               + '(הלקוח יידרש לבחור כמה עמודים בגיליון).\n\nלהמשיך בלי גודל?')) return;
  }
  const id = crypto.randomUUID?.() || (Date.now().toString(36) + Math.random().toString(36).slice(2));
  msg('יוצר…');
  await fetch(await _au(`${_FBURL}/customerProofs/${id}.json`), {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: 'awaiting_upload', customer: customer.trim(), title: title.trim(), reqW, reqH, createdAt: Date.now() }),
  });
  const base = location.href.replace(/[^/]+(\?.*)?$/, '');
  const link = `${base}proof-client.html?id=${id}`;
  await loadProofs();
  prompt('הקישור ללקוח (העתק ושלח):', link);
};

// ── ניצול אחסון ──
const STORAGE_LIMIT_GB = 5;   // תקרה לתצוגה (שנה לפי התוכנית שלך)
// ── ניצול-אחסון + פינוי-אוטומטי בהתמלאות (בקשת-משתמש 2026-07-30) ──────────────
// המדידה מבוססת על סכום ה-fileSize שנשמר בכל רשומה (הערכה — לא מדידת-באקט מדויקת).
const _CAP_BYTES = () => STORAGE_LIMIT_GB * 1073741824;
function _proofsMap(){ const m={}; (_allRows||[]).forEach(p=>{ if(p&&p.id) m[p.id]=p; }); return m; }
function _usageBytes(){ if(!window.StorageCleanup) return 0; return StorageCleanup.totalBytes(StorageCleanup.recordFiles(_proofsMap())); }
function _renderUsage(total){
  const u = $('usage'); if(!u) return;
  const gb = total/1073741824, mb = total/1048576;
  const pct = Math.min(100, Math.round(gb / STORAGE_LIMIT_GB * 100));
  const color = pct >= 85 ? '#dc2626' : pct >= 60 ? '#d97706' : '#16a34a';
  const near = pct >= 85;
  u.innerHTML = `<div style="background:#fff;border:1.5px solid ${near?'#fca5a5':'var(--line)'};border-radius:10px;padding:12px 14px;margin:4px 0">
    <b>ניצול אחסון:</b> ${mb.toFixed(0)} MB (${gb.toFixed(2)} GB) · ${pct}% מתוך ${STORAGE_LIMIT_GB}GB
    <div style="height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px">
      <div style="height:100%;width:${pct}%;background:${color}"></div></div>
    <div style="font-size:.78rem;color:#6b7280;margin-top:5px">${near?'⚠️ האחסון כמעט מלא — ':''}פינוי משחרר את הקבצים הישנים ביותר של עבודות שהושלמו.
      <button id="freeSpaceBtn" style="margin-inline-start:6px;padding:4px 12px;font-size:.8rem;background:${near?'#dc2626':'#fff'};color:${near?'#fff':'var(--press)'};border:1.5px solid ${near?'#dc2626':'var(--line)'};border-radius:8px;cursor:pointer;font-weight:700">🧹 פנה מקום</button></div>
  </div>`;
  const b = document.getElementById('freeSpaceBtn'); if(b) b.onclick = () => _offerCleanup(total);
}
$('usageBtn').onclick = () => _renderUsage(_usageBytes());

// מחיקת קובץ בודד מ-Storage (פינוי אמיתי — לא סל-מיחזור, שהמקום ישתחרר)
async function _storageDelete(path){
  if(!path) return false;
  try {
    const r = await fetch(await _au(`https://firebasestorage.googleapis.com/v0/b/solan-printing.firebasestorage.app/o/${encodeURIComponent(path)}`), { method:'DELETE' });
    return r.ok || r.status === 404;   // 404 = כבר לא קיים = נחשב הצלחה
  } catch(e){ return false; }
}

// מודל-אישור לפני פינוי — "ההודעה למנהל לפני הפעולה". אף פעם לא מוחק בלי אישור.
function _offerCleanup(total){
  if(!window.StorageCleanup){ alert('רכיב הפינוי לא נטען — נסו לרענן.'); return; }
  const files = StorageCleanup.recordFiles(_proofsMap());
  const sel = StorageCleanup.selectForPurge(files, { used: total, cap: _CAP_BYTES(), now: Date.now() });
  const ex = document.getElementById('cleanupModal'); if(ex) ex.remove();
  const ov = document.createElement('div'); ov.id='cleanupModal';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100070;display:flex;align-items:center;justify-content:center;padding:16px;direction:rtl';
  const list = sel.toPurge;
  const body = !list.length
    ? `<div style="padding:16px">אין כרגע קבצים ישנים של עבודות שהושלמו לפינוי (הקבצים החדשים/פעילים מוגנים).</div>`
    : `<div style="padding:16px">
        <div style="margin-bottom:8px">כדי לרדת מ-<b>${StorageCleanup.pct(StorageCleanup.usageRatio(sel.before,sel.cap))}</b> ל-<b>~${StorageCleanup.pct(StorageCleanup.usageRatio(sel.after,sel.cap))}</b> יפונו <b>${list.length}</b> קבצים ישנים של עבודות שהושלמו (${StorageCleanup.fmtSize(sel.freed)}):</div>
        <div style="max-height:40vh;overflow:auto;border:1px solid var(--line);border-radius:8px">
          <table style="box-shadow:none"><thead><tr><th>לקוח / עבודה</th><th>גודל</th><th>גיל</th></tr></thead><tbody>
          ${list.map(f=>{ const age=Math.round((Date.now()-f.at)/86400000); return `<tr><td>${escapeHtml(f.customer||'')}${f.title?' · '+escapeHtml(f.title):''}${f.partId?' (ריצה)':''}</td><td style="white-space:nowrap">${StorageCleanup.fmtSize(f.size)}</td><td style="white-space:nowrap">${age} ימים</td></tr>`; }).join('')}
          </tbody></table></div>
        <div style="font-size:.8rem;color:#b45309;margin-top:8px">⚠️ הקבצים יימחקו לצמיתות מהאחסון (לא לסל-המיחזור). רשומת-העבודה נשמרת לתיעוד.</div>
      </div>`;
  ov.innerHTML = `<div style="background:#fff;border-radius:14px;max-width:560px;width:100%;font-family:inherit;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)">
    <div style="background:var(--press);color:#fff;padding:13px 16px;font-weight:800">🧹 פינוי אחסון</div>
    ${body}
    <div style="padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start">
      ${list.length?`<button id="clDo" class="btn" style="background:#dc2626">מחק ${list.length} קבצים · פנה ${StorageCleanup.fmtSize(sel.freed)}</button>`:''}
      <button id="clCancel" class="btn ghost">סגור</button>
    </div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e=>{ if(e.target===ov) ov.remove(); });
  document.getElementById('clCancel').onclick=()=>ov.remove();
  const doBtn=document.getElementById('clDo');
  if(doBtn) doBtn.onclick=async()=>{
    doBtn.disabled=true; doBtn.textContent='מפנה…';
    let done=0;
    for(const f of list){
      const okDel = await _storageDelete(f.path);
      if(okDel){
        const base = f.partId ? `customerProofs/${f.proofId}/parts/${f.partId}` : `customerProofs/${f.proofId}`;
        try { await fetch(await _au(`${_FBURL}/${base}.json`), { method:'PATCH', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ fileUrl:null, filePath:null, fileSize:null, pagesUrl:null, filePurgedAt: Date.now() }) }); } catch(e){}
        done++;
      }
    }
    ov.remove();
    await loadProofs();
    _renderUsage(_usageBytes());
    msg(`🧹 פונו ${done} קבצים`);
  };
}

// בדיקה אוטומטית בטעינה: אם מעל הסף — הודעה+הצעת-פינוי למנהל (פעם אחת לסשן, לא מטריד שוב ושוב)
function _storageAutoCheck(){
  try {
    if (!window.StorageCleanup) return;
    if (sessionStorage.getItem('solanStorageNagged') === '1') return;
    const total = _usageBytes();
    if (StorageCleanup.needsCleanup(total, _CAP_BYTES())) {
      sessionStorage.setItem('solanStorageNagged','1');
      _renderUsage(total);
      _offerCleanup(total);
    }
  } catch(e){}
}

$('refresh').onclick = loadProofs;
$('trashBtn').onclick = openTrash;
loadProofs().then(function(){ setTimeout(_storageAutoCheck, 1500); });
</script>
