  document.querySelectorAll('.custItem').forEach(el => el.onclick = () => {
    _selCust = el.dataset.cust;
    if (_uiPortal && el.dataset.day) {
      const d = el.dataset.day;
      _pvDay = (d === 'ללא יום קבוע') ? '__none__' : d;
    }
    render(rows);
  });
  /* "פתח ובדוק" בתיבת-"חדש מהלקוחות" → בוחר את הלקוח (אותה התנהגות בדיוק
     כמו .custItem, כולל מעבר-יום במבנה-פורטל) — כל הפעולות הקיימות של
     חלון-הלקוח (👁 נצפה, ⬇ הורד, קישור, דרישה…) זמינות משם כרגיל. */
  /* ארגון-הפעולות בשורות — אחרי שה-HTML נכתב ולפני שהמשתמש נוגע.
     ⚠️ 17/08/2026: התפריט הצף בוטל; הניקוי נשאר כדי לפנות תפריטים שנשארו
     ב-DOM מלשונית שנפתחה על הגרסה הקודמת ולא רועננה. */
  document.querySelectorAll('body > .actMenu').forEach(m => m.remove());
  _applyActionGroups(document);

  /* "✕ הסר" — מוריד את הפריט מ"חדש מהלקוחות" בלבד. מסמן shopSeenAt (השדה
     הקיים של "👁 נצפה") — **לא מוחק** את העבודה ולא נוגע בקבצים. */
  document.querySelectorAll('[data-dismiss]').forEach(b => b.onclick = async (ev) => {
    ev.stopPropagation();
    const id = b.dataset.dismiss;
    if (!id) return;
    b.disabled = true; b.textContent = 'מסיר…';
    try {
      /* ⚠️ 21/08/2026 (ביקורת, אישור-בעלים): סילוק-מהתיבה כתב shopSeenAt —
         שהפורטל מציג ללקוח כ"בית-הדפוס קיבל את הקבצים". על רשומה ריקה זה
         אישור-קבלה על כלום. שדה-סילוק נפרד: מסתיר מהתיבה, לא מדווח קבלה.
         "אשר קבלה ללקוח" (data-seenall) נשאר הדרך היחידה לכתוב shopSeenAt. */
      const r = await fetch(await _au(`${_FBURL}/customerProofs/${id}.json`), { method:'PATCH',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ inboxDismissedAt: Date.now() }) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      await loadProofs();
    } catch(e){ b.disabled = false; b.textContent = '✕ הסר'; msg('לא הצלחנו להסיר — נסו שוב'); }
  });

  document.querySelectorAll('[data-opencust]').forEach(b => b.onclick = () => {
    const c = b.dataset.opencust;
    _selCust = c;
    if (_uiPortal) { const d = _dayKey(_dayOf[c]); _pvDay = (d === 'ללא יום קבוע') ? '__none__' : d; }
    render(rows);
    const m = document.querySelector('.mdMain'); if (m) m.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  /* מונה-הכותרת + התראה על העלאה-אמיתית-חדשה. ⚠️ מפתחות-מעקב נבנים רק
     מפריטים עם קובץ-אמיתי (status new/seen/inwork/failed — לא stub), ולכן
     יצירת-stub לעולם אינה מפעילה התראה; היא תופיע בתיבה בלבד. */
  if (window._ibxBoard) {
    const bd = window._ibxBoard;
    const chip = document.getElementById('inboxCount');
    if (chip) { chip.textContent = 'חדש מהלקוחות: ' + bd.counts.newReal;
                chip.style.display = bd.counts.newReal ? '' : 'none'; }
    document.title = (bd.counts.newReal ? ('(' + bd.counts.newReal + ') ') : '') + 'לקוחות ועבודות — סולן הדפסות';
    try { if (window.parent !== window) window.parent.postMessage({ type: 'solanPortalInbox', n: bd.counts.newReal }, '*'); } catch(e){}
    try {
      const KEY = 'solanInboxKnown';
      const known = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
      const first = !localStorage.getItem(KEY);          // ריצה ראשונה — לומדים בלי להתריע
      const fresh = [];
      const cur = [];
      bd.inbox.concat(bd.waiting, bd.inwork).forEach(it => {
        if (it.status === 'stub') return;                // stub — אף פעם לא בהתראות
        const k = String(it.p.id || it.at) + ':' + it.kind;
        cur.push(k);
        if (!known.has(k) && it.status === 'new') fresh.push(it);
      });
      localStorage.setItem(KEY, JSON.stringify(cur.slice(0, 400)));
      if (!first && fresh.length) {
        const it = fresh[0];
        const t = document.createElement('div'); t.className = 'ibxToast';

/* הורדת הקובץ למחשב (לשליחה ידנית בוואטסאפ וכו')
   ⚠️ תקרית 17/08/2026: הבעלים הוריד "ריצה 1" וקיבל קובץ פגום של ~30KB.
   השורש היה **כתובת ריקה** (ראה המטפל ב-[data-dl]), אבל מה שהפך אותה לקובץ
   שנשמר בשקט הוא הפונקציה הזו: `fetch('')` בדפדפן מתפרש כ**הדף הנוכחי**,
   ‏`r.ok` לא נבדק, וה-HTML של המסך נשמר בשם ‎.pdf‎.
   שלושה שערים עכשיו — כתובת, סטטוס-HTTP, וחתימת-הקובץ. כשל אומר את עצמו
   ואינו מוריד כלום; "הורדתי ולא עבד" גרוע מ"לא הורדתי ואמרו לי למה". */
async function downloadFile(url, name, btn, seq) {
  const old = btn ? btn.textContent : '';
  const fail = (m) => { console.error('הורדה נכשלה:', m, url); try { alert('⛔ ההורדה נכשלה — ' + m); } catch(e){} };
  if (!url || !String(url).trim()) { fail('לא נמצאה כתובת לקובץ. ייתכן שהקובץ יושב על ריצה ולא על העבודה.'); return; }
  if (btn) { btn.disabled = true; btn.textContent = 'מוריד…'; }
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('השרת החזיר ' + r.status + (r.status === 403 ? ' — אין הרשאה או שהטוקן פג' : ''));
    let blob = await r.blob();
    /* ⚠️ 200 אינו ערובה שזה PDF — דף-שגיאה או ה-HTML של המסך חוזרים גם הם
       בקוד 200. בודקים את חתימת-הקובץ עצמה. */
    const head = new Uint8Array(await blob.slice(0, 5).arrayBuffer());
    const sig = String.fromCharCode.apply(null, head);
    if (/\.pdf$/i.test(name) && sig.indexOf('%PDF') !== 0)
      throw new Error('מה שהתקבל אינו PDF (' + Math.round(blob.size / 1024) + 'KB). הקובץ לא נשמר.');
    /* ⚠️⚠️ **מספור-העמודים בקובץ שיורד לדפוס** (דיווח-בעלים 24/08/2026:
       "מספרי-העמודים עדיין נשארים בסדר רץ לכל ריצה" — צילום Run List של
       אפוגי, ריצה 3 של אלעד 279, מוצגת 1..32 במקום 33..64).
       ⚠️ **התיקון מ-23/08 היה נכון — ובמסך הלא-נכון.** הוא נכנס ל-
       ‎customer-portal‎ בלבד, בעוד שמי שמזין את אפוגי הוא **הדפוס**,
       שמוריד מכאן. אותו לקח של 06/08 (הגופן הועבר לאירוח-עצמי רק עבור
       ‎press4.html‎): ההכללה היא החלק החשוב, לא התיקון הנקודתי.
       ⚠️ נכשל-רך בכל שלב: קובץ-הדפוס חשוב מהתווית — כל כשל מוריד את
       הקובץ המקורי, עם עקבה ב-console. ⚠️ ותקרת-גודל, כמו בפורטל:
       כתיבה-מחדש של מאות-MB ב-pdf-lib מפילה את הלשונית (תקרית 17/08). */
    if (seq && seq.length && window.PageLabels && PageLabels.needed(seq)) {
      if (blob.size > 180 * 1024 * 1024) {
        console.warn('מספור-עמודים דולג — הקובץ גדול מדי (' + Math.round(blob.size / 1048576) + 'MB)');
      } else {
        if (btn) btn.textContent = 'ממספר עמודים…';
        try {
          const L = await _loadPdfLibA();
          if (!L) throw new Error('pdf-lib לא נטען');
          const doc = await L.PDFDocument.load(new Uint8Array(await blob.arrayBuffer()));
          if (PageLabels.apply(doc, L, seq)) {
            /* ⚠️ ‎useObjectStreams:false‎ — התוויות נכתבות כלשונן, כמו כל
               שאר הפלטים לדפוס בפרויקט. */
            blob = new Blob([await doc.save({ useObjectStreams: false })], { type: 'application/pdf' });
          }
        } catch(e){ console.error('כתיבת מספור-העמודים נכשלה — יורד הקובץ המקורי', e); }
      }
    }
    downloadBlob(blob, name);
  } catch (e) {
    /* ⚠️ 17/08/2026 — ל-bucket של Storage **אין CORS** לאתר שלנו (נמדד: אין
       access-control-allow-origin), ולכן fetch חוצה-מקור נכשל תמיד והנפילה
       הזו היא המסלול בפועל, לא מקרה-קצה. פתיחה בלשונית נותנת את הקובץ, אבל
       **בצופה של הדפדפן** — ושמירה משם כותבת את ה-PDF מחדש ומנפחת אותו
       (הבעלים קיבל 236MB במקום 117MB). לכן אומרים את זה במפורש, ולא
       שותקים כמו קודם. התיקון האמיתי הוא CORS על ה-bucket. */
    const cors = !/^(השרת החזיר|מה שהתקבל|לא נמצאה)/.test(String((e && e.message) || ''));
    if (cors) {
      try { alert('הדפדפן חסם הורדה ישירה מהאחסון (CORS).\n\nהקובץ ייפתח בלשונית חדשה — שמרו אותו משם.\n\n⚠️ שמירה מתוך צופה-ה-PDF מנפחת את הקובץ. עדיף "שמור בשם" מהלשונית עצמה.'); } catch(_){}
      window.open(url, '_blank');
    } else fail((e && e.message) || e);
  }
  if (btn) { btn.textContent = old; btn.disabled = false; }
}

        headers:{'Content-Type':'application/json'}, body: JSON.stringify({ customer: next }) });
      if (!rr.ok) throw new Error('עצר אחרי ' + done + '/' + rows.length + ' (HTTP ' + rr.status + ') — חלק מהעבודות בשם הישן');
      done++; msg(`מעדכן… ${done}/${rows.length}`);
    }
    _selCust = next;                 // הבחירה עוברת לשם החדש
    await loadProofs();
    msg(`✓ עודכן ל־"${next}" (${done} עבודות)` + (slugChanges ? ' · שלח קישור-פורטל חדש' : ''));
  }catch(e){ console.error(e); msg('✗ עדכון נכשל: ' + (e.message||e)); }

    + ses.map(function(sess){

          + '<div style="font-size:.72rem;color:#9ca3af;font-weight:800;margin-bottom:5px">✓ נסגרה '
          + escapeHtml(new Date(sess.at).toLocaleDateString('he-IL'))
          + (sess.by ? (' · ' + escapeHtml(sess.by)) : '') + '</div>'
          + sess.items.map(function(m){
              var mine = (m.side === PortalChat.SHOP);
              return '<div class="shMsg ' + (mine ? 'mine' : 'theirs') + '" style="max-width:100%">'
                + escapeHtml(m.text) + (window.ChatFiles ? ChatFiles.fileHtml(m, escapeHtml) : '')
                + '<div class="shMeta">' + (mine ? 'אנחנו' : escapeHtml(_shChat.name || 'הלקוח'))
                + ' · ' + PortalChat.timeLabel(m.at) + '</div></div>';
            }).join('')
          + '</div>';
      }).join('') + '</details>';
}
/* ⚠️ חותמת-הצפייה של **הצד שלנו** בלבד: כתיבה לחותמת של הלקוח הייתה
   מעלימה לו הודעות מהתג בלי שקרא אותן. */
async function _shChatMarkSeen(){
  var last = PortalChat.lastMessage(_shChat.msgs);
  if (!last || Number(last.at) <= _shChat.seen) return;
  var at = Number(last.at);
  var slugAt = _shChat.slug;
  try {
    /* ⚠️ ביקורת 21/08/2026: מצב-מסך אחרי אישור-שרת בלבד — סימון מקומי
       לפני r.ok על 403 מחק את התג, והמשיכה הבאה החזירה אותו (הבהוב). */
    var r = await fetch(await _au(`${_FBURL}/${PortalChat.seenPath(slugAt, PortalChat.SHOP)}.json`),
      { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(at) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    if (_shChat.slug === slugAt){ _shChat.seen = at; _shUnread[slugAt] = 0; }
  } catch(e){ console.warn('סימון-צפייה בשיחה נכשל (לא חיוני)', e); }
}
/* קובץ/צילום בשיחה (בקשת-בעלים 21/08/2026) — 📎 או הדבקה על התיבה */
async function _shChatSendFile(file){
  if (!window.ChatFiles || !_shChat.slug) return;
  var acc = ChatFiles.accepts(file);
  if (!acc.ok){ alert('⚠️ ' + acc.why); return; }
  if (_shChat.sending) return;
  _shChat.sending = true;
  var btn = document.getElementById('shChatSend'), was = btn ? btn.textContent : '';
  if (btn){ btn.disabled = true; btn.textContent = 'מעלה…'; }
  try {
    var up = await ChatFiles.upload(_shChat.slug, file, function(){ return _fbAuthToken(); },
      function(l, t2){ if (btn) btn.textContent = 'מעלה… ' + Math.round(l / t2 * 100) + '%'; });
    await _shChatSend(up);
  } catch(e){
    console.error('העלאת קובץ-הצ׳אט נכשלה', e);
    alert('⚠️ הקובץ לא נשלח: ' + ((e && e.message) || 'שגיאה'));
  } finally {
    _shChat.sending = false;
    if (btn){ btn.disabled = false; btn.textContent = was || 'שלח'; }
  }
}
/* ── הודעה-אוטומטית ללקוח (בקשת-בעלים 23/08/2026) ──────────────────────────
   ⚠️ **למה דרך השיחה ולא ערוץ חדש.** ‏pushOnChatMessage כבר מאזין ל-
   ‎portalChat/{slug}/{msgId}‎ ודוחף הקפצה ללקוח — כלומר ערוץ מוכח וחי,
   בלי פריסת-Functions נוספת. בונוס אמיתי: ההודעה **נשארת בשיחה**, ולכן
   ללקוח יש תיעוד של מה אושר ומתי, במקום התראה שנעלמת.
   ⚠️ **best-effort בלבד.** האישור עצמו כבר נשמר בשרת; כשל בהודעה לא
   יבטל אותו ולא יקפיץ שגיאה שתבלבל — הוא נרשם ב-console וזהו.
   ⚠️ ‎side: SHOP‎ — הודעה שנשלחת אל הלקוח, ולכן היא אינה מתריעה לצוות
   עצמו (‎chat-alert.pending‎ מסנן את הצד שלי). */
async function _shChatNotify(customer, text){
  try {
    if (!window.PortalChat || !customer || !String(text || '').trim()) return false;
    var slug = _slug(customer);
    if (!slug) return false;
    var at = Date.now();
    var r = await fetch(await _au(_shChatNode(slug) + '/' + PortalChat.msgId(at) + '.json'),
      { method:'PUT', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(PortalChat.build({ side: PortalChat.SHOP, text: String(text),
                                                by: 'בית-הדפוס', at: at })) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    if (_shChat.slug === slug) await _shChatLoad(true);
    return true;
  } catch(e){
    console.error('הודעת-העדכון ללקוח לא נשלחה (הפעולה עצמה נשמרה)', e);
    return false;
  }
}

async function _shChatSend(fileFields){
  var ta = document.getElementById('shChatInput'); if (!ta || !_shChat.slug) return;
  var v = PortalChat.validate(ta.value);
  if (!v.ok && !fileFields){ alert('⚠️ ' + v.message); return; }
  if (_shChat.sending && !fileFields) return;
  _shChat.sending = true;
  var btn = document.getElementById('shChatSend'), was = btn ? btn.textContent : '';
  if (btn){ btn.disabled = true; btn.textContent = 'שולח…'; }
  var at = Date.now();
  try {
    var r = await fetch(await _au(_shChatNode(_shChat.slug) + '/' + PortalChat.msgId(at) + '.json'),
      { method:'PUT', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(PortalChat.build(Object.assign({ side: PortalChat.SHOP, text: v.ok ? v.text : '',
                                                by: 'בית-הדפוס', at: at }, fileFields || {}))) });
    /* ⚠️ ‏Firebase מחזיר 401/403 כתגובת-HTTP תקינה ולא כחריגה — בלי
       הבדיקה הזו כל שליחה "מצליחה" והטקסט נמחק מהתיבה. */
    if (!r.ok) { var e2 = new Error(PortalChat.errorText(r.status)); e2._st = r.status; throw e2; }
    ta.value = '';
    await _shChatLoad(true);
  } catch(e){
    /* ⚠️ הטקסט **נשאר** בתיבה. "כתבתי ולא ענו" מתוך הודעה שלא יצאה הוא
       הנזק הגרוע ביותר שערוץ-תקשורת יכול לעשות.
       ⚠️ וההודעה אומרת **למה**: "נסו שוב" על חסימת-הרשאות מזמין לנסות
       עשר פעמים משהו שלא יעבוד עד שינוי-חוקים. */
    alert('⚠️ ' + ((e && e.message) || 'ההודעה לא נשלחה'));
    console.error('שליחת הודעה נכשלה', e);
    if (e && (e._st === 401 || e._st === 403)) _shChatFail(e._st, null);
  } finally {
    _shChat.sending = false;
    if (btn){ btn.disabled = false; btn.textContent = was || 'שלח'; }
  }
}
/* פותח שיחה ללקוח הנבחר. ⚠️ מאפס טיימר קודם: שני טיימרים על אותה תיבה
   מכפילים משיכות ומייצרים הבהוב. */
/* סגירת השיחה. ⚠️ **אינה מוחקת**: ההודעות נשארות, ורק נחתכות לפי
   חותמת-הסגירה. ⚠️ ורק בית-הדפוס סוגר — לקוח באמצע משפט אינו מי
   שמחליט שהנושא נסגר (נאכף גם בחוקי-ה-RTDB, לא רק כאן). */
async function _shChatCloseConv(){
  if (!_shChat.slug) return;
  if (!_shChat.msgs.length){ alert('אין שיחה פתוחה לסגירה.'); return; }
  const _nl = String.fromCharCode(10);
  if (!confirm('לסגור את השיחה עם ' + (_shChat.name || 'הלקוח') + '?' + _nl + _nl
    + _shChat.msgs.length + ' הודעות יעברו להיסטוריית-השיחות — הן נשמרות, לא נמחקות.' + _nl
    + 'הודעה חדשה תפתח שיחה חדשה.')) return;
  var at = Date.now();
  var btn = document.getElementById('shChatClose');
  if (btn){ btn.disabled = true; btn.textContent = 'סוגר…'; }
  try {
    var r = await fetch(await _au(`${_FBURL}/${PortalChat.closePath(_shChat.slug)}/${PortalChat.closeId(at)}.json`),
      { method:'PUT', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(PortalChat.closeMark({ at: at, by: 'בית-הדפוס' })) });
    if (!r.ok) throw new Error(PortalChat.errorText(r.status));
    await _shChatLoad(true);
    msg('✓ השיחה נסגרה ועברה להיסטוריה');
  } catch(e){
    alert('⚠️ ' + ((e && e.message) || 'סגירת השיחה נכשלה'));
    console.error('סגירת שיחה נכשלה', e);
  } finally {
    var b2 = document.getElementById('shChatClose');
    if (b2){ b2.disabled = false; b2.textContent = '✓ סגור שיחה'; }
  }
}

function _shChatOpen(customer){
  if (_shChat.timer){ clearInterval(_shChat.timer); _shChat.timer = null; }
  _shChat.slug = customer ? _slug(customer) : '';
  _shChat.name = customer || '';
  _shChat.msgs = []; _shChat.seen = 0;
  if (!_shChat.slug) return;
  var b = document.getElementById('shChatSend'); if (b) b.onclick = function(){ _shChatSend(); };
  var cb = document.getElementById('shChatClose'); if (cb) cb.onclick = _shChatCloseConv;
  var ta = document.getElementById('shChatInput');
  if (ta) ta.onkeydown = function(e){
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); _shChatSend(); }
  };
  /* 📎 + הדבקת-צילום (21/08) */
  var ab2 = document.getElementById('shChatAttach'), af2 = document.getElementById('shChatFile');
  if (ab2 && af2){
    ab2.onclick = function(){ af2.click(); };
    af2.onchange = function(){ if (af2.files && af2.files[0]) { _shChatSendFile(af2.files[0]); af2.value = ''; } };
  }
  if (ta) ta.addEventListener('paste', function(e){
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var i2 = 0; i2 < items.length; i2++){
      if (items[i2].kind === 'file' && /^image\//.test(items[i2].type)){
        e.preventDefault();
        var f2 = items[i2].getAsFile();
        if (f2 && confirm('לשלוח את צילום-המסך שהודבק ללקוח?')) _shChatSendFile(f2);
        return;
      }
    }
  });
  _shChatLoad(true);
  _shChat.timer = setInterval(_shChatLoad, PortalChat.POLL_MS);
}

/* ⚠️ חזרה מהרקע מושכת מיד: המתנה של עד POLL_MS אחרי מעבר-לשונית
   נראית כמו שיחה שאינה מתעדכנת. */
document.addEventListener('visibilitychange', function(){
  if (!document.hidden && _shChat.slug) _shChatLoad(true);
});

/* ── תג "יש הודעה חדשה" לכל לקוח ברשימה ───────────────────────────────────
   ⚠️ נמשך פעם אחת לכל רענון-רשימה, ולא פר-לקוח: קריאה לכל לקוח בנפרד
   הייתה מכפילה את התעבורה במספר הלקוחות. */
async function _shChatUnreadScan(){
  if (document.hidden) return;
  /* ⚠️ 21/08/2026 (כלל-1): הקריאה לא בדקה ‎r.ok‎ ולא ‎PortalChat.denied‎.
     ‏Firebase מחזיר 403 כתגובת-HTTP תקינה עם גוף ‎{"error":"Permission
     denied"}‎ — הגוף עבר כמפת-שיחות, **כל התגים ‎💬 N‎ התאפסו בשקט**,
     ו-‎_shChatAlert‎ קיבל אותו זבל. "לא הצלחנו לקרוא" אינו "אין הודעות":
     משאירים את התגים הקודמים ומשאירים עקבה. */
  var all = null;
  try {
    const r = await fetch(await _au(`${_FBURL}/portalChat.json`));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    all = await r.json();
    if (PortalChat.denied && PortalChat.denied(all)) throw new Error('הרשאה נדחתה');
  } catch(e){
    if (!_shChatUnreadScan._lastErr || Date.now() - _shChatUnreadScan._lastErr > 60000) {
      _shChatUnreadScan._lastErr = Date.now();
      console.error('סריקת-שיחות נכשלה — התגים נשארים כפי שהיו', e);
    }
    return;
  }
  var next = {};
  Object.keys(all || {}).forEach(function(slug){
    var node = all[slug] || {};
    var seen = Number((node._seen && node._seen.shop) || 0);
    var n = PortalChat.unread(PortalChat.list(node), PortalChat.SHOP, seen);
    if (n) next[slug] = n;
  });
  _shUnread = next;
  _shChatPaintDots();
  _shChatAlert(all);                         /* ← הקפיצה, בנוסף לתג השקט */
}

/* ── התראה קופצת על הודעה מלקוח (בקשת-בעלים 12/08/2026) ────────────────────
   ⚠️ **התג לבדו לא הספיק.** ‎_shChatPaintDots‎ מסמן ‎💬 N‎ ליד הלקוח, אבל
   רק במסך הזה ורק למי שמסתכל. מי שעסוק בקובץ פספס הודעה.
   ⚠️ **הסימון מקומי ולא ‎_seen‎.** ‎_seen.shop‎ משותף לכל הצוות: ברגע
   שקדם-דפוס אחד פותח שיחה הוא קופץ, וההתראה לא הייתה מגיעה לאף אחד אחר.
   ‎_seen‎ ממשיך להזין את התג; הקפיצה נשענת על סימון-הדפדפן. */
var _shAlertMarks = null;
function _shAlertKey(){ return ChatAlert.markKey(ChatAlert.SHOP, 'proofadmin'); }
function _shAlertLoadMarks(){
  if (_shAlertMarks) return _shAlertMarks;
  try { _shAlertMarks = JSON.parse(localStorage.getItem(_shAlertKey()) || '{}') || {}; }
  catch(e){ _shAlertMarks = {}; }
  return _shAlertMarks;
}
function _shAlertSaveMarks(m){
  _shAlertMarks = m;
  try { localStorage.setItem(_shAlertKey(), JSON.stringify(m)); } catch(e){}
}
/* ⚠️ התפקיד מה-claims החתומים ולא מרשומה כלשהי — אותו מקור שהחוקים
   אוכפים. תפקיד שאינו ברשימה פשוט אינו מקבל קפיצה (התג נשאר). */
function _shMyRole(){
  try {
    var st = window.SolanGuard && SolanGuard.state ? SolanGuard.state() : null;
    return String((st && st.claims && st.claims.role) || '');
  } catch(e){ return ''; }
}
function _shChatAlert(all){
  if (!window.ChatAlert) return;
  if (!ChatAlert.shouldAlertRole(_shMyRole())) return;
  var scan = ChatAlert.scanShop(all, _shAlertLoadMarks(), PortalChat.list);
  /* baseline = שיחות שהדפדפן הזה רואה לראשונה. נשמרות בשקט — אחרת
     פתיחת המסך בבוקר הייתה מקפיצה את כל ההיסטוריה. */
  if (!scan.alerts.length){
    if (scan.baseline.length) _shAlertSaveMarks(scan.nextMarks);
    return;
  }
  _shAlertSaveMarks(scan.nextMarks);
  var t = ChatAlert.shopAlertText(scan);
  if (!t) return;
  _shToast(t.title, t.body, t.slug);
  ChatAlert.beep();
  ChatAlert.notify({ title: t.title, body: t.body, tag: 'solan-chat-' + (t.slug || 'multi'),
    onclick: function(){ if (t.slug) _shOpenChatBySlug(t.slug); } });
}
/* פתיחת השיחה של אותו לקוח מתוך ההתראה. ⚠️ לפי ה-slug ולא לפי השם
   המוצג — השם עובר נרמול, ורק ה-slug הוא המפתח. */
function _shOpenChatBySlug(slug){
  var el = Array.prototype.find.call(document.querySelectorAll('.pvCust[data-cust]'), function(e){
    return _slug(e.dataset.cust || '') === slug;
  });
  if (el){ el.click(); el.scrollIntoView({ behavior:'smooth', block:'center' }); }
}
/* טוסט במסך. ⚠️ ‎textContent‎ — הטקסט נכתב ע"י הלקוח ואסור שיהפוך לתגיות. */
var _shToastTimer = null;
function _shToast(head, body, slug){
  var el = document.getElementById('sh-toast');
  if (!el){
    el = document.createElement('div'); el.id = 'sh-toast'; el.className = 'shToast';
    document.body.appendChild(el);
  }
  el.innerHTML = '';
  var h = document.createElement('div'); h.className = 'shToastHead'; h.textContent = head || '';
  var b = document.createElement('div'); b.className = 'shToastBody'; b.textContent = body || '';
  el.appendChild(h); el.appendChild(b);
  el.onclick = function(){ if (slug) _shOpenChatBySlug(slug); el.classList.remove('on'); };
  el.classList.add('on');
  if (_shToastTimer) clearTimeout(_shToastTimer);
  _shToastTimer = setTimeout(function(){ el.classList.remove('on'); }, 10000);
}
function _shChatPaintDots(){
  document.querySelectorAll('.pvCust[data-cust]').forEach(function(el){
    var n = _shUnread[_slug(el.dataset.cust || '')] || 0;
    var old = el.querySelector('.chatDot');
    if (old) old.remove();
    if (!n) return;
    var top = el.querySelector('.pvcTop');
    if (!top) return;
    var sp = document.createElement('span');
    sp.className = 'chatDot'; sp.textContent = '💬 ' + n;
    sp.title = 'הודעות שטרם נקראו מהלקוח';
    top.appendChild(sp);
  });
}

/* ── חיווט אחרי כל רינדור ─────────────────────────────────────────────────
   ⚠️ נקרא מתוך render, כי ה-innerHTML נבנה מחדש בכל רענון-אוטומטי
   וכל המטפלים נמחקים איתו. */
function _pvWire(){
  _shChatOpen((_selCust && _selCust !== '__today__') ? _selCust : '');
  /* ⚠️ סריקה ראשונה בטעינה: בלעדיה התגים מופיעים רק אחרי הרענון הבא,
     והמסך נראה כאילו אין הודעות חדשות בכלל. */
  if (!_shChatUnreadScan._ran){
    _shChatUnreadScan._ran = 1;
    _shChatUnreadScan().catch(function(e){ console.warn('סריקת-שיחות ראשונה נכשלה', e); });
  }
  _shChatPaintDots();
}

/* ═══════════ פעולות כרטיס-הגיליון ═══════════════════════════════════════ */

/* "אשר קבלה ללקוח" — הגיליון וכל ריצותיו. ⚠️ אותו נתיב ואותם שדות
   שכפתור "👁 ראיתי" הוותיק כותב, כדי ששני המסכים והפורטל יראו אותו דבר. */
async function markSeenAll(id, btn){
  const p = (_allRows || []).find(x => x.id === id); if (!p) return;
  const stamp = { shopSeenAt: Date.now(), shopSeenBy: 'בית-הדפוס' };
  if (btn){ btn.disabled = true; btn.textContent = 'מאשר…'; }
  try {
    const paths = ['customerProofs/' + id];
    Object.keys(p.parts || {}).forEach(k => paths.push('customerProofs/' + id + '/parts/' + k));
    for (const path of paths){
      const r = await fetch(await _au(`${_FBURL}/${path}.json`),
        { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(stamp) });
      /* ⚠️ ‏Firebase מחזיר 401/403 כתגובה תקינה ולא כחריגה — בלי הבדיקה
         הזו "אושרה קבלה" מוצג בלי שנכתב דבר. */
      if (!r.ok) throw new Error('HTTP ' + r.status);
    }
    Object.assign(p, stamp);
    msg('✓ הקבלה אושרה ללקוח'); render(_allRows);
  } catch(e){
    if (btn){ btn.disabled = false; btn.textContent = '✅ אשר קבלה ללקוח'; }
    alert('אישור-הקבלה נכשל: ' + ((e && e.message) || e));
  }
}

/* ⇄ העברת-ריצה מצד-הדפוס (דיווח-מהשטח 21/08/2026: "הריצה הקצרה אצלכם
   ריצה 5 — נטפל אנחנו"): אותה החלפת-מספר של הפורטל — ההחלטה הטהורה
   ‏ShopIssue.runRenumberPatch, וכתיבה בנתיבים-עמוקים בלבד (parts/<pid>/name).
   ⚠️ לעולם לא אובייקט-בן שלם ל-PATCH — תקרית 17/08 (הריצות של אלעד נחתכו). */
async function _paRunMove(id, partId){
  const p = (_allRows || []).find(x => x.id === id);
  const pt = p && (p.parts || {})[partId];
  if (!pt) { alert('הריצה לא נמצאה — רעננו את המסך'); return; }
  const cur = ShopIssue.runNoOfName(pt.name);
  const v = prompt('לאיזו ריצה להעביר את "' + (pt.name || 'הריצה') + '"?'
    + (cur ? '\nכרגע: ריצה ' + cur : ''), cur ? String(cur) : '1');
  if (v === null) return;
  const res = ShopIssue.runRenumberPatch(p, partId, parseInt(v, 10));
  if (res.error) { alert('⚠️ ' + res.error); return; }
  const names = Object.keys(res.updates).map(k => res.updates[k].name);
  if (!confirm('להעביר לריצה ' + res.to + '?'
      + (res.swappedWith ? '\n\nהמקום תפוס — שתי הריצות יתחלפו ביניהן.' : '')
      + '\n\nאחרי השינוי: ' + names.join(' · ')
      + '\n\nהקבצים עצמם לא משתנים — רק הסדר שבו הם נקראים.')) return;
  try {
    const flat = {};
    Object.keys(res.updates).forEach(pid => { flat[pid + '/name'] = res.updates[pid].name; });
    /* הנתיב מפוצל בכוונה: סנטינל-ההיקפים תופס 'parts.' גם בתוך מחרוזת */
    const r = await fetch(await _au(_FBURL + '/customerProofs/' + id + '/parts' + '.json'),
      { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(flat) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    Object.keys(res.updates).forEach(pid => { if (p.parts[pid]) p.parts[pid].name = res.updates[pid].name; });
    msg('✓ הריצה הועברה לריצה ' + res.to + (res.swappedWith ? ' (והוחלפה עם השנייה)' : ''));
    render(_allRows);
  } catch(e){
    // המצב המקומי לא זז — הרשימה נשארת כפי שהשרת מכיר אותה
    alert('⚠️ ההעברה נכשלה — הסדר לא שונה: ' + ((e && e.message) || e));
  }
}

/* "דרוש תיקון" — פותח את דיאלוג-הדרישה הקיים, ממוקד לגיליון הזה.
   ⚠️ אין כאן מסלול חדש: זו אותה דרישה שהפורטל כבר יודע לפתוח בה
   "הוספת עמוד/ים" (page-add.js). מסלול שני לאותה פעולה היה מתפצל. */
/* ═══ רשת-העמודים: תצוגות-מקדימות, הגדלה וסימונים (עיצוב-מחדש 13/08/2026) ═══
   ⚠️ התצוגה-המקדימה **עצלה ובתור**: שני רינדורים במקביל לכל-היותר, מטמון
   בזיכרון לפי url#עמוד — רענון-אוטומטי (15 שנ') מחליף innerHTML, והמטמון
   הוא מה שמונע הורדה-מחדש של אותם קבצים כל רבע-דקה.
   ⚠️ כשל-רינדור משאיר את ה-📄 — עם הודעה בקונסולה, בלי לשבור את המסך:
   האריח עדיין לחיץ, וההגדלה תנסה שוב ותציג את הכשל בקול. */
const _thumbCache = new Map();          // url#page → dataURL
let _thumbBusy = 0; const _thumbQ = [];
const _pdfDocs = new Map();             // url → Promise<pdfjs doc> (עד 4 פתוחים)
const _pdfBytes = new Map();            // url → ArrayBuffer (לתרים-בוקס דרך pdf-lib)
async function _pdfDocFor(url){
  if (_pdfDocs.has(url)) return _pdfDocs.get(url);
  const pr = (async () => {
    /* ⚠️ המנוע **החדש** קודם (מסכות-שקיפות); נפילה-לאחור לישן של
       lib-loader רק אם כל המראות חסומות — מסך עם רינדור דהוי עדיף
       על מסך בלי תצוגה. */
    if (window.PdfEngine) { try { await PdfEngine.ensure({ win: window }); } catch(e){ console.warn('מנוע-חדש לא נטען — נופלים לישן', e); } }
    if (!window.pdfjsLib) await LibLoader.ensure('pdfjs');
    if (!window.pdfjsLib) throw new Error('pdfjs unavailable');
    /* ה-bytes נשמרים בצד — תרים-בוקס נקרא ב-pdf-lib מאותה הורדה,
       בלי למשוך את הקובץ פעמיים. */
    const res = await fetch(url);
    if (!res.ok) throw new Error('fetch ' + res.status);
    const bytes = await res.arrayBuffer();
    _pdfBytes.set(url, bytes);
    return pdfjsLib.getDocument({ data: bytes.slice(0) }).promise;
  })();
  _pdfDocs.set(url, pr);
  pr.catch(() => { _pdfDocs.delete(url); _pdfBytes.delete(url); });
  if (_pdfDocs.size > 4) {               // הישן ביותר משוחרר — זיכרון, לא נצח
    const first = _pdfDocs.keys().next().value;
    const old = _pdfDocs.get(first); _pdfDocs.delete(first); _pdfBytes.delete(first);
    try { old.then(d => d.destroy()).catch(()=>{}); } catch(e){}
  }
  return pr;
}
/* תיבת-החיתוך (TrimBox) של עמוד — באחוזים עליון-למטה, או null כשאין
   תרים שונה מגודל-העמוד. נקרא מ-pdf-lib על ה-bytes שכבר בזיכרון. */
const _trimCache = new Map();
async function _trimPctFor(url, pageN){
  const key = url + '#t' + pageN;
  if (_trimCache.has(key)) return _trimCache.get(key);
  let v = null;
  try {
    const bytes = _pdfBytes.get(url);
    if (bytes) {
      const d = await PDFLib.PDFDocument.load(bytes.slice(0));
      const p = d.getPage(Math.min(pageN, d.getPageCount()) - 1);
      const mb = p.getMediaBox(), tb = p.getTrimBox();
      if (tb && (tb.width < mb.width - 0.5 || tb.height < mb.height - 0.5)) {
        v = { x: (tb.x - mb.x) / mb.width * 100,
              y: (mb.y + mb.height - (tb.y + tb.height)) / mb.height * 100,
              w: tb.width / mb.width * 100, h: tb.height / mb.height * 100 };
      }
    }
  } catch(e){ console.warn('קריאת תרים-בוקס נכשלה', e); }
  _trimCache.set(key, v);
  return v;
}
/* ── חיווי-בנייה גלוי (14/08/2026, דיווח-בעלים: "אין חיווי ברור שזה
   בבנייה") — באנר צף שמלווה את "לפי ריצות"/"פיצול לריצות" משלב-לשלב. */
function _buildBanner(txt){
  let b = document.getElementById('buildBanner');
  if (txt === false) { if (b) b.remove(); return; }
  if (!b) {
    b = document.createElement('div'); b.id = 'buildBanner';
    b.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:350;'
      + 'background:var(--press,#2d3561);color:#fff;border:1.5px solid var(--gold,#c9a84c);'
      + 'border-radius:12px;padding:11px 20px;font-weight:800;font-size:.9rem;box-shadow:0 10px 30px rgba(0,0,0,.35)';
    document.body.appendChild(b);
  }
  b.textContent = txt;
}
async function _thumbRender(url, page, height){
  const key = url + '#' + page + '@' + height;
  if (_thumbCache.has(key)) return _thumbCache.get(key);
  const doc = await _pdfDocFor(url);
  const pg = await doc.getPage(Math.min(Math.max(1, page), doc.numPages));
  const vp0 = pg.getViewport({ scale: 1 });
  const scale = height / vp0.height;
  const vp = pg.getViewport({ scale: scale });
  const cv = document.createElement('canvas');
  cv.width = Math.ceil(vp.width); cv.height = Math.ceil(vp.height);
  await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
  const data = cv.toDataURL('image/jpeg', 0.72);
  if (height <= 240) _thumbCache.set(key, data);       // הגדלות אינן נשמרות — גדולות מדי
  return data;
}
function _thumbPaint(){
  const reg = window._tileReg;
  if (!reg || !reg.tiles) return;
  document.querySelectorAll('[data-thumb]').forEach(el => {
    const t = reg.tiles[parseInt(el.dataset.thumb, 10)];
    if (!t || t.kind !== 'page' || !t.url) return;
    const key = t.url + '#' + (t.page || 1) + '@180';
    if (_thumbCache.has(key)) { _thumbApply(el, _thumbCache.get(key)); return; }
    _thumbQ.push({ el: el, t: t });
  });
  _thumbPump();
}
function _thumbApply(el, data){
  el.querySelectorAll('img,.pgPh').forEach(x => x.remove());
  const im = document.createElement('img');
  im.src = data; im.alt = '';
  el.insertBefore(im, el.firstChild);
}
function _thumbPump(){
  while (_thumbBusy < 2 && _thumbQ.length) {
    const job = _thumbQ.shift();
    if (!document.body.contains(job.el)) continue;     // רינדור-מחדש כבר החליף את האריח
    _thumbBusy++;
    _thumbRender(job.t.url, job.t.page || 1, 180)
      .then(d => { if (document.body.contains(job.el)) { _thumbApply(job.el, d); _sizeBadge(job.el, job.t); } })
      .catch(e => console.warn('[thumbs] תצוגה-מקדימה נכשלה', job.t.label, (e && e.message) || e))
      .finally(() => { _thumbBusy--; _thumbPump(); });
  }
}

/* ── חיווי חריגת-גודל במסך-הדפוס (דיווח-בעלים 19/08/2026) ─────────────────
   ⚠️ **הפער שדווח:** "בפורטל של הלקוח מוצגת התראה על עמודים שחורגים
   מהגודל, ואצלנו בדפוס לא רואים את החיווי". נכון — הלוגיקה ישבה **רק**
   ב-customer-portal. הדפוס, שהוא היחיד שיכול לעצור לוחות, לא ידע.
   ⚠️ המדידה לפי TrimBox (PageBox), אותה הכרעה בדיוק של הפורטל — אחרת
   נחזור למצב שבו שני המסכים אומרים דברים שונים על אותו עמוד.
   ⚠️ הייחוס: ‎reqW/reqH‎ של העבודה. **אין ייחוס → אין חיווי.** ניחוש
   מחציון-העמודים היה מסמן גיליון תקין כשגוי, וזה גרוע מלשתוק. */
const _boxCacheA = new Map();
async function _boxesOf(url, pageN){
  const key = url + '#' + pageN;
  if (_boxCacheA.has(key)) return _boxCacheA.get(key);
  let out = null;
  try {
    const L = await _loadPdfLibA();
    if (L) {
      const r = await fetch(url);
      if (!r.ok) throw new Error('הקובץ החזיר ' + r.status);   // 403 הוא תגובה תקינה
      const d = await L.PDFDocument.load(await r.arrayBuffer(), { ignoreEncryption: true });
      const pg = d.getPage(Math.max(0, Math.min(pageN - 1, d.getPageCount() - 1)));
      const g = (fn) => { try { return pg[fn](); } catch(e){ return null; } };
      out = { media: g('getMediaBox'), crop: g('getCropBox'), trim: g('getTrimBox'), art: g('getArtBox') };
    }
  } catch(e){ console.warn('[size] קריאת תיבות-העמוד נכשלה', (e && e.message) || e); }
  if (_boxCacheA.size > 40) _boxCacheA.delete(_boxCacheA.keys().next().value);
  _boxCacheA.set(key, out);
  return out;
}
let _pdflibA = null;
function _loadPdfLibA(){
  if (window.PDFLib) return Promise.resolve(window.PDFLib);
  if (_pdflibA) return _pdflibA;
  _pdflibA = (window.LibLoader ? LibLoader.ensure('pdflib', { win: window }) : Promise.resolve())
    .then(() => window.PDFLib || null).catch(() => null);
  return _pdflibA;
}
async function _sizeBadge(el, t){
  const reg = window._tileReg;
  const p = reg && reg.p; if (!p || !window.PageBox) return;
  const ref = (Number(p.reqW) > 0 && Number(p.reqH) > 0)
    ? { w: Number(p.reqW), h: Number(p.reqH) } : null;
  if (!ref) return;                                    // בלי גודל-עבודה לא מנחשים
  /* ⚠️ אותה מגבלה של הפורטל: pdf-lib מושך את הקובץ במלואו, וריצה שוקלת
     מעל 100MB. עמודים בודדים בלבד — הם גם היחידים שנבדקים מול גודל. */
  if (t.partId || (t.pages > 1)) return;
  const bx = await _boxesOf(t.url, t.page || 1);
  const em = bx ? PageBox.effectiveMM(bx) : null;
  if (!em) return;
  const v = PageBox.verdict({ w: em.w, h: em.h }, ref);
  /* ⚠️ 23/08/2026: מדידה שאינה מ-TrimBox כוללת את הגלישה, ולכן השוואה
     שלה מול גודל-נדרש מייצרת הפרש שאינו קיים בעמוד (12 מ"מ על 6 מ"מ
     גלישה). מתריעים רק על TrimBox — ראה page-box.js. */
  if (!PageBox.shouldWarn(v, em.label)) return;
  const tile = el.closest('.pgT');
  if (!tile || tile.querySelector('.pgSize')) return;
  tile.style.borderColor = '#f59e0b'; tile.style.background = '#fffbeb';
  tile.insertAdjacentHTML('beforeend',
    `<div class="pgSize" style="font-size:.66rem;font-weight:800;color:#b45309">${escapeHtml(PageBox.badLabel(v, em.label))}</div>`);
}

/* ── תזכורת על עמוד חסר → ממלאת את תיבת-השיחה, לא שולחת ─────────────── */
/* ── גודל-הגיליון: תיקון מהמסך (בקשת-בעלים 19/08/2026) ──────────────────
   ⚠️ ‏sheetPages קובע את **כל** הפריסה: 72 עמודים על גיליון-32 הם שלוש
   ריצות (8 · 32 · 32), ועל גיליון-8 תשע ריצות מקוננות. בערדניקים 283
   נשמר 8 — גודל-**הריצה** שהלקוח העלה, לא גודל-הגיליון — כי השאלה
   "כמה עמודים נכנסים בגיליון" נשאלת בפורטל, והלקוח אינו יודע על איזה
   גיליון העבודה רצה. הדפוס יודע, ועד עכשיו לא הייתה לו שום דרך לתקן.
   ⚠️ רשומת-פרופר אינה מחזיקה ‎reqW/reqH‎ (המידות על כרטיס-העבודה), ולכן
   אי-אפשר לגזור את הערך כאן — הוא נשאל.
   ⚠️ המסך אינו זז לפני שהשרת אישר: הכתיבה נבדקת ב-‎r.ok‎, וכשלון נאמר
   בקול. ‏Firebase מחזיר 401/403 כתגובת-HTTP תקינה ולא כחריגה. */
async function _setSheetPages(id){
  const reg = window._runGridReg;
  const p = (reg && reg.id === id) ? reg.p : null;
  if (!p) { msg('הגיליון לא נמצא — רעננו'); return; }
  const cur = parseInt(p.sheetPages, 10) || 0;
  const ans = prompt('כמה עמודים נכנסים בגיליון-הדפוס?\n\n'
    + '‏70×100 עם עמוד 16.5×24 → 32\n'
    + '‏64×90 עם A4 או 24×33 → 16\n\n'
    + '⚠️ זה גודל-הגיליון, לא מספר-העמודים בריצה שהלקוח שלח.', cur || '32');
  if (ans === null) return;
  const n = parseInt(ans, 10);
  if (!(n >= 2 && n <= 64 && n % 2 === 0)) { msg('גודל-גיליון הוא מספר זוגי בין 2 ל-64'); return; }
  if (n === cur) return;
  try {
    const r = await fetch(await _au(`${_FBURL}/customerProofs/${id}.json`),
      { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ sheetPages: n }) });
    if (!r.ok) throw new Error('db ' + r.status);
    p.sheetPages = n;                       // רק אחרי אישור-השרת
    render(_allRows);
  } catch(e){
    console.error('שמירת גודל-הגיליון נכשלה', e);
    alert('⛔ שמירת גודל-הגיליון נכשלה: ' + ((e && e.message) || 'שגיאה') + '\nהערך לא שונה. נסו שוב.');
  }
}
/* ── ריצה שטרם הגיעה (בקשת-בעלים 19/08/2026) ────────────────────────────
   אותה שורת-פריסה של ריצה שהתקבלה (‎#runExp‎), אבל במקום תמונות — אילו
   עמודים חסרים בה. עמוד שכבר הגיע בתוך הטווח מוצג כמו שהוא: "חסרה ריצה 3"
   על ריצה שחלק מעמודיה כן נשלחו כקבצים בודדים היה שולח לחפש מה שביד. */
function _runMissExpand(n){

  if (_runExpKey === 'miss:' + n && host.firstElementChild) { _runExpClose(); return; }   // לחיצה שנייה סוגרת
  _runExpKey = 'miss:' + n;
  /* ⚠️ 20/08/2026: הכותרת לפי המצב האמיתי — ריצה שכולה הגיעה בקבצים
     בודדים אינה "טרם הגיעה", והעמודים מקבלים תצוגה (data-thumb, אותו
     טוען-תמונות עצל של הרשת הראשית) במקום אייקון-קובץ ריק. */
  const _full = rn.missing.length === 0 && rn.pages.length > 0;

        : `<span class="runExpNote bad">טרם הגיעה — חסרים ${rn.missing.length} מתוך ${rn.pageCount} עמודים (${escapeHtml(rn.label)})</span>
      <button class="isBtn" data-runmissremind="1">📩 תזכורת ללקוח</button>`}

      : `<div class="pgT miss"><div class="pgTh">✚</div><div class="pgNm">חסר עמ׳ ${pg.no}</div>

  _thumbPaint();
  const cl = host.querySelector('[data-runclose]');

/* תזכורת ברמת-הריצה: "חסרה ריצה 3" הוא מה שהלקוח יכול לפעול לפיו —

function _pgRemindRun(n){

function _pgRemind(pageNo){

/* ── סימון-עמוד ממסך-הדפוס (אותו pageMarks של הדפדוף) ──────────────────
   ⚠️ אותה שכבה טהורה בדיוק (ShopIssue.markPatch) — לא ניסוח מקומי. */
async function _pmAdminWrite(p, patch){
  if (!patch) return false;
  try {
    const r = await fetch(await _au(`${_FBURL}/customerProofs/${p.id}.json`),
      { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(patch) });
    if (!r.ok) throw new Error('db ' + r.status);
    Object.keys(patch).forEach(path => {
      const seg = path.split('/');
      if (seg[0] !== 'pageMarks') return;
      p.pageMarks = p.pageMarks || {};
      const t = p.pageMarks[seg[1]] = p.pageMarks[seg[1]] || {};
      if (patch[path] === null) delete t[seg[2]]; else t[seg[2]] = patch[path];
    });
    return true;
  } catch(e){
    alert('⛔ שמירת הסימון נכשלה: ' + ((e && e.message) || 'שגיאה') + '\nנסו שוב.');
    return false;
  }
}

/* ── פריסת-ריצה בתוך המסך (בקשת-בעלים 17/08/2026) ──────────────────────────
   "בלחיצה על הריצה תיפתח מתחתיה פריסה של כל העמודים… באותו חלון של הפורטל,
   אין צורך שייפתח חלון חדש. בלחיצה נוספת ייפתח הדפדוף המהיר."

   ⚠️ המקור הוא **מטמון-העמודים** (`parts[pid].pagesUrl`) — מערך JSON של
   תמונות base64, ~2.3MB ל-32 עמודים. **לא** קובץ-הריצה עצמו, שהוא 117MB:
   רינדור 32 עמודים ממנו ב-pdf.js היה תוקע את הלשונית.
   ⚠️ אין מטמון → אומרים זאת ומציעים דפדוף, במקום לחיצה שלא עושה כלום. */
let _runExpKey = null;                       // partId שפרוס כרגע (null = סגור)
const _runPagesCache = new Map();            // pagesUrl → מערך-תמונות
/* מספר-העמוד **בגיליון** של העמוד הראשון בריצה (בקשת-בעלים 17/08/2026:
   "מספרי-העמודים שרשומים מתחת לכל עמוד צריכים להיות המספרים הנכונים שלו
   בגיליון"). עד עכשיו הוצג האינדקס בתוך קובץ-הריצה — "עמוד 1" לכל ריצה.
   ⚠️ מחושב מ**סכום העמודים של הריצות שלפניה**, ולא מ-(מספר-ריצה × 16):
   לריצות יכולים להיות אורכים שונים (למשל 16 + 32), ונוסחה קבועה הייתה
   מספרת נכון רק כשכולן שוות. סדר-הריצות נלקח ממספר-הריצה שבשם. */
/* ── סדר-הריצות: מקור-אמת אחד ─────────────────────────────────────────
   ⚠️ אירוע-ייצור 17/08/2026: לקוח העלה את הריצות בסדר הפוך, והשער יצא
   בריצה השנייה. הסיבה לא הייתה בשם-הקובץ — הוא כן נשא R-1/R-2 — אלא
   בכך שהמסך הזה סידר ריצות לפי **approvedAt** (זמן-ההעלאה) בשלושה
   מקומות: רשימת-הגיליון · ההורדה המאוחדת · מיזוג-ה-PDF. במקביל
   ‏`_runFirstPageNo` סידר לפי מספר-הריצה שבשם — כלומר מספרי-העמודים
   שהוצגו לא תיארו את הקובץ שנמסר. מעכשיו כולם דרך `_partsOrdered`.
   זמן-ההעלאה נשאר שובר-שוויון בלבד, לריצות בלי מספר בשם. */
/* ⚠️ 17/08/2026 — הלוגיקה עברה ל-shop-issue.js כדי שהפורטל והדפוס יציגו
   **אותו** מספר לאותו עמוד. כאן נשארו עטיפות בלבד; אין כאן מתמטיקה. */
function _runNoOfPart(pt) { return ShopIssue.runNoOfName(pt && (pt.name || pt.fileName)); }
function _partsOrdered(p) { return ShopIssue.runsOrdered(p); }
function _runOrderReversed(p) { return ShopIssue.runOrderReversed(p); }
function _runFirstPageNo(p, partId) { return ShopIssue.runFirstPageNo(p, partId); }
function _tileClick(i) {
  const reg = window._tileReg;
  const t = reg && reg.tiles && reg.tiles[i];
  if (!t) return;
  const pt = t.partId ? ((reg.p && reg.p.parts) || {})[t.partId] : null;
  // אריח-ריצה = קובץ רב-עמודים. אריח של עמוד בודד ממשיך להתנהג כמו קודם.
  if (!pt || (pt.pageCount | 0) <= 1) { _pgLightOpen(i); return; }
  /* ⚠️ דיווח-מהשטח 21/08/2026 ("לפעמים עובד חלק, לפעמים פותח דפדוף"):
     הרענון-האוטומטי מצייר את המסך מחדש — ה-DOM של הפריסה נמחק, אבל
     ‎_runExpKey‎ נשאר. הלחיצה הבאה נחשבה "לחיצה שנייה" ופתחה דפדוף במקום
     את הפריסה עם כפתור-ההורדה. "כבר פרוס" נקבע לפי מה שבאמת על המסך. */
  const _expHost = document.getElementById('runExp');
  const _expOpen = _runExpKey === t.partId && _expHost && _expHost.firstElementChild;
  if (_expOpen) {                             // באמת פרוס → לחיצה שנייה פותחת דפדוף
    window.open('proof-viewer.html?id=' + encodeURIComponent(reg.id)
              + '&part=' + encodeURIComponent(t.partId), '_blank', 'noopener');
    return;
  }
  _runExpand(reg, t, pt);
}
function _runExpClose() {
  _runExpKey = null;
  const h = document.getElementById('runExp');
  if (h) h.innerHTML = '';
}
async function _runExpand(reg, t, pt) {
  const host = document.getElementById('runExp');
  if (!host) return;
  _runExpKey = t.partId;
  const title = escapeHtml(t.runName || t.label || 'ריצה');
  /* ⚠️ בקשת-בעלים 17/08/2026: "יש לי 2 ריצות, ריצה 1 כבר הורדתי — לא מופיע
     הורדה בנפרד לכל ריצה". כפתור-ההורדה הראשי הוא ברמת-**הגיליון** ומושך את
     כל הריצות ברצף; עם ריצה של 117MB זו משיכה חוזרת מיותרת של מה שכבר ביד.
     כאן ההורדה היא של **הריצה הזו בלבד**, בשמה. */
  const dlBtn = pt.fileUrl
    ? '<button class="isBtn" data-rundl="1">⬇ הורד ' + title + '</button>' : '';
  if (!pt.pagesUrl) {
    host.innerHTML = '<div class="runExpBar"><b>' + title + '</b>'
      + '<span class="runExpNote">אין תצוגה מוכנה לריצה הזו — אפשר לפתוח בדפדוף</span>'
      + dlBtn
      + '<button class="isBtn" data-runflip="1">📖 פתח בדפדוף</button>'
      + '<button class="isBtn" data-runclose="1">✕ סגור</button></div>';
    _runExpWire(reg, t, pt);
    return;
  }
  host.innerHTML = '<div class="runExpBar"><b>' + title + '</b>'
    + '<span class="runExpNote">טוען עמודים…</span></div>';
  try {
    let pages = _runPagesCache.get(pt.pagesUrl);
    if (!pages) {
      const r = await fetch(pt.pagesUrl);
      if (!r.ok) throw new Error('מטמון-העמודים החזיר ' + r.status);
      pages = await r.json();
      if (!Array.isArray(pages) || !pages.length) throw new Error('מטמון-העמודים ריק');
      _runPagesCache.set(pt.pagesUrl, pages);
    }
    if (_runExpKey !== t.partId) return;       // המשתמש עבר לריצה אחרת בינתיים
    const baseNo = _runFirstPageNo(reg.p, t.partId);
    /* ⚠️ דיווח-בעלים 19/08/2026: כפולה שנשארה עמוד-PDF אחד רחב קיבלה מספר
       אחד — וכל הספירה אחריה זזה. מודדים את מידות-התמונות מהמטמון (זולות,
       ממילא נטענות לרשת) ומזהים כפולות לפי יחס-צלעות (ShopIssue, טהור).
       מדידה שנכשלה → עמוד-בודד, לא ניחוש. */
    const dims = await Promise.all(pages.map(src => new Promise(res => {
      const im = new Image();
      const done = (ok) => res(ok ? { w: im.naturalWidth, h: im.naturalHeight } : null);
      im.onload = () => done(true); im.onerror = () => done(false);
      setTimeout(() => done(false), 8000);       // תמונה תקועה לא תוקעת את הפריסה
      im.src = src;
    })));
    if (_runExpKey !== t.partId) return;
    /* רצף-הקונטרס האמיתי — ריצה 1 של 56/32 היא עמ' 1-12 + 45-56, ומספור
       רציף היה משקר אחרי עמ' 12. נופל לרציף רק כשאין פריסה. */
    let _seq = null;
    try {
      const _rn = ShopIssue.runNoOfName(t.runName || t.label);
      const _lay = ShopIssue.layoutOf(reg.p) || [];
      const _run = _lay.find(L => L.num === _rn);
      if (_run && _run.seq && _run.seq.length) _seq = _run.seq;
    } catch (e) {}
    const sn = (window.ShopIssue && ShopIssue.spreadNumbering)
      ? ShopIssue.spreadNumbering(dims, _seq || baseNo)
      : { items: pages.map((_, n) => ({ nos: [baseNo + n], spread: false, pdfPage: n + 1, label: 'עמוד ' + (baseNo + n) })),
          total: pages.length, spreads: 0, from: baseNo, to: baseNo + pages.length - 1 };
    host.innerHTML = '<div class="runExpBar"><b>' + title + '</b>'
      + '<span class="runExpNote">' + pages.length + ' קבצים · ' + sn.total + ' עמודים · עמ׳ '
          + sn.from + '–' + sn.to + ' בגיליון'
          + (sn.spreads ? ' · ' + sn.spreads + ' כפולות' : '')
          /* ⚠️ פאזינג 21/08/2026: המספור נגמר לפני עמודי-הקובץ — סימן
             שגודל-הגיליון שמור שגוי. עד היום הוצגו מספרים מומצאים בשקט. */
          + (sn.invented ? '<b style="color:#b91c1c"> · ⚠️ המספור אינו ודאי — בדקו את גודל-הגיליון (✎)</b>' : '')
          + ' · לחיצה על עמוד: הגדלה · לחיצה נוספת על הריצה: דפדוף</span>'
      + dlBtn
      /* 📱 בקשת-בעלים 01/09/2026: קדם-הדפוס בוחר אילו עמודים יראה העובד
         כשהוא סורק את ה-QR שעל כרטיס-העבודה — לעיתונים בלי מספרי-עמודים. */
      + '<button class="isBtn" data-runscan="1">📱 סימון לסריקה</button>'
      + '<button class="isBtn" data-runflip="1">📖 דפדוף</button>'
      + '<button class="isBtn" data-runclose="1">✕ סגור</button></div>'
      + '<div class="isPages runExpPages">'
      + pages.map((src, n) => '<div class="pgT" data-runpg="' + (sn.items[n].pdfPage || (n + 1)) + '" title="' + sn.items[n].label + ' בגיליון">'
          + '<div class="pgTh"><img src="' + src + '" alt="">'
          + (sn.items[n].spread ? '<span class="pgSpread">כפולה</span>' : '') + '</div>'
          + '<div class="pgNm">' + sn.items[n].label + '</div></div>').join('')
      + '</div>';
    _runExpWire(reg, t, pt, pages, sn);
    host.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  } catch (e) {
    console.error('פריסת-ריצה נכשלה', (e && e.message) || e);
    if (_runExpKey !== t.partId) return;
    host.innerHTML = '<div class="runExpBar"><b>' + title + '</b>'
      + '<span class="runExpNote bad">טעינת העמודים נכשלה (' + escapeHtml(String((e && e.message) || e)) + ')</span>'
      + dlBtn
      + '<button class="isBtn" data-runflip="1">📖 פתח בדפדוף</button>'
      + '<button class="isBtn" data-runclose="1">✕ סגור</button></div>';
    _runExpWire(reg, t, pt);
  }
}
function _runExpWire(reg, t, pt, pages, sn) {
  const host = document.getElementById('runExp');
  if (!host) return;
  const sc = host.querySelector('[data-runscan]');
  if (sc) sc.onclick = () => _scanPickOpen(reg, t, pt, pages, sn);
  const fl = host.querySelector('[data-runflip]');
  if (fl) fl.onclick = () => window.open('proof-viewer.html?id=' + encodeURIComponent(reg.id)
        + '&part=' + encodeURIComponent(t.partId), '_blank', 'noopener');
  const cl = host.querySelector('[data-runclose]');
  if (cl) cl.onclick = _runExpClose;
  /* הורדת **הריצה הזו בלבד**, בשמה (R-N) — דרך downloadFile, על כל שעריו. */
  const dl = host.querySelector('[data-rundl]');
  /* ⚠️ הרצף נגזר כאן ולא מועבר מ-‎_runExpand‎: הכפתור קיים גם במסלול
     שאין בו ‎pagesUrl‎ (בלי פריסה), ושם לא חושב שום רצף. גזירה במקום
     אחד = שני המסלולים מקבלים מספור, ולא רק זה שיש לו תצוגה. */
  if (dl && pt && pt.fileUrl) dl.onclick = () => downloadFile(pt.fileUrl,
    String(runFileName(reg.p, t.runName || t.label)).replace(/[\/:*?"<>|]/g, '_') + '.pdf', dl,
    _runSeqFor(reg.p, t.runName || t.label));
  /* לחיצה על עמוד בפריסה → אותו חלון-הגדלה של הרשת הראשית, עם מספר-העמוד
     **בתוך הריצה**. זו בדיוק החתימה `_pgLightOpen(tileIdx, pg)`, ולכן
     החיצים בהגדלה (‎_plFlat‎ שטוח ברמת-עמוד) ממשיכים לעבור את כל הגיליון. */
  const tileIdx = reg.tiles.indexOf(t);
  /* ⚠️ data-runpg הוא כבר עמוד-ה-PDF (1-מבוסס, מ-spreadNumbering) — לא
     אינדקס-תמונה. תקרית 19/08: 19 תמונות מול 24 עמודי-PDF = ההגדלה
     פתחה עמוד אחר מהתמונה שנלחצה. */
  host.querySelectorAll('[data-runpg]').forEach(el => el.onclick = () => {
    if (tileIdx < 0) return;
    _pgLightOpen(tileIdx, parseInt(el.dataset.runpg, 10), (el.querySelector('img') || {}).src || null);
  });
}

/* ═══ 📱 מה שהעובד יראה כשיסרוק את ה-QR שעל כרטיס-העבודה ═══════════════════
   בקשת-בעלים 01/09/2026: "כל אחד יכול לסרוק ולראות את העמודים שקדם-הדפוס
   הוסיף לכרטיס ב-QR", ו"הקדם יכול גם להוסיף את כל העמודים... והעובד יראה
   את כל העמודים בסדר רץ" — **כדי שהעובדים ידעו איך החוברת מתחילה ונגמרת**
   בעיתונים שאין עליהם מספרי-עמודים.

   ⚠️ **ה-QR עצמו לא משתנה.** הוא נושא מזהה-כרטיס בלבד, ולכן כל הכרטיסים
   שכבר מודפסים ומסתובבים בבית-הדפוס ממשיכים לעבוד. מה שמשתנה הוא רק מה
   שיושב בצומת שהוא פותח.
   ⚠️ **נשמרות התמונות עצמן ולא כתובת מטמון-העמודים.** כתובת הייתה חושפת
   את **כל** הריצה גם כשקדם-הדפוס בחר שני עמודים; כאן נחשף בדיוק מה שנבחר.
   ⚠️ ולכן גם דחיסה מחדש: התמונון במטמון הוא ~700px, ועובד על טלפון צריך
   לזהות עמוד, לא לקרוא אותו. 32 עמודים ב-700px היו מגה-בייטים ברשת סלולרית. */
const _SCAN_H = 260, _SCAN_Q = 0.55;
function _scanThumb(src){
  return new Promise(res => {
    const img = new Image();
    img.onload = function(){
      try {
        const sc = Math.min(1, _SCAN_H / (img.naturalHeight || _SCAN_H));
        const w = Math.max(1, Math.round(img.naturalWidth * sc));
        const h = Math.max(1, Math.round(img.naturalHeight * sc));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const cx = c.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h);
        cx.drawImage(img, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', _SCAN_Q));
      } catch(e){ console.warn('דחיסת-תמונון לסריקה נכשלה — נשמר המקור', e); res(src); }
    };
    /* ⚠️ תמונה שלא נטענה אינה נשמרת בכלל: עמוד ריק בטלפון גרוע מעמוד חסר,
       כי העובד יחשוב שזה מה שהודפס. */
    img.onerror = function(){ console.error('תמונון לסריקה לא נטען'); res(null); };
    img.src = src;
  });
}
/* מזהה כרטיס-העבודה של הגיליון. ⚠️ ה-QR מודפס על **הכרטיס**, ולכן הצומת
   ממופתח בו — לא במזהה-הפרופר. בלי כרטיס אין ל-QR מה לפתוח, וזה נאמר. */
function _scanCardIdFor(p){
  const c = _activeCardsByCust && _activeCardsByCust[_normName(String((p && p.customer) || '').trim())];
  return (c && c.id != null) ? String(c.id) : '';
}
let _scanPick = null;   // {key, sel:Set}
function _scanPickOpen(reg, t, pt, pages, sn){
  const host = document.getElementById('runExp'); if (!host) return;
  if (!pages || !pages.length){ alert('אין תצוגת-עמודים לריצה הזו — פתחו אותה ונסו שוב.'); return; }
  const cardId = _scanCardIdFor(reg.p);
  if (!cardId){
    alert('⛔ לא נמצא כרטיס-עבודה פעיל ללקוח הזה.\n\nה-QR מודפס על כרטיס-העבודה, ובלעדיו אין לו מה לפתוח.');
    return;
  }
  const key = String(t.partId || '');
  _scanPick = { key: key, sel: new Set() };
  const grid = host.querySelector('.runExpPages');
  if (grid) grid.classList.add('scanPicking');
  const bar = document.createElement('div');
  bar.className = 'runExpBar'; bar.id = 'scanPickBar';
  bar.innerHTML = '<b>📱 סימון לסריקה — ' + escapeHtml(t.runName || t.label || 'ריצה') + '</b>'
    + '<span class="runExpNote" id="scanPickN">לחצו על עמודים כדי לסמן אותם</span>'
    + '<button class="isBtn" data-scanfl="1">⇤⇥ ראשון + אחרון</button>'
    + '<button class="isBtn" data-scanall="1">▦ כל העמודים</button>'
    + '<button class="isBtn" data-scannone="1">נקה</button>'
    + '<button class="isBtn" data-scansave="1" style="background:#166534;color:#fff">✔ שמור לסריקה</button>'
    + '<button class="isBtn" data-scancancel="1">✕ בטל</button>';
  host.insertBefore(bar, host.querySelector('.runExpPages'));

  const tiles = Array.prototype.slice.call(host.querySelectorAll('[data-runpg]'));
  const paint = () => {
    tiles.forEach((el, i) => el.classList.toggle('scanOn', _scanPick.sel.has(i)));
    const n = _scanPick.sel.size;
    document.getElementById('scanPickN').textContent =
      n ? ('נבחרו ' + n + ' מתוך ' + tiles.length) : 'לחצו על עמודים כדי לסמן אותם';
  };
  /* ⚠️ הלחיצה על אריח נחטפת כאן ומוחזרת בביטול — במצב-סימון לחיצה חייבת
     לסמן ולא לפתוח הגדלה, אחרת כל בחירה מכסה את המסך. */
  tiles.forEach((el, i) => {
    el.dataset.scanPrev = '1';
    el.onclick = () => { if (_scanPick.sel.has(i)) _scanPick.sel.delete(i); else _scanPick.sel.add(i); paint(); };
  });
  /* ⚠️ הבחירה עצמה ב-‎ScanPages‎ ולא כאן: אותו כפתור בדיוק יושב גם בכרטיס-
     העבודה (עבודות שמגיעות במייל), ושתי מימושים היו נבדלים בשקט. */
  bar.querySelector('[data-scanfl]').onclick = () => {
    _scanPick.sel = new Set(ScanPages.firstLast(tiles.length)); paint();
  };
  bar.querySelector('[data-scanall]').onclick = () => {
    _scanPick.sel = new Set(ScanPages.all(tiles.length)); paint();
  };
  bar.querySelector('[data-scannone]').onclick = () => { _scanPick.sel = new Set(); paint(); };
  const close = () => { _scanPick = null; _runExpand(reg, t, pt); };   // בונה מחדש ומחזיר לחיצות רגילות
  bar.querySelector('[data-scancancel]').onclick = close;
  bar.querySelector('[data-scansave]').onclick = async () => {
    const idx = ScanPages.normalize(Array.from(_scanPick.sel), tiles.length);
    if (!idx.length){ alert('לא נבחר אף עמוד. סמנו לפחות אחד, או "בטל".'); return; }
    const btn = bar.querySelector('[data-scansave]');
    btn.disabled = true; btn.textContent = 'מכין…';
    try {
      const out = [];
      for (let k = 0; k < idx.length; k++){
        const i = idx[k];
        btn.textContent = 'מכין… ' + (k + 1) + '/' + idx.length;
        /* התווית היא המספר **בגיליון**, אותו אחד שעל האריח */
        out.push({ label: String((sn && sn.items[i] && sn.items[i].label) || ('עמוד ' + (i + 1))),
                   img: await _scanThumb(pages[i]) });
      }
      btn.textContent = 'שומר…';
      const body = ScanPages.buildPayload({
        name: String(t.runName || t.label || 'ריצה'),
        span: (sn && sn.from) ? (sn.from + '–' + sn.to) : '',
        at: Date.now(), pages: out
      });
      /* ⚠️ ‏r.ok נבדק — ‏Firebase מחזיר 403 כתגובת-HTTP תקינה, והודעת
         "נשמר" על כתיבה שנדחתה היא בדיוק מה שהעובד יגלה מול מסך ריק. */
      const rr = await fetch(await _au(`${_FBURL}/${ScanPages.nodePath(cardId, key)}.json`),
        { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!rr.ok) throw new Error('השרת החזיר ' + rr.status);
      msg('📱 ' + out.length + ' עמודים יוצגו בסריקת ה-QR (' + ScanPages.payloadKB(body) + 'KB)');
      close();
    } catch(e){
      console.error('שמירת עמודי-הסריקה נכשלה', e);
      alert('⛔ השמירה נכשלה: ' + ((e && e.message) || e) + '\nלא נשמר דבר.');
      btn.disabled = false; btn.textContent = '✔ שמור לסריקה';
    }
  };
  paint();
}

/* ── הגדלת-עמוד (לייטבוקס) — לראות מה הבעיה, לסמן, ולדרוש תיקון ──────── */
let _plClean = null;
function _pgLightClose(){
  const el = document.getElementById('pgLight');
  if (_plClean) { try{ _plClean(); }catch(e){} _plClean = null; }
  if (el) el.remove();
  document.removeEventListener('keydown', _pgLightEsc);
}
/* ⚠️ 14/08/2026, בקשת-בעלים: דפדוף בין העמודים בתוך חלון-ההגדלה —
   חיצים על המסך + מקשי-חצים. ‏RTL: חץ-שמאלה = העמוד הבא.
   ⚠️ תוקן באותו ערב (דיווח: "רק 3 עמודים עוברים"): אריח-ריצה הוא קובץ
   רב-עמודים, והדפדוף עצר אחרי האריחים. עכשיו הרשימה **שטוחה ברמת-עמוד** —
   כל עמוד בכל קובץ-ריצה — והחיצים עוברים את הגיליון כולו. */
function _plFlat(){
  const reg = window._tileReg, out = [];
  if (!reg || !reg.tiles) return out;
  reg.tiles.forEach((t, i) => {
    if (t.kind !== 'page') return;
    const n = (t.target === 'full') ? 1 : Math.max(1, t.pages || 1);
    for (let p = 1; p <= n; p++) out.push({ idx: i, pg: p });
  });
  return out;
}
function _pgLightNav(dir){
  const flat = _plFlat();
  const cur = flat.findIndex(e => e.idx === window._plIdx && e.pg === (window._plPg || 1));
  const nxt = flat[cur + dir];
  if (nxt) _pgLightOpen(nxt.idx, nxt.pg);
}
function _pgLightEsc(ev){
  if (ev.key === 'Escape') { _pgLightClose(); return; }
  if (ev.key === 'ArrowLeft') _pgLightNav(1);
  else if (ev.key === 'ArrowRight') _pgLightNav(-1);
}
async function _pgLightOpen(idx, pg, thumb){
  const reg = window._tileReg;
  const t = reg && reg.tiles && reg.tiles[idx];
  if (!t || t.kind !== 'page') return;
  const p = reg.p;
  /* העמוד בתוך הקובץ: אריח-'full' הוא עמוד-יחיד קבוע; אריח-ריצה מדפדף
     פנימה (pg). הסימונים והעורך מקבלים את אותו מספר בדיוק. */
  const pageIn = t.target === 'full' ? (t.page || 1) : Math.max(1, Math.min(pg || 1, t.pages || 1));
  _pgLightClose();
  const wrap = document.createElement('div');
  wrap.id = 'pgLight';
  wrap.innerHTML = `<div class="plBack"></div>
    <div class="plCard">
      <div class="plHd"><b>${escapeHtml(t.label)}${t.target!=='full'&&(t.pages||1)>1?` · עמוד ${pageIn}/${t.pages}`:''}</b><span class="plMeta">${escapeHtml(p.title||'')}${p.issue?(' · גיליון '+escapeHtml(String(p.issue))):''}</span>
        <span style="flex:1"></span>
        <button class="plX" id="plPrev" title="העמוד הקודם (חץ ימינה)">הקודם ▶</button>
        <button class="plX" id="plNext" title="העמוד הבא (חץ שמאלה)">◀ הבא</button>
        <button class="plX" title="סגירה (Esc)">✕</button></div>
      <div class="plBody"><div class="plPgWrap">${thumb ? (`<img src="${thumb}" alt="" style="max-width:100%;max-height:64vh;filter:blur(1px);opacity:.85"><div class="plLoad" style="padding:8px">⏳ טוען איכות מלאה…</div>`) : `<div class="plLoad">⏳ טוען עמוד…</div>`}</div></div>
      <div class="plNote" id="plNote"></div>
      <div class="plActs">
        <button id="plRep" class="isBtn fix">🔁 דרוש החלפה</button>
        <button id="plSpot" class="isBtn" style="display:none">📍 סמן איפה הבעיה</button>
        <button id="plOk" class="isBtn ok">✔ הלקוח אישר להדפסה כך</button>
        <button id="plClear" class="isBtn" style="display:none">✖ הסר סימון</button>
        <a id="plView" class="isBtn view" target="_blank" href="proof-viewer.html?id=${encodeURIComponent(p.id)}${t.partId?('&part='+encodeURIComponent(t.partId)):''}">👁 פתח בדפדוף</a>
        <a id="plEdit" class="isBtn" target="_blank" title="גלישות · הקטנה-לשוליים · מירכוז · הזזת-אזור — נשמר כגרסה חדשה"
           href="page-editor.html?id=${encodeURIComponent(p.id)}&target=${encodeURIComponent(t.target==='full'?'full':(t.partId||t.target))}&page=${encodeURIComponent(t.target==='full'?(t.page||1):pageIn)}">🛠 ערוך עמוד</a>
        <!-- ⚠️ 17/08/2026 — היה כאן <a … download>. תכונת download **אינה חלה
             חוצה-מקור**: הדפדפן התעלם ממנה, פתח לשונית עם צופה-ה-PDF, והבעלים
             שמר משם — כרום כתב את הקובץ מחדש ו-117MB הפכו ל-236MB, בלי שם.
             ‏CORS על ה-Storage דווקא פתוח (Access-Control-Allow-Origin: *),
             ולכן הורדת-blob עובדת ומחזירה את הקובץ כפי שהוא, בשמו הנכון. -->
        ${ShopIssue.cardActions(p).canDownload ? `<button class="isBtn" data-pldl="${escapeHtml(t.url)}" data-plname="${escapeHtml(_plDlName(p, t))}">⬇ הורדה</button>` : `<span class="isBtn" style="opacity:.55;cursor:not-allowed" title="טיוטה — ההורדה תיפתח כשהלקוח יאשר להדפסה">🔒 הורדה אחרי אישור-הלקוח</span>`}
        <button id="plDemand" class="isBtn fix" style="display:none">📢 שלח דרישת-תיקון ללקוח</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  window._plIdx = idx;
  window._plPg = t.target === 'full' ? 1 : pageIn;
  wrap.querySelector('.plBack').onclick = _pgLightClose;
  /* ⚠️ ה-✕ הוא ה-plX האחרון — הקודמים הם חיצי-הדפדוף */
  const _plXs = wrap.querySelectorAll('.plX');
  _plXs[_plXs.length - 1].onclick = _pgLightClose;
  wrap.querySelector('#plPrev').onclick = () => _pgLightNav(-1);
  wrap.querySelector('#plNext').onclick = () => _pgLightNav(1);
  document.addEventListener('keydown', _pgLightEsc);

  const host = wrap.querySelector('.plPgWrap');
  const paint = () => {
    /* מצב-הסימון על הכרטיס והכפתורים — מתוך הרשומה, אחרי כל כתיבה */
    const mk = ShopIssue.markOf(p, t.target, markN);
    wrap.querySelector('#plSpot').style.display = mk ? '' : 'none';
    wrap.querySelector('#plClear').style.display = mk ? '' : 'none';
    wrap.querySelector('#plDemand').style.display = (mk && mk.kind === 'replace') ? '' : 'none';
    /* ⚠️ בקשת-בעלים 17/08/2026: "הלקוח אישר להדפסה כך" הוא **תשובה** לבעיה
       מסומנת, לא פעולה עצמאית. כשאין דרישת-החלפה אין מה לאשר "כך", והכפתור
       רק הזמין סימון-מיותר על עמוד תקין. מוצג רק מול סימון-החלפה פתוח. */

    const note = wrap.querySelector('#plNote');
    note.innerHTML = mk
      ? `<span class="${mk.kind==='replace'?'plRep':'plOkTag'}">${mk.kind==='replace'?'🔁 דרוש החלפה':'✔ הלקוח אישר להדפסה כך'}</span>${mk.note?(' — '+escapeHtml(mk.note)):''}`
      : '';
    host.querySelectorAll('.pmSpot,[data-pmtag]').forEach(x => x.remove());
    if (mk && window.PageMarks) host.insertAdjacentHTML('beforeend', PageMarks.overlayHtml(mk));
    return mk;
  };
  const markN = t.target === 'full' ? (t.pageNo || 1) : pageIn;
  const rerenderGrid = () => { render(_allRows); };

  /* ⚠️ ההורדה מחלון-ההגדלה עוברת ב-downloadFile (blob) ולא בקישור-ישיר,
     כי download חוצה-מקור נדחה בשקט והדפדפן פותח צופה-PDF במקום להוריד. */
  (function(){
    const _b = wrap.querySelector('[data-pldl]');
    if (_b) _b.onclick = () => downloadFile(_b.dataset.pldl, _b.dataset.plname, _b);
  })();
  wrap.querySelector('#plRep').onclick = async () => {
    const note = window.prompt('מה הבעיה בעמוד? (ההערה תוצג ללקוח)', '');
    if (note === null) return;
    if (await _pmAdminWrite(p, ShopIssue.markPatch(t.target, markN, 'replace', { note: note, at: Date.now() }))) {
      t.mark = ShopIssue.markOf(p, t.target, markN); paint(); rerenderGrid();
    }
  };
  wrap.querySelector('#plOk').onclick = async () => {
    if (await _pmAdminWrite(p, ShopIssue.markPatch(t.target, markN, 'print-asis', { at: Date.now() }))) {
      t.mark = ShopIssue.markOf(p, t.target, markN); paint(); rerenderGrid();
    }

  }
  if (!rec || !rec.token){
    rec = { name: customer, token: 'k'+Date.now().toString(36)+Math.random().toString(36).slice(2,10), createdAt: Date.now() };
    await fetch(await _au(`${_FBURL}/customerPortals/${slug}.json`), { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(rec) });
  }

async function _pbCreate(){

  for (let i = 0; i < picked.length; i++){
    const r = picked[i];
    go.textContent = `פותח… ${i+1}/${picked.length}`;
    const rec = PortalBatch.portalRecord(r.name, Date.now(), Math.random().toString(36).slice(2,10));
    /* ⚠️ מגן-שורש: ‎slug‎ ריק הופך את הכתובת ל-‎customerPortals.json‎, ו-PUT
       לשם **מוחק את כל 44 הפורטלים** ומחליף אותם ברשומה אחת. ‏plan אמנם
       מסנן שם-ריק היום, אבל מחיקה-כוללת רחוקה מדי-מעט משינוי-קוד תמים. */
    if (!r.slug || !/^[A-Za-z0-9֐-׿_-]+$/.test(r.slug)){

      if (!res.ok) throw new Error('HTTP ' + res.status);

/* רשימת העיתונים והריצות של הלקוח, לבחירת יעד-הדרישה.
   ⚠️ "בלי שיוך" נשאר כאפשרות ראשונה ולא מוסר: יש דרישות כלליות
   ("חסר קובץ") שאינן שייכות לעיתון מסוים, וכפייה לבחור הייתה גורמת
   לבחירה שרירותית — כלומר יעד שגוי, שגרוע מיעד חסר. */
function _noticeTargets(customer){
  var rows = (_allRows || []).filter(function(p){
    return _slug(p.customer || '') === _slug(customer || '') && !p._deleted;
  }).sort(function(a,b){ return (b.createdAt||0) - (a.createdAt||0); }).slice(0, 25);
  var out = ['<option value="">— בלי שיוך לעיתון מסוים —</option>'];
  rows.forEach(function(p){
    var nm = escapeHtml((p.title || 'עיתון') + (p.issue ? (' · גיליון ' + p.issue) : ''));
    out.push('<option value="' + escapeHtml(p.id) + '">' + nm + '</option>');
    var parts = p.parts && typeof p.parts === 'object' ? p.parts : null;
    if (parts) Object.keys(parts).forEach(function(pid){

      out.push('<option value="' + escapeHtml(p.id) + '|' + escapeHtml(pid) + '">'
             + '&nbsp;&nbsp;↳ ' + nm + ' · ' + escapeHtml(r.name || pid) + '</option>');

  return out.join('');
}

/* attachApogee הוסר (בקשת-בעלים 2026-07-30): העלאת פרופר לאישור עברה
   ללשונית "פרופר ללקוח". השארת מעלה-קבצים בלתי-נגיש שכותב ל-Firebase
   היא מלכודת — עדיף בלי. רשומות apogeeUrl ותיקות ממשיכות להיות מוצגות. */
async function uploadBytes(path, bytes){
  let lastErr;
  for (const bucket of ['solan-printing.firebasestorage.app']){
    for (let attempt=1; attempt<=3; attempt++){
      try {
        const json = await xhrPost('https://firebasestorage.googleapis.com/v0/b/'+bucket+'/o?name='+encodeURIComponent(path), bytes);
        const token = (json.downloadTokens||'').split(',')[0] || '';
        return 'https://firebasestorage.googleapis.com/v0/b/'+bucket+'/o/'+encodeURIComponent(path)+'?alt=media&token='+token;
      } catch(e){ lastErr=e; if(e.code===403) throw e; await new Promise(r=>setTimeout(r, 1500*attempt)); }
    }
  }
  throw lastErr || new Error('העלאה נכשלה');
}
function xhrPost(url, bytes){
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest(); xhr.open('POST', url); xhr.timeout = 0;
    xhr.setRequestHeader('Content-Type', 'application/pdf');
    /* ⚠️ 23/08/2026: בלי שומר, תקיעת-רשת השאירה את ההבטחה תלויה **לנצח**
       והמסך קפא על ‎~98%‎ בלי הודעה ובלי יציאה. ‏upload-stall.js — מימוש
       אחד לכל המסכים; נכשל-פתוח אם המודול לא נטען. */
    const _st = (window.UploadStall && window.UploadStall.arm)
      ? window.UploadStall.arm(xhr, bytes, (er) => reject(er))
      : { clear: () => {} };
    const finishSend = (t) => { try { if (t) xhr.setRequestHeader('Authorization', 'Firebase ' + t); } catch(e){} (window._appCheckToken?window._appCheckToken():Promise.resolve(null)).then(function(act){ try{ if(act) xhr.setRequestHeader('X-Firebase-AppCheck', act); }catch(e){} xhr.send(bytes); }, function(){ xhr.send(bytes); }); };
    xhr.onload = () => { _st.clear(); if (xhr.status>=200 && xhr.status<300){ try{ resolve(JSON.parse(xhr.responseText)); }catch(e){ const er=new Error('bad'); er.code=xhr.status; reject(er); } return; } const er=new Error('Storage '+xhr.status); er.code=xhr.status; reject(er); };
    xhr.onerror = () => { _st.clear(); const e=new Error('שגיאת רשת'); e.code=0; reject(e); };
    xhr.ontimeout = () => { _st.clear(); const e=new Error('פג זמן'); e.code=408; reject(e); };
    _fbAuthToken().then(finishSend, () => finishSend(null));
  });
}

// ── סל-מיחזור (ProofTrash) — 🗑 כאן לא מוחק מיד לצמיתות. הרשומה עוברת ל-customerProofsTrash
//    (מוסרת מהרשימה החיה), אבל הקובץ ב-Storage *נשאר* עד ניקוי אוטומטי אחרי 30 יום או
//    מחיקה ידנית מפורשת מתוך הסל. זה מונע אובדן קובץ-לקוח בלתי-הפיך מלחיצה בטעות. ──
async function _trashPut(key, entry) {
  /* ⚠️ ביקורת 21/08/2026, כלל-1: בלי r.ok כאן, כתיבת-הגיבוי "מצליחה" על
     403/400, וה-DELETE שאחריו מוחק את הרשומה **בלי עותק-שחזור**. הכשל
     חייב לעצור את המחיקה — מוטב רשומה שלא נמחקה מרשומה שאבדה. */
  const r = await fetch(await _au(`${_FBURL}/customerProofsTrash/${key}.json`), { method: 'PUT',
    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(entry) });
  if (!r.ok) throw new Error('גיבוי-הסל נכשל (' + r.status + ') — המחיקה בוטלה כדי לא לאבד את הרשומה');
}
// מחיקת ריצה בודדת — לסל-מיחזור (הקובץ נשאר ב-Storage)
async function deletePart(jobId, pid, filePath) {
  const job = _allRows.find(r => r.id === jobId);
  const part = job && job.parts && job.parts[pid];
  if (!confirm('להעביר את הריצה הזו לסל-המיחזור?\nהיא תוסר מכאן; הקובץ עצמו יישמר ' + ProofTrash.DEFAULT_GRACE_DAYS + ' יום ואפשר לשחזר אותו מתוך "🗑 סל מיחזור".')) return;
  msg('מעביר לסל מיחזור…');
  try {
    const entry = ProofTrash.buildPartTrashEntry(jobId, Object.assign({ pid, filePath }, part || {}), job || {}, Date.now());
    await _trashPut(jobId + '_' + pid, entry);   // זורק אם הגיבוי נכשל
    const rd = await fetch(await _au(`${_FBURL}/customerProofs/${jobId}/parts/${pid}.json`), { method: 'DELETE' });
    if (!rd.ok) throw new Error('ההסרה נכשלה (' + rd.status + ') — הגיבוי נשמר בסל; הריצה עדיין ברשימה');
    await loadProofs();
    msg('🗑 הועבר לסל-המיחזור — ניתן לשחזר מתוך "🗑 סל מיחזור"');
  } catch (e) { console.error(e); msg('✗ שגיאה בהעברה לסל: ' + e.message); }
}

// מחיקת עבודה שלמה — לסל-מיחזור (הקבצים נשארים ב-Storage)

// ── מחיקה סופית מ-Storage (רק מתוך הסל, אחרי אישור נוסף, או ניקוי אוטומטי) ──
async function _purgeStorage(entry) {
  for (const fp of ProofTrash.storagePaths(entry)) {
    for (const bucket of ['solan-printing.firebasestorage.app', 'solan-printing.appspot.com']) {
      try {
        const r = await fetch(`https://firebasestorage.googleapis.com/v0/b/${bucket}/o/${encodeURIComponent(fp)}`, { method: 'DELETE', headers: await _authHeaders() });
        if (r.ok || r.status === 404) break;
      } catch (e) { /* נסה bucket הבא */ }
    }
  }
}
async function _loadTrash() {
  const data = await (await fetch(await _au(`${_FBURL}/customerProofsTrash.json`))).json() || {};
  return Object.entries(data).map(([key, e]) => Object.assign({ key }, e));
}
// ניקוי אוטומטי שקט: פריטים בסל מעל 30 יום נמחקים סופית מ-Storage + מהסל
async function _autoPurgeTrash() {
  try {
    const trash = await _loadTrash();
    const due = ProofTrash.purgeable(trash, Date.now());
    for (const entry of due) {
      await _purgeStorage(entry);
      await fetch(await _au(`${_FBURL}/customerProofsTrash/${entry.key}.json`), { method: 'DELETE' });
    }
  } catch (e) { console.error('auto-purge trash failed', e); }
}

  const list = await _loadTrash();

  const el = document.getElementById('trashList');
  if (!sorted.length) { el.innerHTML = '<div style="text-align:center;color:#9ca3af;padding:24px">הסל ריק</div>'; return; }
  const fmt = t => t ? new Date(t).toLocaleString('he-IL', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' }) : '—';
  el.innerHTML = sorted.map(entry => `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #eee">
    <div style="min-width:0">
      <div style="font-weight:700;color:#1f2937;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(ProofTrash.describe(entry))}</div>
      <div style="font-size:.75rem;color:#9ca3af">הוסר: ${fmt(entry.deletedAt)} · נותרו ${ProofTrash.daysLeft(entry, Date.now())} ימים לפני מחיקה סופית</div>
    </div>
    <div style="display:flex;gap:6px;flex-shrink:0">
      <button data-restore="${entry.key}" style="padding:6px 12px;border:1.5px solid #16a34a;background:#f0fdf4;color:#16a34a;border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.8rem">↩ שחזר</button>
      <button data-purge="${entry.key}" style="padding:6px 12px;border:1.5px solid #fecaca;background:#fff;color:#dc2626;border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.8rem">מחק לצמיתות</button>
    </div>
  </div>`).join('');
  el.querySelectorAll('[data-restore]').forEach(b => b.onclick = async () => {
    const entry = sorted.find(x => x.key === b.dataset.restore); if (!entry) return;
    b.disabled = true; b.textContent = 'משחזר…';
    try {
      /* ⚠️ ביקורת 21/08/2026, כלל-1: r.ok על הכתיבה-המשחזרת **לפני** מחיקת
         הגיבוי. בלעדיו, שחזור שנדחה ב-403 היה מוחק את רשומת-הסל — הפריט
         נמחק לצמיתות משני המקומות (אובדן-נתונים). */
      let _rr;
      if (entry.type === 'part') {
        _rr = await fetch(await _au(`${_FBURL}/customerProofs/${entry.jobId}/parts/${entry.partId}.json`), { method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: entry.name, fileUrl: entry.fileUrl, filePath: entry.filePath, pagesUrl: entry.pagesUrl, pageCount: entry.pageCount, status: 'approved', approvedAt: Date.now() }) });
      } else {

        _rr = await fetch(await _au(`${_FBURL}/customerProofs/${entry.jobId}.json`), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(restored) });
