        <button id="plDemand" class="isBtn fix" style="display:none">📢 שלח דרישת-תיקון ללקוח</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  window._plIdx = idx;
  window._plPg = t.target === 'full' ? 1 : pageIn;
  wrap.querySelector('.plBack').onclick = _pgLightClose;
  /* ⚠️ ה-✕ הוא ה-plX האחרון — הקודמים הם חיצי-הדפדוף */
  const _plXs = wrap.querySelectorAll('.plX');
  _plXs[_plXs.length - 1].onclick = _pgLightClose;
  wrap.querySelector('#plPrev').onclick = () => _pgLightNav(-1);
  wrap.querySelector('#plNext').onclick = () => _pgLightNav(1);
  document.addEventListener('keydown', _pgLightEsc);

  const host = wrap.querySelector('.plPgWrap');
  const paint = () => {
    /* מצב-הסימון על הכרטיס והכפתורים — מתוך הרשומה, אחרי כל כתיבה */
    const mk = ShopIssue.markOf(p, t.target, markN);
    wrap.querySelector('#plSpot').style.display = mk ? '' : 'none';
    wrap.querySelector('#plClear').style.display = mk ? '' : 'none';
    wrap.querySelector('#plDemand').style.display = (mk && mk.kind === 'replace') ? '' : 'none';
    const note = wrap.querySelector('#plNote');
    note.innerHTML = mk
      ? `<span class="${mk.kind==='replace'?'plRep':'plOkTag'}">${mk.kind==='replace'?'🔁 דרוש החלפה':'✔ הלקוח אישר להדפסה כך'}</span>${mk.note?(' — '+escapeHtml(mk.note)):''}`
      : '';

  wrap.querySelector('#plSpot').onclick = () => {

    wrap.querySelector('.plCard').appendChild(hint);
    _plClean = PageMarks.attachSpotDrag(host, async (rect) => {
      hint.remove(); _plClean = null;
      if (!rect) return;
      if (await _pmAdminWrite(p, ShopIssue.markPatch(t.target, markN, mk.kind,
          { note: mk.note, by: mk.by, at: mk.at || Date.now(), spot: rect }))) {

  try {

       תרים שונה מגודל-העמוד; לא ממציאים מסגרת. */
    try {

          + 'border:1px dashed #dc2626;left:' + tr.x + '%;top:' + tr.y + '%;width:' + tr.w + '%;height:' + tr.h + '%"></div>');

/* attachApogee הוסר (בקשת-בעלים 2026-07-30): העלאת פרופר לאישור עברה
   ללשונית "פרופר ללקוח". השארת מעלה-קבצים בלתי-נגיש שכותב ל-Firebase
   היא מלכודת — עדיף בלי. רשומות apogeeUrl ותיקות ממשיכות להיות מוצגות. */
async function uploadBytes(path, bytes){
  let lastErr;
  for (const bucket of ['solan-printing.firebasestorage.app']){
    for (let attempt=1; attempt<=3; attempt++){
      try {
        const json = await xhrPost('https://firebasestorage.googleapis.com/v0/b/'+bucket+'/o?name='+encodeURIComponent(path), bytes);
        const token = (json.downloadTokens||'').split(',')[0] || '';
        return 'https://firebasestorage.googleapis.com/v0/b/'+bucket+'/o/'+encodeURIComponent(path)+'?alt=media&token='+token;
      } catch(e){ lastErr=e; if(e.code===403) throw e; await new Promise(r=>setTimeout(r, 1500*attempt)); }
    }
  }
  throw lastErr || new Error('העלאה נכשלה');
}
function xhrPost(url, bytes){
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest(); xhr.open('POST', url); xhr.timeout = 0;
    xhr.setRequestHeader('Content-Type', 'application/pdf');
    const finishSend = (t) => { try { if (t) xhr.setRequestHeader('Authorization', 'Firebase ' + t); } catch(e){} (window._appCheckToken?window._appCheckToken():Promise.resolve(null)).then(function(act){ try{ if(act) xhr.setRequestHeader('X-Firebase-AppCheck', act); }catch(e){} xhr.send(bytes); }, function(){ xhr.send(bytes); }); };
    xhr.onload = () => { if (xhr.status>=200 && xhr.status<300){ try{ resolve(JSON.parse(xhr.responseText)); }catch(e){ const er=new Error('bad'); er.code=xhr.status; reject(er); } return; } const er=new Error('Storage '+xhr.status); er.code=xhr.status; reject(er); };
    xhr.onerror = () => { const e=new Error('שגיאת רשת'); e.code=0; reject(e); };
    xhr.ontimeout = () => { const e=new Error('פג זמן'); e.code=408; reject(e); };
    _fbAuthToken().then(finishSend, () => finishSend(null));
  });
}

// ── מחיקה סופית מ-Storage (רק מתוך הסל, אחרי אישור נוסף, או ניקוי אוטומטי) ──
async function _purgeStorage(entry) {
  for (const fp of ProofTrash.storagePaths(entry)) {
    for (const bucket of ['solan-printing.firebasestorage.app', 'solan-printing.appspot.com']) {
      try {
        const r = await fetch(`https://firebasestorage.googleapis.com/v0/b/${bucket}/o/${encodeURIComponent(fp)}`, { method: 'DELETE', headers: await _authHeaders() });
        if (r.ok || r.status === 404) break;
      } catch (e) { /* נסה bucket הבא */ }
    }
  }
}
async function _loadTrash() {
  const data = await (await fetch(await _au(`${_FBURL}/customerProofsTrash.json`))).json() || {};
  return Object.entries(data).map(([key, e]) => Object.assign({ key }, e));
}
// ניקוי אוטומטי שקט: פריטים בסל מעל 30 יום נמחקים סופית מ-Storage + מהסל
async function _autoPurgeTrash() {
  try {
    const trash = await _loadTrash();
    const due = ProofTrash.purgeable(trash, Date.now());
    for (const entry of due) {
      await _purgeStorage(entry);
      await fetch(await _au(`${_FBURL}/customerProofsTrash/${entry.key}.json`), { method: 'DELETE' });
    }
  } catch (e) { console.error('auto-purge trash failed', e); }
}
setTimeout(_autoPurgeTrash, 4000);

// ── מודל סל-המיחזור: שחזור לרשימה החיה, או מחיקה סופית ידנית ──
async function openTrash() {
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center';
  box.innerHTML = `<div style="background:#fff;width:92vw;max-width:720px;max-height:85vh;border-radius:12px;overflow:hidden;display:flex;flex-direction:column">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#2d3561;color:#fff">
      <span style="font-weight:800">🗑 סל מיחזור — קבצי לקוחות שהוסרו</span>
      <button id="trashClose" style="background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer">✕</button>
    </div>
    <div style="padding:8px 16px;font-size:.8rem;color:#6b7280;background:#fafafa">קובץ שהוסר נשמר כאן ${ProofTrash.DEFAULT_GRACE_DAYS} יום לפני מחיקה סופית — אפשר לשחזר בכל עת עד אז.</div>
    <div id="trashList" style="flex:1;overflow:auto;padding:10px 16px">טוען…</div>
  </div>`;
  document.body.appendChild(box);
  document.getElementById('trashClose').onclick = () => box.remove();
  box.onclick = (e) => { if (e.target === box) box.remove(); };
  const list = await _loadTrash();
  const sorted = ProofTrash.sortByDeletedDesc(list);
  const el = document.getElementById('trashList');
  if (!sorted.length) { el.innerHTML = '<div style="text-align:center;color:#9ca3af;padding:24px">הסל ריק</div>'; return; }
  const fmt = t => t ? new Date(t).toLocaleString('he-IL', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' }) : '—';
  el.innerHTML = sorted.map(entry => `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #eee">
    <div style="min-width:0">
      <div style="font-weight:700;color:#1f2937;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(ProofTrash.describe(entry))}</div>
      <div style="font-size:.75rem;color:#9ca3af">הוסר: ${fmt(entry.deletedAt)} · נותרו ${ProofTrash.daysLeft(entry, Date.now())} ימים לפני מחיקה סופית</div>
    </div>
    <div style="display:flex;gap:6px;flex-shrink:0">
      <button data-restore="${entry.key}" style="padding:6px 12px;border:1.5px solid #16a34a;background:#f0fdf4;color:#16a34a;border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.8rem">↩ שחזר</button>
      <button data-purge="${entry.key}" style="padding:6px 12px;border:1.5px solid #fecaca;background:#fff;color:#dc2626;border-radius:8px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.8rem">מחק לצמיתות</button>
    </div>
  </div>`).join('');
  el.querySelectorAll('[data-restore]').forEach(b => b.onclick = async () => {
    const entry = sorted.find(x => x.key === b.dataset.restore); if (!entry) return;
    b.disabled = true; b.textContent = 'משחזר…';
    try {
      if (entry.type === 'part') {
        await fetch(await _au(`${_FBURL}/customerProofs/${entry.jobId}/parts/${entry.partId}.json`), { method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: entry.name, fileUrl: entry.fileUrl, filePath: entry.filePath, pagesUrl: entry.pagesUrl, pageCount: entry.pageCount, status: 'approved', approvedAt: Date.now() }) });
      } else {
        const restored = { customer: entry.customer, title: entry.title, status: entry.parts.length ? 'parts' : 'approved', mode: entry.parts.length ? 'parts' : 'full', createdAt: Date.now() };
        if (entry.fileUrl) { restored.fileUrl = entry.fileUrl; restored.filePath = entry.filePath; restored.approvedAt = Date.now(); }
        if (entry.parts.length) restored.parts = Object.fromEntries(entry.parts.map(pt => [pt.pid, { name: pt.name, fileUrl: pt.fileUrl, filePath: pt.filePath, status: 'approved', approvedAt: Date.now() }]));
        await fetch(await _au(`${_FBURL}/customerProofs/${entry.jobId}.json`), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(restored) });
      }
      await fetch(await _au(`${_FBURL}/customerProofsTrash/${entry.key}.json`), { method: 'DELETE' });
      await loadProofs();
      box.remove(); openTrash();
    } catch (e) { console.error(e); alert('שחזור נכשל: ' + (e.message || e)); b.disabled = false; b.textContent = '↩ שחזר'; }
  });
  el.querySelectorAll('[data-purge]').forEach(b => b.onclick = async () => {
    const entry = sorted.find(x => x.key === b.dataset.purge); if (!entry) return;
    if (!confirm(`למחוק לצמיתות את "${ProofTrash.describe(entry)}"?\nהקובץ יימחק סופית מהאחסון ולא ניתן יהיה לשחזר.`)) return;
    b.disabled = true; b.textContent = 'מוחק…';
    try {
      await _purgeStorage(entry);
      await fetch(await _au(`${_FBURL}/customerProofsTrash/${entry.key}.json`), { method: 'DELETE' });
      box.remove(); openTrash();
    } catch (e) { console.error(e); alert('מחיקה נכשלה: ' + (e.message || e)); b.disabled = false; b.textContent = 'מחק לצמיתות'; }
  });
}

// ── ייצור ריצות מהקובץ המאושר ──
/* ⚠️ 14/08/2026: המתמטיקה חולצה ל-run-split.js (טהור, נבדק ב-Node) — כאן
   נשארו רק העטיפות שנוגעות ב-pdf-lib. מתמטיקה אחת, שני מסלולים:
   "✂ פיצול לריצות" (שכפול-כפולות, כמו תמיד) ו"📚 לפי ריצות" (פיצול-אמיתי). */
const splitToKontresim = (totalPages, fullSheet) => KontresSplit.splitToKontresim(totalPages, fullSheet);

// עמודי "כפולה" (עמוד PDF ברוחב כפול = שני עמודי עיתון מחוברים): לא חותכים —
// משאירים את הקובץ כמו שהוא, פשוט מכפילים אותו לשני קבצים זהים (אחד לכל מקום בריצה)
// ומסמנים "כפולה" בשם. מחזיר { doc, labels, spread } — labels[i] = מספרי העמוד ("16-17").
async function normalizeSpreads(src) {
  const pages = src.getPages();
  const sizes = pages.map(pg => { const mb = pg.getMediaBox(); return { w: mb.width, h: mb.height }; });
  const plan = KontresSplit.spreadPlan(sizes, { mode: 'duplicate' });
  const labels = plan.entries.map(e => e.label), spread = plan.entries.map(e => e.spread);
  if (!plan.hasSpread) return { doc: src, labels, spread };
  const out = await PDFLib.PDFDocument.create();
  for (const e of plan.entries) {
    const [pg] = await out.copyPages(src, [e.src]); out.addPage(pg);
  }
  return { doc: out, labels, spread };
}

/* ── "📚 לפי ריצות" (14/08/2026, בקשת-בעלים) ─────────────────────────────
   קובץ-PDF **אחד**: כל העיתון בסדר שהדפוס עובד בו — עמודי ריצה 1, אחר-כך
   ריצה 2… — וכל כפולה מפוצלת פיזית לשני עמודים בודדים (embedPage עם
   חצי-קופסה, וקטורי — לא רסטר). התוכנית כולה מ-RunSplit (טהור);
   כיוון-הקריאה מהרשומה (RTL: הימני הוא העמוד הנמוך), לא מנוחש. */
/* ── מקור-הקובץ לחלוקת-ריצות (תוקן 14/08/2026, דיווח-בעלים) ──────────────
   ⚠️ כרטיס-הגיליון רושם את כפתורי-ההורדה **בלי** fileUrl (עבודת-ריצות אין
   לה קובץ-מאוחד) — ולכן "📚 לפי ריצות" הוריד כתובת-ריקה, קיבל את ה-HTML
   של האתר, ונפל על "No PDF header". עכשיו: המקור נפתר מהרשומה —
   קובץ-מלא אם יש; אחרת הריצות ממוזגות לפי סדר-האישור; אחרת קובצי-הפורטל
   לפי מספרי-העמודים. כל קובץ נבדק שהוא באמת PDF (%PDF-) לפני שממשיכים. */
async function _runSourceBytes(t) {
  const rec = (_allRows || []).find(r => r.id === t.jobId) || {};
  const urls = [];
  if (t.fileUrl) urls.push(t.fileUrl);
  else if (t.partId && rec.parts && rec.parts[t.partId] && rec.parts[t.partId].fileUrl)
    urls.push(rec.parts[t.partId].fileUrl);
  else if (rec.fileUrl) urls.push(rec.fileUrl);
  let weave = null;                 // עמודים-בודדים מהפורטל שנשזרים למקומם בין הריצות
  if (!urls.length) {
    Object.values(rec.parts || {})
      .filter(p => p && p.fileUrl)
      .sort((a, b) => (a.approvedAt || 0) - (b.approvedAt || 0))
      .forEach(p => urls.push(p.fileUrl));
    /* ⚠️ 15/08/2026, בקשת-בעלים: עמוד-בודד שהועלה מהפורטל למשבצת-חסרה
       (למשל עמ' 128) חייב להיכנס **למקומו** בעיתון — עד היום הוא נבלע
       בשקט כשהיו ריצות, כי files נקרא רק כשאין parts. מיקום-ההכנסה
       מתוקן לפי המשבצות שעדיין חסרות (pendingPages). */
    if (urls.length && rec.files) {
      const fe = Object.values(rec.files).filter(f => f && f.fileUrl)
        .map(f => ({ url: f.fileUrl, slot: ShopIssue.pageNoOf(f.fileName) }))
        .filter(f => f.slot >= 1).sort((a, b) => a.slot - b.slot);
      if (fe.length) {
        const pend = new Set();
        (rec.pendingPages || []).forEach(x => pend.add(Number(x)));
        Object.values(rec.parts || {}).forEach(p => ((p || {}).pendingPages || []).forEach(x => pend.add(Number(x))));
        weave = { ents: fe, pend: pend };
      }
    }
    if (!urls.length && rec.files) {
      Object.values(rec.files).filter(f => f && f.fileUrl)
        .sort((a, b) => (ShopIssue.pageNoOf(a.fileName) || 9999) - (ShopIssue.pageNoOf(b.fileName) || 9999))
        .forEach(f => urls.push(f.fileUrl));
    }
  }
  if (!urls.length) throw new Error('אין קובץ-PDF לעבודה הזו — הקבצים טרם הועלו');
  const bufs = [];
  for (const u of urls) {
    const r = await fetch(u);
    if (!r.ok) throw new Error('הורדת-הקובץ נכשלה (' + r.status + ')');
    const b = await r.arrayBuffer();
    const head = String.fromCharCode.apply(null, new Uint8Array(b.slice(0, 5)));
    if (head !== '%PDF-') throw new Error('הקובץ שהתקבל אינו PDF — ' + head.slice(0, 5));
    bufs.push(b);
  }
  if (bufs.length === 1 && !weave) return bufs[0];
  const out = await PDFLib.PDFDocument.create();
  for (const b of bufs) {
    const d = await PDFLib.PDFDocument.load(b);
    const pages = await out.copyPages(d, d.getPageIndices());
    pages.forEach(p => out.addPage(p));
  }
  if (weave) {
    const fileSlots = new Set(weave.ents.map(e => e.slot));
    for (const e of weave.ents) {
      const r2 = await fetch(e.url);
      if (!r2.ok) throw new Error('הורדת עמוד-בודד (עמ׳ ' + e.slot + ') נכשלה (' + r2.status + ')');
      const b2 = await r2.arrayBuffer();
      const h2 = String.fromCharCode.apply(null, new Uint8Array(b2.slice(0, 5)));
      if (h2 !== '%PDF-') throw new Error('עמוד-בודד (עמ׳ ' + e.slot + ') אינו PDF');
      const d2 = await PDFLib.PDFDocument.load(b2);
      const cps = await out.copyPages(d2, d2.getPageIndices());
      /* המיקום: עמ׳ N יושב באינדקס N-1 פחות המשבצות שלפניו שעוד חסרות */
      let missBefore = 0;
      weave.pend.forEach(x => { if (x < e.slot && !fileSlots.has(x)) missBefore++; });
      let idx = Math.max(0, Math.min(out.getPageCount(), e.slot - 1 - missBefore));
      cps.forEach(pg => { out.insertPage(idx++, pg); });
    }
  }
  return (await out.save()).buffer;
}

async function generateRunOrderedPdf(proof, fullSheet, btn) {
  const old = btn.textContent;
  /* חיווי-בנייה (בקשת-בעלים 14/08): הכפתור קטן ולפעמים מחוץ למסך —
     באנר צף משקף כל שלב, ונעלם בהצלחה או בכשל. */
  const stage = t2 => { btn.textContent = t2; _buildBanner('📚 לפי ריצות — ' + t2); };
  btn.disabled = true; stage('מוריד קובץ…');
  try {
    const bytes = await _runSourceBytes(proof);
    stage('מפצל כפולות…');
    const raw = await PDFLib.PDFDocument.load(bytes);
    const pages = raw.getPages();
    const sizes = pages.map(pg => { const mb = pg.getMediaBox(); return { w: mb.width, h: mb.height }; });
    const rec = (_allRows || []).find(r => r.id === proof.jobId) || {};
    const unit = (proof.partId && rec.parts && rec.parts[proof.partId]) || rec;
    const readingDirection = unit.readingDirection || rec.readingDirection || 'rtl';
    const plan = KontresSplit.spreadPlan(sizes, { mode: 'split', readingDirection });
    const ro = KontresSplit.runOrderedEntries(plan.entries, fullSheet);

    const out = await PDFLib.PDFDocument.create();
    let done = 0;
    for (const e of ro.order) {
      if ((++done) % 8 === 0) stage(`בונה עמוד ${done}/${ro.order.length}…`);
      if (!e.half) {
        const [pg] = await out.copyPages(raw, [e.src]); out.addPage(pg);
        continue;
      }
      /* חצי-כפולה: חיתוך וקטורי בחצי-קופסה — כמו splitSpreadsPdf בדפדוף */
      const srcPg = raw.getPage(e.src);
      const mb = srcPg.getMediaBox();
      const halfW = mb.width / 2;
      const left = e.half === 'left' ? mb.x : mb.x + halfW;
      const emb = await out.embedPage(srcPg, { left: left, bottom: mb.y, right: left + halfW, top: mb.y + mb.height });
      const pg = out.addPage([halfW, mb.height]);
      pg.drawPage(emb, { x: 0, y: 0, width: halfW, height: mb.height });
    }
    const safe = s => String(s || '').replace(/[\\/:*?"<>|]/g, '_').trim();
    const nSplit = ro.order.filter(o => o.spread).length / 2;
    downloadBlob(new Blob([await out.save()], { type: 'application/pdf' }),
      `${safe(proof.title || 'חוברת')} — לפי ריצות (${ro.runs.length})${nSplit ? ` · ${nSplit} כפולות פוצלו` : ''}.pdf`);
    _buildBanner('✓ הקובץ ירד לתיקיית-ההורדות');
    setTimeout(() => _buildBanner(false), 3500);
    /* אותו סימון "הריצות הורדו" כמו במסלול-הפיצול — זו אותה פעולה עסקית */
    try {
      if (proof.jobId) {
        const p2 = proof.partId ? `customerProofs/${proof.jobId}/parts/${proof.partId}` : `customerProofs/${proof.jobId}`;
        _au(`${_FBURL}/${p2}.json`).then(u => fetch(u, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ runsDownloadedAt: Date.now() }) }));
      }
    } catch(e){}
    btn.textContent = '✓ הורד';
    setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 2500);
  } catch (e) {
    _buildBanner(false);
    console.error(e); alert('שגיאה בהורדה לפי ריצות: ' + e.message);
    btn.textContent = old; btn.disabled = false;
  }
}

async function generateRuns(proof, fullSheet, btn) {
  const old = btn.textContent;
  const stage = t2 => { btn.textContent = t2; _buildBanner('✂ פיצול לריצות — ' + t2); };
  btn.disabled = true; stage('מוריד קובץ…');
  try {
    /* ⚠️ אותו פותר-מקור של "📚 לפי ריצות" — גם כאן ה-fileUrl יכול להיות
       ריק (כרטיס-גיליון של עבודת-ריצות), ואותה נפילה בדיוק. */
    const bytes = await _runSourceBytes(proof);
    stage('מפצל…');
    const raw = await PDFLib.PDFDocument.load(bytes);
    const norm = await normalizeSpreads(raw);   // כפולה → אותו קובץ פעמיים + "כפולה" בשם
    const src = norm.doc;
    const total = src.getPageCount();
    const runs = splitToKontresim(total, fullSheet);

    // ── כל ריצה = קובץ-PDF אחד (לגרירה ישירה לאפוגי), לא עמודים בודדים בתיקייה ──
    //    סדר-העמודים וסט-העמודים זהים לקודם; רק האריזה השתנתה (מיזוג במקום פיצול).
    // שם-הבסיס מגיע כבר מוכן מ-jobName (שם-עיתון + גיליון [+ ריצה]) — מקור-אמת יחיד
    const safe = s => String(s || '').replace(/[\\/:*?"<>|]/g, '_').trim();
    const baseName = safe(proof.title || 'חוברת');
    const built = [];
    for (const run of runs) {
      stage(`בונה ריצה ${run.num}/${runs.length}…`);
      const out = await PDFLib.PDFDocument.create();
      const idxs = run.pages.filter(sp => sp <= total).map(sp => sp - 1);
      if (!idxs.length) continue;
      const copied = await out.copyPages(src, idxs);      // קריאה-אחת → משאבים משותפים לא משוכפלים
      copied.forEach(pg => out.addPage(pg));
      built.push({ num: run.num, label: run.label, bytes: await out.save() });
    }
    if (!built.length) throw new Error('לא נוצרו עמודים');
    if (built.length === 1) {                              // ריצה אחת → הורדה ישירה, בלי ZIP
      const r = built[0];
      downloadBlob(new Blob([r.bytes], { type: 'application/pdf' }), `${baseName} — ריצה ${r.num} (עמ ${r.label}).pdf`);
    } else {
      stage('בונה ZIP…');
      const zip = new JSZip();
      built.forEach(r => zip.file(`${baseName} — ריצה ${r.num} (עמ ${r.label}).pdf`, r.bytes));   // שטוח: קובץ לכל ריצה
      downloadBlob(await zip.generateAsync({ type: 'blob' }), `${baseName} — ${built.length} ריצות.zip`);
    }
    _buildBanner('✓ הקובץ ירד לתיקיית-ההורדות');
    setTimeout(() => _buildBanner(false), 3500);
    // סימון "הריצות הורדו" — מכבה את התראת האישור באפליקציה
    try {
      if (proof.jobId) {
        const p2 = proof.partId ? `customerProofs/${proof.jobId}/parts/${proof.partId}` : `customerProofs/${proof.jobId}`;
        _au(`${_FBURL}/${p2}.json`).then(u => fetch(u, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ runsDownloadedAt: Date.now() }) }));
      }
    } catch(e){}
    btn.textContent = '✓ הורד';
    setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 2500);
  } catch (e) {
    _buildBanner(false);
    console.error(e); alert('שגיאה בייצור ריצות: ' + e.message);
    btn.textContent = old; btn.disabled = false;
  }
}

// ── עזרים ──
/* שם העבודה להורדה — מקור-אמת יחיד לכל כפתורי-ההורדה בדף (ולשם-הבסיס של הריצות):
   שם-הלקוח · שם-העבודה · גיליון N · שם-הריצה. שם-הלקוח נכנס כי בפועל כותרות
   העבודה הן לעיתים "גיליון 275" בלבד — ובתיקיית-ההורדות אי-אפשר לדעת של מי.
   אם הכותרת כבר מכילה את שם-הלקוח, לא מכפילים. השדות issue/issueNo/edition הם
   אותו נתון בשמות שונים לפי מקור-העבודה, ולכן כולם נבדקים. */
/* החלטת בית-הדפוס על בקשת החלפת-עמודים. אישור פותח ללקוח חלון-עריכה של 48 שעות;
   דחייה/סגירה נועלת מיד. הכתיבה היא לצומת הבקשה בלבד — הקובץ שאושר לא נוגע. */
async function _psDecide(key, approve, btn){
  const [jobId, target] = String(key).split('|');
  const job = (_allRows || []).find(x => String(x.id) === String(jobId));
  const req = ((job && job.changeRequests) || {})[target];
  if (!req) { alert('הבקשה לא נמצאה — רעננו את המסך.'); return; }
  let note = '';
  if (!approve) {

    else { note = prompt('סיבת הדחייה (תוצג ללקוח):', 'הקובץ כבר בהכנה לדפוס') || ''; if (note === null) return; }
  } else if (!confirm('לאשר ללקוח להחליף/למחוק עמודים? חלון העריכה ייפתח ל-48 שעות.')) return;
  const who = 'בית הדפוס';
  const next = approve ? PageSwap.approve(req, { at: Date.now(), by: who })
                       : PageSwap.reject(req, { at: Date.now(), by: who, note: note });
  btn.disabled = true; btn.textContent = '…';
  try {
    await fetch(await _au(`${_FBURL}/${PageSwap.requestPath(jobId, target)}.json`),
      { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(next) });

function jobName(p, partName) {

function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }
function downloadBlob(blob, name) {

}

/* ═══ קישור קצר ללקוח (בקשת-בעלים 2026-07-31) ═══
   הקישורים הארוכים (מזהה 36 תווים + טוקן) נראים מלחיצים בוואטסאפ. כאן יוצרים
   קוד קצר, שומרים אותו ב-Firebase, ומשתפים כתובת קצרה שמפנה אליו (s.html).
   הכתובת הארוכה נשמרת ומוצגת כגיבוי — וקישורים שכבר נשלחו ממשיכים לעבוד. */
async function _makeShortLink(url, meta){
  if (!window.ShortLink) return '';
  try {
    var code = ShortLink.newCode();
    var rec = ShortLink.record(url, Object.assign({ at: Date.now() }, meta || {}));
    var r = await fetch(await _au(`${_FBURL}/${ShortLink.nodePath(code)}.json`),
      { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(rec) });
    if (!r.ok) return '';
    return ShortLink.shortUrl(location.href, code);
  } catch(e){ console.warn('short link failed', e); return ''; }
}
async function shareLink(url, meta) {
  var short = await _makeShortLink(url, meta);
  var send = short || url;                        // נכשל? שולחים את הארוך — לא נתקעים
  try { await navigator.clipboard.writeText(send); } catch (e) {}
  prompt(short ? 'קישור קצר ללקוח — הועתק, אפשר לשלוח:' : 'קישור ללקוח — העתק ושלח:', send);
}

async function copyText(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch (e) {
    try { const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove(); } catch (e2) {}
  }
  const t = btn.textContent; btn.textContent = ok ? '✓' : '⚠️';
  setTimeout(() => btn.textContent = t, 1200);
}

     שנוצר בלי גודל גרם ל-proof-client לנחש 16 עמ' בגיליון, ושבועון 16.5×24 עם
     96 עמ' התחלק ל-6 ריצות של 16 במקום 3 של 32. */
  const prevOf = (function(){

     מרשומת-הלקוח בכל פתיחה — כדי ששינוי עתידי של ברירת-המחדל של הלקוח לא

  });
  const base = location.href.replace(/[^/]+(\?.*)?$/, '');

/* ═══════════ עריכת פרטי גיליון · סגירה להעלאה · העברת ריצה ═══════════
   באטץ' בקשות-בעלים 2026-07-30. הרקע: לקוח העלה את ריצת השבוע לתוך גיליון
   שכבר הושלם. שלושת הכלים כאן פותרים את מה שקרה ואת מה שיקרה שוב:
     ✏️ הדפוס מגדיר את הפרטים והגודל — הלקוח רק מעלה קבצים.
     🔒 גיליון שנסגר/הושלם לא מקבל קבצים (נאכף גם בצד הלקוח).
     ⇄ ריצה שנכנסה לגיליון הלא-נכון מועברת ליעד הנכון, עם תיעוד.            */
const PROOF_PRESETS = [
  { label: 'עיתון רגיל 16.5×24 ס"מ', w: 165, h: 240 },
  { label: '24×33 ס"מ',             w: 240, h: 330 },
  { label: 'A4 (21×29.7)',          w: 210, h: 297 },
  { label: 'A5 (14.8×21)',          w: 148, h: 210 },
  { label: 'A3 (29.7×42)',          w: 297, h: 420 },
  { label: 'טאבלויד 28×40 ס"מ',     w: 280, h: 400 },
];
// "1" / "165x240" / "16.5x24" → {w,h} במ"מ. ריק → null (בלי שינוי)
function _parseSize(raw){
  const s = String(raw == null ? '' : raw).trim();
  if (!s) return null;
  if (/^\d{1,2}$/.test(s) && PROOF_PRESETS[+s - 1]) { const p = PROOF_PRESETS[+s - 1]; return { w: p.w, h: p.h }; }
  const m = s.replace(',', '.').match(/(\d+(?:\.\d+)?)\s*[xX*×]\s*(\d+(?:\.\d+)?)/);
  if (!m) return null;
  let w = +m[1], h = +m[2];
  if (w > 0 && w < 60) w = Math.round(w * 10);      // ס"מ → מ"מ
  if (h > 0 && h < 60) h = Math.round(h * 10);
  return (w > 0 && h > 0) ? { w, h } : null;
}
async function editProof(id){
  const p = _allRows.find(r => r.id === id);
  if (!p) return;
  const cust = prompt('שם הלקוח (עיתון):', p.customer || '');
  if (cust === null) return;
  const title = prompt('שם העבודה / גיליון:', p.title || '');
  if (title === null) return;
  const cur = (+p.reqW > 0 && +p.reqH > 0) ? (p.reqW + 'x' + p.reqH) : '';
  const sizeRaw = prompt('גודל עמוד נדרש (מ"מ או ס"מ) — הלקוח יקבל אזהרה אם יעלה בגודל אחר:\n\n'
    + PROOF_PRESETS.map((x,i)=>`${i+1}. ${x.label}  (${x.w}×${x.h})`).join('\n')
    + '\n\nאפשר גם להקליד "165x240" או "16.5x24". השאירו ריק כדי לא לשנות.', cur);
  if (sizeRaw === null) return;
  const patch = {};
  if (cust.trim() && cust.trim() !== (p.customer||'')) patch.customer = cust.trim();
  if (title.trim() !== (p.title||'')) patch.title = title.trim();
  const sz = _parseSize(sizeRaw);
  if (sz) { patch.reqW = sz.w; patch.reqH = sz.h; }
  else if (String(sizeRaw).trim() && !sz) { alert('הגודל לא הובן — לא שונה.'); }
  if (!Object.keys(patch).length) { msg('לא בוצע שינוי'); return; }
  msg('שומר…');
  try {
    await fetch(await _au(`${_FBURL}/customerProofs/${id}.json`),
      { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch) });
    await loadProofs();
    msg('✓ הפרטים עודכנו' + (sz ? (' · גודל ' + sz.w + '×' + sz.h) : ''));
  } catch(e){ alert('העדכון נכשל: ' + (e.message||e)); }
}

}
async function moveRun(jobId, partId, btn){
  // בלי return שקט: אם משהו לא נמצא — אומרים מה
  const from = _allRows.find(r => String(r.id) === String(jobId));
  if (!from) { alert('הגיליון לא נמצא ברשימה. רעננו את הדף ונסו שוב.'); return; }
  if (!from.parts || !from.parts[partId]) { alert('הריצה לא נמצאה בגיליון הזה. רעננו את הדף ונסו שוב.'); return; }
  const part = from.parts[partId];
  // יעדים אפשריים: גיליונות של אותו לקוח שפתוחים להעלאה, החדש קודם
  const cands = _allRows.filter(r => r && r.id !== jobId
      && String(r.customer||'') === String(from.customer||'')
      && !(window.ProofGuard && ProofGuard.isClosed(r)))
    .sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  if (!cands.length) { alert('אין גיליון פתוח אחר של "' + (from.customer||'') + '" להעביר אליו.\n'
    + 'צרו גיליון חדש (➕ הזמנה ללקוח) ואז העבירו.'); return; }
  const menu = 'להעביר את "' + (part.name || partId) + '" לאיזה גיליון?\n\n'
    + cands.map((c,i)=>`${i+1}. ${c.title || '(ללא שם)'} — נוצר ${_fmtDate(c.createdAt)}${c.parts?(' · '+Object.keys(c.parts).length+' ריצות'):''}`).join('\n')
    + '\n\nהקלידו מספר, או בטלו.';
  const pickRaw = prompt(menu, '1');
  if (pickRaw === null) return;
  const to = cands[(parseInt(pickRaw, 10) || 0) - 1];
  if (!to) { alert('בחירה לא תקינה.'); return; }
  const plan = window.ProofGuard
    ? ProofGuard.planMoveRun(from, to, partId, { now: Date.now(), by: 'דפוס', allowStale: true })
    : { ok: false, errors: ['NO_GUARD'] };
  if (!plan.ok) { alert('לא ניתן להעביר: ' + plan.errors.join(', ')); return; }
  if (!confirm('להעביר את "' + (part.name || partId) + '"\nמ: ' + (from.title||from.id)
    + '\nל: ' + (to.title||to.id) + ' ?\n\nהקובץ עצמו לא זז — רק השיוך.')) return;
  const old = btn.textContent; btn.disabled = true; btn.textContent = 'מעביר…';
  try {
    // קודם כותבים ביעד, ורק אחרי שהצליח מוחקים במקור — כדי שריצה לא תיעלם באמצע
    await fetch(await _au(`${_FBURL}/customerProofs/${to.id}/${plan.toPath}.json`),
      { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(plan.part) });
    await fetch(await _au(`${_FBURL}/customerProofs/${jobId}/${plan.fromPath}.json`),
      { method: 'DELETE' });
    await loadProofs();
    msg('✓ הריצה הועברה ל"' + (to.title || to.id) + '"');
  } catch(e){
    btn.disabled = false; btn.textContent = old;
    alert('ההעברה נכשלה: ' + (e.message||e) + '\nבדקו אם הריצה מופיעה בשני הגיליונות.');
  }
}

// ── ניצול אחסון ──
const STORAGE_LIMIT_GB = 5;   // תקרה לתצוגה (שנה לפי התוכנית שלך)
// ── ניצול-אחסון + פינוי-אוטומטי בהתמלאות (בקשת-משתמש 2026-07-30) ──────────────
// המדידה מבוססת על סכום ה-fileSize שנשמר בכל רשומה (הערכה — לא מדידת-באקט מדויקת).
const _CAP_BYTES = () => STORAGE_LIMIT_GB * 1073741824;
function _proofsMap(){ const m={}; (_allRows||[]).forEach(p=>{ if(p&&p.id) m[p.id]=p; }); return m; }
function _usageBytes(){ if(!window.StorageCleanup) return 0; return StorageCleanup.totalBytes(StorageCleanup.recordFiles(_proofsMap())); }
function _renderUsage(total){
  const u = $('usage'); if(!u) return;
  const gb = total/1073741824, mb = total/1048576;
  const pct = Math.min(100, Math.round(gb / STORAGE_LIMIT_GB * 100));
  const color = pct >= 85 ? '#dc2626' : pct >= 60 ? '#d97706' : '#16a34a';
  const near = pct >= 85;
  u.innerHTML = `<div style="background:#fff;border:1.5px solid ${near?'#fca5a5':'var(--line)'};border-radius:10px;padding:12px 14px;margin:4px 0">
    <b>ניצול אחסון:</b> ${mb.toFixed(0)} MB (${gb.toFixed(2)} GB) · ${pct}% מתוך ${STORAGE_LIMIT_GB}GB
    <div style="height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px">
      <div style="height:100%;width:${pct}%;background:${color}"></div></div>
    <div style="font-size:.78rem;color:#6b7280;margin-top:5px">${near?'⚠️ האחסון כמעט מלא — ':''}פינוי משחרר את הקבצים הישנים ביותר של עבודות שהושלמו.
      <button id="freeSpaceBtn" style="margin-inline-start:6px;padding:4px 12px;font-size:.8rem;background:${near?'#dc2626':'#fff'};color:${near?'#fff':'var(--press)'};border:1.5px solid ${near?'#dc2626':'var(--line)'};border-radius:8px;cursor:pointer;font-weight:700">🧹 פנה מקום</button></div>
  </div>`;
  const b = document.getElementById('freeSpaceBtn'); if(b) b.onclick = () => _offerCleanup(total);
}
$('usageBtn').onclick = () => _renderUsage(_usageBytes());
$('portalsBtn').onclick = () => openPortalsBatch();

/* ── 📥 התקנה כאפליקציה למחשב ────────────────────────────────────────────────
   Chrome/Edge פותחים חלון עצמאי עם אייקון בשולחן-העבודה ובשורת-המשימות.
   דרישות-הדפדפן להצגת ההצעה: manifest עם start_url ואייקונים, HTTPS,
   ו-Service Worker עם מאזין fetch (הוסף ב-sw.js במיוחד בשביל זה).
   ⚠️ הכפתור מוסתר כברירת-מחדל ומופיע רק כשהדפדפן באמת מציע להתקין — כפתור
   שלא עושה כלום גרוע מכפתור שלא קיים. */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(function(e){ console.warn('sw register', e); });
}
/* ⚠️ שני מצבים שבהם הכפתור "לא הופיע" (דווח 2026-07-31):
   1. המסך פתוח *בתוך* האפליקציה הראשית (iframe). הדפדפן לא מציע התקנה לדף
      מוטמע — ההתקנה שייכת לדף העליון. לכן שם מציעים "פתח בחלון נפרד".
   2. כרום לפעמים לא יורה beforeinstallprompt מיד. קודם הסתרנו את הכפתור עד
      שהאירוע נורה — כלומר הוא פשוט לא היה שם. עכשיו הוא תמיד מוצג, ואם אין
      הצעה זמינה — נאמר בדיוק מה לעשות. */
/* ═══ רכיב-פעולות אחיד לשורות-העבודה ═══════════════════════════════════════
   ⚠️ עיקרון-הבטיחות: הרכיב **אינו יוצר ואינו מוחק כפתורים** — הוא מזיז את
   אותם צמתי-DOM שכבר רונדרו. מכאן נובע ישירות:
     · אי-אפשר לאבד פעולה (כל צומת עובר, אף אחד לא נמחק).
     · אי-אפשר לחשוף פעולה שלא הייתה בשורה (אין מקור ליצירה).
     · ה-handlers, ה-data-attributes וה-payloads נשארים **זהים** — כולל
       event-delegation, כי הצמתים הם אותם צמתים.
   הפעולות המסוכנות יורדות לתחתית התפריט, מופרדות בקו ובאדום.
   ⚠️ אין כאן שום שכבת-הרשאות: הסתרה בתפריט אינה אבטחה, והאכיפה נשארת
   בשרת/בחוקים (ראה משימת-ההמשך "Audit הרשאות לפעולות במסך proof-admin"). */
const ACT_DANGER = el => el.matches('.del,[data-deljob],[data-delpart]');
/* סדר-עדיפות לפעולה הראשית — הראשון שקיים בשורה זוכה. הכל מתוך מה שכבר רונדר. */
const ACT_PRIMARY_ORDER = ['[data-opencust]', 'a[href*="proof-viewer"]', '[data-link*="proof-client"]',
                           '[data-dl]', '[data-link]', '[data-portal]', '[data-editproof]'];
let _actOpenMenu = null;
function _actCloseMenu(){ if (_actOpenMenu){ _actOpenMenu.classList.remove('on'); _actOpenMenu = null; } }
function _applyActionGroups(root){
  (root || document).querySelectorAll('.acts:not([data-grouped])').forEach(box => {
    box.setAttribute('data-grouped', '1');
    const items = Array.from(box.children).filter(el => el.nodeType === 1);
    if (items.length <= 2) return;                       // מעט פעולות — אין טעם בתפריט
    const picked = [];
    for (const sel of ACT_PRIMARY_ORDER) {
      if (picked.length >= 2) break;
      const el = items.find(x => !picked.includes(x) && !ACT_DANGER(x) && x.matches(sel));
      if (el) picked.push(el);
    }
    const rest = items.filter(x => !picked.includes(x));
    if (!rest.length) return;
    if (picked[0]) picked[0].classList.add('actPrimary');
    if (picked[1]) picked[1].classList.add('actSecondary');

    const wrap = document.createElement('span'); wrap.className = 'actMoreWrap';
    const btn = document.createElement('button');
    btn.className = 'actMoreBtn'; btn.type = 'button';
    btn.textContent = '⋮ פעולות נוספות'; btn.title = 'פעולות נוספות';
    btn.setAttribute('aria-haspopup', 'true'); btn.setAttribute('aria-expanded', 'false');
    const menu = document.createElement('div'); menu.className = 'actMenu';
    const safe = rest.filter(x => !ACT_DANGER(x)), danger = rest.filter(ACT_DANGER);
    safe.forEach(el => menu.appendChild(el));            // אותו צומת — לא עותק
    if (danger.length) {
      const sep = document.createElement('div'); sep.className = 'actDangerSep';
      menu.appendChild(sep);
      danger.forEach(el => {
        /* אישור שמציג במפורש את שם-העבודה ואת הפעולה. ⚠️ נוסף כשכבה מקדימה
           בלבד — ה-handler המקורי נשאר ורץ רק אם אושר. */
        if (!el.dataset.confirmWired) {
          el.dataset.confirmWired = '1';
          const jobName = (box.closest('tr')?.querySelector('td b')?.textContent || '').trim();
          el.addEventListener('click', ev => {
            const what = el.matches('[data-delpart]') ? 'מחיקת ריצה' : 'מחיקת עבודה';
            const msg = what + (jobName ? ('\n\nעבודה: ' + jobName) : '') + '\n\nהפעולה אינה הפיכה. להמשיך?';
            if (!confirm(msg)) { ev.stopImmediatePropagation(); ev.preventDefault(); }
          }, true);                                       // capture — לפני ה-handler הקיים
        }
        if (!el.textContent.trim() || el.textContent.trim() === '🗑')
          el.textContent = el.matches('[data-delpart]') ? '🗑 מחק ריצה' : '🗑 מחק עבודה';
        menu.appendChild(el);
      });
    }
    box.appendChild(wrap); wrap.appendChild(btn); document.body.appendChild(menu);

    btn.addEventListener('click', ev => {
      ev.preventDefault(); ev.stopPropagation();          // לא לפתוח את הכרטיס שמתחת
      const isOpen = menu.classList.contains('on');
      _actCloseMenu();                                    // תפריט אחד פתוח בכל רגע
      if (isOpen) { btn.setAttribute('aria-expanded', 'false'); return; }
      const r = btn.getBoundingClientRect();
      menu.classList.add('on'); _actOpenMenu = menu;
      btn.setAttribute('aria-expanded', 'true');
      const mh = menu.offsetHeight, mw = menu.offsetWidth;
      menu.style.top  = Math.max(8, Math.min(r.bottom + 6, window.innerHeight - mh - 8)) + 'px';
      menu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - mw - 8)) + 'px';
      try { (menu.querySelector('button,a') || menu).focus({ preventScroll: true }); } catch(e){}
    });
    menu.addEventListener('click', ev => { if (ev.target.closest('button,a')) _actCloseMenu(); });
  });
}
document.addEventListener('click', ev => {
  if (_actOpenMenu && !_actOpenMenu.contains(ev.target) && !ev.target.closest('.actMoreBtn')) _actCloseMenu();
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') _actCloseMenu(); });
window.addEventListener('resize', _actCloseMenu);
window.addEventListener('scroll', _actCloseMenu, true);

/* ⚠️ חיווט "⋮ פעולות נוספות" — בלעדיו התפריט קיים ב-DOM אבל display:none
   ואף אחד לא פותח אותו, כלומר 4 הפעולות שבתוכו (התקנה/חלון-נפרד · פורטלים
   ליומן · ניצול-אחסון · סל-מיחזור) פשוט בלתי-נגישות. זה בדיוק דפוס
   "כפתור שלא מחווט" שנתפס כאן בעבר — לכן יש עליו גם בדיקה. */
(function(){
  const btn = $('moreBtn'), menu = $('moreMenu');
  if (!btn || !menu) return;
  const open = on => { menu.style.display = on ? 'flex' : 'none'; btn.setAttribute('aria-expanded', on ? 'true' : 'false'); };
  open(false);
  btn.onclick = (e) => { e.stopPropagation(); open(menu.style.display === 'none'); };
  // בחירה בתפריט סוגרת אותו (הפעולה עצמה מטופלת ע"י המטפל הקיים של הכפתור)
  menu.addEventListener('click', (e) => { if (e.target.closest('button')) setTimeout(() => open(false), 0); });
  document.addEventListener('click', (e) => { if (!menu.contains(e.target) && e.target !== btn) open(false); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') open(false); });
})();

/* ברירת-המחדל של כיוון-הדפדוף לפי הלקוח (customers[].defaultReadingDirection).
   נקרא **פעם אחת בזמן יצירת-עבודה** ומועתק לרשומת-העבודה. התאמת-שם מנורמלת
   (רווחים כפולים/גרשיים), כדי ש"נקודה צפונית" ו"הנקודה הצפונית" לא יתפספסו
   סתם — אך בלי התאמה-חלקית מסוכנת: רק שוויון מנורמל. */
let _custDirCache = null;
async function _defaultDirFor(name){
  const norm = s => String(s || '').replace(/["'׳״]/g, '').replace(/\s+/g, ' ').trim();
  try {
    if (!_custDirCache) {
      const r = await fetch(await _au(`${_FBURL}/customers.json`));
      if (!r.ok) return 'rtl';
      const list = await r.json();
      _custDirCache = {};
      const arr = Array.isArray(list) ? list : Object.values(list || {});
      arr.forEach(c => { if (c && c.name) _custDirCache[norm(c.name)] = (c.defaultReadingDirection === 'ltr') ? 'ltr' : 'rtl'; });
    }
    return _custDirCache[norm(name)] || 'rtl';
  } catch(e){ return 'rtl'; }
}

/* ⚠️ כותרת אחת בלבד (עיצוב-מחדש 06/08/2026): כשהמסך מוטמע במעטפת-האפליקציה,
   למעטפת כבר יש כותרת ("📥 לקוחות ועבודות"). כותרת פנימית שנייה = "מסך בתוך
   מסך". לכן מסתירים אותה כאן; מונה-"חדש מהלקוחות" ממשיך להישלח למעטפת
   ב-postMessage ומוצג שם, כדי שלא יאבד. בכרטיסייה עצמאית — הכותרת נשארת. */
(function(){
  const embedded = (function(){ try { return window.top !== window.self; } catch(e){ return true; } })();
  if (!embedded) return;
  const h = document.querySelector('.top h2');
  if (h) h.style.display = 'none';
})();
(function(){
  const b = $('installBtn'); if (!b) return;
  const inFrame = (function(){ try { return window.top !== window.self; } catch(e){ return true; } })();
  const installed = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
  if (installed){ b.style.display = 'none'; return; }
  if (inFrame){
    b.textContent = '🔗 פתח בחלון נפרד';
    b.title = 'המסך פתוח בתוך האפליקציה — כדי להתקין אותו כאפליקציה יש לפתוח אותו בכרטיסייה משלו';
    b.style.display = '';
    b.onclick = () => window.open(location.href, '_blank', 'noopener');
    return;
  }
  b.style.display = '';
  b.onclick = async () => {
    const p = window._pwaPrompt;
    if (!p){
      alert('הדפדפן לא מציע התקנה כרגע.\n\nב-Chrome / Edge:\nתפריט ⋮ (למעלה מימין) ← "התקן…" / "Install app"\nאו האייקון 🖥️ שבשורת-הכתובת.\n\nאם המסך כבר מותקן — פתח אותו מהאייקון בשולחן העבודה.');
      return;
    }
    p.prompt();
    try { await p.userChoice; } catch(e){}
    window._pwaPrompt = null;
    b.style.display = 'none';
  };
})();

// מחיקת קובץ בודד מ-Storage (פינוי אמיתי — לא סל-מיחזור, שהמקום ישתחרר)
async function _storageDelete(path){
  if(!path) return false;
  try {
    const r = await fetch(await _au(`https://firebasestorage.googleapis.com/v0/b/solan-printing.firebasestorage.app/o/${encodeURIComponent(path)}`), { method:'DELETE' });
    return r.ok || r.status === 404;   // 404 = כבר לא קיים = נחשב הצלחה
  } catch(e){ return false; }
}

// מודל-אישור לפני פינוי — "ההודעה למנהל לפני הפעולה". אף פעם לא מוחק בלי אישור.
/* ⚠️ מחיקת קבצים מ-Storage מושבתת זמנית (שלב-אבטחה C1, 31/07/2026):
   חוקי-האחסון אינם מתירים delete לאף אחד, כי אימות אנונימי אינו מבחין בין
   עובד לתוקף. הפינוי יחזור בשלב B+ עם תפקיד מאומת. עד אז — מהקונסולה.
   נאמר כאן במפורש כדי שעובד לא ילחץ ויחשוב שהמקום פונה. */
function _offerCleanup(total){
  alert('🔒 פינוי אחסון מושבת זמנית\n\n' +
        'מטעמי אבטחה, מחיקת קבצים מהענן חסומה כרגע לכל המשתמשים —\n' +
        'כדי שגורם לא-מורשה לא יוכל למחוק קובצי לקוחות.\n\n' +
        'לפינוי מקום: Firebase Console ← Storage ← Files.\n' +
        'הפעולה תחזור לממשק בשלב הבא, עם הרשאות מנהל.');
  return;
  /* eslint-disable no-unreachable */
  if(!window.StorageCleanup){ alert('רכיב הפינוי לא נטען — נסו לרענן.'); return; }
  const files = StorageCleanup.recordFiles(_proofsMap());
  const sel = StorageCleanup.selectForPurge(files, { used: total, cap: _CAP_BYTES(), now: Date.now() });
  const ex = document.getElementById('cleanupModal'); if(ex) ex.remove();
  const ov = document.createElement('div'); ov.id='cleanupModal';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100070;display:flex;align-items:center;justify-content:center;padding:16px;direction:rtl';
  const list = sel.toPurge;
  const body = !list.length
    ? `<div style="padding:16px">אין כרגע קבצים ישנים של עבודות שהושלמו לפינוי (הקבצים החדשים/פעילים מוגנים).</div>`
    : `<div style="padding:16px">
        <div style="margin-bottom:8px">כדי לרדת מ-<b>${StorageCleanup.pct(StorageCleanup.usageRatio(sel.before,sel.cap))}</b> ל-<b>~${StorageCleanup.pct(StorageCleanup.usageRatio(sel.after,sel.cap))}</b> יפונו <b>${list.length}</b> קבצים ישנים של עבודות שהושלמו (${StorageCleanup.fmtSize(sel.freed)}):</div>
        <div style="max-height:40vh;overflow:auto;border:1px solid var(--line);border-radius:8px">
          <table style="box-shadow:none"><thead><tr><th>לקוח / עבודה</th><th>גודל</th><th>גיל</th></tr></thead><tbody>
          ${list.map(f=>{ const age=Math.round((Date.now()-f.at)/86400000); return `<tr><td>${escapeHtml(f.customer||'')}${f.title?' · '+escapeHtml(f.title):''}${f.partId?' (ריצה)':''}</td><td style="white-space:nowrap">${StorageCleanup.fmtSize(f.size)}</td><td style="white-space:nowrap">${age} ימים</td></tr>`; }).join('')}
          </tbody></table></div>
        <div style="font-size:.8rem;color:#b45309;margin-top:8px">⚠️ הקבצים יימחקו לצמיתות מהאחסון (לא לסל-המיחזור). רשומת-העבודה נשמרת לתיעוד.</div>
      </div>`;
  ov.innerHTML = `<div style="background:#fff;border-radius:14px;max-width:560px;width:100%;font-family:inherit;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)">
    <div style="background:var(--press);color:#fff;padding:13px 16px;font-weight:800">🧹 פינוי אחסון</div>
    ${body}
    <div style="padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start">
      ${list.length?`<button id="clDo" class="btn" style="background:#dc2626">מחק ${list.length} קבצים · פנה ${StorageCleanup.fmtSize(sel.freed)}</button>`:''}
      <button id="clCancel" class="btn ghost">סגור</button>
    </div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e=>{ if(e.target===ov) ov.remove(); });
  document.getElementById('clCancel').onclick=()=>ov.remove();
  const doBtn=document.getElementById('clDo');
  if(doBtn) doBtn.onclick=async()=>{
    doBtn.disabled=true; doBtn.textContent='מפנה…';
    let done=0;
    for(const f of list){
      const okDel = await _storageDelete(f.path);
      if(okDel){
        const base = f.partId ? `customerProofs/${f.proofId}/parts/${f.partId}` : `customerProofs/${f.proofId}`;
        try { await fetch(await _au(`${_FBURL}/${base}.json`), { method:'PATCH', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ fileUrl:null, filePath:null, fileSize:null, pagesUrl:null, filePurgedAt: Date.now() }) }); } catch(e){}
        done++;
      }
    }
    ov.remove();
    await loadProofs();
    _renderUsage(_usageBytes());
    msg(`🧹 פונו ${done} קבצים`);
  };
}

// בדיקה אוטומטית בטעינה: אם מעל הסף — הודעה+הצעת-פינוי למנהל (פעם אחת לסשן, לא מטריד שוב ושוב)
function _storageAutoCheck(){
  try {
    if (!window.StorageCleanup) return;
    if (sessionStorage.getItem('solanStorageNagged') === '1') return;
    const total = _usageBytes();
    if (StorageCleanup.needsCleanup(total, _CAP_BYTES())) {
      sessionStorage.setItem('solanStorageNagged','1');
      _renderUsage(total);
      _offerCleanup(total);
    }
  } catch(e){}
}

$('trashBtn').onclick = openTrash;
/* ⚠️ ‏.catch מפורש: בלעדיו כשל-טעינה הוא unhandled rejection — ה-then לא
   רץ, ואין שום עקבה ב-console מלבד אזהרה גנרית. ההודעה למשתמש כבר הוצגה
   בתוך loadProofs; כאן רק מונעים שקט. */
loadProofs()
  .then(function(){ setTimeout(_storageAutoCheck, 1500); })
  .catch(function(e){ console.error('טעינה ראשונית נכשלה', e); });
</script>
