<style>
  :root { --press:#2d3561; --press-d:#222a4d; --gold:#c9a84c; --gold-light:#e8d5a3; --green:#16a34a; --red:#dc2626; --amber:#d97706; --line:#e5e7eb; --ink:#1f2937; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Heebo',system-ui,"Segoe UI",Arial,sans-serif; color:var(--ink);
         background:linear-gradient(180deg,#eef1f6 0%,#f5f6f9 100%); min-height:100vh; padding:0 0 28px; }
  .wrap { max-width: 1040px; margin: 0 auto; padding:0 18px; }
  .brandbar { background:linear-gradient(135deg,var(--press) 0%,var(--press-d) 100%); color:#fff; padding:15px 20px;
    box-shadow:0 4px 18px rgba(45,53,97,.28); display:flex; align-items:center; gap:13px; position:relative; margin-bottom:18px; }
  .brandbar::after { content:''; position:absolute; left:0; right:0; bottom:0; height:3px;
    background:linear-gradient(90deg,var(--gold),var(--gold-light),var(--gold)); }
  .brandbar .logo { width:42px; height:42px; border-radius:11px; background:rgba(255,255,255,.1);
    border:1.5px solid rgba(201,168,76,.6); display:flex; align-items:center; justify-content:center; font-size:1.35rem; flex-shrink:0; }
  .brandbar h1 { font-size:1.3rem; font-weight:900; margin:0; } .brandbar h1 span { color:var(--gold); }
  .brandbar .tag { font-size:.8rem; color:var(--gold-light); margin-top:1px; }
  .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:10px; flex-wrap:wrap; }
  .top h2 { font-size:1.05rem; font-weight:800; margin:0; color:var(--press); }
  .btn { padding:10px 17px; border:none; border-radius:10px; background:var(--press); color:#fff; font-weight:700; cursor:pointer; font-size:.9rem; font-family:inherit; transition:all .15s; }
  .btn:hover { background:var(--press-d); }
  .btn.ghost { background:#fff; color:var(--press); border:1.5px solid var(--line); }
  .btn.ghost:hover { border-color:var(--gold); background:#fffdf6; }
  .btn:disabled { opacity:.4; cursor:default; }
  table { width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 4px 20px rgba(45,53,97,.07); }
  th,td { padding:11px 13px; text-align:right; border-bottom:1px solid var(--line); font-size:.88rem; vertical-align:middle; }
  th { background:#eef0f6; font-size:.8rem; font-weight:700; color:var(--press); }
  tr:last-child td { border-bottom:none; }
  .badge { display:inline-block; padding:3px 11px; border-radius:20px; font-size:.76rem; font-weight:700; }
  .b-pending  { background:#fef3c7; color:var(--amber); }
  .b-approved { background:#dcfce7; color:var(--green); }
  .b-rejected { background:#fee2e2; color:var(--red); }
  /* פרופר/עבודה שאושרו — כל השורה בירוק בהיר, שברור מיד שאושר */
  tr.row-ok td { background:#effdf3; }
  tr.row-ok:hover td { background:#e2f9ea; }
  tr.row-ok td:first-child { box-shadow:inset 4px 0 0 var(--green); }
  .acts { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .acts a, .acts button, .acts select { font-size:.8rem; padding:6px 11px; border-radius:8px; border:1.5px solid var(--line); background:#fff; cursor:pointer; text-decoration:none; color:var(--ink); font-family:inherit; transition:all .12s; }
  .acts a:hover, .acts button:hover { border-color:var(--gold); background:#fffdf6; }
  .acts .gen { background:var(--green); color:#fff; border-color:var(--green); font-weight:700; }
  .acts .gen:hover { background:#15803d; border-color:#15803d; }
  .acts .del { background:#fff; color:var(--red); border-color:#fecaca; }
  .acts .dl { background:#f4f1e6; color:#6b5618; border-color:var(--gold-light); font-weight:700; }
  .note { font-size:.78rem; color:var(--red); margin-top:3px; }
  #msg { margin:12px 0; font-size:.85rem; color:#374151; min-height:1.2em; }
  .empty { text-align:center; padding:46px; color:#9ca3af; background:#fff; border-radius:12px; box-shadow:0 4px 20px rgba(45,53,97,.07); }
  .folder { background:#fff; border-radius:12px; box-shadow:0 4px 20px rgba(45,53,97,.07); margin-bottom:14px; overflow:hidden; border:1px solid var(--line); }
  /* ── master-detail: רשימת-לקוחות בצד · עבודות הלקוח הנבחר במרכז ── */
  .mdWrap { display:flex; gap:14px; align-items:flex-start; }
  .mdSide { flex:0 0 240px; max-width:240px; background:#fff; border:1px solid var(--line); border-radius:12px;
    box-shadow:0 4px 20px rgba(45,53,97,.07); overflow:hidden; position:sticky; top:8px; max-height:calc(100vh - 90px); overflow-y:auto; }
  .mdSideTitle { padding:9px 12px; background:#2d3561; color:#fff; font-weight:800; font-size:.86rem; }
  .custItem { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:11px 12px;
    cursor:pointer; border-bottom:1px solid #eee; font-weight:700; color:#2d3561; font-size:.9rem; transition:background .12s; }
  /* בקשות החלפת-עמודים */
  .psTag { display:inline-block; font-size:.76rem; font-weight:800; border-radius:6px; padding:2px 8px; white-space:nowrap; }
  .psWait { background:#fffbeb; border:1.5px solid #fcd34d; color:#b45309; }
  .psOpen { background:#eff6ff; border:1.5px solid #93c5fd; color:#1d4ed8; }
  .psDone { background:#f0fdf4; border:1.5px solid #86efac; color:#166534; }
  .psOk { background:#16a34a !important; color:#fff !important; }
  .psNo { background:#b91c1c !important; color:#fff !important; }
  .custFilterWrap { padding:7px 8px; border-bottom:1px solid var(--line); background:#faf8f2; }
  .custFilterWrap input { width:100%; box-sizing:border-box; padding:6px 9px; font-family:inherit; font-size:.85rem;
    border:1.5px solid #cbd5e1; border-radius:8px; }
  .custFilterWrap input:focus { outline:none; border-color:#2d3561; }
  .custItem:hover { background:#f5f3ec; }
  .custItem.on { background:#2d3561; color:#fff; }
  /* קיבוץ רשימת-הלקוחות לפי יום בשבוע */
  .dayHdr { display:flex; align-items:center; gap:6px; padding:9px 12px; background:#e7ebf3; color:#374151;
    font-size:.82rem; font-weight:800; border-bottom:1px solid #d7dcE7; cursor:pointer; user-select:none;
    letter-spacing:.02em; transition:background .12s; }
  .dayHdr:hover { background:#dbe1ec; }
  .dayHdr .dayArrow { color:var(--press); font-size:.72rem; width:1em; flex:0 0 auto; }
  .dayHdr .dayCnt { margin-inline-start:auto; background:rgba(0,0,0,.08); border-radius:10px; padding:0 8px; font-size:.74rem; font-weight:700; }
  .dayHdr.todayHdr { background:#2d3561; color:var(--gold-light); }
  .dayHdr.todayHdr .dayArrow { color:var(--gold); }
  .dayHdr.todayHdr .dayCnt { background:rgba(255,255,255,.2); }
  /* 🆕 קבצים חדשים מהלקוח שקדם-הדפוס טרם סימן שראה */
  .newDot { background:#dc2626; color:#fff; border-radius:10px; padding:1px 7px; font-size:.7rem;
            font-weight:900; white-space:nowrap; margin-inline-start:4px; }
  .custItem.hasNew { background:#fff5f5; border-inline-start:4px solid #dc2626; }
  .custItem.hasNew.on { background:var(--press); color:#fff; }
  .dayHdr .newDot { margin-inline-start:6px; }
  /* ── פס-סטטוס: התקבל → נצפה → אושר → בדפוס → הושלם ──
     במקום תג-סטטוס בודד שאומר "מאושר" ולא אומר איפה העבודה עומדת באמת. */
  .stgBar { display:flex; gap:3px; align-items:center; margin-top:5px; flex-wrap:wrap; }
  .stg { font-size:.66rem; font-weight:800; border-radius:5px; padding:1px 6px; white-space:nowrap;
         background:#f1f2f6; color:#b0b4c0; border:1px solid #e5e7eb; }
  .stg.on   { background:#e0e7ff; color:#3730a3; border-color:#c7d2fe; }   /* שלב שכבר עבר */
  .stg.cur  { background:var(--press,#2d3561); color:#fff; border-color:var(--press,#2d3561); }
  .stg.cur.done { background:#16a34a; border-color:#16a34a; }
  /* ⏳ עמודים שהלקוח עוד לא שלח — היה קבור בשורת-ריצה, עכשיו גם ברמת-הגיליון */
  .pendTag { display:inline-block; font-size:.72rem; font-weight:800; color:#b45309; background:#fffbeb;
             border:1.5px solid #fcd34d; border-radius:5px; padding:1px 7px; white-space:nowrap; margin-inline-start:6px; }
  .custItem.dayToday { background:#fffbeb; color:#92400e; border-bottom:2px solid var(--gold-light); font-weight:900; }
  .custItem.dayToday.on { background:var(--gold); color:#2d3561; }
  .todayCust { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:11px 14px;
    cursor:pointer; border-bottom:1px solid #eee; font-weight:700; color:#2d3561; transition:background .12s; }
  .todayCust:hover { background:#faf8f2; }
  .todaySec { padding:9px 14px; font-weight:800; color:var(--press); background:#faf8f2; border-bottom:1px solid var(--line); font-size:.9rem; }
  /* תגי-סיווג בחלון "פורטלים ליומן" */
  .pbTag { display:inline-block; font-size:.74rem; font-weight:800; border-radius:6px; padding:2px 8px; white-space:nowrap; }
  .pbNew  { background:#dcfce7; color:#166534; border:1.5px solid #86efac; }
  .pbOk   { background:#eef2ff; color:#3730a3; border:1.5px solid #c7d2fe; }
  .pbWarn { background:#fffbeb; color:#92400e; border:1.5px solid #fcd34d; }
  .pbDup  { background:#f3f4f6; color:#6b7280; border:1.5px solid #e5e7eb; }
  tr.pbMuted td { opacity:.62; }
  /* ── מבנה-פורטל: ימי-השבוע כניווט ראשי ─────────────────────────────── */
  .pvWrap { display:flex; flex-direction:column; gap:0; }
  .pvDays { display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding:9px 12px;
            background:#faf8f2; border:1px solid var(--line); border-radius:12px 12px 0 0; }
  .pvSpacer { flex:1; }
  .pvDay { display:inline-flex; align-items:center; gap:5px; padding:7px 13px; border-radius:9px;
           border:1.5px solid var(--line); background:#fff; color:#2d3561; font-family:inherit;
           font-weight:800; font-size:.88rem; cursor:pointer; }
  .pvDay:hover { background:#f3f4f8; }
  .pvDay.isToday { border-color:var(--gold,#d4af37); }
  .pvDay.on { background:var(--press,#2d3561); color:#fff; border-color:var(--press,#2d3561); }
  .pvCnt { background:rgba(0,0,0,.08); border-radius:9px; padding:0 7px; font-size:.76rem; }
  .pvDay.on .pvCnt { background:rgba(255,255,255,.22); }
  .pvSwitch { padding:6px 11px; border-radius:8px; border:1px dashed #cbd5e1; background:#fff;
              color:#6b7280; font-family:inherit; font-size:.78rem; cursor:pointer; }
  .pvBody { display:grid; grid-template-columns:290px 1fr 220px; align-items:start;
            border:1px solid var(--line); border-top:none; border-radius:0 0 12px 12px; overflow:hidden; }
  .pvSide { border-inline-end:1px solid var(--line); background:#fff; max-height:72vh; overflow:auto; }
  .pvSideTitle { padding:8px 13px; font-weight:800; color:#6b7280; font-size:.82rem;
                 background:#faf8f2; border-bottom:1px solid var(--line); }
  /* כרטיס-לקוח: מצב העבודה נקרא בלי להיכנס פנימה.
     ⚠️ display:block הכרחי — הכרטיס נושא גם את המחלקה .custItem (בשביל החיפוש
     והקליק המשותפים), ו-.custItem מגדירה display:flex. בלי הדריסה הזו שלוש
     שורות-הכרטיס נפרסות זו לצד זו ונצבטות בעמודה של 290px. */
  .pvCust { display:block; padding:10px 13px; border-bottom:1px solid #eee; cursor:pointer; transition:background .12s; }
  .pvCust:hover { background:#faf8f2; }
  .pvCust.on { background:var(--press,#2d3561); color:#fff; }
  .pvCust.on .pvcFoot, .pvCust.on .pvcAct { color:rgba(255,255,255,.75); }
  .pvCust.hasNew { border-inline-start:4px solid #dc2626; }
  .pvcTop { display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .pvcName { font-weight:800; font-size:.9rem; }
  .pvcMeta { display:flex; gap:5px; align-items:center; flex-wrap:wrap; margin-top:5px; }
  .pvcAct { font-size:.75rem; color:#6b7280; }
  .pvcFoot { margin-top:4px; font-size:.72rem; color:#9ca3af; }
  @media (max-width:900px){
    .pvBody { grid-template-columns:1fr; }
    .pvSide { max-height:none; border-inline-end:none; border-bottom:1px solid var(--line); }
  }
  /* ⏰ מי שאמור היה לשלוח היום וטרם — זו הרשימה שרודפים אחריה */
  .todaySec.lateSec { background:#fef2f2; color:#b91c1c; border-bottom-color:#fecaca; }
  .todayCust.lateCust { background:#fff7f7; border-inline-start:4px solid #dc2626; color:#b91c1c; }
  .todayCust.lateCust:hover { background:#fee2e2; }
  .todayCust button { padding:3px 8px; font-size:.8rem; }
  .custItem .cName { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .custItem .cCount { flex:0 0 auto; background:rgba(0,0,0,.10); border-radius:10px; padding:1px 8px; font-size:.76rem; }
  .custItem.on .cCount { background:rgba(255,255,255,.25); }
  .mdMain { flex:1; min-width:0; background:#fff; border:1px solid var(--line); border-radius:12px;
    box-shadow:0 4px 20px rgba(45,53,97,.07); overflow:hidden; }
  /* פאנל "כרטיסים פעילים" בצד שמאל (RTL: הילד האחרון = השמאלי) */
  .mdCards { flex:0 0 210px; max-width:210px; background:#fff; border:1px solid var(--line); border-radius:12px;
    box-shadow:0 4px 20px rgba(45,53,97,.07); overflow:hidden; position:sticky; top:8px; max-height:calc(100vh - 90px); overflow-y:auto; }
  .mdCards .hd { padding:9px 12px; background:#0369a1; color:#fff; font-weight:800; font-size:.86rem; }
  .cardItem { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:10px 12px; cursor:pointer;
    border-bottom:1px solid #eef2f7; font-weight:700; color:#0c4a6e; font-size:.86rem; transition:background .12s; }
  .cardItem:hover { background:#f0f9ff; } .cardItem.on { background:#0369a1; color:#fff; }
  @media (max-width:980px){ .mdCards{flex:auto;max-width:none;width:100%;position:static;max-height:220px} }
  .custHead { padding:11px 14px; border-bottom:1px solid var(--line); background:#faf8f2; }
  /* כפתורי-הכותרת של הלקוח היו <button> חשופים בעיצוב ברירת-המחדל של הדפדפן,
     ובלטו כזרים מול שאר המערכת. עכשיו הם מאותה משפחה כמו .btn.ghost, בגודל
     שמתאים לכותרת (קטן יותר מכפתורי הפעולה הראשיים בראש הדף). */
  .custHead .btn { padding:7px 13px; font-size:.83rem; border-radius:9px; }
  .custHead .btn.ghost:hover { border-color:var(--gold); background:#fffdf6; }
  .custHead select { padding:6px 10px; border-radius:9px; border:1.5px solid var(--line);
                     background:#fff; font-family:inherit; font-size:.83rem; color:var(--ink); cursor:pointer; }
  @media (max-width:760px){ .mdWrap{flex-direction:column} .mdSide{flex:auto;max-width:none;width:100%;position:static;max-height:230px} }
  .folder > summary { cursor:pointer; padding:13px 16px; font-weight:800; font-size:.95rem; color:var(--press);
    background:#eef0f6; list-style:none; user-select:none; border-right:4px solid var(--gold); }
  .folder > summary::-webkit-details-marker { display:none; }
  .folder > summary .count { color:#6b7280; font-weight:600; font-size:.82rem; }
  .folder table { box-shadow:none; border-radius:0; }
</style>

<script>

const _FB_APIKEY = 'AIzaSyAFp99furP4L5hqTI-horBHmGZC9s13dGg';

const _normName = s => String(s||'').replace(/["'.,\-()]/g,'').replace(/\s+/g,' ').trim().toLowerCase();
function _custDay(name){
  const n = _normName(name); if (!n) return '';
  if (_dayOverride[n]) return _dayOverride[n];       // דריסה ידנית קודמת לכול
  if (_dayByCustomer[n]) return _dayByCustomer[n];

  for (const k in _dayByCustomer){ if (_nameInside(k, n)) return _dayByCustomer[k]; }
  return '';
}
// שמירת יום-שליחה ידני ללקוח (או ניקוי) — נשמר ב-customerDayOverride וגובר על היומן
async function _setCustDay(custName, day){
  const n = _normName(custName); if (!n) return;
  if (day) _dayOverride[n] = day; else delete _dayOverride[n];
  try {
    await fetch(await _au(`${_FBURL}/customerDayOverride/${encodeURIComponent(n)}.json`), {
      method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(day || null) });

}

const _isSep = ch => ch === '' || /[\s\-–—·,:;()\[\]"'\/|]/.test(ch);
function _nameInside(hay, needle){
  if (!hay || !needle || needle.length < 3) return false;
  if (hay === needle) return true;
  for (let i = hay.indexOf(needle); i >= 0; i = hay.indexOf(needle, i + 1)){
    const before = i === 0 ? '' : hay[i - 1];
    const after  = (i + needle.length >= hay.length) ? '' : hay[i + needle.length];
    if (_isSep(before) && _isSep(after)) return true;
  }
  return false;
}
function _custHasActiveCard(name){

  if (_activeCardCusts[n]) return true;
  for (const k in _activeCardCusts){ if (_nameInside(k, n)) return true; }
  return false;

let _portalCusts = [];   // לקוחות שיש להם פורטל — גם אם עוד לא העלו כלום
async function _loadWeeklyContext(){
  try {
    const [np, cds, ov, po] = await Promise.all([
      fetch(await _au(`${_FBURL}/newspapers.json`)).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch(await _au(`${_FBURL}/cards.json`)).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch(await _au(`${_FBURL}/customerDayOverride.json`)).then(r=>r.ok?r.json():null).catch(()=>null),
      fetch(await _au(`${_FBURL}/customerPortals.json`)).then(r=>r.ok?r.json():null).catch(()=>null)
    ]);
    /* ⚠️ באג שדווח 31/07/2026: נפתחו פורטלים ל-35 לקוחות, ואף אחד מהם לא הופיע

       פורטל שאי-אפשר לנהל — אי-אפשר לשלוח ממנו קישור או דרישה. */
    _portalCusts = po && typeof po === 'object'
      ? Object.keys(po).map(k => (po[k] && po[k].name) || String(k).replace(/_/g,' ')).filter(Boolean)
      : [];

    const npArr = Array.isArray(np) ? np : (np && typeof np==='object' ? Object.values(np) : []);
    npArr.forEach(n=>{ if (n && n.name && n.day && _DAYS.indexOf(n.day)>=0) dayMap[_normName(n.name)] = n.day; });
    _dayByCustomer = dayMap;
    const active = {};
    const cdArr = Array.isArray(cds) ? cds : (cds && typeof cds==='object' ? Object.values(cds) : []);
    // גם שם-הכרטיס וגם שדה-הלקוח שבו — שדה-הלקוח הוא ההתאמה המדויקת, ולכן עדיף

    });

  } catch(e){}
}

async function loadProofs() {

  await _loadWeeklyContext();   // מפת-ימים + כרטיסים-פעילים (לסידור הרשימה)

// ── רענון-אוטומטי: כשלקוח מעלה קובץ/מאשר — המסך מתעדכן לבד, בלי רענון ידני ──
//    מרענן *רק* כששונה משהו בפועל (חתימת-תוכן), כדי לא לקטוע עבודה/גלילה.
let _sig = '';
function _rowsSig(rows){
  try{ return (rows||[]).map(function(p){
    /* shopSeenAt/pendingPages נכללים כי הם מזינים את חיווי "🆕 חדש", את פס-הסטטוס
       ואת תג העמודים-החסרים. בלעדיהם קדם-הדפוס מסמן "ראיתי" במכשיר אחד והמסך
       השני ממשיך להראות אדום עד רענון ידני. */
    var parts = p.parts ? Object.keys(p.parts).map(function(k){ var t=p.parts[k];
      return k+':'+(t.approvedAt||0)+':'+(t.fileUrl?1:0)+':'+(t.shopSeenAt||0)+':'+((t.pendingPages||[]).join('.')); }).sort().join(',') : '';
    var files = p.files ? Object.keys(p.files).sort().join(',') : '';
    // בקשות החלפת-עמודים בחתימה — אחרת בקשה חדשה מלקוח לא מופיעה עד רענון ידני
    var crs = p.changeRequests ? Object.keys(p.changeRequests).map(function(k){
      var r = p.changeRequests[k]; return k + ':' + (r && r.status) + ':' + ((r && r.decidedAt) || 0);
    }).sort().join(',') : '';
    return [p.id, p.updatedAt||0, p.approvedAt||0, p.apogeeApprovedAt||0, p.version||1,
            p.shopSeenAt||0, p.completedAt||0, p.closedAt||0, (p.pendingPages||[]).join('.'),
            p.readyNotice?1:0, parts, files, crs].join('|');
  }).sort().join(';'); }catch(e){ return String(Math.random()); }
}
async function _autoRefresh(){
  try{
    if (document.hidden) return;                       // בלשונית-רקע אין טעם
    if (document.querySelector('.modal,[data-busy="1"]')) return;   // לא קוטעים דיאלוג פתוח
    const data = await (await fetch(await _au(`${_FBURL}/customerProofs.json`))).json() || {};
    const rows = Object.entries(data).map(function(e){ return Object.assign({id:e[0]}, e[1]); })
      .sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
    const sig = _rowsSig(rows);
    if (sig === _sig) return;                          // אין שינוי — לא נוגעים במסך
    _sig = sig; _allRows = rows; render(_allRows);
    msg(_allRows.length ? (_allRows.length + ' קבצים · ✓ עודכן') : '');
  }catch(e){}
}
setInterval(_autoRefresh, 15000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) _autoRefresh(); });   // חזרה ללשונית → רענון מיידי

function render(rows) {
  if (!rows.length) { $('tableWrap').innerHTML = '<div class="empty">אין קבצים עדיין. לחץ "קובץ חדש".</div>'; return; }
  const base = location.href.replace(/[^/]+(\?.*)?$/, '');
  const fmt = t => t ? new Date(t).toLocaleString('he-IL', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' }) : '—';

  // קיבוץ לפי לקוח — תיקייה לכל לקוח
  const byCustomer = new Map();
  for (const p of rows) {
    const key = (p.customer || 'ללא לקוח').trim();
    if (!byCustomer.has(key)) byCustomer.set(key, []);
    byCustomer.get(key).push(p);
  }
  /* לקוחות שיש להם פורטל אך עדיין לא העלו כלום — נכנסים לרשימה עם 0 עבודות.
     בלי זה, פורטל שנפתח פשוט לא נראה במסך ואי-אפשר לשלוח ממנו קישור או דרישה.
     ⚠️ התאמה מנורמלת, כדי שלא ייווצר כפל כשהשם ברשומת-הפורטל שונה בניקוד/רווח
     משם-הלקוח שעל העבודות. */
  {
    const seen = new Set([...byCustomer.keys()].map(_normName));
    (_portalCusts || []).forEach(function(nm){
      const clean = String(nm || '').trim();
      if (!clean) return;
      const k = _normName(clean);
      if (k && !seen.has(k)) { seen.add(k); byCustomer.set(clean, []); }
    });
  }

  // רישום יעדים לייצור ריצות (כדי לתמוך גם בריצות בודדות שאינן ב-_allRows)
  _genReg = {}; let gi = 0;
  /* הורדה מאוחדת: כפתור-הורדה אחד ("⬇ הורד") שמוריד קובץ-PDF יחיד בשם המלא של
     העבודה — שם-העיתון + גיליון, ובריצה גם שם-הריצה. הפיצול-לקונטרסים נשאר
     כפעולה משנית ("✂ פיצול לריצות"), כי הוא נדרש רק כשעיתון שלם צריך להתפצל. */
  const genCell = (fileUrl, title, jobId, partId) => {
    const key = 'g' + (gi++); _genReg[key] = { fileUrl, title, jobId, partId };
    return `<button class="dl" data-dl="${key}" title="קובץ-PDF יחיד בשם: ${escapeHtml(title)}">⬇ הורד</button>
            <select data-sheet="${key}" title="גודל גיליון לפיצול לקונטרסים"><option value="32">70×100</option><option value="16">64×90</option></select>
            <button class="gen" data-gen="${key}" title="עיתון שלם → קובץ-PDF לכל ריצה (לגרירה ישירה לאפוגי)">✂ פיצול לריצות</button>`;
  };

  /* ── בקשות לקוח להחלפת עמודים ────────────────────────────────────────────
     הלקוח אישר, גילה טעות, וביקש להחליף עמוד. אסור שייפתח לעריכה בלי ידיעתנו —
     הקובץ יכול להיות כבר באימפוזיציה או על המכונה. כאן מאשרים/דוחים, והאישור
     פותח לו חלון-עריכה מוגבל בזמן (page-swap.js). */
  const psCell = (jobId, target, req) => {
    if (!window.PageSwap) return '';
    const st = PageSwap.state(req, Date.now());
    const key = jobId + '|' + target;
    if (st === 'pending') return `<span class="psTag psWait" title="${escapeHtml(req.note||'')}">🔁 בקשת החלפת עמודים${req.note?(' — '+escapeHtml(req.note)):''}</span>
        <button class="psOk" data-ps="${key}">✔ אשר עריכה</button>
        <button class="psNo" data-ps="${key}">✖ דחה</button>`;
    if (st === 'approved') return `<span class="psTag psOpen">✏️ עריכה פתוחה ללקוח · ${escapeHtml(PageSwap.remainingLabel(req, Date.now()))}</span>
        <button class="psNo" data-ps="${key}" title="סגירת חלון העריכה">✖ סגור</button>`;
    if (st === 'used') return `<span class="psTag psDone">🔁 ${escapeHtml(PageSwap.changesLabel(req.changes))}</span>`;
    return '';
  };
  const psReqOf = (p, target) => ((p && p.changeRequests) || {})[target] || null;
  // עדכון-לקוח-שמוכן: תג "עודכן" אם כבר הודענו, או כפתור לעדכן עבודה שכבר הושלמה
  /* ✏️ עריכת פרטי הגיליון בבית-הדפוס: שם-לקוח, שם-עבודה וגודל-עמוד.
     בקשת-בעלים (2026-07-30): "עדיף שאני אערוך את הפרטים של הלקוח ואיזה גודל
     עיתון הוא עושה, והלקוח רק יצטרך להעלות קבצים". */
  const editBtn = (p) => `<button data-editproof="${p.id}" title="ערוך שם-לקוח · שם-עבודה · גודל עמוד">✏️ פרטים</button>`;
  /* 🔒 סגירת גיליון להעלאות. הרקע: לקוח העלה את ריצת השבוע לגיליון שכבר הושלם.
     גיליון שסומן "הושלם" סגור אוטומטית; כאן אפשר לסגור/לפתוח גם בלי זה. */
  const closeBtn = (p) => p.closedAt
    ? `<button data-closeproof="${p.id}" data-on="1" title="נסגר ${fmt(p.closedAt)} — פתיחה תאפשר ללקוח להעלות שוב">🔓 פתח להעלאה</button>`
    : `<button data-closeproof="${p.id}" data-on="0" title="הלקוח לא יוכל להעלות לגיליון הזה">🔒 סגור להעלאה</button>`;
  const notifyBtn = (p) => {
    if (p.readyNotice) return `<span class="psTag" style="background:#dcfce7;color:#166534;border:1.5px solid #86efac" title="עודכן ${fmt(p.readyNotice.at)}">📩 הלקוח עודכן שמוכן</span>`;
    if (p.completedAt) return `<button data-notifyready="${p.id}" title="עדכן את הלקוח שהעבודה מוכנה">🔔 עדכן שמוכן</button>`;
    return '';
  };

  /* ── פס-סטטוס לכל גיליון (בקשת-בעלים 2026-07-31) ──────────────────────────
     עד היום הסטטוס היה מילה אחת ("מאושר"), ולא ענה על השאלה שבאמת נשאלת מול
     המסך: איפה העבודה עומדת עכשיו. השלבים נגזרים משדות שכבר קיימים —
     shopSeenAt/approvedAt/completedAt — ו"בדפוס" מוצלב מול כרטיס-עבודה פעיל
     (הצלבה בקריאה בלבד; אין שדה כזה ברשומת-הגיליון ואיננו כותבים חדש). */
  const stageBar = (p) => {
    if (!window.ShopView) return '';
    const cur = ShopView.stageOf(p, { hasActiveCard: _hasCard(p.customer || '') });
    const at = ShopView.stageIndex(cur);
    return '<div class="stgBar">' + ShopView.STAGES.map(function(s, i){
      const cls = i < at ? 'stg on' : (i === at ? ('stg cur' + (s.key === 'done' ? ' done' : '')) : 'stg');
      return `<span class="${cls}">${s.icon} ${s.label}</span>`;
    }).join('') + '</div>';
  };
  /* ⏳ עמודים חסרים ברמת-הגיליון. היו מוצגים רק בשורת-ריצה, כך שעיתון-מלא עם
     עמודים חסרים נראה תקין לגמרי. הכינוס נעשה במודול הבדוק. */
  const pendTag = (p) => {
    if (!window.ShopView) return '';
    const miss = ShopView.pendingPages(p);
    return miss.length ? `<span class="pendTag" title="הלקוח טרם שלח את העמודים האלה">⏳ חסרים עמ׳ ${miss.join(', ')}</span>` : '';
  };

  /* 👁 סימון-צפייה: מופיע רק כשיש מה לסמן (הלקוח שלח וטרם סומן). כשכבר סומן —
     תג עם מי ומתי, כדי שלא יסמנו פעמיים ולא יתווכחו מי ראה. */
  const seenBtn = (p, pid) => {
    const t = pid ? ((p.parts || {})[pid] || {}) : p;
    if (!t.approvedAt) return '';
    if (t.shopSeenAt) return `<span class="psTag" style="background:#eef2ff;color:#3730a3;border:1.5px solid #c7d2fe" title="${escapeHtml(t.shopSeenBy||'')} · ${fmt(t.shopSeenAt)}">👁 נצפה</span>`;
    return `<button data-seen="${p.id}|${pid || 'full'}" title="עוצר את ההתראה החוזרת, ומעדכן את הלקוח שקיבלנו">👁 ראיתי</button>`;
  };

  const rowHtml = p => {
    const clientLink = `${base}proof-client.html?id=${p.id}`;
    const viewerLink = `${base}proof-viewer.html?id=${p.id}`;  // צפייה בלבד — לשליחה לעובדים
    const parts = p.parts ? Object.entries(p.parts).map(([pid, pt]) => ({ pid, ...pt }))
                                 .sort((a,b)=>(a.approvedAt||0)-(b.approvedAt||0)) : [];

    // ── עבודה לפי ריצות ──
    if (parts.length) {
      const _col = !!_jobCollapsed[p.id];   // עבודה מכווצת → שורות-הריצות מוסתרות
      const head = `<tr class="row-ok">
        <td><span data-jobtoggle="${p.id}" style="cursor:pointer;user-select:none;color:#2d3561;font-weight:900;margin-left:4px" title="${_col?'פתח':'כווץ'} ריצות">${_col?'▶':'▼'}</span> <b>${escapeHtml(p.title || '—')}</b></td>
        <td><span class="badge b-approved">${parts.length} ריצות התקבלו</span>${pendTag(p)}${stageBar(p)}</td>
        <td>נוצר: ${fmt(p.createdAt)}</td>
        <td><div class="acts">
          <a href="${viewerLink}" target="_blank">👁 צפה בדפדוף</a>
          <button data-link="${clientLink}" title="דף ההעלאה של הלקוח — הוא יכול להוסיף/להחליף עמודים ולאשר">📤 קישור העלאה ללקוח</button>
          <button data-link="${viewerLink}" title="דפדוף לצפייה בלבד — בלי העלאה ובלי אישור. לעובדים/למכונה">👁 קישור צפייה לעובדים</button>
          <button data-donejob="${p.id}" data-on="${p.completedAt?1:0}" title="${p.completedAt?'החזר לעבודות פעילות':'סמן כהושלם — יעבור ל"עיתונים שהושלמו"'}">${p.completedAt?'↩ החזר':'✅ הושלם'}</button>
          ${notifyBtn(p)}${editBtn(p)}${closeBtn(p)}
          <button class="del" data-deljob="${p.id}" title="מחק עבודה וכל הריצות">🗑</button>
        </div></td></tr>`;
      const partRows = parts.map(pt => `<tr class="row-ok">
        <td style="padding-right:26px;color:#555">↳ ${escapeHtml(pt.name)} <span style="color:#9ca3af">(${pt.pageCount} עמ')</span>${(pt.pendingPages&&pt.pendingPages.length)?` <span style="font-size:.72rem;font-weight:800;color:#b45309;background:#fffbeb;border:1.5px solid #fcd34d;border-radius:5px;padding:1px 7px;white-space:nowrap">⏳ חסרים עמ׳ ${pt.pendingPages.join(', ')}</span>`:''}</td>
        <td><span class="badge b-approved">מאושר</span></td>
        <td>אושר: ${fmt(pt.approvedAt)}</td>
        <td><div class="acts">
          <a href="${base}proof-viewer.html?id=${p.id}&part=${pt.pid}" target="_blank">👁 צפה</a>
          <button data-link="${base}proof-viewer.html?id=${p.id}&part=${pt.pid}">📤 לעובדים</button>
          ${seenBtn(p, pt.pid)}${genCell(pt.fileUrl, jobName(p, pt.name), p.id, pt.pid)}
          ${psCell(p.id, pt.pid, psReqOf(p, pt.pid))}
          <button data-moverun="${p.id}|${pt.pid}" title="הלקוח העלה לגיליון הלא-נכון? העבר את הריצה לגיליון אחר">⇄ העבר לגיליון</button>
          <button class="del" data-delpart="${p.id}|${pt.pid}|${encodeURIComponent(pt.filePath||'')}" title="מחק ריצה">🗑</button>
        </div></td></tr>`).join('');
      return head + (_col ? '' : partRows);   // מכווץ → מציגים רק את שורת-העבודה
    }

    // ── פרופר-אפוגי שהעלה הדפוס — אישור/נעילה של הלקוח ──
    if (p.apogeeUrl) {
      const approved = !!p.apogeeApprovedAt;
      const link = `${base}imposition-tool.html?proofUrl=${encodeURIComponent(p.apogeeUrl)}&type=${encodeURIComponent(p.apogeeFold||'32')}&auto=1&client=1`;
      return `<tr class="${approved?'row-ok':''}">
        <td><b>${escapeHtml(p.title || 'פרופר אפוגי')}</b></td>
        <td><span class="badge ${approved?'b-approved':'b-wait'}">${approved ? '✓ אושר לדפוס · נעול' : 'ממתין לאישור הלקוח'}</span>${stageBar(p)}</td>
        <td>נוצר: ${fmt(p.createdAt)}${approved ? `<div class="note" style="color:#16a34a">✓ ${escapeHtml(p.apogeeApprovedBy||'')} · ${fmt(p.apogeeApprovedAt)}</div>` : ''}</td>
        <td><div class="acts">
          <a href="${link}" target="_blank">📖 דפדף</a>
          <button class="dl" data-dl="${(function(){ const k='g'+(gi++); _genReg[k]={ fileUrl:p.apogeeUrl, title:jobName(p) }; return k; })()}" title="קובץ-PDF יחיד בשם העבודה">⬇ הורד</button>
          ${approved ? `<button data-unlock="${p.id}" title="בטל נעילה — הלקוח יוכל לשנות/לאשר מחדש">🔓 פתח לשינויים</button>` : ''}
          <button class="del" data-deljob="${p.id}" title="מחק פרופר">🗑</button>
        </div></td></tr>`;
    }

    // ── עיתון שהעלה הלקוח מהפורטל — קבצים מקובצים תחת עיתון אחד (לא כבודדים) ──
    if (p.files) {
      const fkeys = Object.keys(p.files);
      const dls = fkeys.map(k => { const fl = p.files[k]; return (fl && fl.fileUrl)
        ? `<a href="${fl.fileUrl}" target="_blank" title="${escapeHtml(fl.fileName||'')}">⬇ ${escapeHtml((fl.fileName||'קובץ').slice(0,22))}</a>` : ''; }).join(' ');
      const pf = (p.preflight && p.preflight.issueCount > 0)
        ? `<div class="note" style="color:#b45309">⚠️ תקינות: ${escapeHtml((p.preflight.warnings||[]).join(' · '))}</div>`
        : (p.preflight ? `<div class="note" style="color:#16a34a">✓ בדיקת תקינות עברה</div>` : '');
      return `<tr>
        <td><b>${escapeHtml(p.title || (p.customer ? p.customer + ' — עיתון' : 'עיתון'))}</b>
          <span style="color:#9ca3af">(${fkeys.length} קבצים${p.issue ? ' · גיליון ' + escapeHtml(String(p.issue)) : ''})</span>${pf}</td>
        <td><span class="badge b-wait">התקבל מהלקוח</span>${pendTag(p)}${stageBar(p)}</td>
        <td>נוצר: ${fmt(p.createdAt)}</td>
        <td><div class="acts">${dls}
          <button class="del" data-deljob="${p.id}" title="מחק עבודה וכל הקבצים">🗑</button>
        </div></td></tr>`;
    }

    // ── עבודה רגילה (עיתון מלא / ממתין) ──
    const [txt, cls] = STATUS[p.status] || ['—', ''];
    const gen = p.status === 'approved' ? genCell(p.fileUrl, jobName(p), p.id, null)
      : `<button disabled title="זמין רק לאחר אישור">⬇ הורד</button>`;
    const view = p.fileUrl ? `<a href="${viewerLink}" target="_blank">👁 צפה בדפדוף</a>` : '';
    const toWorkers = p.fileUrl ? `<button data-link="${viewerLink}" title="דפדוף לצפייה בלבד — בלי העלאה ובלי אישור. לעובדים/למכונה">👁 קישור צפייה לעובדים</button>` : '';
    const note = (p.status === 'rejected' && p.customerNote) ? `<div class="note">📝 ${escapeHtml(p.customerNote)}</div>` : '';
    const approvedLine = p.approvedAt ? `<div class="note" style="color:#16a34a">✓ אושר: ${fmt(p.approvedAt)}</div>` : '';
    return `<tr class="${p.status==='approved'?'row-ok':''}">
      <td>${escapeHtml(p.title || (p.customer ? p.customer + ' — עיתון' : 'עיתון'))}${note}</td>
      <td><span class="badge ${cls}">${txt}</span>${pendTag(p)}${stageBar(p)}</td>
      <td>נוצר: ${fmt(p.createdAt)}${approvedLine}</td>
      <td><div class="acts">
        <a href="${clientLink}" target="_blank">🔗 פתח</a>
        <button data-link="${clientLink}" title="דף ההעלאה של הלקוח — הוא יכול להוסיף/להחליף עמודים ולאשר">📤 קישור העלאה ללקוח</button>
        ${view}${toWorkers}${seenBtn(p, null)}${gen}${psCell(p.id, 'full', psReqOf(p, 'full'))}${notifyBtn(p)}
        ${editBtn(p)}${closeBtn(p)}
        <button class="del" data-deljob="${p.id}" title="מחק עבודה">🗑</button>
      </div></td></tr>`;
  };

  // ── פריסת master-detail: רשימת-לקוחות בצד · עבודות הלקוח הנבחר במרכז ──
  // הרשימה מסודרת לפי היום בשבוע (מהיומן השבועי); ברירת-המחדל = מסך "היום"
  // שמרכז את מי שאמור לשלוח היום או שיש לו כרטיס-עבודה פעיל. (בקשת-משתמש 2026-07-30)
  const custNames = [...byCustomer.keys()];
  const _today = _DAYS[new Date().getDay()];
  const _dayOf = {}; custNames.forEach(c => _dayOf[c] = _custDay(c));
  if (_selCust == null) _selCust = '__today__';
  if (_selCust !== '__today__' && !byCustomer.has(_selCust)) _selCust = custNames.length ? '__today__' : null;

  // קבוצות-הימים מקווצות כברירת-מחדל; לחיצה על יום פותחת (בקשת-משתמש 2026-07-30)
  const _dayKey = (day) => day || 'ללא יום קבוע';
  const _isDayCollapsed = (day) => _dayCollapsed[_dayKey(day)] !== false;   // undefined → מקווץ
  /* 🆕 חיווי "קבצים חדשים מהלקוח" (בקשת-בעלים 2026-07-31): העלאה שאושרה
     ושקדם-הדפוס עדיין לא סימן שראה (shopSeenAt). אותו שדה שמפעיל את ההתראה
     החוזרת ואת "בית-הדפוס קיבל" בפורטל — מקור-אמת אחד. */
  /* ⚡ מטמון-לרינדור: שתי הפונקציות האלה נקראות 3-4 פעמים לכל לקוח בכל רינדור
     (רצועת-ימים, כרטיס, פאנל-כרטיסים, מסך-היום), ו-_custHasActiveCard סורקת
     בפנים את כל שמות-הכרטיסים הפעילים עם השוואת-מחרוזת. הרינדור רץ כל 15
     שניות. המטמון נבנה מחדש בכל רינדור, ולכן אינו יכול להתיישן. */
  const _nfCache = new Map(), _acCache = new Map();
  const _hasCard = (c) => { if (!_acCache.has(c)) _acCache.set(c, _custHasActiveCard(c)); return _acCache.get(c); };
  const _newFilesFor = (c) => {
    if (_nfCache.has(c)) return _nfCache.get(c);
    const items = byCustomer.get(c) || [];
    let n = 0;
    items.forEach(function(p){
      if (!p) return;
      if (p.approvedAt && !p.shopSeenAt && p.mode !== 'parts') n++;
      Object.keys(p.parts || {}).forEach(function(k){
        const pt = p.parts[k]; if (pt && pt.approvedAt && !pt.shopSeenAt) n++;
      });
    });
    return n;
  };
  const _dayNew = {};   // כמה חדשים בכל יום — לחיווי על כותרת-היום
  const custItemHtml = (c, day) => {
    const items = byCustomer.get(c), on = (c === _selCust);
    const act = items.filter(function(p){ return !p.completedAt; }).length;
    const card = _hasCard(c) ? ' <span title="כרטיס עבודה פעיל">📋</span>' : '';
    const hidden = _isDayCollapsed(day) ? ' style="display:none"' : '';
    const nNew = _newFilesFor(c);
    if (nNew) _dayNew[_dayKey(day)] = (_dayNew[_dayKey(day)] || 0) + nNew;
    const newTag = nNew
      ? ` <span class="newDot" title="${nNew} קבצים חדשים שטרם נצפו">🆕 ${nNew}</span>` : '';
    return `<div class="custItem${on?' on':''}${nNew?' hasNew':''}" data-cust="${escapeHtml(c)}" data-day="${escapeHtml(_dayKey(day))}"${hidden}>
      <span class="cName">📁 ${escapeHtml(c)}${card}${newTag}</span><span class="cCount" title="פעילות מתוך סה״כ">${act}${act!==items.length?('/'+items.length):''}</span></div>`;
  };
  const dayHdrHtml = (day, count) => {
    const col = _isDayCollapsed(day), isToday = (day === _today);
    const nNew = _dayNew[_dayKey(day)] || 0;
    return `<div class="dayHdr${isToday?' todayHdr':''}" data-daytoggle="${escapeHtml(_dayKey(day))}">
      <span class="dayArrow">${col?'▶':'▼'}</span> ${isToday?'📌 ':''}${_dayKey(day)} <span class="dayCnt">(${count})</span>${nNew?` <span class="newDot">🆕 ${nNew}</span>`:''}</div>`;
  };
  // סדר הימים: היום קודם, אחר-כך שאר השבוע במחזור, ולבסוף "ללא יום קבוע"
  const _tIdx = _DAYS.indexOf(_today);
  const _orderedDays = _DAYS.slice(_tIdx).concat(_DAYS.slice(0, _tIdx));
  let sideList = `<div class="custItem dayToday${_selCust==='__today__'?' on':''}" data-cust="__today__">
      <span class="cName">📅 היום — ${_today}</span></div>`;
  // במבנה-פורטל הרשימה הזו נזרקת — אין טעם לבנות אותה כל 15 שניות
  if (!_uiPortal) {
    _orderedDays.forEach(day => {
      const inDay = custNames.filter(c => _dayOf[c] === day).sort((a,b)=>a.localeCompare(b,'he'));
      if (!inDay.length) return;
      sideList += dayHdrHtml(day, inDay.length) + inDay.map(c => custItemHtml(c, day)).join('');
    });
    const _noDay = custNames.filter(c => !_dayOf[c]).sort((a,b)=>a.localeCompare(b,'he'));
    if (_noDay.length) sideList += dayHdrHtml('', _noDay.length) + _noDay.map(c => custItemHtml(c, '')).join('');
    if (!custNames.length) sideList = '<div style="padding:12px;color:#9ca3af;font-size:.85rem">אין לקוחות</div>';
    sideList += '<div id="custNoHit" style="display:none;padding:12px;color:#9ca3af;font-size:.85rem">אין לקוח מתאים</div>';
  }

  // ── מסך "היום": מי אמור לשלוח היום + מי עם כרטיס פעיל ──
  let todayDetail = '';
  if (_selCust === '__today__') {
    /* ⚠️ הפער האמיתי (בקשת-בעלים 2026-07-31): עד היום המסך ענה "מי אמור לשלוח
       היום" — אבל השאלה שנשאלת ב-14:00 היא "אחרי מי אני צריך לרדוף". לכן
       הרשימה מתפצלת לשניים: מי שטרם נרשמה ממנו שליחה היום — ראשון ובאדום.
       ⚠️ "שליחה" נמדדת גם לפי createdAt ולא רק approvedAt: העלאה מהפורטל לא
       תמיד כותבת approvedAt, ולקוח כזה היה מסומן בטעות כמי שלא שלח. */
    const _custRow = (c, late) => { const items=byCustomer.get(c), act=items.filter(p=>!p.completedAt).length;
      const nNew = _newFilesFor(c);
      return `<div class="todayCust${late?' lateCust':''}" data-cust="${escapeHtml(c)}">
        <span>${late?'⏰ ':'📁 '}${escapeHtml(c)}${_hasCard(c)?' 📋':''}${nNew?` <span class="newDot">🆕 ${nNew}</span>`:''}</span>
        <span style="display:flex;gap:6px;align-items:center">
          <button data-portal="${escapeHtml(c)}" title="קישור לפורטל האישי של הלקוח">🔗</button>
          <button data-notice="${escapeHtml(c)}" title="שלח דרישה שתופיע בפורטל הלקוח">📢</button>
          <span class="cCount" style="background:#eef0f6;border-radius:10px;padding:1px 9px;font-size:.78rem">${act} פעילות</span>
        </span></div>`; };
    const dueToday = custNames.filter(c => _dayOf[c] === _today).sort((a,b)=>a.localeCompare(b,'he'));
    const _board = window.ShopView
      ? ShopView.todayBoard(dueToday.map(c => ({ name:c, day:_today, proofs: byCustomer.get(c) || [] })), Date.now())
      : { missing: [], sent: [] };
    const _missing = _board.missing, _sent = dueToday.filter(c => _missing.indexOf(c) < 0);
    todayDetail = `<div class="custHead"><div style="font-size:1.05rem;font-weight:900;color:#2d3561">📅 היום — ${_today}</div>
        <div class="muted" style="font-size:.82rem;color:#6b7280;margin-top:3px">${dueToday.length} אמורים לשלוח · ${_sent.length} שלחו · ${_missing.length} טרם</div></div>`
      + (dueToday.length ? (
          `<div class="todaySec lateSec">⏰ טרם נרשמה שליחה היום (${_missing.length})</div>`
          + (_missing.length ? _missing.map(c => _custRow(c, true)).join('')
                             : '<div style="padding:14px;color:#16a34a;font-weight:700">✓ כולם שלחו היום</div>')
          + `<div class="todaySec">✓ שלחו היום (${_sent.length})</div>`
          + (_sent.length ? _sent.map(c => _custRow(c, false)).join('')
                          : '<div style="padding:14px;color:#9ca3af">עדיין אף אחד</div>')
        ) : '<div style="padding:14px;color:#9ca3af">אין לקוחות ליום זה ביומן השבועי</div>');
  }

  // ── פאנל "כרטיסים פעילים" בצד שמאל (במקום בתחתית מסך-היום) ──
  const _activeCustNames = custNames.filter(c => _hasCard(c)).sort((a,b)=>a.localeCompare(b,'he'));
  const cardsPanel = `<aside class="mdCards"><div class="hd">📋 כרטיסים פעילים (${_activeCustNames.length})</div>`
    + (_activeCustNames.length
        ? _activeCustNames.map(c => { const items=byCustomer.get(c), act=items?items.filter(p=>!p.completedAt).length:0;
            return `<div class="cardItem${c===_selCust?' on':''}" data-cust="${escapeHtml(c)}"><span>📁 ${escapeHtml(c)}</span>${act?`<span class="cCount" style="background:rgba(0,0,0,.08);border-radius:10px;padding:1px 8px;font-size:.74rem">${act}</span>`:''}</div>`; }).join('')
        : '<div style="padding:14px;color:#9ca3af;font-size:.82rem">אין כרטיסים פעילים</div>')
    + `</aside>`;

  const selAll = (_selCust && _selCust !== '__today__') ? byCustomer.get(_selCust) : null;
  // פיצול לפעילות / הושלמו — "עיתונים שהושלמו" נשמרים בקטגוריה נפרדת לכל לקוח
  const sel  = selAll ? selAll.filter(p => !p.completedAt) : null;
  const done = selAll ? selAll.filter(p =>  p.completedAt).sort((a,b)=>(b.completedAt||0)-(a.completedAt||0)) : [];
  const detail = selAll ? `
      <div class="custHead">
        <div style="font-size:1.05rem;font-weight:900;color:#2d3561">📁 ${escapeHtml(_selCust)} <span class="count">(${sel.length})</span></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:7px">
          <button class="btn ghost" data-editcust="${escapeHtml(_selCust)}" title="שינוי שם הלקוח בכל העבודות שלו">✎ ערוך לקוח</button>
          <button class="btn" data-portal="${escapeHtml(_selCust)}" title="קישור קבוע לפורטל האישי של הלקוח">🔗 קישור-פורטל</button>
          <button class="btn ghost" data-notice="${escapeHtml(_selCust)}" title="שלח דרישה שתופיע בפורטל הלקוח">📢 שלח דרישה</button>
          <!-- כפתור העלאת-הפרופר לאישור הוסר מכאן (בקשת-בעלים 2026-07-30):
               הפעולה עברה ללשונית "📤 פרופר ללקוח", שם יש רשימת-לקוחות,
               קיפול לפי טמפלט, בדיקה פנימית ותיעוד-גרסאות. -->
        </div>
        <div style="display:flex;gap:6px;align-items:center;margin-top:8px;font-size:.85rem">
          <span style="color:#6b7280">📅 יום שליחה:</span>
          <select id="setDaySel" title="קובע באיזה יום הלקוח מופיע ברשימה (גובר על היומן)">
            <option value=""${_custDay(_selCust)?'':' selected'}>— ללא —</option>
            ${_DAYS.map(d=>`<option value="${d}"${_custDay(_selCust)===d?' selected':''}>${d}</option>`).join('')}
          </select>
          ${_dayOverride[_normName(_selCust)]?'<span style="color:#16a34a;font-size:.78rem">✓ נקבע ידנית</span>':''}
        </div>
      </div>
      ${sel.length > 1 ? `<div style="padding:6px 14px;background:#faf8f2;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span style="font-size:.82rem;color:#555">${sel.length} עבודות</span>
        <button id="jobsCollapseAll" style="font-size:.8rem">➖ כווץ הכל</button>
        <button id="jobsExpandAll" style="font-size:.8rem">➕ פתח הכל</button></div>` : ''}
      ${sel.length ? `<table><thead><tr><th>שם העבודה / ריצה</th><th>סטטוס</th><th>תאריך</th><th>פעולות</th></tr></thead>
      <tbody>${sel.map(rowHtml).join('')}</tbody></table>`
      : '<div style="padding:18px;text-align:center;color:#9ca3af">אין עבודות פעילות ללקוח זה</div>'}
      ${done.length ? `<div style="margin-top:10px;border-top:2px solid var(--line)">
        <div id="doneHdr" style="padding:9px 14px;background:#f0fdf4;cursor:pointer;font-weight:800;color:#166534;display:flex;gap:8px;align-items:center">
          <span>${_doneOpen?'▼':'▶'}</span> ✅ עיתונים שהושלמו <span class="count">(${done.length})</span>
        </div>
        ${_doneOpen ? `<table><thead><tr><th>שם העבודה / ריצה</th><th>סטטוס</th><th>תאריך</th><th>פעולות</th></tr></thead>
          <tbody>${done.map(rowHtml).join('')}</tbody></table>` : ''}
      </div>` : ''}`
    : (todayDetail || '<div style="padding:26px;text-align:center;color:#9ca3af">בחרו לקוח מהרשימה בצד</div>');

  /* ── מבנה-פורטל: ימי-השבוע כניווט ראשי ─────────────────────────────────────
     ההיררכיה היא יום → לקוחות של אותו יום → הפורטל של הלקוח מבט-דפוס.
     אותן פעולות ואותן שורות כמו במסך הקלאסי — רק הסידור שונה, ולכן כל
     החיווט שמתחת (data-cust / data-portal / data-seen …) ממשיך לעבוד. */
  let portalHtml = '';
  /* ברירת-המחדל היא היום הנוכחי — אבל אם אין בו אף לקוח (שישי/שבת, למשל)
     נופלים ליום הבא שיש בו לקוחות. מסך שנפתח ריק נראה כאילו משהו נשבר. */
  /* ⚠️ '__none__' חייב להיות בשרשרת-הנפילה: אם טעינת היומן נכשלת
     (_loadWeeklyContext בולעת שגיאות) לאף לקוח אין יום, וכל הלקוחות היו
     יושבים תחת "ללא יום" — הלשונית האחרונה — בעוד המסך פותח יום ריק
     ומכריז "אין לקוחות". זה נראה בדיוק כמו אובדן-נתונים. */
  const _pvAuto = (function(){
    if (custNames.some(c => _dayOf[c] === _today)) return _today;
    for (const d of _orderedDays) if (custNames.some(c => _dayOf[c] === d)) return d;
    if (custNames.some(c => !_dayOf[c])) return '__none__';
    return _today;
  })();
  const _pvDayNow = (_pvDay == null) ? _pvAuto : _pvDay;
  // מפתח-היום כפי שהוא כתוב על הכרטיסים (data-day) — משמש גם את סינון-החיפוש
  const _pvDayKey = (_pvDayNow === '__none__') ? 'ללא יום קבוע' : _pvDayNow;
  if (_uiPortal) {
    const day = _pvDayNow;
    const _inDay = (d) => d === '__none__' ? custNames.filter(c => !_dayOf[c])
                                           : custNames.filter(c => _dayOf[c] === d);
    const _newInDay = (d) => _inDay(d).reduce((s, c) => s + _newFilesFor(c), 0);
    // רצועת-ימים: היום קודם, ואז שאר השבוע במחזור — כך שלא צריך לחפש את היום
    const dayTabs = _orderedDays.concat(['__none__']).map(d => {
      const n = _inDay(d).length, nw = _newInDay(d), lbl = d === '__none__' ? 'ללא יום' : d;
      return `<button class="pvDay${d===day?' on':''}${d===_today?' isToday':''}" data-pvday="${escapeHtml(d)}">
        ${d===_today?'📌 ':''}${escapeHtml(lbl)} <span class="pvCnt">${n}</span>${nw?`<span class="newDot">🆕 ${nw}</span>`:''}</button>`;
    }).join('');

    // כרטיס-לקוח: כל מה שצריך כדי להחליט אם לפתוח אותו — בלי לפתוח אותו
    const _card = (c, hidden) => {
      const items = byCustomer.get(c) || [];
      const s = window.ShopView
        ? ShopView.customerSummary(c, items, { day: _dayOf[c], hasActiveCard: _hasCard(c) })
        : { active: items.length, newFiles: 0, pendingPages: [], stage: 'received', lastAt: 0 };
      const st = (window.ShopView ? ShopView.STAGES : []).filter(x => x.key === s.stage)[0];
      return `<div class="pvCust custItem${c===_selCust?' on':''}${s.newFiles?' hasNew':''}" data-cust="${escapeHtml(c)}" data-day="${escapeHtml(_dayKey(_dayOf[c]))}"${hidden?' style="display:none"':''}>
        <div class="pvcTop"><span class="pvcName">📁 ${escapeHtml(c)}${_hasCard(c)?' <span title="כרטיס עבודה פעיל">📋</span>':''}</span>
          ${s.newFiles?`<span class="newDot">🆕 ${s.newFiles}</span>`:''}</div>
        <div class="pvcMeta">
          ${st?`<span class="stg cur${s.stage==='done'?' done':''}">${st.icon} ${st.label}</span>`:''}
          <span class="pvcAct">${s.active} פעילות</span>
          ${s.pendingPages.length?`<span class="pendTag">⏳ חסרים עמ׳ ${s.pendingPages.join(', ')}</span>`:''}
        </div>
        <div class="pvcFoot">${s.lastAt?('אחרון: '+fmt(s.lastAt)):'טרם התקבלו קבצים'}</div>
      </div>`;
    };
    /* כל הלקוחות מצוירים תמיד, ומי שלא ביום-הנבחר מוסתר ב-CSS. זה נראה מיותר —
       אבל זה מה שמאפשר לחיפוש למצוא לקוח *מכל* יום בלי ריצה מחדש של render
       (ריצה מחדש בכל הקלדה גונבת פוקוס). לקוח שלא זוכרים באיזה יום הוא — וזה
       המקרה שבו באמת מחפשים — חייב להימצא. */
    const list = _inDay(day).sort((a,b)=>a.localeCompare(b,'he'));
    const listHtml = custNames.slice().sort((a,b)=>a.localeCompare(b,'he'))
      .map(c => _card(c, list.indexOf(c) < 0)).join('')
      + (list.length ? '' : '<div class="pvEmpty" style="padding:18px;color:#9ca3af;font-size:.86rem">אין לקוחות ליום זה</div>');

    portalHtml = `<div class="pvWrap">
      <div class="pvDays">${dayTabs}
        <span class="pvSpacer"></span>
        <button class="pvDay${_selCust==='__today__'?' on':''}" data-cust="__today__" title="מי אמור לשלוח היום ומי טרם שלח">📅 סיכום היום</button>
        <button class="pvSwitch" id="uiClassic" title="חזרה למסך הרשימה הקודם">↩ תצוגה קודמת</button>
      </div>
      <div class="pvBody">
        <aside class="pvSide">
          <div class="custFilterWrap"><input id="custFilter" type="search" placeholder="🔍 חיפוש לקוח…" autocomplete="off"></div>
          <div class="pvSideTitle">${day==='__none__'?'ללא יום קבוע':day} · ${list.length} לקוחות</div>
          ${listHtml}
          <div id="custNoHit" style="display:none;padding:12px;color:#9ca3af;font-size:.85rem">אין לקוח מתאים</div>
        </aside>
        <section class="mdMain">${detail}</section>
        ${cardsPanel}
      </div></div>`;
  }

  /* הרענון-האוטומטי (כל 15 שניות) מחליף innerHTML ומאפס גלילה. במבנה-פורטל
     הרשימה מכילה את *כל* הלקוחות, ולכן קפיצה-לראש באמצע חיפוש-ויזואלי מרגישה
     כמו תקלה. שומרים ומחזירים. */
  const _prevScroll = (function(){ const e = document.querySelector('.pvSide, .mdSide'); return e ? e.scrollTop : 0; })();
  $('tableWrap').innerHTML = _uiPortal ? portalHtml : `<div class="mdWrap">
      <aside class="mdSide"><div class="mdSideTitle">לקוחות (${custNames.length})
          <button class="pvSwitch" id="uiPortal" title="מעבר לתצוגת ימי-שבוע">📅 תצוגת ימים</button></div>
        <div class="custFilterWrap"><input id="custFilter" type="search" placeholder="🔍 חיפוש לקוח…" autocomplete="off"></div>
        ${sideList}</aside>
      <section class="mdMain">${detail}</section>
      ${cardsPanel}
    </div>`;
  /* ⚠️ כפתור "📅 סיכום היום" ברצועת-הימים נושא data-cust אבל אינו .custItem,
     ולכן מטפל-הקליק המשותף לא תופס אותו — לחיצה עליו לא עשתה כלום, בשקט.
     (בדיוק דפוס הכשל-השקט שכבר עלה כאן פעמיים.) */
  if (_prevScroll) { const e = document.querySelector('.pvSide, .mdSide'); if (e) e.scrollTop = _prevScroll; }
  document.querySelectorAll('.pvDay[data-cust]').forEach(b => b.onclick = () => {
    _selCust = b.dataset.cust; render(rows);
  });
  // ניווט-ימים (מבנה-פורטל בלבד)
  document.querySelectorAll('[data-pvday]').forEach(b => b.onclick = () => {
    _pvDay = b.dataset.pvday;
    // מעבר-יום לא אמור לגרור איתו לקוח מיום אחר לחלון הימני
    if (_selCust !== '__today__' && _dayKey(_dayOf[_selCust]) !== (_pvDay === '__none__' ? 'ללא יום קבוע' : _pvDay)) _selCust = '__today__';
    render(rows);
  });
  /* המעבר חייב להיות דו-כיווני. בגרסה הראשונה היה רק כפתור אחד — מי שלחץ
     "תצוגה קודמת" ננעל עליה, כי הדגל נשמר ב-localStorage ולא הייתה דרך חזרה. */
  const _switchUi = (mode) => { try{ localStorage.setItem('solanShopUi', mode); }catch(e){} location.search = '?ui=' + mode; };
  const _uc = document.getElementById('uiClassic');
  if (_uc) _uc.onclick = () => _switchUi('classic');
  const _up = document.getElementById('uiPortal');
  if (_up) _up.onclick = () => _switchUi('portal');
  /* בחירת-לקוח → מציג את עבודותיו במרכז (בלי טעינה-מחדש מהשרת).
     במבנה-פורטל, בחירת לקוח שנמצא דרך החיפוש מזיזה גם את לשונית-היום אליו —
     אחרת הלקוח נפתח מימין אבל נעלם מהרשימה ברגע שמנקים את החיפוש. */
  document.querySelectorAll('.custItem').forEach(el => el.onclick = () => {
    _selCust = el.dataset.cust;
    if (_uiPortal && el.dataset.day) {
      const d = el.dataset.day;

// הורדת הקובץ למחשב (לשליחה ידנית בוואטסאפ וכו')
async function downloadFile(url, name, btn) {
  const old = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'מוריד…'; }
  try {
    const r = await fetch(url); const blob = await r.blob();
    downloadBlob(blob, name);
  } catch (e) { window.open(url, '_blank'); }
  if (btn) { btn.textContent = old; btn.disabled = false; }
}

// ── פורטל לקוח: קישור קבוע + דרישות + פרופר-אפוגי ──────────────────────────
function _slug(s){ return String(s||'').trim().toLowerCase().replace(/[.#$\[\]\/\\]+/g,'').replace(/\s+/g,'_'); }
// ── עריכת לקוח: שינוי-שם בכל העבודות שלו ─────────────────────────────────────
//    ⚠️ שם-הלקוח הוא גם המקור ל-slug של הפורטל — שינוי-שם משנה את כתובת-הפורטל,
//    ולכן צריך לשלוח ללקוח קישור חדש. מיישמים רק אם המשתמש מאשר במפורש.
async function renameCustomer(oldName){
  const cur = String(oldName||'').trim(); if (!cur) return;
  const rows = _allRows.filter(p => String(p.customer||'ללא לקוח').trim() === cur);
  if (!rows.length) { alert('לא נמצאו עבודות ללקוח הזה'); return; }
  const next = (prompt('שם הלקוח:', cur) || '').trim();
  if (!next || next === cur) return;
  const slugChanges = _slug(next) !== _slug(cur);
  let warn = `לשנות את שם הלקוח מ־"${cur}" ל־"${next}"?\n\nהשינוי יחול על ${rows.length} עבודות.`;
  if (slugChanges) warn += `\n\n⚠️ כתובת פורטל-הלקוח משתנה — הקישור הקודם שנשלח ללקוח יפסיק לעבוד, ויש לשלוח לו קישור-פורטל חדש.`;
  if (!confirm(warn)) return;
  msg('מעדכן שם לקוח…');
  try{
    let done = 0;
    for (const p of rows){
      await fetch(await _au(`${_FBURL}/customerProofs/${p.id}.json`), { method:'PATCH',
        headers:{'Content-Type':'application/json'}, body: JSON.stringify({ customer: next }) });
      done++; msg(`מעדכן… ${done}/${rows.length}`);
    }
    _selCust = next;                 // הבחירה עוברת לשם החדש
    await loadProofs();
    msg(`✓ עודכן ל־"${next}" (${done} עבודות)` + (slugChanges ? ' · שלח קישור-פורטל חדש' : ''));
  }catch(e){ console.error(e); msg('✗ עדכון נכשל: ' + (e.message||e)); }
}
async function portalLink(customer){
  const slug = _slug(customer); if (!slug){ alert('שם לקוח חסר'); return; }
  msg('מכין קישור פורטל…');
  let rec = null;
  try { rec = await (await fetch(await _au(`${_FBURL}/customerPortals/${slug}.json`))).json(); } catch(e){}
  if (!rec || !rec.token){
    rec = { name: customer, token: 'k'+Date.now().toString(36)+Math.random().toString(36).slice(2,10), createdAt: Date.now() };
    await fetch(await _au(`${_FBURL}/customerPortals/${slug}.json`), { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(rec) });
  }
  const base = location.href.replace(/[^/]+(\?.*)?$/, '');
  const link = base + 'customer-portal.html?cust=' + encodeURIComponent(customer) + '&k=' + encodeURIComponent(rec.token);
  shareLink(link, { kind:'portal', customer: customer }); msg('✓ קישור הפורטל מוכן');
}

/* attachApogee הוסר (בקשת-בעלים 2026-07-30): העלאת פרופר לאישור עברה
   ללשונית "פרופר ללקוח". השארת מעלה-קבצים בלתי-נגיש שכותב ל-Firebase
   היא מלכודת — עדיף בלי. רשומות apogeeUrl ותיקות ממשיכות להיות מוצגות. */
async function uploadBytes(path, bytes){
  let lastErr;
  for (const bucket of ['solan-printing.firebasestorage.app']){
    for (let attempt=1; attempt<=3; attempt++){
      try {
        const json = await xhrPost('https://firebasestorage.googleapis.com/v0/b/'+bucket+'/o?name='+encodeURIComponent(path), bytes);
        const token = (json.downloadTokens||'').split(',')[0] || '';
        return 'https://firebasestorage.googleapis.com/v0/b/'+bucket+'/o/'+encodeURIComponent(path)+'?alt=media&token='+token;
      } catch(e){ lastErr=e; if(e.code===403) throw e; await new Promise(r=>setTimeout(r, 1500*attempt)); }
    }
  }
  throw lastErr || new Error('העלאה נכשלה');
}
function xhrPost(url, bytes){
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest(); xhr.open('POST', url); xhr.timeout = 0;
    xhr.setRequestHeader('Content-Type', 'application/pdf');
    const finishSend = (t) => { try { if (t) xhr.setRequestHeader('Authorization', 'Firebase ' + t); } catch(e){} (window._appCheckToken?window._appCheckToken():Promise.resolve(null)).then(function(act){ try{ if(act) xhr.setRequestHeader('X-Firebase-AppCheck', act); }catch(e){} xhr.send(bytes); }, function(){ xhr.send(bytes); }); };
    xhr.onload = () => { if (xhr.status>=200 && xhr.status<300){ try{ resolve(JSON.parse(xhr.responseText)); }catch(e){ const er=new Error('bad'); er.code=xhr.status; reject(er); } return; } const er=new Error('Storage '+xhr.status); er.code=xhr.status; reject(er); };
    xhr.onerror = () => { const e=new Error('שגיאת רשת'); e.code=0; reject(e); };
    xhr.ontimeout = () => { const e=new Error('פג זמן'); e.code=408; reject(e); };
    _fbAuthToken().then(finishSend, () => finishSend(null));
  });
}

    for (const bucket of ['solan-printing.firebasestorage.app', 'solan-printing.appspot.com']) {
      try {

  }

}

// ── ייצור ריצות מהקובץ המאושר ──
function splitToKontresim(totalPages, fullSheet) {
  const layers = [];
  if (fullSheet === 32 && (totalPages === 20 || totalPages === 24)) layers.push(totalPages - 16, 16);
  else {
    const rem = totalPages % fullSheet;
    if (rem !== 0) layers.push(rem);
    let inner = totalPages - rem;
    while (inner > 0) { layers.push(fullSheet); inner -= fullSheet; }
  }
  let front = 1, back = totalPages;
  const range = (a, b) => Array.from({ length: b - a + 1 }, (_, k) => a + k);
  return layers.map((lp, i) => {
    const isLast = i === layers.length - 1, half = lp / 2;
    let pages, label;
    if (isLast && lp === fullSheet) { pages = range(front, front + lp - 1); label = `${front}-${front+lp-1}`; front += lp; }
    else {
      const fe = front + half - 1, bs = back - half + 1;
      if (fe + 1 === bs) { pages = range(front, back); label = `${front}-${back}`; }
      else { pages = [...range(front, fe), ...range(bs, back)]; label = `${front}-${fe}+${bs}-${back}`; }
      front += half; back -= half;
    }
    return { num: i + 1, pages, count: lp, label };
  });
}

// עמודי "כפולה" (עמוד PDF ברוחב כפול = שני עמודי עיתון מחוברים): לא חותכים —
// משאירים את הקובץ כמו שהוא, פשוט מכפילים אותו לשני קבצים זהים (אחד לכל מקום בריצה)
// ומסמנים "כפולה" בשם. מחזיר { doc, labels, spread } — labels[i] = מספרי העמוד ("16-17").
async function normalizeSpreads(src) {
  const pages = src.getPages();
  const plain = { doc: src, labels: pages.map((_, i) => String(i + 1)), spread: pages.map(() => false) };
  if (pages.length < 2) return plain;
  // גודל הבסיס = הגודל השכיח בקובץ (דליים של ~5 מ"מ)
  const bucket = v => Math.round(v / 14.17);
  const freq = {}; let bestK = null;
  pages.forEach(pg => {
    const mb = pg.getMediaBox();
    const k = bucket(mb.width) + 'x' + bucket(mb.height);
    freq[k] = (freq[k] || 0) + 1;
    if (bestK === null || freq[k] > freq[bestK]) bestK = k;
  });
  const baseIdx = pages.findIndex(pg => { const mb = pg.getMediaBox(); return bucket(mb.width) + 'x' + bucket(mb.height) === bestK; });
  const baseW = pages[baseIdx].getMediaBox().width, baseH = pages[baseIdx].getMediaBox().height;
  const isSpread = pg => { const mb = pg.getMediaBox(); return mb.width > baseW * 1.6 && Math.abs(mb.height - baseH) < baseH * 0.12; };
  if (!pages.some(isSpread)) return plain;
  const out = await PDFLib.PDFDocument.create();
  const labels = [], spread = [];
  let n = 1;
  for (let i = 0; i < pages.length; i++) {
    if (!isSpread(pages[i])) {
      const [pg] = await out.copyPages(src, [i]); out.addPage(pg);
      labels.push(String(n)); spread.push(false); n++;
    } else {
      const lbl = n + '-' + (n + 1);
      for (let c = 0; c < 2; c++) {              // אותו עמוד פעמיים — בלי חיתוך
        const [pg] = await out.copyPages(src, [i]); out.addPage(pg);
        labels.push(lbl); spread.push(true);
      }
      n += 2;
    }
  }
  return { doc: out, labels: labels, spread: spread };
}

async function generateRuns(proof, fullSheet, btn) {
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = 'מוריד קובץ…';
  try {
    const bytes = await (await fetch(proof.fileUrl)).arrayBuffer();
    btn.textContent = 'מפצל…';
    const raw = await PDFLib.PDFDocument.load(bytes);
    const norm = await normalizeSpreads(raw);   // כפולה → אותו קובץ פעמיים + "כפולה" בשם
    const src = norm.doc;
    const total = src.getPageCount();
    const runs = splitToKontresim(total, fullSheet);

    // ── כל ריצה = קובץ-PDF אחד (לגרירה ישירה לאפוגי), לא עמודים בודדים בתיקייה ──
    //    סדר-העמודים וסט-העמודים זהים לקודם; רק האריזה השתנתה (מיזוג במקום פיצול).
    // שם-הבסיס מגיע כבר מוכן מ-jobName (שם-עיתון + גיליון [+ ריצה]) — מקור-אמת יחיד
    const safe = s => String(s || '').replace(/[\\/:*?"<>|]/g, '_').trim();
    const baseName = safe(proof.title || 'חוברת');
    const built = [];
    for (const run of runs) {
      btn.textContent = `בונה ריצה ${run.num}/${runs.length}…`;
      const out = await PDFLib.PDFDocument.create();
      const idxs = run.pages.filter(sp => sp <= total).map(sp => sp - 1);
      if (!idxs.length) continue;
      const copied = await out.copyPages(src, idxs);      // קריאה-אחת → משאבים משותפים לא משוכפלים
      copied.forEach(pg => out.addPage(pg));
      built.push({ num: run.num, label: run.label, bytes: await out.save() });
    }
    if (!built.length) throw new Error('לא נוצרו עמודים');
    if (built.length === 1) {                              // ריצה אחת → הורדה ישירה, בלי ZIP
      const r = built[0];
      downloadBlob(new Blob([r.bytes], { type: 'application/pdf' }), `${baseName} — ריצה ${r.num} (עמ ${r.label}).pdf`);
    } else {
      btn.textContent = 'בונה ZIP…';
      const zip = new JSZip();
      built.forEach(r => zip.file(`${baseName} — ריצה ${r.num} (עמ ${r.label}).pdf`, r.bytes));   // שטוח: קובץ לכל ריצה
      downloadBlob(await zip.generateAsync({ type: 'blob' }), `${baseName} — ${built.length} ריצות.zip`);
    }
    // סימון "הריצות הורדו" — מכבה את התראת האישור באפליקציה
    try {
      if (proof.jobId) {
        const p2 = proof.partId ? `customerProofs/${proof.jobId}/parts/${proof.partId}` : `customerProofs/${proof.jobId}`;
        _au(`${_FBURL}/${p2}.json`).then(u => fetch(u, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ runsDownloadedAt: Date.now() }) }));
      }
    } catch(e){}
    btn.textContent = '✓ הורד';
    setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 2500);
  } catch (e) {
    console.error(e); alert('שגיאה בייצור ריצות: ' + e.message);
    btn.textContent = old; btn.disabled = false;
  }
}

/* שם העבודה להורדה — מקור-אמת יחיד לכל כפתורי-ההורדה בדף (ולשם-הבסיס של הריצות):
   שם-הלקוח · שם-העבודה · גיליון N · שם-הריצה. שם-הלקוח נכנס כי בפועל כותרות
   העבודה הן לעיתים "גיליון 275" בלבד — ובתיקיית-ההורדות אי-אפשר לדעת של מי.
   אם הכותרת כבר מכילה את שם-הלקוח, לא מכפילים. השדות issue/issueNo/edition הם
   אותו נתון בשמות שונים לפי מקור-העבודה, ולכן כולם נבדקים. */
/* החלטת בית-הדפוס על בקשת החלפת-עמודים. אישור פותח ללקוח חלון-עריכה של 48 שעות;
   דחייה/סגירה נועלת מיד. הכתיבה היא לצומת הבקשה בלבד — הקובץ שאושר לא נוגע. */
async function _psDecide(key, approve, btn){
  const [jobId, target] = String(key).split('|');
  const job = (_allRows || []).find(x => String(x.id) === String(jobId));
  const req = ((job && job.changeRequests) || {})[target];
  if (!req) { alert('הבקשה לא נמצאה — רעננו את המסך.'); return; }
  let note = '';
  if (!approve) {
    if (req.status === 'approved') { if (!confirm('לסגור את חלון העריכה של הלקוח?')) return; }
    else { note = prompt('סיבת הדחייה (תוצג ללקוח):', 'הקובץ כבר בהכנה לדפוס') || ''; if (note === null) return; }
  } else if (!confirm('לאשר ללקוח להחליף/למחוק עמודים? חלון העריכה ייפתח ל-48 שעות.')) return;
  const who = 'בית הדפוס';
  const next = approve ? PageSwap.approve(req, { at: Date.now(), by: who })
                       : PageSwap.reject(req, { at: Date.now(), by: who, note: note });
  btn.disabled = true; btn.textContent = '…';
  try {
    await fetch(await _au(`${_FBURL}/${PageSwap.requestPath(jobId, target)}.json`),
      { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(next) });
    await loadProofs();
  } catch(e){ alert('העדכון נכשל: ' + (e.message||e)); btn.disabled = false; }
}

function jobName(p, partName) {
  p = p || {};
  const cust = String(p.customer || '').trim(), title = String(p.title || '').trim();
  const issue = p.issue || p.issueNo || p.edition || '';
  const head = title ? ((cust && title.indexOf(cust) < 0) ? (cust + ' — ' + title) : title)
                     : (cust || 'עיתון');
  return [head, issue ? ('גיליון ' + issue) : '', partName || ''].filter(Boolean).join(' — ');
}
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }
function downloadBlob(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
// מציג את הקישור (תמיד ניתן להעתיק, גם בתוך iframe) וגם מנסה להעתיק אוטומטית.
/* ═══ קישור קצר ללקוח (בקשת-בעלים 2026-07-31) ═══
   הקישורים הארוכים (מזהה 36 תווים + טוקן) נראים מלחיצים בוואטסאפ. כאן יוצרים
   קוד קצר, שומרים אותו ב-Firebase, ומשתפים כתובת קצרה שמפנה אליו (s.html).
   הכתובת הארוכה נשמרת ומוצגת כגיבוי — וקישורים שכבר נשלחו ממשיכים לעבוד. */
async function _makeShortLink(url, meta){
  if (!window.ShortLink) return '';
  try {
    var code = ShortLink.newCode();
    var rec = ShortLink.record(url, Object.assign({ at: Date.now() }, meta || {}));
    var r = await fetch(await _au(`${_FBURL}/${ShortLink.nodePath(code)}.json`),
      { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(rec) });
    if (!r.ok) return '';
    return ShortLink.shortUrl(location.href, code);
  } catch(e){ console.warn('short link failed', e); return ''; }
}
async function shareLink(url, meta) {
  var short = await _makeShortLink(url, meta);
  var send = short || url;                        // נכשל? שולחים את הארוך — לא נתקעים
  try { await navigator.clipboard.writeText(send); } catch (e) {}
  prompt(short ? 'קישור קצר ללקוח — הועתק, אפשר לשלוח:' : 'קישור ללקוח — העתק ושלח:', send);
}

async function copyText(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch (e) {
    try { const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove(); } catch (e2) {}
  }
  const t = btn.textContent; btn.textContent = ok ? '✓' : '⚠️';
  setTimeout(() => btn.textContent = t, 1200);
}
