async function sha256(u8){ const h=await crypto.subtle.digest('SHA-256', u8 instanceof Uint8Array?u8:new Uint8Array(u8)); return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
/* אצל לקוח/עובד ש-cdnjs חסום אצלו (סינון-תוכן, פרוקסי, חוסם-פרסומות) pdf.js/pdf-lib לא

function _uploadPdf(path,bytes,onPct){ return _auth().then(tok=> new Promise((res,rej)=>{ const x=new XMLHttpRequest();

  x.onerror=()=>rej(new Error('שגיאת רשת')); x.send(bytes); })); }
function _dbPut(path,obj){ return _auth().then(tok=>fetch(_FBURL+'/'+path+'.json?auth='+tok,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)}).then(r=>r.ok?r.json():Promise.reject(new Error('db '+r.status)))); }
function _dbPatch(path,obj){ return _auth().then(tok=>fetch(_FBURL+'/'+path+'.json?auth='+tok,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)}).then(r=>r.ok?r.json():Promise.reject(new Error('db '+r.status)))); }
function _dbGet(path){ return _auth().then(tok=>fetch(_FBURL+'/'+path+'.json?auth='+tok).then(r=>r.ok?r.json():null)); }
// התראת-שופ: רושם רשומה ל-activityLog המשותף (אותו סכמה כמו _logActivity ב-krtis) →

// ── קיפול/פירוק לפי טמפלט (3 מסלולים מאושרים) → outputPdfBytes + NormalizedFoldResult ──
// ⚠️ חוצה-מסגרות: קובץ שחוזר מה-iframe של מנוע-הקיפול נכשל ב-`instanceof Uint8Array`
//    של הדף. מזהים לפי toString ומעתיקים למרחב-הדף — אחרת pdf-lib כאן דוחה אותו.
function _u8(v){
  if(!v) return null;
  if(v instanceof Uint8Array) return v;
  if(v instanceof ArrayBuffer) return new Uint8Array(v);
  var tag=Object.prototype.toString.call(v);
  if(tag==='[object Uint8Array]' || tag==='[object ArrayBuffer]') return new Uint8Array(v);
  if(ArrayBuffer.isView(v)) return new Uint8Array(v.buffer, v.byteOffset, v.byteLength);
  if(typeof v.length==='number' && v.length>0){ try{ return Uint8Array.from(v); }catch(e){} }
  return null;
}
let _bridge=null;
// שחזור-תצוגה של גיאומטריית מנוע-האפליקציה (foldSignature): מרכזי-תאים COLCX/ROWCY + מרכוז-מדיה
// + תיקון-דש לפי TrimBox/CropBox — לבניית plan-תצוגה לתצוגה-המהירה, זהה 1:1 לפלט-הגשר.
// גיאומטריית-הטמפלטים המובנים (165×240 · גיליון 70×100 · רשת 4×4 · זהה ל-TEMPLATES ב-imposition-tool).
// כולם על אותה רשת COLCX/ROWCY → plan-תצוגה גנרי לכל סוג. (טמפלט מותאם/ערוך → נופל לרינדור-פלט.)
const _COLCX=[125,375,625,875], _ROWCY=[97.5,262.5,437.5,602.5];
const TPL_GEOM = {
  '32':   { rot:[90,-90,90,-90], grids:[[[1,16,13,4],[32,17,20,29],[25,24,21,28],[8,9,12,5]],[[7,10,11,6],[26,23,22,27],[31,18,19,30],[2,15,14,3]]] },
  '32p':  { rot:[90,-90,90,-90], grids:[[[1,16,13,4],[32,17,20,29],[25,24,21,28],[8,9,12,5]],[[3,14,15,2],[30,19,18,31],[27,22,23,26],[6,11,10,7]]] },
  '16perf':{ rot:[-90,90,-90,90], grids:[[[8,1,4,5],[9,16,13,12],[12,13,16,9],[5,4,1,8]],[[6,3,2,7],[11,14,15,10],[10,15,14,11],[7,2,3,6]]] },
  '16p':  { rot:[-90,90,-90,90], grids:[[[8,1,2,7],[9,16,15,10],[12,13,14,11],[5,4,3,6]]] },
  '8perf':{ rot:[90,-90,90,-90], grids:[[[1,4,1,4],[8,5,8,5],[5,8,5,8],[4,1,4,1]],[[3,2,3,2],[6,7,6,7],[7,6,7,6],[2,3,2,3]]] },
  '8p':   { rot:[90,-90,90,-90], grids:[[[1,4,3,2],[8,5,6,7],[5,8,7,6],[4,1,2,3]]] },
  '4perf':{ rot:[90,90,-90,-90], grids:[[[1,1,2,2],[4,4,3,3],[3,3,4,4],[2,2,1,1]],[[1,1,2,2],[4,4,3,3],[3,3,4,4],[2,2,1,1]]] },
  '4p':   { rot:[90,90,-90,-90], grids:[[[1,1,2,2],[4,4,3,3],[3,3,4,4],[2,2,1,1]]] }
};
// plan-תצוגה גנרי: לכל עמוד-פלט n → תא-מקור (מופע ראשון ברשת) → clip+rotation (כמו foldSignature).
async function _appPlanFor(srcU8, legacyType, bleedMm){
  const geom=TPL_GEOM[legacyType]; if(!geom) return null;
  const map={}; let maxN=0;
  geom.grids.forEach((grid,side)=>grid.forEach((rowArr,row)=>rowArr.forEach((pg,col)=>{ if(!(pg in map)) map[pg]={side,col,row}; if(pg>maxN) maxN=pg; })));
  const doc=await PDFLib.PDFDocument.load(srcU8.slice(0), { ignoreEncryption:true });
  const p=doc.getPages()[0], mb=p.getMediaBox();
  const MMc=72/25.4, mwmm=mb.width/MMc, mhmm=mb.height/MMc;
  let offX=(mwmm-1000)/2, offY=(mhmm-700)/2;
  let nb=null; try{ nb=p.getTrimBox(); }catch(e){}
  if(!nb || nb.width>=mb.width-1){ try{ nb=p.getCropBox(); }catch(e){} }
  if(nb && nb.width<mb.width-1){
    const leftM=(nb.x-mb.x)/MMc, rightM=((mb.x+mb.width)-(nb.x+nb.width))/MMc;
    const topM=((mb.y+mb.height)-(nb.y+nb.height))/MMc, botM=(nb.y-mb.y)/MMc;
    if(Math.abs(leftM-rightM)>=1) offX+=(leftM-rightM)/2;
    if(Math.abs(topM-botM)>=1) offY+=(topM-botM)/2;
  }
  const B=bleedMm>0?bleedMm:0; const pages=[];
  for(let n=1;n<=maxN;n++){ const pos=map[n]; if(!pos) continue;
    const cx=_COLCX[pos.col]+offX, cy=_ROWCY[pos.row]+offY, rotation=(geom.rot[pos.col]===90)?90:270, spineRight=(n%2===1);
    const clip=(b)=>{ let bTop=b, bBot=b;
      if(b>0){ if(rotation===90){ bTop=spineRight?b:0; bBot=spineRight?0:b; }
               else { bTop=spineRight?0:b; bBot=spineRight?b:0; } }
      const x0=cx-(120+b), x1=cx+(120+b), y0=cy-(82.5+bTop), y1=cy+(82.5+bBot);
      return { left:x0*MMc, right:x1*MMc, top:(mhmm-y0)*MMc, bottom:(mhmm-y1)*MMc }; };
    pages.push({ finalPageNumber:n, sourcePdfPage:pos.side+1, rotationApplied:rotation, clipPt:clip(0), bleedClipPt:clip(B) });
  }
  return { bleedMm:B, pages };
}
// זיהוי-גיליון אוטומטי מה-PDF: משפחת-גיליון (70×100 / 88×63-A4 / אחר) + גודל-עמוד + תווית.
async function _detectSheet(srcU8){
  try{ const doc=await PDFLib.PDFDocument.load(srcU8.slice(0), { ignoreEncryption:true });
    const mb=doc.getPages()[0].getMediaBox(), MMc=72/25.4;
    const big=Math.max(mb.width,mb.height)/MMc, sml=Math.min(mb.width,mb.height)/MMc;
    if(big>=960 && big<=1060 && sml>=680 && sml<=745) return { family:'70x100', label:'גיליון 70×100 · עמוד 165×240 מ״מ', pageW:165, pageH:240 };
    if(big>=855 && big<=925 && sml>=605 && sml<=680) return { family:'88x63', label:'גיליון 88×63 · עמוד 210×297 (A4) מ״מ', pageW:210, pageH:297 };
    return { family:'other', label:'גיליון ~'+Math.round(big/10)*10+'×'+Math.round(sml/10)*10+' מ״מ', pageW:null, pageH:null };
  }catch(e){ return null; }
}
async function _detectSizeLabel(srcU8){ const s=await _detectSheet(srcU8); return s?s.label:null; }
// חיתוך גלישת-השדרה מפלט-הגשר: מנוע-האפליקציה מוסיף גלישה סימטרית סביב כל עמוד (כולל שדרה,
// ושם היא מציגה תוכן של העמוד השכן). כאן חותכים את צד-השדרה → גלישה רק בראש/רגל/צד-חיצוני,
// השדרה תמיד בקו-0. RTL: עמוד אי-זוגי (שער וימניים) שדרה מימין · זוגי שדרה משמאל.
async function _trimSpineBleed(bytes, bleedMm){
  if(!(bleedMm>0)) return bytes;
  const doc=await PDFLib.PDFDocument.load(bytes, { ignoreEncryption:true });
  const MMc=72/25.4, B=bleedMm*MMc;
  doc.getPages().forEach((pg,i)=>{
    const mb=pg.getMediaBox(); const newW=mb.width-B;
    const spineRight=((i+1)%2)===1;
    const x0= spineRight ? mb.x : mb.x+B;   // שדרה מימין → חותכים את הרצועה הימנית; משמאל → השמאלית
    pg.setMediaBox(x0, mb.y, newW, mb.height);
    pg.setCropBox(x0, mb.y, newW, mb.height);
  });
  return await doc.save();
}
// טמפלט-מסך → סוג-מנוע-אפליקציה: 16perf/32 המאושרים · legacy:<type> מובנים · custom:<key> מכלי-הסימון
// (ה-iframe של הגשר טוען בעצמו את ההגדרות השמורות מ-localStorage — same-origin → טמפלט מותאם עובד אוטומטית)
function _legacyTypeFor(tid){
  if(tid==='16perf') return '16perf';
  if(tid==='70x100-32p-165x240-perfector') return '32';
  if(tid.indexOf('legacy:')===0) return tid.slice(7);
  if(tid.indexOf('custom:')===0) return tid.slice(7);
  return null;
}
async function foldByTemplate(tid, srcU8, bleedMm){
  bleedMm = bleedMm>0 ? bleedMm : 0;
  // כל טמפלטי-האפליקציה (מובנים + מותאמים) → המנוע הקיים והמוכח (imposition-tool.html fold) דרך הגשר.
  const legacyType=_legacyTypeFor(tid);
  if(legacyType){
    if(!_bridge) _bridge=LB.createLegacyBridge({ iframeUrl:'imposition-tool.html' });
    await _bridge.ready();
    const out=await _bridge.runFold({ arrayBuffer:srcU8.slice(0), type:legacyType, firstSide:0, mirror:false, bleedMm:bleedMm, requestId:Date.now() });
    const _rawS=_u8(out&&out.bytes);
    if(!_rawS || !_rawS.length) throw new Error('הקיפול לא החזיר קובץ תקין (טמפלט '+legacyType+')');
    const bytes = bleedMm>0 ? await _trimSpineBleed(_rawS, bleedMm) : _rawS;   // שדרה בקו-0
    const outHash=await sha256(new Uint8Array(bytes));
    const r=ADP.legacyReportToResult({ report:out.report, bytes:bytes, sourceFile:{fileId:'src'}, templateId:tid, engineVersion:(_bridge.diagnostics().version||''), bridgeMode:'same-origin-iframe', outputHash:outHash });
    let plan=null;
    if(TPL_GEOM[legacyType]){ try{ plan=await _appPlanFor(srcU8, legacyType, bleedMm); }catch(e){ plan=null; } }   // plan-תצוגה (כל טמפלט מובנה)
    return { bytes:bytes, result:r, plan:plan, srcBytes:srcU8, bleedMm:bleedMm };
  }
  // decoder-v2 (88x63 בלבד — 32p עבר לגשר-האפליקציה למעלה) · sheetTrimFallback: בלי TrimBox → Trim נומינלי ממורכז
  const layout = DEC.DEFAULT_LAYOUT_88x63;
  const ex=await EXEC.decodeToPdf({ sourceArrayBuffer:srcU8.slice(0), template:{id:tid}, startPage:1, bleedMm:bleedMm, requestId:Date.now(),
    sheetTransform:(s)=>ADP.sheetTrimFallback(s, layout) });
  if(!ex.bytes || (ex.errors&&ex.errors.length)) throw new Error('פירוק נכשל: '+(ex.errors||[]).join(', '));
  const outHash=await sha256(new Uint8Array(ex.bytes));
  const r=ADP.runDecoderV2Adapter({ plan:ex.plan, bytes:ex.bytes, templateId:tid, templateVersion:1, sourceFile:{fileId:'src'}, outputHash:outHash });
  return { bytes:ex.bytes, result:r, plan:ex.plan, srcBytes:srcU8, bleedMm:bleedMm };   // plan → תצוגה-מהירה crop-from-source
}

// ── עיתון מרובה-קונטרסים (תפירת-אוכף מקוננת): R-1 חיצוני, R-2 פנימי, וכו' ──
//    כל קונטרס מקופל בנפרד דרך מנוע-האפליקציה, ואז מרכיבים לפי assembleNestedRunOrder:
//    64 עמ' = R1[1-16] R2[1-16] R2[17-32] R1[17-32]. פלט = PDF אחד רציף בסדר-קריאה.
// runDescs = [{ u8, legacyType, pages, name }] לפי סדר R-1, R-2… (חיצוני→פנימי)
async function foldMultiRun(runDescs, bleedMm){
  bleedMm = bleedMm>0 ? bleedMm : 0;
  if(!_bridge) _bridge=LB.createLegacyBridge({ iframeUrl:'imposition-tool.html' });
  await _bridge.ready();
  const runs=[];   // { outBytes, srcBytes, plan, pages }
  for(let i=0;i<runDescs.length;i++){
    const d=runDescs[i], tag='R-'+(i+1)+(d.name?(' ('+d.name+')'):'');
    // אימות-קלט: קובץ פגום/חסר לריצה → שגיאה שמזהה בדיוק איזו ריצה (במקום שגיאת-pdf עמומה)
    const u=_u8(d.u8);
    if(!u || !u.length) throw new Error('קובץ הריצה '+tag+' לא נטען כראוי — בחר אותו מחדש');
    if(!d.legacyType) throw new Error('לריצה '+tag+' לא נבחר טמפלט');
    let out;
    try{
      out=await _bridge.runFold({ arrayBuffer:u.slice(0), type:d.legacyType, firstSide:0, mirror:false, bleedMm:bleedMm, requestId:'mr'+Date.now()+'_'+i });
    }catch(e){ throw new Error('קיפול ריצה '+tag+' נכשל: '+(e&&e.message||e)); }
    const raw=_u8(out&&out.bytes);
    if(!raw || !raw.length) throw new Error('קיפול ריצה '+tag+' לא החזיר קובץ תקין (טמפלט '+d.legacyType+')');
    const bytes = bleedMm>0 ? await _trimSpineBleed(raw, bleedMm) : raw;   // שדרה בקו-0
    let plan=null; try{ plan=await _appPlanFor(u, d.legacyType, bleedMm); }catch(e){ plan=null; }
    runs.push({ outBytes:bytes, srcBytes:u, plan, pages:d.pages });
  }
  const order = ADP.assembleNestedRuns(runs.map(r=>r.pages));   // גדלים-שונים לכל קונטרס
  // הרכבת PDF-פלט אחד רציף בסדר-קריאה (מקור-אמת יחיד לגיבוב/העלאה/אישור).
  // ⚠️ copyPages פעם-אחת לכל ריצה (עם כל האינדקסים) — כך pdf-lib ממחזר את תמונת-הגיליון
  //    המשותפת פעם-אחת לריצה. copyPages עמוד-בכל-פעם היה מכפיל את התמונה (76MB × 64 = 2.4GB).
  const outDoc=await PDFLib.PDFDocument.create();
  const loaded=[];
  for(let ri=0;ri<runs.length;ri++){
    const rb=runs[ri].outBytes;
    if(!rb || !rb.length) throw new Error('הרכבת החוברת נכשלה — לריצה R-'+(ri+1)+' אין קובץ');
    try{ loaded.push(await PDFLib.PDFDocument.load(rb, { ignoreEncryption:true })); }
    catch(e){ throw new Error('הרכבת החוברת נכשלה בריצה R-'+(ri+1)+': '+(e&&e.message||e)); }
  }
  const copied=[];   // copied[runIndex][posInRun] = copied page
  for(let ri=0;ri<loaded.length;ri++){
    const positions=order.filter(o=>o.runIndex===ri).map(o=>o.posInRun);
    const uniq=Array.from(new Set(positions));
    const pgs=await outDoc.copyPages(loaded[ri], uniq.map(p=>p-1));   // קריאה-אחת → תמונה משותפת פעם-אחת
    copied[ri]={}; uniq.forEach((p,i)=>{ copied[ri][p]=pgs[i]; });
  }
  for(const o of order){ outDoc.addPage(copied[o.runIndex][o.posInRun]); }
  const combined=await outDoc.save();
  const outHash=await sha256(new Uint8Array(combined));
  const r=ADP.legacyReportToResult({ report:{ pagesOut:order.length, signatures:runs.length }, bytes:combined,
    sourceFile:{fileId:'multi'}, templateId:'multi:'+runDescs.map(d=>d.legacyType).join('+'),
    engineVersion:(_bridge.diagnostics().version||''), bridgeMode:'same-origin-iframe', outputHash:outHash });
  const book = { bleedMm, runs:runs.map(x=>({srcBytes:x.srcBytes, plan:x.plan})), order };
  return { bytes:combined, result:r, book, plan:null, srcBytes:null, bleedMm, runCount:runs.length };
}

// ── תצוגה: pdf.js doc משותף (פרסור פעם-אחת) · תור-רינדור מסודר · thumbnails עצלים ──
//    כל עמוד-פלט מטמיע את גיליון-הפרופר המלא → רינדור כבד; לכן: doc יחיד, רינדור מסודר,
//    ו-thumbnails מרונדרים רק כשנגללים לתצוגה (IntersectionObserver) — לא 32 מיד.
let _outDoc=null, _outKey=null; const _img={};   // מטמון: pageNo → dataURL(JPEG · רזולוציה גבוהה)
async function getOutDoc(bytes){ if(_outDoc && _outKey===bytes) return _outDoc;
  try{ _outDoc && _outDoc.destroy(); }catch(e){} for(const k in _img) delete _img[k];
  // עותק-buffer: pdf.js מעביר את ה-buffer ל-worker — בלי עותק ה-bytes המקוריים נהרסים (נדרשים להעלאה/hash)
  _outDoc=await pdfjsLib.getDocument({data:bytes.slice(0)}).promise; _outKey=bytes; return _outDoc; }
// ── נעילת-רינדור עם *עדיפות*: ניווט(foreground) מקדים תמיד את הרקע(background) ──
//    כך שהדפדוף מיידי ולא מחכה שהרקע יסיים. worker-יחיד → פעולה אחת בכל רגע.
let _busy=false, _fgWaiting=0, _avgMs=0;
async function renderLock(isFg, fn){
  if(isFg) _fgWaiting++;
  try{ while(_busy || (!isFg && _fgWaiting>0)) await new Promise(r=>setTimeout(r, isFg?12:70));
    _busy=true; try{ return await fn(); } finally{ _busy=false; }
  } finally{ if(isFg) _fgWaiting--; }
}
async function _renderPage(pdf, i){   // רזולוציה גבוהה (דגימת-על → חד). פענוח-התמונות שולט בזמן.
  await _whenVisible();   // לא מתחילים רינדור בלשונית-רקע (עלול להיתקע)
  const pg=await pdf.getPage(i); const v1=pg.getViewport({scale:1});
  const dpr=Math.min(window.devicePixelRatio||1, 2), dispH=Math.min((window.innerHeight||900)*0.6, 1000);
  const targetH=Math.min(Math.max(dispH*dpr, dispH*2.6), 2400), sc=Math.max(1.6, Math.min(8, targetH/v1.height));
  const vp=pg.getViewport({scale:sc}); const cv=document.createElement('canvas'); cv.width=Math.round(vp.width); cv.height=Math.round(vp.height);
  const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height); ctx.imageSmoothingQuality='high';
  await pg.render({canvasContext:ctx, viewport:vp}).promise; return cv.toDataURL('image/jpeg',0.92);
}
async function pageImg(pdf, i, isFg){ if(_img[i]) return _img[i];
  return renderLock(isFg!==false, async ()=>{ if(_img[i]) return _img[i];
    const t0=performance.now(); const u=await _renderPage(pdf,i); const dt=performance.now()-t0; _avgMs=_avgMs? _avgMs*0.6+dt*0.4 : dt; _img[i]=u; return u; }); }
async function smallImg(pdf, i){ return renderLock(false, async ()=>{ await _whenVisible(); const pg=await pdf.getPage(i); const v1=pg.getViewport({scale:1}); const vp=pg.getViewport({scale:140/v1.width});
  const cv=document.createElement('canvas'); cv.width=Math.round(vp.width); cv.height=Math.round(vp.height); const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  await pg.render({canvasContext:ctx,viewport:vp}).promise; return cv.toDataURL('image/jpeg',0.8); }); }
async function renderThumbs(host, bytes){ const pdf=await getOutDoc(bytes); host.innerHTML='';
  const io=new IntersectionObserver(ents=>{ ents.forEach(en=>{ if(en.isIntersecting){ const th=en.target; io.unobserve(th); const i=+th.dataset.p;
    smallImg(pdf,i).then(u=>{ const im=new Image(); im.src=u; im.style.width='88px'; const ph=th.querySelector('.ph'); if(ph)ph.replaceWith(im); }).catch(()=>{}); } }); },{root:null,rootMargin:'220px'});
  for(let i=1;i<=pdf.numPages;i++){ const th=document.createElement('div'); th.className='th'; th.dataset.p=i;
    th.innerHTML='<div class="ph" style="width:88px;height:120px;display:flex;align-items:center;justify-content:center;color:#475569">⏳</div><div>'+i+'</div>'; host.appendChild(th); io.observe(th); } }
function _spreadGroups(n){ const g=[]; if(n<=0)return g; g.push([0]); for(let k=1;k<n;k+=2) g.push(k+1<n?[k,k+1]:[k]); return g; }
// ── זום בדפדוף (עובד גם אצל הלקוח וגם בצד-הדפוס) ────────────────────────────
//    לחצן 🔍 מפעיל מצב-זום; אז גלגלת-העכבר מקרבת/מרחיקה, וגרירה מזיזה את התצוגה.
//    מיושם ב-CSS transform על התוכן (לא רינדור מחדש) → מיידי ולא מעמיס.
function _setupZoom(){
  const sp=$('_sp'), btn=$('_zoom'); if(!sp||!btn) return;
  let on=false, sc=1, tx=0, ty=0, drag=null;
  const target=()=> sp.querySelector('img,canvas');
  const apply=()=>{ const t=target(); if(!t) return;
    t.style.transformOrigin='center center';
    t.style.transform='translate('+tx+'px,'+ty+'px) scale('+sc+')';
    t.style.cursor = (on && sc>1) ? 'grab' : (on?'zoom-in':'');
    sp.style.overflow='hidden';
    btn.textContent = on ? ('🔍 זום '+Math.round(sc*100)+'%') : '🔍 זום';
    btn.style.background = on ? '#c9a84c' : ''; btn.style.color = on ? '#1a1a2e' : '';
  };
  const reset=()=>{ sc=1; tx=0; ty=0; apply(); };
  window._zoomReset=reset;                  // מעבר-עמוד מאפס את הזום
  btn.onclick=()=>{ on=!on; if(!on) reset(); else apply(); };
  sp.addEventListener('wheel', (e)=>{
    if(!on) return;                          // בלי מצב-זום — גלילת-הדף רגילה
    e.preventDefault();
    const prev=sc;
    sc = Math.min(6, Math.max(1, sc * (e.deltaY<0 ? 1.15 : 1/1.15)));
    if(sc===1){ tx=0; ty=0; } else { const k=sc/prev; tx*=k; ty*=k; }   // שומר על נקודת-המיקוד
    apply();
  }, {passive:false});
  sp.addEventListener('mousedown',(e)=>{ if(!on||sc<=1) return; e.preventDefault(); drag={x:e.clientX-tx,y:e.clientY-ty}; const t=target(); if(t) t.style.cursor='grabbing'; });
  window.addEventListener('mousemove',(e)=>{ if(!drag) return; tx=e.clientX-drag.x; ty=e.clientY-drag.y; apply(); });
  window.addEventListener('mouseup',()=>{ if(!drag) return; drag=null; apply(); });
  sp.addEventListener('dblclick',()=>{ if(on) reset(); });   // דאבל-קליק = איפוס
  apply();
}
function _loadImg(url){ return new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=url; }); }
// חיתוך "מסגרת-לבנה" מכל 4 הצדדים של כל עמוד (מסיר שוליים-לבנים/קצה-נייר בשדרה ובחוץ),
// ואז חיבור העמודים לכפולה על canvas אחד (hi=שמאל · lo=ימין · צמוד).
let _SPINE_TRIM_PCT = 0;   // אחוז-חיתוך-מסגרת מכל צד של כל עמוד
function _cropBorderCv(img, pct){ const t=Math.max(0,Math.round(img.width*pct/100));
  const w=Math.max(4,img.width-2*t), h=Math.max(4,img.height-2*t);
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img, t,t,w,h, 0,0,w,h); return cv; }
// מרכיב את התצוגה הנוכחית: עמוד בודד או כפולה (hi שמאל · lo ימין), עם חיתוך-מסגרת pct
async function _composeView(pageUrls, pct){
  const imgs=(await Promise.all(pageUrls.map(_loadImg))).filter(Boolean); if(!imgs.length) return null;
  const cvs=imgs.map(im=>_cropBorderCv(im, pct));
  if(cvs.length===1) return cvs[0].toDataURL('image/jpeg',0.92);
  const H=Math.max(cvs[0].height,cvs[1].height), cv=document.createElement('canvas'); cv.width=cvs[0].width+cvs[1].width; cv.height=H;
  const c=cv.getContext('2d'); c.fillStyle='#fff'; c.fillRect(0,0,cv.width,cv.height);
  c.drawImage(cvs[0], 0, Math.round((H-cvs[0].height)/2)); c.drawImage(cvs[1], cvs[0].width, Math.round((H-cvs[1].height)/2));   // hi שמאל · lo ימין · צמוד
  return cv.toDataURL('image/jpeg',0.92); }
// דפדוף: השער ראשון · ניווט בעדיפות (פס-התקדמות+ETA, מבטל ישן) · המשך-רקע · RTL נכון · חד · מסך-מלא
async function mountFlipbook(host, bytes){
  const pdf=await getOutDoc(bytes); const n=pdf.numPages; const groups=_spreadGroups(n); let gi=0, navSeq=0;
  host.innerHTML='<div id="_fbwrap" style="background:#1a1a2e;border:1px solid var(--line);border-radius:10px;padding:8px">'
    + '<div class="spread" id="_sp" dir="ltr" style="min-height:220px;align-items:center"></div>'
    + '<div dir="rtl" class="fbctl" style="text-align:center;margin-top:8px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap">'
    + '<button id="_next">◀ הבא</button> <span id="_pi" class="muted"></span> <button id="_prev">הקודם ▶</button> <button id="_full">⛶ מסך מלא</button> <button id="_zoom" title="לחץ להפעלת זום, ואז גלגלת-העכבר לקרב/להרחיק · גרירה להזזה · דאבל-קליק לאיפוס">🔍 זום</button> <span id="_bg" class="muted" style="font-size:.78rem"></span></div>'
    + '<div dir="rtl" class="fbtune" style="text-align:center;margin-top:6px;font-size:.82rem;color:#94a3b8">חיתוך מסגרת-לבנה (מכל 4 הצדדים של כל עמוד): '
    + '<input type="range" id="_spine" min="0" max="8" step="0.1" value="'+_SPINE_TRIM_PCT+'" style="vertical-align:middle;width:240px"> <b id="_spineVal">'+_SPINE_TRIM_PCT.toFixed(1)+'%</b> <span style="opacity:.7">— הגדל עד שהמסגרת הלבנה נעלמת, ותגיד לי את המספר</span></div></div>';
  function progHtml(){ return '<div style="max-width:340px;margin:auto;text-align:center;color:#94a3b8;padding:18px">📖 מרנדר…'
    + '<div style="height:7px;background:#334155;border-radius:5px;margin:8px 0"><div id="_pbfill" style="height:100%;width:6%;background:#16a34a;border-radius:5px;transition:width .15s"></div></div></div>'; }
  let curPages=null;   // URLs של התצוגה הנוכחית ([u] בודד / [uHi,uLo] כפולה) — לכוונון-מסגרת חי
  async function draw(){
    const my=++navSeq; const sp=$('_sp'); const g=groups[gi]; curPages=null;
    const need=g.map(k=>k+1).filter(p=>!_img[p]); let anim=null;
    if(need.length){ sp.innerHTML=progHtml(); const est=Math.max(500,(_avgMs||1600)*need.length), t0=performance.now();
      anim=setInterval(()=>{ if(my!==navSeq){clearInterval(anim);return;} const el=performance.now()-t0, pct=Math.min(96,6+el/est*90), f=$('_pbfill'); if(f)f.style.width=pct.toFixed(0)+'%'; },100); }
    let urls;
    if(g.length===1){ const u=await pageImg(pdf,g[0]+1,true); if(anim)clearInterval(anim); if(my!==navSeq) return; urls=[u]; }
    else { const lo=g[0]+1,hi=g[1]+1; const uHi=await pageImg(pdf,hi,true); if(my!==navSeq){ if(anim)clearInterval(anim); return; } const uLo=await pageImg(pdf,lo,true);
      if(anim)clearInterval(anim); if(my!==navSeq) return; urls=[uHi,uLo]; }   // hi שמאל · lo ימין
    curPages=urls; const view=await _composeView(urls, _SPINE_TRIM_PCT); if(my!==navSeq) return;
    sp.innerHTML='<img src="'+view+'">';
    $('_pi').textContent='כפולה '+(gi+1)+' / '+groups.length; $('_prev').disabled=gi<=0; $('_next').disabled=gi>=groups.length-1;
  }
  $('_prev').onclick=()=>{ if(gi>0){gi--;draw();} if(window._zoomReset)window._zoomReset(); }; $('_next').onclick=()=>{ if(gi<groups.length-1){gi++;draw();} if(window._zoomReset)window._zoomReset(); };
  $('_full').onclick=()=>{ const w=$('_fbwrap'); (w.requestFullscreen||w.webkitRequestFullscreen||function(){}).call(w); };
  _setupZoom();   // 🔍 זום: לחצן + גלגלת + גרירה
  $('_spine').oninput=async ()=>{ _SPINE_TRIM_PCT=parseFloat($('_spine').value)||0; $('_spineVal').textContent=_SPINE_TRIM_PCT.toFixed(1)+'%';

// ── תצוגה-מהירה (decoder): מרנדר 2 עמודי-מקור פעם-אחת · גוזר+מסובב כל תא לפי plan (=זהה לפלט) ──
//    פענוח-כבד פעמיים בלבד; כל התאים מיידיים. rotate CCW = כמו pdf-lib drawPage.
function _cropRotate(src, x, y, w, h, degCCW){
  x=Math.round(x); y=Math.round(y); w=Math.max(1,Math.round(w)); h=Math.max(1,Math.round(h));
  const cell=document.createElement('canvas'); cell.width=w; cell.height=h; cell.getContext('2d').drawImage(src, x, y, w, h, 0, 0, w, h);
  degCCW=((degCCW%360)+360)%360; if(degCCW===0) return cell;
  const out=document.createElement('canvas'); const ctx=out.getContext('2d');
  if(degCCW===90||degCCW===270){ out.width=h; out.height=w; } else { out.width=w; out.height=h; }
  ctx.translate(out.width/2, out.height/2); ctx.rotate(-degCCW*Math.PI/180); ctx.drawImage(cell, -w/2, -h/2); return out;
}
async function _renderSource(pdf, pageNo, sc){ await _whenVisible(); const pg=await pdf.getPage(pageNo); const vp=pg.getViewport({scale:sc});
  const cv=document.createElement('canvas'); cv.width=Math.round(vp.width); cv.height=Math.round(vp.height); const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  await pg.render({canvasContext:ctx,viewport:vp}).promise; return { cv, hpt: pg.getViewport({scale:1}).height, sc }; }
function _rotateCanvas(cell, degCCW){ degCCW=((degCCW%360)+360)%360; if(degCCW===0) return cell;
  const w=cell.width, h=cell.height, out=document.createElement('canvas'), ctx=out.getContext('2d');
  if(degCCW===90||degCCW===270){ out.width=h; out.height=w; } else { out.width=w; out.height=h; }
  ctx.translate(out.width/2, out.height/2); ctx.rotate(-degCCW*Math.PI/180); ctx.drawImage(cell, -w/2, -h/2); return out; }
// רינדור-חד של תא-בודד ישירות מ-pdf.js (רק אזור-התא בקנה-מידה גבוה · transform גוזר) → חד ולא כבד:
// פענוח-תמונת-הגיליון כבר במטמון (GlobalImageCache) מהמעבר-הנמוך, לכן מהיר. clip ב-PDF-points (origin ש-ת).
async function _renderCellRegion(pdf, pageNo, clip, degCCW, scale){
  await _whenVisible();
  const pg=await pdf.getPage(pageNo), vp=pg.getViewport({scale:scale});
  const w=Math.max(1,Math.round((clip.right-clip.left)*scale)), h=Math.max(1,Math.round((clip.top-clip.bottom)*scale));
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
  const transform=[1,0,0,1, -clip.left*scale, clip.top*scale - vp.height];   // ממקם את פינת-התא בראש-הקנבס
  await pg.render({canvasContext:ctx, viewport:vp, transform:transform}).promise;
  return _rotateCanvas(cv, degCCW);
}
let _fastGen=0, _fastDocs=[];   // מונה-מחזור + מסמכי-pdf.js פעילים (mount חדש מבטל רקע ומשחרר זיכרון)
// book = { bleedMm, runs:[{srcBytes, plan}], order:[{runIndex,posInRun}] }
//   קונטרס-יחיד → runs=[{srcBytes,plan}] · order = 1..N זהות. מרובה-קונטרסים → כמה runs + סדר-הרכבה.
async function mountFlipbookFast(host, thumbsHost, book){
  _fastDocs.forEach(d=>{ try{ d.destroy(); }catch(e){} }); _fastDocs=[];   // שחרור מסמכים קודמים (זיכרון)
  const runs=book.runs, order=book.order, bleedMm=book.bleedMm;
  const n=order.length, groups=_spreadGroups(n); let gi=0;
  const SC_LO=0.9, SC_HI_CELL=2.2;   // נמוך=תצוגה-מיידית · תא-חד=רינדור פר-עמוד בסדר-קריאה
  // לכל קונטרס: doc, אינדקס-plan לפי posInRun, ורינדורי-מקור (srcCv[side])
  const R=runs.map(r=>{ const byPos={}; r.plan.pages.forEach(p=>byPos[p.finalPageNumber]=p);
    return { doc:null, srcBytes:r.srcBytes, byPos, srcCv:{} }; });
  let ccache={}; const hiCell={};   // hiCell[N] = תא חד (גובר על הגזירה-הנמוכה)
  host.innerHTML='<div id="_fbwrap" style="background:#1a1a2e;border:1px solid var(--line);border-radius:10px;padding:8px">'
    + '<div class="spread" id="_sp" dir="ltr" style="min-height:220px;align-items:center"><div id="_prog" style="width:100%;text-align:center;color:#94a3b8">📖 טוען את הפרופר…</div></div>'
    + '<div dir="rtl" class="fbctl" style="text-align:center;margin-top:8px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap">'
    + '<button id="_next">◀ הבא</button> <span id="_pi" class="muted"></span> <button id="_prev">הקודם ▶</button> <button id="_full">⛶ מסך מלא</button> <button id="_zoom" title="לחץ להפעלת זום, ואז גלגלת-העכבר לקרב/להרחיק · גרירה להזזה · דאבל-קליק לאיפוס">🔍 זום</button> <span id="_bg" class="muted" style="font-size:.78rem"></span></div></div>';
  function cellCanvas(N){ if(hiCell[N]) return hiCell[N]; if(ccache[N]) return ccache[N];   // חד גובר על נמוך
    const o=order[N-1]; const run=R[o.runIndex]; if(!run) return null;
    const p=run.byPos[o.posInRun]; if(!p) return null; const s=run.srcCv[p.sourcePdfPage]; if(!s) return null;
    const cp=(bleedMm>0 && p.bleedClipPt)?p.bleedClipPt:p.clipPt;
    const cv=_cropRotate(s.cv, cp.left*s.sc, (s.hpt-cp.top)*s.sc, (cp.right-cp.left)*s.sc, (cp.top-cp.bottom)*s.sc, p.rotationApplied); ccache[N]=cv; return cv; }

  function draw(){ const sp=$('_sp'); const g=groups[gi]; let view=null;
    if(g.length===1){ view=cellCanvas(g[0]+1); }
    else { const lo=g[0]+1,hi=g[1]+1; const cHi=cellCanvas(hi), cLo=cellCanvas(lo);   // כפולה על canvas אחד → חיבור חלק בלי תפר
      if(cHi&&cLo){ const H=Math.max(cHi.height,cLo.height), combo=document.createElement('canvas'); combo.width=cHi.width+cLo.width; combo.height=H;
        const c=combo.getContext('2d'); c.fillStyle='#fff'; c.fillRect(0,0,combo.width,combo.height);
        c.drawImage(cHi,0,Math.round((H-cHi.height)/2)); c.drawImage(cLo,cHi.width,Math.round((H-cLo.height)/2));   // hi שמאל · lo ימין · צמוד
        view=combo; } }
    if(!view){ sp.innerHTML='<div style="color:#94a3b8;padding:24px;width:100%;text-align:center">⏳ טוען…</div>'; return; }
    sp.replaceChildren(view);
    $('_pi').textContent='כפולה '+(gi+1)+' / '+groups.length; $('_prev').disabled=gi<=0; $('_next').disabled=gi>=groups.length-1; }
  $('_prev').onclick=()=>{ if(gi>0){gi--;draw();} if(window._zoomReset)window._zoomReset(); }; $('_next').onclick=()=>{ if(gi<groups.length-1){gi++;draw();} if(window._zoomReset)window._zoomReset(); };
  $('_full').onclick=()=>{ const w=$('_fbwrap'); (w.requestFullscreen||w.webkitRequestFullscreen||function(){}).call(w); };
  _setupZoom();   // 🔍 זום: לחצן + גלגלת + גרירה
  function renderThumbsFast(){ if(!thumbsHost) return; thumbsHost.innerHTML=''; for(let N=1;N<=n;N++){ const c=cellCanvas(N); const t=document.createElement('div'); t.className='th';
    if(c){ const tc=document.createElement('canvas'); const s=88/c.width; tc.width=88; tc.height=Math.round(c.height*s); tc.getContext('2d').drawImage(c,0,0,tc.width,tc.height); const im=new Image(); im.src=tc.toDataURL('image/jpeg',0.7); im.style.width='88px'; t.appendChild(im); }

  const myGen=++_fastGen;   // ביטול-מחזור: קיפול-מחדש (בליד/קובץ) מפסיק רינדורי-רקע ישנים
  // רשימת (run,side) לרינדור — לפי סדר-ההופעה בספר (קונטרס ראשון קודם → השער מהר)

    } })();
}

    let proofs = null, papers = null, portals = null;
    try { [proofs, papers, portals] = await Promise.all([
      _dbGet('customerProofs').catch(()=>null), _dbGet('newspapers').catch(()=>null), _dbGet('customerPortals').catch(()=>null) ]);
    } catch(e){}
    _custPortals = portals || {};
    const byName = {};
    const add = (nm, extra) => {
      const n = String(nm||'').trim(); if (!n) return;
      const k = _cslug(n); if (!k) return;
      byName[k] = Object.assign({ name: n, jobs: 0, last: 0 }, byName[k] || {}, extra || {});
      byName[k].name = byName[k].name || n;
    };
    Object.keys(proofs||{}).forEach(id=>{
      const p = proofs[id]; if (!p || p._deleted) return;
      const k = _cslug(p.customer); if (!k) return;
      add(p.customer);
      byName[k].jobs++;
      const t = p.createdAt || p.approvedAt || 0; if (t > byName[k].last) byName[k].last = t;
    });
    const pArr = Array.isArray(papers) ? papers : (papers && typeof papers==='object' ? Object.values(papers) : []);
    pArr.forEach(n=>{ if (n && n.name && !n._deleted) add(n.name, { day: n.day || '' }); });
    _custRows = Object.keys(byName).map(k=>Object.assign({ slug:k, portal: !!(_custPortals[k] && _custPortals[k].token) }, byName[k]))
      .sort((a,b)=> (b.last||0)-(a.last||0) || a.name.localeCompare(b.name,'he'));
    _renderCustList();
  }
  function _renderCustList(){
    const q = ($('custSearch').value||'').trim().toLowerCase();
    const rows = _custRows.filter(c=>!q || c.name.toLowerCase().indexOf(q)>=0);
    if (!rows.length){ $('custList').innerHTML = '<div class="muted">'+(_custRows.length?'אין לקוח מתאים':'לא נמצאו לקוחות')+'</div>'; return; }
    $('custList').innerHTML = '<table style="width:100%;border-collapse:collapse;font-size:.88rem">'
      + rows.map(c=>{
          const on = (c.slug === _custSel);
          return '<tr style="'+(on?'background:#eef2ff':'')+'">'
            + '<td style="padding:3px 4px"><b>'+_esc(c.name)+'</b>'+(c.day?(' <span class="muted" style="font-size:.78rem">· '+_esc(c.day)+'</span>'):'')+'</td>'
            + '<td style="text-align:center;white-space:nowrap">'+(c.jobs?('<span class="muted" style="font-size:.78rem">'+c.jobs+' עבודות</span>'):'')+'</td>'
            + '<td style="text-align:center;white-space:nowrap">'
            +   (c.portal ? '<span class="ok" style="font-size:.78rem">🔗 פורטל</span>'
                          : '<span class="muted" style="font-size:.78rem">ללא פורטל</span>')+'</td>'
            + '<td style="text-align:left;white-space:nowrap"><button class="cPick" data-s="'+_esc(c.slug)+'" style="font-size:.8rem">'
            +   (on?'✓ נבחר':'בחר')+'</button></td></tr>';
        }).join('')
      + '</table>';
    Array.from(document.getElementsByClassName('cPick')).forEach(b=>b.onclick=()=>_pickCust(b.dataset.s));
  }
  function _pickCust(slug){
    const c = _custRows.find(x=>x.slug===slug); if (!c) return;
    _custSel = slug;
    if ($('custName')) $('custName').value = c.name;
    const ph = (_custPortals[slug] && (_custPortals[slug].phone || _custPortals[slug].tel)) || '';

                  : '<span style="color:#92400e">אין לו פורטל — יתקבל קישור-צפייה רגיל</span>');

  // ── לשונית "הוספת טמפלט": רשימת הטמפלטים המותאמים + הוספה חדשה דרך כלי-הסימון ──

      + '<button id="openMarker" class="primary">🧩 פתח את כלי סימון-הטמפלט</button> '
      + '<button id="tplRefresh">🔄 רענן רשימה</button>'
      + '<div class="muted" style="margin-top:10px;font-size:.82rem">אחרי השמירה בכלי-הסימון — חזור לכאן ולחץ "רענן רשימה" (או פתח מחדש את הדף), והטמפלט יופיע גם בבורר של שליחת-הפרופר.</div></div>';
    $('openMarker').onclick=()=>window.open('imposition-decoder-preview.html','_blank');
    $('tplRefresh').onclick=()=>{ _renderTplPane(); _reloadCatalog(); };
    Array.from(document.getElementsByClassName('tplDel')).forEach(b=>b.onclick=()=>{
      if(!confirm('להסיר את הטמפלט מהרשימה? (לא ימחק קבצים — רק מהרשימה במכשיר הזה)')) return;
      try{ const ov=JSON.parse(localStorage.getItem('solanFoldTemplates')||'{}')||{}; delete ov[b.dataset.k];
        localStorage.setItem('solanFoldTemplates', JSON.stringify(ov)); _renderTplPane(); _reloadCatalog(); }catch(e){}
    });
    const _openTpl=(k)=>{ const row=$('tplRow_'+k); if(!row) return;

  // ── תצוגת-פריסה + עריכה של טמפלט מותאם ──────────────────────────────────────
  //    מציג את הרשת פר-צד (מספר-עמוד + סיבוב בכל תא) בדיוק כפי שמנוע-הקיפול יקרא אותה.
  //    עריכה: שינוי מספרי-עמוד/סיבוב פר-תא + שם. שמירה כותבת חזרה ל-solanFoldTemplates.
  let _tplEdit={};   // k → true כשבמצב-עריכה
  function _renderTplLayout(k){
    const box=$('tplBox_'+k); if(!box) return;
    let o=null; try{ o=(JSON.parse(localStorage.getItem('solanFoldTemplates')||'{}')||{})[k]; }catch(e){}
    if(!o||!Array.isArray(o.grids)){ box.innerHTML='<div class="bad" style="padding:10px">לא נמצאה פריסה</div>'; return; }
    const edit=!!_tplEdit[k], g=o.geom||{};
    const rotOf=(s,r,c)=>{ const rg=o.rotGrids&&o.rotGrids[s]; return (rg&&rg[r]&&rg[r][c]!=null)?rg[r][c]:((o.rot&&o.rot[c])||0); };

             :('<b>'+(o.label||k)+'</b>'))
      + '<span class="muted">גיליון '+(g.sheetWmm||'?')+'×'+(g.sheetHmm||'?')+' · עמוד '+(g.trimWmm||'?')+'×'+(g.trimHmm||'?')+' מ״מ · '+(o.N||'?')+' עמ׳ · '+(o.sides===2?'2 צדדים (פרפקטור)':'צד אחד (מתהפך)')+'</span>'
      + '<span style="margin-right:auto"></span>'
      + (edit?('<button class="primary tplSave" data-k="'+k+'">💾 שמור שינויים</button> <button class="tplCancel" data-k="'+k+'">בטל</button>')
             :('<button class="tplEditBtn" data-k="'+k+'">✎ ערוך</button>'))
      + '</div>';
    o.grids.forEach((grid,s)=>{
      html+='<div style="margin-bottom:10px"><div style="font-weight:800;color:var(--press);margin-bottom:4px">'+(s===0?'צד קדמי (עמ׳ 1 בקובץ)':'צד אחורי (עמ׳ 2 בקובץ)')+'</div>';
      html+='<table style="border-collapse:collapse"><tbody>';
      grid.forEach((row,r)=>{ html+='<tr>'; row.forEach((pg,c)=>{
        const rot=rotOf(s,r,c);
        html+='<td style="border:1px solid var(--line);background:#fff;padding:6px;text-align:center;min-width:74px">';
        if(edit){
          html+='<input type="number" class="cellPg" data-k="'+k+'" data-s="'+s+'" data-r="'+r+'" data-c="'+c+'" value="'+pg+'" min="0" style="width:52px;text-align:center;font-weight:800">'
             + '<select class="cellRot" data-k="'+k+'" data-s="'+s+'" data-r="'+r+'" data-c="'+c+'" style="width:62px;margin-top:3px;font-size:.75rem">'
             + [0,90,180,270].map(v=>'<option value="'+v+'"'+(v===rot?' selected':'')+'>'+v+'°</option>').join('')+'</select>';
        } else {
          html+='<div style="font-weight:900;font-size:1.05rem;color:var(--press)">'+(pg||'—')+'</div>'
             + '<div class="muted" style="font-size:.72rem">'+rot+'°</div>';
        }
        html+='</td>'; }); html+='</tr>'; });
      html+='</tbody></table></div>';
    });
    html+='<div class="muted" style="font-size:.8rem">המספר = עמוד-הקריאה שיופיע בתא · המעלות = תיקון-הסיבוב שהמנוע יחיל. הרשת היא כפי שהגיליון מונח בפועל.</div>';
    if(edit) html+='<div class="muted" style="font-size:.8rem;margin-top:4px;color:var(--danger)">⚠ שינוי שגוי יגרום לחוברת בסדר שגוי — ודא מול קובץ-הטמפלט המקורי.</div>';
    html+='</div>';
    box.innerHTML=html;
    const be=box.querySelector('.tplEditBtn'); if(be) be.onclick=()=>{ _tplEdit[k]=true; _renderTplLayout(k); };
    const bc=box.querySelector('.tplCancel'); if(bc) bc.onclick=()=>{ _tplEdit[k]=false; _renderTplLayout(k); };
    const bs=box.querySelector('.tplSave'); if(bs) bs.onclick=()=>{
      try{
        const all=JSON.parse(localStorage.getItem('solanFoldTemplates')||'{}')||{}; const t=all[k]; if(!t) return;
        box.querySelectorAll('.cellPg').forEach(inp=>{ const s=+inp.dataset.s,r=+inp.dataset.r,c=+inp.dataset.c;
          t.grids[s][r][c]=parseInt(inp.value,10)||0; });
        if(!Array.isArray(t.rotGrids)) t.rotGrids=t.grids.map(gr=>gr.map(row=>row.map(()=>0)));
        box.querySelectorAll('.cellRot').forEach(sel=>{ const s=+sel.dataset.s,r=+sel.dataset.r,c=+sel.dataset.c;
          if(!t.rotGrids[s]) t.rotGrids[s]=[]; if(!t.rotGrids[s][r]) t.rotGrids[s][r]=[];
          t.rotGrids[s][r][c]=parseInt(sel.value,10)||0; });
        const nm=$('tplName_'+k); if(nm && nm.value.trim()) t.label=nm.value.trim();
        // אזהרת-שפיות: כיסוי 1..N בלי כפילויות (לא חוסם — המשתמש מחליט)
        const seen={}; let dup=false, cnt=0;
        t.grids.forEach(gr=>gr.forEach(row=>row.forEach(v=>{ if(v>0){ if(seen[v]) dup=true; seen[v]=true; cnt++; } })));

        _tplEdit[k]=false; _renderTplPane(); _reloadCatalog();
        const warn = dup ? 'שים לב: יש מספרי-עמוד כפולים ברשת.' : (Object.keys(seen).length!==(t.N||cnt) ? 'שים לב: לא כל העמודים 1..'+(t.N||cnt)+' מופיעים.' : '');
        if(warn) alert('נשמר — אך '+warn);
      }catch(e){ alert('שמירה נכשלה: '+(e.message||e)); }
    };
  }
  // רענון בורר-הטמפלטים בלי לרענן את הדף (אחרי הוספה/הסרה)

  let _srcU8=null, _srcName='', _folded=null, _multiU8=[], _multiNames=[];   // {bytes,result}

  // ── קטלוג-הטמפלטים: 3 המאושרים + כל המובנים של מנוע-האפליקציה + מותאמים מכלי סימון-הטמפלט ──
  function _cfpCatalog(){
    const list=[
      { id:'70x100-32p-165x240-perfector', label:'32 עמ׳ · 165×240 · פרפקטור (8 צבעים)', w:165, h:240, engine:'legacy' },
      { id:'legacy:32p',  label:'32 עמ׳ · 165×240 · מתהפך (4 צבעים)', w:165, h:240, engine:'legacy' },
      { id:'16perf',      label:'16 עמ׳ · 165×240 · פרפקטור', w:165, h:240, engine:'legacy' },
      { id:'legacy:16p',  label:'16 עמ׳ · 165×240 · מתהפך', w:165, h:240, engine:'legacy' },
      { id:'legacy:8perf',label:'8 עמ׳ · 165×240 · פרפקטור', w:165, h:240, engine:'legacy' },
      { id:'legacy:8p',   label:'8 עמ׳ · 165×240 · מתהפך', w:165, h:240, engine:'legacy' },
      { id:'legacy:4perf',label:'4 עמ׳ · 165×240 · פרפקטור', w:165, h:240, engine:'legacy' },
      { id:'legacy:4p',   label:'4 עמ׳ · 165×240 · מתהפך', w:165, h:240, engine:'legacy' },
      { id:'88x63-16p-perfector', label:'16 עמ׳ · 210×297 · 88×63 פרפקטור', w:210, h:297, engine:'decoder-v2' }
    ];
    // גשר-מאגרים: טמפלטים שנשמרו בכלי סימון-הטמפלט יושבים ב-solanImpositionTemplatesV2
    // (מודל-cells), בעוד מנוע-הקיפול קורא solanFoldTemplates (grids). ממירים ורושמים אותם
    // לפני יצירת ה-iframe של הגשר → מופיעים ברשימה *וגם* עובדים בקיפול.
    try{
      const v2=JSON.parse(localStorage.getItem('solanImpositionTemplatesV2')||'{}')||{};
      const ov0=JSON.parse(localStorage.getItem('solanFoldTemplates')||'{}')||{};
      let changed=false;
      Object.keys(v2).forEach(k=>{
        const rec=v2[k]; const t=(rec&&rec.cells)?rec:(rec&&rec.template)?rec.template:(rec&&rec.versions&&rec.current!=null?rec.versions[rec.current]:null);
        if(!t || !Array.isArray(t.cells) || !t.cells.length) return;
        if(ov0[k] && ov0[k].custom) return;                       // כבר רשום — לא דורסים
        const lg=ADP.v2TemplateToLegacy(t); if(!lg) return;

      const ov=JSON.parse(localStorage.getItem('solanFoldTemplates')||'{}')||{};
      Object.keys(ov).forEach(k=>{ const o=ov[k];

  const _catalog=_cfpCatalog();

  function setStep(n){ for(let i=0;i<5;i++){ const el=$('wstep'+i); if(el) el.className='step'+(i<=n?' active':''); } }
  function _multi(){ return $('multiRun') && $('multiRun').checked; }
  let _runRows=[];   // [{name,u8,perfector,pages,legacyType}] — מקור-אמת לקיפול-מרובה (ניתן-לעריכה)

  function _drawRows(){
    // בורר-טמפלט מלא לכל ריצה — כי לפעמים ריצה אחת ב-4 צבעים (מתהפך) והשאר ב-8 צבעים (פרפקטור)
    const _tplOpts=(cur)=>_catalog.filter(t=>_legacyTypeFor(t.id)).map(t=>

/* ═══════════════ מסך הלקוח ═══════════════ */
async function clientScreen(versionId, token){
  document.documentElement.className='client'; document.body.className='clientwrap'; document.title='חוברת לאישור — סולן הדפסות';
  $('app').innerHTML='<div class="card"><h2 id="cTitle">טוען…</h2><div id="cMeta" class="muted"></div></div><div class="card" id="cBook" style="display:none"><div id="cFlip"></div></div><div class="card" id="cApprove" style="display:none"></div>';
  let rec=null;
  try{ rec=await _dbGet('customerFoldVersions/'+versionId); }catch(e){}
  if(!rec){ $('cTitle').innerHTML='<span class="bad">הקישור לא נמצא</span>'; return; }
  if(rec.share.token!==token){ $('cTitle').innerHTML='<span class="bad">קישור לא תקין</span>'; return; }   // token חייב להתאים
  const valid=CFV.isLinkValid(rec, _nowIso());
  if(!valid.valid){ $('cTitle').innerHTML='<span class="bad">'+(valid.reason==='REVOKED'?'הקישור בוטל':'תוקף הקישור פג')+'</span>'; return; }
  $('cTitle').textContent=rec.jobName||'חוברת לאישור';
  $('cMeta').innerHTML='גרסה V'+rec.versionNumber+' · '+rec.pageCount+' עמ׳ · '+rec.finalPageSizeMm.width+'×'+rec.finalPageSizeMm.height+' מ״מ';
  // טעינת ה-PDF שהעובד בדק (אותם bytes) מה-Storage
  let bytes=null; try{ bytes=new Uint8Array(await (await fetch(rec.outputUrl)).arrayBuffer()); }catch(e){}
  if(!bytes){ $('cTitle').innerHTML+=' <span class="bad">(טעינת החוברת נכשלה)</span>'; return; }
  // הוכחת-זהות: ה-bytes שהתקבלו === outputHash שברשומה
  const gotHash=await sha256(bytes);
  if(gotHash!==rec.outputHash){ $('cMeta').innerHTML+=' <span class="bad">· אזהרה: החוברת אינה תואמת לגרסה המאושרת</span>'; }
  // רכיבי-הצפייה (pdf.js) חייבים להיות זמינים לפני הדפדוף — אחרת הלקוח נשאר על "טוען…"
  const _lr=await _ensureLibs();
  if(!_lr.ok){ $('cMeta').innerHTML+='<div class="bad" style="white-space:pre-line;margin-top:8px">'+_libsBlockedMsg(_lr)+'</div>'; return; }
  $('cBook').style.display=''; await mountFlipbook($('cFlip'), bytes);
  renderApprove(rec, gotHash===rec.outputHash);
}
// חיווי אישור-הקבלה של בית-הדפוס (הלקוח רואה שההודעה התקבלה — לא נשאר באוויר)
function _cShopAckHtml(rec){
  const s=rec.shopAck;
  if(s && s.at) return '<div style="margin-top:10px;padding:9px 11px;border:2px solid var(--ok);border-radius:8px;background:rgba(22,163,74,.10)">'
    + '<b class="ok">📩 בית-הדפוס קיבל את ההודעה</b>'+(s.by?(' <span class="muted">— '+s.by+'</span>'):'')
    + '<div class="muted" style="font-size:.82rem">'+_fmtHe(s.at)+'</div>'+(s.note?('<div style="margin-top:4px">"'+s.note+'"</div>'):'')+'</div>';
  return '<div id="ackWait" style="margin-top:10px;padding:9px 11px;border:1px dashed var(--line);border-radius:8px;color:var(--muted)">'
    + '⏳ ממתין לאישור-קבלה מבית-הדפוס… <span style="font-size:.82rem">(אפשר להשאיר את החלון פתוח)</span></div>';
}
function _cApprovedBox(rec){ const a=rec.approval||{};
  return '<div style="text-align:center;padding:14px;border:2px solid var(--ok);border-radius:10px;background:rgba(22,163,74,.08)">'
    + '<div style="font-size:2rem">✅</div><h2 class="ok" style="margin:6px 0">אושר לדפוס</h2>'
    + '<div class="muted">'+(a.approvedBy?('אושר ע״י '+a.approvedBy+' · '):'')+(a.approvedAt?_fmtHe(a.approvedAt):'')+'</div>'
    + '<div class="muted" style="margin-top:4px;font-size:.85rem">החוברת אושרה. אין צורך בפעולה נוספת.</div>'
    + _cShopAckHtml(rec) + '</div>'; }
function _cCorrectionBox(rec){ const a=rec.approval||{};
  return '<div style="text-align:center;padding:14px;border:2px solid #dc2626;border-radius:10px;background:rgba(220,38,38,.06)">'
    + '<div style="font-size:2rem">✎</div><h2 style="color:#dc2626;margin:6px 0">התבקש תיקון</h2>'
    + (a.comment?('<div style="margin:6px 0">"'+a.comment+'"</div>'):'')+'<div class="muted">'+(a.approvedBy||'')+' · '+(a.approvedAt?_fmtHe(a.approvedAt):'')+'</div>'
    + '<div class="muted" style="margin-top:4px;font-size:.85rem">בית-הדפוס יכין גרסה מתוקנת.</div>'
    + _cShopAckHtml(rec) + '</div>'; }
// אחרי אישור/תיקון — המסך *נשאר פתוח* ומאזין לאישור-הקבלה של בית-הדפוס
let _ackPoll=null;
function _startAckPoll(versionId, isApprove){
  if(_ackPoll) clearInterval(_ackPoll);
  _ackPoll=setInterval(async ()=>{
    try{
      if(document.hidden) return;
      const fresh=await _dbGet('customerFoldVersions/'+versionId);
      if(fresh && fresh.shopAck && fresh.shopAck.at){
        clearInterval(_ackPoll); _ackPoll=null;
        const box=$('cApprove'); if(box) box.innerHTML = isApprove ? _cApprovedBox(fresh) : _cCorrectionBox(fresh);
      }
    }catch(e){}
  }, 12000);
}
function _fmtHe(iso){ try{ return new Date(iso).toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso||''; } }
function renderApprove(rec, hashOk){
  const box=$('cApprove'); box.style.display='';
  const st=(rec.approval&&rec.approval.status)||'pending';
  if(st==='approved'){ box.innerHTML=_cApprovedBox(rec); return; }
  if(st==='correction-requested'){ box.innerHTML=_cCorrectionBox(rec); return; }
  box.innerHTML='<h3>אישור</h3>'
   + '<div style="font-size:.9rem;margin-bottom:8px">אני מאשר שסדר העמודים, התוכן והגרסה המוצגת בקישור זה מאושרים להדפסה.</div>'
   + '<input type="text" id="cName" placeholder="שמך" style="width:170px"> <textarea id="cComment" placeholder="הערה (לבקשת תיקון)" style="width:100%;max-width:420px;height:54px;margin-top:6px;display:block"></textarea>'
   + '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button id="cApproveBtn" class="primary"'+(hashOk?'':' disabled title="החוברת אינה תואמת לגרסה"')+'>✓ מאשר להדפסה</button>'
   + '<button id="cCorrectBtn">✎ מבקש תיקון</button></div><div id="cResult" class="muted" style="margin-top:8px"></div>';
  async function submit(action){
    const nm=$('cName').value||null, cm=$('cComment').value||null;
    const fresh=await _dbGet('customerFoldVersions/'+rec.versionId);   // מקור-אמת עדכני מהשרת
    const res=CFV.applyApproval(fresh, action, { approvedBy:nm, comment:cm, nowIso:_nowIso() });
    if(!res.ok){ $('cResult').innerHTML='<span class="bad">'+(res.error==='LINK_REVOKED'?'הקישור בוטל':res.error==='LINK_EXPIRED'?'תוקף פג':res.error)+'</span>'; return; }
    await _dbPatch('customerFoldVersions/'+rec.versionId+'/approval', res.record.approval);
    await _dbPatch('customerFoldVersions/'+rec.versionId, { status:res.record.status });
    // התראת-שופ (סוגר את הלולאה — האפליקציה תצלצל ותציג toast)
    const who=(nm||'לקוח'), jl=rec.jobName||'חוברת', vn='V'+rec.versionNumber;
    if(action==='approve') _notifyShop('✅','לקוח אישר חוברת לדפוס: "'+jl+'" ('+vn+')', who);
    else _notifyShop('✎','לקוח ביקש תיקון בחוברת: "'+jl+'" ('+vn+')'+(cm?(' — '+cm):''), who);
    // החלון של הלקוח משתנה למצב-הסופי (אושר לדפוס / התבקש תיקון)
    box.innerHTML = action==='approve' ? _cApprovedBox(res.record) : _cCorrectionBox(res.record);
    _startAckPoll(rec.versionId, action==='approve');   // המסך נשאר פתוח וממתין לאישור-הקבלה של הדפוס
  }
  $('cApproveBtn').onclick=()=>submit('approve'); $('cCorrectBtn').onclick=()=>submit('request-correction');
}

/* ═══════════════ מערכת אישור לקוחות (מסך-מנהל) ═══════════════ */
async function approvalsScreen(){
  document.title='מערכת אישור לקוחות — סולן';
  $('app').innerHTML='<h2>📋 מערכת אישור לקוחות <span class="muted">(Beta)</span> <a href="?cfp=1" style="font-size:.8rem;font-weight:400">+ צור חוברת חדשה</a></h2>'
    + '<div class="card"><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">'
    + '<b>סינון:</b> <button class="fBtn" data-f="all">הכל (ממתינים + אושרו)</button> <button class="fBtn" data-f="pending">⏳ ממתין</button> <button class="fBtn" data-f="approved">✓ אושר</button> <button class="fBtn" data-f="correction">✎ תיקון</button> <button class="fBtn" data-f="revoked">בוטל</button> <button class="fBtn" data-f="archived">🗄 ארכיון</button>'
    + ' <input type="text" id="aSearch" placeholder="חיפוש שם/לקוח" style="width:170px"> <button id="aRefresh">🔄 רענן</button>'

  let _all=[], _filter='all';
  function _fmt(iso){ if(!iso) return '—'; try{ return new Date(iso).toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso; } }
  function statusOf(r){ if(r.status==='revoked') return 'revoked'; const s=(r.approval&&r.approval.status)||'pending';
    return s==='approved'?'approved':s==='correction-requested'?'correction':'pending'; }
  function badge(st, r){
    let color, label;
    if(st==='approved'){ color='#16a34a'; label='✓ אושר להדפסה'; }
    else if(st==='correction'){ color='#dc2626'; label='✎ התבקש תיקון'; }
    else if(st==='revoked'){ color='#64748b'; label='🚫 בוטל'; }
    else { color='#f59e0b'; label=(r&&r.sentAt)?'📤 נשלח · ממתין לאישור':'⏳ טרם נשלח'; }
    return '<span style="background:'+color+';color:#fff;padding:2px 8px;border-radius:10px;font-size:.78rem;white-space:nowrap">'+label+'</span>'; }
  async function load(){ $('aList').innerHTML='<div class="card muted">טוען…</div>';
    let obj=null; try{ obj=await _dbGet('customerFoldVersions'); }catch(e){}
    _all = obj && typeof obj==='object' ? Object.values(obj).filter(r=>r&&r.versionId&&r.share) : [];
    _all.sort((a,b)=> String(b.createdAt||'').localeCompare(String(a.createdAt||''))); render(); }
  function render(){
    const q=($('aSearch').value||'').trim();
    const live=_all.filter(r=>!r.archived);   // ארכיון מוסתר מכל הסינונים חוץ מ"ארכיון"
    const c={pending:0,approved:0,correction:0,revoked:0}; live.forEach(r=>c[statusOf(r)]++);
    const arch=_all.length-live.length;
    $('aCounts').textContent='סה״כ '+live.length+' · ⏳ '+c.pending+' · ✓ '+c.approved+' · ✎ '+c.correction+(arch?(' · 🗄 '+arch):'');
    // "הכל" = ממתינים + אושרו בלבד (מה שדורש טיפול/מעקב) — לא תיקונים/מבוטלים/ארכיון
    let rows = _filter==='archived' ? _all.filter(r=>r.archived)
             : _filter==='all' ? live.filter(r=>{ const s=statusOf(r); return s==='pending'||s==='approved'; })
             : live.filter(r=> statusOf(r)===_filter);
    if(q) rows=rows.filter(r=> (((r.jobName||'')+' '+(r.customerId||'')).indexOf(q)>=0));

      // פרופר שאושר → כל הכרטיס בירוק, שברור מיד שאושר (בקשת-משתמש 2026-07-30)
      const okStyle = st==='approved' ? ';background:#effdf3;border:1.5px solid #86efac;box-shadow:inset 4px 0 0 #16a34a' : '';
      return '<div class="card" style="display:flex;flex-direction:column;gap:6px'+okStyle+'">'
        + '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">'
        + '<div><b>'+(r.jobName||'—')+'</b> <span class="muted">V'+r.versionNumber+' · '+(r.pageCount||'?')+' עמ׳'+(r.customerId?(' · '+r.customerId):'')+'</span></div>'+badge(st,r)+'</div>'

        + '<div style="display:flex;gap:6px;flex-wrap:wrap">'
        + '<a href="'+link+'" target="_blank"><button>👁 פתח</button></a>'
        + '<button class="cpBtn" data-l="'+encodeURIComponent(link)+'">📋 העתק</button>'
        + '<button class="waBtn" data-l="'+encodeURIComponent(link)+'" data-j="'+encodeURIComponent(r.jobName||'החוברת')+'">🟢 שלח שוב</button>'
        + (st==='revoked'?'':'<button class="rvBtn" data-v="'+r.versionId+'">🚫 בטל קישור</button>')
        // מאושר → אפשר להעביר לארכיון (מוציא מהרשימה הפעילה) · ומחיקה מלאה
        + (r.archived ? '<button class="unArcBtn" data-v="'+r.versionId+'">↩ החזר מארכיון</button>'

        + (st==='approved'||r.archived ? '<button class="delBtn" data-v="'+r.versionId+'" data-j="'+encodeURIComponent(r.jobName||'')+'" style="color:var(--danger)">🗑 מחק</button>' : '')
        // אישור-קבלה ללקוח — הלקוח רואה בזמן-אמת שההודעה התקבלה (מסכו נשאר פתוח וממתין)
        + ((st==='approved'||st==='correction') && !(r.shopAck&&r.shopAck.at)

    Array.from(document.getElementsByClassName('cpBtn')).forEach(b=>b.onclick=()=>{ navigator.clipboard&&navigator.clipboard.writeText(decodeURIComponent(b.dataset.l)); b.textContent='✓ הועתק'; });
    Array.from(document.getElementsByClassName('waBtn')).forEach(b=>b.onclick=()=>{ const link=decodeURIComponent(b.dataset.l), jl=decodeURIComponent(b.dataset.j);

/* ═══════════════ boot ═══════════════ */
(function boot(){
  const v=qs.get('v'), t=qs.get('t');
  if(v && t){ clientScreen(v,t); return; }   // מצב-לקוח
  if(qs.get('approvals')==='1'){ approvalsScreen(); return; }   // מסך-מנהל: מערכת אישור לקוחות
  // מצב-עובד: מאחורי הדגל solanCustomerFoldPreviewBeta (או ?cfp=1)
  if(ADP.customerFoldPreviewEnabled(window) || qs.get('cfp')==='1'){ workerScreen(); }
  else { $('app').innerHTML='<div class="card"><h2>הצגת פרופר מקופל ללקוח</h2><div class="muted">הכלי במצב Beta סגור. הפעל את הדגל <code>solanCustomerFoldPreviewBeta</code> או פתח עם <code>?cfp=1</code>.</div></div>'; }
})();
</script>
</body>
</html>
