<style>
  /* עיצוב תואם-אפליקציה (סולן): Heebo · בז' חמים · נייבי --press · זהב --gold · כרטיסים לבנים */
  :root{--press:#2d3561;--gold:#c9a84c;--gold-light:#e8d5a3;--line:#d0c8b8;--danger:#c62828;

  body{font-family:'Heebo',Arial,sans-serif;background:var(--bg);

  .step.active{border-color:var(--gold);color:var(--press);font-weight:700;background:#fffdf6}
  .muted{color:var(--muted);font-size:.86rem} .ok{color:#15803d;font-weight:700} .bad{color:var(--danger);font-weight:700}
  code{background:#f0eee7;padding:1px 5px;border-radius:4px;color:#334155}
  select,input[type=text],input[type=number]{background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:7px;padding:8px 10px;font-family:inherit}

  #thumbs canvas{display:block;background:#fff;max-width:88px}

  #_sp img{display:block;background:#fff;height:56vh;width:auto}
  #_sp>canvas{display:block;background:#fff;height:56vh;width:auto;max-width:none}
  /* ── מסך-מלא ────────────────────────────────────────────────────────────
     ⚠️ מיושם ב-CSS ולא ב-Fullscreen API. שלוש סיבות שנמדדו בטלפון:
       1. ‏iPhone/Safari **אינו תומך** ב-requestFullscreen על אלמנט רגיל —
          הכפתור פשוט לא עשה כלום. זו הסיבה המכרעת.
       2. ‏Android מציג הודעת-מערכת "החלק כדי לצאת" מעל התצוגה.
       3. הסרגל היה position:fixed עם width:max-content — במסך צר הוא גלש
          משני הצדדים, ו"◀ הבא" (הראשון ב-RTL) נחתך אל מחוץ למסך.
     כאן: flex-column רגיל. התמונה תופסת את מה שנשאר, והסרגל הוא **חלק
     מהזרימה** — ולכן לעולם אינו מכסה את העמוד ואינו נחתך.
     ⚠️ ‏dvh ולא vh: בנייד ‎100vh‎ גדול מהגובה הנראה (סרגל-הכתובת), והתחתית
     נחתכת. ‎100dvh‎ הוא הגובה בפועל, ומתעדכן בסיבוב-המכשיר. */
  /* ⚠️ ‏!important כאן אינו קיצור-דרך אלא הכרח: ל-#_fbwrap ול-#_sp יש
     סגנון-inline (border/padding/border-radius/min-height) שנכתב ב-
     innerHTML, וסגנון-inline גובר על גיליון-הסגנונות תמיד. בלי זה נשארו
     במסך-מלא מסגרת וריפוד — נמדד: השטח קטן ב-2px+16px והסרגל לא נגע
     בתחתית. מוגבל בדיוק לתכונות שיש להן inline מתנגש. */
  #_fbwrap.fsOn{position:fixed;inset:0;z-index:9999;margin:0;
    padding:0!important;border:none!important;border-radius:0!important;background:#000!important;
    display:flex;flex-direction:column;height:100dvh;max-height:100dvh}
  #_fbwrap.fsOn #_sp{flex:1 1 auto;min-height:0!important;border:none;border-radius:0;background:#000;
    padding:0!important;overflow:hidden;display:flex;align-items:center;justify-content:center}
  /* ⚠️ max-height/max-width במקום height קבוע — כך אותו כלל משרת גם לאורך
     וגם לרוחב: בסיבוב-המכשיר העמוד מתאים את עצמו בלי קוד JS ובלי נעילה.
     ⚠️ 17/08/2026 — היה כאן ‎height:auto;width:auto‎, ואז ה-100% רק *חסמו*
     מלמעלה: העמוד הוצג בגודל שבו רונדר ו**מעולם לא גדל** למסך, כך שבמסך
     גדול הוא ישב קטן באמצע עם שוליים שחורים (דווח מהייצור). עכשיו 100%
     מלא + object-fit:contain — העמוד גדל עד קצה המסך **בלי לעוות**, וזה
     מסך-אישור-פרופר שבו עיוות אינו מקובל (בשונה ממסך-המפעיל שבו נבחר fill).
     ‏flex:1 1 0 + min-width:0 — כדי שגם כפולה (שתי תמונות) תתחלק ולא תגלוש. */
  #_fbwrap.fsOn #_sp img,#_fbwrap.fsOn #_sp>canvas{
    flex:1 1 0;min-width:0;height:100%;width:100%;max-height:100%;max-width:100%;object-fit:contain}
  #_fbwrap.fsOn .fbctl{flex:0 0 auto;position:static;transform:none;width:auto;margin:0!important;
    background:rgba(11,18,32,.94);border-radius:0;flex-wrap:wrap;row-gap:6px;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
  #_fbwrap.fsOn .fbctl button{min-height:40px}         /* יעד-מגע נוח */
  body.fsLock{overflow:hidden}
  /* ⚠️ שבב "🔓 שומר בתצפית" של auth-guard הוא כלי-פנימי, והוא הופיע **ללקוח**
     מעל התצוגה (position:fixed עם z-index עצום). הלקוח אינו אמור לראות מצב-
     פנימי של מערכת-ההרשאות, ובוודאי לא בזמן בחינת פרופר. מוסתר במסך-הלקוח
     בלבד — במסכי-הצוות הוא נשאר, שם הוא נחוץ. */
  html.client #solan-guard-chip{display:none!important}
  /* ── סיבוב-ידני ──────────────────────────────────────────────────────────
     ⚠️ נדרש מפני שדף-אינטרנט **אינו יכול** לסובב את המסך: screen.orientation
     .lock() דורש מסך-מלא אמיתי ואינו נתמך ב-iOS כלל. כשהטלפון נעול על
     פורטרט (מתג-הנעילה) אין דרך לעקוף — ולכן מסובבים את **התצוגה**.
     ⚠️ הסיבוב על #_sp (המכל) ולא על התמונה: draw() מחליף את התמונה בכל
     דפדוף, וסיבוב שהיה עליה היה נמחק בכל מעבר-עמוד. המכל יציב.
     ⚠️ המידות ממשתני-CSS שה-JS מודד — נכונות גם אחרי שינוי-גודל וגם
     כשסרגל-הכפתורים עובר שורה. */
  #_rot{display:none}
  #_fbwrap.fsOn #_rot{display:inline-block}
  #_fbwrap.fsOn.rot #_sp{position:absolute;top:50%;left:50%;
    width:var(--spH,100%);height:var(--spW,100%);
    transform:translate(-50%,-50%) rotate(90deg)}
  #_fbwrap.fsOn.rot .fbctl{margin-top:auto!important}   /* #_sp יצא מהזרימה — הסרגל נשאר בתחתית */
  /* מכשיר לרוחב (או מסך נמוך) — סרגל נמוך יותר, מקסימום גובה לעמוד */
  @media (max-height:520px){
    #_fbwrap.fsOn .fbctl{padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px));gap:6px}
    #_fbwrap.fsOn .fbctl button{min-height:32px;padding:5px 9px;font-size:.85rem}
    #_fbwrap.fsOn .fbctl .muted{font-size:.75rem}
  }
  .chk{display:flex;gap:9px;align-items:flex-start;background:#faf8f2;border:1px solid var(--line);border-radius:8px;padding:10px}
  /* client — אותה שפת-עיצוב, ממורכז */
  .clientwrap{max-width:920px;margin:0 auto}
  .clientwrap .spread{background:#1a1a2e}
  /* ⚠️ ‏.fbtune (סליד כוונון-המסגרת) **הוסר לגמרי** ב-08/08/2026. עד אז הוא
     היה מוסתר מהלקוח בלבד ונשאר גלוי לצוות — פקד-פיתוח שחתך אחוז שווה
     מארבעת הצדדים, כלומר קיצץ גם את הגלישה החיצונית. אין יותר כלל CSS
     שמסתיר אותו, כי אין מה להסתיר. */
</style>

<script>
const $ = id => document.getElementById(id);
const EXEC=window.ImpositionDecoderExec, ADP=window.ImpositionFoldAdapter, RES=window.ImpositionResult, REG=window.ImpositionTemplateRegistry, LB=window.ImpositionLegacyBridge, CFV=window.CustomerFoldVersions, DEC=window.ImpositionDecoder;
const { PDFDocument } = PDFLib;
const qs = new URLSearchParams(location.search);
const _FBURL = 'https://solan-printing-default-rtdb.europe-west1.firebasedatabase.app';
const _APIKEY = 'AIzaSyAFp99furP4L5hqTI-horBHmGZC9s13dGg';
let _tok={id:null,exp:0};
function _isProd(){ return /solanprinting\.github\.io/.test(location.host); }   // כתיבה חיה רק בייצור
function _nowIso(){ return new Date().toISOString(); }
// שמות-לקוחות/עבודות מגיעים מנתוני-משתמש ונכנסים ל-HTML — חייבים בריחה
function _esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// דפדפנים מקפיאים ציור בלשונית-רקע (רינדור pdf.js עלול להיתקע). ממתין עד שהלשונית גלויה
// לפני כל רינדור → מונע היתקעות, ומתאושש מיד כשחוזרים ללשונית (הקיפול/העלאה רצים גם ברקע).
function _whenVisible(){ if(!document.hidden) return Promise.resolve();
  return new Promise(res=>{ const h=()=>{ if(!document.hidden){ document.removeEventListener('visibilitychange',h); res(); } }; document.addEventListener('visibilitychange',h); }); }
async function sha256(u8){ const h=await crypto.subtle.digest('SHA-256', u8 instanceof Uint8Array?u8:new Uint8Array(u8)); return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
/* אצל לקוח/עובד ש-cdnjs חסום אצלו (סינון-תוכן, פרוקסי, חוסם-פרסומות) pdf.js/pdf-lib לא
   נטענות. מראות-גיבוי דרך LibLoader, ואם כולן חסומות — הודעה מפורשת בעברית במקום
   שגיאה סתמית ("PDFLib is not defined") או מסך שנשאר על "טוען…". */
var _libsP=null;
function _ensureLibs(){
  if(!window.LibLoader) return Promise.resolve({ ok: !!(window.pdfjsLib && window.PDFLib) });
  if(LibLoader.allReady(window)) return Promise.resolve({ ok:true });
  if(!_libsP) _libsP=LibLoader.ensureAll({ win:window }).then(r=>{
    if(!r.ok) _libsP=null;                                          // ניסיון חוזר (אולי הרשת השתנתה)
    else if(window.pdfjsLib && r.loaded.pdfjs)                      // ה-worker מאותה מראה שהצליחה
      pdfjsLib.GlobalWorkerOptions.workerSrc=LibLoader.workerFor(r.loaded.pdfjs);
    return r;
  });
  return _libsP;
}
function _libsBlockedMsg(r){ return (r&&r.message) || (window.LibLoader?LibLoader.blockedMessage():'רכיבי הצפייה בקבצים לא נטענו.'); }
/* ── האסימון מגיע מהשומר (B+3.2) — ראה auth-guard.js ─────────────────────
   ⚠️ בלי נפילה-לאחור מקומית: שתי מערכות-אסימון במקביל = שתי זהויות שונות
   לאותו אדם. ⚠️ המסך משרת גם לקוחות (קישור-גרסת-קיפול) ולכן הוא ב-observe. */
function _auth(){
  if(!window.SolanGuard) return Promise.reject(new Error('auth-guard.js לא נטען — אין מקור לאסימון'));
  return window.SolanGuard.token(false); }
function _uploadPdf(path,bytes,onPct){ return _auth().then(tok=> new Promise((res,rej)=>{ const x=new XMLHttpRequest();
  x.open('POST','https://firebasestorage.googleapis.com/v0/b/solan-printing.firebasestorage.app/o?name='+encodeURIComponent(path));
  x.setRequestHeader('Content-Type','application/pdf'); if(tok) x.setRequestHeader('Authorization','Firebase '+tok);
  x.upload.onprogress=e=>{ if(e.lengthComputable&&onPct) onPct(Math.round(e.loaded/e.total*100)); };
  x.onload=()=>{ if(x.status>=200&&x.status<300){ const j=JSON.parse(x.responseText); const t=(j.downloadTokens||'').split(',')[0]||'';
    res({url:'https://firebasestorage.googleapis.com/v0/b/solan-printing.firebasestorage.app/o/'+encodeURIComponent(path)+'?alt=media&token='+t, path:path}); } else rej(new Error('Storage '+x.status)); };
  x.onerror=()=>rej(new Error('שגיאת רשת')); x.send(bytes); })); }
function _dbPut(path,obj){ return _auth().then(tok=>fetch(_FBURL+'/'+path+'.json?auth='+tok,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)}).then(r=>r.ok?r.json():Promise.reject(new Error('db '+r.status)))); }
function _dbPatch(path,obj){ return _auth().then(tok=>fetch(_FBURL+'/'+path+'.json?auth='+tok,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)}).then(r=>r.ok?r.json():Promise.reject(new Error('db '+r.status)))); }
function _dbGet(path){ return _auth().then(tok=>fetch(_FBURL+'/'+path+'.json?auth='+tok).then(r=>r.ok?r.json():null)); }
// ⚠️ בניגוד ל-_dbGet: כשל-קריאה (403/רשת) *נדחה* ולא הופך ל-null — כי null
//    כאן משמש גם ל"הרשומה אינה קיימת". שימוש: בדיקות-קיום שאסור להן להתבלבל
//    בין "אין רשומה" (200+null אמיתי) לבין "לא הצלחתי לבדוק" (403/רשת).
function _dbGetOrFail(path){ return _auth().then(tok=>fetch(_FBURL+'/'+path+'.json?auth='+tok).then(r=>{
  if(!r.ok) return Promise.reject(new Error('db '+r.status)); return r.json(); })); }
// ── זהות-לקוח (ProofContext, לא SolanGuard) — משמש **רק** את clientScreen/submit ──
// ⚠️ מסך-הצוות (workerScreen/approvalsScreen) ממשיך ב-_auth()/_dbGet הרגילים,
// בלי שום שינוי. _cAuth() דוחה אם אין סשן-לקוח תקין — אין נפילה לאנונימי.
function _cAuth(){
  return (window.ProofContext ? window.ProofContext.authToken() : Promise.resolve(null)).then(tok=>{
    if(!tok) return Promise.reject(new Error('אין זהות-לקוח מאומתת'));
    return tok;
  });
}
function _cDbPatch(path,obj){ return _cAuth().then(tok=>fetch(_FBURL+'/'+path+'.json?auth='+tok,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)}).then(r=>r.ok?r.json():Promise.reject(new Error('db '+r.status)))); }
function _cDbGet(path){ return _cAuth().then(tok=>fetch(_FBURL+'/'+path+'.json?auth='+tok).then(r=>r.ok?r.json():null)); }
function _cDbGetOrFail(path){ return _cAuth().then(tok=>fetch(_FBURL+'/'+path+'.json?auth='+tok).then(r=>{
  if(!r.ok) return Promise.reject(new Error('db '+r.status)); return r.json(); })); }
// ⚠️ חסם-4 (06/08/2026): הורדת-PDF **דרך פונקציית-שרת ייעודית**
// (proofFileDownload), לא get ישיר מ-Storage. נמצא פער אמיתי בין הרשאת-
// Storage כפי שהיא מוצגת בקונסולה לבין האכיפה החיה בפועל — get נדחה
// (403) עבור claims שתואמים במדויק את החוק, שוחזר גם באמולטור וגם דרך
// ה-SDK הרשמי (ראה solan-portal-identity-publish-gate, זיכרון). proof-
// FileDownload אינו תלוי ב-Storage rules כלל: כל בדיקת-הבעלות (claim מול
// רשומה, revoked/expired, נתיב-מהרשומה מול proofStoragePath) מתבצעת
// בשרת לפני שה-Admin SDK (עוקף rules) קורא את הקובץ. מהלקוח נשלח versionId
// בלבד — לעולם לא storagePath. _FN_BASE מוגדר למטה (משותף עם _callStaffFn).
// ⚠️ תיקון-UX (06/08/2026): onProgress אופציונלי — התקדמות **אמיתית בלבד**
// לפי bytes-שהתקבלו מול Content-Length. בלי הכותרת (או בלי תמיכת-stream
// בדפדפן) חוזרים ל-arrayBuffer() הרגיל בלי שום prozent מזויף.
function _cStorageFetch(versionId, onProgress){
  return _cAuth().then(tok=>fetch(
    _FN_BASE+'proofFileDownload?versionId='+encodeURIComponent(versionId),
    { headers:{ 'Authorization':'Bearer '+tok } }
  )).then(r=>{
    if(!r.ok) return Promise.reject(new Error('storage '+r.status));
    const total=Number(r.headers.get('Content-Length'))||0;
    if(!onProgress || !r.body || typeof r.body.getReader!=='function') return r.arrayBuffer();
    const reader=r.body.getReader(); const chunks=[]; let received=0;
    if(total>0) onProgress(0, total);
    return (function pump(){
      return reader.read().then(function(res){
        if(res.done){
          const buf=new Uint8Array(received); let off=0;
          for(let i=0;i<chunks.length;i++){ buf.set(chunks[i],off); off+=chunks[i].length; }
          return buf.buffer;
        }
        chunks.push(res.value); received+=res.value.length;
        if(total>0) onProgress(received, total);
        return pump();
      });
    })();
  });
}
// ── קריאת-Function מאומתת-צוות (חסם-3: ביטול-קישור עובר דרך השרת, לא כתיבה ישירה) ──
const _FN_BASE='https://europe-west1-solan-printing.cloudfunctions.net/';
function _callStaffFn(name, data){
  return _auth().then(tok=>fetch(_FN_BASE+name,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},body:JSON.stringify({data:data||{}})})
    .then(async r=>{ const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error((j.error&&j.error.message)||('fn '+r.status)); return j.result; }));
}
// התראת-שופ: רושם רשומה ל-activityLog המשותף (אותו סכמה כמו _logActivity ב-krtis) →

// סימון "נשלח ללקוח" על הרשומה (שדה sentAt) — למעקב במערכת-האישור. אדיטיבי (לא נוגע ב-share/approval).
async function _markSent(versionId){ try{ await _dbPatch('customerFoldVersions/'+versionId, { sentAt:_nowIso() }); }catch(e){} }
/* ⚠️ 07/08/2026 — מחזיר הצלחה/כישלון במקום לבלוע.
   ה-catch הריק כאן עטף את **כל** הגוף, והקריאה הייתה "שגר-ושכח". ‏_dbPut
   כן בודק r.ok ודוחה — כלומר דחייה אמיתית נעלמה בלי עקבה. התוצאה: הלקוח
   רואה "✅ אושר לדפוס", ובבית-הדפוס לא מצלצל כלום ולא מופיעה שום התראה.
   בקשת-תיקון שאובדת כך = עיתון שיוצא עם השגיאה שהלקוח ביקש לתקן.
   האישור עצמו כבר נשמר לפני-כן (מקור-האמת), ולכן זו אזהרה — לא כישלון. */
async function _notifyShop(icon, text, user){
  try{
    const sv=await _dbGet('activityLog');
    let arr=Array.isArray(sv)?sv:(sv&&typeof sv==='object'?Object.values(sv):[]);
    const entry={ id:Date.now()+'_'+Math.random().toString(36).slice(2,7), t:Date.now(), icon:icon, text:text, user:user||'לקוח' };
    arr=arr.filter(a=>a&&a.id!==entry.id); arr.push(entry);
    arr.sort((a,b)=>(b.t||0)-(a.t||0)); if(arr.length>150) arr=arr.slice(0,150);
    await _dbPut('activityLog', arr);
    return true;
  }catch(e){ console.error('התראת בית-הדפוס נכשלה', e); return false; }

// ── קיפול/פירוק לפי טמפלט (3 מסלולים מאושרים) → outputPdfBytes + NormalizedFoldResult ──
// ⚠️ חוצה-מסגרות: קובץ שחוזר מה-iframe של מנוע-הקיפול נכשל ב-`instanceof Uint8Array`
//    של הדף. מזהים לפי toString ומעתיקים למרחב-הדף — אחרת pdf-lib כאן דוחה אותו.
function _u8(v){
  if(!v) return null;
  if(v instanceof Uint8Array) return v;
  if(v instanceof ArrayBuffer) return new Uint8Array(v);
  var tag=Object.prototype.toString.call(v);
  if(tag==='[object Uint8Array]' || tag==='[object ArrayBuffer]') return new Uint8Array(v);
  if(ArrayBuffer.isView(v)) return new Uint8Array(v.buffer, v.byteOffset, v.byteLength);
  if(typeof v.length==='number' && v.length>0){ try{ return Uint8Array.from(v); }catch(e){} }
  return null;
}
let _bridge=null;
// שחזור-תצוגה של גיאומטריית מנוע-האפליקציה (foldSignature): מרכזי-תאים COLCX/ROWCY + מרכוז-מדיה
// + תיקון-דש לפי TrimBox/CropBox — לבניית plan-תצוגה לתצוגה-המהירה, זהה 1:1 לפלט-הגשר.
// גיאומטריית-הטמפלטים המובנים (165×240 · גיליון 70×100 · רשת 4×4 · זהה ל-TEMPLATES ב-imposition-tool).
// כולם על אותה רשת COLCX/ROWCY → plan-תצוגה גנרי לכל סוג. (טמפלט מותאם/ערוך → נופל לרינדור-פלט.)
const _COLCX=[125,375,625,875], _ROWCY=[97.5,262.5,437.5,602.5];
const TPL_GEOM = {
  '32':   { rot:[90,-90,90,-90], grids:[[[1,16,13,4],[32,17,20,29],[25,24,21,28],[8,9,12,5]],[[7,10,11,6],[26,23,22,27],[31,18,19,30],[2,15,14,3]]] },
  '32p':  { rot:[90,-90,90,-90], grids:[[[1,16,13,4],[32,17,20,29],[25,24,21,28],[8,9,12,5]],[[3,14,15,2],[30,19,18,31],[27,22,23,26],[6,11,10,7]]] },
  '16perf':{ rot:[-90,90,-90,90], grids:[[[8,1,4,5],[9,16,13,12],[12,13,16,9],[5,4,1,8]],[[6,3,2,7],[11,14,15,10],[10,15,14,11],[7,2,3,6]]] },
  '16p':  { rot:[-90,90,-90,90], grids:[[[8,1,2,7],[9,16,15,10],[12,13,14,11],[5,4,3,6]]] },
  '8perf':{ rot:[90,-90,90,-90], grids:[[[1,4,1,4],[8,5,8,5],[5,8,5,8],[4,1,4,1]],[[3,2,3,2],[6,7,6,7],[7,6,7,6],[2,3,2,3]]] },
  '8p':   { rot:[90,-90,90,-90], grids:[[[1,4,3,2],[8,5,6,7],[5,8,7,6],[4,1,2,3]]] },
  '4perf':{ rot:[90,90,-90,-90], grids:[[[1,1,2,2],[4,4,3,3],[3,3,4,4],[2,2,1,1]],[[1,1,2,2],[4,4,3,3],[3,3,4,4],[2,2,1,1]]] },
  '4p':   { rot:[90,90,-90,-90], grids:[[[1,1,2,2],[4,4,3,3],[3,3,4,4],[2,2,1,1]]] }
};
// plan-תצוגה גנרי: לכל עמוד-פלט n → תא-מקור (מופע ראשון ברשת) → clip+rotation (כמו foldSignature).
async function _appPlanFor(srcU8, legacyType, bleedMm){
  const geom=TPL_GEOM[legacyType]; if(!geom) return null;
  const map={}; let maxN=0;
  geom.grids.forEach((grid,side)=>grid.forEach((rowArr,row)=>rowArr.forEach((pg,col)=>{ if(!(pg in map)) map[pg]={side,col,row}; if(pg>maxN) maxN=pg; })));
  const doc=await PDFLib.PDFDocument.load(srcU8.slice(0), { ignoreEncryption:true });
  const p=doc.getPages()[0], mb=p.getMediaBox();
  const MMc=72/25.4, mwmm=mb.width/MMc, mhmm=mb.height/MMc;
  let offX=(mwmm-1000)/2, offY=(mhmm-700)/2;
  let nb=null; try{ nb=p.getTrimBox(); }catch(e){}
  if(!nb || nb.width>=mb.width-1){ try{ nb=p.getCropBox(); }catch(e){} }
  if(nb && nb.width<mb.width-1){
    const leftM=(nb.x-mb.x)/MMc, rightM=((mb.x+mb.width)-(nb.x+nb.width))/MMc;
    const topM=((mb.y+mb.height)-(nb.y+nb.height))/MMc, botM=(nb.y-mb.y)/MMc;
    if(Math.abs(leftM-rightM)>=1) offX+=(leftM-rightM)/2;
    if(Math.abs(topM-botM)>=1) offY+=(topM-botM)/2;
  }
  const B=bleedMm>0?bleedMm:0; const pages=[];
  for(let n=1;n<=maxN;n++){ const pos=map[n]; if(!pos) continue;
    const cx=_COLCX[pos.col]+offX, cy=_ROWCY[pos.row]+offY, rotation=(geom.rot[pos.col]===90)?90:270, spineRight=(n%2===1);
    const clip=(b)=>{ let bTop=b, bBot=b;
      if(b>0){ if(rotation===90){ bTop=spineRight?b:0; bBot=spineRight?0:b; }
               else { bTop=spineRight?0:b; bBot=spineRight?b:0; } }
      const x0=cx-(120+b), x1=cx+(120+b), y0=cy-(82.5+bTop), y1=cy+(82.5+bBot);
      return { left:x0*MMc, right:x1*MMc, top:(mhmm-y0)*MMc, bottom:(mhmm-y1)*MMc }; };
    pages.push({ finalPageNumber:n, sourcePdfPage:pos.side+1, rotationApplied:rotation, clipPt:clip(0), bleedClipPt:clip(B) });
  }
  return { bleedMm:B, pages };
}
// זיהוי-גיליון אוטומטי מה-PDF: משפחת-גיליון (70×100 / 88×63-A4 / אחר) + גודל-עמוד + תווית.
async function _detectSheet(srcU8){
  try{ const doc=await PDFLib.PDFDocument.load(srcU8.slice(0), { ignoreEncryption:true });
    const mb=doc.getPages()[0].getMediaBox(), MMc=72/25.4;
    const big=Math.max(mb.width,mb.height)/MMc, sml=Math.min(mb.width,mb.height)/MMc;
    if(big>=960 && big<=1060 && sml>=680 && sml<=745) return { family:'70x100', label:'גיליון 70×100 · עמוד 165×240 מ״מ', pageW:165, pageH:240 };
    if(big>=855 && big<=925 && sml>=605 && sml<=680) return { family:'88x63', label:'גיליון 88×63 · עמוד 210×297 (A4) מ״מ', pageW:210, pageH:297 };
    return { family:'other', label:'גיליון ~'+Math.round(big/10)*10+'×'+Math.round(sml/10)*10+' מ״מ', pageW:null, pageH:null };
  }catch(e){ return null; }
}
async function _detectSizeLabel(srcU8){ const s=await _detectSheet(srcU8); return s?s.label:null; }
// חיתוך גלישת-השדרה מפלט-הגשר: מנוע-האפליקציה מוסיף גלישה סימטרית סביב כל עמוד (כולל שדרה,
// ושם היא מציגה תוכן של העמוד השכן). כאן חותכים את צד-השדרה → גלישה רק בראש/רגל/צד-חיצוני,
// השדרה תמיד בקו-0. RTL: עמוד אי-זוגי (שער וימניים) שדרה מימין · זוגי שדרה משמאל.
async function _trimSpineBleed(bytes, bleedMm){
  if(!(bleedMm>0)) return bytes;
  const doc=await PDFLib.PDFDocument.load(bytes, { ignoreEncryption:true });
  const MMc=72/25.4, B=bleedMm*MMc;
  doc.getPages().forEach((pg,i)=>{
    const mb=pg.getMediaBox(); const newW=mb.width-B;
    const spineRight=((i+1)%2)===1;
    const x0= spineRight ? mb.x : mb.x+B;   // שדרה מימין → חותכים את הרצועה הימנית; משמאל → השמאלית
    pg.setMediaBox(x0, mb.y, newW, mb.height);
    pg.setCropBox(x0, mb.y, newW, mb.height);
  });
  return await doc.save();
}
// טמפלט-מסך → סוג-מנוע-אפליקציה: 16perf/32 המאושרים · legacy:<type> מובנים · custom:<key> מכלי-הסימון
// (ה-iframe של הגשר טוען בעצמו את ההגדרות השמורות מ-localStorage — same-origin → טמפלט מותאם עובד אוטומטית)
function _legacyTypeFor(tid){
  if(tid==='16perf') return '16perf';
  if(tid==='70x100-32p-165x240-perfector') return '32';
  if(tid.indexOf('legacy:')===0) return tid.slice(7);
  if(tid.indexOf('custom:')===0) return tid.slice(7);
  return null;   // ‏tpl: אינו legacy — הוא הולך ישר למנוע-הפירוק
}
/* ── טמפלטי Preps (.tpl) ────────────────────────────────────────────────────
   נשמרים מקומית לפי **מפתח-התאמה** (גיליון · נטו · עמודים · צדדים) כדי
   שהפעם-הבאה תזהה אותם לבד. ⚠️ אחסון מקומי בלבד בשלב הזה — שיתוף-בענן הוא
   שלב ג'; החוקים כבר מתירים את `impositionTemplates`. */
var TPL_STORE_KEY='solanPrepsTemplates';
var _tplDefs={};
function _tplLoadStore(){
  try{ var raw=JSON.parse(localStorage.getItem(TPL_STORE_KEY)||'{}')||{};
       Object.keys(raw).forEach(function(k){ if(raw[k]&&raw[k].layout&&raw[k].cells) _tplDefs[k]=raw[k]; }); }
  catch(e){ console.error('טעינת טמפלטי-Preps מהאחסון נכשלה', e); }
}
function _tplSaveStore(){
  try{ localStorage.setItem(TPL_STORE_KEY, JSON.stringify(_tplDefs)); return true; }
  catch(e){ console.error('שמירת טמפלטי-Preps נכשלה', e); return false; }
}
function _tplLabelFor(d){
  var L=d.layout;
  return (L.pagesPerSignature+' עמ׳ · '+L.finishedWmm+'×'+L.finishedHmm+' · גיליון '+L.trimWmm+'×'+L.trimHmm
    +' · '+(L.sidesCount===2?'2 צדדים':'צד אחד')+' · מ-TPL');
}
async function foldByTemplate(tid, srcU8, bleedMm){
  bleedMm = bleedMm>0 ? bleedMm : 0;
  /* טמפלט מ-.tpl → ישר למנוע-הפירוק עם cells+layout מפורשים. אין כאן גשר
     ואין ניחוש: המיקומים מגיעים מקובץ-הטמפלט של הדפוס. הגלישה מוגבלת למה
     שהטמפלט עצמו מצהיר (3 מ"מ) — מקור-אמת עדיף על מספר קשיח בקוד. */
  var _td=_tplDefs[tid];
  if(_td){
    var _declared=(_td.layout.declaredBleedMm&&_td.layout.declaredBleedMm.top)||0;
    var _b = (_declared>0 && bleedMm>_declared) ? _declared : bleedMm;
    const exT=await EXEC.decodeToPdf({ sourceArrayBuffer:srcU8.slice(0),
      template:{ id:tid, layout:_td.layout, cells:_td.cells },
      startPage:1, bleedMm:_b, requestId:Date.now(),
      sheetTransform:(s)=>ADP.sheetTrimFallback(s, _td.layout) });
    if(!exT.bytes || (exT.errors&&exT.errors.length)) throw new Error('פירוק לפי הטמפלט נכשל: '+(exT.errors||[]).join(', '));
    const hT=await sha256(new Uint8Array(exT.bytes));
    const rT=ADP.runDecoderV2Adapter({ plan:exT.plan, bytes:exT.bytes, templateId:tid, templateVersion:1, sourceFile:{fileId:'src'}, outputHash:hT });
    return { bytes:exT.bytes, result:rT, plan:exT.plan, srcBytes:srcU8, bleedMm:_b };
  }
  // כל טמפלטי-האפליקציה (מובנים + מותאמים) → המנוע הקיים והמוכח (imposition-tool.html fold) דרך הגשר.
  const legacyType=_legacyTypeFor(tid);
  if(legacyType){
    if(!_bridge) _bridge=LB.createLegacyBridge({ iframeUrl:'imposition-tool.html' });
    await _bridge.ready();
    const out=await _bridge.runFold({ arrayBuffer:srcU8.slice(0), type:legacyType, firstSide:0, mirror:false, bleedMm:bleedMm, requestId:Date.now() });
    const _rawS=_u8(out&&out.bytes);
    if(!_rawS || !_rawS.length) throw new Error('הקיפול לא החזיר קובץ תקין (טמפלט '+legacyType+')');
    const bytes = bleedMm>0 ? await _trimSpineBleed(_rawS, bleedMm) : _rawS;   // שדרה בקו-0
    const outHash=await sha256(new Uint8Array(bytes));
    const r=ADP.legacyReportToResult({ report:out.report, bytes:bytes, sourceFile:{fileId:'src'}, templateId:tid, engineVersion:(_bridge.diagnostics().version||''), bridgeMode:'same-origin-iframe', outputHash:outHash });
    let plan=null;
    if(TPL_GEOM[legacyType]){ try{ plan=await _appPlanFor(srcU8, legacyType, bleedMm); }catch(e){ plan=null; } }   // plan-תצוגה (כל טמפלט מובנה)
    return { bytes:bytes, result:r, plan:plan, srcBytes:srcU8, bleedMm:bleedMm };
  }
  // decoder-v2 (88x63 בלבד — 32p עבר לגשר-האפליקציה למעלה) · sheetTrimFallback: בלי TrimBox → Trim נומינלי ממורכז
  const layout = DEC.DEFAULT_LAYOUT_88x63;
  const ex=await EXEC.decodeToPdf({ sourceArrayBuffer:srcU8.slice(0), template:{id:tid}, startPage:1, bleedMm:bleedMm, requestId:Date.now(),
    sheetTransform:(s)=>ADP.sheetTrimFallback(s, layout) });
  if(!ex.bytes || (ex.errors&&ex.errors.length)) throw new Error('פירוק נכשל: '+(ex.errors||[]).join(', '));
  const outHash=await sha256(new Uint8Array(ex.bytes));
  const r=ADP.runDecoderV2Adapter({ plan:ex.plan, bytes:ex.bytes, templateId:tid, templateVersion:1, sourceFile:{fileId:'src'}, outputHash:outHash });
  return { bytes:ex.bytes, result:r, plan:ex.plan, srcBytes:srcU8, bleedMm:bleedMm };   // plan → תצוגה-מהירה crop-from-source
}

// ── עיתון מרובה-קונטרסים (תפירת-אוכף מקוננת): R-1 חיצוני, R-2 פנימי, וכו' ──
//    כל קונטרס מקופל בנפרד דרך מנוע-האפליקציה, ואז מרכיבים לפי assembleNestedRunOrder:
//    64 עמ' = R1[1-16] R2[1-16] R2[17-32] R1[17-32]. פלט = PDF אחד רציף בסדר-קריאה.
// runDescs = [{ u8, legacyType, pages, name }] לפי סדר R-1, R-2… (חיצוני→פנימי)
async function foldMultiRun(runDescs, bleedMm){
  bleedMm = bleedMm>0 ? bleedMm : 0;
  if(!_bridge) _bridge=LB.createLegacyBridge({ iframeUrl:'imposition-tool.html' });
  await _bridge.ready();
  const runs=[];   // { outBytes, srcBytes, plan, pages }
  for(let i=0;i<runDescs.length;i++){
    const d=runDescs[i], tag='R-'+(i+1)+(d.name?(' ('+d.name+')'):'');
    // אימות-קלט: קובץ פגום/חסר לריצה → שגיאה שמזהה בדיוק איזו ריצה (במקום שגיאת-pdf עמומה)
    const u=_u8(d.u8);
    if(!u || !u.length) throw new Error('קובץ הריצה '+tag+' לא נטען כראוי — בחר אותו מחדש');
    if(!d.legacyType) throw new Error('לריצה '+tag+' לא נבחר טמפלט');
    let out;
    try{
      out=await _bridge.runFold({ arrayBuffer:u.slice(0), type:d.legacyType, firstSide:0, mirror:false, bleedMm:bleedMm, requestId:'mr'+Date.now()+'_'+i });
    }catch(e){ throw new Error('קיפול ריצה '+tag+' נכשל: '+(e&&e.message||e)); }
    const raw=_u8(out&&out.bytes);
    if(!raw || !raw.length) throw new Error('קיפול ריצה '+tag+' לא החזיר קובץ תקין (טמפלט '+d.legacyType+')');
    const bytes = bleedMm>0 ? await _trimSpineBleed(raw, bleedMm) : raw;   // שדרה בקו-0
    let plan=null; try{ plan=await _appPlanFor(u, d.legacyType, bleedMm); }catch(e){ plan=null; }
    runs.push({ outBytes:bytes, srcBytes:u, plan, pages:d.pages });
  }
  const order = ADP.assembleNestedRuns(runs.map(r=>r.pages));   // גדלים-שונים לכל קונטרס

    + '<div dir="rtl" class="fbctl" style="text-align:center;margin-top:8px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap">'
    + '<button id="_next">◀ הבא</button> <span id="_pi" class="muted"></span> <button id="_prev">הקודם ▶</button> <button id="_full">⛶ מסך מלא</button> <button id="_rot" title="מסובב את התצוגה 90° — שימושי כשהטלפון נעול על פורטרט">🔄 סובב</button> <button id="_zoom" title="לחץ להפעלת זום, ואז גלגלת-העכבר לקרב/להרחיק · גרירה להזזה · דאבל-קליק לאיפוס">🔍 זום</button> <span id="_bg" class="muted" style="font-size:.78rem"></span></div></div>';
  function progHtml(){ return '<div style="max-width:340px;margin:auto;text-align:center;color:#94a3b8;padding:18px">📖 מרנדר…'
    + '<div style="height:7px;background:#334155;border-radius:5px;margin:8px 0"><div id="_pbfill" style="height:100%;width:6%;background:#16a34a;border-radius:5px;transition:width .15s"></div></div></div>'; }
  let curPages=null;   // URLs של התצוגה הנוכחית ([u] בודד / [uHi,uLo] כפולה) — לכוונון-מסגרת חי
  async function draw(){

      if(anim)clearInterval(anim); if(my!==navSeq) return; urls=[uHi,uLo]; }   // hi שמאל · lo ימין

    /* ⚠️ **מכנה אחד לשני המספרים.** ‏pct נמדד קודם מול preN (יעד-הטעינה-

       לצד זה שאמרו יחסים שונים: "13% · 2 מתוך 32". הקורא אינו יכול לדעת
       שהאחוז מודד משהו אחר, והמסקנה הסבירה היא שאחד מהם שגוי.
       ⚠️ ‏i הוא **מספר-עמוד פיזי**: הוא נמסר כמות-שהוא ל-pageImg → _renderPage

       באמת מוכן. לכן מותר להציג אותו, ובאותו מכנה: i מתוך n.
       ⚠️ התוצאה: הפס מגיע ל-~50% כשהטעינה-המוקדמת נגמרת והחוברת נפתחת,

    const pct=Math.round(i/n*100), sp=$('_sp');

      + '<div style="height:8px;background:#334155;border-radius:5px;margin-top:10px"><div style="height:100%;width:'+pct+'%;background:#16a34a;border-radius:5px;transition:width .2s"></div></div></div>'; }
  if(_outKey!==bytes) return;
  await draw();   // השער מהמטמון — מיידי; דפדוף בחצי-הראשון חלק
  (async ()=>{ for(let i=preN+1;i<=n;i++){ if(_outKey!==bytes) return; if(!_img[i]){ try{ await pageImg(pdf,i,false); }catch(e){} }   // רקע — נכנע לניווט
    const done=Object.keys(_img).length, bg=$('_bg'); if(bg) bg.textContent = done>=n ? '✓ כל העמודים נטענו' : ('טוען ברקע… '+done+'/'+n+' — דפדף חופשי'); } })();
}

// ── תצוגה-מהירה (decoder): מרנדר 2 עמודי-מקור פעם-אחת · גוזר+מסובב כל תא לפי plan (=זהה לפלט) ──
//    פענוח-כבד פעמיים בלבד; כל התאים מיידיים. rotate CCW = כמו pdf-lib drawPage.
function _cropRotate(src, x, y, w, h, degCCW){
  x=Math.round(x); y=Math.round(y); w=Math.max(1,Math.round(w)); h=Math.max(1,Math.round(h));
  const cell=document.createElement('canvas'); cell.width=w; cell.height=h; cell.getContext('2d').drawImage(src, x, y, w, h, 0, 0, w, h);
  degCCW=((degCCW%360)+360)%360; if(degCCW===0) return cell;
  const out=document.createElement('canvas'); const ctx=out.getContext('2d');
  if(degCCW===90||degCCW===270){ out.width=h; out.height=w; } else { out.width=w; out.height=h; }
  ctx.translate(out.width/2, out.height/2); ctx.rotate(-degCCW*Math.PI/180); ctx.drawImage(cell, -w/2, -h/2); return out;
}
async function _renderSource(pdf, pageNo, sc){ await _whenVisible(); const pg=await pdf.getPage(pageNo); const vp=pg.getViewport({scale:sc});
  const cv=document.createElement('canvas'); cv.width=Math.round(vp.width); cv.height=Math.round(vp.height); const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  await pg.render({canvasContext:ctx,viewport:vp}).promise; return { cv, hpt: pg.getViewport({scale:1}).height, sc }; }
function _rotateCanvas(cell, degCCW){ degCCW=((degCCW%360)+360)%360; if(degCCW===0) return cell;
  const w=cell.width, h=cell.height, out=document.createElement('canvas'), ctx=out.getContext('2d');
  if(degCCW===90||degCCW===270){ out.width=h; out.height=w; } else { out.width=w; out.height=h; }
  ctx.translate(out.width/2, out.height/2); ctx.rotate(-degCCW*Math.PI/180); ctx.drawImage(cell, -w/2, -h/2); return out; }
// רינדור-חד של תא-בודד ישירות מ-pdf.js (רק אזור-התא בקנה-מידה גבוה · transform גוזר) → חד ולא כבד:
// פענוח-תמונת-הגיליון כבר במטמון (GlobalImageCache) מהמעבר-הנמוך, לכן מהיר. clip ב-PDF-points (origin ש-ת).
async function _renderCellRegion(pdf, pageNo, clip, degCCW, scale){
  await _whenVisible();
  const pg=await pdf.getPage(pageNo), vp=pg.getViewport({scale:scale});
  const w=Math.max(1,Math.round((clip.right-clip.left)*scale)), h=Math.max(1,Math.round((clip.top-clip.bottom)*scale));
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
  const transform=[1,0,0,1, -clip.left*scale, clip.top*scale - vp.height];   // ממקם את פינת-התא בראש-הקנבס
  await pg.render({canvasContext:ctx, viewport:vp, transform:transform}).promise;
  return _rotateCanvas(cv, degCCW);
}
let _fastGen=0, _fastDocs=[];   // מונה-מחזור + מסמכי-pdf.js פעילים (mount חדש מבטל רקע ומשחרר זיכרון)
// book = { bleedMm, runs:[{srcBytes, plan}], order:[{runIndex,posInRun}] }
//   קונטרס-יחיד → runs=[{srcBytes,plan}] · order = 1..N זהות. מרובה-קונטרסים → כמה runs + סדר-הרכבה.
async function mountFlipbookFast(host, thumbsHost, book){
  _fastDocs.forEach(d=>{ try{ d.destroy(); }catch(e){} }); _fastDocs=[];   // שחרור מסמכים קודמים (זיכרון)
  const runs=book.runs, order=book.order, bleedMm=book.bleedMm;
  const n=order.length, groups=_spreadGroups(n); let gi=0;
  const SC_LO=0.9, SC_HI_CELL=2.2;   // נמוך=תצוגה-מיידית · תא-חד=רינדור פר-עמוד בסדר-קריאה
  // לכל קונטרס: doc, אינדקס-plan לפי posInRun, ורינדורי-מקור (srcCv[side])
  const R=runs.map(r=>{ const byPos={}; r.plan.pages.forEach(p=>byPos[p.finalPageNumber]=p);
    return { doc:null, srcBytes:r.srcBytes, byPos, srcCv:{} }; });
  let ccache={}; const hiCell={};   // hiCell[N] = תא חד (גובר על הגזירה-הנמוכה)
  host.innerHTML='<div id="_fbwrap" style="background:#1a1a2e;border:1px solid var(--line);border-radius:10px;padding:8px">'
    + '<div class="spread" id="_sp" dir="ltr" style="min-height:220px;align-items:center"><div id="_prog" style="width:100%;text-align:center;color:#94a3b8">📖 טוען את הפרופר…</div></div>'
    + '<div dir="rtl" class="fbctl" style="text-align:center;margin-top:8px;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap">'
    + '<button id="_next">◀ הבא</button> <span id="_pi" class="muted"></span> <button id="_prev">הקודם ▶</button> <button id="_full">⛶ מסך מלא</button> <button id="_rot" title="מסובב את התצוגה 90° — שימושי כשהטלפון נעול על פורטרט">🔄 סובב</button> <button id="_zoom" title="לחץ להפעלת זום, ואז גלגלת-העכבר לקרב/להרחיק · גרירה להזזה · דאבל-קליק לאיפוס">🔍 זום</button> <span id="_bg" class="muted" style="font-size:.78rem"></span></div></div>';
  function cellCanvas(N){ if(hiCell[N]) return hiCell[N]; if(ccache[N]) return ccache[N];   // חד גובר על נמוך
    const o=order[N-1]; const run=R[o.runIndex]; if(!run) return null;
    const p=run.byPos[o.posInRun]; if(!p) return null; const s=run.srcCv[p.sourcePdfPage]; if(!s) return null;
    const cp=(bleedMm>0 && p.bleedClipPt)?p.bleedClipPt:p.clipPt;
    const cv=_cropRotate(s.cv, cp.left*s.sc, (s.hpt-cp.top)*s.sc, (cp.right-cp.left)*s.sc, (cp.top-cp.bottom)*s.sc, p.rotationApplied); ccache[N]=cv; return cv; }
  // תצוגה ישירה של ה-canvas (בלי קידוד-JPEG ופענוח-חזרה בכל דפדוף — מהיר ולא מעמיס)
  function draw(){ const sp=$('_sp'); const g=groups[gi]; let view=null;
    if(g.length===1){ view=cellCanvas(g[0]+1); }
    else { const lo=g[0]+1,hi=g[1]+1; const cHi=cellCanvas(hi), cLo=cellCanvas(lo);   // כפולה על canvas אחד → חיבור חלק בלי תפר
      if(cHi&&cLo){ const H=Math.max(cHi.height,cLo.height), combo=document.createElement('canvas'); combo.width=cHi.width+cLo.width; combo.height=H;
        const c=combo.getContext('2d'); c.fillStyle='#fff'; c.fillRect(0,0,combo.width,combo.height);
        c.drawImage(cHi,0,Math.round((H-cHi.height)/2)); c.drawImage(cLo,cHi.width,Math.round((H-cLo.height)/2));   // hi שמאל · lo ימין · צמוד
        view=combo; } }
    if(!view){ sp.innerHTML='<div style="color:#94a3b8;padding:24px;width:100%;text-align:center">⏳ טוען…</div>'; return; }
    sp.replaceChildren(view);
    $('_pi').textContent=_pageLabel(g, n); $('_prev').disabled=gi<=0; $('_next').disabled=gi>=groups.length-1; }
  $('_prev').onclick=()=>{ if(gi>0){gi--;draw();} if(window._zoomReset)window._zoomReset(); }; $('_next').onclick=()=>{ if(gi<groups.length-1){gi++;draw();} if(window._zoomReset)window._zoomReset(); };
  $('_full').onclick=()=>{ _toggleFullscreen($('_fbwrap')); };
  $('_rot').onclick=()=>{ _toggleRotate($('_fbwrap')); };
  _setupZoom();   // 🔍 זום: לחצן + גלגלת + גרירה
  function renderThumbsFast(){ if(!thumbsHost) return; thumbsHost.innerHTML=''; for(let N=1;N<=n;N++){ const c=cellCanvas(N); const t=document.createElement('div'); t.className='th';
    if(c){ const tc=document.createElement('canvas'); const s=88/c.width; tc.width=88; tc.height=Math.round(c.height*s); tc.getContext('2d').drawImage(c,0,0,tc.width,tc.height); const im=new Image(); im.src=tc.toDataURL('image/jpeg',0.7); im.style.width='88px'; t.appendChild(im); }
    const l=document.createElement('div'); l.textContent=N; t.appendChild(l); thumbsHost.appendChild(t); } }
  const myGen=++_fastGen;   // ביטול-מחזור: קיפול-מחדש (בליד/קובץ) מפסיק רינדורי-רקע ישנים
  // רשימת (run,side) לרינדור — לפי סדר-ההופעה בספר (קונטרס ראשון קודם → השער מהר)
  const need=[]; const seen={};
  order.forEach(o=>{ const run=R[o.runIndex]; const p=run.byPos[o.posInRun]; if(!p) return;
    const key=o.runIndex+':'+p.sourcePdfPage; if(!seen[key]){ seen[key]=true; need.push({ri:o.runIndex, side:p.sourcePdfPage}); } });
  async function ensureDoc(ri){ if(!R[ri].doc){ const d=await pdfjsLib.getDocument({data:R[ri].srcBytes.slice(0)}).promise; R[ri].doc=d; _fastDocs.push(d); } return R[ri].doc; }
  // שלב 1 — רינדור-מקור מהיר לכל (קונטרס,צד) → תצוגה מיידית + thumbnails
  for(let i=0;i<need.length;i++){ const {ri,side}=need[i]; const d=await ensureDoc(ri);
    R[ri].srcCv[side]=await _renderSource(d, side, SC_LO); if(myGen!==_fastGen) return;
    /* ⚠️ **בלי שבר-מספרי.** ‏need.length הוא מספר צדדי-הגיליון שצריך

       שנראה כמו ספירת-עמודים ואינו. אין כאן מספר-עמודים אמיתי להציג
       בשלב הזה, ולכן לא מציגים מספר בכלל — עדיף חסר-מספר על-פני מספר
       שמשמעותו אחרת. הספירה הפיזית מגיעה מיד אחר-כך ב-'מחדד… N/n'. */
    const pr=$('_prog'); if(pr&&i===0) pr.textContent='📖 טוענים את הפרופר…'; const bg=$('_bg'); if(bg) bg.textContent='מכינים את התצוגה…'; ccache={}; draw(); }
  renderThumbsFast();
  // שלב 2 — חידוד פר-עמוד בסדר-קריאה: 6 הראשונים חדים מיד, השאר תוך-כדי דפדוף.
  //   כל תא מרונדר חד ישירות מ-pdf.js (אזור-התא בקנה גבוה · פענוח-הגיליון כבר במטמון → מהיר).
  (async ()=>{ for(let N=1;N<=n;N++){ if(myGen!==_fastGen) return;
      const o=order[N-1], run=R[o.runIndex]; if(!run) continue; const p=run.byPos[o.posInRun]; if(!p) continue;
      const cp=(bleedMm>0 && p.bleedClipPt)?p.bleedClipPt:p.clipPt;
      const d=await ensureDoc(o.runIndex);
      try{ hiCell[N]=await _renderCellRegion(d, p.sourcePdfPage, cp, p.rotationApplied, SC_HI_CELL); }catch(e){}
      if(myGen!==_fastGen) return;
      const g=groups[gi]; if(g.indexOf(N-1)>=0) draw();   // רענן אם התא בתצוגה הנוכחית
      const bg=$('_bg'); if(bg) bg.textContent = N>=n ? '✓ כל העמודים חדים' : ('מחדד… '+N+'/'+n+' — דפדף חופשי');
      if(N<=6) await new Promise(r=>setTimeout(r,0));   // yield — שהעמודים הראשונים יעלו חד מהר וה-UI יגיב
    } })();
}

  // רענון בורר-הטמפלטים בלי לרענן את הדף (אחרי הוספה/הסרה)

  let _srcU8=null, _srcName='', _folded=null, _multiU8=[], _multiNames=[];   // {bytes,result}
  // מיון-טבעי לפי שם-קובץ → R-1 לפני R-2 לפני R-10 (בחירת-קבצים מרובה לא שומרת סדר)
  function _natSort(a,b){ return String(a).localeCompare(String(b), undefined, {numeric:true, sensitivity:'base'}); }
  /* ⚠️ 17/08/2026 — מיון-השם-המלא לבדו אינו אמין לסדר-הריצות, ובייצור הוא אכן
     החליף בין R-2 ל-R-3. הסיבה: בשם יש **שלושה** מספרים — גיליון (719), ריצה
     (R-2) ומספר-צבעים (4color / 8 color) — והמיון הטבעי אינו יודע מי מהם קובע.
     די בכך שריצה אחת נכתבה "R-3 8 color" והשנייה "R-2 _4color" (רווח מול
     קו-תחתון) כדי שההשוואה תוכרע על התו שאחרי המספר ולא על המספר עצמו.
     מעכשיו מספר-הריצה נחלץ מפורשות והוא המפתח הראשון; השם הוא רק שובר-שוויון. */
  function _runNoOf(name){
    const m = String(name==null?'':name).match(/(?:^|[^A-Za-z0-9])(?:r|ריצה)\s*[-_ ]?\s*(\d{1,2})(?![0-9])/i);
    return m ? (parseInt(m[1],10)||null) : null;
  }
  // קבצים בלי סימון-ריצה נשארים אחרי הממוספרים, בסדר-שם — ולא משתלבים ביניהם בשקט
  function _runSort(a,b){
    const ra=_runNoOf(a), rb=_runNoOf(b);
    if(ra!=null && rb!=null && ra!==rb) return ra-rb;
    if(ra!=null && rb==null) return -1;
    if(ra==null && rb!=null) return 1;
    return _natSort(a,b);
  }
  /* כמה עמודים נכנסים בגיליון מלא לפי גודל-העמוד. זה הסף שמעליו 4 צבעים אינו
     "מתהפך": מתהפך = חצי-גיליון בסט-לוחות אחד. 16.5×24 → 32 · A4 ו-24×33 → 16.
     ‏(אותם ספים בדיוק כמו _pcSheetFromMM ב-proof-client — אל תפצל ביניהם.) */
  function _sheetCapFor(w,h){
    const mx=Math.max(w||0,h||0), mn=Math.min(w||0,h||0);
    if(!mx||!mn) return 32;
    if(Math.abs(mx-240)<12 && Math.abs(mn-165)<12) return 32;   // 16.5×24
    if(Math.abs(mx-297)<14 && Math.abs(mn-210)<14) return 16;   // A4
    if(Math.abs(mx-330)<14 && Math.abs(mn-240)<14) return 16;   // 24×33
    return 32;
  }

  // ── קטלוג-הטמפלטים: 3 המאושרים + כל המובנים של מנוע-האפליקציה + מותאמים מכלי סימון-הטמפלט ──
  function _cfpCatalog(){

         (32 עמ' לגיליון) הוא אפשרי רק **מתחת** ל-32 עמ'. התווית "מתהפך" כאן
         הייתה שגויה ודווחה מהייצור (17/08/2026); הלוחות עצמם היו תקינים. */
      { id:'legacy:32p',  label:'32 עמ׳ · 165×240 · קדמי+אחורי (4 צבעים)', w:165, h:240, engine:'legacy' },
      { id:'16perf',      label:'16 עמ׳ · 165×240 · פרפקטור', w:165, h:240, engine:'legacy' },
      { id:'legacy:16p',  label:'16 עמ׳ · 165×240 · מתהפך', w:165, h:240, engine:'legacy' },
      { id:'legacy:8perf',label:'8 עמ׳ · 165×240 · פרפקטור', w:165, h:240, engine:'legacy' },
      { id:'legacy:8p',   label:'8 עמ׳ · 165×240 · מתהפך', w:165, h:240, engine:'legacy' },
      { id:'legacy:4perf',label:'4 עמ׳ · 165×240 · פרפקטור', w:165, h:240, engine:'legacy' },
      { id:'legacy:4p',   label:'4 עמ׳ · 165×240 · מתהפך', w:165, h:240, engine:'legacy' },
      { id:'88x63-16p-perfector', label:'16 עמ׳ · 210×297 · 88×63 פרפקטור', w:210, h:297, engine:'decoder-v2' }
    ];
    // טמפלטי-Preps שנטענו מקובץ .tpl — בראש הרשימה, כי הם המדויקים ביותר
    Object.keys(_tplDefs).forEach(function(k){
      var d=_tplDefs[k];
      list.unshift({ id:k, label:'📐 '+_tplLabelFor(d), w:d.layout.finishedWmm, h:d.layout.finishedHmm, engine:'decoder-v2' });
    });
    // גשר-מאגרים: טמפלטים שנשמרו בכלי סימון-הטמפלט יושבים ב-solanImpositionTemplatesV2
    // (מודל-cells), בעוד מנוע-הקיפול קורא solanFoldTemplates (grids). ממירים ורושמים אותם
    // לפני יצירת ה-iframe של הגשר → מופיעים ברשימה *וגם* עובדים בקיפול.
    try{

      const ov0=JSON.parse(localStorage.getItem('solanFoldTemplates')||'{}')||{};
      let changed=false;
      Object.keys(v2).forEach(k=>{
        const rec=v2[k]; const t=(rec&&rec.cells)?rec:(rec&&rec.template)?rec.template:(rec&&rec.versions&&rec.current!=null?rec.versions[rec.current]:null);
        if(!t || !Array.isArray(t.cells) || !t.cells.length) return;
        if(ov0[k] && ov0[k].custom) return;                       // כבר רשום — לא דורסים

        ov0[k]=lg; changed=true;

      if(changed) localStorage.setItem('solanFoldTemplates', JSON.stringify(ov0));
    }catch(e){}
    try{
      const ov=JSON.parse(localStorage.getItem('solanFoldTemplates')||'{}')||{};
      Object.keys(ov).forEach(k=>{ const o=ov[k];
        if(o && o.custom && Array.isArray(o.grids) && o.grids.length){
          const g=o.geom||{};
          list.push({ id:'custom:'+k, label:'🧩 '+(o.label||k)+(g.trimWmm?(' · '+g.trimWmm+'×'+g.trimHmm):''),
            w:g.trimWmm||null, h:g.trimHmm||null, engine:'legacy' });
        } });
    }catch(e){}
    return list;
  }
  let _catalog=_cfpCatalog();   // ‏let ולא const — נבנה מחדש כשנטענים טמפלטי-TPL

  /* ── טעינת קובצי .tpl ────────────────────────────────────────────────────

         שלא נשלח. עכשיו זה קורה מעצמו ברגע שנוצרה הגרסה; וואטסאפ/מייל
         נשארים לשליחה **נוספת** ולמי שאין לו פורטל.
         ⚠️ כשל אינו נבלע ואינו מסתפק ב-alert שנעלם: הסטטוס אומר במפורש
         שהפרופר **לא** בפורטל, והכפתור חוזר כדי לנסות שוב. */
      async function _cfpToPortal(auto){
        const btn=$('sndPortal'); const was = btn ? btn.textContent : '';
        if (btn){ btn.disabled=true; btn.textContent='שולח לפורטל…'; }
        try{
          const pid='fold_'+rec.versionId;
          await _dbPut('customerProofs/'+pid, {
            customer: _selCustRow.name, title: jobLabel + ' — לאישור (V'+versionNumber+')',
            status:'apogee',                       // "ממתין לאישורך" בפורטל
            foldVersionId: rec.versionId, foldToken: rec.share.token,
            apogeeUrl: up.url,                     // גם הורדה ישירה של החוברת
            pageCount: _folded.result.orderedPages.length,
            source:'shop-fold', createdAt: Date.now() });
          _markSent(rec.versionId);
          if (btn){ btn.disabled=false; btn.textContent='📥 שלח שוב לפורטל'; }
          $('sentInfo').innerHTML='<span class="ok">✓ '
            + (auto ? 'נשלח אוטומטית לפורטל של ' : 'מופיע בפורטל של ')
            + _esc(_selCustRow.name) + ' — הלקוח רואה "ממתין לאישורך" ויכול לדפדף ולאשר משם</span>';
        }catch(e){
          if (btn){ btn.disabled=false; btn.textContent = was || '📥 שלח לפורטל'; }
          $('sentInfo').innerHTML='<span class="bad">⚠️ הפרופר <b>לא</b> נשלח לפורטל ('
            + _esc(String((e&&e.message)||e)) + ') — שלחו בוואטסאפ/מייל, או לחצו שוב.</span>';
          if (!auto) alert('השליחה לפורטל נכשלה: '+(e.message||e));   // בלי כשל שקט
        }
      }
      if($('sndPortal')) $('sndPortal').onclick=function(){ _cfpToPortal(false); };
      /* ⚠️ אחרי חיווט-הכפתורים, כדי שכשל יוכל להחזיר אותם למצב שאפשר לנסות שוב. */
      if (_custHasPortal) _cfpToPortal(true);
      setStep(4);
    }catch(err){ $('linkStatus').innerHTML='<span class="bad">'+(err.message||err)+'</span>'; $('linkBtn').disabled=false; }
  };
}

/* ═══════════════ מסך הלקוח ═══════════════ */
async function clientScreen(versionId, token){
  document.documentElement.className='client'; document.body.className='clientwrap'; document.title='חוברת לאישור — סולן הדפסות';
  $('app').innerHTML='<div class="card"><h2 id="cTitle">טוען…</h2><div id="cMeta" class="muted"></div></div><div class="card" id="cBook" style="display:none"><div id="cFlip"></div></div><div class="card" id="cApprove" style="display:none"></div><div class="card" id="cShare" style="display:none"></div>';
  // ⚠️ שלב-הזהות **לפני הכול**: מחליף v+t ב-Custom Token דרך proofLinkLogin
  // (proof-context.js), מרענן ID token, וקורא claims. הודעת-הכשל אחידה בכוונה
  // (לא "version לא קיים" מול "token שגוי") — כדי לא לגלות ללקוח-מנחש אם
  // גרסה של מישהו אחר קיימת. t מוסר מהכתובת אוטומטית ב-ProofContext.ready().
  if(!window.ProofContext){ $('cTitle').innerHTML='<span class="bad">שגיאת-טעינה — נסו לרענן את הדף</span>'; return; }
  /* ⚠️ פס-בדיקה (אירוע 06/08/2026). ‏"פתח כלקוח (בדיקה)" מוסיף preview=1,
     והוא **שורד** את ה-replaceState שמסיר את t (params.delete('t') בלבד).
     לכן גם אם עובד יעתיק בכל-זאת את הכתובת מהחלון הזה, הנמען יראה את
     הפס ויבין מיד שקיבל כתובת-בדיקה — הסימן נוסע עם הכתובת. */
  const _isPreview = new URLSearchParams(location.search).get('preview')==='1';
  if(_isPreview){
    const bar=document.createElement('div');
    bar.id='cPreviewBar';
    bar.style.cssText='position:sticky;top:0;z-index:50;background:#fef3c7;border-bottom:2px solid #f59e0b;'
      + 'color:#78350f;padding:10px 14px;font-weight:700;line-height:1.5;direction:rtl';
    bar.textContent='🔎 זהו מסך בדיקה. אין להעתיק את הכתובת; לשליחת קישור השתמשו '
      + 'ב"העתק קישור מלא ללקוח" או "שלח קישור מלא ללקוח" במסך האישורים.';
    document.body.insertBefore(bar, document.body.firstChild);
  }
  const pctx=await window.ProofContext.ready(versionId);
  if(!pctx.ok || pctx.versionId!==versionId){
    /* ⚠️ שתי תקלות שונות, שתי הודעות שונות (אירוע 06/08/2026): לקוח קיבל
       כתובת **בלי** ‎&t=‎ וראה "אינו תקין או פג תוקף" — הודעה שמובילה אותו
       ואת בית-הדפוס למסקנה שהפרופר בוטל, בזמן שהוא תקין לחלוטין והחסר
       הוא הטוקן בלבד.

       ⚠️ ההבחנה נשענת על ‎token‎ (הפרמטר שהכתובת עצמה נשאה) ולא על מצב-
       פנימי של ProofContext — כלומר על מה שהמשתמש שלח, ולא על מה שהשרת
       ענה. לכן היא **אינה מדליפה דבר**: בענף הזה עוד לא בוצעה שום קריאה
       לשרת, ולא ניתן ללמוד ממנה אם גרסה כלשהי קיימת. הודעת "אינו תקין"
       נשארת אחידה בדיוק כפי שהייתה, לכל שאר המקרים.

       ⚠️ הטוקן עצמו אינו מוזכר בהודעה, לא נרשם ל-console ואינו נכנס
       ל-DOM — ראה cfp-link-message-tests.js. */
    $('cTitle').innerHTML = token
      ? '<span class="bad">הקישור אינו תקין או פג תוקף.</span>'
      : '<span class="bad">הקישור שקיבלתם אינו מלא. בקשו מבית הדפוס לשלוח קישור חדש.</span>';
    return;
  }
  /* ── סשן-צפייה (13/08/2026, שיתוף-לצפייה) — מסלול נפרד ומצומצם ────────
     ⚠️ **אפס קריאות-RTDB בכוונה**: ה-claims של צופה (proofViewVersionId)
     אינם עונים לאף חוק, והרשומה המלאה מכילה את סוד-האישור (share.token) —
     צופה אסור שיראה אותה. הכותרת וה-hash מגיעים מתשובת-הכניסה (viewMeta),
     וה-PDF מ-proofFileDownload. אין renderApprove, אין ack-poll. */
  if(pctx.viewOnly){ await _clientViewScreen(versionId); return; }
  let rec=null;
  try{ rec=await _cDbGet('customerFoldVersions/'+versionId); }catch(e){}
  if(!rec){ $('cTitle').innerHTML='<span class="bad">הקישור אינו תקין או פג תוקף.</span>'; return; }
  // ⚠️ token נבדק **רק** כשהוא סופק (כניסה חדשה, לא רענון-סשן-משוחזר) — ב-
  // רענון t כבר הוסר מהכתובת, וה-claim (proofVersionId, שכבר אומת למעלה
  // מול ProofContext) הוא גבול-הזהות, לא ה-token. השוואה מול '' הייתה דוחה
  // כל רענון-דף בטעות.
  if(token && rec.share.token!==token){ $('cTitle').innerHTML='<span class="bad">הקישור אינו תקין או פג תוקף.</span>'; return; }
  const valid=CFV.isLinkValid(rec, _nowIso());
  if(!valid.valid){ $('cTitle').innerHTML='<span class="bad">'+(valid.reason==='REVOKED'?'הקישור בוטל':'תוקף הקישור פג')+'</span>'; return; }
  $('cTitle').textContent=rec.jobName||'חוברת לאישור';
  $('cMeta').innerHTML='גרסה V'+rec.versionNumber+' · '+rec.pageCount+' עמ׳ · '+rec.finalPageSizeMm.width+'×'+rec.finalPageSizeMm.height+' מ״מ';
  const _ok=await _cLoadBook(versionId, rec.outputHash, !!rec.outputStoragePath);
  if(!_ok) return;
  /* ⚠️ כפתורי אישור/בקשת-תיקון נרנדרים **רק כאן** — אחרי שהקובץ ירד,
     ה-hash אומת והדפדוף מוכן. כשל בכל אחד מהשלבים מדלג על השורה הזו. */
  renderApprove(rec, true);
  _cMountShareRow(versionId);
}

/* ── הורדה + אימות-hash + דפדוף — צינור אחד לשני המסלולים ─────────────────
   ⚠️ חולץ מ-clientScreen ב-13/08/2026 כשנוסף מסך-הצפייה: בדיקת-השלמות
   (bytes === outputHash) חייבת להיות **אותה בדיקה בדיוק** בשני המסלולים,
   ושני עותקים היו נסחפים. ההבדל היחיד בין המסלולים הוא מה קורה אחרי —
   אישור (clientScreen) או כלום (מסך-הצפייה). מחזיר true כשהדפדוף מוצג. */
async function _cLoadBook(versionId, expectedHash, hasStoragePath){
  // טעינת ה-PDF שהעובד בדק (אותם bytes) — רק **אחרי** אימות-הזהות.
  // ⚠️ חסם-4: דרך proofFileDownload עם versionId בלבד, לא rec.outputUrl
  // (download-token שעוקף כל בדיקת-הרשאה) ולא rec.outputStoragePath ישירות
  // (הנתיב נגזר בשרת מהרשומה, לא מתקבל/נשלח מהלקוח).
  // ⚠️ תיקון-חירום (06/08/2026): מזהה-תקלה בטוח לתצוגה-למשתמש — לא חושף
  // נתיב/token/hash מלא, רק versionId (כבר ידוע ללקוח מהכתובת) + חותמת-זמן.
  const _incidentId=(versionId||'?').slice(-8)+'-'+Date.now().toString(36);
  function _loadFailMsg(extra){ return '<div class="bad" style="white-space:pre-line;margin-top:8px">טעינת החוברת נכשלה. נסו לרענן את הדף.'
    +(extra?(' '+extra):'')+'\nמזהה-תקלה: '+_incidentId+'</div>'; }
  /* ⚠️ תיקון-UX (06/08/2026): כרטיס-הדפדוף מוצג **מיד** אחרי פרטי-הרשומה,
     עם חיווי-שלבים, במקום אזור-ריק שנראה תקוע. אין כאן שינוי בהורדה,
     באבטחה, ב-hash או באישור — רק מה שהמשתמש רואה בזמן ההמתנה.
     החיווי נעלם **רק** כשהעמוד הראשון כבר מוצג (אחרי mountFlipbook). */
  $('cBook').style.display='';
  function _stage(html){ const el=$('cLoad'); if(el) el.innerHTML=html; }
  $('cFlip').innerHTML='<div id="cLoad" style="text-align:center;color:#94a3b8;padding:26px"></div>';
  const _bigMsg='<div style="font-size:.82rem;opacity:.8;margin-top:6px">הקובץ גדול והטעינה עשויה להימשך עד שתי דקות. אין לסגור את החלון.</div>';
  _stage('⏳ מוריד את הפרופר… נא להמתין');
  /* ⚠️ אזהרת קובץ-גדול לפי **זמן-שהייה אמיתי** (עדיין-מוריד אחרי 4 שנ'), לא
     לפי גודל: תגובת-ההזרמה של הפונקציה היא chunked בלי Content-Length, ולכן
     הגודל לא ידוע מראש. אין להציג נתון שאין לנו. */
  let _dlSlow=false;
  const _slowTimer=setTimeout(function(){ _dlSlow=true;
    const el=$('cLoad'); if(el && /מוריד את הפרופר/.test(el.innerHTML) && el.innerHTML.indexOf('להימשך עד שתי דקות')<0) el.innerHTML+=_bigMsg;
  }, 4000);
  let bytes=null;
  if(hasStoragePath){
    try{
      bytes=new Uint8Array(await _cStorageFetch(versionId, function(received,total){
        /* אחוזים **אמיתיים בלבד** — לפי Content-Length. הקריאה מגיעה רק
           כשהכותרת קיימת (total>0); בתגובת-chunked אין אחוזים כלל. */
        const pct=Math.max(0,Math.min(100,Math.round(received/total*100)));
        _stage('⏳ מוריד את הפרופר… נא להמתין <b>'+pct+'%</b>'
          +'<div style="height:8px;background:#334155;border-radius:5px;margin:10px auto 0;max-width:340px"><div style="height:100%;width:'+pct+'%;background:#16a34a;border-radius:5px;transition:width .2s"></div></div>'
          +(_dlSlow?_bigMsg:''));
      }));
    }catch(e){}
  }
  clearTimeout(_slowTimer);
  if(!bytes){ $('cBook').style.display='none'; $('cTitle').innerHTML+=' <span class="bad">(טעינת החוברת נכשלה)</span>'; $('cMeta').innerHTML+=_loadFailMsg(); return false; }
  // הוכחת-זהות: ה-bytes שהתקבלו === outputHash שברשומה. ⚠️ אי-התאמה נעצרת
  // כאן במפורש (לא "אזהרה וממשיכים") — קובץ חתוך/שגוי לא מגיע ל-pdf.js,
  // שהיה קורס בשקט (InvalidPDFException בלתי-מטופלת) ומשאיר מסך לבן.
  _stage('🔍 בודק את שלמות הקובץ…');
  const gotHash=await sha256(bytes);
  if(gotHash!==expectedHash){
    $('cBook').style.display='none';
    $('cMeta').innerHTML+=_loadFailMsg('הקובץ שהתקבל אינו תואם את הגרסה המאושרת.');
    return false;
  }
  // רכיבי-הצפייה (pdf.js) חייבים להיות זמינים לפני הדפדוף — אחרת הלקוח נשאר על "טוען…"
  const _lr=await _ensureLibs();
  if(!_lr.ok){ $('cBook').style.display='none'; $('cMeta').innerHTML+='<div class="bad" style="white-space:pre-line;margin-top:8px">'+_libsBlockedMsg(_lr)+'</div>'; return false; }
  // ⚠️ mountFlipbook יכול לזרוק (pdf.js/InvalidPDFException) — לפני התיקון
  // חריגה כזו הייתה בלתי-מטופלת ומשאירה מסך לבן בלי שום הודעה.
  try{
    _stage('📖 מכין את הדפדוף…');
    /* ⚠️ mountFlipbook כותב את ה-HTML שלו לתוך host ובכך **מחליף** את חיווי-
       הטעינה — כלומר החיווי נעלם בדיוק כשהעמוד הראשון מוצג, לא לפני. */
    await mountFlipbook($('cFlip'), bytes);
    return true;
  }catch(e){
    $('cBook').style.display='none';
    $('cMeta').innerHTML+=_loadFailMsg();
    return false;
  }
}

/* ── מסך-הצפייה (13/08/2026, שיתוף-לצפייה) ────────────────────────────────
   ⚠️ מה שאין כאן הוא העיקר: אין _cDbGet (לצופה אין קריאת-RTDB — הרשומה
   מכילה את סוד-האישור), אין renderApprove, אין _startAckPoll ואין שורת-
   שיתוף (הקישור שבידו הוא הקישור). המטא-נתונים — מתשובת-הכניסה בלבד. */
async function _clientViewScreen(versionId){
  document.title='חוברת להצגה — סולן הדפסות';
  const vm=(window.ProofContext && window.ProofContext.viewMeta) || null;
  if(!vm || !vm.outputHash){
    /* תשובת-כניסה בלי מטא-נתונים = שרת ישן או תקלה — נכשלים בקול, לא
       מדפדפים בלי אימות-שלמות. */
    $('cTitle').innerHTML='<span class="bad">הקישור אינו תקין או פג תוקף.</span>';
    return;
  }
  $('cTitle').textContent=vm.jobName||'חוברת להצגה';
  $('cMeta').innerHTML='גרסה V'+(vm.versionNumber||1)
    +(vm.pageCount?(' · '+vm.pageCount+' עמ׳'):'')
    +((vm.finalPageSizeMm&&vm.finalPageSizeMm.width)?(' · '+vm.finalPageSizeMm.width+'×'+vm.finalPageSizeMm.height+' מ״מ'):'');
  const box=$('cApprove');
  box.style.display='';
  box.innerHTML='<div style="text-align:center;padding:11px 13px;border:1.5px dashed var(--line);border-radius:10px;color:var(--muted)">'
    +'👁 עותק לצפייה בלבד — ללא אפשרות אישור או בקשת תיקון. האישור לדפוס נעשה על-ידי הלקוח בקישור המקורי.</div>';
  await _cLoadBook(versionId, vm.outputHash, true);
}

/* ── שיתוף-לצפייה מתוך מסך-האישור (13/08/2026, בקשת-בעלים) ────────────────
   הלקוח שולח עותק-צפייה לאנשים נוספים — עורך, מגיה, מו"ל — בלי למסור את
   קישור-האישור שלו. ⚠️ **לעולם לא משתפים את הכתובת הנוכחית**: היא נושאת
   את סוד-האישור (או נשאה אותו). הקישור המשותף נבנה מטוקן-הצפייה שהשרת
   מנפיק (proofShareViewLink), והמקבל נכנס כסשן-צפייה בלבד. */
function _cMountShareRow(versionId){
  const el=$('cShare'); if(!el) return;
  el.style.display='';
  el.innerHTML='<h3 style="margin:0 0 4px">🔗 שיתוף לצפייה</h3>'
    +'<div class="muted" style="font-size:.84rem;margin-bottom:9px">שולח עותק-צפייה של החוברת. למקבל אין אפשרות לאשר או לבקש תיקון.</div>'
    +'<button id="cShareBtn">🔗 שתפו קישור-צפייה</button><span id="cShareMsg" class="muted" style="margin-inline-start:9px"></span>';
  $('cShareBtn').onclick=function(){ _cShareView(versionId); };
}
async function _cShareView(versionId){
  const btn=$('cShareBtn'), msg=$('cShareMsg');
  btn.disabled=true; msg.textContent='יוצר קישור…';
  try{
    const tok=await _cAuth();
    const r=await fetch(_FN_BASE+'proofShareViewLink',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok},
      body:JSON.stringify({data:{versionId:versionId}})});
    const j=await r.json().catch(function(){return {};});
    if(!r.ok) throw new Error((j.error&&j.error.message)||'יצירת הקישור נכשלה');
    const vt=j.result&&j.result.viewToken;
    if(!vt) throw new Error('יצירת הקישור נכשלה');
    /* הקישור נבנה מ-viewToken בלבד — סוד-האישור אינו חלק ממנו. */
    const url=new URL('customer-fold-preview.html?v='+encodeURIComponent(versionId)+'&t='+encodeURIComponent(vt), location.href).href;
    let shared=false;
    if(navigator.share){
      try{ await navigator.share({title:'חוברת לצפייה', url:url}); shared=true; }
      catch(e){
        /* המשתמש ביטל את דיאלוג-השיתוף — אינו כשל, ואין מה להעתיק בשקט. */

// אחרי אישור/תיקון — המסך *נשאר פתוח* ומאזין לאישור-הקבלה של בית-הדפוס
let _ackPoll=null;
function _startAckPoll(versionId, isApprove){
  if(_ackPoll) clearInterval(_ackPoll);

        clearInterval(_ackPoll); _ackPoll=null;
        const box=$('cApprove'); if(box) box.innerHTML = isApprove ? _cApprovedBox(fresh) : _cCorrectionBox(fresh);
      }
    }catch(e){}

}
function _fmtHe(iso){ try{ return new Date(iso).toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso||''; } }
// ── סנכרון-אישור: payload ל-PATCH אטומי-רב-נתיבים יחיד ──────────────────────
//    מקור-האמת נשאר customerFoldVersions בלבד. customerProofs/fold_<id> הוא
//    mirror-בלבד לצורך badge/מונה-ממתינים בפורטל (customer-portal.html), עם
//    שדות ייעודיים (foldApprovalStatus/foldApprovedAt/foldApprovedBy) — לא
//    apogeeApprovedAt/apogeeApprovedBy ולא bookletApprovals (שייכים למסלול הישן).
//    ⚠️ ה-mirror נכתב *רק* אם הרשומה כבר קיימת (existingProofsRecord) — כך
//    שאין יצירת רשומת customerProofs יתומה כשהקישור נשלח בוואטסאפ/מייל בלבד.
function _buildApprovalPatch(versionId, approvedRecord, existingProofsRecord){
  const patch={};
  patch['customerFoldVersions/'+versionId+'/approval']=approvedRecord.approval;
  patch['customerFoldVersions/'+versionId+'/status']=approvedRecord.status;
  if(existingProofsRecord){
    const isApproved=approvedRecord.approval.status==='approved';
    patch['customerProofs/fold_'+versionId+'/foldApprovalStatus']=approvedRecord.approval.status;
    // ⚠️ מנוקה במפורש (לא "מה שיש ב-approval") בכל סטטוס שאינו approved — כך
    //    שתיקון-נדרש אחרי אישור-קודם (או נתון-ישן מכל סיבה) לא משאיר תאריך/שם-מאשר.
    patch['customerProofs/fold_'+versionId+'/foldApprovedAt']=isApproved?approvedRecord.approval.approvedAt:null;
    patch['customerProofs/fold_'+versionId+'/foldApprovedBy']=isApproved?approvedRecord.approval.approvedBy:null;
  }
  return patch;
}
function renderApprove(rec, hashOk){

   + '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button id="cApproveBtn" class="primary"'+(hashOk?'':' disabled title="החוברת אינה תואמת לגרסה"')+'>✓ מאשר להדפסה</button>'
   + '<button id="cCorrectBtn">✎ מבקש תיקון</button></div><div id="cResult" class="muted" style="margin-top:8px"></div>';
  async function submit(action){
    // ⚠️ הגנה מפני קריאה-כפולה (לחיצה כפולה/מהירה בטרם ה-await הראשון מסתיים) —
    //    בלי זה submit() יכול לרוץ פעמיים במקביל על אותה גרסה. המסך-הסופי
    //    (renderApprove: st==='approved'/'correction-requested') חוסם קריאה
    //    חוזרת אחרי טעינה-מחדש, אבל לא בתוך אותה טעינת-דף לפני ההחלפה.
    if(submit._busy) return; submit._busy=true;
    const btnA=$('cApproveBtn'), btnC=$('cCorrectBtn'); if(btnA)btnA.disabled=true; if(btnC)btnC.disabled=true;
    const nm=$('cName').value||null, cm=$('cComment').value||null;
    /* ⚠️ 07/08/2026 — הקריאה הזו הייתה **מחוץ** ל-try, אחרי ששני הכפתורים
       כבר נוטרלו ו-submit._busy הודלק. ‏_cAuth דוחה במפורש כשהאסימון פג —
       ועורך שמדפדף 32 עמודים לפני שהוא מאשר מגיע לזה. הדחייה עקפה את שני
       מסלולי-השחזור שלמטה, והכפתורים נשארו אפורים **עד רענון-דף**, בלי
       שום הודעה. הלקוח בטוח שלחץ ושהמערכת תקועה. */
    let fresh;
    try{ fresh=await _cDbGet('customerFoldVersions/'+rec.versionId); }   // מקור-אמת עדכני מהשרת
    catch(e){
      $('cResult').innerHTML='<span class="bad">לא הצלחנו לאמת מול השרת — ייתכן שהקישור פג. רעננו את הדף ונסו שוב.</span>';
      submit._busy=false; if(btnA)btnA.disabled=!hashOk; if(btnC)btnC.disabled=false; return;
    }
    const res=CFV.applyApproval(fresh, action, { approvedBy:nm, comment:cm, nowIso:_nowIso() });
    if(!res.ok){ $('cResult').innerHTML='<span class="bad">'+(res.error==='LINK_REVOKED'?'הקישור בוטל':res.error==='LINK_EXPIRED'?'תוקף פג':res.error)+'</span>';
      submit._busy=false; if(btnA)btnA.disabled=!hashOk; if(btnC)btnC.disabled=false; return; }
    // mirror ל-customerProofs (אם קיים) נכתב באותו PATCH אטומי — לא שתי כתיבות נפרדות
    // ⚠️ _dbGetOrFail דוחה על 403/רשת (לא הופך ל-null) — כך שכשל-קריאה לא
    //    מתפרש כ"אין רשומה מקושרת". במקרה כזה ה-mirror מדולג (בטוח: אין
    //    ניחוש מה יש בצד השני) אבל האישור-האמיתי (customerFoldVersions,
    //    מקור-האמת) ממשיך כרגיל — ולא נטען הצלחה כוזבת. staff מקבל סימון
    //    בהתראה כדי שהכשל לא יישאר שקט.
    let existingProofsRecord=null, proofsCheckFailed=false;
    try{ existingProofsRecord=await _cDbGetOrFail('customerProofs/fold_'+rec.versionId); }

    try{ await _cDbPatch('', patch); }
    catch(e){ $('cResult').innerHTML='<span class="bad">השמירה נכשלה — נסו שוב</span>';
      submit._busy=false; if(btnA)btnA.disabled=!hashOk; if(btnC)btnC.disabled=false; return; }
    // התראת-שופ (סוגר את הלולאה — האפליקציה תצלצל ותציג toast)
    const who=(nm||'לקוח'), jl=rec.jobName||'חוברת', vn='V'+rec.versionNumber;

    const notified = (action==='approve')

    // החלון של הלקוח משתנה למצב-הסופי (אושר לדפוס / התבקש תיקון)
    box.innerHTML = action==='approve' ? _cApprovedBox(res.record) : _cCorrectionBox(res.record);

    if(!notified){

  }
  $('cApproveBtn').onclick=()=>submit('approve'); $('cCorrectBtn').onclick=()=>submit('request-correction');

        + (st==='approved'||r.archived ? '<button class="delBtn" data-v="'+r.versionId+'" data-j="'+encodeURIComponent(r.jobName||'')+'" style="color:var(--danger)">🗑 מחק</button>' : '')
        // אישור-קבלה ללקוח — הלקוח רואה בזמן-אמת שההודעה התקבלה (מסכו נשאר פתוח וממתין)
        + ((st==='approved'||st==='correction') && !(r.shopAck&&r.shopAck.at)
            ? '<button class="ackBtn primary" data-v="'+r.versionId+'">📩 אשר קבלה ללקוח</button>' : '')
        + '</div>'
        + ((r.shopAck&&r.shopAck.at) ? '<div class="muted" style="font-size:.8rem">📩 נשלח אישור-קבלה ללקוח · '+_fmt(r.shopAck.at)+(r.shopAck.by?(' — '+_esc(r.shopAck.by)):'')+(r.shopAck.note?(' · "'+_esc(r.shopAck.note)+'"'):'')+'</div>' : '')
        + '</div>';
    }).join('');
    Array.from(document.getElementsByClassName('cpBtn')).forEach(b=>b.onclick=()=>{ navigator.clipboard&&navigator.clipboard.writeText(decodeURIComponent(b.dataset.l)); b.textContent='✓ הועתק'; });
    Array.from(document.getElementsByClassName('waBtn')).forEach(b=>b.onclick=()=>{ const link=decodeURIComponent(b.dataset.l), jl=decodeURIComponent(b.dataset.j);
      window.open('https://wa.me/?text='+encodeURIComponent('שלום,\nמצורף קישור לאישור החוברת "'+jl+'" לפני הדפסה:\n'+link),'_blank'); });
    // ⚠️ ביטול עובר דרך revokeProofLink (Function) — לא PATCH ישיר מהדפדפן.
    // כתיבה ישירה הייתה מסמנת revoked=true בלי לנתק סשן-לקוח פעיל (revoke-
    // RefreshTokens+revocations/<uid>) — הלקוח היה ממשיך לגשת עד שהאסימון
    // פג מעצמו (עד שעה). ראה functions/index.js: revokeProofLink.
    Array.from(document.getElementsByClassName('rvBtn')).forEach(b=>b.onclick=async()=>{ if(!confirm('לבטל את הקישור? הלקוח לא יוכל עוד לצפות או לאשר.')) return;
      try{ await _callStaffFn('revokeProofLink', { versionId:b.dataset.v }); await load(); }catch(e){ alert('ביטול נכשל: '+(e.message||e)); } });
    // ארכיון — רשומת-האישור נשמרת (תיעוד), רק יוצאת מהרשימה הפעילה
    Array.from(document.getElementsByClassName('arcBtn')).forEach(b=>b.onclick=async()=>{
      try{ await _dbPatch('customerFoldVersions/'+b.dataset.v, { archived:true, archivedAt:_nowIso() }); await load(); }catch(e){ alert('העברה לארכיון נכשלה: '+(e.message||e)); } });
    Array.from(document.getElementsByClassName('unArcBtn')).forEach(b=>b.onclick=async()=>{
      try{ await _dbPatch('customerFoldVersions/'+b.dataset.v, { archived:false, archivedAt:null }); await load(); }catch(e){ alert('החזרה מארכיון נכשלה: '+(e.message||e)); } });
    // אישור-קבלה ללקוח: "ראיתי/קיבלתי" + הערה אופציונלית (למשל מה מתקנים) → מוצג אצל הלקוח מיד
    Array.from(document.getElementsByClassName('ackBtn')).forEach(b=>b.onclick=async()=>{
      const note=prompt('הודעה ללקוח (אופציונלי) — למשל: "התקבל, נכנס לדפוס" או "מתקנים את עמ׳ 7":','');
      if(note===null) return;   // ביטול
      try{ await _dbPatch('customerFoldVersions/'+b.dataset.v, { shopAck:{ at:_nowIso(), by:'בית-הדפוס', note:(note||'').trim()||null } }); await load(); }
      catch(e){ alert('שליחת אישור-הקבלה נכשלה: '+(e.message||e)); } });
    // מחיקה מלאה — בלתי-הפיכה; דורשת אישור מפורש (רשומת-האישור של הלקוח תימחק)
    Array.from(document.getElementsByClassName('delBtn')).forEach(b=>b.onclick=async()=>{
      const jn=decodeURIComponent(b.dataset.j||'');
      if(!confirm('למחוק לצמיתות את רשומת האישור'+(jn?(' של "'+jn+'"'):'')+'?\n\nזו פעולה בלתי-הפיכה — תיעוד האישור של הלקוח יימחק.\nאם רק רוצים לנקות את הרשימה — עדיף "העבר לארכיון".')) return;
      try{ await _dbPut('customerFoldVersions/'+b.dataset.v, null); await load(); }catch(e){ alert('מחיקה נכשלה: '+(e.message||e)); } });
  }
  Array.from(document.getElementsByClassName('fBtn')).forEach(b=>b.onclick=()=>{ _filter=b.dataset.f; render(); });
  $('aSearch').oninput=render; $('aRefresh').onclick=load;
  await load();
}

/* ═══════════════ boot ═══════════════ */
(function boot(){
  const v=qs.get('v'), t=qs.get('t');
  // ⚠️ v בלבד (בלי t) קורה בכל רענון-דף רגיל אחרי שהזהות כבר אומתה: t מוסר
  // מהכתובת ע"י ProofContext מיד עם ההצלחה (history.replaceState). בלי השורה
  // הזו, F5 היה נופל למסך "הכלי במצב Beta סגור" במקום לשחזר את הסשן.
  // ⚠️ אבל v חייב להיות **בפורמט proof-versionId** (v_ + 32 הקסה) לפני
  // כניסה למצב-לקוח: krtis-avoda טוען את מסך-האישורים ב-iframe עם
  // ‎?approvals=1&v=<APP_VERSION>‎ (מפצח-מטמון, מספר) — ובלי הסינון הזה
  // הוא היה נכנס ל-clientScreen עם מספר-גרסה כ-versionId ונכשל ב-
  // "הקישור אינו תקין". הסינון מחזיר את מסך-האישורים ושומר על שחזור-F5
  // (versionId אמיתי תואם ל-regex). ראה proof-link.js: VERSION_ID_RE.
  if(v && /^v_[0-9a-f]{32}$/.test(v)){ clientScreen(v, t||''); return; }   // מצב-לקוח (כניסה חדשה או רענון-סשן-משוחזר)
  if(qs.get('approvals')==='1'){ approvalsScreen(); return; }   // מסך-מנהל: מערכת אישור לקוחות
  // מצב-עובד: מאחורי הדגל solanCustomerFoldPreviewBeta (או ?cfp=1)
  if(ADP.customerFoldPreviewEnabled(window) || qs.get('cfp')==='1'){ workerScreen(); }
  else { $('app').innerHTML='<div class="card"><h2>הצגת פרופר מקופל ללקוח</h2><div class="muted">הכלי במצב Beta סגור. הפעל את הדגל <code>solanCustomerFoldPreviewBeta</code> או פתח עם <code>?cfp=1</code>.</div></div>'; }
})();
</script>
