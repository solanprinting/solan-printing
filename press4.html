<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מסך ארבעה צבעים — סולן הדפסות</title>
<!-- ═══════════════════════════════════════════════════════════════════════
     press4.html — מסך מפעיל ארבעת הצבעים.

     ⚠️ המסך הזה אינו קורא RTDB ואינו קורא Storage. אין בו firebase-database
     ואין בו firebasestorage. כל מה שהוא רואה ועושה עובר בשלוש Functions
     ובנקודת-קצה אחת לפרופר, שרצות ב-Admin SDK ואוכפות את ההרשאה בעצמן.
     חוקי B+4 דוחים את press4 מכל נתיב — וזה מכוון.

     ⚠️ הדפדפן שולח jobKey בלבד. הוא אינו מרכיב נתיב, אינו שולח cardId,
     runIdx, qid, שם-מכונה או orgId, ואינו מחזיק כתובת-הורדה. הפרופר
     נמשך עם Authorization ונפתח כ-blob: מקומי.

     ⚠️ זהו מסך **מכונה משותפת**, לא חשבון של אדם: אין מייל, אין סיסמה
     ואין email_verified. חשבון-מייל למכונה משותפת פירושו סיסמה שעוברת
     בין מפעילים ונשארת אצל מי שעזב.

     ⚠️ מה מגן על ה-endpoint: לא App Check — reCAPTCHA נטען מ-google.com
     ורשת כשרה חוסמת אותו, כלומר המסך היה מת. במקומו **סוד-מכשיר**
     ארוך שנרשם פעם אחת ע"י מנהל ב-press4-enroll.html ויושב כאן
     ב-localStorage. הוא נשלח בכל כניסה יחד עם ה-PIN, ואינו מוצג
     לעובד ואינו נרשם ללוג. PIN בן שש ספרות לבדו לא היה עומד מול
     ניחוש מהאינטרנט.

     ⚠️ המכונה אינה נבחרת במסך — היא נגזרת בשרת מהגדרת הארגון.

     ⚠️ data-mode="enforce". משתמש לא-מחובר **אינו** מנותב ל-login.html
     (אין שם מה להזין) — הוא נשאר כאן ורואה את מסך ה-PIN.

     ⚠️ אין כאן ניווט: לא לכרטיסים, לא ליומן, לא למשרד, לא לפורטלים,
     לא למלאי, לא להצעות ולא לאימפוזיציה. אין מה להסתיר כי אין מה
     להציג — וזו ההגנה, לא הסתרת כפתורים.
     ═══════════════════════════════════════════════════════════════════════ -->
<script src="firebase-auth.bundle.js?v=1785664582"></script>
<script src="auth-client.js?v=1785664582"></script>
<script src="auth-guard.js?v=1785664582" data-page="press4.html" data-mode="enforce"></script>
<style>
  /* ⚠️ שפת-העיצוב כאן אינה חדשה — היא של לשונית "רשימת עבודות" בכרטיסי
     העבודה: אותו נייר מסורגל #e8e4dc, אותה כותרת כחול-כהה #1a1a4e, אותם
     כרטיסי-מכונה מסגרת-מקווקוות עם פס-צבע #dbeafe למכונת ארבעת הצבעים,
     ואותם תגי-סטטוס. ההבדל היחיד הוא הגודל: המסך הזה עומד על 1920×1080
     במצב קיוסק ונקרא ממטר-שניים, ולכן הכול גדול יותר ומבוסס-מגע.
     ⚠️ העתקנו **עיצוב בלבד**. שום לוגיקת-כתיבה מהמסך הישן לא הועתקה. */
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:'Heebo',system-ui,"Segoe UI",Arial,sans-serif;
       color:#1a1a2e;background:#e8e4dc;
       background-image:repeating-linear-gradient(0deg,transparent,transparent 28px,
                        rgba(0,0,0,.04) 28px,rgba(0,0,0,.04) 29px);
       /* ⚠️ אף פעם לא גלילה אופקית — במסך קיוסק אין סרגל להחזיר אותה. */
       overflow-x:hidden}
  .wrap{max-width:1780px;margin:0 auto;padding:0 20px 28px}

  /* ── כותרת ─────────────────────────────────────────────────────── */
  .top{background:#1a1a4e;color:#fff;display:flex;align-items:center;gap:15px;
       padding:14px 26px;margin:0 -20px 16px;box-shadow:0 3px 14px rgba(0,0,0,.2)}
  .logo{width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,.13);
        display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0}
  h1{font-size:1.5rem;margin:0;font-weight:900}
  .top .sub{font-size:.95rem;color:rgba(255,255,255,.72);font-weight:600}
  .out{margin-inline-start:auto;background:rgba(255,255,255,.12);border:0;color:#fff;
       font-family:inherit;font-size:1rem;font-weight:800;cursor:pointer;
       border-radius:10px;padding:12px 22px}
  .out:hover{background:rgba(255,255,255,.22)}

  /* ── פס-מצב ────────────────────────────────────────────────────── */
  .bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;
       background:#1a1a4e;color:#fff;border-radius:10px;padding:10px 18px}
  .dot{width:12px;height:12px;border-radius:50%;background:#9ca3af;flex-shrink:0}
  .dot.on{background:#4ade80}
  .bar .sub{font-size:1rem;font-weight:700;color:rgba(255,255,255,.85)}
  .refresh{background:rgba(255,255,255,.14);border:0;border-radius:10px;padding:11px 22px;
           font-family:inherit;font-size:1rem;font-weight:800;color:#fff;cursor:pointer}
  .refresh:hover{background:rgba(255,255,255,.24)}
  .refresh:disabled{opacity:.45;cursor:default}

  /* ── כרטיס עבודה — מבנה כרטיסי-המכונה של רשימת העבודות ─────────── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(540px,1fr));
        gap:16px;align-items:start}
  .job{background:#fff;border:2px dashed #cbd5e1;border-radius:13px;overflow:hidden;
       box-shadow:0 3px 12px rgba(26,26,78,.07)}
  .job.run {border-style:solid;border-color:#1a1a4e;box-shadow:0 5px 20px rgba(26,26,78,.18)}
  .job.done{border-style:solid;border-color:#16a34a;opacity:.72}
  /* פס-הצבע של מכונת ארבעת הצבעים — אותו #dbeafe כמו ברשימת העבודות */
  .jt{background:#dbeafe;padding:13px 18px;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
  .job.run  .jt{background:#1a1a4e;color:#fff}
  .job.done .jt{background:#dcfce7}
  .jt b{font-size:1.3rem;font-weight:900;min-width:0;overflow-wrap:anywhere}
  .tag{font-size:.85rem;font-weight:800;padding:5px 13px;border-radius:999px;
       white-space:nowrap;flex-shrink:0}
  .tag.wait{background:rgba(26,26,78,.1);color:#1a1a4e}
  .tag.run {background:#f0c040;color:#1a1a2e}
  .tag.done{background:#16a34a;color:#fff}
  .jb{padding:15px 18px}
  .spec{display:flex;flex-wrap:wrap;gap:7px}
  .spec span{font-size:.95rem;color:#475569;background:#f1f5f9;border:1px solid #e5e7eb;
             border-radius:7px;padding:5px 11px;white-space:nowrap}
  .spec span b{color:#1a1a2e;font-weight:800}
  .spec span.run-label{background:#ede9fe;border-color:#ddd6fe;color:#5b21b6;font-weight:800}
  /* ⚠️ כפתורי-מגע: 62px גובה ורוחב-מינימום, כדי שאפשר יהיה ללחוץ עם
     כפפות ובלי לכוון. הם תמיד גלויים — אין גלילה בתוך הכרטיס. */
  .acts{display:flex;gap:11px;margin-top:14px;flex-wrap:wrap}
  .btn{border:0;border-radius:11px;padding:0 26px;min-height:62px;min-width:180px;flex:1 1 auto;
       font-family:inherit;font-size:1.1rem;font-weight:800;cursor:pointer;
       background:#1a1a4e;color:#fff}
  .btn.sec{background:#fff;color:#1a1a4e;border:2px solid #1a1a4e}
  .btn.done{background:#16a34a}
  .btn:disabled{opacity:.45;cursor:default}
  /* grid-column: אחרת ההודעה תופסת עמודה אחת ונראית כמו עבודה */
  .empty{grid-column:1/-1;text-align:center;color:#8a8578;padding:64px 16px;font-size:1.2rem;
         font-weight:700;background:#fff;border:2px dashed #cbd5e1;border-radius:13px}

  /* ── מסכי-ביניים ───────────────────────────────────────────────── */
  .card{background:#fff;border-radius:15px;padding:24px;box-shadow:0 6px 22px rgba(26,26,78,.1)}
  .card .sub{font-size:.95rem;color:#6b7280}
  .gate{text-align:center;padding:60px 20px;color:#6b7280;font-size:1.1rem;max-width:520px;margin:0 auto}
  .msg{margin-top:14px;font-size:1.05rem;font-weight:800;border-radius:10px;padding:13px 16px}
  .msg.err{background:#fef2f2;border:2px solid #fecaca;color:#b91c1c}
  .msg.ok{background:#ecfdf5;border:2px solid #a7f3d0;color:#15803d}
  .pin{width:100%;padding:16px;border:2px solid #cbd5e1;border-radius:11px;background:#fbfcfe;
       font-family:inherit;font-size:1.8rem;font-weight:800;letter-spacing:.5em;text-align:center}
  .pin:focus{outline:none;border-color:#1a1a4e;background:#fff}
  .hidden{display:none}
  @media (max-width:900px){
    .grid{grid-template-columns:1fr}
    .btn{min-width:100%}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">🖨️</div>
    <div>
      <h1>מסך ארבעה צבעים</h1>
      <div class="sub" id="who"></div>
    </div>
    <button class="out hidden" id="out">יציאה</button>
  </div>

  <div id="gate" class="card gate">טוען…</div>

  <!-- ⚠️ מחשב שאינו רשום: לא מציגים שדה קוד שאינו יכול לעבוד.

       ⚠️ הכפתור כאן הוא **הכניסה היחידה** למסך המנהל, והוא קיים רק כל עוד
       המחשב אינו רשום. אחרי הרישום הוא נעלם ואין מהמסך הזה שום קישור
       למסך ניהול. הסיבה שהוא נחוץ: מצב קיוסק פותח פרופיל-דפדפן נפרד עם
       localStorage משלו, ולכן רישום שבוצע בדפדפן הרגיל פשוט אינו קיים שם. -->
  <div id="noDev" class="card hidden" style="max-width:560px;margin:40px auto;text-align:center">
    <div style="font-size:3rem;margin-bottom:10px">🖥️</div>
    <div style="font-weight:900;color:#1a1a4e;font-size:1.35rem;margin-bottom:10px">
      מחשב זה עדיין לא נרשם
    </div>
    <div class="sub" style="line-height:1.9;font-size:1.05rem">
      מחשב זה עדיין לא נרשם כמכונת ארבעה צבעים.<br>
      ההגדרה נעשית פעם אחת בלבד, ע"י מנהל.
    </div>
    <!-- ⚠️ ניווט באותו חלון. window.open היה נחסם בקיוסק, והחלון החדש
         היה מקבל פרופיל אחר — כלומר רישום שנשמר במקום הלא-נכון. -->
    <button class="btn" id="setupBtn" style="width:100%;margin-top:20px">
      הגדרה ראשונית — מנהל בלבד
    </button>
  </div>

  <!-- ⚠️ מסך ה-PIN. אין כאן שדה מייל ואין שדה סיסמה — במכוון. -->
  <div id="pinCard" class="card hidden" style="max-width:440px;margin:40px auto;text-align:center">
    <div style="font-size:3rem;margin-bottom:8px">🔒</div>
    <div style="font-weight:900;color:#1a1a4e;font-size:1.35rem;margin-bottom:18px">
      קוד כניסה למכונה
    </div>
    <input id="pin" class="pin" type="password" inputmode="numeric" autocomplete="off"
           maxlength="6" placeholder="••••••" dir="ltr">
    <button class="btn" id="pinBtn" style="width:100%;margin-top:14px">כניסה</button>
    <div id="pinMsg" class="msg hidden"></div>
  </div>

  <div id="app" class="hidden">
    <div class="bar">
      <span class="dot" id="dot"></span>
      <span class="sub" id="stamp">—</span>
      <button class="refresh" id="refresh" style="margin-inline-start:auto">↻ רענן</button>
    </div>
    <div id="msg" class="msg hidden"></div>
    <div id="jobs" class="grid" style="margin-top:14px">
      <div class="empty">אין כרגע עבודות בתור.</div>
    </div>
  </div>
</div>

<script>
var FB_CONFIG = {
  apiKey: 'AIzaSyAFp99furP4L5hqTI-horBHmGZC9s13dGg',
  authDomain: 'solan-printing.firebaseapp.com',
  projectId: 'solan-printing',
  databaseURL: 'https://solan-printing-default-rtdb.europe-west1.firebasedatabase.app',
};
var FN = 'https://europe-west1-solan-printing.cloudfunctions.net';
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' })[c]; }); };

var _BAKED = '1785664582';
AuthClient.guardVersion(_BAKED).then(function(reloading){ if (!reloading) boot(); });

/* ⚠️ אותם מפתחות בדיוק כמו ב-press4-enroll.html. */
var LS_ID = 'solanPress4DeviceId', LS_SECRET = 'solanPress4DeviceSecret';
function deviceCreds(){
  try {
    var id = localStorage.getItem(LS_ID), sec = localStorage.getItem(LS_SECRET);
    return (id && sec) ? { deviceId: id, deviceSecret: sec } : null;
  } catch (e) { return null; }
}

var _busy = false, _timer = null;

/* ⚠️ שגיאת-הכניסה אחידה בכוונה — היא מגיעה מהשרת ואינה מבדילה בין קוד
   שגוי, מכונה חסרה, מושבתת או נעולה. הודעה מבדילה היא כלי-מיפוי. */
function pinMsg(text){
  var el = $('pinMsg');
  el.className = 'msg err'; el.textContent = text; el.classList.remove('hidden');
}

/* ⚠️ אין כאן קישור למסכי המשרד ואין אפשרות לרשום מכשיר מתוך מסך העובד:
   הרישום נעשה רק ב-press4-enroll.html, ורק ע"י מנהל מאומת. */
function showUnenrolled(){
  $('gate').classList.add('hidden');
  $('app').classList.add('hidden');
  $('pinCard').classList.add('hidden');
  $('noDev').classList.remove('hidden');
}

async function doPinLogin(){
  if (_busy) return;
  var code = String($('pin').value || '').trim();
  if (!/^[0-9]{6}$/.test(code)) { pinMsg('יש להזין קוד בן 6 ספרות.'); return; }
  /* ⚠️ בלי רישום אין מה לשלוח — ולא מציגים PIN שלא יכול לעבוד. */
  var dev = deviceCreds();
  if (!dev) { showUnenrolled(); return; }
  _busy = true; $('pinBtn').disabled = true; $('pin').disabled = true;
  var old = $('pinBtn').textContent; $('pinBtn').textContent = 'רגע…';
  try {
    var r = await fetch(FN + '/press4MachineLogin', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      /* ⚠️ שלושה ערכים בלבד. orgId, machineId ו-role נגזרים בשרת. */
      body: JSON.stringify({ data: { deviceId: dev.deviceId,
                                     deviceSecret: dev.deviceSecret, pin: code } })
    });
    var j = null; try { j = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error((j && j.error && j.error.message) || 'קוד שגוי או שהמכונה אינה פעילה');
    var tok = j && j.result && j.result.token;
    if (!tok) throw new Error('קוד שגוי או שהמכונה אינה פעילה');
    $('pin').value = '';                       /* ⚠️ הקוד לא נשאר בשדה */
    await SolanAuth.signInWithCustomToken(tok);
    /* onAuthStateChanged יטפל בשאר — לא מרעננים את הדף. */
  } catch (e) {
    pinMsg(e.message || 'הכניסה נכשלה');
    $('pin').value = '';
  }
  $('pinBtn').textContent = old;
  $('pinBtn').disabled = false; $('pin').disabled = false;
  _busy = false;
}

function msg(kind, text){
  var el = $('msg');
  el.className = 'msg ' + kind;
  el.textContent = text;
  el.classList.remove('hidden');
}
function clearMsg(){ $('msg').classList.add('hidden'); }

/* ⚠️ כל קריאה ל-Function עוברת כאן. כשל **תמיד** נראה: אין מסלול שבו
   בקשה נופלת והמסך ממשיך כאילו כלום. זו תבנית הכשל-השקט שכבר עלתה
   לנו כמה פעמים. */
async function callFn(name, data){
  var tok = await SolanAuth.idToken(false);
  var r = await fetch(FN + '/' + name, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok },
    body: JSON.stringify({ data: data || {} })
  });
  var j = null;
  try { j = await r.json(); } catch (e) {}
  if (!r.ok) {
    var code = (j && j.error && (j.error.message || j.error.status)) || ('HTTP ' + r.status);
    throw new Error(errText(code));
  }
  return (j && j.result) || {};
}

/* קודי-השרת → עברית. קוד לא מוכר מוצג כפי שהוא ולא נבלע. */
function errText(code){
  var c = String(code || '');
  if (/press_machine_not_configured/.test(c)) return 'מכונת ארבעת הצבעים לא הוגדרה. פנו למנהל.';
  if (/press_machine_disabled/.test(c))       return 'מסך המכונה מושבת כרגע. פנו למנהל.';
  if (/press_job_not_found/.test(c))          return 'העבודה כבר אינה בתור. רעננו.';
  if (/press_job_ambiguous/.test(c))          return 'נמצאו שתי רשומות זהות לעבודה — פנו למנהל.';
  if (/press_job_already_completed/.test(c))  return 'העבודה כבר סומנה כהושלמה.';
  if (/press_job_not_started/.test(c))        return 'העבודה עדיין לא התחילה.';
  if (/press_proof_not_found/.test(c))        return 'אין פרופר לעבודה הזו.';
  if (/cross_org|press_/.test(c))             return 'אין הרשאה לפעולה הזו.';
  if (/החשבון אינו פעיל|הסשן בוטל/.test(c))   return c;
  return 'הפעולה נכשלה (' + c + ').';
}

/* ⚠️ שלושה מצבים חזותיים, ולא רק שניים: ממתינה (מסגרת מקווקוות, פס
   #dbeafe), בהדפסה (מסגרת מלאה כחול-כהה, פס כחול-כהה עם תג זהב) והושלמה
   (מסגרת ירוקה, פס ירוק, עמעום). המצב נגזר מ-state שהשרת החזיר בלבד. */
function jobHtml(j){
  var state = j.state === 'started' ? 'run' : j.state === 'completed' ? 'done' : 'wait';
  var label = { run: '🖨️ בהדפסה', done: '✓ הושלמה', wait: 'ממתינה' }[state];

  /* ⚠️ אך ורק מה שהשרת כבר שולח. אין מחיר, אין עלות, אין הערות פנימיות
     ואין נתיב Storage — לא כאן ולא במקום אחר במסך. */
  var spec = [];
  if (j.runLabel) spec.push('<span class="run-label">' + esc(j.runLabel) + '</span>');
  if (j.customer) spec.push('<span>לקוח: <b>' + esc(j.customer) + '</b></span>');
  if (j.copies)   spec.push('<span>🖨️ כמות: <b>' + Number(j.copies).toLocaleString('he-IL') + '</b></span>');
  if (j.size)     spec.push('<span>גודל: <b>' + esc(j.size) + '</b></span>');
  if (j.paper)    spec.push('<span>📄 נייר: <b>' + esc(j.paper) + '</b></span>');
  if (j.color)    spec.push('<span>צבע: <b>' + esc(j.color) + '</b></span>');
  if (j.pages)    spec.push('<span>עמודים: <b>' + esc(j.pages) + '</b></span>');

  var acts = [];
  if (j.hasProof) acts.push('<button class="btn sec" data-act="proof" data-key="' + esc(j.jobKey) + '">📄 פתח פרופר</button>');
  if (state === 'wait') acts.push('<button class="btn" data-act="start" data-key="' + esc(j.jobKey) + '">▶ התחל עבודה</button>');
  else if (state === 'run') acts.push('<button class="btn done" data-act="finish" data-key="' + esc(j.jobKey) + '">✓ סיום עבודה</button>');

  return '<div class="job ' + state + '" data-key="' + esc(j.jobKey) + '">' +
    '<div class="jt"><b>' + esc(j.name || 'עבודה') + '</b>' +
    '<span class="tag ' + state + '">' + label + '</span></div>' +
    '<div class="jb"><div class="spec">' + spec.join('') + '</div>' +
    (acts.length ? '<div class="acts">' + acts.join('') + '</div>' : '') +
    '</div></div>';
}

/* ⚠️ התור מוחזק כאובייקטים ולא כ-HTML, כדי שאפשר יהיה לצייר מחדש בלי
   עוד קריאת-שרת. הוא **תמיד** מה שהשרת החזיר — אין כאן מקור-אמת מקומי. */
var _jobs = [];
function paint(){
  $('jobs').innerHTML = _jobs.length ? _jobs.map(jobHtml).join('')
                                     : '<div class="empty">אין כרגע עבודות בתור.</div>';
}

async function load(silent){
  if (!silent) { $('refresh').disabled = true; clearMsg(); }
  try {
    var res = await callFn('getPress4Queue');
    _jobs = res.jobs || [];
    paint();
    $('dot').classList.add('on');
    $('stamp').textContent = _jobs.length + ' עבודות · עודכן ' + new Date().toLocaleTimeString('he-IL');
  } catch (e) {
    $('dot').classList.remove('on');
    msg('err', e.message || 'טעינת התור נכשלה');
  }
  $('refresh').disabled = false;
}

/* ⚠️ נעילה גלובלית לזמן בקשה: לחיצה כפולה על "התחל" הייתה שולחת שתי
   בקשות. השרת ממילא אינו דורס, אבל אין סיבה לשלוח. */
async function act(kind, jobKey, btn){
  if (_busy) return;
  _busy = true;
  var all = document.querySelectorAll('.job button');
  for (var i = 0; i < all.length; i++) all[i].disabled = true;
  var old = btn.textContent; btn.textContent = 'רגע…';
  clearMsg();
  try {
    if (kind === 'proof') await openProof(jobKey);
    else {
      var r = await callFn(kind === 'start' ? 'startPress4Job' : 'finishPress4Job', { jobKey: jobKey });
      msg('ok', kind === 'start'
        ? (r.already ? 'העבודה כבר בהדפסה.' : '▶ העבודה סומנה כמתחילה.')
        : (r.already ? 'העבודה כבר סומנה כהושלמה.' : '✓ העבודה הושלמה.'));
      if (kind === 'finish') {
        /* ⚠️ התור מסנן עבודות שהושלמו, ולכן רענון מיידי היה מעלים את
           הכרטיס לפני שהמפעיל ראה שהפעולה נקלטה. מציגים אותו ירוק
           לכמה שניות — סימון מקומי-חזותי בלבד, המצב מגיע מהשרת. */
        _jobs.forEach(function(x){ if (x.jobKey === jobKey) x.state = r.state || 'completed'; });
        paint();
        setTimeout(function(){ if (!_busy) load(true); }, 6000);
      } else {
        await load(true);
      }
    }
  } catch (e) {
    msg('err', e.message || 'הפעולה נכשלה');
  }
  btn.textContent = old;
  _busy = false;
  var again = document.querySelectorAll('.job button');
  for (var k = 0; k < again.length; k++) again[k].disabled = false;
}

/* ⚠️ הפרופר נמשך בבקשה מאומתת ונפתח כ-blob: מקומי. אין token= בכתובת,
   אין Signed URL, ואין נתיב Storage שעובר בדפדפן.

   ⚠️ החלון נפתח **סינכרונית**, לפני ה-await הראשון. window.open אחרי
   await של טוקן + fetch + blob מאבד את "מחוות המשתמש" ונחסם ע"י חוסם
   החלונות הקופצים — המפעיל היה לוחץ ולא קורה כלום. אם הפתיחה נחסמה
   כבר עכשיו, אומרים זאת במפורש במקום להמשיך ולהיכשל בשקט. */
async function openProof(jobKey){
  var viewer = window.open('', '_blank');
  if (!viewer) throw new Error('הדפדפן חסם את פתיחת החלון. אפשרו חלונות קופצים לאתר ונסו שוב.');
  try {
    var tok = await SolanAuth.idToken(false);
    var r = await fetch(FN + '/press4Proof?jobKey=' + encodeURIComponent(jobKey),
                        { headers: { 'Authorization': 'Bearer ' + tok } });
    if (!r.ok) {
      var j = null; try { j = await r.json(); } catch (e) {}
      throw new Error(errText((j && j.error) || ('HTTP ' + r.status)));
    }
    var url = URL.createObjectURL(await r.blob());
    viewer.location = url;
    /* ⚠️ ה-revoke מאוחר בכוונה: ביטול מוקדם מדי מבטל את הטעינה עצמה. */
    setTimeout(function(){ try { URL.revokeObjectURL(url); } catch (e) {} }, 120000);
  } catch (e) {
    try { viewer.close(); } catch (e2) {}
    throw e;
  }
}

function boot(){
/* ⚠️ persistence='session': ההתחברות שורדת רענון ומשמרת, ונמחקת כשסוגרים
   את הסשן. מכונה משותפת לא נשארת מחוברת לנצח. */
SolanAuth.init(FB_CONFIG, 'session');
SolanAuth.onAuthStateChanged(async function(user){
  /* ⚠️ אין ניתוב ל-login.html: אין למכונה מייל וסיסמה. */
  if (!user) {
    $('gate').classList.add('hidden');
    $('app').classList.add('hidden');
    if (!deviceCreds()) { showUnenrolled(); return; }
    $('pinCard').classList.remove('hidden');
    $('pin').focus();
    return;
  }
  var claims = await SolanAuth.claims(false).catch(function(){ return {}; });

  /* ⚠️ הבדיקה כאן היא נוחות בלבד. הגבול האמיתי הוא ה-Functions, שדוחות
     כל תפקיד אחר — וחוקי B+4, שדוחים את press4 מכל נתיב ישיר. */
  if (!AuthClient.mayOpen(claims, 'press4.html')) {
    var to = AuthClient.routeFor(claims, null).to;
    if (to) location.replace(to);
    else $('gate').textContent = 'החשבון אינו מורשה למסך הזה. פנו למנהל.';
    return;
  }

  $('pinCard').classList.add('hidden');
  $('who').textContent = claims.accountType === 'machine'
    ? 'מכונת ארבעה צבעים' : ((user.email || '') + ' · מנהל (בדיקה)');
  $('out').classList.remove('hidden');
  $('gate').classList.add('hidden');
  $('app').classList.remove('hidden');

  $('refresh').addEventListener('click', function(){ load(false); });
  $('jobs').addEventListener('click', function(ev){
    var b = ev.target.closest ? ev.target.closest('button[data-act]') : null;
    if (b) act(b.dataset.act, b.dataset.key, b);
  });

  await load(false);
  /* רענון מתון — כל 45 שניות, ורק כשהלשונית גלויה ואין פעולה פתוחה. */
  _timer = setInterval(function(){
    if (!_busy && document.visibilityState === 'visible') load(true);
  }, 45000);
});

/* ⚠️ יציאה מחזירה למסך ה-PIN, לא ל-login.html. */
$('out').addEventListener('click', async function(){
  if (_timer) clearInterval(_timer);
  await SolanAuth.signOut().catch(function(){});
  location.reload();
});
/* ⚠️ ניווט באותו חלון ובאותו פרופיל-דפדפן. רישום שנעשה בחלון אחר —
   או בדפדפן הרגיל במקום בקיוסק — נשמר ב-localStorage אחר, כלומר לא
   קיים כאן. ה-return מחזיר את המנהל לכאן בסיום ההגדרה. */
$('setupBtn').addEventListener('click', function(){
  location.href = 'press4-enroll.html?return=press4.html';
});
$('pinBtn').addEventListener('click', doPinLogin);
$('pin').addEventListener('keydown', function(ev){ if (ev.key === 'Enter') doPinLogin(); });
}   /* boot() */
</script>
