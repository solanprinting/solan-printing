<!-- ═══════════════════════════════════════════════════════════════════════
     press4.html — מסך מפעיל ארבעת הצבעים.

     ⚠️ המסך הזה אינו קורא RTDB ואינו קורא Storage. אין בו firebase-database
     ואין בו firebasestorage. כל מה שהוא רואה ועושה עובר בשלוש Functions
     ובנקודת-קצה אחת לפרופר, שרצות ב-Admin SDK ואוכפות את ההרשאה בעצמן.
     חוקי B+4 דוחים את press4 מכל נתיב — וזה מכוון.

     ⚠️ הדפדפן שולח jobKey בלבד. הוא אינו מרכיב נתיב, אינו שולח cardId,
     runIdx, qid, שם-מכונה או orgId, ואינו מחזיק כתובת-הורדה. הפרופר
     נמשך עם Authorization ונפתח כ-blob: מקומי.

     ⚠️ זהו מסך **מכונה משותפת**, לא חשבון של אדם: אין מייל, אין סיסמה
     ואין email_verified. חשבון-מייל למכונה משותפת פירושו סיסמה שעוברת
     בין מפעילים ונשארת אצל מי שעזב.

     ⚠️ מה מגן על ה-endpoint: לא App Check — reCAPTCHA נטען מ-google.com
     ורשת כשרה חוסמת אותו, כלומר המסך היה מת. במקומו **סוד-מכשיר**
     ארוך שנרשם פעם אחת ע"י מנהל ב-press4-enroll.html ויושב כאן
     ב-localStorage. הוא נשלח בכל כניסה יחד עם ה-PIN, ואינו מוצג
     לעובד ואינו נרשם ללוג. PIN בן שש ספרות לבדו לא היה עומד מול
     ניחוש מהאינטרנט.

     ⚠️ המכונה אינה נבחרת במסך — היא נגזרת בשרת מהגדרת הארגון.

     ⚠️ data-mode="enforce". משתמש לא-מחובר **אינו** מנותב ל-login.html
     (אין שם מה להזין) — הוא נשאר כאן ורואה את מסך ה-PIN.

     ⚠️ אין כאן ניווט: לא לכרטיסים, לא ליומן, לא למשרד, לא לפורטלים,
     לא למלאי, לא להצעות ולא לאימפוזיציה. אין מה להסתיר כי אין מה
     להציג — וזו ההגנה, לא הסתרת כפתורים.
     ═══════════════════════════════════════════════════════════════════════ -->

  .now-name{font-size:1.5rem;font-weight:900;color:#1e293b;line-height:1.2}

/* ⚠️ אין כאן קישור למסכי המשרד ואין אפשרות לרשום מכשיר מתוך מסך העובד:
   הרישום נעשה רק ב-press4-enroll.html, ורק ע"י מנהל מאומת. */
function showUnenrolled(){
  $('gate').classList.add('hidden');
  $('app').classList.add('hidden');
  $('pinCard').classList.add('hidden');
  $('noDev').classList.remove('hidden');
  storageDiag();
}

/* ⚠️ "המחשב נרשם, ואחרי כיבוי-והדלקה שוב מבקש רישום" הוא כמעט תמיד
   הדפדפן ולא הקוד: אף שורה כאן אינה מוחקת את פרטי-המכשיר מלבד ביטול
   מפורש. שתי סיבות אפשריות — הגדרה של "נקה נתוני גלישה בסגירה", או
   פינוי-אחסון של הדפדפן. את השנייה אפשר למנוע; את הראשונה רק לזהות.
   לכן מוצג כאן אבחון, כדי שלא ננחש בפעם הבאה. */
function storageDiag(){
  var el = $('diag');
  if (!el) return;
  var canWrite = false;
  try { localStorage.setItem('_p4t', '1'); canWrite = localStorage.getItem('_p4t') === '1';
        localStorage.removeItem('_p4t'); } catch (e) {}
  if (!canWrite) {
    el.textContent = '⚠️ הדפדפן אינו מאפשר שמירה מקומית (חלון פרטי / חסימת אחסון). ' +
                     'רישום בחלון כזה יימחק בסגירה.';
    el.style.display = '';
    return;
  }
  if (navigator.storage && navigator.storage.persisted) {
    navigator.storage.persisted().then(function(p){
      if (p) return;
      el.textContent = 'ℹ️ אם הרישום נמחק אחרי כיבוי המחשב — בדקו בהגדרות הדפדפן ' +
                       'שאין "נקה נתוני גלישה בסגירה" לאתר הזה.';
      el.style.display = '';
    }).catch(function(){});
  }
}

/* ⚠️ מבקש מהדפדפן לא לפנות את האחסון של האתר. אינו עוזר מול "נקה בסגירה"
   — זו החלטה מפורשת של המשתמש — אבל כן מונע פינוי-אוטומטי, שהוא ההסבר
   השני לרישום שנעלם. נקרא בכל טעינה, כי התשובה משתנה עם הרשאות. */
function askPersist(){
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); }
  catch (e) {}
}

async function doPinLogin(){
  if (_busy) return;
  var code = String($('pin').value || '').trim();
  if (!/^[0-9]{6}$/.test(code)) { pinMsg('יש להזין קוד בן 6 ספרות.'); return; }
  /* ⚠️ המכשיר נשלח **אם הוא קיים** ואינו נדרש: בקיוסק של Windows הוא
     לעולם לא יהיה, כי מצב הקיוסק מוחק את נתוני האתר בכל סיום סשן.
     במחשב שכן רשום הוא עדיין נשלח ונבדק — כדי שדגל-החירום
     requireDevice=true יוכל להחזיר את הדרישה בלי פריסה. */
  var dev = deviceCreds();
  _busy = true; $('pinBtn').disabled = true; $('pin').disabled = true;
  var old = $('pinBtn').textContent; $('pinBtn').textContent = 'רגע…';
  try {
    var r = await fetch(FN + '/press4MachineLogin', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      /* ⚠️ שלושה ערכים בלבד. orgId, machineId ו-role נגזרים בשרת. */
      body: JSON.stringify({ data: dev
        ? { deviceId: dev.deviceId, deviceSecret: dev.deviceSecret, pin: code }
        : { pin: code } })
    });
    var j = null; try { j = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error((j && j.error && j.error.message) || 'קוד שגוי או שהמכונה אינה פעילה');
    var tok = j && j.result && j.result.token;
    if (!tok) throw new Error('קוד שגוי או שהמכונה אינה פעילה');
    $('pin').value = '';                       /* ⚠️ הקוד לא נשאר בשדה */
    await SolanAuth.signInWithCustomToken(tok);
    /* onAuthStateChanged יטפל בשאר — לא מרעננים את הדף. */
  } catch (e) {
    pinMsg(e.message || 'הכניסה נכשלה');
    $('pin').value = '';
  }
  $('pinBtn').textContent = old;
  $('pinBtn').disabled = false; $('pin').disabled = false;
  _busy = false;
}

/* ⚠️ שלב שני. מבנה זהה ל-doPinLogin שמעליו, ובכוונה: אותו טיפול בשגיאה,
   אותו ניקוי-שדה, ואותה הסתמכות על onAuthStateChanged.
   ⚠️ הקריאה נושאת את אסימון-המכונה — בלי קוד-מכונה תקף היא נדחית בשרת. */
async function doStaffLogin(){
  if (_busy) return;
  var code = String($('spin').value || '').trim();
  if (!/^[0-9]{4,8}$/.test(code)) { staffMsg('יש להזין את קוד העובד האישי.'); return; }
  _busy = true; $('spinBtn').disabled = true; $('spin').disabled = true;
  var old = $('spinBtn').textContent; $('spinBtn').textContent = 'רגע…';
  try {
    var t = await SolanAuth.idToken(false);
    var r = await fetch(FN + '/press4StaffLogin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + t },
      body: JSON.stringify({ data: { pin: code } })
    });
    var j = null; try { j = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error((j && j.error && j.error.message) || 'קוד עובד שגוי');
    var tok = j && j.result && j.result.token;
    if (!tok) throw new Error('קוד עובד שגוי');
    $('spin').value = '';                      /* ⚠️ הקוד לא נשאר בשדה */
    window._opName = (j.result && j.result.name) || '';
    await SolanAuth.signInWithCustomToken(tok);
    /* ⚠️ **קריאה מפורשת, ולא הסתמכות על onAuthStateChanged**: הכניסה היא
       Custom Token חדש לאותו uid, ולכן מבחינת Firebase המשתמש לא השתנה
       וההנדלר אינו נורה. זה מה שהשאיר את המסך על כרטיס ה-PIN אחרי כניסה
       שהצליחה בשרת. */
    await applyAuth(SolanAuth.auth().currentUser);
  } catch (e) {
    staffMsg(e.message || 'הכניסה נכשלה');
    $('spin').value = '';
  }
  $('spinBtn').textContent = old;
  $('spinBtn').disabled = false; $('spin').disabled = false;
  _busy = false;
}
function staffMsg(text){
  var el = $('spinMsg');
  el.className = 'msg err'; el.textContent = text; el.classList.remove('hidden');
}

function msg(kind, text){
  var el = $('msg');
  el.className = 'msg ' + kind;
  el.textContent = text;
  el.classList.remove('hidden');
}
function clearMsg(){ $('msg').classList.add('hidden'); }

/* ⚠️ כל קריאה ל-Function עוברת כאן. כשל **תמיד** נראה: אין מסלול שבו
   בקשה נופלת והמסך ממשיך כאילו כלום. זו תבנית הכשל-השקט שכבר עלתה
   לנו כמה פעמים. */
async function callFn(name, data){
  var tok = await SolanAuth.idToken(false);
  var r = await fetch(FN + '/' + name, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok },
    body: JSON.stringify({ data: data || {} })
  });
  var j = null;
  try { j = await r.json(); } catch (e) {}
  if (!r.ok) {
    var code = (j && j.error && (j.error.message || j.error.status)) || ('HTTP ' + r.status);
    throw new Error(errText(code));
  }
  return (j && j.result) || {};
}

/* קודי-השרת → עברית. קוד לא מוכר מוצג כפי שהוא ולא נבלע. */
function errText(code){
  var c = String(code || '');
  if (/press_machine_not_configured/.test(c)) return 'מכונת ארבעת הצבעים לא הוגדרה. פנו למנהל.';
  if (/press_machine_disabled/.test(c))       return 'מסך המכונה מושבת כרגע. פנו למנהל.';
  if (/press_job_not_found/.test(c))          return 'העבודה כבר אינה בתור. רעננו.';
  if (/press_job_ambiguous/.test(c))          return 'נמצאו שתי רשומות זהות לעבודה — פנו למנהל.';
  if (/press_job_already_completed/.test(c))  return 'העבודה כבר סומנה כהושלמה.';
  if (/press_job_not_started/.test(c))        return 'העבודה עדיין לא התחילה.';
  if (/press_proof_not_found/.test(c))        return 'אין פרופר לעבודה הזו.';
  if (/cross_org|press_/.test(c))             return 'אין הרשאה לפעולה הזו.';
  if (/החשבון אינו פעיל|הסשן בוטל/.test(c))   return c;
  return 'הפעולה נכשלה (' + c + ').';
}

/* ⚠️ המבנה זהה ל-_renderOperatorScreen: גריד של שני פאנלים — "בהדפסה"
   משמאל ו"תור עבודות" מימין. העבודה שבהדפסה יוצאת מרשימת התור ומקבלת
   את הפאנל הגדול, בדיוק כמו במסך הדפסים. */
var _jobs = [];
function _fmt(n){ return Number(n).toLocaleString('he-IL'); }

/* הפאנל הגדול — העבודה שבהדפסה. הקופסאות הכהות הן סוג-נייר וכמות
   גיליונות, כמו במקור; כאן הן קריאה-בלבד, כי החלפת נייר היא כתיבה
   לכרטיס והמסך הזה אינו כותב לשום מקום מלבד שלוש ה-Functions. */
function nowHtml(j){
  var h = '<div class="pane-now"><div class="ph"><span class="d"></span>'
        + '<span class="t">בהדפסה</span></div>';
  if (!j) {
    h += _jobs.length
      ? '<div class="idle"><div class="big">⏳</div>'
        + '<div class="txt">לחץ "התחל הדפסה" · Press “Start printing”<br>על העבודה הראשונה בתור</div></div>'
      : '<div class="idle"><div class="big">✅</div><div class="txt">כל העבודות הושלמו</div></div>';
    return h + '</div>';
  }
  h += '<div class="now-body">'
    + '<div class="now-name">' + esc(j.name || 'עבודה') + '</div>'
    + (j.runLabel ? '<div class="now-run">' + esc(j.runLabel) + '</div>' : '')
    + '<div class="boxes">'
    + '<div class="box"><div class="k">סוג נייר</div><div class="v">' + esc(j.paper || '—') + '</div></div>'
    + '<div class="box"><div class="k">כמות גיליונות</div><div class="v">'
    + (j.copies ? _fmt(j.copies) : '—') + '</div></div>'
    + '</div>';
  /* שאר הפרטים שהשרת שולח — שורה אחת, בלי להמציא שדות חדשים */
  var extra = [];
  if (j.customer) extra.push('לקוח: ' + esc(j.customer));
  if (j.size)     extra.push(esc(j.size));
  if (j.color)    extra.push(esc(j.color));
  if (j.pages)    extra.push(esc(j.pages) + ' עמ\'');
  if (extra.length) h += '<div class="q-sub" style="margin-top:10px">' + extra.join(' · ') + '</div>';
  if (j.hasProof) h += '<button class="b b-proof big" data-act="proof" data-key="'
                     + esc(j.jobKey) + '">📄 פרופר · Proof</button>';
  /* ⚠️ גם כאן, כמו במסך הדפסים: עבודה שהתחילה בטעות צריכה
     להיות ניתנת להחזרה בלחיצה, ולא דרך "סיים" שמשקר. */
  h += '<button class="b b-back" style="width:100%;margin-top:8px" data-act="reopen" data-key="'
     + esc(j.jobKey) + '">↩ החזר לתור</button>'
     + '<button class="b b-done" data-act="finish" data-key="' + esc(j.jobKey)
     + '">✓ סיים עבודה · Finish job</button>';
  return h + '</div></div>';
}

/* פאנל התור. הכפתור משתנה בדיוק כמו במקור: "▶ התחל הדפסה" כשאין עבודה
   בהדפסה, ו"▶ עבור לזה" כשיש. */
function queueHtml(items, printing){
  var h = '<div class="pane-q"><div class="ph">תור עבודות</div><div class="q-body">';
  if (!items.length) {
    h += '<div class="q-empty">אין עבודות נוספות</div>';
  } else {
    items.forEach(function(j, idx){
      var first = idx === 0 && !printing;
      h += '<div class="q-item' + (first ? ' first' : '') + '">'
        + '<div class="q-head"><span class="q-num">' + (idx + 1) + '</span>'
        + '<div style="flex:1;min-width:0">'
        + '<div class="q-name">' + esc(j.name || 'עבודה')
        + (j.runLabel ? ' <span class="r">· ' + esc(j.runLabel) + '</span>' : '') + '</div>'
        + '<div class="q-sub"><b>' + esc(j.paper || '') + '</b>'
        + (j.copies ? ' · ' + _fmt(j.copies) + ' גיל\'' : '') + '</div>'
        + '</div></div>'
        /* ⚠️ החלטת-בעלים 18/08/2026: בתור הכפתור הוא **חיווי** שצורף
           פרופר, ולא פתיחה — הצפייה היא על העבודה שבהדפסה, כדי שמה
           שעל המסך יהיה תמיד מה שבמכונה. ‏proofq ולא proof: פעולה
           נפרדת, ולא דגל שנבדק אחר-כך במסלול הפתיחה. */
        + (j.hasProof ? '<button class="b b-proof" data-act="proofq" data-key="'
                        + esc(j.jobKey) + '">📄 פרופר · Proof</button>' : '')
        + '<button class="b ' + (printing ? 'b-switch' : 'b-start') + '" data-act="start" data-key="'
        + esc(j.jobKey) + '">▶ ' + (printing ? 'עבור לזה · Switch' : 'התחל הדפסה · Start printing') + '</button>'
        + '</div>';
    });
  }
  return h + '</div></div>';
}

/* ⚠️ "הושלמו היום" ומולו "היסטוריית עבודות" — בדיוק כמו
   במסך הדפסים: מה שהושלם **היום** גלוי, והשאר מקופל.
   החלוקה לפי completedAt שהשרת שולח. */
function isToday(ms){
  if (!ms) return false;
  var d = new Date(ms), t = new Date();
  return d.getFullYear() === t.getFullYear() && d.getMonth() === t.getMonth() &&
         d.getDate() === t.getDate();
}

function doneRow(j){
  var when = j.completedAt
    ? new Date(j.completedAt).toLocaleString('he-IL',
        { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
    : '';
  return '<div class="done-row"><span class="v">✓</span>'
    + '<div style="flex:1;min-width:0">'
    + '<div class="dn">' + esc(j.name || 'עבודה')
    + (j.runLabel ? ' · ' + esc(j.runLabel) : '') + '</div>'
    + (when ? '<div class="dt">' + esc(when) + '</div>' : '')
    + '</div>'
    /* ⚠️ החזרה לתור אינה מוחקת את הרשומה בשרת — רק מאפסת
       את המצב. התיעוד של מי התחיל ומתי נשמר. */
    + '<button class="b b-back" data-act="reopen" data-key="' + esc(j.jobKey)
    + '">↩ החזר לתור</button></div>';
}

function doneHtml(done){
  if (!done.length) return '';
  var today = done.filter(function(j){ return isToday(j.completedAt); });
  var older = done.filter(function(j){ return !isToday(j.completedAt); });
  var byTime = function(a, b){ return (b.completedAt || 0) - (a.completedAt || 0); };
  today.sort(byTime); older.sort(byTime);
  var h = '';
  if (today.length) {
    h += '<div class="done-sec"><div class="done-ttl">הושלמו היום · Completed today</div>'
       + today.map(doneRow).join('') + '</div>';
  }
  if (older.length) {
    h += '<div style="margin-top:8px">'
       + '<button class="hist-btn" id="histBtn">🕘 היסטוריית עבודות (' + older.length + ')</button>'
       + '<div id="hist" style="display:none;padding-top:4px">'
       + older.slice(0, 50).map(doneRow).join('') + '</div></div>';
  }
  return h;
}

function paint(){
  if (!_jobs.length) {
    $('board').innerHTML = '<div class="none">✓<br>אין עבודות בתור<br>No jobs in queue</div>';
    return;
  }
  var printing = null, queue = [], done = [];
  for (var i = 0; i < _jobs.length; i++) {
    var j = _jobs[i];
    if (j.state === 'completed') done.push(j);
    else if (j.state === 'started' && !printing) printing = j;
    else queue.push(j);
  }
  $('board').innerHTML = '<div class="grid">' + nowHtml(printing) + queueHtml(queue, printing) + '</div>'
                       + doneHtml(done);
  /* היסטוריה נפתחת ונסגרת מקומית, בלי לעבור דרך act() */
  var hb = document.getElementById('histBtn');
  if (hb) hb.onclick = function(){
    var d = document.getElementById('hist');
    if (d) d.style.display = d.style.display === 'none' ? 'block' : 'none';
  };
}

async function load(silent){
  if (!silent) { $('refresh').disabled = true; clearMsg(); }
  try {
    var res = await callFn('getPress4Queue');
    _jobs = res.jobs || [];
    paint();
    $('who').textContent = _jobs.length + ' בתור · ' +
      new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
  } catch (e) {
    msg('err', e.message || 'טעינת התור נכשלה');
  }
  $('refresh').disabled = false;
}

/* ⚠️ נעילה גלובלית לזמן בקשה: לחיצה כפולה על "התחל" הייתה שולחת שתי
   בקשות. השרת ממילא אינו דורס, אבל אין סיבה לשלוח. */
async function act(kind, jobKey, btn){
  if (_busy) return;
  _busy = true;
  var all = $('board').querySelectorAll('button');
  for (var i = 0; i < all.length; i++) all[i].disabled = true;
  var old = btn.textContent; btn.textContent = 'רגע…';
  clearMsg();
  try {
    if (kind === 'proofq') msg('ok', '📄 יש פרופר לעבודה הזו. התחילו הדפסה כדי לצפות בו.');
    else if (kind === 'proof') await openProof(jobKey);
    else {
      var FN_OF = { start: 'startPress4Job', finish: 'finishPress4Job', reopen: 'reopenPress4Job' };
      var r = await callFn(FN_OF[kind], { jobKey: jobKey });
      msg('ok', kind === 'start'
        ? (r.already ? 'העבודה כבר בהדפסה.' : '▶ העבודה סומנה כמתחילה.')
        : kind === 'reopen'
        ? (r.already ? 'העבודה כבר בתור.' : '↩ העבודה הוחזרה לתור.')
        : (r.already ? 'העבודה כבר סומנה כהושלמה.' : '✓ העבודה הושלמה.'));
      await load(true);
    }
  } catch (e) {
    msg('err', e.message || 'הפעולה נכשלה');
  }
  btn.textContent = old;
  _busy = false;
  var again = $('board').querySelectorAll('button');
  for (var k = 0; k < again.length; k++) again[k].disabled = false;
}

/* ── מציג הפרופר ──────────────────────────────────────────────────────
   ⚠️ הפרופר נפתח **בתוך המסך**, כמו במסך הדפסים — לא בלשונית-דפדפן עם
   PDF. בקיוסק אין סרגל-כתובת ואין לשוניות, ולשונית חדשה שם היא מסך
   שהמפעיל לא יודע איך לסגור.

   ⚠️ הקובץ נמשך בבקשה מאומתת ומרונדר מקומית. אין token= בכתובת, אין
   Signed URL ואין נתיב Storage שעובר בדפדפן.

   ⚠️ מה שאין כאן מהמציג של מסך הדפסים: ברזי צבע, גווני צבע, נייר חום
   וסימולציית הדפסה. כולם נשענים על נתוני הכרטיס, והמסך הזה מקבל
   מהשרת רשימת-שדות סגורה שאינה כוללת אותם. */
var _pv = null;

function pvClose(){
  var ov = document.getElementById('ov');
  if (ov) ov.remove();
  if (_noteTimer) { clearTimeout(_noteTimer); _noteTimer = null; }
  /* ⚠️ _pv=null עוצר את לולאת-החידוד: היא בודקת alive() בכל סיבוב.
     בלי זה היא הייתה ממשיכה לרנדר עשרות עמודים ברקע אחרי שסגרו. */
  if (_pv && _pv.pdf) { try { _pv.pdf.cleanup(); } catch (e) {} }
  if (_pv && _pv.url) { try { URL.revokeObjectURL(_pv.url); } catch (e) {} }
  _pv = null;
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
}

function pvRender(){
  if (!_pv) return;
  var vp = document.getElementById('pv-vp');
  if (!vp) return;
  var idx = _pv.idx, imgs = _pv.imgs;
  /* כפולה: שני עמודים זה-לצד-זה, כמו במסך הדפסים */
  var show = _pv.spread && imgs.length > 1
    ? [imgs[idx], imgs[idx + 1]].filter(Boolean) : [imgs[idx]];
  vp.innerHTML = '<div class="pv-stage" style="transform:scale(' + _pv.zoom + ')">'
    + show.map(function(src){ return '<img class="pv-img" src="' + src + '">'; }).join('') + '</div>';
  /* מספר-העמודים גדל תוך-כדי — גם בשלב-א' (עמוד אחר עמוד)
     וגם כש-pvUpgradeFromSource מגלה שבקובץ יש יותר ממה שהיה במטמון. */
  var multi = Math.max(_pv.total || 0, imgs.length) > 1;
  var vis = function(id, show){ var e = document.getElementById(id); if (e) e.style.display = show ? '' : 'none'; };
  vis('pv-prev', multi); vis('pv-next', multi); vis('pv-sel', multi); vis('pv-spread', multi);
  vis('pv-label', !multi);
  var sel = document.getElementById('pv-sel');
  if (sel) {
    var opts = '';
    for (var i = 0; i < imgs.length; i++) {
      opts += '<option value="' + i + '"' + (i === idx ? ' selected' : '') + '>עמוד ' + (i + 1)
            + ' מתוך ' + _pv.total + '</option>';
    }
    sel.innerHTML = opts;
  }
  var lbl = document.getElementById('pv-label');
  if (lbl) lbl.textContent = imgs.length ? ('עמוד ' + (idx + 1) + ' מתוך ' + _pv.total) : '';
}

function pvGo(d){
  if (!_pv || !_pv.imgs.length) return;
  var step = _pv.spread ? 2 : 1;
  _pv.idx = Math.max(0, Math.min(_pv.imgs.length - 1, _pv.idx + d * step));
  pvRender();
}

function pvBuild(ov, label){
  /* ⚠️ פקדי-הדפדוף נבנים **תמיד**, ומוסתרים ב-pvRender לפי מספר-העמודים
     הנוכחי. עד היום הסרגל נבנה פעם-אחת לפי מה שהיה במטמון: מטמון של
     עמוד אחד מול קובץ של שניים השאיר את הדפס מול "עמוד 1 מתוך 2"
     בלי חץ, בלי בורר ובלי כפולה — שני עמודים שמהם אחד בלתי-נגיש. */
  var bar = document.createElement('div');
  bar.className = 'pvbar';
  bar.innerHTML =
      '<span class="ttl">' + esc(label || 'פרופר') + '</span>'
    + '<span id="pv-note" style="display:none;background:#1d4ed8;color:#fff;border-radius:14px;'
    + 'padding:4px 11px;font-size:.78rem;font-weight:800"></span>'
    + '<button id="pv-prev" title="עמוד קודם">‹</button>'
    + '<select id="pv-sel"></select>'
    + '<span id="pv-label" style="color:#cbd5e1;font-size:.85rem;font-weight:700"></span>'
    + '<button id="pv-next" title="עמוד הבא">›</button>'
    + '<span style="width:10px"></span>'
    + '<button id="pv-zout" title="הקטן">🔍➖</button>'
    + '<button id="pv-fit" title="התאם למסך">⤢ התאם · Fit</button>'
    + '<button id="pv-zin" title="הגדל">🔍➕</button>'
    + '<button id="pv-spread" title="הצג שני עמודים">⊞ כפולה</button>'
    + '<button id="pv-fs" title="מסך מלא">⛶</button>'
    + '<button id="pv-close" title="סגור">✕</button>';
  ov.insertBefore(bar, ov.firstChild);
  var vp = document.createElement('div'); vp.id = 'pv-vp';
  ov.appendChild(vp);

  var on = function(id, fn){ var b = document.getElementById(id); if (b) b.onclick = fn; };
  on('pv-prev', function(){ pvGo(-1); });
  on('pv-next', function(){ pvGo(1); });
  on('pv-zin',  function(){ _pv.zoom = Math.min(6, _pv.zoom * 1.25); pvRender(); });
  on('pv-zout', function(){ _pv.zoom = Math.max(.2, _pv.zoom / 1.25); pvRender(); });
  on('pv-fit',  function(){ _pv.zoom = 1; pvRender(); });
  on('pv-spread', function(){ _pv.spread = !_pv.spread; pvRender(); });
  on('pv-fs', function(){
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else ov.requestFullscreen();
    } catch (e) {}
  });
  on('pv-close', pvClose);
  var sel = document.getElementById('pv-sel');
  if (sel) sel.onchange = function(){ _pv.idx = parseInt(this.value, 10) || 0; pvRender(); };
}

function pvStatus(t){ var e = document.getElementById('pv-txt'); if (e) e.textContent = t; }

/* תג קטן בסרגל: "מחדד…" בזמן שלב ב', ו"מהקובץ המקורי" בסיומו. בלי זה
   המפעיל רואה תמונה שמתחלפת לבד ולא יודע למה. */
var _noteTimer = null;
function pvNote(t, hideAfter){
  var e = document.getElementById('pv-note');
  if (!e) return;
  e.textContent = t; e.style.display = '';
  if (_noteTimer) { clearTimeout(_noteTimer); _noteTimer = null; }
  if (hideAfter) _noteTimer = setTimeout(function(){
    var el = document.getElementById('pv-note'); if (el) el.style.display = 'none';
  }, hideAfter);
}

/* ⚠️ הרינדור חולץ מ-openProof כדי ש**גם** קובץ מקומי יעבור בו.
   שני עותקים היו סוטים זה מזה — ומסלול-הגיבוי הוא בדיוק זה שאסור
   שיישבר, כי אליו פונים כשהרגיל כבר נכשל. */
async function pvShowBuffer(buf, label) {
  pvStatus('⏳ פותח את הקובץ…');
  /* ⚠️ pdf.js נטען דרך PdfEngine — אותו מנוע ואותן מראות כמו בכל מסלולי
     האישור, כי חלק מהמראות חסומות ברשת כשרה. */
  await PdfEngine.ensure({ win: window }).catch(function(){});
  if (!window.pdfjsLib) throw new Error('מנוע התצוגה נחסם ברשת. פנו למנהל.');

  var pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  try { if (window._p4Mark) window._p4Mark('parsed'); } catch (e) {}
  var n = pdf.numPages;
  _pv = { imgs: [], idx: 0, zoom: 1, spread: false, total: n, url: null,
          sharp: [], pdf: pdf };
  var built = false;

  /* ⚠️ שני שלבים, וזה העיקר: רינדור ב-2900px לוקח שניות לעמוד, ופרופר
     של גיליון-דפוס 70×100 הוא 145 מגה-פיקסל. לחכות לחדות לפני שמציגים
     משהו זה מסך שחור ארוך, והמפעיל חושב שנתקע.
     שלב א' — כל העמודים ב-{FAST}px, מהיר; העמוד הראשון על המסך מיד.
     שלב ב' — אותם עמודים ב-{SHARP}px ברקע, מחליפים בשקט.
     זה בדיוק מה שמסך הדפסים עושה עם הקאש ו-_opTruthUpgrade, רק שכאן
     אין קאש מוכן ולכן השלב המהיר מיוצר מאותו קובץ. */
  var FAST = 1100, SHARP = 2900;

  async function renderAt(p, targetH) {
    var page = await pdf.getPage(p);
    var v1 = page.getViewport({ scale: 1 });
    var vpt = page.getViewport({ scale: Math.min(4.0, targetH / v1.height) });
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.floor(vpt.width));
    c.height = Math.max(1, Math.floor(vpt.height));
    var cx = c.getContext('2d');
    try { cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high'; } catch (e) {}
    cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height);   /* רקע לבן — JPEG בלי שקיפות */
    await page.render({ canvasContext: cx, viewport: vpt }).promise;
    try { page.cleanup(); } catch (e) {}
    return c.toDataURL('image/jpeg', 0.96);
  }
  var alive = function(){ return !!document.getElementById('ov') && !!_pv; };

  /* ── שלב א' ── */
  for (var p = 1; p <= n; p++) {
    if (!alive()) { try { pdf.cleanup(); } catch (e) {} return; }
    _pv.imgs.push(await renderAt(p, FAST));
    _pv.sharp.push(false);
    if (!built) {
      built = true;
      var l = document.getElementById('pv-load'); if (l) l.remove();
      pvBuild(ov, label);
      /* ⚠️ **זה הרגע שהדפס מרגיש** — לא סיום ההורדה ולא סיום הרינדור
         של כל העמודים, אלא הרגע שבו משהו מופיע על המסך. */
      try { if (window._p4Mark) window._p4Mark('first'); } catch (e) {}
      /* ⚠️ אחרי הצגת העמוד הראשון, לא בסוף כל הרינדור: מה שמעניין את
         הדפס הוא כמה הוא חיכה עד שראה משהו. */
      try { pvSlowNote(); } catch (e) {}
    }
    pvRender();
    /* הפסקה קצרה: מחזירה שליטה לדפדפן כדי שהמסך יגיב ללחיצות
       בזמן שהשאר נטען. */
    await new Promise(function(r){ setTimeout(r, 0); });
  }
  if (!_pv.imgs.length) throw new Error('לא ניתן להציג את הפרופר.');
  if (n > 1) pvNote('⏳ מחדד…');

  /* ── שלב ב' — חידוד ברקע, תמיד מהעמוד שעל המסך והלאה ──
     ⚠️ לא לולאה קבועה: המפעיל מדפדף בזמן החידוד, ומה שהוא מסתכל עליו
     עכשיו הוא מה שצריך להתחדד ראשון. */
  (async function sharpen(){
    while (alive()) {
      var pick = -1, best = Infinity;
      for (var i = 0; i < _pv.sharp.length; i++) {
        if (_pv.sharp[i]) continue;
        var d = Math.abs(i - _pv.idx);
        if (d < best) { best = d; pick = i; }
      }
      if (pick < 0) break;
      try {
        var hi = await renderAt(pick + 1, SHARP);
        if (!alive()) return;
        _pv.imgs[pick] = hi;
        _pv.sharp[pick] = true;
        /* מציירים מחדש רק אם העמוד שהתחדד הוא זה שעל המסך */
        if (pick === _pv.idx || (_pv.spread && pick === _pv.idx + 1)) pvRender();
      } catch (e) {
        _pv.sharp[pick] = true;                 /* עמוד שנכשל לא ינסה לנצח */
      }
      await new Promise(function(r){ setTimeout(r, 0); });
    }
    if (alive()) { pvNote('✓ מהקובץ המקורי', 3500); try { pdf.cleanup(); } catch (e) {} }
  })();
}

/* מציג את מטמון-התמונות מיד. אותו מבנה _pv בדיוק כמו pvShowBuffer,
   עם sharp=false — כלומר "עדיין לא מהמקור". */
/* ⚠️ הורדה עם חיווי-התקדמות. ספינר עם טקסט קבוע נראה תקוע, והדפס
   מדווח "לא נפתח" על הורדה שרצה כרגיל. אם השרת לא מדווח גודל
   (תגובה chunked) — מציגים כמה ירד עד כה, בלי אחוזים מומצאים. */
async function pvFetchProgress(url) {
  var r = await fetch(url);
  if (!r.ok || !r.body || !r.body.getReader) return r;
  var total = Number(r.headers.get('Content-Length') || 0) || 0;
  var reader = r.body.getReader(), chunks = [], got = 0, last = 0;
  while (true) {
    var st = await reader.read();
    if (st.done) break;
    chunks.push(st.value); got += st.value.length;
    if (Date.now() - last > 200) {
      last = Date.now();
      pvStatus(total ? ('⏳ מוריד… ' + Math.round(got / total * 100) + '%  (' + pvMB(got) + ' מתוך ' + pvMB(total) + ')')
                     : ('⏳ מוריד… ' + pvMB(got)));
    }
  }
  var buf = new Uint8Array(got), off = 0;
  chunks.forEach(function (c) { buf.set(c, off); off += c.length; });
  /* מחזיר אובייקט תואם-Response למי שקורא arrayBuffer/headers */
  return { ok: true, status: r.status, headers: r.headers,
           arrayBuffer: function () { return Promise.resolve(buf.buffer); } };
}

/* ⚠️ **התקלה בתכנון שלי (09/08/2026).** שמתי את "פרטי תקלה" מאחורי
   מסך-הכשל — אבל הדפס דיווח שאין תקלה כלל, רק טעינה ארוכה. כלומר
   הכלי שנועד להסביר את האיטיות היה נגיש רק כשהמסך **נכשל**, ובדיוק
   במצב שבו הוא נחוץ אי-אפשר היה להגיע אליו.
   מעכשיו: טעינה שנמשכה יותר מ-SLOW_MS מציגה את המדידה **לבד**, בלי
   שאיש ילחץ על דבר. זה גם מרגיע — הדפס רואה שהמערכת עבדה ולא נתקעה. */
var PV_SLOW_MS = 2500;

function pvTimingLine() {
  var t = window._p4Timing;
  if (!t) return '';
  var seg = [];
  if (t.bytes) seg.push('הורדה ' + (t.bytes / 1000).toFixed(1) + 'ש׳');
  if (t.parsed) seg.push('פתיחה ' + ((t.parsed - t.bytes) / 1000).toFixed(1) + 'ש׳');
  if (t.first) seg.push('עמוד ראשון ' + (t.first / 1000).toFixed(1) + 'ש׳');
  if (t.size) seg.push(pvMB(t.size));
  return seg.join(' · ');
}

/* מוצג אחרי טעינה איטית. ⚠️ מציין במפורש אם הייתה תצוגה מהירה — זה
   ההבדל בין "הפרופר כבד" לבין "אין לו מטמון", ושתי הסיבות דורשות
   תיקון אחר לגמרי. */
function pvSlowNote() {
  var t = window._p4Timing;
  if (!t) return;
  var ms = t.first || t.parsed || t.bytes || 0;
  if (ms < PV_SLOW_MS) return;
  var why = (t.preview && t.preview !== 'יש') ? ' · ללא תצוגה מהירה' : '';
  pvNote('⏱ נפתח ב-' + (ms / 1000).toFixed(1) + 'ש׳ · ' + pvTimingLine() + why, 0);
}

function pvShowCached(imgs, label) {
  var ov = document.getElementById('ov');
  if (!ov) return;
  var l = document.getElementById('pv-load'); if (l) l.remove();
  _pv = { imgs: imgs.slice(), idx: 0, zoom: 1, spread: false, total: imgs.length,
          url: null, sharp: imgs.map(function () { return false; }), pdf: null, fromCache: true };
  pvBuild(ov, label);
  pvRender();
  pvNote('תצוגה מהירה — טוען את הקובץ המקורי…', 2500);
  /* גם כאן: אם אפילו המטמון לקח זמן, זה נתון חשוב. */
  try { setTimeout(pvSlowNote, 2600); } catch (e) {}
}

/* מוריד את המקור ברקע ומחליף לתמונה החדה.
   ⚠️ כשל כאן **אינו** מסך-שגיאה: על המסך כבר יש תצוגה שמישה, והחלפתה
   במסך-כשל הייתה מורידה מהדפס את מה שכבר עובד. חיווי בלבד. */
async function pvUpgradeFromSource(url, label) {
  var alive = function () { return !!document.getElementById('ov') && !!_pv; };
  try {
    var r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var buf = await r.arrayBuffer();
    if (!alive()) return;
    var head = '';
    try { head = String.fromCharCode.apply(null, new Uint8Array(buf, 0, 4)); } catch (e) {}
    if (head !== '%PDF') throw new Error('not-pdf');
    await PdfEngine.ensure({ win: window }).catch(function () {});
    if (!window.pdfjsLib) throw new Error('no-engine');
    var pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    if (!alive()) { try { pdf.cleanup(); } catch (e) {} return; }
    _pv.pdf = pdf;
    var n = pdf.numPages;
    for (var i = 1; i <= n; i++) {
      if (!alive()) { try { pdf.cleanup(); } catch (e) {} return; }
      var page = await pdf.getPage(i);
      var v1 = page.getViewport({ scale: 1 });
      var vp = page.getViewport({ scale: Math.min(4.0, 2900 / v1.height) });
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.floor(vp.width)); c.height = Math.max(1, Math.floor(vp.height));
      var cx = c.getContext('2d');
      try { cx.imageSmoothingEnabled = true; cx.imageSmoothingQuality = 'high'; } catch (e) {}
      cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height);
      await page.render({ canvasContext: cx, viewport: vp }).promise;
      if (!alive()) { try { pdf.cleanup(); } catch (e) {} return; }
      _pv.imgs[i - 1] = c.toDataURL('image/jpeg', 0.96);
      _pv.sharp[i - 1] = true;
      if (_pv.total < i) _pv.total = i;
      try { page.cleanup(); } catch (e) {}
      if (i - 1 === _pv.idx || (_pv.spread && i - 1 === _pv.idx + 1)) pvRender();
      await new Promise(function (res) { setTimeout(res, 0); });
    }
    if (alive()) { _pv.fromCache = false; pvNote('✓ מהקובץ המקורי', 3000); try { pdf.cleanup(); } catch (e) {} }
  } catch (e) {
    /* ⚠️ הניסוח שנקבע: הדפס חייב לדעת שמה שהוא רואה אינו הקובץ עצמו. */
    if (alive()) pvNote('תצוגה מהירה בלבד — הקובץ המקורי לא נטען', 0);
  }
}

async function openProof(jobKey){
  pvClose();
  var ov = document.createElement('div'); ov.id = 'ov';
  ov.innerHTML = '<div id="pv-load"><div class="sp"></div>'
    + '<div id="pv-txt" style="font-size:1rem;font-weight:700">⏳ טוען פרופר…</div>'
    + '<button id="pv-cancel" style="margin-top:6px;padding:11px 26px;border-radius:10px;'
    + 'border:1.5px solid rgba(255,255,255,.5);background:transparent;color:#fff;'
    + 'font-family:inherit;font-size:.95rem;font-weight:800;cursor:pointer">✕ סגור · Close</button></div>';
  document.body.appendChild(ov);
  document.getElementById('pv-cancel').onclick = pvClose;

  var j = null;
  for (var i = 0; i < _jobs.length; i++) if (_jobs[i].jobKey === jobKey) j = _jobs[i];
  var label = (j && (j.runLabel || j.name)) || 'פרופר';

  /* ⚠️ **מדידת-שלבים.** התלונה היא "נפתח לאט" על פרופר של גיליון אחד או
     שניים — ובלי מדידה אי-אפשר לדעת אם הזמן הולך להורדה, לפענוח ה-PDF,
     או לרינדור. שלושת אלה דורשים שלושה תיקונים שונים לגמרי.
     ⚠️ נשמרים **מספרים בלבד** — אלפיות ובתים. אין שם-לקוח, אין מזהה-עבודה
     ואין כתובת; המדידה מוצגת לדפס וגם נכתבת לאבחון. */
  var _t0 = Date.now();
  window._p4Timing = { gate: 0, bytes: 0, size: 0, parsed: 0, first: 0, source: '' };
  /* ⚠️ הסמן **גלובלי**, כי שלב "העמוד הראשון על המסך" נמדד בתוך
     pvShowBuffer — פונקציה אחרת. סמן מקומי היה משאיר בלי מדידה בדיוק
     את השלב שהדפס מרגיש. */
  window._p4Mark = function (k) { try { if (window._p4Timing) window._p4Timing[k] = Date.now() - _t0; } catch (e) {} };
  var _mark = window._p4Mark;

  try {
    pvStatus('⏳ מוריד את הקובץ…');
    var tok = await SolanAuth.idToken(false);

    /* ⚠️ **החלטת-בעלים 09/08/2026 — תפעול גובר על החוק שקבענו.**
       עד היום כל בית של ה-PDF עבר דרך הפונקציה, והמסך הזה לא נגע
       ב-Storage. בפועל פרופר של גיליון 70×100 ב-360 DPI הוא עשרות מגה,
       וההזרמה נקטעה: "פעם נפתח ופעם לא" וטעינה ארוכה מאוד.
       עכשיו הפונקציה מחזירה **כתובת**, והדפדפן מוריד ישירות — מהיר,
       בלי קטיעה ובלי תקרת-הזרמה. השער לא זז: אותה בקשה מאומתת, אותן
       בדיקות-שייכות; מה שהשתנה הוא מי מעביר את הבתים.

       ⚠️ נפילה-לאחור להזרמה **חובה**: ה-Functions והאתר נפרסים בנפרד,
       ובחלון שביניהם ייתכן מסך חדש מול פונקציה ישנה. בלי זה כל
       פתיחת-פרופר הייתה נשברת בדיוק בחלון הזה. */
    var r = null, direct = false;
    try {
      var ru = await fetch(FN + '/press4Proof?as=url&jobKey=' + encodeURIComponent(jobKey),
                           { headers: { 'Authorization': 'Bearer ' + tok } });
      if (ru.ok) {
        var ju = null; try { ju = await ru.json(); } catch (e) {}
        if (ju && ju.url) {
          _mark('gate');

          /* ⚠️ **תצוגה מהירה קודם.** מטמון-התמונות נוצר כבר בהעלאת הפרופר
             (‏JPEG מרונדר מראש). הצגתו אינה דורשת pdf.js ואינה דורשת רינדור,
             ולכן העמוד הראשון עולה תוך שבריר מהזמן. המקור יורד אחר-כך
             ברקע ומחליף לתמונה החדה. */
          /* ⚠️ בלי הרישום הזה אי-אפשר לדעת **למה** לא הופיעה תצוגה
             מהירה: אין מטמון לפרופר הזה, או שהורדתו נכשלה. שתי סיבות
             שונות לגמרי, ושתיהן נראות על המסך כ"נטען לאט". */
          window._p4Timing.preview = ju.pagesUrl ? 'יש' : 'אין מטמון לפרופר הזה';
          if (ju.pagesUrl) {
            try {
              var pr = await fetch(ju.pagesUrl);
              if (!pr.ok) window._p4Timing.preview = 'המטמון לא נטען (' + pr.status + ')';
              if (pr.ok) {
                var pimgs = await pr.json();
                if (!Array.isArray(pimgs) || !pimgs.length) window._p4Timing.preview = 'המטמון ריק';
                if (Array.isArray(pimgs) && pimgs.length) {
                  _mark('first');
                  pvShowCached(pimgs, label);
                  pvUpgradeFromSource(ju.url, label);   // ברקע — אינו מעכב
                  return;
                }
              }
            } catch (e) { /* מטמון פגום → ממשיכים למקור, וזה המסלול הרגיל */ }
          }

          pvStatus('⏳ מוריד את הקובץ…');
          r = await pvFetchProgress(ju.url);
          direct = true;
        }
      } else if (ru.status !== 404 && ru.status !== 400) {
        var eu = null; try { eu = await ru.json(); } catch (e) {}
        throw new Error(errText((eu && eu.error) || ('HTTP ' + ru.status)));
      }
    } catch (e) {
      if (e && e.__fromGate) throw e;
      r = null;               /* פונקציה ישנה או כשל-רשת → מסלול ההזרמה */
    }

    if (!r) {
      r = await fetch(FN + '/press4Proof?jobKey=' + encodeURIComponent(jobKey),
                      { headers: { 'Authorization': 'Bearer ' + tok } });
    }
    if (!r.ok) {
      var e1 = null; try { e1 = await r.json(); } catch (e) {}
      throw new Error(errText((e1 && e1.error) || ('HTTP ' + r.status)));
    }
    /* ⚠️ **מה שנמדד 09/08/2026.** הדפס קיבל "Invalid PDF structure" —
       כלומר ההורדה הצליחה (‏r.ok אמיתי) אבל הבייטים אינם PDF תקין. שני
       מקורות אפשריים, ושניהם נראים זהים לחלוטין על המסך:
         · הקובץ הגיע **חלקי** — ‏pipeProof הורס את התגובה כשה-stream
           נכשל, אבל הכותרות כבר נשלחו; הלקוח מקבל 200 עם חצי קובץ.
           פרופר של גיליון 70×100 ב-360 DPI נמדד בפרויקט הזה כ-71MB.
         · מה שהגיע אינו PDF בכלל.
       בלי המדידה כאן אי-אפשר להבחין ביניהם, ו-"Invalid PDF structure"
       שולח לחפש בדיוק במקום הלא-נכון. */
    var expect = Number(r.headers.get('Content-Length') || 0) || 0;
    var buf = await r.arrayBuffer();
    if (!document.getElementById('ov')) return;      /* המפעיל סגר בינתיים */

    _mark('bytes');
    var got = buf.byteLength;
    window._p4Timing.size = got;
    window._p4Timing.source = direct ? 'direct' : 'stream';
    var head4 = '';
    try { head4 = String.fromCharCode.apply(null, new Uint8Array(buf, 0, Math.min(4, got))); } catch (e) {}
    var facts = { expect: expect, got: got, head: head4, ctype: r.headers.get('Content-Type') || '' };

    if (expect && got < expect) {
      var e2 = new Error('הקובץ הגיע חלקי — ' + pvMB(got) + ' מתוך ' + pvMB(expect));
      e2.facts = facts; throw e2;
    }
    if (head4 !== '%PDF') {
      var e3 = new Error('מה שהתקבל אינו קובץ PDF');
      e3.facts = facts; throw e3;
    }

    await pvShowBuffer(buf, label);
  } catch (e) {
    /* ⚠️ **התקלה שדווחה 09/08/2026.** עד כאן ה-catch רק סגר וזרק למעלה,
       והמסך הציג את הטקסט הגולמי — "Failed to fetch" באנגלית, בלי שום
       דבר שאפשר לעשות איתו. לדפס זה חסר-משמעות, ובקיוסק אין קונסול
       שיגיד יותר.
       ⚠️ "Failed to fetch" אינו סטטוס: הוא TypeError של fetch, כלומר
       הבקשה **לא הגיעה לשרת בכלל** — רשת חסומה, origin שאינו מורשה,
       או חיבור שנקטע באמצע הורדה גדולה. לכן כאן מוצג מסלול-גיבוי
       ואבחון, ולא ניסוח יפה יותר לאותה שגיאה. */
    pvProofFail(e, label, function () { openProof(jobKey); });
  }
}

/* ═══ מסך-כשל לפרופר במסך המכונה ═══════════════════════════════════════
   ⚠️ המסך הזה רץ ב-Assigned Access: אין F12 ואי-אפשר להדביק שם סקריפט.
   כל מה שהדפס יכול לעשות חייב להיות על המסך. */
/* מגה-בייט קריא. ⚠️ הדפס משווה שני מספרים על המסך — "3.1 מתוך 71.4" —
   ולכן ספרה אחת אחרי הנקודה, לא בייטים גולמיים. */
function pvMB(b) {
  var n = Number(b) || 0;
  return n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB'
       : n >= 1024    ? Math.round(n / 1024) + 'KB'
                      : n + ' בתים';
}

function pvProofFail(err, label, retryFn) {
  var raw = String((err && err.message) || err || '');
  var facts = (err && err.facts) || null;
  var isNet = /Failed to fetch|NetworkError|Load failed|network/i.test(raw);
  /* ⚠️ "Invalid PDF structure" הוא מה ש-pdf.js אומר, ולא מה שקרה. ברוב
     המקרים הקובץ פשוט הגיע חלקי — וזו אבחנה אחרת לגמרי. */
  var isPdf = /Invalid PDF|PDF structure|InvalidPDFException/i.test(raw);
  var msg = isNet ? 'אין חיבור לשרת הקבצים'
          : isPdf ? 'הקובץ לא הגיע במלואו'
                  : (raw || 'לא הצלחנו לפתוח את הפרופר');
  var hint = isNet
    ? 'הקובץ לא הגיע למחשב הזה. אפשר לפתוח את הפרופר ישירות מהמחשב, ובינתיים להראות למנהל את "פרטי תקלה".'
    : isPdf
    ? 'ההורדה נקטעה באמצע והקובץ שהתקבל פגום. זה קורה בפרופרים גדולים. פתחו אותו מהמחשב, והראו למנהל את "פרטי תקלה".'
    : 'אפשר לנסות שוב, או לפתוח את הפרופר ישירות מהמחשב.';
  var code = isNet ? 'P4-NET' : isPdf ? 'P4-CUT' : 'P4-ERR';
  /* ⚠️ המדידה נשמרת ל-pvDiag: בלעדיה "פרטי תקלה" מראה רק מארחים,
     ודווקא המספרים האלה הם מה שמכריע בין קטוע לפגום. */
  window._p4LastFacts = facts;

  pvClose();
  var ov = document.createElement('div'); ov.id = 'ov';
  ov.innerHTML =
      '<div style="margin:auto;max-width:min(92vw,460px);background:#fff;border-radius:16px;padding:26px 22px;'
    + 'text-align:center;font-family:inherit;direction:rtl">'
    + '<div style="font-size:2.4rem;line-height:1;margin-bottom:10px">⚠️</div>'
    + '<div style="font-size:1.05rem;font-weight:900;color:#0f172a;margin-bottom:6px">' + esc(msg) + '</div>'
    + '<div style="font-size:.86rem;color:#475569;line-height:1.5;margin-bottom:4px">' + esc(hint) + '</div>'
    + '<div style="font-size:.78rem;color:#94a3b8;margin-bottom:16px">' + esc(label || 'פרופר')
    + ' · מספר תקלה ' + code + '</div>'
    + '<div style="display:flex;gap:8px;justify-content:center">'
    + '<button id="p4-retry" style="background:#1a1a4e;color:#fff;border:none;border-radius:10px;padding:11px 20px;'
    + 'font-size:.92rem;font-weight:800;cursor:pointer;font-family:inherit">🔄 נסה שוב · Retry</button>'
    + '<button id="p4-close" style="background:#f1f5f9;color:#334155;border:1.5px solid #cbd5e1;border-radius:10px;'
    + 'padding:11px 20px;font-size:.92rem;font-weight:800;cursor:pointer;font-family:inherit">סגור</button></div>'
    + '<button id="p4-local" style="width:100%;margin-top:14px;background:#0f766e;color:#fff;border:none;'
    + 'border-radius:10px;padding:12px;font-size:.92rem;font-weight:800;cursor:pointer;font-family:inherit">'
    + '📂 פתח פרופר מהמחשב</button>'
    + '<div style="font-size:.74rem;color:#94a3b8;margin-top:6px;line-height:1.45">'
    + 'נפתח חלון בחירת-קובץ. נווט לתיקיית הפרופרים ובחר את הקובץ.</div>'
    + pvFolderHtml()
    + '<button id="p4-diag" style="margin-top:12px;background:none;border:none;color:#64748b;font-size:.8rem;'
    + 'font-weight:700;text-decoration:underline;cursor:pointer;font-family:inherit">🔧 פרטי תקלה · Fault details</button>'
    + '<div id="p4-diag-rows" style="text-align:right;font-size:.86rem;line-height:1.9;color:#0f172a;margin-top:10px"></div>'
    + '</div>';
  document.body.appendChild(ov);
  document.getElementById('p4-close').onclick = pvClose;
  document.getElementById('p4-retry').onclick = function () { pvClose(); if (retryFn) retryFn(); };
  document.getElementById('p4-local').onclick = pvOpenLocal;
  var fc = document.getElementById('p4-folder-copy');
  if (fc) fc.onclick = pvCopyFolder;
  document.getElementById('p4-diag').onclick = function () { pvDiag(); };
  /* ⚠️ **בלי console.** סנטינל ב-press4-tests אוסר פלט-קונסול בקובץ הזה,
     והוא צודק: במסך קיוסק אין קונסול, ולכן שורה כזו היא קוד-מת שנותן
     תחושת-בטחון מזויפת. כל מה שצריך להיאמר — נאמר על המסך. */
}

/* ⚠️ **הנתון שסוגר את האבחון הוא origin.** ‏CORS של press4Proof מוגבל
   ל-https://solanprinting.github.io בדיוק; קיוסק שהופעל בכתובת אחרת
   (http, מראה, או עותק מקומי) ייחסם בדפדפן — וזה נראה בדיוק כמו
   "Failed to fetch" של רשת חסומה. השורה הראשונה כאן מבדילה ביניהם. */
function pvDiag() {
  var rows = document.getElementById('p4-diag-rows');
  if (!rows) return;
  rows.innerHTML = '';
  function add(h) { var d = document.createElement('div'); d.innerHTML = h; rows.appendChild(d); }

  /* ⚠️ המדידה קודמת למארחים: כשהקובץ מגיע חלקי, שלוש שורות של "נענה"
     רק מסתירות את הנתון היחיד שמסביר את התקלה. */
  /* ⚠️ המדידה נרשמה מהיום הראשון ומעולם לא הוצגה — כלומר הייתה חסרת
     ערך בדיוק במסך שאין בו קונסול. זה מה שמסביר "נפתח לאט". */
  var tm = window._p4Timing;
  if (tm) {
    add('תצוגה מהירה: <b>' + esc(tm.preview || '—') + '</b>');
    var seg = [];
    if (tm.gate) seg.push('שער ' + tm.gate + 'ms');
    if (tm.bytes) seg.push('הורדה ' + tm.bytes + 'ms');
    if (tm.parsed) seg.push('פענוח ' + tm.parsed + 'ms');
    if (tm.first) seg.push('<b>עמוד ראשון ' + tm.first + 'ms</b>');
    if (seg.length) add('זמנים: ' + seg.join(' · '));
    if (tm.size) add('גודל הקובץ: <b>' + esc(pvMB(tm.size)) + '</b> · מקור: ' + esc(tm.source || '—'));
  }
  var f = window._p4LastFacts;
  if (f) {
    add('התקבל: <b>' + esc(pvMB(f.got)) + '</b>'
      + (f.expect ? ' מתוך <b>' + esc(pvMB(f.expect)) + '</b>' : ' (השרת לא דיווח גודל)'));
    if (f.expect && f.got < f.expect) {
      add('<b style="color:#b91c1c">⚠️ הקובץ נקטע — הגיעו '
        + Math.round(f.got / f.expect * 100) + '% ממנו</b>');
    }
    add('סוג: <b>' + esc(f.ctype || '—') + '</b> · פתיחה: <b>' + esc(f.head || '—') + '</b>');
  }
  add('כתובת המסך: <b>' + esc(location.origin) + '</b>');
  add('מורשה בשרת: <b>https://solanprinting.github.io</b>');
  if (location.origin !== 'https://solanprinting.github.io') {
    add('<b style="color:#b91c1c">⚠️ הכתובת אינה תואמת — זו הסיבה</b>');
  }
  try {
    var u = (SolanAuth && SolanAuth.auth && SolanAuth.auth().currentUser) || null;
    add('מחובר: <b>' + (u ? esc(u.uid).slice(0, 28) : 'לא') + '</b>');
  } catch (e) { add('מחובר: <b>?</b>'); }

  /* ⚠️ **אין כאן בדיקת-Storage, ובכוונה.** למסך-המכונה אין ולא תהיה גישה
     ישירה ל-Storage — הפרופר מגיע דרך press4Proof בלבד, וסנטינל ב-
     press4-tests אוכף שהשם של דלי-האחסון כלל לא מופיע בקובץ הזה —
     ולכן גם ההערה הזו נמנעת מלכתוב אותו.
     הניסיון הראשון שלי כן בדק אותה; השער עצר אותי, ובצדק: זו הפרה של
     עקרון-היסוד של המסך, וגם בדיקה חסרת-טעם — הוא לא פונה לשם ממילא. */
  [['שרת הפעולות', FN + '/press4Proof'],
   ['האתר', 'https://solanprinting.github.io/solan-printing/version.txt']
  ].forEach(function (h) {
    var t0 = Date.now(), ctl;
    try { ctl = AbortSignal.timeout ? AbortSignal.timeout(12000) : undefined; } catch (e) { ctl = undefined; }
    fetch(h[1] + (h[1].indexOf('?') >= 0 ? '&' : '?') + 'cb=' + Date.now(), ctl ? { signal: ctl } : {})
      .then(function (r) { add('✅ ' + esc(h[0]) + ' — נענה (' + r.status + ') · ' + (Date.now() - t0) + 'ms'); },
            function () { add('❌ <b>' + esc(h[0]) + ' — אין תשובה</b> · ' + (Date.now() - t0) + 'ms'); });
  });
}

/* ⚠️ מסלול-גיבוי ללא רשת. קישור ל-file:// חסום מדף https ואינו אפשרי
   בקיוסק; בורר-הקבצים של הדפדפן כן נפתח ומגיע לאותה תיקייה. */
/* ═══ תיקיית-הפרופרים ברשת ═══════════════════════════════════════════════
   הנתיב נמסר ע"י הבעלים 18/08/2026.
   ⚠️ אי-אפשר לפתוח תיקייה מהדפדפן: ניווט ל-
       file://
   חסום מדף https והלחיצה שקטה, ובקיוסק סייר-הקבצים חסום ממילא. מה שכן
   עובד הוא בורר-הקבצים — ואפשר להדביק בו נתיב. לכן הנתיב מוצג ליד

   ⚠️ אותו נתיב מוצהר גם במסך-המכונה המלא, בשם
       OP_PROOF_FOLDER
   שני המסכים אינם חולקים מודול, ולכן זו הצהרה שנייה ולא ייבוא;
   ‏proof-folder-tests.js מוודא ששתיהן זהות. (שם-הקובץ של המסך השני אינו
   נכתב כאן בכוונה — סנטינל אוסר הפניה למסכים אחרים מתוך מסך-המכונה.) */
var PROOF_FOLDER = '\\\\APOGEEX\\ProoferPDFRoot';

  return '<div style="margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap">'
    + '<span style="font-size:.72rem;color:#64748b;font-weight:700">תיקיית הפרופרים:</span>'
    + '<span dir="ltr" style="font-size:.74rem;font-family:Consolas,monospace;color:#0f172a;background:#f1f5f9;'
    + 'border:1px solid #cbd5e1;border-radius:6px;padding:3px 7px;user-select:all;-webkit-user-select:all">'

    + '<div id="p4-folder-msg" style="width:100%;font-size:.72rem;color:#b45309;font-weight:700"></div>'
    + '</div>';
}
/* ⚠️ "הועתק" נאמר רק אחרי שההעתקה אושרה. ‏navigator.clipboard נחסם
   בהקשר לא-מאובטח ובחלק ממצבי-הקיוסק; יש נפילה ל-execCommand, וכששניהם
   נכשלים ההודעה נאמרת **על המסך** — בקיוסק אין קונסול שיגיד אותה. */
function pvCopyFolder() {
  var btn = document.getElementById('p4-folder-copy');
  var msg = document.getElementById('p4-folder-msg');
  var done = function (okc) {
    if (btn) {
      var t = btn.textContent;
      btn.textContent = okc ? '✓ הועתק' : '✕ לא הועתק';
      setTimeout(function () { try { btn.textContent = t; } catch (e) {} }, 2200);
    }
    if (msg) msg.textContent = okc ? '' : 'ההעתקה נחסמה בדפדפן — סמנו את הנתיב והעתיקו ידנית.';
  };
  var legacy = function () {
    try {
      var ta = document.createElement('textarea');
      ta.value = PROOF_FOLDER;
      ta.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta); ta.select();
      var okc = document.execCommand('copy');
      try { ta.remove(); } catch (e) {}
      done(!!okc);
    } catch (e) { done(false); }
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(PROOF_FOLDER).then(function () { done(true); }, legacy);
    else legacy();
  } catch (e) { legacy(); }
}

function pvOpenLocal() {
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.pdf,application/pdf,image/jpeg,image/png,.jpg,.jpeg,.png';
  inp.style.cssText = 'position:fixed;left:-9999px;top:-9999px';
  document.body.appendChild(inp);
  inp.onchange = function () {
    var f = inp.files && inp.files[0];
    try { inp.remove(); } catch (e) {}
    if (!f) return;
    pvClose();
    f.arrayBuffer().then(function (buf) { pvShowBuffer(buf, f.name || 'פרופר מהמחשב'); })
      .catch(function (e) { pvProofFail(e, f.name || 'קובץ מקומי', null); });
  };
  setTimeout(function () { try { if (inp.parentNode) inp.remove(); } catch (e) {} }, 60000);
  inp.click();
}

/* ⚠️ **ברמת-העל, ולא בתוך boot().** נמדד בייצור (03/08/2026):
   הפונקציה הוגדרה בתוך boot() ונקראה מ-doStaffLogin שיושבת ברמת-העל,
   ולכן נזרק "applyAuth is not defined" מיד אחרי כניסה שהצליחה בשרת.
   F5 עקף את זה כי מסלול-האתחול רץ בתוך boot() ומצא סשן קיים.
   הצהרת-פונקציה אינה דולפת מהפונקציה שעוטפת אותה.
   ⚠️ שני מסלולי-הכניסה — טעינת-דף וכניסת-עובד — עוברים דרך הפונקציה
   הזו בדיוק, ואין שנייה לצדה. */
/* ⚠️ **הבאג שנמדד בשטח (03/08/2026).** ‏onAuthStateChanged אינו נורה
   שוב אחרי כניסת-העובד: היא Custom Token חדש לאותו uid, ומבחינת Firebase
   המשתמש לא השתנה — רק האסימון שלו. כל שכבת-ההחלטה ישבה בתוך ההנדלר,
   ולכן היא פשוט לא רצה, והמסך נשאר על כרטיס ה-PIN.
   מהיומן: חמש כניסות **מוצלחות** של אותו עובד בשתי דקות, אפס כשלונות.
   השרת ענה "כן" בכל פעם, והמסך לא הקשיב.
   ⚠️ לכן ההחלטה יושבת בפונקציה, ו-doStaffLogin קורא לה במפורש. */
async function applyAuth(user){
  /* ⚠️ אין ניתוב ל-login.html: אין למכונה מייל וסיסמה. */
  if (!user) {
    $('gate').classList.add('hidden');
    $('app').classList.add('hidden');
    /* ⚠️ אין יותר "המחשב לא נרשם": מצב הקיוסק של Windows מוחק את נתוני
       האתר בכל סיום סשן, ולכן רישום ב-localStorage לא יכול לשרוד שם.
       במקומו — קוד-מכונה בכל הפעלה. ‏deviceCreds נשאר לתאימות עם מחשב
       שכן רשום (הוא נשלח אם קיים), אבל היעדרו אינו חוסם. */
    $('staffCard').classList.add('hidden');
    $('pinCard').classList.remove('hidden');
    $('pin').focus();
    return;
  }
  /* ⚠️ force=true, ולא לנוחות. ‏getIdTokenResult(false) מחזיר את הטוקן
     **מהמטמון**, ומיד אחרי press4StaffLogin המטמון עדיין מחזיק את האסימון
     הקודם — זה שנושא רק את קוד-המכונה, בלי staffId. התוצאה שנמדדה בשטח
     (03/08/2026): שלוש כניסות שהצליחו בשרת תוך 12 שניות, והמסך החזיר את
     המפעיל למסך ה-PIN בכל פעם. לולאה שנראית כמו "הקוד לא נכון".
     ⚠️ אותו לקח כתוב ב-build/firebase-auth.entry.js לצד claims() עצמה,
     על acceptInvite. חזר כאן מפני שהתעלמתי ממנו. */
  var claims = await SolanAuth.claims(true).catch(function(){ return {}; });

  /* ⚠️ הבדיקה כאן היא נוחות בלבד. הגבול האמיתי הוא ה-Functions, שדוחות
     כל תפקיד אחר — וחוקי B+4, שדוחים את press4 מכל נתיב ישיר. */
  if (!AuthClient.mayOpen(claims, 'press4.html')) {
    var to = AuthClient.routeFor(claims, null).to;
    if (to) location.replace(to);
    else $('gate').textContent = 'החשבון אינו מורשה למסך הזה. פנו למנהל.';
    return;
  }

  $('pinCard').classList.add('hidden');
  $('noDev').classList.add('hidden');

  /* ⚠️ קוד-המכונה פתח את המסך ותו לא. בלי עובד מזוהה כל פעולה תידחה
     בשרת ב-press_no_operator, ולכן עוצרים כאן ומבקשים PIN אישי.
     ⚠️ מנהל שנכנס לבדיקה אינו עובר כאן — אין לו אסימון-מכונה. */
  if (claims.accountType === 'machine' && !claims.staffId) {
    $('gate').classList.add('hidden');
    $('app').classList.add('hidden');
    $('staffCard').classList.remove('hidden');
    $('spin').focus();
    return;
  }
  $('staffCard').classList.add('hidden');
  /* ⚠️ הצבה ולא הוספה: ‏applyAuth רצה שוב בכל החלפת מפעיל, ו-‎+=‎ היה
     משרשר את השמות זה לזה עד שהכותרת נשברת. */
  var baseName = (window._p4BaseName === undefined)
    ? (window._p4BaseName = $('mName').textContent) : window._p4BaseName;
  if (claims.accountType !== 'machine') $('mName').textContent = baseName + ' · מנהל (בדיקה)';
  else if (claims.staffId) $('mName').textContent = baseName + ' · ' + (window._opName || '');
  $('out').classList.remove('hidden');
  $('refresh').classList.remove('hidden');
  $('gate').classList.add('hidden');
  $('app').classList.remove('hidden');

  /* ⚠️ ‏applyAuth רצה יותר מפעם אחת (כניסת-מכונה ואז כניסת-עובד, וגם
     בהחלפת מפעיל). רישום כפול של מאזין היה מריץ כל פעולה פעמיים —
     "התחל הדפסה" שנשלח פעמיים. השומר הזה הוא הסיבה שהפיצול בטוח. */
  if (!window._p4Wired) {
    window._p4Wired = true;
    $('refresh').addEventListener('click', function(){ load(false); });
    $('board').addEventListener('click', function(ev){
      var b = ev.target.closest ? ev.target.closest('button[data-act]') : null;
      if (b) act(b.dataset.act, b.dataset.key, b);
    });
  }

  await load(false);
  /* רענון מתון — כל 45 שניות, ורק כשהלשונית גלויה ואין פעולה פתוחה. */
  if (_timer) clearInterval(_timer);          /* ⚠️ בלי זה נצבר טיימר בכל ריצה */
  _timer = setInterval(function(){
    if (!_busy && document.visibilityState === 'visible') load(true);
  }, 45000);

  /* ⚠️ מסך קיוסק נשאר פתוח ימים. guardVersion רץ בטעינה בלבד, ולכן מסך
     שנפתח בבוקר המשיך להריץ קוד ישן אחרי פריסה. זה מה שקרה בפועל:
     השרת כבר החזיר גם עבודות שהושלמו, המסך הישן לא ידע להציג אותן
     בנפרד והכניס אותן לתור-ההדפסה עם כפתור "התחל", והשרת ענה
     "העבודה כבר סומנה כהושלמה". גרסת-שרת חדשה מול מסך ישן היא באג
     שלנו, לא של המפעיל.
     ⚠️ לא באמצע פעולה ולא כשהפרופר פתוח — רענון כזה מוחק עבודה. */
  setInterval(function(){
    if (_busy || document.getElementById('ov')) return;
    if (document.visibilityState !== 'visible') return;
    AuthClient.guardVersion(_BAKED);
  }, 5 * 60 * 1000);
}


function boot(){
/* ⚠️ persistence='session': ההתחברות שורדת רענון ומשמרת, ונמחקת כשסוגרים
   את הסשן. מכונה משותפת לא נשארת מחוברת לנצח. */
SolanAuth.init(FB_CONFIG, 'session');
askPersist();
SolanAuth.onAuthStateChanged(function(user){ applyAuth(user); });

/* ⚠️ יציאה מחזירה למסך ה-PIN, לא ל-login.html. */
$('out').addEventListener('click', async function(){
  if (_timer) clearInterval(_timer);
  await SolanAuth.signOut().catch(function(){});
  location.reload();
});
/* ⚠️ ניווט באותו חלון ובאותו פרופיל-דפדפן. רישום שנעשה בחלון אחר —
   או בדפדפן הרגיל במקום בקיוסק — נשמר ב-localStorage אחר, כלומר לא
   קיים כאן. ה-return מחזיר את המנהל לכאן בסיום ההגדרה. */
$('setupBtn').addEventListener('click', function(){
  location.href = 'press4-enroll.html?return=press4.html';
});
$('pinBtn').addEventListener('click', doPinLogin);
$('pin').addEventListener('keydown', function(ev){ if (ev.key === 'Enter') doPinLogin(); });
$('spinBtn').addEventListener('click', doStaffLogin);
$('spin').addEventListener('keydown', function(ev){ if (ev.key === 'Enter') doStaffLogin(); });
}   /* boot() */
</script>
