<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>הסכמי מסגרת — סולן הדפסות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>try{ if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }catch(e){}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<!-- cdnjs נחסם אצל חלק מהמשתמשים (סינון-תוכן/פרוקסי/חוסם-פרסומות) → מראות-גיבוי + אזהרה ברורה -->
<script src="lib-loader.js"></script>
<script>try{ if(window.LibLoader) LibLoader.autoFill(['pdfjs','xlsx','jszip']); }catch(e){}</script>
<script src="framework-orders.js"></script>
<script src="framework-file-reader.js"></script>
<!-- ⚠️ שומר-הכניסה (B+3.2) — חייב להיטען **לפני** הסקריפט שמבקש אסימון.
     data-mode="observe" — רואה ומדווח, עדיין לא חוסם. ראה auth-guard.js. -->
<script src="firebase-auth.bundle.js?v=1787232160"></script>
<script src="auth-client.js?v=1787232160"></script>
<!-- ⚠️ data-mode="enforce": ב-observe השומר נופל לאסימון אנונימי כשאין
     משתמש מחובר, והמסך הזה קורא נתונים פנימיים. עד עכשיו זה עבד רק
     מפני שלאנונימי היתה גישה מלאה למסד. אין נפילה-לאחור. -->
<script src="auth-guard.js?v=1787232160" data-page="framework-orders.html" data-mode="enforce"></script>
<style>
  :root{--press:#2d3561;--gold:#c9a84c;--gold-light:#e8d5a3;--line:#d0c8b8;--danger:#c62828;
        --ok:#16a34a;--bg:#e8e4dc;--card:#fff;--ink:#1a1a2e;--muted:#6b7280}
  *{box-sizing:border-box}
  body{font-family:'Heebo',Arial,sans-serif;background:var(--bg);
    background-image:repeating-linear-gradient(0deg,transparent,transparent 28px,rgba(0,0,0,.04) 28px,rgba(0,0,0,.04) 29px);
    color:var(--ink);margin:0;padding:16px;direction:rtl;min-height:100vh}
  h2{margin:0 0 8px;color:var(--press);font-weight:900} h3{margin:0 0 8px;color:var(--press);font-weight:800}
  .brand{background:var(--press);color:#fff;padding:11px 20px;border-radius:12px;margin-bottom:16px;display:flex;
    align-items:center;gap:10px;box-shadow:0 3px 12px rgba(0,0,0,.25);flex-wrap:wrap}
  .brand b{font-size:1.2rem;font-weight:900} .brand span.g{color:var(--gold)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
  button{background:#fff;color:var(--press);border:1.5px solid var(--line);border-radius:7px;padding:8px 14px;cursor:pointer;
    font-family:inherit;font-size:.9rem;font-weight:700;transition:all .15s}
  button:hover:not(:disabled){border-color:var(--gold)} button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--gold);border-color:var(--gold);color:#1a1a2e;font-weight:800}
  button.danger{color:var(--danger)}
  input,select,textarea{background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:7px;padding:8px 10px;font-family:inherit;font-size:.9rem}
  .muted{color:var(--muted);font-size:.86rem} .ok{color:#15803d;font-weight:700} .bad{color:var(--danger);font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:.88rem}
  th{background:#faf8f2;color:var(--press);text-align:right;padding:7px 9px;border-bottom:2px solid var(--line);font-weight:800}
  td{padding:7px 9px;border-bottom:1px solid #eee}
  .wrap{display:flex;gap:14px;align-items:flex-start}
  .side{flex:0 0 230px;max-width:230px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;
    position:sticky;top:8px;max-height:calc(100vh - 40px);overflow-y:auto}
  .sideT{padding:9px 12px;background:var(--press);color:#fff;font-weight:800;font-size:.86rem}
  .cItem{display:flex;justify-content:space-between;gap:8px;padding:11px 12px;cursor:pointer;border-bottom:1px solid #eee;
    font-weight:700;color:var(--press);font-size:.9rem}
  .cItem:hover{background:#faf8f2} .cItem.on{background:var(--press);color:#fff}
  .cItem .b{background:rgba(0,0,0,.1);border-radius:10px;padding:1px 8px;font-size:.75rem} .cItem.on .b{background:rgba(255,255,255,.25)}
  .main{flex:1;min-width:0}
  .bar{height:9px;background:#eee;border-radius:5px;overflow:hidden;min-width:90px}
  .bar>i{display:block;height:100%;background:var(--ok)}
  .bar.warn>i{background:#f59e0b} .bar.over>i{background:var(--danger)}
  .pill{font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:10px;white-space:nowrap;color:#fff}
  .stat{display:inline-block;background:#faf8f2;border:1px solid var(--line);border-radius:9px;padding:6px 12px;margin:0 0 6px 6px}
  .stat b{font-size:1.15rem;display:block;color:var(--press)}
  @media(max-width:760px){.wrap{flex-direction:column}.side{flex:auto;max-width:none;width:100%;position:static;max-height:220px}}
</style>
</head>
<body>
<div class="brand">
  <b>סולן <span class="g">הדפסות</span></b>
  <span style="color:var(--gold-light);font-size:.85rem">· הסכמי מסגרת ומלאי לקוחות</span>
  <span style="margin-right:auto"></span>
  <button id="newAg" class="primary">➕ הסכם חדש</button>
</div>
<div id="app"><div class="card muted">טוען…</div></div>

<script>
const $ = id => document.getElementById(id);
const FW = window.FrameworkOrders;
const _FBURL = 'https://solan-printing-default-rtdb.europe-west1.firebasedatabase.app';
const _APIKEY = 'AIzaSyAFp99furP4L5hqTI-horBHmGZC9s13dGg';
let _tok = { id:null, exp:0 };
function _isProd(){ return /solanprinting\.github\.io/.test(location.host); }
function _nowIso(){ return new Date().toISOString(); }
function _today(){ return _nowIso().slice(0,10); }
function esc(t){ return String(t==null?'':t).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function _n(v){ return (Math.round((+v||0)*100)/100).toLocaleString('he-IL'); }
// ריבוי עברי לשם-האריזה: חבילה→חבילות · אריזה→אריזות · קרטון→קרטונים
// ⚠️ אות סופית חייבת לחזור לצורה הרגילה לפני הסיומת: קרטון → קרטונים (לא "קרטוןים")
const _FIN={'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
function _plu(w){
  w=String(w||'קרטון');
  if(/ה$/.test(w)) return w.slice(0,-1)+'ות';
  const last=w.slice(-1);
  return (_FIN[last] ? w.slice(0,-1)+_FIN[last] : w)+'ים';
}
/* ── האסימון מגיע מהשומר (B+3.2) — ראה auth-guard.js ─────────────────────
   ⚠️ בלי נפילה-לאחור מקומית: שתי מערכות-אסימון במקביל = שתי זהויות שונות
   לאותו אדם. אם השומר לא נטען זו תקלת-פריסה, והיא חייבת להישמע. */
function _auth(){
  if(!window.SolanGuard) return Promise.reject(new Error('auth-guard.js לא נטען — אין מקור לאסימון'));
  return window.SolanGuard.token(false);
}
const _P='frameworkAgreements';
function _get(p){ return _auth().then(t=>fetch(_FBURL+'/'+p+'.json?auth='+t).then(r=>r.ok?r.json():null)); }
// ⚠️ חובה לבדוק r.ok — בלי זה כישלון-כתיבה (הרשאה/רשת) נראה כהצלחה והפריט "נעלם".
function _put(p,o){ return _auth().then(t=>fetch(_FBURL+'/'+p+'.json?auth='+t,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)})
  .then(r=>{ if(!r.ok) return r.text().then(x=>{ throw new Error('כתיבה נכשלה ('+r.status+') '+String(x||'').slice(0,120)); }); return r; })); }

let _all = [], _sel = null, _busy = false;

// ⚠️ נרמול-רשומה מ-Firebase RTDB — שני מלכודות ידועות:
//   1) מערך *ריק* לא נשמר כלל → הסכם חדש חוזר בלי items/movements → items.push קורס.
//   2) מערך עם "חורים" חוזר כ*אובייקט* ({0:…,2:…}) → Array.isArray נכשל.
// בלי הנרמול הזה "הוספת פריט" פשוט לא עבדה.
function _arr(v){
  if (Array.isArray(v)) return v.filter(x=>x!=null);
  if (v && typeof v==='object') return Object.keys(v).sort((a,b)=>(+a)-(+b)).map(k=>v[k]).filter(x=>x!=null);
  return [];
}
function _normAg(a){
  if(!a || typeof a!=='object') return a;
  a.items = _arr(a.items);
  a.movements = _arr(a.movements);
  a.orders = _arr(a.orders).map(o=>{ if(o){ o.lines=_arr(o.lines); if(o.ready) o.ready.lines=_arr(o.ready.lines); } return o; });
  a.topups = _arr(a.topups).map(t=>{ if(t) t.lines=_arr(t.lines); return t; });
  a.deliveryNotes = _arr(a.deliveryNotes).map(d=>{ if(d){ d.lines=_arr(d.lines); d.orders=_arr(d.orders); } return d; });
  return a;
}

async function load(){
  try{
    const obj = await _get(_P);
    _all = obj && typeof obj==='object' ? Object.values(obj).filter(a=>a&&a.agreementId).map(_normAg) : [];
    _all.sort((a,b)=> String(a.customer||'').localeCompare(String(b.customer||''),'he'));
  }catch(e){ _all=[]; }
  if(_sel && !_all.some(a=>a.agreementId===_sel)) _sel=null;
  if(!_sel && _all.length) _sel=_all[0].agreementId;
  render();
}
function cur(){ return _all.find(a=>a.agreementId===_sel)||null; }
async function save(ag){
  if(!_isProd()){ alert('שמירה פועלת רק באתר החי (הגנת-סביבה).'); return false; }
  if(_busy){ alert("פעולה קודמת עדיין נשמרת — נסו שוב בעוד רגע"); return false; } _busy=true;
  _normAg(ag);
  try{ await _put(_P+'/'+ag.agreementId, ag);
    const i=_all.findIndex(a=>a.agreementId===ag.agreementId);
    if(i>=0) _all[i]=ag; else _all.push(ag);
    return true;
  }catch(e){ alert('שמירה נכשלה: '+(e.message||e)); return false; }
  finally{ _busy=false; }
}

function render(){
  const side = _all.length ? _all.map(a=>{
    const b=FW.computeBalances(a), on=(a.agreementId===_sel);
    const al=FW.alerts(a,{todayIso:_today()}).length;
    return `<div class="cItem${on?' on':''}" data-a="${a.agreementId}">
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${FW.kindLabel(a.kind).slice(0,2)} ${esc(a.customer)}${a.agreementNo?` <span style="opacity:.7;font-weight:500;font-size:.8rem">#${esc(a.agreementNo)}</span>`:''}</span>
      <span class="b" title="${FW.kindLabel(a.kind)}">${a.kind!=='framework'
        ? ((a.orders||[]).filter(o=>o&&(o.status==='pending'||o.status==='ready')).length+' פתוחות')
        : (b.totals.pctUsed+'%'+(al?' ⚠':''))}</span></div>`;
  }).join('') : '<div style="padding:14px" class="muted">אין הסכמים עדיין</div>';

  const a = cur();
  $('app').innerHTML = `<div class="wrap">
    <aside class="side"><div class="sideT">לקוחות (${_all.length})</div>${side}</aside>
    <section class="main">${a?detail(a):'<div class="card muted">בחרו הסכם מהרשימה, או צרו הסכם חדש.</div>'}</section>
  </div>`;
  document.querySelectorAll('[data-a]').forEach(el=>el.onclick=()=>{ _sel=el.dataset.a; render(); });
  if(a) wire(a);
}

function detail(a){
  const b = FW.computeBalances(a), t = b.totals;
  const al = FW.alerts(a,{todayIso:_today()});
  const alHtml = al.length ? `<div class="card" style="border-color:#f59e0b;background:#fffbeb">
    <b style="color:#b45309">⚠️ התראות</b><ul style="margin:6px 0 0;padding-inline-start:18px">
    ${al.map(x=> x.level==='short' ? `<li><b>${esc(x.name)}</b>${x.sku?' ('+esc(x.sku)+')':''} — <b>המלאי לא מספיק להזמנות הממתינות</b>: יתרה ${x.remaining.toLocaleString()} מול ${x.pending.toLocaleString()} משוריין (חסר ${x.shortBy.toLocaleString()})</li>`
      : x.level==='out' ? `<li><b>${esc(x.name)}</b>${x.sku?' ('+esc(x.sku)+')':''} — אזל (יתרה ${x.remaining})</li>`
      : x.level==='low' ? `<li><b>${esc(x.name)}</b>${x.sku?' ('+esc(x.sku)+')':''} — יתרה נמוכה (${x.remaining})</li>`
      : x.level==='budget' ? `<li>חריגה מהתקרה הכספית ב-<b>₪${_n(x.over)}</b></li>`
      : `<li>ההסכם פג ב-${esc(x.endDate)}</li>`).join('')}</ul></div>` : '';

  const rows = b.items.map(r=>{
    const pct = r.agreedQty>0 ? Math.max(0,Math.min(100, Math.round((r.agreedQty-r.remainingQty)/r.agreedQty*100))) : 0;
    const cls = r.over?'over':(r.agreedQty>0 && r.remainingQty/r.agreedQty<=0.15?'warn':'');
    return `<tr>
      <td>${r.sku?`<code>${esc(r.sku)}</code>`:'<span class="muted">—</span>'}</td>
      <td><b>${esc(r.name)}</b></td>
      <td>${r.agreedQty.toLocaleString()} <span class="muted">${esc(r.unit)}</span></td>
      <td>${r.packSize?(r.packSize.toLocaleString()+' <span class="muted">/'+esc(r.packName)+'</span>'):'<span class="muted">—</span>'}</td>
      <td>${(r.drawnQty-r.returnedQty).toLocaleString()}</td>
      <td class="${r.over?'bad':''}"><b>${r.remainingQty.toLocaleString()}</b>${r.remainingPacks!=null?`<div class="muted" style="font-size:.75rem">≈ ${r.remainingPacks.toLocaleString()} ${esc(_plu(r.packName))}</div>`:''}</td>
      <td>${r.pendingQty?`<span style="color:#b45309;font-weight:700">${r.pendingQty.toLocaleString()}</span>`:'<span class="muted">—</span>'}</td>
      <td class="${r.shortForPending?'bad':''}"><b>${r.availableQty.toLocaleString()}</b>${r.shortForPending?' ⚠':''}</td>
      <td style="min-width:110px"><div class="bar ${cls}"><i style="width:${pct}%"></i></div><span class="muted" style="font-size:.75rem">${pct}%</span></td>
      <td>${r.price1000?('₪'+_n(r.price1000)+'<div class="muted" style="font-size:.72rem">ל-1000</div>'):'—'}</td>
      <td>${r.agreedValue?('₪'+_n(r.remainingValue)):'—'}</td>
      <td style="white-space:nowrap">
        <button class="drawBtn" data-i="${r.itemId}">➖ משיכה</button>
        <button class="retBtn" data-i="${r.itemId}">➕ החזרה</button>
        <button class="delItem danger" data-i="${r.itemId}" title="מחק פריט">🗑</button></td>
    </tr>`;
  }).join('') || '<tr><td colspan="12" class="muted" style="text-align:center;padding:14px">אין פריטים — הוסיפו פריט להסכם</td></tr>';

  // הזמנות ממתינות — משוריינות, לא ירדו מהמלאי עד אישור האספקה
  const pend = (a.orders||[]).filter(o=>o&&(o.status==='pending'||o.status==='ready'));
  const hist = (a.orders||[]).filter(o=>o&&o.status!=='pending'&&o.status!=='ready').slice().reverse().slice(0,10);
  const oRow = (o,isPend)=>{
    const names=(o.lines||[]).map(l=>{ const it=(a.items||[]).find(x=>x.itemId===l.itemId);
      return `${esc((it&&it.name)||l.name||'')} — ${l.qty.toLocaleString()}${l.packs?` <span class="muted">(${l.packs} ${esc(_plu(l.packName))})</span>`:''}`; }).join('<br>');
    return `<tr><td>${esc(o.date||'')}</td><td><b>${esc(o.orderRef||o.poNumber||o.orderId)}</b></td>
      <td style="font-size:.84rem">${names}</td><td>${(o.qty||0).toLocaleString()}</td><td>₪${_n(o.value)}</td>
      <td>${o.status==='pending'?'<span class="pill" style="background:#f59e0b">ממתין לייצור</span>'
          : o.status==='ready'?`<span class="pill" style="background:#16a34a">מוכן — אצל הפקיד</span>${o.ready&&o.ready.packs?`<div class="muted" style="font-size:.75rem">יצאו ${o.ready.packs.toLocaleString()} אריזות</div>`:''}`
          : o.status==='supplied'?`<span class="pill" style="background:#2d3561">סופק ${esc(o.suppliedAt||'')}</span>`
          : '<span class="pill" style="background:#6b7280">בוטל</span>'}</td>
      <td style="white-space:nowrap">${isPend?`<button class="rdyBtn primary" data-o="${o.orderId}" title="סמן שההזמנה מוכנה — תופיע אצל הפקיד להוצאת תעודת משלוח">✅ מוכן</button>
        <button class="supBtn" data-o="${o.orderId}">✓ אשר אספקה</button>
        <button class="canBtn danger" data-o="${o.orderId}">✗ בטל</button>`
        : o.status==='ready'?`<button class="supBtn" data-o="${o.orderId}">✓ אשר אספקה</button>
        <button class="unrBtn" data-o="${o.orderId}" title="בטל סימון מוכן">↩</button>`:''}</td></tr>`;
  };
  const ordersCard = `<div class="card" style="${pend.length?'border-color:#f59e0b':''}">
    <h3 style="margin:0 0 8px">🚚 הזמנות לקוח ${pend.length?`<span class="pill" style="background:#f59e0b">${pend.length} פתוחות</span>`:''}</h3>
    <div class="muted" style="margin-bottom:8px">הזמנה שנקלטה <b>משריינת</b> את הכמות בלבד — המלאי יורד רק בלחיצה על <b>✓ אשר אספקה</b>.</div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>תאריך</th><th>הזמנה</th><th>פריטים</th><th>יח׳</th><th>לחיוב</th><th>סטטוס</th><th></th></tr></thead>
      <tbody>${(pend.map(o=>oRow(o,true)).join('') + hist.map(o=>oRow(o,false)).join(''))
        || '<tr><td colspan="7" class="muted" style="text-align:center;padding:10px">אין הזמנות עדיין</td></tr>'}</tbody></table></div>
  </div>`;

  const moves = (a.movements||[]).slice().reverse().slice(0,25).map(m=>{
    const it=(a.items||[]).find(x=>x.itemId===m.itemId);
    return `<tr><td>${esc(m.date||'')}</td><td>${it?esc(it.name):'<span class="muted">(פריט שנמחק)</span>'}</td>
      <td>${m.type==='draw'?'<span class="pill" style="background:#dc2626">משיכה</span>':'<span class="pill" style="background:#16a34a">החזרה</span>'}</td>
      <td>${m.packs>0?`<b>${m.packs.toLocaleString()} ${esc(_plu(it&&it.packName))}</b><div class="muted" style="font-size:.75rem">${m.qty.toLocaleString()} יח׳${m.packSize?' (×'+m.packSize.toLocaleString()+')':''}</div>`:m.qty.toLocaleString()+' <span class="muted">יח׳</span>'}</td>
      <td>${esc(m.orderRef||'')}</td><td class="muted">${esc(m.notes||'')}</td>
      <td><button class="delMove danger" data-m="${m.moveId}" title="בטל תנועה">🗑</button></td></tr>`;
  }).join('') || '<tr><td colspan="7" class="muted" style="text-align:center;padding:10px">אין תנועות עדיין</td></tr>';

  return `${alHtml}
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <div><h3 style="margin:0">📄 ${esc(a.title||a.customer)}</h3>
        <div class="muted">${esc(a.customer)}${a.startDate?' · מ-'+esc(a.startDate):''}${a.endDate?' · עד '+esc(a.endDate):''} · ${esc(a.status)}</div>

      <tbody>${rows}</tbody></table></div>

  <div class="card"><h3>🧾 תנועות אחרונות</h3>

function wire(a){
  $('addItem').onclick = async ()=>{
    const name=prompt('שם הפריט:'); if(!name) return;
    const sku=prompt('מק״ט (אפשר להשאיר ריק):','')||'';
    const qty=parseInt(prompt('כמות מוסכמת:','0'),10)||0;
    const price=parseFloat(prompt('מחיר ל-1000 יח׳ (₪) — 0 אם לא רלוונטי:','0'))||0;
    const packSize=parseInt(prompt('כמה יח׳ בקרטון/חבילה? (0 = לא רלוונטי):','0'),10)||0;
    const b=FW.buildItem({name,sku,qty,price1000:price,packSize});
    if(!b.ok){ alert('פריט לא תקין: '+b.errors.join(', ')); return; }
    const ag=_normAg(JSON.parse(JSON.stringify(a))); ag.items.push(b.item);
    if(await save(ag)) render();
  };
  document.querySelectorAll('.drawBtn').forEach(btn=>btn.onclick=()=>_move(a,btn.dataset.i,'draw'));
  document.querySelectorAll('.retBtn').forEach(btn=>btn.onclick=()=>_move(a,btn.dataset.i,'return'));
  document.querySelectorAll('.delItem').forEach(btn=>btn.onclick=async()=>{
    const it=(a.items||[]).find(x=>x.itemId===btn.dataset.i); if(!it) return;
    if(!confirm('למחוק את "'+it.name+'"?\n(תנועות שנרשמו עליו יישמרו בהיסטוריה)')) return;
    const ag=_normAg(JSON.parse(JSON.stringify(a))); ag.items=ag.items.filter(x=>x.itemId!==btn.dataset.i);
    if(await save(ag)) render();
  });
  document.querySelectorAll('.delMove').forEach(btn=>btn.onclick=async()=>{
    if(!confirm('לבטל את התנועה? היתרה תחזור אוטומטית.')) return;
    const ag=_normAg(JSON.parse(JSON.stringify(a))); ag.movements=(ag.movements||[]).filter(m=>m.moveId!==btn.dataset.m);
    if(await save(ag)) render();
  });
  // ✅ "מוכן" — נשאל כמה יצא בפועל מכל פריט, וההזמנה עוברת לפקיד להוצאת תעודת משלוח
  document.querySelectorAll('.rdyBtn').forEach(btn=>btn.onclick=async()=>{
    const o=FW.findOrder(a,btn.dataset.o); if(!o) return;
    const rows=[];
    for(const ln of (o.lines||[])){
      const it=(a.items||[]).find(x=>x.itemId===ln.itemId)||{};
      const nm=(it.name||ln.name||'');
      if(ln.packSize>0){
        const ans=prompt('כמה '+_plu(it.packName||'קרטון')+' יצאו בפועל מ-"'+nm+'"?\n(הוזמנו '+(ln.packs||0).toLocaleString()+' = '+ln.qty.toLocaleString()+' יח׳)', String(ln.packs||0));
        if(ans===null) return;
        rows.push({itemId:ln.itemId, packs:parseInt(ans,10)||0});
      } else {
        const ans=prompt('כמה יח׳ יצאו בפועל מ-"'+nm+'"?\n(הוזמנו '+ln.qty.toLocaleString()+')', String(ln.qty));
        if(ans===null) return;
        rows.push({itemId:ln.itemId, qty:parseInt(ans,10)||0});
      }
    }
    const note=prompt('הערה לפקיד (אופציונלי):','')||'';
    const res=FW.markReady(a,o.orderId,{rows,date:_today(),by:'מנהל',notes:note});
    if(!res.ok){ alert('נכשל: '+res.errors.join(', ')); return; }
    if(await save(_normAg(res.agreement))){ render();
      alert('✓ ההזמנה סומנה כמוכנה ('+res.order.ready.packs.toLocaleString()+' אריזות · '+res.order.ready.qty.toLocaleString()+' יח׳).\nהיא מופיעה עכשיו אצל הפקיד להוצאת תעודת משלוח.'); }
  });
  document.querySelectorAll('.unrBtn').forEach(btn=>btn.onclick=async()=>{
    const res=FW.unmarkReady(a,btn.dataset.o);
    if(!res.ok){ alert('נכשל: '+res.errors.join(', ')); return; }
    if(await save(_normAg(res.agreement))) render();
  });
  // ✓ אישור אספקה — הנקודה היחידה שבה המלאי באמת יורד
  document.querySelectorAll('.supBtn').forEach(btn=>btn.onclick=async()=>{
    const o=FW.findOrder(a,btn.dataset.o); if(!o) return;
    if(!confirm('לאשר שההזמנה '+(o.orderRef||o.orderId)+' סופקה ללקוח?\n\n'+(o.qty||0).toLocaleString()+' יח׳ ירדו עכשיו מהמלאי.')) return;
    const res=FW.supplyOrder(a,o.orderId,{date:_today(),by:'מנהל'});
    if(!res.ok){ alert('נכשל: '+res.errors.join(', ')); return; }
    if(await save(_normAg(res.agreement))) render();
  });
  document.querySelectorAll('.canBtn').forEach(btn=>btn.onclick=async()=>{
    const o=FW.findOrder(a,btn.dataset.o); if(!o) return;
    if(!confirm('לבטל את ההזמנה '+(o.orderRef||o.orderId)+'?\nהשריון ישוחרר (המלאי ממילא לא ירד).')) return;
    const res=FW.cancelOrder(a,o.orderId,{});
    if(!res.ok){ alert('נכשל: '+res.errors.join(', ')); return; }
    if(await save(_normAg(res.agreement))) render();
  });
  $('impStock').onclick = ()=>_impOpen('stock');
  $('impOrder').onclick = ()=>_impOpen('order');
  $('quickDraw').onclick = ()=>{
    const q=prompt('מק״ט או שם הפריט:'); if(!q) return;
    const it=FW.findItem(a,q);
    if(!it){ alert('לא נמצא פריט מתאים ל-"'+q+'"'); return; }
    _move(a,it.itemId,'draw');
  };
  $('editAg').onclick = async ()=>{
    const ag=_normAg(JSON.parse(JSON.stringify(a)));
    const t=prompt('כותרת ההסכם:',ag.title||''); if(t===null) return; ag.title=t.trim()||ag.title;
    const k=_askKind(ag.kind); if(k) ag.kind=k;
    const an=prompt('מספר הסכם:',ag.agreementNo||''); if(an!==null) ag.agreementNo=an.trim()||null;
    const po=prompt('מספר הזמנת רכש (PO):',ag.poNumber||''); if(po!==null) ag.poNumber=po.trim()||null;
    const e=prompt('תאריך סיום (YYYY-MM-DD, ריק=ללא):',ag.endDate||''); if(e!==null) ag.endDate=e.trim()||null;
    const bd=prompt('תקרה כספית ₪ (0=ללא):',String(ag.budget||0)); if(bd!==null) ag.budget=parseFloat(bd)||0;
    if(await save(ag)) render();
  };
  $('delAg').onclick = async ()=>{
    if(!confirm('למחוק את ההסכם של "'+a.customer+'" כולל כל התנועות?\nפעולה בלתי-הפיכה.')) return;
    if(!_isProd()){ alert('מחיקה פועלת רק באתר החי.'); return; }
    try{ await _put(_P+'/'+a.agreementId, null); _all=_all.filter(x=>x.agreementId!==a.agreementId); _sel=null; await load(); }
    catch(e){ alert('מחיקה נכשלה: '+(e.message||e)); }
  };
}

// קטגוריית הלקוח — קובעת איפה הוא יופיע בתפריט המשרד
function _askKind(cur){
  const opts=FW.KINDS.map((k,i)=>(i+1)+') '+FW.kindLabel(k)).join('\n');
  const def=String(FW.KINDS.indexOf(FW.kindOf(cur))+1);
  const ans=prompt('קטגוריית הלקוח:\n'+opts, def);
  if(ans===null) return null;
  const i=parseInt(ans,10)-1;
  return FW.KINDS[i]||FW.kindOf(cur);
}

async function _move(a, itemId, type){
  const it=(a.items||[]).find(x=>x.itemId===itemId); if(!it) return;
  const label = type==='draw' ? 'משיכה' : 'החזרה';
  const packSize=parseInt(it.packSize,10)||0, packName=it.packName||'קרטון';
  let qty=0, packs=0;
  // פריט הארוז בקרטונים → מבקשים קרטונים, והמלאי יורד ביחידות לפי גודל-הקרטון
  if(packSize>0){
    const ans=prompt(label+' — כמה '+_plu(packName)+' עבור "'+it.name+'"?\n('+packSize.toLocaleString()+' יח׳ ב'+packName+' · השאירו ריק כדי להזין יחידות ישירות)','0');
    if(ans===null) return;
    packs=parseInt(ans,10)||0;
    if(packs>0){
      qty=packs*packSize;
      if(!confirm(packs.toLocaleString()+' '+_plu(packName)+' × '+packSize.toLocaleString()+' = '+qty.toLocaleString()+' יח׳\n\nל'+label+' מהמלאי?')) return;
    }
  }
  if(qty<=0){
    qty=parseInt(prompt(label+' — כמות ביחידות עבור "'+it.name+'":','0'),10)||0;
    packs = packSize>0 ? Math.floor(qty/packSize) : 0;      // לתיעוד בלבד
  }
  if(qty<=0) return;
  if(type==='draw'){
    const chk=FW.checkDraw(a,itemId,qty);
    if(chk.ok && chk.exceeds && !confirm('⚠️ המשיכה חורגת מהיתרה ב-'+chk.shortBy.toLocaleString()+' יח׳.\nיתרה נוכחית: '+chk.remainingBefore.toLocaleString()+'\nלהמשיך בכל זאת?')) return;
  }
  const ref=prompt('מס׳ הזמנה / כרטיס-עבודה (אופציונלי):','')||'';
  const res=FW.applyMovement(a,{ itemId, type, qty, packs:packs||null, packSize:packSize||null, orderRef:ref, date:_today(), by:'מנהל' });
  if(!res.ok){ alert('נכשל: '+res.errors.join(', ')); return; }
  if(await save(res.agreement)) render();
}

/* ═══════════ ייבוא מקובץ: PDF / אקסל / CSV / הדבקה ═══════════
   שני מצבים: 'stock' = הוספת פריטים+כמויות להסכם · 'order' = משיכה על-חשבון ההסכם.
   בשניהם: ניתוח → טבלה *הניתנת לעריכה* → אישור. אף פעם לא מחילים בלי שהמשתמש ראה. */
let _impMode='order', _impRows=[], _impSheet=null;   // _impSheet = שורות-גיליון (אקסל/CSV)

// קריאת קובץ (אקסל/וורד/PDF/CSV) — מימוש משותף עם מסך המשרד
const _readFile = f => FWFile.read(f);

function _impOpen(mode){
  _impMode=mode; _impRows=[];
  const isOrder = mode==='order';
  let m=$('impModal');
  if(!m){ m=document.createElement('div'); m.id='impModal'; document.body.appendChild(m); }
  m.style.cssText='position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;padding:14px';
  m.innerHTML=`<div style="background:#fff;border-radius:14px;max-width:900px;width:97vw;max-height:92vh;overflow:auto;padding:16px 18px">
    <h3 style="margin:0 0 4px">${isOrder?'🧾 קליטת הזמנה — בדיקה מול המלאי (ללא הורדה)':'📥 הוספה למלאי — הזמנת רכש / הסכם חדש'}</h3>
    <div class="muted" style="margin-bottom:10px">העלו PDF / אקסל / וורד / CSV, או הדביקו שורות. הכלי ינתח — ותוכלו <b>לערוך כל שורה</b> לפני האישור.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
      <input type="file" id="impFile" accept=".pdf,.xlsx,.xls,.docx,.csv,.txt">
      <span class="muted">או הדביקו:</span>
    </div>
    <textarea id="impText" placeholder="מק״ט, שם פריט, כמות&#10;AL-100, עלון שבועי, 5000" style="width:100%;height:90px"></textarea>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0">
      <button id="impParse" class="primary">🔍 נתח</button>
      <span id="impMsg" class="muted"></span>
    </div>
    <div id="impPrev"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:flex-end">
      <button id="impCancel">ביטול</button>
      <button id="impApply" class="primary" disabled>${isOrder?'✓ קלוט הזמנה (שריון)':'✓ אשר והוסף למלאי'}</button>
    </div></div>`;
  $('impCancel').onclick=()=>m.remove();
  $('impFile').onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    $('impMsg').textContent='קורא '+f.name+'…';
    try{
      const res=await _readFile(f);
      _impSheet = res.rows || null;                 // שורות-גיליון → ניתוח לפי עמודות
      $('impText').value = res.text || '';
      $('impMsg').innerHTML='<span class="ok">✓ נקרא '+esc(f.name)+' — מנתח…</span>';
      _impParse();
    }
    catch(err){ _impSheet=null; $('impMsg').innerHTML='<span class="bad">קריאה נכשלה: '+esc(err.message||err)+'</span>'; }
  };
  $('impText').oninput=()=>{ _impSheet=null; };   // הקלדה ידנית → ניתוח טקסט
  $('impParse').onclick=_impParse;
  $('impApply').onclick=_impApply;
}

function _impParse(){
  const a=cur(); if(!a) return;
  // גיליון (אקסל/CSV) → ניתוח לפי עמודות (אמין); אחרת → ניתוח-טקסט
  let lines, srcNote='';
  if(_impSheet && _impSheet.length){ const ps=FW.parseSheetRows(_impSheet); lines=ps.lines;
    srcNote = ps.header ? ' <span class="muted">(זוהו עמודות: מק״ט/שם/כמות)</span>' : ' <span class="muted">(ללא כותרת — זוהה אוטומטית)</span>'; }
  else lines=FW.parseOrderText($('impText').value||'');
  if(!lines.length){ $('impMsg').innerHTML='<span class="bad">לא זוהו שורות עם כמות. אפשר להקליד ידנית בפורמט: שם, כמות</span>'; $('impPrev').innerHTML=''; return; }
  if(_impMode==='order'){
    const m=FW.matchOrder(a,lines);
    _impRows=m.rows;
    $('impMsg').innerHTML=srcNote+`זוהו <b>${m.rows.length}</b> שורות · ${m.summary.unmatched?('<span class="bad">'+m.summary.unmatched+' לא שויכו</span>'):'<span class="ok">כולן שויכו</span>'}${m.summary.exceeding?(' · <span class="bad">'+m.summary.exceeding+' חורגות</span>'):''}`;
    $('impPrev').innerHTML='<div style="overflow-x:auto"><table><thead><tr><th>שורה מהקובץ</th><th>פריט בהסכם</th><th>קרטונים</th><th>יח׳ סה״כ</th><th>פנוי לפני</th><th>פנוי אחרי</th><th>לחיוב</th></tr></thead><tbody>'
      + _impRows.map((r,i)=>{
          const opts=(a.items||[]).map(it=>`<option value="${it.itemId}"${r.itemId===it.itemId?' selected':''}>${esc(it.name)}${it.sku?' ('+esc(it.sku)+')':''}</option>`).join('');
          return `<tr${r.exceeds?' style="background:#fff7ed"':''}>
            <td class="muted" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(r.raw)}">${esc(r.raw)}</td>
            <td><select class="impIt" data-i="${i}"><option value="">— דלג —</option>${opts}</select></td>
            <td>${r.packSize?`<input type="number" class="impPacks" data-i="${i}" value="${r.packs||0}" min="0" style="width:72px"><div class="muted" style="font-size:.72rem">×${r.packSize.toLocaleString()}</div>`:'<span class="muted">—</span>'}</td>
            <td><input type="number" class="impQty" data-i="${i}" value="${r.qty}" min="0" style="width:100px"></td>
            <td>${r.matched?r.before.toLocaleString():'—'}</td>
            <td class="${r.exceeds?'bad':''}"><b>${r.matched?r.after.toLocaleString():'—'}</b>${r.exceeds?' ⚠':''}</td>
            <td>${r.matched&&r.price1000?`₪${_n(r.value)}<div class="muted" style="font-size:.72rem">${_n(r.thousands)}×₪${_n(r.price1000)}</div>`:'<span class="muted">—</span>'}</td></tr>`;
        }).join('') + '</tbody></table></div>';
    _impBind();
  } else {
    _impRows=lines.map(l=>({ raw:l.raw, sku:l.sku||'', name:l.name||l.sku||'', qty:l.qty, unitPrice:l.unitPrice||0, packSize:0 }));
    $('impMsg').innerHTML=srcNote+`זוהו <b>${_impRows.length}</b> פריטים — ערכו לפי הצורך`;
    $('impPrev').innerHTML='<div style="overflow-x:auto"><table><thead><tr><th>שורה מהקובץ</th><th>מק״ט</th><th>שם פריט</th><th>כמות (יח׳)</th><th>יח׳ בקרטון</th><th>מחיר ל-1000</th></tr></thead><tbody>'
      + _impRows.map((r,i)=>`<tr>
          <td class="muted" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(r.raw)}">${esc(r.raw)}</td>
          <td><input class="impSku" data-i="${i}" value="${esc(r.sku)}" style="width:100px" placeholder="ריק=ללא"></td>
          <td><input class="impName" data-i="${i}" value="${esc(r.name)}" style="width:190px"></td>
          <td><input type="number" class="impQty" data-i="${i}" value="${r.qty}" min="0" style="width:100px"></td>
          <td><input type="number" class="impPack" data-i="${i}" value="${r.packSize||0}" min="0" style="width:90px"></td>
          <td><input type="number" class="impPrice" data-i="${i}" value="${r.unitPrice||0}" min="0" step="0.01" style="width:90px"></td></tr>`).join('')
      + '</tbody></table></div>';
    _impBind();
  }
  $('impApply').disabled=false;
}

function _impBind(){
  const a=cur();
  document.querySelectorAll('.impQty').forEach(el=>el.onchange=e=>{ const i=+e.target.dataset.i;
    _impRows[i].qty=parseInt(e.target.value,10)||0; _impRows[i].packs=0;   // עריכת יח׳ ידנית גוברת על קרטונים
    if(_impMode==='order') _impRecalc(); });
  document.querySelectorAll('.impPacks').forEach(el=>el.onchange=e=>{ const i=+e.target.dataset.i;
    _impRows[i].packs=parseInt(e.target.value,10)||0; _impRecalc(); });   // קרטונים → יח׳ אוטומטית
  document.querySelectorAll('.impIt').forEach(el=>el.onchange=e=>{ const i=+e.target.dataset.i, id=e.target.value;
    _impRows[i].itemId=id||null; _impRows[i].matched=!!id; _impRecalc(); });
  document.querySelectorAll('.impSku').forEach(el=>el.onchange=e=>{ _impRows[+e.target.dataset.i].sku=e.target.value.trim(); });
  document.querySelectorAll('.impName').forEach(el=>el.onchange=e=>{ _impRows[+e.target.dataset.i].name=e.target.value.trim(); });
  document.querySelectorAll('.impPrice').forEach(el=>el.onchange=e=>{ _impRows[+e.target.dataset.i].unitPrice=parseFloat(e.target.value)||0; });
  document.querySelectorAll('.impPack').forEach(el=>el.onchange=e=>{ _impRows[+e.target.dataset.i].packSize=parseInt(e.target.value,10)||0; });
}
// חישוב-מחדש של לפני/יורד/אחרי אחרי עריכה ידנית (כולל הצטברות של כמה שורות לאותו פריט)
function _impRecalc(){
  const a=cur(); if(!a) return;
  const b=FW.computeBalances(a), byId={}; b.items.forEach(r=>byId[r.itemId]=r);
  const used={};
  _impRows.forEach(r=>{
    const it = r.itemId ? byId[r.itemId] : null;
    if(!r.matched||!it){ r.before=null; r.after=null; r.exceeds=false; r.value=0; return; }
    r.packSize = it.packSize||0; r.packName = it.packName||'קרטון'; r.price1000 = it.price1000||0;
    if(r.packSize>0 && r.packs>0) r.qty = r.packs * r.packSize;      // קרטונים → יחידות
    const prior=used[r.itemId]||0;
    r.before=it.availableQty-prior; used[r.itemId]=prior+(r.qty||0);   // מול המלאי הפנוי (אחרי שריון)
    r.after=r.before-(r.qty||0); r.exceeds=r.after<0;
    r.thousands=(r.qty||0)/1000; r.value=r.thousands*r.price1000;    // חיוב לפי מחיר-ל-1000
  });
  const rows=document.querySelectorAll('#impPrev tbody tr');
  _impRows.forEach((r,i)=>{ const tr=rows[i]; if(!tr) return;
    tr.style.background=r.exceeds?'#fff7ed':'';
    const qIn=tr.querySelector('.impQty'); if(qIn && String(qIn.value)!==String(r.qty)) qIn.value=r.qty;   // סנכרון יח׳
    tr.children[4].textContent = r.matched?Number(r.before).toLocaleString():'—';
    const c5=tr.children[5]; c5.className=r.exceeds?'bad':'';
    c5.innerHTML = '<b>'+(r.matched?Number(r.after).toLocaleString():'—')+'</b>'+(r.exceeds?' ⚠':'');
    const c6=tr.children[6];
    if(c6) c6.innerHTML = (r.matched&&r.price1000) ? ('₪'+_n(r.value)+'<div class="muted" style="font-size:.72rem">'+_n(r.thousands)+'×₪'+_n(r.price1000)+'</div>') : '<span class="muted">—</span>';
  });
  // סיכום-חיוב כולל להזמנה
  const tot=_impRows.filter(r=>r.matched).reduce((s,r)=>s+(r.value||0),0);
  const el=$('impMsg'); if(el && tot>0 && !/סה״כ לחיוב/.test(el.innerHTML)) el.innerHTML += ' · <b>סה״כ לחיוב: ₪'+_n(tot)+'</b>';
}

async function _impApply(){
  const a=cur(); if(!a) return;
  if(_impMode==='order'){
    const use=_impRows.filter(r=>r.matched&&r.itemId&&r.qty>0);
    if(!use.length){ alert('אין שורות לקליטה'); return; }
    const over=use.filter(r=>r.exceeds);
    if(over.length && !confirm('⚠️ '+over.length+' שורות חורגות מהמלאי הפנוי.\nלקלוט בכל זאת?')) return;
    const ref=prompt('מס׳ הזמנה / הזמנת רכש של הלקוח:','')||'';
    // ⚠️ קליטה = שריון בלבד. המלאי יורד רק ב"✓ אשר אספקה".
    const res=FW.placeOrder(a,use,{orderRef:ref,date:_today(),by:'מנהל'});
    if(!res.ok){ alert('נכשל: '+res.errors.join(', ')); return; }
    if(await save(_normAg(res.agreement))){ $('impModal').remove(); render();
      alert('✓ ההזמנה נקלטה ומשוריינת.\nהמלאי טרם ירד — לחצו "✓ אשר אספקה" אחרי שהסחורה סופקה ללקוח.'); }
  } else {
    // פריט שכבר קיים אצל הלקוח מצטבר לכמות הקיימת (לא נפתחת כפילות)
    const src=prompt('מקור ההוספה — מס׳ הזמנת רכש / מס׳ הסכם (אפשר להשאיר ריק):','')||'';
    const res=FW.applyStock(a,_impRows,{source:'po',poNumber:src,date:_today(),by:'מנהל'});
    if(!res.ok){ alert('לא נוספו פריטים: '+res.errors.join(', ')); return; }
    if(await save(_normAg(res.agreement))){ $('impModal').remove(); render();
      alert('✓ נוספו '+res.added+' פריטים חדשים · '+res.merged+' פריטים קיימים עודכנו וצברו כמות'); }
  }
}

$('newAg').onclick = async ()=>{
  const customer=prompt('שם הלקוח:'); if(!customer) return;
  // הסכם/הזמנת-רכש חדשים לאותו לקוח → עדיף לצבור למלאי הקיים ולא לפתוח כפילות
  const exist=FW.findAgreementForCustomer(_all, customer);
  if(exist && confirm('ל-"'+exist.customer+'" כבר קיים הסכם עם '+(exist.items||[]).length+' פריטים.\n\n'
      +'אישור = הוספה למלאי הקיים (הפריטים יצטברו לאותם פריטים).\n'
      +'ביטול = פתיחת הסכם נפרד חדש.')){
    _sel=exist.agreementId; render(); _impOpen('stock'); return;
  }
  const kind=_askKind('framework');
  if(!kind) return;
  const agreementNo=(prompt('מספר הסכם (אפשר ריק):','')||'').trim();
  const poNumber=(prompt('מספר הזמנת רכש — PO (אפשר ריק):','')||'').trim();
  const b=FW.buildAgreement({ customer, kind, agreementNo, poNumber, createdAt:_nowIso(), createdBy:'מנהל' });
  if(!b.ok){ alert('נכשל: '+b.errors.join(', ')); return; }
  if(await save(b.agreement)){ _sel=b.agreement.agreementId; render(); }
};

// ⚠️ גלגלת-עכבר על input[type=number] בפוקוס משנה ערך בשקט תוך גלילה.
document.addEventListener('wheel', function(ev){
  var el = ev.target;
  if (el && el.tagName === 'INPUT' && el.type === 'number' && el === document.activeElement) el.blur();
}, { passive: true, capture: true });

load();
</script>
